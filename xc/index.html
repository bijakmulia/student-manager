.chip{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;background:#0E3A44;color:var(--cy);font-weight:800;font-size:13px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
a{display:inline-block;padding:13px 20px;border-radius:14px;font-weight:800;text-decoration:none}
.p{background:#25D366;color:#0B1017}.g{border:2px solid var(--line);color:var(--ink)}
