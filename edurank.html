/* ============ ARAHAN DI SEBALIK "?" ============
   Perenggan penerangan yang panjang menyesakkan skrin telefon. Ia disorok
   dan diganti dengan butang "?" kecil; tekan untuk membacanya.
   Automatik untuk seluruh app: perenggan kelabu (text-muted) yang kecil,
   panjang, tiada butang atau input di dalamnya, dan bukan teks dinamik
   (tiada id). Maklumat lain boleh ditanda terus dengan data-hint="Tajuk".
   data-nohint mengecualikan (contoh: sinopsis cerita).                  */
const hintsInline = () => !!(S && S.config && S.config.hintsInline === 1);
const HINT_SKIP = '[data-nohint],#tgWrap,#tgCut,#tgHelp,#dlgBox,.hint-pop';
function hintCandidate(el){
  if (el.__hintDone || el.nodeType !== 1) return false;
  if (el.hasAttribute('data-hint')) return !el.closest(HINT_SKIP);
  if (el.id) return false;
  const c = el.className;
  if (typeof c !== 'string' || c.indexOf('text-muted') < 0 || !/text-\[(9|10|11|12)px\]/.test(c)) return false;
  if (el.closest(HINT_SKIP)) return false;
  /* teks di dalam butang atau baris satu-garis ialah maklumat baris, bukan arahan */
  if (el.closest('button,[data-sb],[data-act]') || /\btruncate\b/.test(c)) return false;
  if (el.querySelector('button,input,select,textarea,canvas,img,[id]')) return false;
  return el.textContent.trim().length >= 60;
}
function hintScan(root){
  if (!root || root.nodeType !== 1 || hintsInline()) return;
  const list = [];
  if ((root.matches('div,p')) && hintCandidate(root)) list.push(root);
  root.querySelectorAll('[data-hint], div.text-muted, p.text-muted').forEach(el => { if (hintCandidate(el)) list.push(el); });
  if (!list.length) return;
  const inList = new Set(list), used = new Set();
  list.forEach(el => {
    if (used.has(el)) return;
    for (let p = el.parentElement; p; p = p.parentElement) if (inList.has(p)) return;   // sudah dalam kumpulan induk
    /* perenggan bersebelahan digabung dalam satu "?" */
    const grp = [el]; used.add(el);
    for (let n = el.nextElementSibling; n && inList.has(n) && !used.has(n); n = n.nextElementSibling){ grp.push(n); used.add(n); }
    hintCollapse(grp);
  });
}
function hintCollapse(grp){
  grp.forEach(e => { e.__hintDone = true; e.classList.add('hint-hid'); });
  const title = grp.map(e => e.getAttribute('data-hint')).find(Boolean) || '';
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'hint-q';
  btn.innerHTML = '<span class="hq">?</span>' + (title ? '<span>' + esc(title) + '</span>' : '');
  btn.setAttribute('aria-label', title || 'Maklumat');
  btn.__hint = grp; btn.__title = title || 'Maklumat';
  /* Ada label tajuk betul-betul di atas? Letak "?" di sebelahnya. */
  const prev = grp[0].previousElementSibling;
  if (!title && prev && prev.classList.contains('lbl')){
    const old = prev.querySelector('.hint-q');
    if (old && !(old.__hint || []).some(x => x.isConnected)) old.remove();
    if (!prev.querySelector('.hint-q')){ prev.appendChild(btn); return; }
  }
  const row = document.createElement('div'); row.className = 'hint-row';
  row.appendChild(btn);
  grp[0].parentNode.insertBefore(row, grp[0]);
}
function hintUndo(){
  $$('.hint-q').forEach(b => { const r = b.parentElement; b.remove(); if (r && r.classList.contains('hint-row')) r.remove(); });
  $$('.hint-hid').forEach(e => { e.classList.remove('hint-hid'); e.__hintDone = false; });
}
function hintInit(){
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.hint-q'); if (!b || !b.__hint) return;
    e.preventDefault(); e.stopPropagation();       // jangan cetuskan baris/butang di bawahnya
    const html = b.__hint.map(x => '<div class="mb-2">' + x.innerHTML + '</div>').join('');
    openModal({ center:true, icon:'fa-circle-question', title:b.__title,
      body:'<div class="hint-pop text-[13px] leading-relaxed" data-nohint="1">' + html + '</div>',
      footer:'<button class="btn btn-o clip-s flex-1" data-close="1">Faham</button>' });
  }, true);
  let q = [], sched = false;
  const flush = () => { sched = false; const nodes = q; q = []; nodes.forEach(n => { if (n.isConnected) hintScan(n); }); };
  new MutationObserver(ms => {
    ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) q.push(n); }));
    if (q.length && !sched){ sched = true; requestAnimationFrame(flush); }
  }).observe(document.body, { childList:true, subtree:true });
  hintScan(document.body);
}
/* ============ BANK SOALAN (digunakan oleh semua game) ============
   Keputusan kuiz TIDAK menyentuh TP atau rekod PBD — hanya statistik kuiz. */
const QUIZ_TIME = 15;                       // saat (rujukan dalam prompt AI)
/* Soalan dipilih secara RAWAK dan tidak berulang: soalan yang pernah keluar (bagi kelas & subjek ini,
   disimpan dalam S.qSeen) dilangkau sehingga semua soalan dalam bank habis ditanya, barulah kitaran
   baharu bermula. Soalan SK/SP pelajaran hari ini (bank.prefer, dari topicalBank) didahulukan. */
let QLAST = '', QCOUNT = 0;
function nextQ(bank){
  if (!bank || !bank.length) return null;
  const key = (S.ui.activeClassId || '') + '|' + (bank[0].subjectId || '');
  S.qSeen = S.qSeen || {};
  const seen = new Set(S.qSeen[key] || []);
  let pool = bank.filter(q => !seen.has(q.id));
  if (!pool.length){                                   // semua sudah ditanya: kitaran baharu
    bank.forEach(q => seen.delete(q.id));
    pool = bank.length > 1 ? bank.filter(q => q.id !== QLAST) : bank;
  }
  const pref = bank.prefer ? pool.filter(q => bank.prefer.has(q.id)) : [];
  const from = pref.length ? pref : pool;
  const q = from[Math.floor(Math.random() * from.length)];
  seen.add(q.id); QLAST = q.id;
  const live = new Set((S.quiz || []).map(x => x.id));
  S.qSeen[key] = [...seen].filter(id => live.has(id));
  if (++QCOUNT % 5 === 0) save();                      // simpan sekali-sekala, bukan setiap soalan
  return q;
}

/* Tampal balik: guna penghurai soalan yang SAMA dengan Mod Cerita, jadi
   satu format JSON sahaja untuk guru belajar, bukan dua.               */
function tqParse(raw, sj, bab){
  let t = String(raw || '').trim();
  t = t.replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Tiada JSON dijumpai dalam teks yang ditampal.');
  let o;
  try { o = JSON.parse(t.slice(a, b + 1)); }
  catch (e){ throw new Error('JSON tidak sah — ' + e.message); }
  const arr = Array.isArray(o) ? o : Array.isArray(o.soalan) ? o.soalan : null;
  if (!arr || !arr.length) throw new Error('Tiada senarai "soalan" dalam JSON itu.');
  const ch = String(bab || '').trim() || sTxt(o.tajuk, 60);
  const qs = sQuestions(arr, 't' + Date.now().toString(36), 60);
  if (!qs.length) throw new Error('Tiada soalan sah. Setiap soalan perlu "soalan", "pilihan" dan "betul".');
  return qs.map((q, i) => { const sp = skCode(q.sp); return { id:uid('q'), subjectId:sj, chapterId:ch,
    q:q.q, c:q.c, a:q.a, ejek:q.ejek, huraian:q.huraian, sp, sk: sp ? sp.split('.').slice(0, 2).join('.') : '' }; });
}

const sTxt = (v, max) => String(v === undefined || v === null ? '' : v).trim().slice(0, max || 200);
function sQuestions(arr, bi, cap){
  const out = [];
  (Array.isArray(arr) ? arr : []).slice(0, cap || 12).forEach((v, k) => {
    if (!v || typeof v !== 'object') return;
    const qt = sTxt(v.soalan !== undefined ? v.soalan : v.q, 300);
    const raw = Array.isArray(v.pilihan) ? v.pilihan : Array.isArray(v.c) ? v.c : [];
    const c = raw.slice(0, 4).map(x => sTxt(x, 140));
    while (c.length < 4) c.push('');
    const filled = c.filter(x => x !== '').length;
    if (!qt || filled < 2) return;
    let a = v.betul !== undefined ? v.betul : v.a;
    if (typeof a === 'string'){
      const s = a.trim();
      const li = 'ABCD'.indexOf(s.toUpperCase());
      a = li >= 0 && s.length === 1 ? li : c.findIndex(x => x.toLowerCase() === s.toLowerCase());
    }
    a = +a;
    if (!(a >= 0 && a < 4) || c[a] === '') a = 0;
    // ejekan: array selari dengan pilihan, atau objek berkunci A/B/C/D atau 0..3
    const ej = ['', '', '', ''];
    const src = v.ejek !== undefined ? v.ejek : v.taunt;
    if (Array.isArray(src)) src.slice(0, 4).forEach((t, j) => { ej[j] = sTxt(t, 600); });
    else if (src && typeof src === 'object'){
      Object.keys(src).forEach(kk => {
        const key = String(kk).trim().toUpperCase();
        const j = 'ABCD'.indexOf(key) >= 0 ? 'ABCD'.indexOf(key) : (+key >= 0 && +key < 4 ? +key : -1);
        if (j >= 0) ej[j] = sTxt(src[kk], 600);
      });
    } else if (typeof src === 'string'){
      const t = sTxt(src, 600);
      for (let j = 0; j < 4; j++) if (j !== a) ej[j] = t;
    }
    ej[a] = '';                                  // pilihan betul tiada ejekan
    const hur = sTxt(v.huraian !== undefined ? v.huraian : v.explain, 600);
    for (let j = 0; j < 4; j++){
      if (j === a || c[j] === '') continue;
      if (!ej[j]) ej[j] = hur || ('Jawapan betul ialah {a}.');
      if (ej[j].indexOf('{a}') < 0) ej[j] = 'Jawapannya {a}. ' + ej[j];
    }
    out.push({ id:'sq' + bi + '_' + k, q:qt, c, a, ejek:ej, sp: sTxt(v.sp, 24),
      huraian: hur ? (hur.indexOf('{a}') < 0 ? 'Jawapannya {a}. ' + hur : hur) : 'Jawapan betul ialah {a}.' });
  });
  return out;
}

  const d = new Date((dk || todayKey()) + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;                 // Isnin = 0
  d.setDate(d.getDate() - day);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

const BGM_DEF = {

async function bgmCacheDef(k, ab){

/* Titik gelung: buang senyap di awal dan hujung fail — MP3 hampir selalu
   membawa padding pengekod beberapa puluh milisaat yang menjadi "ketukan
   kosong" setiap kali lagu berpusing. Dihadkan 0.25 s supaya rehat muzik
   yang memang disengajakan tidak terpotong. */
function loopPoints(buf){
  const sr = buf.sampleRate, n = buf.length, ch = [];
  for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c));
  const loud = i => ch.some(d => Math.abs(d[i]) > 0.0015);
  const cap = Math.min(Math.floor(sr * 0.25), Math.floor(n / 4));
  let s = 0; while (s < cap && !loud(s)) s++;
  let e = n - 1; while ((n - 1 - e) < cap && !loud(e)) e--;
  if (s >= cap) s = 0;
  if ((n - 1 - e) >= cap) e = n - 1;
  return { ls: s / sr, le: (e + 1) / sr };
}
const AUD_BUF = {};
const audKey = src => src.length + ':' + src.slice(-48);
const AUD_RAW = {};
function audBuf(src){
  if (!src) return Promise.resolve(null);
  const k = audKey(src);
  if (AUD_BUF[k]) return AUD_BUF[k];
  const a = audCtx(); if (!a) return Promise.resolve(null);
  AUD_BUF[k] = fetch(src).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
    .then(ab => { if (/^https?:/.test(src)) AUD_RAW[k] = ab.slice(0); return ab; })

       ditangkap, fail rosak menjadi ralat halaman walaupun panggilan balik
       ralat sudah dipasang. */
    .then(ab => new Promise((res, rej) => { const p = a.decodeAudioData(ab, res, rej); if (p && p.catch) p.catch(rej); }))
    .then(buf => Object.assign({ buf }, loopPoints(buf)))

async function bgmSwitch(src){

    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 0.7);

  if (!src) return;
  const d = await audBuf(src);

       internet: mainkan melalui pemain audio biasa. Masih bergelung, cuma

  const step = () => {
    const p = Math.min(1, (performance.now() - t0) / ms);
    try { el.volume = Math.max(0, Math.min(1, from + (to - from) * p)); } catch(e){}
    if (p < 1) requestAnimationFrame(step); else if (stopAfter){ el.pause(); el.removeAttribute('src'); }
  };
  requestAnimationFrame(step);
}
function bgmApplyVol(){
  if (BGM.el) try { BGM.el.volume = bgmVol(); } catch(e){}
  const a = SFX_CTX; if (!a || !BGM.gain) return;
  const t = a.currentTime;
  BGM.gain.gain.cancelScheduledValues(t);
  BGM.gain.gain.setTargetAtTime(bgmVol(), t, 0.05);
}
/* Identiti lagu, bukan sumbernya. Lagu lalai yang baru disimpan dalam
   peranti bertukar sumber (URL Suno \u2192 salinan tempatan) tetapi ia masih
   lagu yang SAMA; kalau dibanding ikut sumber, lagu itu akan bermula semula
   dari awal sejurus selepas disimpan. */
const bgmId = k => { if (!k) return null; const o = bgmOwn(k); return o ? 'own:' + k + ':' + audKey(o) : AUD_HAVE.has('bgm_' + k) ? 'aset:' + k : 'def:' + k; };
function bgmTick(){
  if (!BGM.unlocked) return;
  /* pratonton hanya hidup selagi bahagian Muzik dalam Tetapan terbuka */
  if (BGM.preview && !document.querySelector('[data-bgm-sec]')) BGM.preview = null;
  const k = bgmTarget();
  const id = bgmId(k);
  if (id !== BGM.id){ BGM.id = id; bgmSwitch(k ? bgmSrc(k) : null); }
}
function bgmInit(){
  /* Pelayar hanya membenarkan bunyi selepas sentuhan pertama pengguna. */
  const unlock = () => {
    const a = audCtx(); if (!a) return;
    if (a.state === 'suspended' && !document.hidden) a.resume();
    if (!BGM.unlocked){ BGM.unlocked = true; bgmTick(); }
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
  /* Telefon dikunci atau app ditukar: muzik berhenti, sambung bila kembali. */
  document.addEventListener('visibilitychange', () => {
    const a = SFX_CTX;
    if (BGM.el){ if (document.hidden) BGM.el.pause(); else if (BGM.unlocked) BGM.el.play().catch(() => {}); }
    if (!a) return;
    if (document.hidden) a.suspend(); else if (BGM.unlocked) a.resume();
  });
  document.addEventListener('input', e => {
    if (!e.target || e.target.id !== 'bgmVol') return;
    S.config.bgmVol = +e.target.value;
    const t = $('#bgmVolT'); if (t) t.textContent = e.target.value + '%';
    bgmApplyVol();
  });
  document.addEventListener('change', e => { if (e.target && e.target.id === 'bgmVol') save(true); });
  setInterval(bgmTick, 400);
}

async function audioFromFile(file, maxMB){
  if (file.size > maxMB * 1048576)
    throw new Error('Fail terlalu besar (' + (file.size / 1048576).toFixed(1) + ' MB). Had ' + maxMB + ' MB — guna lagu gelung yang pendek.');
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const d = await audBuf(data);
  if (!d) throw new Error('Format audio ini tidak dapat dibaca. Cuba MP3, OGG atau WAV.');
  return { data, dur: d.buf.duration };
}
const audExt = f => ((f.name.split('.').pop() || 'mp3').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp3');

/* ============ DSKP, TAKWIM & RANCANGAN TAHUNAN ============
   DSKP KSSM disimpan sebagai fail berasingan (dskp/index.json + satu fail
   bagi setiap subjek-tingkatan) supaya app kekal ringan. Fail dimuat turun
   hanya untuk subjek yang guru pilih, kemudian disimpan dalam peranti.
   Takwim persekolahan → nombor minggu. Rancangan tahunan (RPT) menyusun
   SK/SP DSKP merentas minggu persekolahan secara automatik; guru boleh
   menukar mana-mana minggu. Setiap rekod PBD dikaitkan dengan topik
   minggu itu, jadi RPM dan Rumusan PBD boleh dikira mengikut tajuk.     */
const DSKP_BASES = ['./dskp/', 'https://bijakmulia.github.io/edurank/dskp/', 'https://bijakmulia.github.io/student-manager/dskp/', 'https://tembakmatiterus-web.github.io/student-manager/dskp/'];
const LS_DSKP_IDX = 'lt_dskp_idx_v1';
let DSKP_IDX = null;
const DSKP = {};                                  // id → buku DSKP yang sudah dimuat
const DSKP_WAIT = {};
async function dskpFetch(file){
  let err = null;
  for (const b of DSKP_BASES){
    try { const r = await fetch(b + file, { cache:'no-cache' }); if (r.ok) return await r.json(); err = new Error('HTTP ' + r.status); }
    catch(e){ err = e; }
  }
  throw err || new Error('Tiada sambungan');
}
async function dskpIndex(){
  if (DSKP_IDX) return DSKP_IDX;
  try { const c = localStorage.getItem(LS_DSKP_IDX); if (c) DSKP_IDX = JSON.parse(c); } catch(e){}
  const fresh = dskpFetch('index.json').then(x => { DSKP_IDX = x; try { localStorage.setItem(LS_DSKP_IDX, JSON.stringify(x)); } catch(e){} return x; });
  if (DSKP_IDX){ fresh.catch(() => {}); return DSKP_IDX; }
  return await fresh;
}
/* Muat satu buku DSKP (dari peranti dahulu, kemudian internet) */
function dskpLoad(id){
  if (!id) return Promise.resolve(null);
  if (DSKP[id]) return Promise.resolve(DSKP[id]);
  if (DSKP_WAIT[id]) return DSKP_WAIT[id];
  return DSKP_WAIT[id] = (async () => {
    let b = null, ver = '';
    try { ver = (await dskpIndex()).made || ''; } catch(e){}
    try { if (PHOTOS['dskp:' + id]) b = JSON.parse(PHOTOS['dskp:' + id]); } catch(e){}
    if (b && ver && b._v !== ver){                    // DSKP di laman lebih baharu: muat turun semula
      try { const nb = await dskpFetch(id + '.json'); b = null; PHOTOS['dskp:' + id] = ''; b = nb; b._fresh = true; } catch(e){}
    }
    if (!b || b._fresh){
      if (!b) b = await dskpFetch(id + '.json');
      delete b._fresh; b._v = ver;
      const s = JSON.stringify(b);
      PHOTOS['dskp:' + id] = s; try { await idbPut('dskp:' + id, s); } catch(e){}
    }
    dskpPrep(b);
    DSKP[id] = b; delete DSKP_WAIT[id];
    return b;
  })().catch(e => { delete DSKP_WAIT[id]; throw e; });
}
/* Senarai SK rata (mengikut urutan DSKP) dengan maklumat tajuk */
function dskpPrep(b){
  b.sk = [];
  b.u.forEach((u, ui) => u[2].forEach(k => b.sk.push({ i: b.sk.length, ui, tema: u[0], tajuk: u[1], sk: k[0], sp: k[1] })));
  return b;
}
const formName = f => /^\d+$/.test(f) ? 'Tingkatan ' + f : (f === '-' || f === 'T' ? 'Umum' : f);
const dskpLabel = (s, f) => s + ' · ' + formName(f);
const subjDskp = sj => { const x = subj(sj); return x && x.dskp ? x.dskp : ''; };
/* Buku DSKP subjek (segerak). Jika belum dimuat, mula memuat dan lukis semula bila siap. */
function subjBook(sj){
  const id = subjDskp(sj); if (!id) return null;
  if (DSKP[id]) return DSKP[id];
  dskpLoad(id).then(() => { if (S) renderTab(); }).catch(() => {});
  return null;
}
const skCode = t => { const m = String(t || '').match(/^\(?[A-Z]*\)?\s*([\d]+(?:\.\d+)*)/); return m ? m[1] : ''; };
const shortTxt = (t, n) => { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };

/* ---------- TAKWIM PERSEKOLAHAN ----------
   Kalendar Akademik 2026 (Surat Siaran KPM Bil. 3/2025). Kumpulan A
   (Kedah, Kelantan, Terengganu) minggu Ahad–Khamis; Kumpulan B Isnin–Jumaat. */
const TAKWIM_PRESET = {
  2026: {
    B: { terms:[['2026-01-12','2026-05-22'],['2026-06-08','2026-12-04']],
         cuti:[['Cuti Penggal 1','2026-03-21','2026-03-29'],['Cuti Pertengahan Tahun','2026-05-23','2026-06-07'],['Cuti Penggal 2','2026-08-29','2026-09-06'],['Cuti Akhir Tahun','2026-12-05','2026-12-31']] },
    A: { terms:[['2026-01-11','2026-05-21'],['2026-06-07','2026-12-03']],
         cuti:[['Cuti Penggal 1','2026-03-20','2026-03-28'],['Cuti Pertengahan Tahun','2026-05-22','2026-06-06'],['Cuti Penggal 2','2026-08-28','2026-09-05'],['Cuti Akhir Tahun','2026-12-04','2026-12-31']] }
  },
  /* Kalendar Akademik 2027 (Surat Siaran KPM Bil. 1/2026, 2 Okt 2026). Kedua-dua kumpulan dibuka 4 Jan. */
  2027: {
    B: { terms:[['2027-01-04','2027-05-21'],['2027-06-07','2027-12-03']],
         cuti:[['Cuti Penggal 1','2027-03-06','2027-03-14'],['Cuti Pertengahan Tahun','2027-05-22','2027-06-06'],['Cuti Penggal 2','2027-08-28','2027-09-05'],['Cuti Akhir Tahun','2027-12-04','2027-12-31']] },
    A: { terms:[['2027-01-04','2027-05-20'],['2027-06-06','2027-12-02']],
         cuti:[['Cuti Penggal 1','2027-03-05','2027-03-13'],['Cuti Pertengahan Tahun','2027-05-21','2027-06-05'],['Cuti Penggal 2','2027-08-27','2027-09-04'],['Cuti Akhir Tahun','2027-12-03','2027-12-31']] }
  }
};
const TK_GRP = { A:'Kumpulan A — Kedah, Kelantan, Terengganu (Ahad–Khamis)', B:'Kumpulan B — negeri lain (Isnin–Jumaat)' };
function takwim(){
  const yr = new Date().getFullYear();
  const latest = Math.max.apply(null, Object.keys(TAKWIM_PRESET).map(Number));
  if (!S.takwim || !S.takwim.terms){
    const y = TAKWIM_PRESET[yr] ? yr : latest, p = TAKWIM_PRESET[y].B;
    S.takwim = { year: y, grp:'B', terms: p.terms.map(x => x.slice()), cuti: p.cuti.map(x => x.slice()) };
  }
  // tahun baharu bermula: tukar sendiri ke takwim tahun semasa (kumpulan A/B dikekalkan)
  if (S.takwim.year < yr && TAKWIM_PRESET[yr] && !S.takwim.manualYear) takwimPreset(yr, S.takwim.grp || 'B');
  return S.takwim;
}
function takwimPreset(year, grp){
  const p = (TAKWIM_PRESET[year] || {})[grp]; if (!p) return false;
  S.takwim = { year, grp, terms: p.terms.map(x => x.slice()), cuti: p.cuti.map(x => x.slice()) };
  return true;
}
const kd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addDays = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return kd(d); };
let WEEKS_MEMO = { key:'', weeks:[] };
/* Minggu persekolahan: setiap minggu bermula pada hari pertama sekolah
   (Isnin / Ahad), minggu yang kelima-lima hari sekolahnya cuti dilangkau. */
function schoolWeeks(){
  const tk = takwim(), key = JSON.stringify(tk);
  if (WEEKS_MEMO.key === key) return WEEKS_MEMO.weeks;
  const first = tk.grp === 'A' ? 0 : 1;              // Ahad / Isnin
  const inCuti = k => tk.cuti.some(c => k >= c[1] && k <= c[2]);
  const out = [];
  tk.terms.forEach((t, ti) => {
    let d = new Date(t[0] + 'T00:00:00');
    d.setDate(d.getDate() - ((d.getDay() - first + 7) % 7));   // undur ke awal minggu
    for (let k = kd(d); k <= t[1]; k = addDays(k, 7)){
      const days = [0,1,2,3,4].map(i => addDays(k, i)).filter(x => x >= t[0] && x <= t[1] && !inCuti(x));
      if (days.length) out.push({ n: out.length + 1, start: days[0], end: days[days.length - 1], wk: k, term: ti + 1 });
    }
  });
  WEEKS_MEMO = { key, weeks: out };
  return out;
}
/* Minggu bagi satu tarikh: { n, start, end } · atau { cuti: nama } · atau null */
function weekOf(k){
  const ws = schoolWeeks(), tk = takwim();
  const c = tk.cuti.find(x => k >= x[1] && k <= x[2]);
  if (c) return { cuti: c[0], start: c[1], end: c[2] };
  for (const w of ws) if (k >= w.wk && k <= addDays(w.wk, 6)) return w;
  if (ws.length && k < ws[0].start) return { before: true };
  return null;
}
const fmtShort = k => { const [y, m, d] = k.split('-'); return +d + ' ' + ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'][+m - 1]; };

/* ---------- RANCANGAN TAHUNAN (RPT) ----------
   Auto: SK diagih mengikut urutan DSKP, berat = bilangan SP, merentas semua
   minggu persekolahan. Satu SK boleh merentas beberapa minggu dan satu
   minggu boleh mengandungi beberapa SK. Guru boleh menukar mana-mana minggu. */
/* Tukaran minggu disimpan berasingan bagi setiap tahun takwim (minggu 5 tahun 2026 ≠ minggu 5 tahun 2027) */
const rptOf = sj => {
  S.rpt = S.rpt || {};
  const r = S.rpt[sj] = S.rpt[sj] || {}, y = takwim().year;
  r.oy = r.oy || {};
  if (r.over && !r.oy[2026]) r.oy[2026] = r.over;             // data lama (sebelum tukaran ikut tahun)
  delete r.over;
  r.oy[y] = r.oy[y] || {};
  return { over: r.oy[y] };
};
let PLAN_MEMO = {};
function autoPlan(b, W){
  const plan = Array.from({ length: W + 1 }, () => []);
  const wts = b.sk.map(k => Math.max(1, k.sp.length)), tot = wts.reduce((a, x) => a + x, 0);
  let cum = 0;
  b.sk.forEach((k, i) => {
    const a = Math.floor(cum / tot * W) + 1, z = Math.max(a, Math.ceil((cum + wts[i]) / tot * W));
    for (let w = a; w <= Math.min(z, W); w++) plan[w].push(i);
    cum += wts[i];
  });
  return plan;
}
function planOf(sj){
  const b = subjBook(sj); if (!b) return null;
  const ws = schoolWeeks(), over = rptOf(sj).over;
  const key = sj + '|' + ws.length + '|' + JSON.stringify(over) + '|' + b.sk.length;
  if (PLAN_MEMO[sj] && PLAN_MEMO[sj].key === key) return PLAN_MEMO[sj].plan;
  const plan = autoPlan(b, ws.length);
  Object.keys(over).forEach(w => { if (plan[+w]) plan[+w] = over[w].filter(i => b.sk[i]); });
  PLAN_MEMO[sj] = { key, plan };
  return plan;
}
/* Topik pelajaran kelas pada satu tarikh: tukaran guru untuk hari itu, atau ikut RPT */
const lessonKey = (cid, sj, date) => cid + '|' + sj + '|' + date;
function lessonTopic(cid, sj, date){
  const b = subjBook(sj); if (!b) return null;
  const w = weekOf(date), own = (S.lesson || {})[lessonKey(cid, sj, date)];
  const idx = own ? own : (w && w.n ? (planOf(sj) || [])[w.n] || [] : []);
  const sks = idx.map(i => b.sk[i]).filter(Boolean);
  if (!sks.length) return { w, sks:[], own: !!own };
  return { w, sks, own: !!own, units: Array.from(new Set(sks.map(k => k.ui))) };
}
/* Topik sesuatu rekod: snapshot semasa disimpan, jika tiada kira semula dari RPT */
function recTopic(sid, sj, date){
  const r = ((S.records[sid] || {})[sj] || {})[date];
  if (r && r.topic) return r.topic;
  const s = stu(sid); if (!s) return null;
  const t = lessonTopic(s.classId, sj, date);
  return t && t.sks.length ? topicSnap(t) : null;
}
const topicSnap = t => ({ w: t.w && t.w.n || 0, s: t.sks.map(k => k.i), u: t.units, t: t.sks.map(k => skCode(k.sk) || shortTxt(k.sk, 30)).join(', '), tj: t.sks[0].tajuk });
/* dipanggil oleh commitEval / commitForceTP / markAttendance */
function stampTopic(rec, cid, sj, date){
  const t = lessonTopic(cid, sj, date);
  if (t && t.sks.length) rec.topic = topicSnap(t); else if (rec.topic && !subjDskp(sj)) delete rec.topic;
}

/* ---------- TP mengikut tajuk DSKP (RPM automatik) ---------- */
function unitTP(sid, sj, ui){
  const days = ((S.records[sid] || {})[sj]) || {}, tps = [];
  Object.keys(days).forEach(d => { const t = recTopic(sid, sj, d); if (t && (t.u || []).indexOf(ui) >= 0) tps.push(days[d].tpAwarded || calcTP(rateOf(days[d]))); });
  return tps.length ? clamp(Math.round(tps.reduce((a, x) => a + x, 0) / tps.length), 1, 6) : 0;
}
/* Tajuk yang sudah ada penilaian bagi kelas aktif (urutan DSKP) */
function taughtUnits(cid, sj){
  const set = new Set();
  studentsOf(cid).forEach(s => Object.keys(((S.records[s.id] || {})[sj]) || {}).forEach(d => { const t = recTopic(s.id, sj, d); (t && t.u || []).forEach(u => set.add(u)); }));
  return Array.from(set).sort((a, b) => a - b);
}

/* ---------- RUMUSAN PBD (muat turun) ----------

function pbdSummary(){
  const cid = S.ui.activeClassId, sj = S.ui.activeSubjectId, b = subjBook(sj);
  const list = studentsOf(cid), now = new Date(), wk = weekOf(todayKey());
  const units = b ? taughtUnits(cid, sj) : [];
  const attDs = attDates(list);
  const rows = list.map(s => {
    const st = stats(s.id, sj), ses = sessionsOf(s.id, sj), a = attSummary(s.id, attDs);
    return { s, st, last: ses.length ? ses[0].date : '', att: a, units: units.map(u => unitTP(s.id, sj, u)) };
  });
  const dates = Array.from(new Set([].concat.apply([], list.map(s => Object.keys(((S.records[s.id] || {})[sj]) || {}))))).sort();
  const log = dates.map(d => {

    const t = list.map(s => recTopic(s.id, sj, d)).find(Boolean);

/* ============ REFLEKSI PdP HARIAN (gaya RPH) ============
   Dijana automatik untuk satu kelas + subjek + tarikh daripada data sebenar:
   topik DSKP, kehadiran, TP setiap murid (penguasaan), lencana sikap yang
   diterima hari itu, dan perbandingan dengan sesi sebelumnya. Guru boleh
   menambah catatan sendiri; catatan disimpan bersama tarikh itu.         */
const reflKey = (cid, sj, date) => cid + '|' + sj + '|' + date;
const namesList = arr => arr.length <= 2 ? arr.join(' dan ') : arr.slice(0, -1).join(', ') + ' dan ' + arr[arr.length - 1];
function reflectData(cid, sj, date){
  const list = studentsOf(cid);
  const tpOf = r => r ? (r.tpAwarded || calcTP(rateOf(r))) : 0;
  const recs = list.map(s => { const r = ((S.records[s.id] || {})[sj] || {})[date]; return { s, r, tp: tpOf(r) }; });
  const done = recs.filter(x => x.r);
  const att = {};
  list.forEach(s => { const r = ((S.records[s.id] || {})[sj] || {})[date]; att[s.id] = attGet(s.id, date) || (r && r.attended ? 'H' : ''); });
  const ac = { H:[], L:[], T:[], C:[] };
  list.forEach(s => { if (att[s.id]) ac[att[s.id]].push(s); });
  const attKnown = list.filter(s => att[s.id]).length;
  const logs = (S.badgeLog || []).filter(l => l.d === date && list.some(s => s.id === l.sid));
  const bb = {};
  logs.forEach(l => { const b = S.badges.find(x => x.id === l.b); if (!b) return; (bb[b.id] = bb[b.id] || { b, kind: badgeKind(b), sids: [] }); if (bb[b.id].sids.indexOf(l.sid) < 0) bb[b.id].sids.push(l.sid); });
  const from = addDays(date, -30);
  const negCount = sid => (S.badgeLog || []).filter(l => l.sid === sid && l.d > from && l.d <= date && badgeKind(S.badges.find(x => x.id === l.b)) === 'neg').length;
  const allDates = Array.from(new Set([].concat.apply([], list.map(s => Object.keys(((S.records[s.id] || {})[sj]) || {}))))).sort();
  const pd = allDates.filter(d => d < date).pop();
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const prevTPs = pd ? list.map(s => tpOf(((S.records[s.id] || {})[sj] || {})[pd])).filter(Boolean) : [];
  const t = subjDskp(sj) ? lessonTopic(cid, sj, date) : null;
  const sks = t && t.sks.length ? t.sks : null;
  let next = null;
  if (sks && t.w && t.w.n){
    const plan = planOf(sj) || [], b = subjBook(sj), now = new Set(sks.map(k => k.i));
    for (let w = t.w.n + 1; w < plan.length && !next; w++){ const n = (plan[w] || []).filter(i => !now.has(i)); if (n.length) next = { w, sk: b.sk[n[0]] }; }
  }
  return { cid, sj, date, list, recs, done, ac, attKnown, bb: Object.values(bb), negCount, pd, prevAvg: avg(prevTPs), avg: avg(done.map(x => x.tp)), t, sks, next };
}
/* Teks refleksi: senarai bahagian { h, lines } — sama untuk paparan, salin & cetak */
function reflectSections(D){
  const N = D.list.length, nd = D.done.length, nm = x => x.s.name;
  const secs = [];
  const dt = new Date(D.date + 'T00:00:00'), w = weekOf(D.date);
  const info = [DAY_NAMES[dt.getDay()] + ', ' + fmtDate(D.date) + (w && w.n ? ' · Minggu ' + w.n : w && w.cuti ? ' · ' + w.cuti : ''),
    clsName(D.cid) + ' · ' + subjName(D.sj)];
  if (D.sks){
    info.push('Tema: ' + (D.sks[0].tema || '-'));
    info.push('Tajuk: ' + (D.sks[0].tajuk || '-'));
    D.sks.forEach(k => { info.push('SK ' + k.sk); k.sp.forEach(p => info.push('   SP ' + p)); });
  }
  secs.push({ h: 'MAKLUMAT PdP', lines: info });

  // 1. Kehadiran
  const A = D.ac, hadir = A.H.length + A.L.length, att = [];
  if (D.attKnown){
    att.push(hadir + '/' + N + ' murid hadir (' + Math.round(hadir / N * 100) + '%).');
    if (A.L.length) att.push('Lewat: ' + namesList(A.L.map(s => s.name)) + '.');
    if (A.T.length) att.push('Tidak hadir: ' + namesList(A.T.map(s => s.name + (attNoteOf(s.id, D.date) ? ' (' + attNoteOf(s.id, D.date) + ')' : ''))) + '.');
    if (A.C.length) att.push('Cuti/MC: ' + namesList(A.C.map(s => s.name + (attNoteOf(s.id, D.date) ? ' (' + attNoteOf(s.id, D.date) + ')' : ''))) + '.');
    if (!A.T.length && !A.C.length) att.push('Kehadiran penuh — semua murid mengikuti PdP.');
  } else att.push('Kehadiran belum direkod untuk tarikh ini (tab HADIR).');
  secs.push({ h: '1. KEHADIRAN', lines: att });

  // 2. Pencapaian objektif & penguasaan
  const ach = [];
  if (nd){
    const ok = D.done.filter(x => x.tp >= 3), pct = Math.round(ok.length / nd * 100);
    const dist = [1,2,3,4,5,6].map(k => 'TP' + k + ': ' + D.done.filter(x => x.tp === k).length).join(' · ');
    const status = pct >= 80 ? 'Objektif pembelajaran TERCAPAI' : pct >= 50 ? 'Objektif pembelajaran SEBAHAGIAN tercapai' : 'Objektif pembelajaran BELUM tercapai';
    ach.push(status + ': ' + ok.length + '/' + nd + ' murid (' + pct + '%) mencapai sekurang-kurangnya TP3' + (nd < N ? ' (' + (N - nd) + ' murid tidak dinilai)' : '') + '.');
    ach.push('Taburan penguasaan — ' + dist + '. Purata TP kelas ' + D.avg.toFixed(1) +
      (D.prevAvg ? (D.avg > D.prevAvg + 0.2 ? ', meningkat berbanding sesi lepas (' + D.prevAvg.toFixed(1) + ' pada ' + fmtDate(D.pd) + ')' :
                    D.avg < D.prevAvg - 0.2 ? ', menurun berbanding sesi lepas (' + D.prevAvg.toFixed(1) + ' pada ' + fmtDate(D.pd) + ')' :
                    ', setara dengan sesi lepas (' + D.prevAvg.toFixed(1) + ')') : '') + '.');
    const top = D.done.filter(x => x.tp >= 5), low = D.done.filter(x => x.tp <= 2);
    if (top.length) ach.push('Menguasai dengan cemerlang (TP5–TP6): ' + namesList(top.map(nm)) + '.');
    if (low.length) ach.push('Belum menguasai (TP1–TP2): ' + namesList(low.map(nm)) + '.');
  } else ach.push('Tiada penilaian PBD direkod untuk tarikh ini.');
  secs.push({ h: '2. PENCAPAIAN OBJEKTIF & PENGUASAAN', lines: ach });

  // 3. Sikap & disiplin (berdasarkan lencana)
  const sk = [], pos = D.bb.filter(x => x.kind === 'pos'), neg = D.bb.filter(x => x.kind === 'neg'), oth = D.bb.filter(x => !x.kind);
  const who = x => namesList(x.sids.map(id => (stu(id) || {}).name).filter(Boolean));
  pos.forEach(x => sk.push('👍 ' + x.b.name + ': ' + who(x) + '.'));
  oth.forEach(x => sk.push('• ' + x.b.name + ': ' + who(x) + '.'));
  neg.forEach(x => sk.push('⚠️ ' + x.b.name + ': ' + who(x) + '.'));
  const rep = [];
  neg.forEach(x => x.sids.forEach(id => { const n = D.negCount(id); if (n >= 3 && rep.indexOf(id) < 0) rep.push(id); }));

function liveHost(g, root, opts){

  const flush = () => {

      try {

        pc.ontrack = e => { vidEl.srcObject = e.streams[0]; vidEl.style.display = 'block'; vidEl.play().catch(() => {}); };
        await pc.setRemoteDescription({ type: 'offer', sdp: o.sdp });
        await pc.setLocalDescription(await pc.createAnswer());
        await lvGather(pc);
        T.set('a_' + vid, { sid, sdp: pc.localDescription.sdp });
      } catch(e){ console.warn('live rtc', e); }
    }));
    // tiada video dalam 8 saat (rangkaian menyekat sambungan terus) → gambar melalui awan
    fb = setTimeout(() => { if (!closed && vidEl.readyState < 2){ vidEl.style.display = 'none'; want({ jpg: 1 }); } }, 8000);
  }
  V.meta(v);
  want({ rtc: v.fit ? 1 : 0 });
  toast('📺 Tayangan langsung dari peranti lain');
}

    } else if (def.views && def.views[view]){

    }
    el.innerHTML = '<div class="lb-card">' + h + '</div>';
  }
  const setProg = v => {
    prog = Math.max(prog, v);
    if (view === 'main'){ const b = el.querySelector('#lbLoad .bar i'), s = el.querySelector('#lbLoad span'); if (b){ b.style.width = Math.round(prog * 100) + '%'; s.textContent = 'Memuatkan… ' + Math.round(prog * 100) + '%'; } }
  };
  const close = () => { if (!el.isConnected) return; el.remove(); unlockBody(); if (LOBBY && LOBBY.el === el) LOBBY = null; };
  LOBBY = { el, close, k, repaint: () => { if (el.isConnected) paint(); } };
  const ctx = { paint: () => paint(), close: () => close(), setView: v => { view = v; paint(); } };
  el.addEventListener('click', e => {
    if (e.target.closest('[data-act]')) return;                    // butang app (pack, album, panduan) dikendali oleh app
    const b = e.target.closest('[data-lb],[data-lt],[data-ls],[data-lc]'); if (!b) return;
    sfx('flip');
    if (b.dataset.lt){ o.team = b.dataset.lt; save(); view = 'main'; paint(); if (S.ui.tab === 'arena') renderTab(); return; }
    if (b.dataset.ls){ const cfg = def.cfg(); cfg[b.dataset.ls] = b.dataset.ln === '1' ? +b.dataset.lv : b.dataset.lv; save(); paint(); return; }
    if (b.dataset.lc){ const key = b.dataset.lc === 'cast' ? LV_ON_CAST : LV_ON_VIEW; localStorage.setItem(key, localStorage.getItem(key) === '0' ? '1' : '0'); paint(); return; }
    const a = b.dataset.lb;
    if (a === 'back'){ view = 'main'; return paint(); }
    if (def.views && def.views[a]){ view = a; return paint(); }
    if (def.act && def.act(a, b, ctx)) return;
    if (a === 'team' || a === 'set' || a === 'how'){ view = a; return paint(); }
    if (a === 'assets'){ close(); storProbe().then(storAssetsModal); return; }
    if (a === 'exit') return close();
    if (a.indexOf('go') === 0 && ready){
      if (!teamOf(o.team)) return toast('Pilih kumpulan dahulu.', null, true);
      const fn = def.starts[+a.slice(2)][1];
      close(); fn();                                   // dipanggil terus dalam sentuhan: AudioContext dibenarkan
    }
  });
  paint();
  audPreload({ cards:'duel', run:'run', escape:'esc', stor:'stor' }[k]);
  if (def.preload){
    const t0 = Date.now();
    def.preload(setProg).catch(err => { console.warn('pramuat', err); })
      .then(() => new Promise(r => setTimeout(r, Math.max(0, 600 - (Date.now() - t0)))))   // paparan "Memuatkan" sekurang-kurangnya sekejap
      .then(() => { if (!el.isConnected) return; ready = true; prog = 1; if (view === 'main') paint(); });
  }
}

function cardStats(c, lv){
  const m = 1 + 0.1 * ((lv || 1) - 1);
  return { atk: Math.round(c.atk * m), hp: Math.round(c.hp * m), def: Math.round(c.def * m) };
}
function collectionStats(sid){
  const own = (S.collect || {})[sid] || {};
  const have = CARDS.filter(c => own[c.id]);
  const byTier = {};
  CARD_TIERS.forEach(t => byTier[t.k] = { have: 0, total: cardsOfTier(t.k).length });
  have.forEach(c => byTier[c.tier].have++);
  return { have: have.length, total: CARDS.length, byTier };
}

function motifSvg(m, col){
  const o = 'opacity="0.18" fill="none" stroke="' + col + '" stroke-width="2"';
  if (m === 'leaf') return '<g ' + o + '>' + [[30,40],[160,70],[60,190],[170,200],[100,120]].map(([x,y]) => '<path d="M' + x + ' ' + y + ' q20 -30 40 0 q-20 30 -40 0z"/>').join('') + '</g>';
  if (m === 'flame') return '<g ' + o + '>' + [20,70,120,170].map(x => '<path d="M' + x + ' 260 q15 -40 0 -70 q25 25 22 70z"/>').join('') + '</g>';
  if (m === 'songket') { let s = ''; for (let y = 0; y < 270; y += 36) for (let x = (y / 36) % 2 ? 18 : 0; x < 200; x += 36) s += '<path d="M' + x + ' ' + (y + 18) + ' l18 -18 l18 18 l-18 18z"/>'; return '<g ' + o + '>' + s + '</g>'; }
  if (m === 'hex') { let s = ''; for (let y = 0; y < 280; y += 34) for (let x = (y / 34) % 2 ? 20 : 0; x < 210; x += 40) s += '<path d="M' + x + ' ' + y + ' l12 -8 l12 8 v14 l-12 8 l-12 -8z"/>'; return '<g ' + o + '>' + s + '</g>'; }
  if (m === 'stars') { let s = ''; for (let k = 0; k < 34; k++){ const x = (k * 53) % 200, y = (k * 97) % 270, r = 0.6 + (k % 4) * 0.5; s += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff" opacity="' + (0.25 + (k % 3) * 0.2) + '"/>'; } return s; }
  if (m === 'grid') { let s = ''; for (let x = 0; x <= 200; x += 20) s += '<path d="M' + x + ' 0 V270"/>'; for (let y = 0; y <= 270; y += 20) s += '<path d="M0 ' + y + ' H200"/>'; return '<g opacity="0.12" stroke="' + col + '" stroke-width="1">' + s + '</g>'; }
  if (m === 'wave') return '<g ' + o + '>' + [60,110,160,210,250].map(y => '<path d="M-10 ' + y + ' q25 -14 50 0 t50 0 t50 0 t50 0 t50 0"/>').join('') + '</g>';
  if (m === 'batik') return '<g ' + o + '>' + [[40,50],[150,40],[100,140],[30,220],[170,210]].map(([x,y]) => '<circle cx="' + x + '" cy="' + y + '" r="22"/><circle cx="' + x + '" cy="' + y + '" r="10"/>').join('') + '</g>';
  return '';
}

/* ---------- Cabutan pack ---------- */
function pickWeighted(tbl){
  let tot = 0; Object.keys(tbl).forEach(k => tot += tbl[k]);
  let r = Math.random() * tot;
  for (const k of Object.keys(tbl)){ r -= tbl[k]; if (r <= 0) return k; }
  return Object.keys(tbl)[0];
}
const drawCard = tierK => { const l = cardsOfTier(tierK); return l[Math.floor(Math.random() * l.length)]; };
function openPackRoll(pack, sid){
  S.pity = S.pity || {};
  let pity = S.pity[sid] || 0;
  const tiers = [];
  for (let i = 0; i < pack.base; i++) tiers.push(pickWeighted(BASE_ODDS));
  for (let i = 0; i < pack.rare; i++) tiers.push(pickWeighted(RARE_ODDS));
  for (let i = 0; i < pack.lucky; i++) tiers.push(pickWeighted(pack.luck));
  if (pack.grant && !tiers.some(t => tierRank(t) >= tierRank(pack.grant))) tiers[tiers.length - 1] = pack.grant;
  pity++;                                        // 25 pack tanpa Legenda+ → jamin Legenda
  if (pity > PITY_MAX && !tiers.some(t => tierRank(t) >= tierRank('legenda'))) tiers[tiers.length - 1] = 'legenda';
  if (tiers.some(t => tierRank(t) >= tierRank('legenda'))) pity = 0;
  S.pity[sid] = pity;
  for (let i = tiers.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const tmp = tiers[i]; tiers[i] = tiers[j]; tiers[j] = tmp; }
  return tiers.map(t => ({ tier: t, card: drawCard(t) })).filter(x => x.card);
}
/* Simpan kad; set lengkap kali pertama = +20 RP */
function grantCards(sid, pulls){
  S.collect = S.collect || {};
  S.collect[sid] = S.collect[sid] || {};
  const before = CARD_SETS.filter(s => { const p = setProgress(sid, s.k); return p.have === p.total; }).map(s => s.k);
  const res = pulls.map(p => {
    const had = S.collect[sid][p.card.id] || 0;
    S.collect[sid][p.card.id] = had + 1;
    return { card: p.card, tier: p.tier, isNew: had === 0, lvUp: had > 0 && had < 5 };
  });
  CARD_SETS.forEach(s => {
    const p = setProgress(sid, s.k);
    if (p.have === p.total && before.indexOf(s.k) < 0){
      S.arena.rp = S.arena.rp || {}; S.arena.rp[sid] = (S.arena.rp[sid] || 0) + 20;
      setTimeout(() => toast('SET LENGKAP: ' + s.name + '! +20 RP'), 600);
    }
  });
  return res;
}

/* ---------- DUEL KAD ----------
   3 kad terkuat pelajar lawan 3 kad Penjaga Ilmuria (kekuatan setara).
   Setiap pusingan satu soalan: betul = kad kamu menyerang (pantas = kritikal),
   salah / tamat masa = kad lawan menyerang. Elemen yang menang ×1.5.     */
const duelQ = () => clamp(+((S.config || {}).duelQ) || 15, 5, 90);      // masa menjawab (saat), dilaras guru
function duelDeck(sid){
  const own = (S.collect || {})[sid] || {};
  const power = c => { const x = cardStats(c, cardLevel(sid, c.id)); return x.atk * 2 + x.hp / 3 + x.def * 2; };
  return CARDS.filter(c => own[c.id]).sort((a, b) => power(b) - power(a)).slice(0, 3)
    .map(c => Object.assign({ c, lv: cardLevel(sid, c.id) }, cardStats(c, cardLevel(sid, c.id))));
}
function duelFoe(mine){
  const avg = mine.reduce((a, x) => a + tierRank(x.c.tier), 0) / mine.length;
  return mine.map(() => {
    const tr = clamp(Math.round(avg + (Math.random() - .5) * 1.2), 0, CARD_TIERS.length - 1);
    const c = drawCard(CARD_TIERS[tr].k), lv = clamp(Math.round(mine.reduce((a, x) => a + x.lv, 0) / mine.length), 1, 5);
    return Object.assign({ c, lv }, cardStats(c, lv));
  });
}
/* ---------- DUEL KAD: 2 PEMAIN, 1 PERANTI ----------
   REBUT  : skrin dibahagi dua, murid duduk bertentang (separuh atas diterbalikkan).
            Soalan sama untuk kedua-dua. Jawapan BETUL pertama = kad dia menyerang
            (pantas = kritikal). Jawapan salah = dikunci untuk soalan itu.
   BERGILIR: telefon diserah bergilir. Betul = kad sendiri menyerang,
            salah / masa tamat = kad lawan menyerang (seperti lawan komputer).
   Murid tanpa kad diberi 3 "kad latihan" (tier Sial) supaya semua boleh bermain. */
/* dek mod Klasik: n kad terkuat kumpulan, dicukupkan dengan kad latihan */
function klasikDeck(sid, n){
  const own = (S.collect || {})[sid] || {};
  const pow = c => { const x = cardStats(c, cardLevel(sid, c.id)); return x.atk * 2 + x.hp / 3 + x.def * 2; };
  const mine = CARDS.filter(c => own[c.id]).sort((a, b) => pow(b) - pow(a)).slice(0, n).map(c => Object.assign({ c, lv: cardLevel(sid, c.id) }, cardStats(c, cardLevel(sid, c.id))));
  const fill = cardsOfTier('sial').filter(c => !mine.some(m => m.c.id === c.id)).sort(() => Math.random() - .5).slice(0, n - mine.length).map(c => Object.assign({ c, lv: 1 }, cardStats(c, 1)));
  return { deck: mine.concat(fill), starter: fill.length > 0 };
}
function pvpDeck(sid){
  const d = duelDeck(sid);
  if (d.length) return { deck: d, starter: false };
  const pool = cardsOfTier('sial').slice().sort(() => Math.random() - .5).slice(0, 3);
  return { deck: pool.map(c => Object.assign({ c, lv: 1 }, cardStats(c, 1))), starter: true };
}

`;
function btStyle(){ if (!document.getElementById('btCss')){ const st = document.createElement('style'); st.id = 'btCss'; st.textContent = BT_CSS; document.head.appendChild(st); } }

/* tA = id kumpulan bawah (biru). tB = id kumpulan atas (merah), atau null = Penjaga Ilmuria (komputer). */
function battleRun(tA, tB, mode){
  btStyle();
  const ai = !tB, klasik = mode === 'klasik';
  const dA = klasik ? klasikDeck(tA, 4) : pvpDeck(tA), dB = ai ? { deck: duelFoe(dA.deck), starter: false } : klasik ? klasikDeck(tB, 4) : pvpDeck(tB);
  const P = [
    { id: tA, name: teamName(tA), deck: dA.deck, starter: dA.starter, i: 0, ko: [], right: 0, asked: 0, col: '#3B82F6' },
    { id: tB, name: ai ? 'Penjaga Ilmuria' : teamName(tB), deck: dB.deck, starter: dB.starter, i: 0, ko: [], right: 0, asked: 0, col: '#EF4444' }
  ];
  P.forEach(p => p.deck.forEach(x => x.cur = x.hp));
  const rebut = mode === 'rebut';
  let turn = 0, over = false, round = 0, raf = 0, cur = null;
  const energy = [0, 0], shield = [false, false];               // mod Klasik
  let swMode = false, switched = false, busy = klasik;
  const root = document.createElement('div');
  root.className = 'bt'; root.id = 'btRoot';
  root.innerHTML = (rebut ? '<div class="bt-q top" id="btQ1"></div>' : '') +
    '<div class="bt-board" id="btBoard">' +
      '<div class="bt-half t" id="btH1"></div><div class="bt-half b" id="btH0"></div>' +
      '<div class="bt-ring"></div><div class="bt-arena"><div class="bt-glow" id="btGlow"></div><div class="bt-rays" id="btRays"></div></div>' +
      '<div id="btS1"></div><div id="btS0"></div>' +
      '<div class="bt-score" id="btScore"></div>' +
      '<button class="bt-x" data-x="quit"><i class="fa-solid fa-xmark"></i></button>' +
      '<div class="bt-banner" id="btBanner"></div>' +
    '</div>' +
    '<div class="bt-q" id="btQ0"></div>';
  document.body.appendChild(root); lockBody();
  const live = liveHost('duel', root, { title: (klasik ? 'Duel Klasik' : 'Duel Kad') + (ai ? '' : ' · Kumpulan') });
  const $b = s => root.querySelector(s);
  const act = p => p.deck[Math.min(p.i, p.deck.length - 1)];
  const alive = p => p.deck.filter(x => x.cur > 0).length;
  const hpCol = x => x.cur / x.hp > .5 ? '#4ADE80' : x.cur / x.hp > .25 ? '#FACC15' : '#EF4444';
  const advOf = (ax, dx) => elemBeats(cardSet(ax.c).el, cardSet(dx.c).el) ? 1.5 : elemBeats(cardSet(dx.c).el, cardSet(ax.c).el) ? 0.75 : 1;
  const teamIco = p => p.id ? teamAvatar(p.id, 26) : '<div class="circ flex items-center justify-center" style="width:26px;height:26px;background:#111;border:2px solid #EF4444">🤖</div>';

  /* ---------- lukis satu pihak ---------- */
  function side(k){
    const p = P[k], x = act(p);
    const bench = p.deck.map((y, j) => { if (j === p.i || y.cur <= 0) return '';
      const pick = klasik && swMode && k === turn && !busy;
      return '<div class="bt-mini' + (pick ? ' pick' : '') + '" data-ck="' + k + '-' + j + '"' + (pick ? ' data-sw="' + k + ':' + j + '"' : '') + '>' + cardFaceHtml(y.c, y.c.tier) +
      '<div class="mhp"><i style="width:' + Math.max(0, y.cur / y.hp * 100) + '%;background:' + hpCol(y) + '"></i></div></div>'; }).join('');
    const kos = p.ko.length ? cardFaceHtml(p.ko[p.ko.length - 1].c, p.ko[p.ko.length - 1].c.tier) : '';
    return '<div class="bt-row s' + k + '">' + bench + '</div>' +
      '<div class="bt-pile dk s' + k + '"><div class="lb">DEK</div><div class="bk" style="transform:translate(3px,-3px)"></div><div class="bk" style="transform:translate(1.5px,-1.5px)"></div><div class="bk"></div><div class="n">' + alive(p) + '</div></div>' +
      '<div class="bt-pile ko s' + k + '"><div class="lb">KO</div>' + (kos ? '<div class="bt-mini ko" style="height:100%" data-ck="' + k + '-' + p.deck.indexOf(p.ko[p.ko.length - 1]) + '">' + kos + '</div>' : '<div style="position:absolute;inset:0;border:2px dashed rgba(255,255,255,.3);border-radius:4px"></div>') + '<div class="n">' + p.ko.length + '</div></div>' +
      '<div class="bt-name s' + k + '">' + teamIco(p) + '<span>' + esc(p.name) + (p.starter ? ' · kad latihan' : '') + '</span></div>' +
      '<div class="bt-card bt-act s' + k + (shield[k] ? ' bt-shield' : '') + '" id="btA' + k + '" data-ck="' + k + '-' + p.i + '">' + cardFaceHtml(x.c, x.c.tier, { lv: x.lv }) + (shield[k] ? '<div class="bt-sh">🛡</div>' : '') +
                '<div class="bt-hp"><small>HP</small>' + Math.max(0, x.cur) + '</div>' +
        '<div class="bt-hpbar"><i style="width:' + Math.max(0, x.cur / x.hp * 100) + '%;background:' + hpCol(x) + '"></i></div></div>';
  }
  /* kad "terbang": ukur kedudukan setiap kad (data-ck) sebelum dilukis semula, kemudian animasikan dari
     kedudukan lama ke kedudukan baharu — tukar kad, kad KO ke longgokan, kad bangku masuk gelanggang */
  const flipFrom = (el, o, delay) => {
    const n = el.getBoundingClientRect(); if (!n.width || !o) return false;
    const dx = o.left - n.left, dy = o.top - n.top, sx = o.width / n.width, sy = o.height / n.height;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2 && Math.abs(sx - 1) < .03) return false;
    el.style.transition = 'none'; el.style.transformOrigin = '0 0'; el.style.zIndex = 9;
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
    void el.offsetWidth;
    el.style.transition = 'transform .6s cubic-bezier(.3,.9,.3,1) ' + (delay || 0) + 'ms';
    el.style.transform = '';
    setTimeout(() => { el.style.transition = el.style.zIndex = el.style.transformOrigin = ''; }, 650 + (delay || 0));
    return true;
  };
  let dealt = false;
  function paintBoard(enter){
    const before = {};
    root.querySelectorAll('[data-ck]').forEach(el => before[el.dataset.ck] = el.getBoundingClientRect());
    $b('#btS0').innerHTML = side(0); $b('#btS1').innerHTML = side(1);
    $b('#btScore').innerHTML = '<div class="r">' + alive(P[1]) + '<small>KAD</small></div><div class="b">' + alive(P[0]) + '<small>KAD</small></div>';
    $b('#btH0').classList.toggle('turn', !over && !rebut && turn === 0 && (klasik || !!cur));
    $b('#btH1').classList.toggle('turn', !over && !rebut && turn === 1 && (klasik || !!cur));
    if (!dealt){                                            // edaran awal: setiap kad terbang dari dek
      dealt = true;
      root.querySelectorAll('[data-ck]').forEach((el, i) => {
        const pile = $b('.bt-pile.dk.s' + el.dataset.ck[0]);
        if (pile) flipFrom(el, pile.getBoundingClientRect(), 120 + i * 110);
      });
      setTimeout(() => audPlay('kad_koyak'), 150);
      return;
    }
    let moved = new Set();
    root.querySelectorAll('[data-ck]').forEach(el => { if (flipFrom(el, before[el.dataset.ck])) moved.add(el.dataset.ck); });
    if (enter !== undefined){ const a = $b('#btA' + enter); if (a && !moved.has(a.dataset.ck)){ a.style.setProperty('--from', enter ? '-14cqh' : '14cqh'); a.classList.add('bt-enter'); } }
  }
  const banner = (t, c, ms) => { const b = $b('#btBanner'); b.innerHTML = t; b.style.color = c || '#fff'; b.style.opacity = 1; clearTimeout(banner.t); banner.t = setTimeout(() => b.style.opacity = 0, ms || 1300); };

  /* ---------- panel soalan ---------- */
  function qPanel(k){
    const box = $b('#btQ' + k); if (!box) return;
    const p = P[k], mine = rebut || (!ai && turn === k) || (ai && k === 0);
    box.style.setProperty('--qc', p.col);
    if (!cur || !mine){
      box.className = 'bt-q idle' + (k === 1 ? ' top' : '');
      box.innerHTML = '<div class="qt">' + (over ? '' : cur ? 'Giliran ' + esc(P[turn].name) + '…' : 'Bersedia…') + '</div>';
      return;
    }
    const locked = cur.locked[k], el = elemOf(cardSet(act(p).c).el);
    box.className = 'bt-q' + (k === 1 ? ' top' : '');
    box.innerHTML = '<div class="who">' + teamIco(p) + '<span>' + esc(p.name).toUpperCase() + ' · PILIH SERANGAN</span><span style="margin-left:auto" class="num">PUSINGAN ' + round + '</span></div>' +
      '<div class="bar"><i id="btBar' + k + '"></i></div>' +
      '<div class="qt">' + esc(cur.q.q) + '</div>' +
      '<div class="mv">' + cur.order.map((i, j) => '<button data-a="' + k + ':' + i + '"' + (locked ? ' class="locked" disabled' : '') + '><b>' + String.fromCharCode(65 + j) + '</b><span>' + esc(cur.q.c[i]) + '</span>' +
        '<span style="margin-left:auto;opacity:.6">' + el.ico + '</span></button>').join('') + '</div>' +
      (locked ? '<div class="msg">Salah — tunggu lawan…</div>' : '');
  }
  const paintQ = () => { if (klasik) return kPanel(); qPanel(0); qPanel(1); };

  /* ---------- serangan ---------- */
  function strike(k, opt){
    const o = typeof opt === 'object' && opt ? opt : { mult: opt ? 1.4 : 1, crit: !!opt }, fast = !!o.crit;
    const a = P[k], d = P[1 - k], ax = act(a), dx = act(d);
    const adv = advOf(ax, dx);
    let dmg = Math.max(3, Math.round(ax.atk * o.mult * (0.9 + Math.random() * 0.2) * adv - dx.def * 0.6));
    const blocked = shield[1 - k];
    if (blocked){ dmg = Math.max(1, Math.round(dmg * .5)); shield[1 - k] = false; }
    const ko = dx.cur - dmg <= 0;
    const aEl = $b('#btA' + k), dEl = $b('#btA' + (1 - k));
    if (aEl) aEl.classList.add(k === 0 ? 'bt-lunge-up' : 'bt-lunge-dn');
    snd(fast ? 'duel_kritikal' : 'duel_serang', fast ? 'hi' : 'flip');
    setTimeout(() => {
      if (!root.isConnected) return;
      if (aEl) aEl.classList.remove('bt-lunge-up', 'bt-lunge-dn');
      $b('#btRays').classList.remove('on'); void $b('#btRays').offsetWidth; $b('#btRays').classList.add('on');
      $b('#btGlow').classList.remove('on'); void $b('#btGlow').offsetWidth; $b('#btGlow').classList.add('on');
      dx.cur -= dmg;
      if (dEl){
        dEl.classList.add('bt-hit'); vibrate(30); audPlay('duel_kena');
        const hp = dEl.querySelector('.bt-hp'); if (hp) hp.innerHTML = '<small>HP</small>' + Math.max(0, dx.cur);
        const bar = dEl.querySelector('.bt-hpbar i'); if (bar){ bar.style.width = Math.max(0, dx.cur / dx.hp * 100) + '%'; bar.style.background = hpCol(dx); }
        const r = dEl.getBoundingClientRect(), br = $b('#btBoard').getBoundingClientRect();
        const n = document.createElement('div'); n.className = 'bt-dmg' + (fast ? ' crit' : '');
        n.textContent = '-' + dmg; n.style.left = ((r.left - br.left + r.width / 2) / br.width * 100) + '%'; n.style.top = ((r.top - br.top + r.height * .3) / br.height * 100) + '%';
        $b('#btBoard').appendChild(n); setTimeout(() => n.remove(), 1200);
      }
      if (dEl && blocked){ dEl.classList.remove('bt-shield'); const sh = dEl.querySelector('.bt-sh'); if (sh) sh.remove(); }
      banner((fast ? (o.label || '⚡ KRITIKAL!') + ' ' : '') + esc(ax.c.name) + (blocked ? ' · 🛡 DITAHAN' : '') + (adv > 1 ? ' · ELEMEN KUAT!' : adv < 1 ? ' · elemen lemah' : ''), fast ? '#FFE14D' : '#fff', 1200);
      if (dx.cur <= 0){
        setTimeout(() => {
          if (!root.isConnected) return;
          if (dEl) dEl.classList.add('bt-ko');
          banner(esc(dx.c.name) + ' — KO!', '#FCA5A5', 1200); snd('duel_ko', 'low');
          setTimeout(() => {
            if (!root.isConnected) return;
            d.ko.push(dx);
            const live2 = d.deck.map((y, j) => [y, j]).filter(([y]) => y.cur > 0);
            if (live2.length) d.i = (klasik && !d.id ? live2.sort((a2, b2) => b2[0].cur - a2[0].cur)[0] : live2[0])[1];   // komputer pilih kad paling sihat
            shield[1 - k] = false;
            paintBoard(alive(d) ? 1 - k : undefined);
          }, 700);
        }, 500);
      } else setTimeout(() => { if (dEl) dEl.classList.remove('bt-hit'); }, 460);
    }, 330);
    return { dmg, ko };
  }

  /* ---------- pusingan ---------- */
  function endRound(ms){                                  // tunggu animasi serangan/KO selesai
    cancelAnimationFrame(raf); cur = null; paintQ();
    setTimeout(() => {
      if (over || !root.isConnected) return;
      if (!alive(P[0]) || !alive(P[1])) return finish();
      if (!rebut && !ai) turn = 1 - turn;
      ask();
    }, ms || 2200);
  }
  function answer(k, pick){
    if (!cur || cur.done || over) return;
    const q = cur.q, ok = pick === q.a, fast = ok && (performance.now() - cur.t0) / 1000 < duelQ() * .4;
    P[k].asked++; if (ok) P[k].right++;
    if (P[k].id) teamQuiz(P[k].id, ok);
    if (rebut){
      if (ok){ cur.done = true; strike(k, fast); return endRound(); }
      cur.locked[k] = true; snd('ui_salah', 'low'); vibrate(30);
      if (cur.locked[0] && cur.locked[1]){ cur.done = true; banner('Kedua-dua salah! Jawapan: ' + esc(q.c[q.a]), '#FCA5A5', 2000); return endRound(); }
      banner(esc(P[k].name) + ' salah — ' + esc(P[1 - k].name) + ' boleh merebut!', '#FDE68A', 1600); paintQ(); return;
    }
    cur.done = true;
    if (ok) strike(k, fast);
    else { banner((pick === -1 ? 'Masa tamat! ' : 'Salah! ') + 'Jawapan: ' + esc(q.c[q.a]), '#FCA5A5', 1500); setTimeout(() => { if (root.isConnected) strike(1 - k, false); }, 900); return endRound(3100); }
    endRound();
  }
  function ask(){
    if (over) return;
    round++;
    const q = escQuestion();
    cur = { q, order: q.c.map((_, i) => i).sort(() => Math.random() - .5), t0: performance.now(), locked: [false, false], done: false };
    paintBoard(); paintQ();
    banner(rebut ? 'PUSINGAN ' + round + ' — SIAPA CEPAT?' : ai ? 'PUSINGAN ' + round : 'GILIRAN ' + esc(P[turn].name).toUpperCase(), '#fff', 1100);
    const tick = () => {
      if (!cur || cur.done || over) return;
      const QS = duelQ(), left = Math.max(0, QS - (performance.now() - cur.t0) / 1000);
      [0, 1].forEach(k => { const bar = $b('#btBar' + k); if (bar){ bar.style.width = (left / QS * 100) + '%'; bar.style.background = left > QS * .6 ? '#4ADE80' : left > QS * .27 ? '#FACC15' : '#EF4444'; } });
      if (left <= 0){
        if (rebut){ cur.done = true; banner('Masa tamat! Jawapan: ' + esc(cur.q.c[cur.q.a]), '#FCA5A5', 2000); return endRound(); }

      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }

  /* ---------- MOD KLASIK (tanpa kuiz): tenaga, serang, jurus, bertahan, tukar kad ---------- */
  const COST = { serang: 1, jurus: 3, tahan: 1, tukar: 1 }, EMAX = 5;
  const humanTurn = () => klasik && !over && !busy && !(ai && turn === 1);
  function kPanel(){
    const box = $b('#btQ0'); if (!box) return;
    const p = P[turn]; box.style.setProperty('--qc', p.col);

    if (ai && turn === 1){ box.className = 'bt-q idle'; box.innerHTML = '<div class="qt">🤖 Penjaga Ilmuria sedang berfikir…</div>'; return; }
    if (busy && round === 0){ box.className = 'bt-q idle'; box.innerHTML = '<div class="qt">Mengedarkan kad…</div>'; return; }
    const ax = act(p), dx = act(P[1 - turn]), adv = advOf(ax, dx), e = energy[turn], el = elemOf(cardSet(ax.c).el);
    const est = m => Math.max(3, Math.round(ax.atk * m * 1.3 * adv - dx.def * .6));
    const btn = (k, ico, t, sub, dis) => '<button data-k="' + k + '"' + (dis ? ' disabled class="locked"' : '') + '><b>' + ico + '</b><span>' + t + '<small>' + sub + '</small></span></button>';
    box.className = 'bt-q kl';
    box.innerHTML = '<div class="who">' + teamIco(p) + '<span>' + esc(p.name).toUpperCase() + ' · GILIRAN</span><span class="en">' +
        Array.from({ length: EMAX }, (_, i) => '<i class="' + (i < e ? 'on' : '') + '">⚡</i>').join('') + '</span></div>' +
      (swMode ? '<div class="qt">🔄 Ketik kad di bangku untuk masuk ke gelanggang</div><div class="mv one"><button data-k="batal"><b>✕</b><span>Batal</span></button></div>' :
      '<div class="mv">' +
        btn('serang', '⚔️', 'Serang · 1⚡', '≈' + est(1) + ' kerosakan' + (adv > 1 ? ' · elemen kuat' : adv < 1 ? ' · elemen lemah' : ''), e < 1 || busy) +
        btn('jurus', el.ico, 'Jurus ' + el.name + ' · 3⚡', '≈' + est(2.3 / 1.3) + ' kerosakan', e < 3 || busy) +
        btn('tahan', '🛡', 'Bertahan · 1⚡', shield[turn] ? 'perisai aktif' : 'separuh kerosakan seterusnya', e < 1 || shield[turn] || busy) +
        btn('tukar', '🔄', 'Tukar Kad · 1⚡', switched ? 'sudah ditukar giliran ini' : 'masukkan kad dari bangku', e < 1 || switched || alive(p) < 2 || busy) +
      '</div><div class="mv one"><button data-k="tamat"' + (busy ? ' disabled class="locked"' : '') + '><b>⏭</b><span>Tamat giliran (simpan tenaga)</span></button></div>');
  }
  function beginTurn(k){
    if (over) return;

    paintBoard(); kPanel();
    banner(ai && k === 1 ? 'GILIRAN PENJAGA ILMURIA' : 'GILIRAN ' + esc(P[k].name).toUpperCase(), '#fff', 1000);
    if (ai && k === 1) setTimeout(aiTurn, 1300);

  const endTurn = () => { if (over || !root.isConnected) return; if (!alive(P[0]) || !alive(P[1])) return finish(); beginTurn(1 - turn); };
  function doAttack(k, kind){
    if (energy[k] < COST[kind] || busy) return;
    energy[k] -= COST[kind]; busy = true; swMode = false; kPanel();
    const r = strike(k, kind === 'jurus' ? { mult: 2.3, crit: true, label: '💥 JURUS!' } : { mult: 1.3 });   // Klasik lebih pantas: sesuai masa kelas
    setTimeout(() => { busy = false; endTurn(); }, r.ko ? 2700 : 1500);
  }
  function doShield(k){
    if (energy[k] < COST.tahan || shield[k] || busy) return;
    energy[k] -= COST.tahan; shield[k] = true; snd('ui_betul', 'hi');
    banner('🛡 ' + esc(act(P[k]).c.name) + ' bersedia bertahan', '#7DD3FC', 1100); paintBoard(); kPanel();
  }
  function doSwitch(k, j){
    const p = P[k];
    if (busy || switched || energy[k] < COST.tukar || j === p.i || !p.deck[j] || p.deck[j].cur <= 0) return;
    energy[k] -= COST.tukar; switched = true; swMode = false; p.i = j; shield[k] = false;

  }
  function aiTurn(){
    if (over || turn !== 1 || !root.isConnected) return;
    const me = P[1], ax = act(me), dx = act(P[0]), adv = advOf(ax, dx);

    }
    if (energy[1] >= 3 && (adv >= 1 || Math.random() < .6)) return doAttack(1, 'jurus');
    if (!shield[1] && energy[1] >= 2 && ax.cur / ax.hp < .35 && Math.random() < .6){ doShield(1); return setTimeout(aiTurn, 1000); }
    if (energy[1] === 2 && Math.random() < .35){ banner('Penjaga Ilmuria menyimpan tenaga…', '#94A3B8', 1000); return setTimeout(endTurn, 1100); }

        '<div class="flex gap-2 mt-4"><button class="btn clip-s flex-1 !py-3" data-x="quit">Tutup</button><button class="btn btn-o clip-s flex-1 !py-3" data-x="again"><i class="fa-solid fa-rotate"></i> Main Lagi</button></div></div>';

    } else {
      const rpW = 8 + alive(W) * 2, rpL = 2;
      S.duel.pvp = S.duel.pvp || {}; S.duel.log = S.duel.log || [];
      [[W, 'w'], [L, 'l']].forEach(([p, k]) => { const r = S.duel.pvp[p.id] = S.duel.pvp[p.id] || { w:0, l:0 }; r[k]++; });

    }

    const won0 = wk === 0;
    snd(ai && !won0 ? 'duel_kalah' : 'duel_menang', ai && !won0 ? 'low' : 'myth');

        '<div class="text-[11px] text-orange">+' + rp + ' RP' + (tp ? ' · <b style="color:' + TP_COLOR[tp] + '">TP' + tp + '</b>' : '') + '</div></div>').join('') + '</div>' +
      '<div class="text-[10px] text-muted mt-2">TP direkod dalam PBD hari ini untuk setiap ahli kumpulan.</div>' +

/* ============ PASUKAN (KUMPULAN) & MARKAH GAME → PBD ============
   Semua game dimainkan oleh KUMPULAN (meja kumpulan kelas aktif). Markah

   dan disimpan dalam rekod PBD hari itu bagi SETIAP ahli kumpulan (markah

const GAME_NAMES = { esc:'Sekolah Berhantu', run:'Larian Ilmu', duel:'Duel Kad', pvp:'Duel Kad (lawan kumpulan)', stor:'Simulasi Stor Sukan' };
const teamOf = id => { const g = (S.groups || []).find(x => x.id === id); return g ? { id, name: g.name, members: (g.members || []).map(stu).filter(Boolean), g } : null; };
const teamName = id => (teamOf(id) || {}).name || '—';
const classTeams = () => (S.groups || []).filter(g => g.classId === S.ui.activeClassId && (g.members || []).some(m => stu(m)));
const TEAM_COLORS = ['#FF6B00','#00C2D4','#C084FC','#4ADE80','#FFD76A','#FF5A7A','#38BDF8','#F59E0B'];

const teamRP = (id, n) => { const t = teamOf(id); if (!t) return; S.arena.rp = S.arena.rp || {}; t.members.forEach(s => S.arena.rp[s.id] = (S.arena.rp[s.id] || 0) + n); };

/* Peratus betul → kadar (julat skala −20…39) → TP */
function accRate(acc){ return acc >= .9 ? 35 : acc >= .75 ? 25 : acc >= .6 ? 15 : acc >= .45 ? 5 : acc >= .25 ? -5 : -15; }
/* Kadar sesi = purata matrik guru (jika ada) + setiap game */
function blendRec(rec){
  const parts = [];
  const ks = Object.keys(rec.metricScores || {});
  if (rec.metricCount && ks.length){ rec.mrate = clamp((rec.totalScore || 0) / Math.max(1, rec.metricCount), SC_MIN, SC_MAX); parts.push(rec.mrate); }
  else delete rec.mrate;
  (rec.games || []).forEach(g => parts.push(g.rate));
  if (!parts.length) return false;
  rec.rate = clamp(parts.reduce((a, x) => a + x, 0) / parts.length, SC_MIN, SC_MAX);
  rec.tpAwarded = calcTP(rec.rate);
  return true;
}
/* Simpan hasil game sebagai PBD untuk setiap ahli pasukan. Pulangkan TP. */
function gameToPBD(teamId, game, right, asked, extra){
  const t = teamOf(teamId), sj = S.ui.activeSubjectId;
  if (!t || !sj || !asked) return 0;
  const date = todayKey(), rate = accRate(right / asked), gid = uid('gm');
  t.members.forEach(s => {
    S.records[s.id] = S.records[s.id] || {};
    S.records[s.id][sj] = S.records[s.id][sj] || {};
    const rec = S.records[s.id][sj][date] || { metricScores:{}, metricCount:0, totalScore:0, touchCount:0 };
    rec.games = rec.games || [];
    rec.games.push(Object.assign({ id: gid, g: game, r: right, n: asked, rate, team: teamId, tn: t.name, t: Date.now() }, extra || {}));
    blendRec(rec);
    stampTopic(rec, s.classId, sj, date);
    rec.updatedAt = Date.now();
    S.records[s.id][sj][date] = rec;
  });
  save(true);
  return calcTP(rate);
}
/* Padam satu aktiviti game daripada rekod; rekod kosong dibuang terus */
function gameDel(sid, sj, date, gameId){
  const rec = ((S.records[sid] || {})[sj] || {})[date]; if (!rec) return;
  rec.games = (rec.games || []).filter(g => g.id !== gameId);
  if (!rec.games.length) delete rec.games;
  if (!blendRec(rec)){ delete S.records[sid][sj][date]; if (!Object.keys(S.records[sid][sj]).length) delete S.records[sid][sj]; }
}
const gameLine = g => (GAME_NAMES[g.g] || g.g) + ' · ' + g.r + '/' + g.n + ' betul (' + Math.round(g.r / g.n * 100) + '%) → TP' + calcTP(g.rate) + (g.tn ? ' · ' + g.tn : '');

const ST_HAVE = new Map();                         // id → url fail yang wujud
let ST_PROBED = null;
function storProbe(){
  if (ST_PROBED) return ST_PROBED;
  const tryOne = (id, ext) => new Promise(r => { const im = new Image(); im.onload = () => r(true); im.onerror = () => r(false); im.src = 'assets/stor/' + id + '.' + ext; });
  // senarai.json ditulis oleh shrink-assets.ps1 (auto-push): satu muat turun kecil, gambar dimuat bila dipapar sahaja.
  // Tanpa senarai (cth. fail dimuat naik terus ke GitHub), semak setiap fail satu persatu.
  ST_PROBED = fetch('assets/stor/senarai.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject())
    .then(m => { Object.keys(m).forEach(id => ST_HAVE.set(id, 'assets/stor/' + m[id])); })
    .catch(() => Promise.all(ST_ASSETS.map(async a => {
      for (const ext of ['webp', 'png', 'jpg']) if (await tryOne(a.id, ext)){ ST_HAVE.set(a.id, 'assets/stor/' + a.id + '.' + ext); return; }
    })));
  return ST_PROBED;
}

`;
function stStyle(){ if (!document.getElementById('stCss')){ const s = document.createElement('style'); s.id = 'stCss'; s.textContent = ST_CSS; document.head.appendChild(s); } }

/* ---------- enjin ---------- */
function storRun(team){
  stStyle();
  const cfg = storCfg(), L = ST_LVL[cfg.lvl] || ST_LVL.mudah;
  const SABAR = +cfg.sabar || L.sabar, DUR = (+cfg.syif || 5) * 60, ME = cfg.watak === 'l' ? 'pekerja_l' : 'pekerja_p';
  const SLOTX = { s: [3.5, 17.5, 31.5], k: [57.5, 71.5, 85.5] };
  const root = document.createElement('div');
  root.className = 'st'; root.id = 'stRoot';
  /* rak berlapis: rak kosong (gambar/lukisan) → lapisan barang (#stL_<rak>) → label */
  const ST_BOARD = [27, 49, 71, 93];                    // paras atas papan rak (% tinggi rak) — sama dengan prompt aset
  const shelfW = z => z === 's' ? 10 : 8;
  const shelfSlots = id => {                           // barang rak ini disusun ke 4 paras
    const its = ST_ITEMS.filter(i => i.sh === id), lvOf = j => Math.floor(j * 4 / its.length);
    return its.map((it, j) => { const lv = lvOf(j), row = its.filter((_, q) => lvOf(q) === lv), k = row.indexOf(it);
      return { it, lv, x: 8 + 84 * (k + .5) / row.length, w: Math.min(30, 84 / row.length * 1.1) }; });
  };
  const shelfHtml = ([id, nm, z, x]) => {
    const img = 'rak_' + id;
    return '<div class="st-shelf" data-sh="' + id + '" data-z="' + z + '" style="left:' + x + '%;width:' + shelfW(z) + '%">' +
      (ST_HAVE.has(img) ? stImg(img, '') : '<div class="box' + (z === 'k' ? (id === 'sejuk' ? ' cold' : ' k') : '') + '"></div>') +
      '<div class="st-lv" id="stL_' + id + '"></div><div class="nm">' + nm + '</div></div>';
  };
  root.innerHTML = '<div class="st-stage" id="stStage">' +
    (ST_HAVE.has('bg_lantai') ? stImg('bg_lantai', '', 'st-bg') : '<div class="st-wallk"></div><div class="st-floor"></div>') +
    '<div class="st-zl" style="left:2%;top:42%">🏬 STOR SUKAN</div><div class="st-zl" style="left:86%;top:42%">🥗 KEDAI SIHAT</div>' +
    ST_SHELVES.map(shelfHtml).join('') +
    '<div class="st-stn" style="top:10%" data-stn="dapur">' + (ST_HAVE.has('dapur') ? stImg('dapur', '') : '') + '<div class="nm">DAPUR</div><div id="stS_dapur" style="display:flex;gap:.4cqw;position:relative;z-index:2"></div></div>' +
    '<div class="st-stn" style="top:26%" data-stn="blender">' + (ST_HAVE.has('blender') ? stImg('blender', '') : '') + '<div class="nm">BLENDER</div><div id="stS_blender" style="display:flex;gap:.4cqw;position:relative;z-index:2"></div></div>' +
    '<div class="st-door" data-door="1">' + (ST_HAVE.has('pintu_stor') ? stImg('pintu_stor', '') : '') + '</div>' +
    '<div class="st-zl" style="left:46%;top:39.5%;font-size:.9cqw">PINTU STOK</div>' +
    '<div class="st-me" id="stMe" style="left:22%">' + stImg(ME, cfg.watak === 'l' ? '🧑‍💼' : '🧕') + '</div>' +
    '<div id="stSup"></div>' +
    '<div class="st-phone" id="stPhone" data-ph="1">' + (ST_HAVE.has('meja_telefon') ? stImg('meja_telefon', '') : '☎️') + '</div>' +
    '<div class="st-counter s' + (ST_HAVE.has('kaunter_stor') ? ' tile" style="background-image:url(' + ST_HAVE.get('kaunter_stor') + ')' : '') + '">' + '<div class="nm">KAUNTER STOR</div></div>' +
    '<div class="st-counter k' + (ST_HAVE.has('kaunter_kafe') ? ' tile" style="background-image:url(' + ST_HAVE.get('kaunter_kafe') + ')' : '') + '">' + '<div class="nm">KAUNTER KEDAI SIHAT</div></div>' +
    '<div id="stCust"></div>' +
    '<div class="st-tray' + (ST_HAVE.has('dulang') ? ' img" style="--tray:url(' + ST_HAVE.get('dulang') + ')' : '') + '"><div class="t">DULANG</div><div class="g" id="stTray"></div><div class="k" id="stTrayK">kosong</div></div>' +
    '<div class="st-hud" id="stHud"></div>' +
    '<div class="st-msg" id="stMsg"></div>' +
    '<div id="stPop"></div><div id="stCall"></div><div id="stEnd"></div>' +
  '</div>';
  document.body.appendChild(root); lockBody();
  const live = liveHost('stor', root, { title: 'Stor Sukan' });
  const $s = q => root.querySelector(q);

  /* ---------- keadaan ---------- */
  const stock = {}; ST_ITEMS.forEach(i => stock[i.id] = i.tg === 'x' ? 6 : 5);
  const tray = [];                                       // { id, cooked }
  const stn = { dapur: [null, null], blender: [null] };  // { id, t, need }
  const cust = { s: [null, null, null], k: [null, null, null] };
  let T = 0, coins = 0, score = 0, hearts = 5, good = 0, poor = 0, left = 0, qRight = 0, qAsked = 0, over = false, paused = false, spawnT = 3;
  let ring = null, nextRing = 25 + Math.random() * 10, sup = null, call = null, lastTick = performance.now();
  STOR = { close: () => quit() };
  const hud = () => {
    const tl = Math.max(0, DUR - T);
    $s('#stHud').innerHTML = '<span class="pill">⏱ ' + Math.floor(tl / 60) + ':' + String(Math.floor(tl % 60)).padStart(2, '0') + '</span>' +
      '<span class="pill">' + stImg('ui_syiling', '🪙') + ' RM' + coins + '</span>' +
      '<span class="pill">' + [0, 1, 2, 3, 4].map(i => i < hearts ? stImg('ui_hati', '❤️') : '<span class="st-emo" style="opacity:.3">🖤</span>').join('') + '</span>' +
      '<span class="pill" style="color:#FDE68A">⭐ ' + score + '</span><span class="pill">😊 ' + (good + poor) + '</span><span class="pill" style="font-size:1.1cqw;max-width:20cqw;overflow:hidden;white-space:nowrap">' + esc(teamName(team)) + '</span>' +
      '<button data-x="quit"><i class="fa-solid fa-xmark"></i></button>';
  };
  let msgT = 0;
  const msg = (t, c, ms) => { const m = $s('#stMsg'); m.innerHTML = t; m.style.color = c || '#fff'; m.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => m.style.opacity = 0, ms || 1300); };
  const fly = (t, x, y) => { const n = document.createElement('div'); n.className = 'st-fly'; n.textContent = t; n.style.left = x + '%'; n.style.top = y + '%'; $s('#stStage').appendChild(n); setTimeout(() => n.remove(), 1150); };
  const walk = x => { const m = $s('#stMe'); m.style.left = x + '%'; m.classList.remove('walk'); void m.offsetWidth; m.classList.add('walk'); };
  const icon = (id, cls) => { const i = ST_IT[id]; return stImg(id, i.e, cls); };

  /* ---------- pesanan ---------- */
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const kcalOf = items => items.reduce((a, t) => a + ST_IT[t.id].kcal, 0);
  function makeOrder(z){
    if (z === 's'){                                     // peralatan sukan: atlet, terus diserah (tanpa dulang)
      const a = pick(ST_ATH), n = 1 + Math.floor(Math.random() * L.max);
      const need = a.kit.slice().sort(() => Math.random() - .5).slice(0, Math.min(n, a.kit.length));
      return { who: stPerson(a.id), z, need, got: [], tx: pick(['Saya perlukan peralatan ini!', 'Ada stok ini?', 'Untuk latihan petang ini.', 'Perlawanan esok!']) };
    }
    const m = pick(ST_MEAL), target = Math.round((m.lo + Math.random() * (m.hi - m.lo)) / 10) * 10;
    return { who: stPerson(pick(m.who)), z, target, alg: Math.random() < L.alg ? pick(Object.keys(ST_ALG)) : null, tx: m.t };
  }
  const shake = (z, i) => { const e = $s('#stC_' + z + i); if (e){ e.classList.remove('no'); void e.offsetWidth; e.classList.add('no'); } };
  function custHtml(){
    return ['s', 'k'].map(z => cust[z].map((c, i) => {
      if (!c) return '';
      const frac = Math.max(0, c.p / c.max), col = frac > .5 ? '#22C55E' : frac > .25 ? '#EAB308' : '#EF4444', o = c.o;
      const body = z === 's'
        ? '<div class="it">' + o.need.map(id => '<span class="' + (o.got.includes(id) ? 'ok' : '') + '">' + icon(id) + '</span>').join('') + '</div><div class="tx">' + esc(o.tx) + '</div>'
        : '<div class="tx big">"' + esc(o.tx) + (o.alg ? ' Oh ya, saya alergik ' + ST_ALG[o.alg].n + '.' : '') + '"</div>' +
          '<div class="kc">🎯 ' + o.target + ' kcal' + (o.alg ? ' <span class="al">' + ST_ALG[o.alg].ic + '✕</span>' : '') + '</div>';
      return '<div class="st-cu' + (c.fresh ? ' in' : '') + (c.leaving ? ' out' : '') + (frac < .25 ? ' mad' : '') + '" id="stC_' + z + i + '" data-cu="' + z + i + '" style="left:' + SLOTX[z][i] + '%">' +
        '<div class="st-bub">' + body + '<div class="pt"><i style="width:' + (frac * 100) + '%;background:' + col + '"></i></div></div>' +
        '<div class="who">' + stImg(o.who.img, o.who.e) + '</div><div class="nm2">' + esc(o.who.n) + '</div></div>';
    }).join('')).join('');
  }
  const paintCust = () => { $s('#stCust').innerHTML = custHtml(); ['s', 'k'].forEach(z => cust[z].forEach(c => { if (c) c.fresh = false; })); };
  const TRAY_MAX = 6;
  const paintTray = () => {
    $s('#stTray').innerHTML = Array.from({ length: TRAY_MAX }, (_, i) => tray[i] ? '<div class="f' + (ST_IT[tray[i].id].tg === 'x' ? ' x' : '') + '" data-tr="' + i + '">' + icon(tray[i].id) + '</div>' : '<div></div>').join('');
    $s('#stTrayK').textContent = tray.length ? kcalOf(tray) + ' kcal' : 'kosong';
    paintCust();
  };
  const shown = {};
  const paintShelves = () => ST_SHELVES.forEach(([id]) => {
    const el = $s('[data-sh="' + id + '"]'); if (!el) return;
    el.classList.toggle('low', ST_ITEMS.some(i => i.sh === id && i.tg !== 'x' && stock[i.id] <= 1));
    $s('#stL_' + id).innerHTML = shelfSlots(id).map(({ it, lv, x, w }) => {
      const n = Math.min(3, stock[it.id]), pop = n > (shown[it.id] == null ? n : shown[it.id]);
      shown[it.id] = n;
      if (!n) return '';
      return '<span class="st-si' + (n === 1 ? ' lo' : '') + (pop ? ' pop' : '') + '" style="left:' + x + '%;bottom:' + (100 - ST_BOARD[lv]) + '%;width:' + w + '%">' +
        Array.from({ length: n }, (_, q) => '<i style="transform:translateX(' + ((q - (n - 1) / 2) * 28) + '%) scale(' + (q === (n - 1) / 2 || n === 1 ? 1 : .88) + ');z-index:' + (q === 1 ? 2 : 1) + '">' + icon(it.id) + '</i>').join('') + '</span>';
    }).join('');
  });
  /* barang terbang dari rak ke dulang / stesen (kedudukan dalam % pentas — sama di tablet projektor) */
  const shelfPos = id => {
    const it = ST_IT[id], sh = ST_SHELVES.find(x => x[0] === it.sh), sl = shelfSlots(it.sh).find(x => x.it.id === id);
    return [sh[3] + shelfW(sh[2]) * sl.x / 100, 10 + 29 * ST_BOARD[sl.lv] / 100 - 3];
  };
  const flyTo = (id, from, to) => {
    const n = document.createElement('div'); n.className = 'st-flyit'; n.innerHTML = icon(id);
    n.style.left = from[0] + '%'; n.style.top = from[1] + '%'; $s('#stStage').appendChild(n);
    void n.offsetWidth; n.style.left = to[0] + '%'; n.style.top = to[1] + '%'; n.style.opacity = 0;
    setTimeout(() => n.remove(), 700);
  };
  const TRAY_AT = [50, 84], STN_AT = { dapur: [94.25, 17], blender: [94.25, 33] };
  function paintStn(){
    Object.keys(stn).forEach(k => {
      $s('#stS_' + k).innerHTML = stn[k].map((x, i) => {
        if (!x) return '<div class="st-slot" data-ss="' + k + i + '"></div>';
        const p = Math.min(1, x.t / x.need), rd = x.t >= x.need, burn = k === 'dapur' && x.t >= x.need + 14;
        return '<div class="st-slot' + (burn ? ' burn' : rd ? ' ready' : '') + '" data-ss="' + k + i + '">' + (burn ? '<span class="st-emo">🔥</span>' : icon(x.id)) +
          (rd ? '' : '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="#FACC15" stroke-width="3" stroke-dasharray="' + (p * 100.5) + ' 100.5"/></svg>') + '</div>';
      }).join('');
    });
  }

  /* ---------- tindakan ---------- */
  function openShelf(id){
    const sh = ST_SHELVES.find(s => s[0] === id), its = ST_ITEMS.filter(i => i.sh === id), store = sh[2] === 's';
    walk(sh[3] + 2); snd('ui_klik', 'flip');
    $s('#stPop').innerHTML = '<div class="st-pop" data-pc="1"><div class="pn">' +
      '<div class="hd">' + esc(sh[1]).toUpperCase() + '<span>' + (store ? 'Ketik / seret terus kepada pelanggan di Kaunter Stor' : 'Ketik / seret ke dulang · makanan 🍳🌀 perlu dimasak') + '</span></div>' +
      '<div class="gr">' + its.map(i => '<button data-it="' + i.id + '"' + (stock[i.id] <= 0 ? ' disabled' : '') + '>' +
        '<div class="ic">' + icon(i.id) + '</div><div class="n">' + esc(i.n) + '</div>' +
        (store ? '' : '<div class="kc">' + (L.kcal ? i.kcal + ' kcal' : '? kcal') + ' ' + stAlgOf(i.id).map(k => ST_ALG[k].ic).join('') + '</div>') +
        (i.prep ? '<span class="pr">' + (i.prep[0] === 'dapur' ? '🍳' : '🌀') + '</span>' : '') +

  function takeItem(id){

  function takeStation(k, i){

  /* serah dulang kepada pelanggan Kedai Sihat: makin hampir kalori sasaran, makin tinggi skor */
  function serve(z, i){
    const c = cust[z][i]; if (!c || c.leaving) return;
    walk(SLOTX[z][i] + 1.5);
    if (z === 's') return msg('Seret peralatan dari rak terus kepada pelanggan ini.', '#FDE68A', 1400);

    const junk = tray.filter(t => ST_IT[t.id].tg === 'x').length, frac = Math.max(0, c.p / c.max);
    const pts = Math.max(0, Math.round(100 * acc) + Math.round(20 * frac) - junk * 15);

  const loop = setInterval(tick, 200);

  /* ---------- tamat ---------- */
  function finish(failed){

      '<div class="gr"><div><b style="color:#FDE68A">⭐ ' + score + '</b>skor</div><div><b>RM' + coins + '</b>pendapatan</div><div><b>' + served + '</b>dilayan · ' + left + ' pergi marah</div>' +
      '<div><b>' + qRight + '/' + qAsked + '</b>soalan pembekal</div><div><b style="color:#FB923C">+' + rp + '</b>RP</div><div><b style="color:' + (tp ? TP_COLOR[tp] : '#fff') + '">' + (tp ? 'TP' + tp : '—') + '</b>ke PBD</div></div>' +
