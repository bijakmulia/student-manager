/* ============ SEDIAKAN GAMBAR SEBELUM DIPAPARKAN ============
   Showcase dibina daripada HTML (banner, tangga rank, ganjaran). Daripada
   menyenaraikan gambar satu per satu — yang mudah tertinggal bila reka
   bentuk berubah — HTML setiap slaid dijana dahulu dalam <template>
   (lengai: tiada apa dimuat), lalu SETIAP URL gambar di dalamnya dikumpul. */
function htmlImageUrls(html){
  const t = document.createElement('template');
  t.innerHTML = html || '';
  const out = new Set();
  t.content.querySelectorAll('img[src]').forEach(i => out.add(i.getAttribute('src')));
  t.content.querySelectorAll('image').forEach(i => {
    const u = i.getAttribute('href') || i.getAttribute('xlink:href'); if (u) out.add(u); });
  t.content.querySelectorAll('[style]').forEach(e => {
    const s = e.getAttribute('style'), re = /url\(\s*(['"]?)(.*?)\1\s*\)/g; let m;
    while ((m = re.exec(s))) if (m[2]) out.add(m[2].replace(/&quot;/g, '"'));
  });
  return [...out].filter(u => u && !/^#/.test(u));
}
/* Nyahkod senarai gambar. Senyap jika siap cepat; jika lebih 250 ms (atau
   always), skrin memuat dibuka dengan kemajuan. Had masa supaya satu gambar
   yang tergantung di rangkaian tidak menahan pengguna selamanya. */
async function prepImages(urls, msg, opt){
  opt = opt || {};
  const want = [...new Set(urls || [])].filter(u => u && !IMG_KEEP.has(u));
  let id = opt.screen || null, done = 0, fin = false;
  const paint = () => {
    if (!id) return;
    const bd = $('[data-modal="' + id + '"]'); if (!bd) return;
    const b = $('#plBar', bd), t = $('#plTxt', bd);
    if (b) b.style.width = (want.length ? done / want.length * 100 : 100) + '%';
    if (t) t.textContent = want.length ? (done + ' / ' + want.length) : 'Sedia';
  };
  const q = want.slice();
  const workers = [];
  for (let w = 0; w < 8; w++) workers.push((async () => { while (q.length){ await preloadOne(q.shift()); done++; paint(); } })());
  const all = Promise.all(workers).then(() => { fin = true; });
  const cap = new Promise(r => setTimeout(r, opt.max || 15000));
  if (!id && !opt.always){
    await Promise.race([all, cap, new Promise(r => setTimeout(r, 250))]);
    if (fin || !want.length) return;
  }
  if (!id) id = loadScreen(want.length, true, msg);
  paint();
  await Promise.race([all, cap]);
  paint();
  if (!opt.keep){ await new Promise(r => setTimeout(r, 160)); closeModal(id); }
  return id;
}
/* Sediakan gambar satu potongan HTML secara senyap (untuk slaid seterusnya). */
const warmHtml = (html, max) => Promise.race([
  Promise.all(htmlImageUrls(html).map(u => preloadOne(u))),
  new Promise(r => setTimeout(r, max || 2500))
]);

function showcaseRun(o){
  let slides = showcaseSlides(o);
  let i = 0, timer = null, bgTimer = null, wake = null, lastSync = new Date();
  SHOWCASE_OPEN = true;
  const id = openModal({
    center:true, bare:true,
    body:'<div class="p-2">' +
      '<div id="scStage" style="transition:opacity .28s ease,transform .28s ease"></div>' +
      '<div class="flex items-center gap-2 mt-1">' +
        '<button class="btn clip-s !px-3" data-x="prev"><i class="fa-solid fa-chevron-left"></i></button>' +
        '<div class="flex-1 text-center text-[11px] num"><div id="scPos" class="text-muted"></div>' +
          '<div id="scLive" class="text-[9px]"><span style="color:#4ADE80">●</span> LIVE</div></div>' +
        '<button class="btn clip-s !px-3" data-x="next"><i class="fa-solid fa-chevron-right"></i></button>' +
        '<button class="btn btn-d clip-s !px-3" data-close="1"><i class="fa-solid fa-xmark"></i></button>' +
      '</div><div class="text-center text-[9px] text-muted mt-2 tracking-widest">LAGENDATP · DICIPTA OLEH ARIF AZIZ</div></div>',
    onClose: () => { SHOWCASE_OPEN = false; clearInterval(timer); clearInterval(bgTimer); try{ wake && wake.release(); }catch(e){} }
  });
  const bd = $('[data-modal="'+id+'"]');
  const stage = $('#scStage', bd);
  const render = sl => sl.type==='student' ? bannerHtml(sl.r, sl.pos) : sl.type==='ladder' ? ladderHtml(o) : sl.type==='reward' ? rewardHtml(o) : waitingHtml();
  const label = () => {
    const sl = slides[i];
    const nStu = slides.filter(x=>x.type==='student').length;
    $('#scPos',bd).textContent = sl.type==='student' ? ('#'+sl.pos+' / '+nStu) : (sl.type==='ladder'?'TANGGA RANK':sl.type==='reward'?'GANJARAN':'MENUNGGU');
    $('#scLive',bd).innerHTML = '<span style="color:#4ADE80">●</span> LIVE · '+lastSync.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  };
  const paint = (dir, instant) => {
    if (instant){ stage.innerHTML = render(slides[i]); label(); return; }
    stage.style.opacity = '0';
    stage.style.transform = 'translateX('+(dir>0?'24px':'-24px')+')';
    setTimeout(()=>{ stage.innerHTML = render(slides[i]); label(); stage.style.transform = 'translateX(0)'; stage.style.opacity = '1'; }, 160);
  };
  // Setiap tukar slaid: tarik data terkini, susun semula ranking, kemudian papar
  const go = async d => {
    if (!SHOWCASE_OPEN) return;
    const curKey = slides[i] && slides[i].key;
    await pullIfNewer(); lastSync = new Date();
    slides = showcaseSlides(o);
    let idx = slides.findIndex(x=>x.key===curKey);
    if (idx < 0) idx = Math.min(i, slides.length-1);
    i = (idx + d + slides.length) % slides.length;
    await warmHtml(render(slides[i]));            // gambar slaid ini siap SEBELUM dipaparkan
    if (!SHOWCASE_OPEN) return;
    paint(d);
  };
  // Refresh senyap slaid semasa (penting bila auto-play dimatikan)
  const refreshNow = async () => {
    if (!SHOWCASE_OPEN) return;
    const curKey = slides[i] && slides[i].key;
    await pullIfNewer(); lastSync = new Date();
    slides = showcaseSlides(o);
    const idx = slides.findIndex(x=>x.key===curKey);
    i = idx >= 0 ? idx : Math.min(i, slides.length-1);
    await warmHtml(render(slides[i]));
    if (!SHOWCASE_OPEN) return;
    paint(0, true);
  };
  bd.addEventListener('click', e => {
    const x = e.target.closest('[data-x]'); if(!x) return;
    clearInterval(timer);
    go(x.dataset.x==='next' ? 1 : -1);
  });
  let sx = 0;
  stage.addEventListener('pointerdown', e => sx = e.clientX);
  stage.addEventListener('pointerup', e => { const d = e.clientX - sx; if (Math.abs(d) > 45){ clearInterval(timer); go(d<0?1:-1); } });
  if (o.auto) timer = setInterval(()=>go(1), o.dur*1000);
  else bgTimer = setInterval(refreshNow, 10000);
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});
  paint(1);
}

let shareTimer = null, sharePublishing = false;
const b64urlEnc = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function b64urlDec(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function newToken(){ const a = new Uint8Array(15); crypto.getRandomValues(a); return Array.from(a, x => 'abcdefghijkmnpqrstuvwxyz23456789'[x % 32]).join(''); }

async function migrateLocalAssets(){
  if (!FB.on) return;
  let changed = false;
  for (const s of S.students){
    for (const kind of ['banner','icon']){
      const f = kind==='banner' ? 'bannerUrl' : 'iconUrl';
      const local = PHOTOS[photoKey(s.id,kind)];

    }

  for (const b of S.badges){

    if (!b.url && local){ try { b.url = await fbUpload('badge_icons/'+b.id+'.png', local); changed = true; } catch(e){} }
  }
  for (const r of S.ranks){
    const local = PHOTOS['frame:'+r.id];
    if (!(S.frames[r.id] && S.frames[r.id].url) && local){ try { S.frames[r.id] = { url: await fbUpload('frames/'+r.id+'.png', local) }; changed = true; } catch(e){} }
  }
  if (changed) save(true);
}
function buildShareSnapshot(sh){
  sanitizeBadges();
  const sj = sh.subjectId || null, cid = sh.classId || null;
  const seen = {}, rw = [];
  rewardMetrics(sj, cid).forEach(m => {
    const k = m.name+'|'+m.reward.emoji+'|'+m.reward.per;
    if (!seen[k]){ seen[k] = 1; rw.push({ n:m.name, e:m.reward.emoji, p:m.reward.per }); }
  });
  return {
    u: Date.now(), title: sh.title || 'Papan Juara', scope: shareScopeLabel(sh), opt: sh.opt || {},
    ranks: S.ranks.map(r => ({ id:r.id, tier:r.tier, name:r.name, color:r.color, min:r.min, f:(S.frames[r.id]||{}).url || '' })),
    rw,
    st: S.students.filter(s => !cid || s.classId === cid).map(s => {
      const x = stats(s.id, sj);
      return {
        i:s.id, n:s.name, c:clsName(s.classId), sj: sj ? subjName(sj) : 'Semua Subjek',
        sc:x.score, a:x.avgTP, f:x.finalTP, se:x.sessions, rp: rpOf(s.id, sj),
        rw: rewardsOf(s.id, sj),
        b: bannerBadges({ s, sj }).filter(b => b && b.url).slice(0,5).map(b=>({ n:b.name, u:b.url, c:b.color||'' })),
        bn: s.bannerUrl || '', ic: s.iconUrl || ''
      };
    })
  };
}
async function publishShare(){

/* ---------- PEMPROSESAN FRAME: buang latar → potong → jajar ikut KAKI ----------
   Jajaran automatik: pusat mendatar diambil dari kawasan KAKI (18% bawah bounding box),
   bukan keseluruhan watak — supaya pedang/lengan yang terjulur tidak menolak badan. */
function loadImgFile(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { res({ im, url }); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Imej tidak boleh dibuka')); };
    im.src = url;
  });
}
function imgToCanvas(im){
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  c.getContext('2d').drawImage(im, 0, 0);
  return c;
}
/* Jika latar pepejal (piksel penjuru tidak telus), jadikan telus dengan toleransi */
/* ---------- CHROMA KEY: buang latar pepejal dengan tepi bersih ----------
   Padanan warna mudah meninggalkan halo: piksel di tepi watak ialah
   CAMPURAN warna watak + warna latar, jadi ia tidak cukup hampir untuk
   dipadam, tetapi masih berwarna magenta/hijau. Hasilnya cincin warna
   latar mengelilingi sprite.

   Empat langkah di bawah menyelesaikannya:
     1. warna kunci = median 8 titik sempadan (tahan terhadap satu sudut rosak);
     2. isi-banjir dari tepi kanvas, jadi hanya latar BERSAMBUNG dipadam —
        warna serupa di dalam watak (mata, permata) tidak terjejas;
     3. alfa beransur antara ambang dalam dan luar, kemudian NYAH-CAMPUR
        warna latar daripada piksel separa telus:  C = a·F + (1−a)·K
        maka  F = (C − (1−a)·K) / a  — inilah yang membuang warna magenta
        daripada piksel tepi, bukan sekadar melutsinarkannya;
     4. laluan apit pada piksel bersebelahan kawasan telus untuk sisa
        pencemaran yang terselamat (biasanya daripada mampatan JPEG).      */
function killBg(cvs, opt){
  opt = opt || {};
  const ctx = cvs.getContext('2d'), W = cvs.width, H = cvs.height;
  const img = ctx.getImageData(0, 0, W, H), p = img.data;
  const N = W * H;
  if (!N) return false;

  // sudah ada saluran alfa (PNG telus)? jangan sentuh
  let solid = 0;
  [0, W - 1, (H - 1) * W, (H - 1) * W + W - 1].forEach(i => { if (p[i * 4 + 3] > 200) solid++; });
  if (solid < 3) return false;

  // ---- 1. warna kunci: median 8 titik sempadan
  const pts = [];
  const sample = (x, y) => { const i = (y * W + x) * 4; pts.push([p[i], p[i+1], p[i+2]]); };
  sample(0, 0); sample(W-1, 0); sample(0, H-1); sample(W-1, H-1);
  sample(W >> 1, 0); sample(W >> 1, H-1); sample(0, H >> 1); sample(W-1, H >> 1);
  const med = k => { const a = pts.map(q => q[k]).sort((m, n) => m - n); return a[a.length >> 1]; };
  const kr = med(0), kg = med(1), kb = med(2);

  // latar mesti RATA. Kira berapa banyak titik sempadan hampir dengan warna
  // kunci: dua boleh tercemar (kaki atau senjata menyentuh tepi), tetapi jika
  // lebih daripada itu berbeza, ini gambar biasa — jangan sentuh langsung.
  let near = 0;
  pts.forEach(q => {
    const dr = q[0] - kr, dg = q[1] - kg, db = q[2] - kb;
    if (Math.sqrt(dr * dr + dg * dg + db * db) <= 40) near++;
  });
  if (near < 6) return false;

  const T1 = opt.inner === undefined ? 62  : opt.inner;   // bawah ini = latar tulen
  const T2 = opt.outer === undefined ? 165 : opt.outer;   // atas ini  = watak tulen
  const span = Math.max(1, T2 - T1);
  const dist = o => {
    const dr = p[o] - kr, dg = p[o+1] - kg, db = p[o+2] - kb;
    return Math.sqrt(dr * dr + dg * dg + db * db);
  };

  // ---- 2. isi-banjir dari sempadan: hanya latar bersambung
  const bgm = new Uint8Array(N);
  const stack = new Int32Array(N);
  let sp = 0;
  const push = idx => { if (!bgm[idx] && dist(idx * 4) <= T2){ bgm[idx] = 1; stack[sp++] = idx; } };
  for (let x = 0; x < W; x++){ push(x); push((H - 1) * W + x); }
  for (let y = 0; y < H; y++){ push(y * W); push(y * W + W - 1); }
  while (sp > 0){
    const idx = stack[--sp], x = idx % W, y = (idx - x) / W;
    if (x > 0)     push(idx - 1);
    if (x < W - 1) push(idx + 1);
    if (y > 0)     push(idx - W);
    if (y < H - 1) push(idx + W);
  }
  let hit = 0;
  for (let i = 0; i < N; i++) if (bgm[i]) hit++;
  if (hit < N * 0.02 || hit > N * 0.985) return false;   // tiada latar, atau tiada watak

  // ---- 3. alfa beransur + nyah-campur warna latar
  for (let i = 0; i < N; i++){
    if (!bgm[i]) continue;
    const o = i * 4, d0 = dist(o);
    if (d0 <= T1){ p[o+3] = 0; continue; }
    const a = (d0 - T1) / span;                                  // 0..1
    const un = (c, k) => { const v = (c - (1 - a) * k) / a; return v < 0 ? 0 : v > 255 ? 255 : v; };
    p[o]   = un(p[o],   kr);
    p[o+1] = un(p[o+1], kg);
    p[o+2] = un(p[o+2], kb);
    p[o+3] = Math.round(a * 255);
  }

  // ---- 4. apit sisa pencemaran pada piksel tepi
  const ch = [kr, kg, kb], mx = Math.max(kr, kg, kb), mn = Math.min(kr, kg, kb);
  const cut = mn + (mx - mn) * 0.6;
  const strong = [0,1,2].filter(c => ch[c] >= cut && mx - mn > 40);
  const weak   = [0,1,2].filter(c => ch[c] <  cut);
  if (strong.length && weak.length){
    const a0 = new Uint8Array(N);
    for (let i = 0; i < N; i++) a0[i] = p[i * 4 + 3];
    const clampPx = o => {
      let wv = 0;
      for (let j = 0; j < weak.length; j++) wv = Math.max(wv, p[o + weak[j]]);
      const lim = wv + 24;
      for (let j = 0; j < strong.length; j++) if (p[o + strong[j]] <= lim) return;  // bukan pencemaran
      for (let j = 0; j < strong.length; j++){
        const c = o + strong[j];
        p[c] = Math.round(p[c] * 0.25 + lim * 0.75);
      }
    };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const i = y * W + x, al = a0[i];
      if (!al) continue;
      if (al < 250){ clampPx(i * 4); continue; }                 // piksel separa telus
      let edge = false;                                          // piksel legap yang bersentuhan tepi
      for (let dy = -1; dy <= 1 && !edge; dy++){
        const ny = y + dy; if (ny < 0 || ny >= H) continue;
        for (let dx = -1; dx <= 1; dx++){
          const nx = x + dx; if (nx < 0 || nx >= W) continue;
          if (a0[ny * W + nx] < 250){ edge = true; break; }
        }
      }
      if (edge) clampPx(i * 4);
    }
  }

  ctx.putImageData(img, 0, 0);
  return true;
}
/* Kotak legap SELURUH kanvas, tanpa memotong kepada kepingan. Berbeza
   daripada sliceFrames(), yang sengaja memecahkan lajur telus menjadi frame
   berasingan — di sini kita mahu tahu sempadan segala yang terlukis,
   termasuk anak panah yang sudah jauh daripada pemanah. */
function opaqueBox(cvs){
  const m = alphaMap(cvs);
  let x0 = -1, x1 = -1, y0 = -1, y1 = -1;
  for (let x = 0; x < m.w; x++) if (m.cols[x]){ if (x0 < 0) x0 = x; x1 = x; }
  for (let y = 0; y < m.h; y++) if (m.rows[y]){ if (y0 < 0) y0 = y; y1 = y; }
  return x0 < 0 || y0 < 0 ? null : { x0, x1, y0, y1, w:x1-x0+1, h:y1-y0+1 };
}
function alphaMap(cvs){
  const d = cvs.getContext('2d').getImageData(0, 0, cvs.width, cvs.height).data;
  const cols = new Uint8Array(cvs.width), rows = new Uint8Array(cvs.height);
  for (let y = 0; y < cvs.height; y++){
    for (let x = 0; x < cvs.width; x++){
      if (d[(y * cvs.width + x) * 4 + 3] > 24){ cols[x] = 1; rows[y] = 1; }
    }
  }
  return { cols, rows, data:d, w:cvs.width, h:cvs.height };
}
/* Pecahkan lembaran sprite kepada frame melalui jurang lajur telus */
function sliceFrames(cvs){
  const m = alphaMap(cvs);
  const runs = [];
  let s = -1;
  for (let x = 0; x < m.w; x++){
    if (m.cols[x] && s < 0) s = x;
    else if (!m.cols[x] && s >= 0){ if (x - s > 6) runs.push([s, x-1]); s = -1; }
  }
  if (s >= 0 && m.w - s > 6) runs.push([s, m.w-1]);
  return runs.map(([x0, x1]) => {
    let y0 = -1, y1 = -1;
    for (let y = 0; y < m.h; y++){
      let any = false;
      for (let x = x0; x <= x1; x++){ if (m.data[(y*m.w+x)*4+3] > 24){ any = true; break; } }
      if (any){ if (y0 < 0) y0 = y; y1 = y; }
    }
    // pusat kaki: 18% baris paling bawah
    const fy0 = Math.max(y0, y1 - Math.round((y1-y0) * 0.18));
    let fx0 = x1, fx1 = x0;
    for (let y = fy0; y <= y1; y++){
      for (let x = x0; x <= x1; x++){
        if (m.data[(y*m.w+x)*4+3] > 24){ if (x < fx0) fx0 = x; if (x > fx1) fx1 = x; }
      }
    }
    const feetX = (fx0 <= fx1) ? (fx0 + fx1) / 2 : (x0 + x1) / 2;
    return { x0, x1, y0, y1, feetX, w:x1-x0+1, h:y1-y0+1, cvs };
  }).filter(b => b.h > 8);
}
/* Jajar SATU SET, bukan satu frame: skala dikira daripada kotak gabungan
   semua frame, dan setiap frame diletak mengikut kedudukan relatifnya
   dalam kanvas asal. Jadi langkah ke hadapan, lompatan dan hayunan yang
   guru lukis kekal betul-betul seperti dilukis.                        */
function renderSet(boxes, CW, CH){
  if (!boxes.length) return [];
  const refH = boxes[0].cvs.height || 1;
  /* Kanvas sumber yang berlainan saiz dinormalkan kepada tinggi frame pertama. */
  const nb = boxes.map(b => {
    const k = refH / (b.cvs.height || refH);
    return { b, x0:b.x0 * k, y0:b.y0 * k, w:b.w * k, hh:b.h * k, k };
  });
  const ux0 = Math.min.apply(null, nb.map(v => v.x0));
  const uy0 = Math.min.apply(null, nb.map(v => v.y0));
  const ux1 = Math.max.apply(null, nb.map(v => v.x0 + v.w));
  const uy1 = Math.max.apply(null, nb.map(v => v.y0 + v.hh));
  const uw = Math.max(1, ux1 - ux0), uh = Math.max(1, uy1 - uy0);
  /* Skala:
       \u2022 menegak ikut KETINGGIAN GABUNGAN \u2014 lompatan memang patut
         mengecilkan sedikit supaya puncaknya tidak terpotong;
       \u2022 mendatar ikut KEPINGAN TERLEBAR, bukan jarak perjalanan \u2014 kalau
         tidak, satu anak panah yang terbang ke hujung kanvas akan
         mengecilkan watak sehingga hampir hilang.
     Perjalanan mendatar yang melampau dikepit di tepi kanvas; itu hanya
     berlaku pada kepingan terpisah seperti peluru, yang guru gabungkan
     semula dengan butang Gabung. */
  const mw = Math.max.apply(null, nb.map(v => v.w));
  const scale = Math.min(2.5, (CH * 0.94) / uh, (CW * 0.96) / mw);
  /* FRAME PERTAMA ialah sauh: tapak kakinya di tengah, dasarnya di paras
     tanah \u2014 peraturan yang sama untuk setiap set, jadi watak tidak
     melompat sedikit bila bertukar daripada menunggu ke menyerang.
     Frame lain diletak mengikut anjakannya daripada frame pertama, jadi
     langkah ke hadapan dan lompatan kekal seperti dilukis. */
  const f0 = nb[0];
  const feet0 = (f0.b.feetX * f0.k - ux0) * scale;
  const base0 = (f0.y0 + f0.hh - uy0) * scale;
  let offX = CW / 2 - feet0;
  let offY = CH * 0.94 - base0;
  /* Jangan biar mana-mana frame terkeluar kanvas. */
  offX = Math.min(Math.max(offX, 0), Math.max(0, CW - uw * scale));
  offY = Math.min(Math.max(offY, 0), Math.max(0, CH - uh * scale));
  return nb.map(v => {
    const c = document.createElement('canvas'); c.width = CW; c.height = CH;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    const dw = v.w * scale, dh = v.hh * scale;
    /* Kedudukan sebenar yang dilukis guru; hanya kepingan yang betul-betul
       terkeluar kanvas ditarik masuk semula. */
    let dx = offX + (v.x0 - ux0) * scale;
    let dy = offY + (v.y0 - uy0) * scale;
    dx = Math.min(Math.max(dx, 0), Math.max(0, CW - dw));
    dy = Math.min(Math.max(dy, 0), Math.max(0, CH - dh));
    x.drawImage(v.b.cvs, v.b.x0, v.b.y0, v.b.w, v.b.h, dx, dy, dw, dh);
    return c;
  });
}
/* Lukis satu frame ke kanvas 512×512: kaki di y=94%, pusat kaki di x=50%, skala SAMA semua frame */
/* Kanvas sprite. Luas melintang untuk larian dan hayunan panjang, tinggi
   untuk lompatan \u2014 set yang muat ketat akan dikecilkan oleh penjajar,
   jadi ruang lapang di sini bermakna watak kekal besar di skrin. */
const SPR_W = 1280, SPR_H = 800;
function renderAligned(box, scale, W, H){
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  const dw = box.w * scale, dh = box.h * scale;
  const footY = H * 0.94;
  const dx = W / 2 - (box.feetX - box.x0) * scale;
  const dy = footY - dh;
  x.drawImage(box.cvs, box.x0, box.y0, box.w, box.h, dx, dy, dw, dh);
  return c;
}
async function prepFrames(files, onProg, opt){
  opt = opt || {};
  prepFrames.keyed = 0; prepFrames.skipped = 0;
  const CW = opt.W || 512, CH = opt.H || 512;

  /* MOD "SATU FAIL = SATU FRAME": gambar diambil SEPERTI DILUKIS. Tiada
     pemotongan, tiada penjajaran semula, tiada penskalaan ikut kandungan.
     Gambar sekadar dimuatkan ke dalam kanvas dengan nisbahnya dikekalkan
     — jadi fail yang sudah bersaiz kanvas masuk satu lawan satu, dan
     anak panah kekal betul-betul di tempat guru melukisnya. */
  if (opt.mode === 'file'){
    const out = [];
    for (let i = 0; i < files.length; i++){
      onProg && onProg('Membaca frame ' + (i+1) + '/' + files.length + '...');
      const { im, url } = await loadImgFile(files[i]);
      const cvs = imgToCanvas(im);
      URL.revokeObjectURL(url);
      if (killBg(cvs)) prepFrames.keyed++; else prepFrames.skipped++;
      const c = document.createElement('canvas'); c.width = CW; c.height = CH;
      const x = c.getContext('2d');
      x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
      const k = Math.min(CW / cvs.width, CH / cvs.height);
      const w = cvs.width * k, hh = cvs.height * k;
      x.drawImage(cvs, 0, 0, cvs.width, cvs.height, (CW - w) / 2, (CH - hh) / 2, w, hh);
      out.push(await encodeTarget(c, { alpha:true, maxB: 34*1024 }));
    }
    if (!out.length) throw new Error('Tiada fail imej dipilih');
    return out;
  }

  const boxes = [];
  for (let i = 0; i < files.length; i++){
    onProg && onProg('Membaca fail ' + (i+1) + '/' + files.length + '...');
    const { im, url } = await loadImgFile(files[i]);
    const cvs = imgToCanvas(im);
    URL.revokeObjectURL(url);
    if (killBg(cvs)) prepFrames.keyed++; else prepFrames.skipped++;   // buang latar pepejal jika ada
    /* Setiap kepingan yang terpisah jadi frame sendiri \u2014 anak panah yang
       sudah terbang pun begitu. Guru menyatukannya semula dengan butang
       Gabung, dan dengan cara ini setiap frame kekal bersaiz penuh. */
    sliceFrames(cvs).forEach(b => boxes.push(b));
  }
  if (!boxes.length) throw new Error('Tiada watak dikesan dalam imej');
  const out = [];
  if (opt.snap){
    /* Mod lama: setiap frame dipusatkan pada tapak kakinya dan dipaku ke
       tanah. Berguna untuk frame yang dilukis berselerak, tetapi ia
       memadamkan pergerakan yang disengajakan. */
    const maxH = Math.max.apply(null, boxes.map(b => b.h));
    const maxW = Math.max.apply(null, boxes.map(b => b.w));
    const scale = Math.min(2.5, (CH * 0.84) / maxH, (CW * 0.94) / maxW);
    for (let i = 0; i < boxes.length; i++){
      onProg && onProg('Menjajar & memampat frame ' + (i+1) + '/' + boxes.length + '...');
      out.push(await encodeTarget(renderAligned(boxes[i], scale, CW, CH), { alpha:true, maxB: 34*1024 }));
    }
    return out;
  }
  const cs = renderSet(boxes, CW, CH);
  for (let i = 0; i < cs.length; i++){
    onProg && onProg('Memampat frame ' + (i+1) + '/' + cs.length + '...');
    out.push(await encodeTarget(cs[i], { alpha:true, maxB: 34*1024 }));
  }
  return out;
}

/* ---------- PENGURUS FRAME: padam frame yang rosak ---------- */
const frRec = (kind, key) => ((kind === 'face' ? S.faces : S.sprites) || {})[key];
function frBase(kind, key){
  const rec = frRec(kind, key) || {};
  const [c, a] = key.split('|');
  return rec.pk || (kind === 'face' ? faceKey(c, a) : sprKey(c, a));
}
const frFrames = (kind, key) => { const [c,a] = key.split('|'); return kind === 'face' ? faceFrames(c,a) : spriteFrames(c,a); };
async function frameDel(kind, key, idx){
  const rec = frRec(kind, key); if (!rec) return;
  const base = frBase(kind, key), urls = rec.urls || [];
  const n = rec.n || 0;
  // buang frame idx
  delete PHOTOS[base + ':' + idx]; await idbDel(base + ':' + idx);
  if (FB.on && urls[idx]) await fbDeleteUrl(urls[idx]);
  if (urls[idx]){ delete PHOTOS[CK(urls[idx])]; await idbDel(CK(urls[idx])); }
  // anjak frame selepasnya ke bawah supaya tiada lompang
  for (let i = idx + 1; i < n; i++){
    const from = base + ':' + i, to = base + ':' + (i-1);
    if (PHOTOS[from] !== undefined){ PHOTOS[to] = PHOTOS[from]; await idbPut(to, PHOTOS[from]); delete PHOTOS[from]; await idbDel(from); }
    urls[i-1] = urls[i];
  }
  urls.length = Math.max(0, n - 1);
  if (Array.isArray(rec.off)) rec.off.splice(idx, 1);
  rec.n = n - 1;
  if (rec.n <= 0) delete (kind === 'face' ? S.faces : S.sprites)[key];
  save(true);
}
/* Cantum frame idx dengan frame selepasnya menjadi satu gambar.
   PENTING: setiap frame ada jajarannya sendiri (anjakan x/y dan saiz) yang
   dilaras oleh guru dalam penjajar. Jajaran itu hanyalah transform CSS —
   ia TIDAK wujud di dalam piksel PNG. Kalau kedua-dua PNG sekadar ditindih,
   anak panah yang sudah dialihkan jauh akan melompat balik ke tempat asalnya
   lalu bertindih dengan watak. Jadi jajaran frame kedua dikira RELATIF
   kepada frame pertama dan dibakar ke dalam piksel, manakala jajaran frame
   pertama kekal menjadi jajaran frame hasil. */
async function frameMerge(kind, key, idx){
  const rec = frRec(kind, key); if (!rec) return false;
  const frames = frFrames(kind, key) || [];
  if (idx < 0 || idx + 1 >= frames.length) return false;
  const load = src => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src;
  });
  const [a, b] = await Promise.all([load(frames[idx]), load(frames[idx + 1])]);
  const W = Math.max(a.naturalWidth, b.naturalWidth), H = Math.max(a.naturalHeight, b.naturalHeight);

  /* Transform yang sama seperti yang dilukis oleh penjajar dan pentas:
       titik' = O + s·(titik − O) + t,   O = (50%, 94%) kanvas
     Maka frame kedua, dilihat dari ruang frame pertama:
       P(p) = O + k·(p − O) + d,   k = sB/sA,   d = (tB − tA)/sA           */
  const off = Array.isArray(rec.off) ? rec.off : (rec.off = []);
  const oa = off[idx] || { x:0, y:0, s:100 }, ob = off[idx + 1] || { x:0, y:0, s:100 };
  const sa = (oa.s || 100) / 100, sb = (ob.s || 100) / 100;
  const OX = W * 0.5, OY = H * 0.94;
  const k = sb / sa;
  const dx = ((ob.x - oa.x) / 100 * W) / sa, dy = ((ob.y - oa.y) / 100 * H) / sa;

  /* Ke mana kandungan kedua-dua frame jatuh selepas transform itu? */
  const boxOn = img => { const t = document.createElement('canvas'); t.width = W; t.height = H;
    t.getContext('2d').drawImage(img, 0, 0, W, H); return opaqueBox(t); };
  const ba = boxOn(a), bb = boxOn(b);
  let U = null;
  const add = (x0, y0, x1, y1) => { U = U
    ? { x0:Math.min(U.x0,x0), y0:Math.min(U.y0,y0), x1:Math.max(U.x1,x1), y1:Math.max(U.y1,y1) }
    : { x0, y0, x1, y1 }; };
  if (ba) add(ba.x0, ba.y0, ba.x1 + 1, ba.y1 + 1);
  if (bb){
    const mx = p => dx + OX + k * (p - OX), my = p => dy + OY + k * (p - OY);
    const X0 = mx(bb.x0), X1 = mx(bb.x1 + 1), Y0 = my(bb.y0), Y1 = my(bb.y1 + 1);
    add(Math.min(X0,X1), Math.min(Y0,Y1), Math.max(X0,X1), Math.max(Y0,Y1));
  }
  /* Kalau hasilnya terkeluar kanvas, seluruh gambar digeser masuk semula dan
     geseran itu DIBAYAR BALIK pada jajaran frame hasil — jadi rupanya di skrin
     tidak berubah walaupun pikselnya beralih. Kalau ia memang lebih lebar
     daripada kanvas, sebahagiannya terpaksa dipotong dan guru diberitahu. */
  let shx = 0, shy = 0, cut = false;
  if (U){
    if (U.x1 - U.x0 > W) cut = true;
    else shx = U.x0 < 0 ? -U.x0 : (U.x1 > W ? W - U.x1 : 0);
    if (U.y1 - U.y0 > H) cut = true;
    else shy = U.y0 < 0 ? -U.y0 : (U.y1 > H ? H - U.y1 : 0);
  }

  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.setTransform(1, 0, 0, 1, shx, shy);
  x.drawImage(a, 0, 0, W, H);
  x.setTransform(1, 0, 0, 1, shx, shy);
  x.translate(dx, dy); x.translate(OX, OY); x.scale(k, k); x.translate(-OX, -OY);
  x.drawImage(b, 0, 0, W, H);
  x.setTransform(1, 0, 0, 1, 0, 0);

  /* Jajaran frame hasil = jajaran frame pertama, tolak geseran tadi. */
  off[idx] = { x:+(oa.x - sa * shx / W * 100).toFixed(2),
               y:+(oa.y - sa * shy / H * 100).toFixed(2), s:oa.s || 100 };
  const data = await encodeTarget(c, { alpha:true, maxB: 34*1024 });
  const base = frBase(kind, key);
  /* frame idx ditulis semula dengan hasil cantuman */
  PHOTOS[base + ':' + idx] = data;
  await idbPut(base + ':' + idx, data);
  const su = await assetSave(base + ':' + idx, data, 'sprites/' + key.replace('|','_') + '_' + idx + '_' + stamp() + '.png');
  if (su){ (rec.urls || (rec.urls = []))[idx] = su; PHOTOS[CK(su)] = data; await idbPut(CK(su), data); }
  save(true);
  /* frame kedua dibuang; frameDel menganjak selebihnya rapat */
  await frameDel(kind, key, idx + 1);
  return { ok:true, cut };
}

/* ---------- PENJAJAR PELURU ----------
   Kotak ini sebesar KANVAS WATAK, bukan sebesar gambar anak panah, dan
   frame pelepasan lakonan serangan dipaparkan di belakangnya. Jadi guru
   meletakkan anak panah tepat pada busur, dengan saiz yang betul — dan
   di situlah ia mula terbang dalam pertarungan, sebesar itu juga.       */
function ammoAlign(c){
  const rec = (S.sprites || {})[c + '|ammo'];
  const src = (spriteFrames(c, 'ammo') || [])[0];
  if (!rec || !src) return toast('Muat naik gambar peluru dahulu.', null, true);
  const atk = spriteFrames(c, 'attack') || spriteFrames(c, 'idle') || [];
  const ar = (S.sprites || {})[c + '|attack'] || (S.sprites || {})[c + '|idle'] || {};
  const rf = Math.min(relFrame(c), Math.max(0, atk.length - 1));
  const bg = atk[rf] || null;
  const bo = (ar.off && ar.off[rf]) || { x:0, y:0, s:100 };
  const ratio = (ar.w && ar.h) ? ar.w / ar.h : SPR_W / SPR_H;
  const marked = ar.rel !== undefined && ar.rel !== null;
  const an = Object.assign({}, ammoAnchor(c));
  let step = 1;
  const btn = (k, ico, extra) => '<button class="btn clip-s !py-2' + (extra || '') + '" data-am="' + k + '"><i class="fa-solid ' + ico + '"></i></button>';
  let onAmClose = null;
  const id = openModal({ icon:'fa-crosshairs', title:'Jajar Peluru — ' + charName(c),
    body:
      '<div id="amStage" style="position:relative;width:100%;aspect-ratio:' + ratio + ';background:#0A0F15;border:1px solid var(--line);overflow:hidden">' +
        (bg ? '<img id="amBg" src=' + JSON.stringify(bg) + ' style="position:absolute;left:0;bottom:0;width:100%;opacity:.9;' +
              'transform-origin:50% 94%;transform:translate(' + bo.x + '%,' + bo.y + '%) scale(' + ((bo.s || 100) / 100) + ')">' : '') +
        '<div style="position:absolute;left:0;right:0;bottom:6%;height:1px;background:rgba(255,107,0,.5)"></div>' +
        '<div id="amH" style="position:absolute;top:0;bottom:0;width:0;border-left:1px dashed rgba(255,215,106,.6)"></div>' +
        '<div id="amV" style="position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,215,106,.6)"></div>' +
        '<img id="amImg" src=' + JSON.stringify(src) + ' style="position:absolute;height:auto;transform:translate(-50%,-50%);' +
          'filter:drop-shadow(0 0 3px #FFD76A)">' +
      '</div>' +
      '<div class="text-[10px] text-muted leading-snug mt-1">' + (bg
        ? 'Latar = <b>frame ' + (rf + 1) + '</b> lakonan serangan ' +
          (marked ? '(frame pelepasan yang anda tanda).' : '(anggaran app — tandakan frame pelepasan dalam Jajar Frame Serangan).') +
          ' Letak peluru tepat di tempat ia meninggalkan senjata. Di sinilah ia mula terbang, dan sebesar inilah ia di skrin.'
        : 'Belum ada lakonan serangan — muat naik dahulu supaya ada rujukan untuk menjajar.') + '</div>' +
      '<div class="grid grid-cols-3 gap-1 mt-3" id="amPad" style="max-width:190px;margin:0 auto;' +
          'touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none">' +
        '<div></div>' + btn('u', 'fa-chevron-up') + '<div></div>' +
        btn('l', 'fa-chevron-left') + btn('c', 'fa-crosshairs text-cyan') + btn('r', 'fa-chevron-right') +
        '<div></div>' + btn('d', 'fa-chevron-down') + '<div></div>' +
      '</div>' +
      '<div class="num text-[10px] text-muted text-center mt-1" id="amPos"></div>' +
      '<div class="flex items-center gap-1 mt-2" style="touch-action:none;user-select:none;-webkit-user-select:none">' +
        btn('zm', 'fa-magnifying-glass-minus', ' !px-3') +
        '<div class="flex-1 text-center"><div class="lbl">SAIZ PELURU</div><div class="num text-[15px]" id="amSz"></div></div>' +
        btn('zp', 'fa-magnifying-glass-plus', ' !px-3') +
      '</div>' +
      '<div class="flex gap-2 mt-2">' +
        '<button class="btn clip-s flex-1 text-[12px]" data-am="fine">Saiz langkah: <span class="num" id="amStep">1.0%</span></button>' +
        '<button class="btn clip-s flex-1 text-[12px]" data-am="reset">Reset</button>' +
      '</div>',
    footer:'<button class="btn clip-s flex-1" data-close="1">Tutup</button><button class="btn btn-o clip-s flex-1" data-am="save">Simpan</button>',
    onClose: () => { if (onAmClose) onAmClose(); } });
  const bd = $('[data-modal="' + id + '"]');
  const draw = () => {
    const im = $('#amImg', bd);
    im.style.left = an.x + '%'; im.style.top = an.y + '%'; im.style.width = an.w + '%';
    $('#amH', bd).style.left = an.x + '%';
    $('#amV', bd).style.top = an.y + '%';
    $('#amPos', bd).textContent = 'X ' + an.x.toFixed(1) + '%  ·  Y ' + an.y.toFixed(1) + '%';
    $('#amSz', bd).textContent = an.w.toFixed(1) + '%';
    $('#amStep', bd).textContent = step.toFixed(1) + '%';
  };
  const r1 = v => +v.toFixed(1);
  const move = k => {
    if (k === 'u') an.y = r1(clamp(an.y - step, 0, 100));
    if (k === 'd') an.y = r1(clamp(an.y + step, 0, 100));
    if (k === 'l') an.x = r1(clamp(an.x - step, 0, 100));
    if (k === 'r') an.x = r1(clamp(an.x + step, 0, 100));
    if (k === 'zm') an.w = r1(clamp(an.w - step, 1, 80));
    if (k === 'zp') an.w = r1(clamp(an.w + step, 1, 80));
    draw();
  };
  const REP = { u:1, d:1, l:1, r:1, zm:1, zp:1 };
  /* Tekan dan tahan = berulang, sama seperti penjajar frame. Fasa tangkap,
     kerana panel modal menghentikan perambatan pointerdown/pointerup. */
  let holdT = null, eat = false;
  const stopH = () => { clearTimeout(holdT); holdT = null; };
  bd.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-am]'); if (!b || !REP[b.dataset.am]) return;
    e.preventDefault(); stopH(); eat = true;
    const k = b.dataset.am; move(k);
    let n = 0;
    const tick = () => { move(k); n++; holdT = setTimeout(tick, n < 4 ? 140 : n < 12 ? 80 : 45); };
    holdT = setTimeout(tick, 380);
  }, true);
  const ENDS = ['pointerup', 'pointercancel', 'blur'];
  ENDS.forEach(ev => window.addEventListener(ev, stopH, true));
  onAmClose = () => { stopH(); ENDS.forEach(ev => window.removeEventListener(ev, stopH, true)); };
  bd.addEventListener('click', e => {
    const b = e.target.closest('[data-am]'); if (!b) return;
    const k = b.dataset.am;
    if (REP[k]){ if (eat){ eat = false; return; } move(k); return; }
    if (k === 'c'){ an.x = AMMO_DEF.x; an.y = AMMO_DEF.y; draw(); return; }
    if (k === 'reset'){ Object.assign(an, AMMO_DEF); draw(); return; }
    if (k === 'fine'){ step = step === 1 ? 0.2 : step === 0.2 ? 0.5 : 1; draw(); return; }
    if (k === 'save'){
      rec.anchor = { x:an.x, y:an.y, w:an.w };
      save(true); closeModal(id); toast('Kedudukan & saiz peluru disimpan.');
    }
  });
  draw();
  return id;
}
/* ============ ARAHAN DI SEBALIK "?" ============
   Perenggan penerangan yang panjang menyesakkan skrin telefon. Ia disorok
   dan diganti dengan butang "?" kecil; tekan untuk membacanya.
   Automatik untuk seluruh app: perenggan kelabu (text-muted) yang kecil,
   panjang, tiada butang atau input di dalamnya, dan bukan teks dinamik
   (tiada id). Maklumat lain boleh ditanda terus dengan data-hint="Tajuk".
   data-nohint mengecualikan (contoh: sinopsis cerita).                  */
const hintsInline = () => !!(S && S.config && S.config.hintsInline === 1);
const HINT_SKIP = '[data-nohint],#tgWrap,#tgCut,#tgHelp,#dlgBox,.hint-pop';
function hintCandidate(el){
  if (el.__hintDone || el.nodeType !== 1) return false;
  if (el.hasAttribute('data-hint')) return !el.closest(HINT_SKIP);
  if (el.id) return false;
  const c = el.className;
  if (typeof c !== 'string' || c.indexOf('text-muted') < 0 || !/text-\[(9|10|11|12)px\]/.test(c)) return false;
  if (el.closest(HINT_SKIP)) return false;
  /* teks di dalam butang atau baris satu-garis ialah maklumat baris, bukan arahan */
  if (el.closest('button,[data-sb],[data-act]') || /\btruncate\b/.test(c)) return false;
  if (el.querySelector('button,input,select,textarea,canvas,img,[id]')) return false;
  return el.textContent.trim().length >= 60;
}
function hintScan(root){

      sb.innerHTML = '<i class="fa-solid ' + (stg ? 'fa-magnifying-glass-plus text-cyan' : 'fa-ruler-horizontal text-cyan') + '"></i> ' +
        (stg ? 'Balik ke paparan DEKAT' : 'Lihat PENTAS \u2014 di mana lawan berdiri');
      sb.classList.toggle('btn-o', stg);
    }
    const cp = $('#alCap', bd);
    if (cp) cp.innerHTML = !gap
      ? 'Garis cyan = pusat · garis oren = paras kaki. Onion skin kelabu = frame pertama.'
      : (stg
        ? 'Di sinilah lawan berdiri: garis <b style="color:#FF3B6B">merah</b> bila anda menyerang dari <b>jarak jauh</b>, ' +
            'garis <b style="color:#9AA7B4">kelabu</b> bila <b>jarak dekat</b>. Kanvas anda hanya selebar <b>1\u00D7</b>, ' +
            'jadi anak panah memang tidak boleh sampai di dalam frame \u2014 lukis ia <b>KELUAR di tepi kanan</b> pada ' +
            'frame terakhir, pada paras tinggi badan lawan, dan mata akan melengkapkan sendiri selebihnya.'
        : 'Garis cyan = pusat · garis oren = paras kaki. Onion skin kelabu = frame pertama.');
  };
  /* ---------- AKSI PAD ----------
     Diasingkan daripada pengendali klik supaya ketikan dan tahan-tekan
     menjalankan kerja yang betul-betul sama. */
  const doScale = d => {
    /* Saiz hampir selalu sama untuk seluruh set, jadi lalainya satu
       larasan mengubah semua frame sekali gus. */
    const targets = all ? rec.off : [rec.off[cur]];
    targets.forEach(o => { if (o) o.s = d === 0 ? 100 : clamp((o.s || 100) + d, 30, 250); });
    draw();
  };
  const doNudge = (dx, dy) => {
    const targets = all ? rec.off : [rec.off[cur]];
    if (!dx && !dy) targets.forEach((o, i) => { if (o) rec.off[all ? i : cur] = { x:0, y:0, s:100 }; });
    else targets.forEach(o => { if (!o) return;
      o.x = +(o.x + dx*step).toFixed(1); o.y = +(o.y + dy*step).toFixed(1); });
    draw();
  };
  const doStep = d => {
    clearInterval(ptimer); playing = false;
    cur = (cur + d + frames.length) % frames.length;        // pusing balik di hujung
    draw();
  };

  /* ---------- TEKAN DAN TAHAN ----------
     Satu ketikan = satu langkah. Tahan = langkah berulang yang makin laju,
     supaya guru tidak perlu mengetuk tiga puluh kali untuk menggerakkan
     frame merentas kanvas. */
  let holdT = null, eatClick = false;
  const holdStop = () => { clearTimeout(holdT); holdT = null; };
  const holdStart = fn => {
    holdStop();
    eatClick = true;                 // klik selepas pointerdown jangan ulang kerja
    fn();
    let n = 0;
    const tick = () => { fn(); n++; holdT = setTimeout(tick, n < 4 ? 140 : n < 12 ? 80 : 45); };
    holdT = setTimeout(tick, 380);   // jeda dahulu supaya ketikan biasa tidak berulang
  };
  /* FASA TANGKAP (capture). Panel modal sengaja menghentikan perambatan
     pointerdown/pointerup supaya klik pada panel tidak menutup modal, jadi
     pendengar fasa gelembung di sini TIDAK akan dipanggil langsung. */
  bd.addEventListener('pointerdown', e => {
    const nd = e.target.closest('[data-nudge]');
    if (nd){
      const [dx, dy] = nd.dataset.nudge.split(',').map(Number);
      if (!dx && !dy) return;        // silang tengah = set semula, sekali sahaja
      e.preventDefault(); holdStart(() => doNudge(dx, dy)); return;
    }
    const sc = e.target.closest('[data-sc]');
    if (sc){
      const d = parseInt(sc.dataset.sc, 10);
      if (!d) return;                // butang pulih 100%, sekali sahaja
      e.preventDefault(); holdStart(() => doScale(d)); return;
    }
    const fs = e.target.closest('[data-fstep]');
    if (fs){ e.preventDefault(); holdStart(() => doStep(parseInt(fs.dataset.fstep, 10))); }
  }, true);
  /* Jari boleh dilepaskan di mana-mana \u2014 di luar butang, di luar modal,
     atau di luar tetingkap. Semuanya mesti menghentikan ulangan. Sekali lagi
     fasa TANGKAP, kerana panel modal menghentikan perambatan pointerup. */
  const endHold = () => holdStop();
  const ENDS = ['pointerup','pointercancel','blur'];
  ENDS.forEach(ev => window.addEventListener(ev, endHold, true));
  onAlClose = () => { holdStop(); ENDS.forEach(ev => window.removeEventListener(ev, endHold, true)); };
  draw();
  bd.addEventListener('click', e => {
    const fr = e.target.closest('[data-fr]');
    if (fr){ cur = parseInt(fr.dataset.fr,10); draw(); return; }
    const fs = e.target.closest('[data-fstep]');
    if (fs){ if (eatClick){ eatClick = false; return; } doStep(parseInt(fs.dataset.fstep, 10)); return; }
    const sc = e.target.closest('[data-sc]');
    if (sc){ if (eatClick){ eatClick = false; return; } doScale(parseInt(sc.dataset.sc, 10)); return; }
    const nd = e.target.closest('[data-nudge]');
    if (nd){
      if (eatClick){ eatClick = false; return; }
      const [dx, dy] = nd.dataset.nudge.split(',').map(Number);
      doNudge(dx, dy); return;
    }
    if (e.target.closest('[data-alall]')){ all = !all; draw(); return; }
    const al = e.target.closest('[data-al]'); if (!al) return;
    if (al.dataset.al === 'rel'){
      /* Tekan pada frame yang sudah ditanda = buang tanda, kembali kepada
         anggaran app. */
      rec.rel = (rec.rel === cur) ? undefined : cur;
      if (rec.rel === undefined) delete rec.rel;
      save(true); draw();
      toast(rec.rel === undefined ? 'Tanda pelepasan dibuang \u2014 app akan menganggar.'
                                  : 'Peluru dilepaskan pada frame ' + (cur+1) + '.');
      return;
    }
    if (al.dataset.al === 'stage'){ stg = !stg; draw(); return; }
    if (al.dataset.al === 'ref'){ showRef = !showRef; S.ui.alRef = showRef ? 1 : 0; save(); draw(); return; }
    if (al.dataset.al === 'match'){
      /* Skala SEMUA frame set ini dengan faktor yang sama, supaya frame
         pertama setinggi rujukan dan pergerakan antara frame kekal. */
      if (!refPct) return toast('Sedang mengukur\u2026 cuba lagi.', null, true);
      const f = 100 / refPct;
      rec.off.forEach(o => { if (o) o.s = clamp(Math.round((o.s || 100) * f), 30, 250); });
      draw();
      toast('Semua ' + frames.length + ' frame diskala ' + Math.round(f * 100) + '% \u2014 tekan Simpan Jajaran.');
      return;
    }
    if (al.dataset.al === 'fine'){ step = step === 1 ? 0.2 : step === 0.2 ? 0.5 : 1; draw(); return; }
    if (al.dataset.al === 'reset'){ rec.off = frames.map(()=>({x:0,y:0,s:100})); draw(); return; }
    if (al.dataset.al === 'play'){
      playing = !playing;
      clearInterval(ptimer);
      if (playing){
        ptimer = setInterval(() => { cur = (cur + 1) % frames.length; draw(); }, 1000 / ((S.config.spriteFps)||8));
      }
      return;
    }
    if (al.dataset.al === 'del'){
      clearInterval(ptimer); playing = false;
      confirmBox({ danger:true, title:'Padam Frame', okText:'Padam',
        message:'Padam frame <b>'+(cur+1)+'</b> daripada '+frames.length+' dalam aksi ini? Frame selepasnya akan dianjak rapat.' })
      .then(async ok => {
        if (!ok) return;
        await frameDel(a0, key, cur);
        closeModal(id);
        const left = frFrames(a0, key);
        toast('Frame dipadam.');
        closeTop(); spriteManager();
        if (left && left.length) setTimeout(() => spriteAlign(key, a0), 220);
      });
      return;
    }
    if (al.dataset.al === 'merge'){
      clearInterval(ptimer); playing = false;
      if (cur >= frames.length - 1) return;
      confirmBox({ title:'Gabung Frame', okText:'Gabung',
        message:'Cantumkan frame <b>'+(cur+1)+'</b> dan <b>'+(cur+2)+'</b> menjadi satu gambar? ' +
          'Berguna bila satu lakonan terpotong dua \u2014 contohnya anak panah yang terbang jauh daripada pemanah.' })
      .then(async ok => {
        if (!ok) return;
        const at = cur;
        let res;
        try { res = await frameMerge(a0, key, at); } catch(err){ return toast('Gagal menggabung frame.', null, true); }
        closeModal(id); closeTop(); spriteManager();
        if (res && res.cut)
          toast('Digabung, tetapi jarak antara dua frame itu lebih lebar daripada kanvas, ' +
                'jadi bahagian yang terkeluar terpaksa dipotong.', null, true);
        else toast('Frame ' + (at+1) + ' + ' + (at+2) + ' digabung — kedudukan jajaran dikekalkan.');
        const left = frFrames(a0, key);
        if (left && left.length) setTimeout(() => spriteAlign(key, a0), 220);
      });
      return;
    }
    if (al.dataset.al === 'save'){ save(true); closeModal(id); toast('Jajaran disimpan.'); }
  });
}

/* Cache kekal: URL Firebase disalin ke IndexedDB supaya sesi seterusnya tidak perlu rangkaian */
const CK = u => 'cache:' + u;
const resolveUrl = u => (u && PHOTOS[CK(u)]) || u;
const isLocalData = u => !u || u.indexOf('data:') === 0 || !!PHOTOS[CK(u)];
async function cacheRemote(url){
  if (!url || url.indexOf('data:') === 0 || PHOTOS[CK(url)]) return;
  try {
    const r = await fetch(url, { mode:'cors', cache:'force-cache' });
    if (!r.ok) return;
    const b = await r.blob();
    const d = await new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(b); });
    PHOTOS[CK(url)] = d; await idbPut(CK(url), d);
  } catch(e){}
}
function spriteFrames(c, a){
  const rec = (S.sprites||{})[c + '|' + a];
  if (!rec || !rec.n) return null;
  const base = rec.pk || sprKey(c, a);
  const out = [];
  for (let i = 0; i < rec.n; i++){
    const u = resolveUrl((rec.urls || [])[i]) || PHOTOS[base + ':' + i];
    if (u) out.push(u);
  }
  return out.length ? out : null;
}
/* Watak yang benar-benar ada frame idle */

}
function spriteFramesOr(g, a){

/* ---------- PELURU TERBANG ----------
   Sprite serangan berakhir di tepi kanvasnya sendiri, manakala lawan berdiri

   objek berasingan, TEPAT pada frame yang guru tandakan sebagai pelepasan,
   supaya lakonan tangan dan penerbangan anak panah bersambung.            */
const isRangedUnit = u => ((roleOf(u.role).rng) || [1,1])[1] > 1;

/* Frame mana watak melepaskan peluru. Tanpa tanda, app ambil kira-kira
   pertengahan akhir lakonan, tempat hayunan biasanya selesai. */
function relFrame(c){
  const rec = (S.sprites || {})[c + '|attack'];
  const n = (spriteFrames(c, 'attack') || []).length;
  if (!n) return 0;
  const r = rec && rec.rel;
  return (r === undefined || r === null || r < 0 || r >= n) ? Math.max(0, Math.round(n * 0.55) - 1) : r;

/* Di mana peluru terletak pada frame pelepasan, dan sebesar mana — dalam
   ruang KANVAS WATAK, seperti yang guru jajarkan di atas frame itu sendiri. */
const AMMO_DEF = { x:62, y:52, w:14 };
function ammoAnchor(c){
  const r = (S.sprites || {})[c + '|ammo'];

  return (a && isFinite(a.x) && isFinite(a.y) && isFinite(a.w)) ? a : AMMO_DEF;

function flyShot(fromEl, toEl, col, char, ms, hostEl){
  const host = hostEl || (fromEl && fromEl.parentElement);

  const H = host.getBoundingClientRect(), A = fromEl.getBoundingClientRect(), B = toEl.getBoundingClientRect();
  if (!H.width || !H.height) return sleep(ms);
  const dir = (B.left + B.width / 2) >= (A.left + A.width / 2) ? 1 : -1;
  const px = (v, o, d) => (v - o) / d * 100;
  /* Bermula TEPAT di tempat guru meletakkan peluru pada frame pelepasan
     (dicerminkan bagi petarung di kanan), terbang mendatar ke tengah
     badan lawan pada paras yang sama. */
  const an = ammoAnchor(char);
  const ax = (dir > 0 ? an.x : 100 - an.x) / 100;
  const x0 = px(A.left + A.width * ax, H.left, H.width);
  const y0 = px(A.top  + A.height * an.y / 100, H.top, H.height);
  const x1 = px(B.left + B.width * 0.50, H.left, H.width);
  const y1 = px(B.top  + B.height * an.y / 100, H.top, H.height);
  const wPct = (A.width * an.w / 100) / H.width * 100;
  const ar = (S.sprites || {})[char + '|ammo'];
  const asp = (ar && ar.w && ar.h) ? ar.w / ar.h : 5;
  const src = (spriteFrames(char, 'ammo') || [])[0];
  const el = document.createElement('div');
  el.setAttribute('data-shot', '1');
  el.style.cssText = 'position:absolute;left:' + x0.toFixed(2) + '%;top:' + y0.toFixed(2) + '%;' +
    /* translate() pada transform dikira daripada saiz elemen itu sendiri —
       margin peratus pula SELALU dikira daripada LEBAR bapa, termasuk
       margin-top, jadi ia tidak boleh dipakai untuk memusat menegak. */
    /* Tinggi dikira terus: aspect-ratio boleh ditolak oleh tinggi semula jadi
       gambar di dalamnya (saiz minimum automatik), lalu peluru jadi tinggi. */
    'width:' + wPct.toFixed(3) + '%;height:' + (wPct * H.width / asp / H.height).toFixed(3) + '%;' +
    'pointer-events:none;z-index:6;' +
    'transform:translate(-50%,-50%) scaleX(' + dir + ');' +
    'transition:left ' + ms + 'ms linear, top ' + ms + 'ms linear;';
  el.innerHTML = src
    ? '<img decoding="sync" src=' + JSON.stringify(src) + ' style="width:100%;height:100%;object-fit:contain;' +
        'filter:drop-shadow(0 0 6px ' + col + ')">'

/* ---------- GEOMETRI PENTAS LAKONAN DEKAT ----------
   Petarung kiri duduk di left:PAD%, petarung kanan di right:PAD%, dan
   kanvas sprite masing-masing selebar duelW()% daripada pentas. PAD
   bergantung kepada kelas penyerang: jarak jauh berdiri jauh ke tepi,
   jarak dekat berdiri hampir bertemu di tengah.                        */
const DUEL_PAD_FAR = 3;                  // serangan jarak jauh \u2014 dua tapak berpisah
const DUEL_PAD_NEAR = 19;                // serangan jarak dekat \u2014 satu tapak bersambung

/* Di manakah LAWAN berdiri, diukur dalam unit LEBAR KANVAS sprite kita
   sendiri, dari tepi KIRI kanvas itu? Jawapan ini yang membolehkan guru
   melukis anak panah sejauh yang betul.
     edge = tepi kanvas lawan yang paling hampir
     mid  = pusat kanvas lawan, iaitu tempat badannya berdiri            */
function stageGap(ratio){
  const w = duelW(ratio);
  const at = pad => ({ edge:(100 - 2*pad - w) / w, mid:(100 - 2*pad - w/2) / w });
  return { near:at(DUEL_PAD_NEAR), far:at(DUEL_PAD_FAR), w };
}

const faceKey = (c, a) => 'face:' + c + '|' + a;
function faceFrames(c, a){
  const rec = (S.faces || {})[c + '|' + a];
  if (!rec || !rec.n) return null;
  const base = rec.pk || faceKey(c, a);
  const out = [];
  for (let i = 0; i < rec.n; i++){
    const u = resolveUrl((rec.urls || [])[i]) || PHOTOS[base + ':' + i];
    if (u) out.push(u);
  }
  return out.length ? out : null;
}
function faceFramesOr(c, a){
  const g = String(c).charAt(0);
  return faceFrames(c, a) || faceFrames(c, 'idle') || faceFrames(g+'1', a) || faceFrames(g+'1', 'idle');
}
const faceReady = () => CHARS().some(c => faceFrames(c.id, 'idle'));
function makeFace(box, charId){
  let timer = null, shown = null;
  const cache = {};
  const build = act => {
    if (cache[act]) return cache[act];
    const f = faceFramesOr(charId, act) || [];
    const rec = (S.faces||{})[charId + '|' + act] || {};
    cache[act] = f.map((src, i) => {
      const im = document.createElement('img');
      const off = (rec.off || [])[i];
      const s = (off && off.s ? off.s : 100) / 100;
      im.decoding = 'sync';
      im.src = src;
      decImg(im);
      im.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;' +
        'transform:translate(' + (off ? off.x : 0) + '%,' + (off ? off.y : 0) + '%) scale(' + s + ');';
      box.appendChild(im);
      return im;
    });
    return cache[act];
  };
  const show = im => { if (shown && shown !== im) shown.style.display = 'none'; if (im){ im.style.display = 'block'; shown = im; } };
  /* Jangan sorok muka semasa sebelum muka baharu benar-benar sedia —
     kalau tidak kotak muka kosong sekejap setiap kali ekspresi bertukar. */
  let pend = null;
  const showReady = im => {
    if (!im) return Promise.resolve(false);
    if (DECODED.has(im)){ pend = null; show(im); return Promise.resolve(true); }
    pend = im;
    return decImg(im).then(() => { if (pend === im){ pend = null; show(im); } return true; });
  };
  const play = act => {
    clearInterval(timer);
    const arr = build(act);
    if (!arr.length) return Promise.resolve(false);
    let i = 0;
    const first = showReady(arr[0]);
    if (arr.length > 1)
      timer = setInterval(() => { i = (i + 1) % arr.length; showReady(arr[i]); }, 1000 / Math.max(2, ((S.config.spriteFps)||8) / 2));
    return first;
  };
  /* Bina semua ekspresi awal-awal (tersembunyi) supaya ia siap dinyahkod. */
  const warm = () => Promise.all([].concat.apply([], FACE_ACTIONS.map(a => build(a.k).map(decImg))));
  return { play, warm, stop: () => clearInterval(timer), box };
}

/* SDLG: baris dialog NPC babak cerita menggantikan ayat generik.
   SQT: ejekan + huraian khusus bagi SETIAP soalan babak itu, dikunci pada
   id soalan, supaya jawapan salah dibalas dengan penjelasan yang betul-betul
   berkaitan soalan yang baru sahaja tersilap. */
let SDLG = null, SQT = null;
/* Ejekan dipilih mengikut pilihan yang pelajar betul-betul tekan: setiap
   jawapan salah ada ejekan + huraiannya sendiri, jadi penjelasan menjawab
   kesilapan yang ITU, bukan kesilapan umum. Urutan keutamaan:
   ejek pilihan itu > huraian jawapan betul (masa tamat) > ejek lama babak. */
function sTaunt(q, ans, pick){
  if (!q) return null;
  const sub = t => String(t).replace(/\{a\}/g, ans === undefined ? '' : ans);
  const per = q.ejek;
  if (per && pick !== undefined && pick !== null && pick >= 0){
    const t = Array.isArray(per) ? per[pick] : per[String(pick)];
    if (t) return sub(t);
  }
  if (q.huraian) return sub(q.huraian);
  /* masa tamat tanpa pilihan: mana-mana huraian soalan itu masih mengajar */
  if (Array.isArray(per)){
    const first = per.find(Boolean);
    if (first) return sub(first);
  }
  if (SQT && q.id && SQT[q.id]) return sub(SQT[q.id]);
  return null;
}

/* ---------- PRAPEMUATAN (elak animasi tersekat) ---------- */
let SPR_READY = false;
const SPR_DONE = {};
const SPR_URLS = chars => {
  const list = (chars && chars.length) ? chars : charsReady().map(c => c.id);
  const out = [];
  list.forEach(c => SPR_ACTIONS.concat(MAP_ACTIONS).forEach(a => { const f = spriteFrames(c, a.k); if (f) f.forEach(u => out.push(u)); }));
  list.forEach(c => FACE_ACTIONS.forEach(a => { const f = faceFrames(c, a.k); if (f) f.forEach(u => out.push(u)); }));
  const bg = arenaBg(); if (bg) out.push(bg);
  allMaps().forEach(m => tmapLayers(m).forEach(l => out.push(l.url)));
  GROUNDS.forEach(g => { const u = groundUrl(g.k); if (u) out.push(u); });
  { const u = hpbUrl(); if (u) out.push(u); }
  { const u = dlgfUrl(); if (u) out.push(u); }
  return out.filter(u => !SPR_DONE[u]);
};
/* Gelombang pertama: hanya apa yang PAPAN sendiri perlu untuk dilukis —
   token di atas petak, rupa bumi dan bingkai UI. Animasi lakonan dekat
   (berjalan, menyerang) tidak diperlukan sehingga serangan pertama, dan
   itu beberapa saat kemudian; ia menyusul di latar.                     */
const SPR_CORE = chars => {
  const list = (chars && chars.length) ? chars : charsReady().map(c => c.id);
  const out = [];
  list.forEach(c => MAP_ACTIONS.forEach(a => { const f = spriteFrames(c, a.k); if (f) f.forEach(u => out.push(u)); }));
  list.forEach(c => { const f = spriteFrames(c, 'idle'); if (f && f[0]) out.push(f[0]); });
  GROUNDS.forEach(g => { const u = groundUrl(g.k); if (u) out.push(u); });
  { const u = hpbUrl(); if (u) out.push(u); }
  { const u = dlgfUrl(); if (u) out.push(u); }
  const seen = {};
  return out.filter(u => u && !SPR_DONE[u] && !seen[u] && (seen[u] = 1));
};
/* Gelombang kedua: animasi lakonan dekat dan muka — diperlukan sebaik
   sahaja serangan pertama berlaku, jadi ia didahulukan antara yang tinggal. */
const SPR_NEXT = chars => {
  const list = (chars && chars.length) ? chars : charsReady().map(c => c.id);
  const out = [];
  const acts = SPR_ACTIONS.filter(a => a.need);
  list.forEach(c => acts.forEach(a => { const f = spriteFrames(c, a.k); if (f) f.forEach(u => out.push(u)); }));
  list.forEach(c => FACE_ACTIONS.forEach(a => { const f = faceFrames(c, a.k); if (f) f.forEach(u => out.push(u)); }));
  const seen = {};
  return out.filter(u => u && !SPR_DONE[u] && !seen[u] && (seen[u] = 1));
};
const IMG_KEEP = new Map();
const DECODED = new WeakSet();
function decImg(im){
  if (!im) return Promise.resolve(null);
  if (DECODED.has(im)) return Promise.resolve(im);
  const p = im.decode ? im.decode() : new Promise((r, j) => {
    if (im.complete && im.naturalWidth) return r(); im.addEventListener('load', r, { once:true }); im.addEventListener('error', j, { once:true }); });
  return p.then(() => { DECODED.add(im); return im; }, () => { DECODED.add(im); return im; });
}
/* Semua yang sebuah pertempuran perlukan untuk watak yang BERTANDING:
   token papan, badan (menunggu + serangan), peluru, SETIAP ekspresi muka
   (termasuk muka gantian), tapak, bingkai UI dan latar Arena. Latar peta
   lain tidak termasuk — ia dimuat senyap kemudian.                   */
const SPR_BATTLE = chars => {
  const list = (chars && chars.length) ? chars : charsReady().map(c => c.id);
  const out = SPR_CORE(chars).concat(SPR_NEXT(chars));
  list.forEach(c => { const f = spriteFrames(c, 'ammo'); if (f) f.forEach(u => out.push(u)); });
  list.forEach(c => FACE_ACTIONS.forEach(a => { const f = faceFramesOr(c, a.k); if (f) f.forEach(u => out.push(u)); }));
  const bg = arenaBg(); if (bg) out.push(bg);
  const seen = {};
  return out.filter(u => u && !SPR_DONE[u] && !seen[u] && (seen[u] = 1));
};
function preloadOne(url){
  if (!url) return Promise.resolve(null);
  const kept = IMG_KEEP.get(url);
  if (kept) return Promise.resolve(kept);
  return new Promise(res => {
    const im = new Image();
    const keep = () => { IMG_KEEP.set(url, im); res(im); };
    im.onload = () => { if (im.decode) im.decode().then(keep).catch(keep); else keep(); };
    im.onerror = () => res(null);
    im.src = url;
  });
}
/* Muat turun senyap di latar: tiada skrin, tiada sekatan. Kalau pemain
   memulakan pertempuran sebelum ia habis, aset yang tinggal diambil oleh
   pelayar sendiri bila gambar itu dipaparkan. */
let SPR_BG = false;
async function preloadQuiet(urls){
  if (SPR_BG || !urls.length) return;
  SPR_BG = true;
  const q = urls.slice();
  const job = async u => { await cacheRemote(u); await preloadOne(resolveUrl(u)); SPR_DONE[u] = 1; };
  const w = [];
  for (let i = 0; i < 6; i++) w.push((async () => { while (q.length) await job(q.shift()); })());
  try { await Promise.all(w); } catch(e){}
  SPR_BG = false;
}

async function ensureSprites(chars){
  if (!spriteReady()) return;
  const all = SPR_URLS(chars);
  if (!all.length){ SPR_READY = true; return; }
  /* Tahan pemain hanya untuk gelombang teras. */
  const core = SPR_CORE(chars);
  const cset = {}; core.forEach(u => cset[u] = 1);
  const next = SPR_NEXT(chars).filter(u => !cset[u]);
  const nset = {}; next.forEach(u => nset[u] = 1);
  /* Skrin memuat menyediakan SEMUA yang pertempuran ini perlukan — muka
     setiap ekspresi, tapak, peluru — supaya tiada gambar muncul lewat
     di tengah lakonan. Hanya latar peta lain ditinggalkan untuk latar. */
  const want = SPR_BATTLE(chars);
  const wset = {}; want.forEach(u => wset[u] = 1);
  const rest = all.filter(u => !wset[u]);
  if (!want.length){ SPR_READY = true; if (rest.length) setTimeout(() => preloadQuiet(rest), 300); return; }
  const local = want.every(isLocalData);
  /* Semua dalam peranti: nyahkod sahaja. Selalunya sekelip mata, jadi skrin
     memuat hanya dibuka jika ia mengambil masa lebih 350 ms. */
  let finished = false, id = null, done = 0;
  const bump = () => {
    done++;
    if (!id) return;
    const bd = $('[data-modal="'+id+'"]'); if (!bd) return;
    const b = $('#plBar', bd), t = $('#plTxt', bd);
    if (b) b.style.width = (done / want.length * 100) + '%';
    if (t) t.textContent = done + ' / ' + want.length;
  };
  const job = async u => { if (!isLocalData(u)) await cacheRemote(u); await preloadOne(resolveUrl(u)); SPR_DONE[u] = 1; bump(); };
  const QUEUE = want.slice();
  const workers = [];
  for (let w = 0; w < 12; w++) workers.push((async () => { while (QUEUE.length){ await job(QUEUE.shift()); } })());
  const all_ = Promise.all(workers).then(() => { finished = true; });
  if (local){
    await Promise.race([all_, new Promise(r => setTimeout(r, 350))]);
    if (finished){ SPR_READY = true; if (rest.length) setTimeout(() => preloadQuiet(rest), 300); return; }
  }
  id = loadScreen(want.length, local);
  bump(); done--;                                   // segerakkan bar dengan kemajuan semasa
  await all_;
  SPR_READY = true;
  await new Promise(r => setTimeout(r, 180));
  closeModal(id);
  if (rest.length) preloadQuiet(rest);
}

/* ---------- pemain animasi (semua frame dibina awal, tukar paparan sahaja) ---------- */
function offsetsFor(g, a){
  const rec = (S.sprites||{})[g + '|' + a];
  return (rec && rec.off) ? rec.off : null;
}
function makeActor(box, gender, mirror){
  const cache = {};
  let timer = null, shown = null, offs = null;
  const fps = () => (S.config && S.config.spriteFps) || 8;
  const build = act => {
    if (cache[act]) return cache[act];
    const f = spriteFramesOr(gender, act) || [];
    const o = offsetsFor(gender, act);
    cache[act] = f.map((src, i) => {
      const im = document.createElement('img');
      const off = o && o[i];
      const s = (off && off.s ? off.s : 100) / 100;
      /* Watak yang dicerminkan: anjakan mendatar mesti dibalik juga, kalau
         tidak jajaran yang betul pada pihak kiri jadi salah pada pihak kanan. */
      const ox = (off ? off.x : 0) * (mirror ? -1 : 1);
      im.decoding = 'sync';
      im.src = src;
      im.style.cssText = 'position:absolute;left:0;width:100%;bottom:0;display:none;transform-origin:50% 94%;' +
        'transform:translate(' + ox + '%,' + (off ? off.y : 0) + '%) scale(' + (mirror ? -s : s) + ',' + s + ');';
      box.appendChild(im);
      decImg(im);
      return im;
    });
    return cache[act];
  };
  const show = im => { if (shown && shown !== im) shown.style.display = 'none'; if (im){ im.style.display = 'block'; shown = im; } };
  /* Frame yang belum dinyahkod tidak dipaparkan; frame semasa kekal sehingga
     yang baharu sedia, jadi watak tidak pernah berkelip hilang. */
  let pend = null;
  const showReady = im => {
    if (!im) return;
    if (DECODED.has(im)){ pend = null; show(im); return; }
    pend = im;
    decImg(im).then(() => { if (pend === im){ pend = null; show(im); } });
  };
  const loop = act => {
    clearInterval(timer);
    const arr = build(act);
    if (!arr.length) return;
    let i = 0; showReady(arr[0]);
    if (arr.length < 2) return;
    timer = setInterval(() => { i = (i + 1) % arr.length; showReady(arr[i]); }, 1000 / fps());
  };
  const once = (act, dur) => new Promise(res => {
    clearInterval(timer);
    const arr = build(act);
    if (!arr.length){ setTimeout(res, dur); return; }
    let i = 0; showReady(arr[0]);
    const step = Math.max(45, dur / arr.length);
    timer = setInterval(() => {
      i++;
      if (i >= arr.length){ clearInterval(timer); res(); return; }
      showReady(arr[i]);
    }, step);
  });
  const stop = () => clearInterval(timer);
  /* Bina dan nyahkod set aksi awal-awal. */
  const warm = acts => Promise.all([].concat.apply([], (acts || ['idle']).map(a => build(a).map(decImg))));
  return { loop, once, stop, warm, box };
}

function dropOldSprites(){
  if (!S) return 0;

    Object.keys(obj).forEach(k => { if (SPR_DROP.indexOf(String(k).split('|')[1]) >= 0){ delete obj[k]; n++; } }); };

/* Kosongkan semua sprite — termasuk set lama daripada sistem rank yang telah dibuang */
async function sprResetAll(){
  const ok = await confirmBox({ danger:true, title:'Reset Semua Sprite', okText:'Padam Semua',
    message:'Semua frame <b>badan</b>, <b>tapak</b>, <b>muka</b> dan <b>latar Arena</b> akan dipadam bagi kedua-dua jantina, termasuk baki set lama daripada sistem rank.<br><br>Rekod pelajar, TP dan kad tidak terjejas. Teruskan?' });
  if (!ok) return;
  const urls = [];
  const sweep = (store, pre) => {
    Object.keys(store || {}).forEach(k => {
      const rec = store[k] || {};
      (rec.urls || []).forEach(u => { if (u) urls.push(u); });
      for (let i = 0; i < (rec.n || 0); i++){
        const pk = rec.pk || (pre + k);
        delete PHOTOS[pk + ':' + i];
        try { idbDel(pk + ':' + i); } catch(e){}
      }
    });
  };
  sweep(S.sprites, 'sprite:'); sweep(S.faces, 'face:');
  const abg = (S.arenaBg || {}).url;
  if (abg) urls.push(abg);
  delete PHOTOS['arena:bg']; try { idbDel('arena:bg'); } catch(e){}
  urls.forEach(u => { delete PHOTOS[CK(u)]; try { idbDel(CK(u)); } catch(e){} fbDeleteUrl(u); });
  S.sprites = {}; S.faces = {}; S.arenaBg = null;
  Object.keys(SPR_DONE).forEach(k => delete SPR_DONE[k]);
  SPR_READY = false;
  save(true); closeTop(); spriteManager();
  toast('Semua sprite dikosongkan.');
}
/* ============ MUAT NAIK BANYAK FRAME: FAIL, FOLDER ATAU ZIP ============
   Frame yang dimuat turun selalunya berada dalam satu folder. Memilih satu
   per satu memenatkan, jadi guru boleh pilih SELURUH folder, atau satu
   fail ZIP (cara yang pasti berfungsi di telefon).                       */
const IMG_EXT = /\.(png|jpe?g|webp|gif|bmp)$/i;
const extMime = n => ({ png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp',
  gif:'image/gif', bmp:'image/bmp' })[String(n).split('.').pop().toLowerCase()] || '';
const isZip = f => /\.zip$/i.test(f.name) || /zip/.test(f.type || '');

/* Pembaca ZIP kecil tanpa pustaka luar: baca direktori pusat, kemudian
   nyahmampat setiap entri gambar dengan DecompressionStream. */
async function unzipImages(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Fail ZIP tidak sah atau rosak.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let k = 0; k < count; k++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loc = dv.getUint32(p + 42, true);
    const path = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    const base = path.split('/').pop();
    /* langkau folder, fail tersembunyi dan sampah macOS */
    if (!base || base.startsWith('.') || /(^|\/)__MACOSX\//.test(path) || !IMG_EXT.test(base)) continue;
    const start = loc + 30 + dv.getUint16(loc + 26, true) + dv.getUint16(loc + 28, true);
    const raw = buf.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw;
    else if (method === 8){
      if (typeof DecompressionStream === 'undefined')
        throw new Error('Pelayar ini tidak boleh membuka ZIP. Kemas kini pelayar, atau pilih gambar terus.');
      const s = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      data = new Uint8Array(await new Response(s).arrayBuffer());
    } else continue;
    const f = new File([data], base, { type: extMime(base) });
    f.__path = path;
    out.push(f);
  }
  return out;
}
/* Fail biasa, gambar dalam folder dan isi ZIP — semuanya disatukan dan
   disusun ikut nama penuh secara semula jadi: 2 sebelum 10. */
async function collectImages(list){
  const out = [];
  for (const f of Array.from(list || [])){
    if (isZip(f)) out.push.apply(out, await unzipImages(f));
    else if ((f.type || '').startsWith('image/') || IMG_EXT.test(f.name)) out.push(f);
  }
  const key = f => f.__path || f.webkitRelativePath || f.name;
  out.sort((a, b) => key(a).localeCompare(key(b), undefined, { numeric:true }));
  return out;
}
/* Tanya guru mahu pilih gambar (atau ZIP) atau satu folder, kemudian
   pulangkan senarai gambar yang tersusun. */
function pickImages(title){
  return new Promise(res => {
    const run = async inp => {
      try {
        const raw = Array.from(inp.files || []);
        const files = await collectImages(raw);
        /* Folder, ZIP atau banyak gambar = guru sudah menyediakan frame satu
           per satu. Memotongnya lagi hanya merosakkan frame itu. */
        files.__bulk = inp.id === 'filePickDir' || raw.some(isZip) || files.length > 1;
        if (!files.length) toast('Tiada gambar ditemui dalam pilihan itu.', null, true);
        res(files);
      } catch(err){ toast(err.message || 'Gagal membaca fail.', null, true); res([]); }
    };
    const id = openModal({ center:true, icon:'fa-folder-open', title: title || 'Muat Naik Frame',
      body:
        '<button class="btn clip-s w-full text-left !py-3" data-pk="files">' +
          '<div class="text-[13px] font-bold"><i class="fa-solid fa-images text-cyan"></i> Pilih Gambar</div>' +
          '<div class="text-[10px] text-muted mt-0.5">Satu atau banyak gambar, ATAU satu fail <b>.ZIP</b></div></button>' +
        '<button class="btn btn-o clip-s w-full text-left !py-3 mt-2" data-pk="dir">' +
          '<div class="text-[13px] font-bold"><i class="fa-solid fa-folder-open"></i> Pilih Satu Folder</div>' +
          '<div class="text-[10px] mt-0.5" style="opacity:.85">Semua gambar dalam folder diambil, disusun ikut nama (01, 02, 03…)</div></button>' +
        '<div class="text-[10px] text-muted leading-snug mt-3">Di telefon, sesetengah pelayar tidak boleh memilih folder ' +
          'dan hanya membuka pemilih fail biasa. Jika begitu, mampatkan folder itu jadi <b>ZIP</b> ' +
          '(dalam app Fail: tekan lama folder → Mampat / Compress), kemudian pilih fail ZIP itu melalui <b>Pilih Gambar</b>.</div>' });
    const bd = $('[data-modal="' + id + '"]');
    bd.addEventListener('click', e => {
      const b = e.target.closest('[data-pk]'); if (!b) return;
      const inp = $(b.dataset.pk === 'dir' ? '#filePickDir' : '#filePickMulti');
      inp.value = '';
      inp.onchange = () => run(inp);
      inp.click();                 // mesti dalam gerak isyarat pengguna yang sama
      closeModal(id);
    });
  });
}
async function spriteUpload(key){
  const [g, a] = key.split('|');
  pickImages().then(async files => {
    if (!files || !files.length) return;
    const mid = openModal({ center:true, icon:'fa-spinner', title:'Memproses Frame',
      body:'<div id="sprProg" class="text-[13px]">Memulakan...</div>' +
        '<div class="text-[11px] text-muted mt-2">' + (upMode(files) === 'file'
          ? 'Satu fail = satu frame · gambar diambil <b>seperti dilukis</b>, tiada pemotongan dan tiada penjajaran semula.'
          : 'Latar pepejal dibuang automatik · frame dipotong &amp; dijajar ikut kaki · skala sama semua frame.') + '</div>' });
    const prog = $('#sprProg', $('[data-modal="'+mid+'"]'));
    try {
      const mapAct = isMapAct(a), still = a === 'ammo';
      let CW = mapAct ? (isWideChar(g) ? MAP_W * 2 : MAP_W) : SPR_W, CH = mapAct ? MAP_H : SPR_H;
      if (still){ CW = 512; CH = 512; }
      const datas = await prepFrames(files, m => prog.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + m,
        { W:CW, H:CH, snap: S.config.sprSnap === 1, mode: upMode(files) });
      if (still){
        datas.length = 1;                                  // peluru = satu gambar sahaja
        const t = await cropTight(datas[0]);
        datas[0] = t.data; CW = t.w; CH = t.h;
      }
      if (datas.length > SPR_MAXF) throw new Error('Terlalu banyak frame dikesan (' + datas.length + '). Had ialah ' +
        SPR_MAXF + ' frame bagi satu aksi.');
      const urls = []; let total = 0;
      for (let i = 0; i < datas.length; i++){
        prog.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan frame ' + (i+1) + ' / ' + datas.length + '...';
        total += dataBytes(datas[i]);
        const su = await assetSave(sprKey(g,a) + ':' + i, datas[i], 'sprites/' + g + '_' + a + '_' + i + '_' + stamp() + '.png');
        if (su){ PHOTOS[CK(su)] = datas[i]; await idbPut(CK(su), datas[i]); }   // terus simpan salinan tempatan
        urls.push(su);
      }
      S.sprites = S.sprites || {};
      S.sprites[g + '|' + a] = { n: datas.length, urls, off: datas.map(()=>({x:0,y:0})), w:CW, h:CH };
      save(true);
      closeModal(mid); closeTop(); spriteManager();
      if (prepFrames.keyed === 0 && prepFrames.skipped > 0)
        toast('Latar TIDAK dapat dibuang — warna latar terlalu hampir dengan warna watak, atau latarnya tidak rata. Guna latar magenta #FF00FF.', null, true);
      else
        toast(datas.length + ' frame dijajar & disimpan · ' + Math.round(total/1024) + 'KB');
    } catch(err){
      prog.innerHTML = '<span class="text-[#E23B3B]">Gagal: ' + esc(err.message||err) + '</span>';
    }
  });
}
/* Potong gambar rapat pada kandungannya. Peluru mesti rapat supaya app boleh
   meletak dan memutarnya dengan tepat — kanvas besar yang kosong akan
   membuat anak panah kelihatan tersasar daripada tangan. */
async function cropTight(data){
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = data; });
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
  c.getContext('2d').drawImage(im, 0, 0);
  const b = opaqueBox(c);
  if (!b) return { data, w:c.width, h:c.height };
  const t = document.createElement('canvas'); t.width = b.w; t.height = b.h;
  t.getContext('2d').drawImage(c, b.x0, b.y0, b.w, b.h, 0, 0, b.w, b.h);
  return { data: await encodeTarget(t, { alpha:true, maxB: 34*1024 }), w:b.w, h:b.h };
}
/* Muat imej, letak di tengah kanvas 512×512 (nisbah dikekalkan), mampat telus */
function fitToCanvas(file, W, H){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      try {
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const x = c.getContext('2d');
        const f = Math.min(W / img.width, H / img.height);
        const w = img.width * f, hh = img.height * f;
        x.imageSmoothingQuality = 'high';
        x.drawImage(img, (W - w) / 2, H - hh, w, hh);       // kaki di tepi bawah
        const out = await encodeTarget(c, { alpha:true, maxB: 34*1024 });
        URL.revokeObjectURL(url); res(out);
      } catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Imej tidak boleh dibuka')); };
    img.src = url;
  });
}

/* ============ KAD DALAM PERTEMPURAN ============
   Hanya Jarang ke atas boleh digunakan. Sial & Biasa tiada nilai stat. */
const CARD_BUDGET = { sial:0, biasa:0, jarang:10, epik:20, legenda:35, mitos:55 };
const STAT_KEYS = [
  { k:'hp',  name:'HP',  color:'#4ADE80', mult:3 },      // 1 mata = +3 HP
  { k:'atk', name:'ATK', color:'#FF6B00', mult:1 },
  { k:'def', name:'DEF', color:'#00F0FF', mult:1 },
  { k:'spd', name:'SPD', color:'#C084FC', mult:1 },
  { k:'luk', name:'LUK', color:'#FFD76A', mult:1 }
];
const cardBudget = c => CARD_BUDGET[c.tier] || 0;
const cardSt = c => Object.assign({ hp:0, atk:0, def:0, spd:0, luk:0 }, c.st || {});
const cardUsed = c => { const s = cardSt(c); return STAT_KEYS.reduce((a,x)=>a+(s[x.k]||0),0); };
const cardPlayable = c => cardBudget(c) > 0;
function autoAllocate(c){
  const b = cardBudget(c); if (!b) return;
  const st = { hp:0, atk:0, def:0, spd:0, luk:0 };
  for (let i = 0; i < b; i++){
    const k = STAT_KEYS[Math.floor(Math.random() * STAT_KEYS.length)].k;
    st[k]++;
  }
  c.st = st;
}
/* Dek: maksimum 12 kad, maksimum 2 salinan kad sama, Jarang ke atas sahaja */
function deckFor(sid){
  const owned = Object.keys(((S.collect||{})[sid]) || {});
  const list = [];
  owned.forEach(id => {
    const c = (S.cards||[]).find(x => x.id === id);
    if (!c || !cardPlayable(c)) return;
    const copies = Math.min(2, ownedCount(sid, id));
    for (let i = 0; i < copies; i++) list.push(c);
  });
  list.sort((a,b) => (tierRank(b.tier) - tierRank(a.tier)) || (cardUsed(b) - cardUsed(a)));
  return list.slice(0, 12);
}
function deckForTeam(ids){
  const seen = {}, list = [];
  ids.forEach(sid => Object.keys(((S.collect||{})[sid]) || {}).forEach(id => {
    const c = (S.cards||[]).find(x => x.id === id);
    if (!c || !cardPlayable(c) || seen[id]) return;
    seen[id] = 1; list.push(c);
  }));
  list.sort((a,b) => (tierRank(b.tier) - tierRank(a.tier)) || (cardUsed(b) - cardUsed(a)));
  return list.slice(0, 12);                      // 12 kad berbeza terbaik
}
const shuffled = arr => arr.slice().sort(() => Math.random() - 0.5);
function applyCard(f, c){
  const s = cardSt(c);
  const hp = (s.hp || 0) * 3;
  f.maxhp += hp; f.hp = Math.min(f.maxhp, f.hp + hp);
  f.atk += s.atk || 0; f.def += s.def || 0; f.spd += s.spd || 0; f.luk += s.luk || 0;
  return { hp, atk:s.atk||0, def:s.def||0, spd:s.spd||0, luk:s.luk||0 };
}
const cardBonusText = c => {
  const s = cardSt(c);
  return STAT_KEYS.filter(x => s[x.k]).map(x => x.name + ' +' + (x.k === 'hp' ? s.hp * 3 : s[x.k])).join(' · ') || 'tiada bonus';
};
