        [-.65, .65].forEach(x => { const l = new THREE.Mesh(new THREE.BoxGeometry(.12, .55, .45), M(0x3A3A3A)); l.position.set(x, .27, 0); g.add(l); }); return g; } },
    { k:'bin',   low:false, make: () => { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, .9), M(0x2F8A3A)); b.position.y = .75; g.add(b);
        const l = new THREE.Mesh(new THREE.BoxGeometry(1.06, .12, .96), M(0x1F5A26)); l.position.y = 1.56; g.add(l); return g; } },
    { k:'board', low:false, make: () => { const g = new THREE.Group(); const p = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.3, .12), M(0xFFD24A)); p.position.y = 1.3; g.add(p);
        const t = new THREE.Mesh(new THREE.BoxGeometry(1.2, .14, .14), M(0x1A1A1A)); t.position.set(0, 1.3, .07); g.add(t);
        [-.6, .6].forEach(x => { const l = new THREE.Mesh(new THREE.BoxGeometry(.1, 1.6, .1), M(0x5A5A5A)); l.position.set(x, .8, 0); g.add(l); }); return g; } }
  ];
  const starGeo = (() => { const s = new THREE.Shape(); for (let k = 0; k < 10; k++){ const a = Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? .16 : .38; const x = Math.cos(a) * r, y = Math.sin(a) * r; k ? s.lineTo(x, y) : s.moveTo(x, y); } return new THREE.ExtrudeGeometry(s, { depth: .1, bevelEnabled: false }); })();
  const starMat = M(0xFFD24A, { emissive: 0xFFA500, emissiveIntensity: .7, metalness: .4, roughness: .3 });
  const spawnObstacle = z => {
    const kind = OB_KINDS[Math.floor(Math.random() * OB_KINDS.length)];
    const free = [0, 1, 2].sort(() => Math.random() - .5);
    const n = Math.random() < .35 ? 2 : 1;                           // kadang-kadang dua lorong ditutup, satu sentiasa terbuka
    for (let i = 0; i < n; i++){
      const m = kind.make(); m.position.set(LANES[free[i]], 0, z); scene.add(m);
      OBS.push({ m, lane: free[i], low: kind.low, z });
    }
  };
  const spawnStars = (z, lane) => { for (let i = 0; i < 5; i++){ const m = new THREE.Mesh(starGeo, starMat); m.position.set(LANES[lane], 1, z - i * 2.2); scene.add(m); STARS.push({ m, lane }); } };
  const gateTex = (txt, col) => ctex(512, 256, (g, w, h) => {       // jawapan panjang: balut perkataan hingga 5 baris, fon menyesuaikan
    g.fillStyle = col; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(10, 10, w - 20, h - 20);
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const words = txt.split(/\s+/), wrap = fs => { g.font = 'bold ' + fs + 'px sans-serif'; const L = []; let cur = '';
      words.forEach(wd => { const t = cur ? cur + ' ' + wd : wd; if (g.measureText(t).width > w - 40 && cur){ L.push(cur); cur = wd; } else cur = t; }); if (cur) L.push(cur); return L; };
    let fs = 92, L = wrap(fs);
    while (fs > 22 && (L.length * fs * 1.12 > h - 30 || L.some(l => g.measureText(l).width > w - 40))){ fs -= 4; L = wrap(fs); }
    L.forEach((l, i) => g.fillText(l, w / 2, h / 2 + (i - (L.length - 1) / 2) * fs * 1.12 + 2));
  });
  const GATE_COLS = ['#2A7FD4', '#D4532A', '#8A3AD4'];
  const spawnGates = (z, q) => {
    const wrong = q.c.map((_, i) => i).filter(i => i !== q.a).sort(() => Math.random() - .5).slice(0, 2);
    const opts = [q.a].concat(wrong).sort(() => Math.random() - .5);
    const row = { z, q, opts, done: false, meshes: [] };
    opts.forEach((ci, lane) => {
      const g = new THREE.Group();
      const posts = M(0xE8ECF1);
      [-1, 1].forEach(s => { const p = new THREE.Mesh(new THREE.BoxGeometry(.14, 2.6, .14), posts); p.position.set(s * .95, 1.3, 0); g.add(p); });
      const sign = new THREE.Mesh(new THREE.PlaneGeometry(2, 1), new THREE.MeshBasicMaterial({ map: gateTex(String(q.c[ci]), GATE_COLS[lane]), side: THREE.DoubleSide }));
      sign.position.y = 2.9; g.add(sign);
      const arch = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.5), new THREE.MeshBasicMaterial({ color: GATE_COLS[lane], transparent: true, opacity: .16, side: THREE.DoubleSide }));
      arch.position.y = 1.25; g.add(arch);
      g.position.set(LANES[lane], 0, z); scene.add(g); row.meshes.push(g);
    });
    GATES.push(row);
    $r('#rnQt').innerHTML = esc(q.q) + '<div class="flex gap-1 mt-2 text-[13px]">' + opts.map((ci, lane) =>
      '<div class="flex-1" style="padding:3px 5px;background:' + GATE_COLS[lane] + ';color:#fff;border-radius:3px;line-height:1.25;overflow-wrap:anywhere">' +   // pilihan panjang berbalut, tidak terpotong
      ['◀ ', '▲ ', '▶ '][lane] + esc(String(q.c[ci])) + '</div>').join('') + '</div>';
    $r('#rnQ').style.display = 'block';
  };

  /* ---------- bunyi ---------- */
  const A = (() => {
    if (!ac) return null;
    const out = ac.createGain(); out.gain.value = .7; out.connect(ac.destination);
    const tone = (type, f0, f1, dur, vol, delay) => { const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05); };
    // muzik ceria ringkas: bass + arpeggio berulang
    let beat = 0, timer = null;
    const NOTES = [[262, 330, 392], [220, 277, 330], [175, 220, 262], [196, 247, 294]];
    if (!AUD_HAVE.has('bgm_run')) timer = setInterval(() => {
      const ch = NOTES[Math.floor(beat / 8) % 4];
      if (beat % 2 === 0) tone('triangle', ch[0] / 2, 0, .22, .09);
      tone('square', ch[beat % 3], 0, .12, .025);
      beat++;
    }, 160);
    return {
      coin:  () => tone('square', 1320, 1760, .08, .05),
      jump:  () => tone('sine', 300, 600, .18, .12),
      lane:  () => tone('sine', 520, 440, .06, .04),
      hit:   () => { tone('sawtooth', 160, 60, .4, .2); tone('square', 90, 50, .3, .12); },
      right: () => [784, 988, 1175, 1568].forEach((f, i) => tone('triangle', f, 0, .25, .14, i * .07)),
      wrong: () => tone('square', 220, 110, .5, .15),
      over:  () => [523, 440, 349, 262].forEach((f, i) => tone('triangle', f, 0, .35, .14, i * .18)),
      stop:  () => { clearInterval(timer); try { out.gain.setTargetAtTime(0, ac.currentTime, .05); setTimeout(() => out.disconnect(), 300); } catch(e){} }
    };
  })();
  const sfxR = k => { if (audPlay('run_' + k)) return; try { A && A[k] && A[k](); } catch(e){} };

  /* ---------- keadaan ---------- */
  const P = { lane: 1, x: 0, y: 0, vy: 0, inv: 0, phase: 0 };
  const RL = RUN_LVL[runCfg().lvl] || RUN_LVL.sederhana, RQ = runCfg().qt;
  let speed = RL.v0, dist = 0, stars = 0, right = 0, asked = 0, lives = 3, alive = true, ended = false, paused = false;
  let nextObs = -40, nextStar = -30, nextQ = 160, lastSpawnZ = -40;
  RUN = { close: () => quit() };
  const hud = () => {
    $r('#rnLives').innerHTML = [0, 1, 2].map(i => '<i class="fa-solid fa-heart" style="color:' + (i < lives ? '#FF4D6A' : 'rgba(0,0,0,.4)') + '"></i>').join(' ');
    $r('#rnStars').innerHTML = '★ ' + stars;
    $r('#rnScore').textContent = score();
    $r('#rnDist').textContent = Math.floor(dist) + ' m · ' + right + '/' + asked + ' betul';
  };
  const score = () => Math.floor(dist) + stars * 10 + right * 60;
  let msgT = null;
  const msg = (t, c, ms) => { const m = $r('#rnMsg'); m.innerHTML = t; m.style.color = c || '#fff'; m.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => m.style.opacity = 0, ms || 1100); };
  hud();
  msg('SEDIA… LARI!', '#FFD24A', 1400);
  setTimeout(() => { const h = $r('#rnHint'); if (h) h.style.opacity = 0; }, 5000);

  /* ---------- kawalan ---------- */
  const move = d => { const n = clamp(P.lane + d, 0, 2); if (n !== P.lane){ P.lane = n; sfxR('lane'); } };
  const jump = () => { if (P.y <= .01){ P.vy = 9.5; sfxR('jump'); } };
  const onKey = e => {
    if (e.type !== 'keydown' || paused || ended) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') move(-1);
    else if (k === 'arrowright' || k === 'd') move(1);
    else if (k === 'arrowup' || k === 'w' || k === ' ') jump();
    else return;
    e.preventDefault();
  };
  let sw = null;
  const onDown = e => { if (e.target.closest('button,#rnEnd')) return; sw = { x: e.clientX, y: e.clientY, t: performance.now(), used: false }; };
  const onMove = e => {
    if (!sw || sw.used) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)){ move(dx > 0 ? 1 : -1); sw.used = true; }
    else if (dy < -28 && Math.abs(dy) > Math.abs(dx)){ jump(); sw.used = true; }
  };
  const onUp = e => {
    if (!sw) return;
    if (!sw.used && performance.now() - sw.t < 260){                // ketik: sisi kiri/kanan tukar lorong, tengah lompat
      const w = root.clientWidth, x = e.clientX;
      if (x < w * .33) move(-1); else if (x > w * .67) move(1); else jump();
    }
    sw = null;
  };
  window.addEventListener('keydown', onKey);
  root.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  $r('#rnQuit').onclick = () => {
    if (ended) return quit();
    const was = paused; paused = true;                // larian berhenti sementara soalan pengesahan dipapar
    gameConfirm(null, null, asked, right).then(ok => { if (ok){ if (asked) gameOver(); else quit(); } else { paused = was; last = performance.now(); } });
  };

  /* ---------- logik ---------- */
  const removeObj = (arr, i) => { const o = arr[i]; scene.remove(o.m); arr.splice(i, 1); };
  function hurt(){
    if (P.inv > 0) return;
    lives--; P.inv = 1.6; sfxR('hit'); vibrate(80); hud();
    const h = $r('#rnHit'); h.style.opacity = 1; setTimeout(() => h.style.opacity = 0, 250);
    if (lives <= 0) gameOver();
  }
  function update(dt){
    speed = Math.min(RL.vmax, RL.v0 + dist / RL.ramp);
    const dz = speed * dt;
    dist += dz;
    roadTex.offset.y += dz / (160 / 6);                 // garisan bergerak ke arah pemain (ke belakang) = pemain maju
    // pemandangan berulang
    SCN.forEach(o => { o.position.z += dz; if (o.position.z > 12) o.position.z -= SPAN; });
    // pelari
    P.x += (LANES[P.lane] - P.x) * Math.min(1, dt * 14);
    P.vy -= 26 * dt; P.y = Math.max(0, P.y + P.vy * dt); if (P.y === 0) P.vy = Math.max(0, P.vy);
    P.phase += dt * (8 + speed * .35);
    if (mixer){
      if (P.y > 0) play(P.vy > 0 ? 'jump' : 'fall', .1); else play('sprint', .12);
      ACT.sprint && (ACT.sprint.timeScale = .9 + speed * .03);
      mixer.update(dt);
      runner.position.set(P.x, P.y, 0);
    } else {
      const sw2 = P.y > 0 ? .6 : Math.sin(P.phase) * .9;
      legL.rotation.x = sw2; legR.rotation.x = -sw2; armL.rotation.x = -sw2 * .8; armR.rotation.x = sw2 * .8;
      runner.position.set(P.x, P.y + (P.y > 0 ? 0 : Math.abs(Math.sin(P.phase)) * .08), 0);
    }
    runner.rotation.z = (LANES[P.lane] - P.x) * -.08;
    runner.visible = P.inv <= 0 || Math.floor(P.inv * 12) % 2 === 0;
    shadow.position.set(P.x, .02, 0); shadow.scale.setScalar(1 - Math.min(.5, P.y / 4));
    if (P.inv > 0) P.inv -= dt;
    cam.position.x += (P.x * .45 - cam.position.x) * Math.min(1, dt * 5);
    // jana objek baharu di hadapan
    nextObs += dz; nextStar += dz; nextQ -= dz;
    const gateNear = GATES.some(g => !g.done && g.z > -50);
    if (nextObs >= 0 && !gateNear){ spawnObstacle(-90); nextObs = -(14 + Math.random() * 10) * (11 / speed) * 1.4; }
    if (nextStar >= 0){ spawnStars(-90, Math.floor(Math.random() * 3)); nextStar = -(30 + Math.random() * 20); }
    if (nextQ <= 0 && !GATES.some(g => !g.done)){
      const q = escQuestion();
      spawnGates(-Math.max(60, speed * RQ), q); nextQ = 260 + Math.random() * 60 + speed * RQ;
      OBS.slice().forEach((o, i) => { if (o.m.position.z < -60) { scene.remove(o.m); o.dead = true; } });
      for (let i = OBS.length - 1; i >= 0; i--) if (OBS[i].dead) OBS.splice(i, 1);
    }
    // halangan
    for (let i = OBS.length - 1; i >= 0; i--){
      const o = OBS[i]; o.m.position.z += dz;
      if (!o.hit && o.lane === P.lane && Math.abs(o.m.position.z) < .7 && Math.abs(P.x - LANES[o.lane]) < 1){
        if (!(o.low && P.y > .55)){ o.hit = true; hurt(); }
      }
      if (o.m.position.z > 10) removeObj(OBS, i);
    }
    // bintang
    for (let i = STARS.length - 1; i >= 0; i--){
      const s = STARS[i]; s.m.position.z += dz; s.m.rotation.y += dt * 4;
      if (s.lane === P.lane && Math.abs(s.m.position.z) < .8 && P.y < 2){ stars++; sfxR('coin'); hud(); removeObj(STARS, i); continue; }
      if (s.m.position.z > 10) removeObj(STARS, i);
    }
    // gerbang soalan
    for (let i = GATES.length - 1; i >= 0; i--){
      const g = GATES[i]; g.z += dz; g.meshes.forEach(m => m.position.z = g.z);
      if (!g.done && g.z > -0.2){
        g.done = true; asked++;
        const ok = g.opts[P.lane] === g.q.a;
        teamQuiz(sid, ok);
        if (ok){ right++; stars += 5; sfxR('right'); msg('BETUL! +60', '#4ADE80'); P.inv = Math.max(P.inv, .8); }
        else { sfxR('wrong'); msg('SALAH! Jawapan: ' + esc(String(g.q.c[g.q.a])), '#FF6B6B', 2200); hurt(); }
        $r('#rnQ').style.display = 'none'; hud();
      }
      if (g.z > 12){ g.meshes.forEach(m => scene.remove(m)); GATES.splice(i, 1); }
    }
    if (Math.floor(dist) % 10 === 0) hud();
  }
  function gameOver(){
    if (ended) return;
    ended = true; sfxR('over'); play('die', .2);
    const sc = score(), rp = runRP(sc), d = runData();
    d.gbest = d.gbest || {};
    const prev = d.gbest[sid] || 0;
    if (sc > prev) d.gbest[sid] = sc;
    d.plays[sid] = (d.plays[sid] || 0) + 1;
    S.arena = S.arena || { points:{}, wins:{}, losses:{}, history:[] };
    teamRP(sid, rp);
    const tp = gameToPBD(sid, 'run', right, asked, { score: sc });
    save(true);
    const e = $r('#rnEnd');
    e.innerHTML = '<div class="panel clip p-5 w-full text-center" style="max-width:400px">' +
      '<div style="font-size:40px">' + (sc > prev ? '🏆' : '🏁') + '</div>' +
      '<div class="font-bold tracking-widest text-[20px] mt-1" style="color:#FFB347">' + (sc > prev ? 'REKOD BAHARU!' : 'TAMAT LARIAN') + '</div>' +
      '<div class="text-[13px] text-muted mt-1">' + esc(player ? player.name : '') + '</div>' +
      '<div class="grid grid-cols-3 gap-2 mt-4 num">' +
        '<div class="panel clip-s p-2"><div class="text-[18px] text-cyan">' + sc + '</div><div class="text-[10px] text-muted">SKOR</div></div>' +
        '<div class="panel clip-s p-2"><div class="text-[18px]" style="color:#FFD76A">' + right + '/' + asked + '</div><div class="text-[10px] text-muted">BETUL</div></div>' +
        '<div class="panel clip-s p-2"><div class="text-[18px] text-orange">+' + rp + '</div><div class="text-[10px] text-muted">RP</div></div></div>' +
      '<div class="text-[11px] text-muted mt-2">' + Math.floor(dist) + ' m · ★ ' + stars + '</div>' +
      (tp ? '<div class="text-[12px] mt-2" style="color:#00F0FF"><b style="color:' + TP_COLOR[tp] + '">TP' + tp + '</b> direkod dalam PBD untuk ' + player.members.length + ' ahli kumpulan</div>'
          : '<div class="text-[11px] text-muted mt-2">Tiada soalan dijawab — tiada TP direkod.</div>') +
      '<div class="flex gap-2 mt-4"><button class="btn clip-s flex-1 !py-3" data-end="quit">Tutup</button><button class="btn btn-o clip-s flex-1 !py-3" data-end="again"><i class="fa-solid fa-rotate"></i> Lari Lagi</button></div></div>';
    e.style.display = 'flex';
    e.onclick = ev => { const b = ev.target.closest('[data-end]'); if (!b) return; const again = b.dataset.end === 'again'; quit(); if (again) setTimeout(runStart, 50); };
  }
  function quit(){
    if (!alive) return;
    alive = false; RUN = null;
    if (!ended && asked) save();
    window.removeEventListener('resize', resize); window.removeEventListener('keydown', onKey);
    window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp);
    if (A) A.stop();
    scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) [].concat(o.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); });
    liveEnd(live); R.dispose(); root.remove(); unlockBody(); orientBack();
    if (S.ui.tab === 'arena') renderTab();
  }
  let last = performance.now();
  function frame(now){
    if (!alive) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!ended && !paused) update(dt);
    else if (ended && mixer) mixer.update(dt);
    R.render(scene, cam); if (LIVE.frame) LIVE.frame(R.domElement);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ============ TAB: KEHADIRAN ============
   Daftar kehadiran harian untuk setiap kelas, berasingan daripada penilaian
   PBD (tidak mengubah skor atau TP). Data: S.attendance[classId][tarikh] =
   { s: { sid: 'H'|'L'|'T'|'C' }, n: { sid: 'catatan' } }.
   H = Hadir · L = Lewat · T = Tidak Hadir · C = Cuti / MC (dikira hadir? tidak). */
const ATT = [
  { k:'H', name:'Hadir',       short:'HADIR', color:'#4ADE80', ico:'fa-check' },
  { k:'L', name:'Lewat',       short:'LEWAT', color:'#FACC15', ico:'fa-clock' },
  { k:'T', name:'Tidak Hadir', short:'TIDAK', color:'#E23B3B', ico:'fa-xmark' },
  { k:'C', name:'Cuti / MC',   short:'CUTI',  color:'#38BDF8', ico:'fa-notes-medical' }
];
const attOf = k => ATT.find(a => a.k === k) || null;
const attDate = () => S.ui.attDate || todayKey();
const attClassId = () => S.ui.activeClassId || '';
/* Kelas gabungan disimpan mengikut kelas asal setiap pelajar */
const attBox = (cid, date, make) => {
  S.attendance = S.attendance || {};
  if (!S.attendance[cid]){ if (!make) return null; S.attendance[cid] = {}; }
  if (!S.attendance[cid][date]){ if (!make) return null; S.attendance[cid][date] = { s:{}, n:{} }; }
  const d = S.attendance[cid][date]; d.s = d.s || {}; d.n = d.n || {};
  return d;
};
const attGet = (sid, date) => { const s = stu(sid); if (!s) return ''; const b = attBox(s.classId, date || attDate()); return b ? (b.s[sid] || '') : ''; };
const attNoteOf = (sid, date) => { const s = stu(sid); if (!s) return ''; const b = attBox(s.classId, date || attDate()); return b ? (b.n[sid] || '') : ''; };
/* Tag kecil pada kad pelajar (tab Pelajar) bagi status hari yang dinilai */
function attTag(sid){
  const k = attGet(sid, recDate()); if (!k || (k === 'H' && attendedToday(sid))) return '';
  const a = attOf(k);
  return '<span class="tag !text-[8px] ml-1" style="color:' + a.color + ';border-color:' + a.color + '77"><i class="fa-solid ' + a.ico + '"></i> ' + a.short + '</span>';
}
function attSet(sid, k){
  const s = stu(sid); if (!s) return;
  const b = attBox(s.classId, attDate(), true);
  if (b.s[sid] === k){ delete b.s[sid]; delete b.n[sid]; } else b.s[sid] = k;
  if (k === 'H' || k === 'L') delete b.n[sid];
  save(); vibrate(10);
  const y = window.scrollY; renderTab(); window.scrollTo(0, y);
  if ((k === 'T' || k === 'C') && b.s[sid] === k && !b.n[sid]) setTimeout(() => attNote(sid), 120);
}
function attAll(k){
  const list = studentsOf(attClassId()), d = attDate();
  const snap = snapshot();
  let n = 0;
  list.forEach(s => { const b = attBox(s.classId, d, true); if (!b.s[s.id]){ b.s[s.id] = k; n++; } });
  save(true); renderTab();
  toast(n ? n + ' pelajar ditanda ' + attOf(k).name.toUpperCase() + '.' : 'Semua pelajar sudah ditanda.', n ? () => restore(snap) : null);
}
async function attClearDay(){
  const ok = await confirmBox({ danger:true, title:'Kosongkan Kehadiran', okText:'Kosongkan', message:'Padam semua tanda kehadiran ' + esc(clsName(attClassId())) + ' pada <b>' + fmtDate(attDate()) + '</b>?' });
  if (!ok) return;
  const snap = snapshot();

function attDates(list){
  const set = new Set();
  const cids = new Set(list.map(s => s.classId));
  cids.forEach(cid => Object.keys((S.attendance || {})[cid] || {}).forEach(d => {
    const b = S.attendance[cid][d]; if (b && b.s && list.some(s => b.s[s.id])) set.add(d);
  }));
  return Array.from(set).sort().reverse();
}
function attSummary(sid, dates){

  return out;
}

function attCsv(){

function escDressReal(THREE, root, R){
  const kill = [];
  root.traverse(o => { if (!o.isMesh) return; o.frustumCulled = false; if (/backpack/i.test(o.name)) kill.push(o); });
  kill.forEach(o => o.parent.remove(o));

  const col = h => new THREE.Color(h);
  /* tulang dominan setiap bucu */
  const domBone = (m, i) => { const si = m.geometry.attributes.skinIndex, sw = m.geometry.attributes.skinWeight; if (!si) return ''; let b = 0;
    for (let c = 1; c < 4; c++) if (sw.getComponent(i, c) > sw.getComponent(i, b)) b = c; const bn = m.skeleton.bones[si.getComponent(i, b)]; return bn ? bn.name : ''; };
  const paint = (m, fn) => { const g = m.geometry, n = g.attributes.position.count, c = new Float32Array(n * 3), t = new THREE.Color();
    for (let i = 0; i < n; i++){ t.set(fn(domBone(m, i), i)); c[i * 3] = t.r; c[i * 3 + 1] = t.g; c[i * 3 + 2] = t.b; }
    g.setAttribute('color', new THREE.BufferAttribute(c, 3)); m.material.vertexColors = true; m.material.color.set(0xffffff); };
  const isHand = b => /Wrist|Index|Middle|Ring|Pinky|Thumb|Fist/.test(b), isLeg = b => /UpperLeg|LowerLeg/.test(b);
  const meshes = []; root.traverse(o => { if (o.isSkinnedMesh) meshes.push(o); });
  const hairMeshes = [];
  meshes.forEach(m => {
    m.material = m.material.clone(); m.material.roughness = .85; m.material.metalness = 0;
    const part = /head/i.test(m.name) ? 'head' : /feet/i.test(m.name) ? 'feet' : /legs/i.test(m.name) ? 'legs' : 'body', mn = m.material.name;
    if (mn === 'Skin'){
      if (R.sleeve && part === 'body') paint(m, b => isHand(b) || /Head/.test(b) ? R.skin : R.shirt);   // lengan panjang (baju kurung)
      else if (R.sleeve && part === 'legs') paint(m, b => isLeg(b) ? R.pants : R.skin);                 // kain labuh
      else m.material.color.set(R.skin);
      return;
    }
    if (part === 'head'){
      if (/Eye|Pupil|White/.test(mn)) return;
      if (/Eyebrow/.test(mn) || (mn === 'Brown' && m.geometry.attributes.position.count < 200)){ m.material.color.set(0x1A120C); return; }
      m.material.color.set(R.hair); if (R.base === 'adventurer') hairMeshes.push(m); return;
    }
    if (part === 'feet'){ m.material.color.set(R.shoe); return; }
    if (part === 'legs'){ m.material.color.set(/Gold/.test(mn) ? R.shoe : R.base === 'woman2' ? R.shirt : R.pants); return; }   // gaun woman2 = baju kurung labuh ke lutut
    m.material.color.set(/Gold/.test(mn) ? (R.trim || R.shirt) : /LightGreen/.test(mn) ? (R.trim || R.shirt) : R.shirt);
  });
  if (!headBone) return;
  /* ruang tulang kepala: kotak kepala, arah muka & arah atas */
  const v = new THREE.Vector3(), box = new THREE.Box3(), inv = new THREE.Matrix4().copy(headBone.matrixWorld).invert();
  const headSkin = meshes.find(m => /head/i.test(m.name) && m.material.name === 'Skin');
  let eyeUp = null;
  if (headSkin){ const n = headSkin.geometry.attributes.position.count;
    for (let i = 0; i < n; i++){ if (domBone(headSkin, i) !== 'Head') continue; headSkin.getVertexPosition(i, v); headSkin.applyBoneTransform(i, v); v.applyMatrix4(headSkin.matrixWorld).applyMatrix4(inv); box.expandByPoint(v); } }
  if (box.isEmpty()) return;
  const qInv = new THREE.Quaternion(); headBone.getWorldQuaternion(qInv); qInv.invert();
  const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(qInv).normalize(), up = new THREE.Vector3(0, 1, 0).applyQuaternion(qInv).normalize();
  const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  /* janggut lelaki: bucu rambut di bawah paras hidung & di depan diwarnakan kulit (tinggal rambut di kepala) */
  hairMeshes.forEach(m => { const p = m.geometry.attributes.position, toB = new THREE.Matrix4().copy(m.matrixWorld).premultiply(inv), hh = Math.abs(sz.dot(up)) || sz.y;
    paint(m, (b, i) => { v.fromBufferAttribute(p, i); m.applyBoneTransform(i, v); v.applyMatrix4(toB); const d = v.sub(c);
      if (d.dot(up) < -hh * .05 && d.dot(fwd) > -hh * .05)return R.skin; return R.hair; }); });

}

function escMathQ(){
  const r = n => Math.floor(Math.random() * n);
  const op = r(4); let a, b, ans, sym;
  if (op === 0){ a = 10 + r(90); b = 10 + r(90); ans = a + b; sym = '+'; }
  else if (op === 1){ a = 20 + r(80); b = 1 + r(a); ans = a - b; sym = '−'; }
  else if (op === 2){ a = 2 + r(11); b = 2 + r(11); ans = a * b; sym = '×'; }
  else { b = 2 + r(11); ans = 1 + r(12); a = b * ans; sym = '÷'; }
  const opts = new Set([ans]);
  while (opts.size < 4){ const d = (1 + r(10)) * (Math.random() < .5 ? -1 : 1); if (ans + d >= 0) opts.add(ans + d); }
  return { q: a + ' ' + sym + ' ' + b + ' = ?', c: Array.from(opts).map(String), a: 0, ans: String(ans), short: a + ' ' + sym + ' ' + b };
}

}

function escPairs(){

  const out = [], seen = new Set();
  bank.slice().sort(() => Math.random() - .5).forEach(q => {
    const a = String(q.c[q.a]);
    if (out.length < 4 && !seen.has(a)){ seen.add(a); out.push([q.q.length > 60 ? q.q.slice(0, 57) + '…' : q.q, a]); }
  });
  for (let n = 0; out.length < 4 && n < 200; n++){
    const m = escMathQ();
    if (!seen.has(m.ans)){ seen.add(m.ans); out.push([m.short, m.ans]); }
  }
  return out;
}

/* telefon kumpulan: pilih kumpulan → pilih watak → tunggu hos */
function escJoin(code, T){

  const paint = () => {
    if (!cfg){ ov.innerHTML = panel('<div class="mt-4 text-muted">Mencari bilik…</div>'); return; }

      ESC_CHARS.map(n => '<button class="btn clip-s" data-c="' + n + '" style="display:flex;flex-direction:column;gap:2px;padding:6px 2px"><img data-kt="esc:' + n + '" alt="" style="width:100%;aspect-ratio:4/5;object-fit:contain;background:radial-gradient(circle at 50% 40%,#3B1F2B,#120A10);border-radius:8px"><span class="text-[10px]">' + ESC_NAME(n) + '</span></button>').join('') + '</div>'); return; }

    close();

  }

}

  const dark = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 1 });
  const FACE = { '+z': 0, '-z': Math.PI, '+x': Math.PI / 2, '-x': -Math.PI / 2 };
  const decal = (x, y, z, w, h, tex, face, emis, transp) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({
      map: tex, transparent: !!transp, roughness: .9,
      emissive: emis ? 0xffffff : 0x000000, emissiveMap: emis ? tex : null, emissiveIntensity: emis || 0 }));
    m.position.set(x, y, z); m.rotation.y = FACE[face]; scene.add(m); return m;
  };
  const M = {
    desk: new THREE.MeshStandardMaterial({ color: 0x5A3E28, roughness: .9 }),
    chair: new THREE.MeshStandardMaterial({ color: 0x2E3A46, roughness: .9 }),
    white: new THREE.MeshStandardMaterial({ color: 0xBFC5C8, roughness: .7 }),
    steel: new THREE.MeshStandardMaterial({ color: 0x5A6670, roughness: .5, metalness: .4 }),
    black: new THREE.MeshStandardMaterial({ color: 0x0E0E10, roughness: .4 }),
    mirror: new THREE.MeshStandardMaterial({ color: 0x1A2630, roughness: .08, metalness: .9 }),
    shelf: new THREE.MeshStandardMaterial({ color: 0x3A2616, roughness: .9 }),
    hide: texMat(hideTex, 1, 1)
  };
  const books = texMat(bookTex, 1, 1);

  const FLOORS = MAP.floors.map((len, i) => ({ z0: i * 40, len, name: i ? 'TINGKAT ATAS' : 'TINGKAT BAWAH' }));
  const rooms = MAP.rooms.map(([f, side, x1, x2, door, kind, name]) => ({ f, side, x1, x2, door, kind, name }));
  rooms.forEach(r => {
    r.zc = FLOORS[r.f].z0; r.zn = r.zc + r.side * 2; r.zf = r.zc + r.side * 12;
    r.cx = (r.x1 + r.x2) / 2; r.cz = r.zc + r.side * 7; r.inF = r.side < 0 ? '+z' : '-z';
  });
  const HIDES = MAP.hides;
  const LKW = .78;                                       // separuh lebar almari (muat 2 orang)
  const lockers = [];
  const fixtures = [], fans = [], clocks = [], sources = [], inter = [];

  FLOORS.forEach((F, fi) => {
    const zc = F.z0;
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(F.len + 2, 25), texMat(floorTex, (F.len + 2) / 2, 12.5));
    fl.rotation.x = -Math.PI / 2; fl.position.set(F.len / 2, 0, zc); scene.add(fl);
    const ce = new THREE.Mesh(new THREE.PlaneGeometry(F.len + 2, 25), texMat(ceilTex, (F.len + 2) / 2, 12.5));
    ce.rotation.x = Math.PI / 2; ce.position.set(F.len / 2, H, zc); scene.add(ce);
    [-1, 1].forEach(side => {
      const doors = rooms.filter(r => r.f === fi && r.side === side).map(r => r.door).sort((a, b) => a - b);
      const zA = zc + side * 1.9, zB = zc + side * 2.1;
      let x = 0;
      doors.concat([F.len + 1]).forEach(d => { const e = Math.min(d - 1, F.len); if (e > x) wall(x, zA, e, zB); x = d + 1; });
      doors.forEach(d => box(d - 1, zA, d + 1, zB, H - 2.3, 2.3, dark, false));
      if (side > 0){                                             // loker sepanjang dinding selatan
        const hs = HIDES.filter(h => h[0] === fi).map(h => h[1]);
        const cuts = doors.map(d => [d - 1.6, d + 1.6]).concat(hs.map(h => [h - LKW - .05, h + LKW + .05])).sort((a, b) => a[0] - b[0]);
        let a = 1;
        cuts.concat([[F.len - 1, F.len]]).forEach(([c0, c1]) => { if (c0 - a > .3) box(a, zc + 1.55, c0, zc + 1.9, 2, 0, texMat(lockerTex, (c0 - a) / 4, 1), true); a = Math.max(a, c1); });
        hs.forEach(h => {                                       // almari 2 orang: badan + 2 pintu berengsel (dianimasi)
          [[h - LKW, zc + 1.86, h + LKW, zc + 1.9, 2.2, 0], [h - LKW, zc + 1.4, h - LKW + .05, zc + 1.9, 2.2, 0], [h + LKW - .05, zc + 1.4, h + LKW, zc + 1.9, 2.2, 0],
           [h - LKW, zc + 1.4, h + LKW, zc + 1.9, .06, 2.14], [h - .02, zc + 1.45, h + .02, zc + 1.88, 2.1, 0]].forEach(b => box(b[0], b[1], b[2], b[3], b[4], b[5], M.hide, false));
          solids.push({ x1: h - LKW, z1: zc + 1.4, x2: h + LKW, z2: zc + 1.9 });
          const doors = [-1, 1].map(sd => { const piv = new THREE.Group(); piv.position.set(h + sd * LKW, 0, zc + 1.4);
            const dm = new THREE.Mesh(new THREE.BoxGeometry(LKW - .03, 2.08, .04), M.hide); dm.position.set(-sd * (LKW / 2), 1.08, 0); piv.add(dm);
            [.55, .7, .85].forEach(y => { const sl = new THREE.Mesh(new THREE.BoxGeometry(LKW * .6, .03, .01), new THREE.MeshBasicMaterial({ color: 0x050505 })); sl.position.set(-sd * (LKW / 2), 1.08 + y * .9, -.025); piv.add(sl); });
            scene.add(piv); return { piv, sd, a: 0, to: 0 }; });
          const lk = { x: h, zc, doors, occ: [null, null] }; lockers.push(lk);
          inter.push({ f: fi, x: h, z: zc + .95, kind: 'hide', spot: { f: fi, x: h, zc, lk } });
        });
      }
    });
    wall(-.2, zc - 2.1, 0, zc + 2.1); wall(F.len, zc - 2.1, F.len + .2, zc + 2.1);
    for (let x = 4; x < F.len; x += 8) fixtures.push({ f: fi, x, z: zc });
  });

  /* ---------- isi bilik ---------- */
  const boards = [];
  function drawBoard(bd){
    const c = bd.tex.userData.canvas, g = c.getContext('2d'), w = c.width, h = c.height;
    const match = bd.type === 'match';
    g.fillStyle = '#4A2E1A'; g.fillRect(0, 0, w, h);
    g.fillStyle = bd.solved ? '#13301F' : match ? '#2A1A40' : '#163A28'; g.fillRect(10, 10, w - 20, h - 20);
    g.fillStyle = 'rgba(255,255,255,.08)';
    for (let k = 0; k < 14; k++) g.fillRect(20 + Math.random() * (w - 80), 20 + Math.random() * (h - 40), 20 + Math.random() * 60, 2);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (bd.solved){
      g.fillStyle = '#4ADE80'; g.font = 'bold 120px sans-serif'; g.fillText('✓', w / 2, h / 2 - 10);
      g.font = 'bold 26px sans-serif'; g.fillText('KUNCI DIAMBIL', w / 2, h - 40);
    } else {
      const glow = match ? '#C8A0FF' : '#7CFFB2';
      g.fillStyle = '#F2ECF8'; g.shadowColor = glow; g.shadowBlur = 18;
      g.font = 'bold ' + (match ? 96 : 130) + 'px sans-serif'; g.fillText(match ? '⇄' : '?', w / 2, h / 2 - 8);
      g.shadowBlur = 0; g.font = 'bold 24px sans-serif'; g.fillStyle = 'rgba(242,236,248,.8)';
      g.fillText(match ? 'PADANKAN UNTUK KUNCI' : 'JAWAB UNTUK KUNCI', w / 2, h - 36);
    }
    bd.tex.needsUpdate = true;
  }
  function addBoard(r, type){
    const tex = canvasTex(512, 256, () => {});
    const mesh = decal(r.door, 1.6, r.zf - r.side * .06, 3.2, 1.6, tex, r.inF, .55);
    const bd = { type, tex, mesh, solved: false, label: r.name, name: r.name,
      reset(){ bd.solved = false; drawBoard(bd); } };
    drawBoard(bd); boards.push(bd); sources.push(bd);
    inter.push({ f: r.f, x: r.door, z: r.zf - r.side * 1.4, kind: 'board', bd });
    return bd;
  }
  const desks = (r, rows) => [-2.8, 2.8].forEach(dx => rows.forEach(dep => {
    const cx = r.door + dx + (Math.random() - .5) * .4, cz = r.zc + r.side * (2 + dep);
    const d = box(cx - .5, cz - .32, cx + .5, cz + .32, .75, 0, M.desk, true);
    d.rotation.y = (Math.random() - .5) * .35;
    box(cx - .22, cz + r.side * .5 - .2, cx + .22, cz + r.side * .5 + .2, .45, 0, M.chair, false);
  }));
  const addFan = (x, z) => {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.08, .1, .25, 10), M.steel));
    for (let k = 0; k < 3; k++){ const b = new THREE.Mesh(new THREE.BoxGeometry(1.1, .02, .16), M.white); b.position.x = .6; const arm = new THREE.Group(); arm.add(b); arm.rotation.y = k * Math.PI * 2 / 3; g.add(arm); }
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(.02, .02, .3, 6), M.steel); rod.position.y = .25; g.add(rod);
    g.position.set(x, H - .45, z); scene.add(g); fans.push({ g, sp: .8 + Math.random() * 1.6 });
  };
  const addClock = (x, y, z, face) => {
    decal(x, y, z, .55, .55, clockTex, face);
    const hand = new THREE.Mesh(new THREE.BoxGeometry(.012, .22, .01), new THREE.MeshBasicMaterial({ color: 0xaa1111 }));
    hand.geometry.translate(0, .1, 0);
    const pivot = new THREE.Group(); pivot.position.set(x, y, z); pivot.rotation.y = FACE[face];
    hand.position.z = .012; pivot.add(hand); scene.add(pivot);
    clocks.push({ hand, x, z, f: null, sec: 0 });
    return clocks[clocks.length - 1];
  };
  /* digit kod Bilik Guru — tersembunyi di dinding */
  const CODE = MP ? mp.cfg.code3.slice() : [0, 0, 0].map(() => Math.floor(Math.random() * 10));
  const found = [false, false, false];
  const digits = [];
  const addDigit = (idx, f, x, y, z, face) => {
    const tex = canvasTex(256, 256, (g, w, h) => {
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#9B0000'; g.shadowColor = '#ff2020'; g.shadowBlur = 14; g.font = 'bold 170px serif'; g.fillText(String(CODE[idx]), w / 2, h / 2 - 16);
      g.shadowBlur = 0; g.font = 'bold 24px sans-serif'; g.fillStyle = '#C04040'; g.fillText('nombor ke-' + (idx + 1), w / 2, h - 30);
    });
    decal(x, y, z, .9, .9, tex, face, .45, true);
    digits.push({ idx, f, x, z, face });
  };

  let staffDoor = null;
  const MATCH_ROOM = rooms.find(r => r.kind === 'library');
  rooms.forEach((r, ri) => {
    const { side, zc, zf, zn } = r;
    wall(r.x1, Math.min(zf, zf + side * .2), r.x2, Math.max(zf, zf + side * .2));
    wall(r.x1 - .2, Math.min(zn, zf), r.x1, Math.max(zn, zf));
    wall(r.x2, Math.min(zn, zf), r.x2 + .2, Math.max(zn, zf));
    decal(r.door, 2.62, zc + side * 1.88, 1.9, .36, plateTex(r.name), side < 0 ? '+z' : '-z', .5);
    fixtures.push({ f: r.f, x: r.cx, z: r.cz });
    if (r.kind === 'class'){
      desks(r, [3, 5.2, 7.4]);
      addBoard(r, 'mcq');
      addClock(r.door + 2.6, 2.6, zf - side * .04, r.inF);
      addFan(r.cx + 2, r.cz);
      const posters = [flagTex, rukunTex, noticeTex, flagTex];
      const pt = posters[ri % posters.length], tall = pt === rukunTex;
      decal(r.x1 + .03, 1.75, r.cz, tall ? 1 : 1.5, tall ? 1.25 : (pt === flagTex ? .75 : 1.03), pt, '+x');
    } else if (r.kind === 'library'){
      box(r.x1, zn + side * .5, r.x1 + .5, zf - side * .5, 2.3, 0, books, true);
      box(r.x2 - .5, zn + side * .5, r.x2, zf - side * .5, 2.3, 0, books, true);
      [r.cx - 4.5, r.cx + 4.5].forEach(x => box(x - .25, zc + side * 4.5, x + .25, zc + side * 9, 2.1, 0, books, true));
      box(r.door - 1.2, zc + side * 4.2, r.door + 1.2, zc + side * 5.4, .78, 0, M.desk, true);
      addBoard(r, 'match');
      decal(r.door - 3.4, 2.2, zf - side * .04, 1.8, .45, scrawlTex('SILA SENYAP'), r.inF, .3, true);
    } else if (r.kind === 'toilet'){
      for (let k = 0; k < 3; k++){                           // pintu tandas
        const x = r.x1 + 1 + k * 2.1;
        box(x, zf - side * 1.7, x + .06, zf, 2, 0, M.white, true);
      }
      box(r.x2 - .06, zf - side * 1.7, r.x2, zf, 2, 0, M.white, false);
      box(r.x1 + .9, zf - side * 1.7, r.x2 - .1, zf - side * 1.66, 2, 0, M.white, false);
      [zc + side * 3.5, zc + side * 5.5].forEach(z => box(r.x1, z - .4, r.x1 + .6, z + .4, .85, 0, M.white, true));
      const mir = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.1), M.mirror); mir.position.set(r.x1 + .03, 1.75, zc + side * 4.5); mir.rotation.y = FACE['+x']; scene.add(mir);
      addDigit(0, r.f, r.x1 + .05, 1.75, zc + side * 4.5, '+x');
    } else if (r.kind === 'staff'){
      box(r.cx - 1.4, zf - side * 2.4, r.cx + 1.4, zf - side * 1.6, .8, 0, M.desk, true);
      box(r.x1 + .5, zc + side * 4, r.x1 + 1.6, zc + side * 5.2, .78, 0, M.desk, true);
      box(r.x2 - .6, zn + side * 1, r.x2, zn + side * 3.5, 1.9, 0, M.steel, true);
      decal(r.x2 - .03, 1.7, r.cz + side * 2, 1.5, 1.03, noticeTex, '-x');
      // pintu berkunci (dibuka dengan kod)
      const pad = canvasTex(256, 360, (g, w, h) => {
        g.fillStyle = '#4A2A1A'; g.fillRect(0, 0, w, h); grime(g, w, h, 300, .4);
        g.fillStyle = '#C8A040'; g.fillRect(w/2 - 34, h/2 - 20, 68, 56); g.strokeStyle = '#C8A040'; g.lineWidth = 10;
        g.beginPath(); g.arc(w/2, h/2 - 20, 24, Math.PI, 0); g.stroke();
        g.fillStyle = '#FFE9A8'; g.font = 'bold 26px sans-serif'; g.textAlign = 'center'; g.fillText('KOD ? ? ?', w/2, h/2 + 90);
      });
      const dm = decal(r.door, 1.15, zc + side * 1.92, 2, 2.3, pad, '-z');
      const ds = { x1: r.door - 1, z1: zc + 1.85, x2: r.door + 1, z2: zc + 2.1 };
      solids.push(ds);
      staffDoor = { mesh: dm, solid: ds, open: false };
      inter.push({ f: r.f, x: r.door, z: zc + side * 1.1, kind: 'lock' });
      // kunci emas di atas meja guru
      const key = new THREE.Group();
      const gold = new THREE.MeshStandardMaterial({ color: 0xFFD76A, emissive: 0xAA7A10, emissiveIntensity: .9, metalness: .8, roughness: .3 });
      const ring = new THREE.Mesh(new THREE.TorusGeometry(.09, .025, 8, 16), gold); ring.position.x = -.14; key.add(ring);
      const shaft = new THREE.Mesh(new THREE.BoxGeometry(.24, .03, .03), gold); shaft.position.x = .04; key.add(shaft);
      const bit = new THREE.Mesh(new THREE.BoxGeometry(.03, .08, .03), gold); bit.position.set(.14, -.04, 0); key.add(bit);
      key.position.set(r.cx, 1.0, zf - side * 2); scene.add(key);
      const src = { name: 'BILIK GURU', solved: false, mesh: key, reset(){ src.solved = false; key.visible = true; } };
      sources.push(src);
      inter.push({ f: r.f, x: r.cx, z: zf - side * 3.2, kind: 'pickup', src });
    } else if (r.kind === 'lab'){
      [zc + side * 4.5, zc + side * 7.5].forEach(z => box(r.cx - 3.2, z - .45, r.cx + 3.2, z + .45, .9, 0, M.black, true));
      box(r.x2 - .7, zf - side * 3, r.x2, zf - side * 1, 1, 0, M.white, true);
      decal(r.cx, 1.8, zf - side * .03, 2.4, 1.5, periodicTex, r.inF);
      addDigit(1, r.f, r.x1 + .05, 1.8, r.cz, '+x');
      addFan(r.cx + 2, r.cz);
    } else if (r.kind === 'music'){
      box(r.x1 + .4, zc + side * 8, r.x1 + 2.2, zc + side * 9.4, 1.05, 0, M.black, true);   // piano
      const drum = new THREE.Mesh(new THREE.CylinderGeometry(.4, .4, .5, 16), new THREE.MeshStandardMaterial({ color: 0x8B1A1A })); drum.position.set(r.x2 - 1.5, .25, r.cz); scene.add(drum);
      solids.push({ x1: r.x2 - 1.9, z1: r.cz - .4, x2: r.x2 - 1.1, z2: r.cz + .4 });
      [[-1.5, 4], [1.5, 4], [0, 6]].forEach(([dx, dep]) => box(r.cx + dx - .22, zc + side * dep - .2, r.cx + dx + .22, zc + side * dep + .2, .45, 0, M.chair, false));
      addDigit(2, r.f, r.cx, 1.8, zf - side * .05, r.inF);
      addClock(r.x2 - .03, 2.5, r.cz, '-x');
    } else if (r.kind === 'stairs'){
      const up = r.f === 0;
      for (let k = 0; k < 7; k++){
        const za = zc + side * (6 + k * .8), zb = zc + side * (6.8 + k * .8);
        box(r.x1 + .8, za, r.x2 - .8, zb, up ? .2 * (k + 1) : .2 * (7 - k), 0, M.steel, true);
      }
      decal(r.x1 + .03, 2.1, zc + side * 4, 2, .5, plateTex(up ? 'NAIK ↑ TINGKAT ATAS' : 'TURUN ↓ TINGKAT BAWAH'), '+x', .4);
      inter.push({ f: r.f, x: r.door, z: zc + side * 4.6, kind: 'stairs', to: up ? 1 : 0 });
    }
  });
  const STAIRS = [0, 1].map(f => rooms.find(r => r.f === f && r.kind === 'stairs'));
  clocks.forEach(c => { c.f = c.z > 20 ? 1 : 0; });

  // hiasan koridor
  decal(5, 2.5, -1.88, 5, .94, welcomeTex, '+z', .25);
  decal(16, 1.9, -1.88, 4, 1, scrawlTex('JAWAB... ATAU KEKAL DI SINI'), '+z', .6, true);
  decal(20, 1.9, 40 - 1.88, 4, 1, scrawlTex('DIA ADA DI ATAS...'), '+z', .6, true);
  decal(36, 1.8, -1.88, 1.4, .7, flagTex, '+z');

  // pintu KELUAR di hujung timur tingkat bawah
  const EXIT_X = FLOORS[0].len;
  const signTex = canvasTex(256, 64, () => {});
  const drawSign = open => {
    const c = signTex.userData.canvas, g = c.getContext('2d');
    g.fillStyle = open ? '#0B3B1E' : '#3B0B0B'; g.fillRect(0, 0, 256, 64);
    g.fillStyle = open ? '#4ADE80' : '#FF3B3B'; g.font = 'bold 40px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(open ? 'KELUAR ➜' : 'KELUAR', 128, 34); signTex.needsUpdate = true;
  };
  drawSign(false);
  decal(EXIT_X - .12, 2.75, 0, 1.4, .35, signTex, '-x', 1);
  const door = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.3), new THREE.MeshStandardMaterial({ color: 0x4A1A12, roughness: .8, metalness: .2 }));
  door.position.set(EXIT_X - .12, 1.15, 0); door.rotation.y = FACE['-x']; scene.add(door);
  const exitLight = new THREE.PointLight(0xff2020, 6, 7, 2); exitLight.position.set(EXIT_X - 1.2, 2.4, 0); scene.add(exitLight);
  inter.push({ f: 0, x: EXIT_X - 1, z: 0, kind: 'exit' });

  /* ---------- lampu: tiub di setiap lekapan, 4 cahaya sebenar diagih ke yang terdekat ---------- */
  const tubeMat = () => new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xcfe8d8, emissiveIntensity: 1 });
  fixtures.forEach(fx => { fx.tube = box(fx.x - .6, fx.z - .08, fx.x + .6, fx.z + .08, .05, H - .1, tubeMat(), false); fx.t = Math.random() * 5; fx.v = 1; fx.dead = Math.random() < .18; });
  const pool = [0, 1, 2, 3].map(() => { const l = new THREE.PointLight(0xcfe8d8, 0, 11, 2); scene.add(l); return l; });
  const torch = new THREE.SpotLight(0xfff1d6, LT.torch, 20, .5, .55, 1.6);
  /* lampu suluh dipegang watak (tangan kanan); hos (penonton) kekal pada kamera */
  if (MPH){ torch.position.set(0, -.1, 0); cam.add(torch); cam.add(torch.target); torch.target.position.set(0, -.15, -1); }
  else { torch.angle = .42; torch.penumbra = .45; scene.add(torch); scene.add(torch.target); }

  /* ---------- hantu ---------- */
  function buildGhost(kind){
    const g = new THREE.Group();
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const eyeMat = new THREE.MeshBasicMaterial({ color: kind === 'toyol' ? 0xff3010 : 0xff2a2a });
    const ragged = (geo, below, amt) => { const p = geo.attributes.position; for (let i = 0; i < p.count; i++) if (p.getY(i) < below) p.setY(i, p.getY(i) - Math.random() * amt); geo.computeVertexNormals(); return geo; };
    const eyes = (y, z, sx, r) => [-sx, sx].forEach(x => {
      const hole = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), holeMat); hole.position.set(x, y, z); hole.scale.z = .5; g.add(hole);
      const eye = new THREE.Mesh(new THREE.SphereGeometry(r * .35, 8, 6), eyeMat); eye.position.set(x, y, z + .05); g.add(eye);
    });
    if (kind === 'pontianak'){
      const dress = new THREE.MeshStandardMaterial({ color: 0xEDEDE8, emissive: 0x707878, emissiveIntensity: .5, transparent: true, opacity: .9, side: THREE.DoubleSide, roughness: 1 });
      const skin = new THREE.MeshStandardMaterial({ color: 0xE8E4DC, emissive: 0x605A55, emissiveIntensity: .45, roughness: 1 });

    }
  }
  function netGhost(dt){
    if (!NET || !NET.g) return;
    const g = NET.g; if (G.f !== g.f){ G.f = g.f; G.x = g.x; G.z = g.z; }
    G.x += (g.x - G.x) * Math.min(1, dt * 10); G.z += (g.z - G.z) * Math.min(1, dt * 10);

  }
  /* pemain lain: watak + nama; dalam almari hanya nampak bila kita dalam almari yang sama */
  const others = new Map(); let lkLt = null;
  const nameTag = t => { const c = document.createElement('canvas'); c.width = 256; c.height = 64; const g = c.getContext('2d');
    g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; const w = Math.min(250, g.measureText(t).width + 24);
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(128 - w / 2, 12, w, 40); g.fillStyle = '#FDE68A'; g.fillText(t, 128, 33);
    const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, depthTest: false, transparent: true })); sp.scale.set(1.2, .3, 1); sp.position.y = 2.05; sp.renderOrder = 5; return sp; };
  function renderOthers(dt){
    const openLk = new Set(MPS.filter(q => q.st && q.st.d >= 0).map(q => q.st.d));
    lockers.forEach((lk, li) => { if (!(P.anim && P.anim.spot.lk === lk)) lk.doors.forEach(dr => dr.to = openLk.has(li) ? 1.75 : 0); });
    let shared = false;
    if (!lkLt){ lkLt = new THREE.PointLight(0xffd9a0, 2.2, 2.2); scene.add(lkLt); }
    MPS.forEach(q => {
      if (MPC && q.i === mp.seat) return;
      const t = q.st; if (!t || !q.char) return;
      let o = others.get(q.i);
      if (!o){ o = { g: new THREE.Group(), mix: null, act: {}, now: null, x: t.x, z: t.z, f: t.f, face: t.face || 0 }; others.set(q.i, o); scene.add(o.g); o.g.add(nameTag(q.name));
        escModel(THREE, q.char).then(gl => { if (!alive) return; const m = gl.scene, bx = new THREE.Box3().setFromObject(m), hh = bx.max.y - bx.min.y || 1, k = 1.62 / hh;
          m.scale.setScalar(k); m.position.y = -bx.min.y * k; m.traverse(z => { if (z.isMesh) z.frustumCulled = false; }); o.g.add(m);
          o.mix = new THREE.AnimationMixer(m); gl.animations.forEach(c => o.act[c.name] = o.mix.clipAction(c)); if (o.act.walk) o.act.walk.timeScale = .85; }).catch(() => {}); }
      if (o.f !== t.f){ o.f = t.f; o.x = t.x; o.z = t.z; }
      o.x += (t.x - o.x) * Math.min(1, dt * 10); o.z += (t.z - o.z) * Math.min(1, dt * 10);
      let df = (t.face || 0) - o.face; df = Math.atan2(Math.sin(df), Math.cos(df)); o.face += df * Math.min(1, dt * 10);
      const meIn = !!(P.hide && t.h && lockers.indexOf(P.hide.lk) === t.h[0]);

      else { o.g.position.set(o.x, 0, o.z); o.g.rotation.y = o.face; }

  function frame(now){
    if (!alive) return;

    }
    ambient(dt, now);
    R.render(scene, cam); if (LIVE.frame) LIVE.frame(R.domElement);

  }

  if (nav){ setTab(nav.dataset.nav); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const fn = ACTS[a.dataset.act];
  if (fn) fn(a.dataset);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ctxClass'){ S.ui.activeClassId = t.value; selReset(); STU_Q = ''; REC_DATE = null; save(); renderAll(); autoSubject(); }
  if (t.id === 'ctxSubject'){ S.ui.activeSubjectId = t.value; REC_DATE = null; save(); renderAll(); }
  if (t.id === 'mtxClass'){ S.ui.mtxClass = t.value; save(); renderTab(); }
  if (t.id === 'qzSubj'){ S.ui.qzSubject = t.value; S.ui.qzF = null; S.ui.qzP = ''; save(); closeTop(); quizManager(); }
  if (t.id === 'qzF'){ S.ui.qzF = t.value; S.ui.qzP = ''; closeTop(); quizManager(); }
  if (t.id === 'qzP'){ S.ui.qzP = t.value; closeTop(); quizManager(); }
  if (t.id === 'ttClass'){ S.ui.ttClass = t.value; save(); renderTab(); }
  if (t.id === 'ttSubject'){ S.ui.ttSubject = t.value; save(); renderTab(); }
  if (t.id === 'mtxSubject'){ S.ui.mtxSubject = t.value; save(); renderTab(); }

});
// TAHAN gambar pelajar (450ms) = masuk mod pilih ramai
let holdT = null, holdXY = null, holdFired = false;
document.addEventListener('pointerdown', e => {
  const av = e.target.closest('[data-hold]'); if (!av) return;
  holdFired = false; holdXY = [e.clientX, e.clientY];
  clearTimeout(holdT);
  holdT = setTimeout(() => { holdFired = true; holdT = null; SEL.on = true; selToggle(av.dataset.hold); }, 450);
});
document.addEventListener('pointermove', e => {
  if (holdT && holdXY && (Math.abs(e.clientX-holdXY[0]) > 10 || Math.abs(e.clientY-holdXY[1]) > 10)){ clearTimeout(holdT); holdT = null; }
});
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => { if (holdT){ clearTimeout(holdT); holdT = null; } }, true));
document.addEventListener('contextmenu', e => {
  const t = e.target;
  if (t.closest('input, textarea, [contenteditable], pre, .selectable')) return;   // benarkan salin dalam medan & kod
  e.preventDefault();
});
document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
document.addEventListener('selectstart', e => {
  if (e.target.closest && e.target.closest('input, textarea, [contenteditable], pre, .selectable')) return;
  e.preventDefault();
});
document.addEventListener('input', e => { if (e.target.id === 'stuSearch'){ STU_Q = e.target.value; applyStuFilter(); } });

// double-tap pada kad pelajar = nilai (mod biasa) · ketik = togol pilihan (mod pilih)
let lastTap = 0, lastId = '';
document.addEventListener('pointerup', e => {
  const card = e.target.closest('[data-stu]');
  if (!card || e.target.closest('[data-act]')) return;
  if (holdFired){ holdFired = false; return; }
  if (SEL.on){ selToggle(card.dataset.stu); return; }
  const now = Date.now();
  if (now - lastTap < 350 && lastId === card.dataset.stu) { openEval([card.dataset.stu], (stu(card.dataset.stu)||{}).name); lastTap = 0; }
  else { lastTap = now; lastId = card.dataset.stu; }
});

/* ============ PWA ============ */
/* Manifest dijana dalam fail ini (satu fail sahaja).
   start_url membawa penanda ?src=hs supaya app tahu ia dibuka dari skrin utama. */
function initPWA(){
  const base = location.origin + location.pathname;
  const manifest = {
    name: APP_NAME, short_name: APP_NAME, description: 'EduRank — dicipta oleh ' + APP_AUTHOR,
    start_url: base + '?src=hs', scope: location.origin + location.pathname.replace(/[^/]*$/, ''),
    display:'standalone', orientation:'portrait', background_color:'#0C1118', theme_color:'#0C1118',
    icons:[
      { src: APP_ICON, sizes:'192x192', type:'image/png', purpose:'any' },
      { src: APP_ICON, sizes:'512x512', type:'image/png', purpose:'any' }
    ]
  };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
  document.head.appendChild(l);
}

/* ============ SKRIN ARAHAN PEMASANGAN ============ */
function isInstalled(){
  const hs = new URLSearchParams(location.search).get('src') === 'hs';
  if (hs) try { sessionStorage.setItem('rk_hs','1'); } catch(e){}
  let flag = false; try { flag = sessionStorage.getItem('rk_hs') === '1'; } catch(e){}
  let pc = false; try { pc = localStorage.getItem('rk_pc') === '1'; } catch(e){}   // dibuka di komputer (butang PC) — diingat pada pelayar ini
  return hs || flag || pc
    || ['standalone','fullscreen','minimal-ui'].some(m => window.matchMedia('(display-mode: '+m+')').matches)
    || window.navigator.standalone === true;
}
function installGate(){
  ['header','nav','#main'].forEach(sel => { const el = $(sel); if (el) el.style.display = 'none'; });
  const ua = navigator.userAgent;
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const step = (n, icon, text) =>
    '<div class="flex items-center gap-3 panel clip-s p-3 mb-2 text-left">' +
    '<div class="num text-orange text-[18px] w-5">'+n+'</div>' +
    '<i class="fa-solid '+icon+' text-cyan text-[18px] w-6 text-center"></i>' +
    '<div class="text-[13px] leading-snug flex-1">'+text+'</div></div>';
  const android =
    step(1,'fa-ellipsis-vertical','Tekan menu <b>⋮</b> di penjuru kanan atas Chrome') +
    step(2,'fa-mobile-screen-button','Pilih <b>Tambah ke skrin utama</b> atau <b>Pasang aplikasi</b>') +
    step(3,'fa-check','Tekan <b>Tambah / Pasang</b>, kemudian buka <b>EduRank</b> dari skrin utama');
  const iphone =
    step(1,'fa-arrow-up-from-bracket','Buka dalam <b>Safari</b>, tekan butang <b>Kongsi</b> di bar bawah') +
    step(2,'fa-square-plus','Pilih <b>Tambah ke Skrin Utama</b> (Add to Home Screen)') +
    step(3,'fa-check','Tekan <b>Tambah</b>, kemudian buka <b>EduRank</b> dari skrin utama');
  const desk = !window.matchMedia('(pointer:coarse)').matches;          // tetikus = komputer / laptop
  const pcBox = '<div class="lbl text-left mb-2">KOMPUTER / LAPTOP</div>' +
    '<button id="gatePC" class="btn btn-o clip-s w-full !py-3 text-[15px]"><i class="fa-solid fa-desktop"></i> BUKA DI KOMPUTER</button>' +
    '<button id="gateInst" class="btn clip-s w-full !py-2 mt-2 text-[13px]" style="display:none"><i class="fa-solid fa-download text-cyan"></i> Pasang sebagai aplikasi komputer</button>' +
    '<div class="text-[11px] text-muted mt-2 text-left leading-snug">Data disimpan dalam pelayar komputer ini. Untuk data yang sama dengan telefon, hidupkan <b>Penyegerakan Firebase</b> di Tetapan.</div>';
  document.body.insertAdjacentHTML('beforeend',
    '<div id="gate" style="position:fixed;inset:0;z-index:1000;overflow-y:auto;display:flex;align-items:center;justify-content:center;' +
      'padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));background:radial-gradient(circle at 50% 25%,rgba(255,107,0,.14),transparent 60%),#0C1118">' +
      '<div class="w-full max-w-sm text-center">' +
        '<img src="'+APP_ICON+'" alt="EduRank" class="mx-auto" style="width:100px;height:100px;object-fit:contain;border-radius:24px;box-shadow:0 0 36px rgba(255,107,0,.35)" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="font-bold tracking-[.25em] text-[28px] glow-o mt-4">EDURANK</div>' +
        '<div class="text-[13px] text-muted mt-2 mb-5">Pasang EduRank ke skrin utama untuk mula menggunakan.</div>' +
        (desk ? pcBox + '<div class="lbl text-left mb-2 mt-5">TELEFON / TABLET</div>' : '<div class="lbl text-left mb-2">'+(ios ? 'IPHONE / IPAD' : 'ANDROID')+'</div>') +
        (ios ? iphone : android) +
        '<details class="mt-3 text-left"><summary class="text-[11px] text-muted">Arahan untuk '+(ios ? 'Android' : 'iPhone / iPad')+'</summary><div class="mt-2">'+(ios ? android : iphone)+'</div></details>' +
        (desk ? '' : '<div class="mt-5">' + pcBox + '</div>') +
        '<div class="text-[10px] text-muted mt-8 tracking-widest">DICIPTA OLEH ARIF AZIZ</div>' +
      '</div></div>');
  $('#gatePC').onclick = () => { try { localStorage.setItem('rk_pc', '1'); } catch(e){} location.reload(); };
  // Chrome / Edge komputer boleh pasang EduRank sebagai aplikasi (ikon di desktop)
  const showInst = ev => { const b = $('#gateInst'); if (!b) return; b.style.display = '';
    b.onclick = async () => { ev.prompt(); const r = await ev.userChoice.catch(() => null); if (r && r.outcome === 'accepted') toast('EduRank dipasang — buka dari ikon di desktop.'); }; };
  if (window.__bip) showInst(window.__bip);
  window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); window.__bip = ev; showInst(ev); });
}

/* ============ INIT ============ */
(async function init(){
  // Mod paparan awam: ?s=... → showcase sahaja, tiada state tempatan, tiada Firebase SDK
  const vp = new URLSearchParams(location.search).get('s');
  if (vp){ S = blank(); viewerBoot(vp); return; }      // pautan showcase murid: tidak perlu pasang
  const kmp = new URLSearchParams(location.search).get('km');
  if (kmp){ S = blank(); komboJoinBoot(kmp); return; }  // pautan / kod QR sertai Kombo Ilmon: telefon kumpulan, tidak perlu pasang
  initPWA();
  if (!isInstalled()){ installGate(); return; }         // dalam pelayar: tutup app, papar arahan pasang sahaja
  { let pc = false; try { pc = localStorage.getItem('rk_pc') === '1'; } catch(e){}   // butang refresh dalam app dipasang / mod PC (tiada butang refresh pelayar)
    const app = ['standalone','fullscreen','minimal-ui','window-controls-overlay'].some(m => matchMedia('(display-mode: ' + m + ')').matches);
    if (pc || app) $('#hdrRefresh').style.display = ''; }
  IDB = await idbOpen();
  Object.assign(PHOTOS, await idbAll());
  S = load();
  /* Aset sprite / peta / kad muat naik lama dipadam daripada peranti, sekali sahaja. */
  S.subjects.filter(x => x.dskp).forEach(x => dskpLoad(x.dskp).then(() => renderTab()).catch(() => {}));
  dskpIndex().catch(() => {});
  purgeSpriteAssets().then(n => { if (n) console.info('Aset lama dibuang:', n); });
  if (S.ui.tab === 'arena' && !['escape','cards','run','stor'].includes(arenaUi().game)) arenaUi().game = 'cards';
  bgmInit(); audProbe(); kadProbe();
  hintInit();
  if (!S.ui.mtxClass) S.ui.mtxClass = S.ui.activeClassId || '';
  if (!S.ui.mtxSubject) S.ui.mtxSubject = S.ui.activeSubjectId || '';
  $$('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.nav === S.ui.tab));
  renderAll();
  setTimeout(autoSubject, 400);
  fbInit();
  liveWatch(); setInterval(liveWatch, 3000);         // tayangan langsung dari peranti lain
  window.addEventListener('beforeunload', () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} });
  window.addEventListener('storage', e => {
    if (e.key !== LS_KEY || !e.newValue) return;
    try { const d = JSON.parse(e.newValue); if ((d.rev||0) > (S.rev||0)){ S = migrate(d); renderAll(); } } catch(err){}
  });
})();

</script>
