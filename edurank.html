/* ============ ARAHAN DI SEBALIK "?" ============
   Perenggan penerangan yang panjang menyesakkan skrin telefon. Ia disorok
   dan diganti dengan butang "?" kecil; tekan untuk membacanya.
   Automatik untuk seluruh app: perenggan kelabu (text-muted) yang kecil,
   panjang, tiada butang atau input di dalamnya, dan bukan teks dinamik
   (tiada id). Maklumat lain boleh ditanda terus dengan data-hint="Tajuk".
   data-nohint mengecualikan (contoh: sinopsis cerita).                  */
const hintsInline = () => !!(S && S.config && S.config.hintsInline === 1);
const HINT_SKIP = '[data-nohint],#tgWrap,#tgCut,#tgHelp,#dlgBox,.hint-pop';
function hintCandidate(el){
  if (el.__hintDone || el.nodeType !== 1) return false;
  if (el.hasAttribute('data-hint')) return !el.closest(HINT_SKIP);
  if (el.id) return false;
  const c = el.className;
  if (typeof c !== 'string' || c.indexOf('text-muted') < 0 || !/text-\[(9|10|11|12)px\]/.test(c)) return false;
  if (el.closest(HINT_SKIP)) return false;
  /* teks di dalam butang atau baris satu-garis ialah maklumat baris, bukan arahan */
  if (el.closest('button,[data-sb],[data-act]') || /\btruncate\b/.test(c)) return false;
  if (el.querySelector('button,input,select,textarea,canvas,img,[id]')) return false;
  return el.textContent.trim().length >= 60;
}
function hintScan(root){
  if (!root || root.nodeType !== 1 || hintsInline()) return;
  const list = [];
  if ((root.matches('div,p')) && hintCandidate(root)) list.push(root);
  root.querySelectorAll('[data-hint], div.text-muted, p.text-muted').forEach(el => { if (hintCandidate(el)) list.push(el); });
  if (!list.length) return;
  const inList = new Set(list), used = new Set();
  list.forEach(el => {
    if (used.has(el)) return;
    for (let p = el.parentElement; p; p = p.parentElement) if (inList.has(p)) return;   // sudah dalam kumpulan induk
    /* perenggan bersebelahan digabung dalam satu "?" */
    const grp = [el]; used.add(el);
    for (let n = el.nextElementSibling; n && inList.has(n) && !used.has(n); n = n.nextElementSibling){ grp.push(n); used.add(n); }
    hintCollapse(grp);
  });
}
function hintCollapse(grp){
  grp.forEach(e => { e.__hintDone = true; e.classList.add('hint-hid'); });
  const title = grp.map(e => e.getAttribute('data-hint')).find(Boolean) || '';
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'hint-q';
  btn.innerHTML = '<span class="hq">?</span>' + (title ? '<span>' + esc(title) + '</span>' : '');
  btn.setAttribute('aria-label', title || 'Maklumat');
  btn.__hint = grp; btn.__title = title || 'Maklumat';
  /* Ada label tajuk betul-betul di atas? Letak "?" di sebelahnya. */
  const prev = grp[0].previousElementSibling;
  if (!title && prev && prev.classList.contains('lbl')){
    const old = prev.querySelector('.hint-q');
    if (old && !(old.__hint || []).some(x => x.isConnected)) old.remove();
    if (!prev.querySelector('.hint-q')){ prev.appendChild(btn); return; }
  }
  const row = document.createElement('div'); row.className = 'hint-row';
  row.appendChild(btn);
  grp[0].parentNode.insertBefore(row, grp[0]);
}
function hintUndo(){
  $$('.hint-q').forEach(b => { const r = b.parentElement; b.remove(); if (r && r.classList.contains('hint-row')) r.remove(); });
  $$('.hint-hid').forEach(e => { e.classList.remove('hint-hid'); e.__hintDone = false; });
}
function hintInit(){
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.hint-q'); if (!b || !b.__hint) return;
    e.preventDefault(); e.stopPropagation();       // jangan cetuskan baris/butang di bawahnya
    const html = b.__hint.map(x => '<div class="mb-2">' + x.innerHTML + '</div>').join('');
    openModal({ center:true, icon:'fa-circle-question', title:b.__title,
      body:'<div class="hint-pop text-[13px] leading-relaxed" data-nohint="1">' + html + '</div>',
      footer:'<button class="btn btn-o clip-s flex-1" data-close="1">Faham</button>' });
  }, true);
  let q = [], sched = false;
  const flush = () => { sched = false; const nodes = q; q = []; nodes.forEach(n => { if (n.isConnected) hintScan(n); }); };
  new MutationObserver(ms => {
    ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) q.push(n); }));
    if (q.length && !sched){ sched = true; requestAnimationFrame(flush); }
  }).observe(document.body, { childList:true, subtree:true });
  hintScan(document.body);
}

   Keputusan kuiz TIDAK menyentuh TP atau rekod PBD — hanya statistik kuiz. */

/* Soalan diambil ikut URUTAN bank, bukan rawak. Setelah semua soalan
   ditanya sekali, kitaran bermula semula dari awal. */
let QSEQ = { key:'', i:0 };
function nextQ(bank){
  if (!bank || !bank.length) return null;
  const key = bank.map(q => q.id).join('|');
  if (QSEQ.key !== key) QSEQ = { key, i:0 };
  const q = bank[QSEQ.i % bank.length];
  QSEQ.i++;
  return q;
}

/* Tampal balik: guna penghurai soalan yang SAMA dengan Mod Cerita, jadi
   satu format JSON sahaja untuk guru belajar, bukan dua.               */
function tqParse(raw, sj, bab){
  let t = String(raw || '').trim();
  t = t.replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Tiada JSON dijumpai dalam teks yang ditampal.');
  let o;
  try { o = JSON.parse(t.slice(a, b + 1)); }
  catch (e){ throw new Error('JSON tidak sah — ' + e.message); }
  const arr = Array.isArray(o) ? o : Array.isArray(o.soalan) ? o.soalan : null;
  if (!arr || !arr.length) throw new Error('Tiada senarai "soalan" dalam JSON itu.');
  const ch = String(bab || '').trim() || sTxt(o.tajuk, 60);
  const qs = sQuestions(arr, 't' + Date.now().toString(36), 60);
  if (!qs.length) throw new Error('Tiada soalan sah. Setiap soalan perlu "soalan", "pilihan" dan "betul".');
  return qs.map((q, i) => { const sp = skCode(q.sp); return { id:uid('q'), subjectId:sj, chapterId:ch,
    q:q.q, c:q.c, a:q.a, ejek:q.ejek, huraian:q.huraian, sp, sk: sp ? sp.split('.').slice(0, 2).join('.') : '' }; });
}

/* ---------- PENGHURAI SOALAN (JSON daripada AI) ---------- */
const sTxt = (v, max) => String(v === undefined || v === null ? '' : v).trim().slice(0, max || 200);
function sQuestions(arr, bi, cap){
  const out = [];
  (Array.isArray(arr) ? arr : []).slice(0, cap || 12).forEach((v, k) => {
    if (!v || typeof v !== 'object') return;
    const qt = sTxt(v.soalan !== undefined ? v.soalan : v.q, 300);
    const raw = Array.isArray(v.pilihan) ? v.pilihan : Array.isArray(v.c) ? v.c : [];
    const c = raw.slice(0, 4).map(x => sTxt(x, 140));
    while (c.length < 4) c.push('');
    const filled = c.filter(x => x !== '').length;
    if (!qt || filled < 2) return;
    let a = v.betul !== undefined ? v.betul : v.a;
    if (typeof a === 'string'){
      const s = a.trim();
      const li = 'ABCD'.indexOf(s.toUpperCase());
      a = li >= 0 && s.length === 1 ? li : c.findIndex(x => x.toLowerCase() === s.toLowerCase());
    }
    a = +a;
    if (!(a >= 0 && a < 4) || c[a] === '') a = 0;

    if (Array.isArray(src)) src.slice(0, 4).forEach((t, j) => { ej[j] = sTxt(t, 600); });

        const key = String(kk).trim().toUpperCase();

  });
  return out;
}

function weekKey(dk){
  const d = new Date((dk || todayKey()) + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;                 // Isnin = 0
  d.setDate(d.getDate() - day);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const tpcKey = () => weekKey() + '|' + S.ui.activeClassId + '|' + S.ui.activeSubjectId;
function tpcEarned(){
  const cid = S.ui.activeClassId, sj = S.ui.activeSubjectId;
  if (!cid || !sj) return 0;
  const wk = weekKey(), rate = (S.config.tpcRate === undefined ? 1 : S.config.tpcRate);
  let sum = 0;
  studentsOf(cid).forEach(s => {
    const days = (S.records[s.id] || {})[sj] || {};
    Object.keys(days).forEach(d => { if (weekKey(d) === wk){ const r = rateOf(days[d]); if (r > 0) sum += r; } });
  });
  return Math.floor(sum * rate);
}

let SFX_ON = true;
function sfx(type){
  if (!SFX_ON) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    SFX_CTX = SFX_CTX || new C();
    const a = SFX_CTX, t = a.currentTime;
    const beep = (f1, f2, dur, typ, vol) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = typ || 'sine'; o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
      g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
    };
    if (type === 'tear'){ const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.25, a.sampleRate);
      const d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length) * 0.35;
      n.buffer = b; const g = a.createGain(); g.gain.value = 0.5; n.connect(g); g.connect(a.destination); n.start(); }
    else if (type === 'flip') beep(520, 300, 0.09, 'triangle', 0.08);
    else if (type === 'low') beep(300, 180, 0.12, 'square', 0.06);
    else if (type === 'hi'){ beep(660, 990, 0.35, 'sine', 0.14); setTimeout(()=>beep(880, 1320, 0.45, 'sine', 0.12), 120); }
    else if (type === 'myth'){ beep(120, 40, 0.8, 'sawtooth', 0.22); setTimeout(()=>beep(880,1760,0.9,'sine',0.16), 180); setTimeout(()=>beep(1320,2640,1.1,'sine',0.12), 380); }
    else if (type === 'burst') beep(180, 900, 0.5, 'sawtooth', 0.16);
    else if (type === 'swing'){                       // desing serangan
      const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.16, a.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++){ const p = i/d.length; d[i] = (Math.random()*2-1) * Math.pow(1-p,2) * 0.5; }
      n.buffer = b;
      const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(900, t);
      f.frequency.exponentialRampToValueAtTime(2600, t+0.16);
      const g = a.createGain(); g.gain.value = 0.5;
      n.connect(f); f.connect(g); g.connect(a.destination); n.start();
    }
    else if (type === 'impact'){                      // hentaman kena
      beep(220, 60, 0.18, 'square', 0.18);
      const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.12, a.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length,3) * 0.6;
      n.buffer = b; const g = a.createGain(); g.gain.value = 0.45;
      n.connect(g); g.connect(a.destination); n.start();
    }
    else if (type === 'shoot'){                       // tali busur / lontaran dilepaskan
      beep(170, 80, 0.16, 'triangle', 0.16);
      const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.1, a.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++){ const p = i/d.length; d[i] = (Math.random()*2-1) * Math.pow(1-p,3) * 0.5; }
      n.buffer = b;
      const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(3200, t);
      f.frequency.exponentialRampToValueAtTime(1200, t+0.1);
      const g = a.createGain(); g.gain.value = 0.35;
      n.connect(f); f.connect(g); g.connect(a.destination); n.start();
    }
    else if (type === 'statup') beep(760, 1240, 0.12, 'triangle', 0.1);     // nombor stat naik
    else if (type === 'cardup'){ beep(380, 980, 0.3, 'triangle', 0.13); setTimeout(()=>beep(620,1500,0.35,'sine',0.1), 110); }
  } catch(e){}
}
let SFX_CTX = null;

/* ============ MUZIK LATAR & BUNYI SERANGAN ============
   Lagu dimainkan melalui Web Audio daripada memori, bukan <audio loop>.
   <audio loop> meninggalkan sela kecil di setiap pusingan (terutama MP3);
   AudioBufferSourceNode.loop pula menyambung sampel demi sampel, jadi

const BGM_SLOTS = [

function audCtx(){
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return null;
  SFX_CTX = SFX_CTX || new C();

}
/* Lagu lalai, dijana oleh pemilik app di Suno. Tidak dibenamkan dalam fail
   HTML (akan menambah belasan MB dan melambatkan setiap pembukaan app);
   sebaliknya dimuat turun SEKALI, kemudian disimpan kekal dalam IndexedDB
   supaya selepas itu ia dimainkan serta-merta, walaupun tanpa internet.
   Lagu yang guru muat naik sendiri sentiasa menggantikan lagu lalai.     */
const BGM_DEF = {

};
const bgmDefUrl = k => BGM_DEF[k] ? 'https://cdn1.suno.ai/' + BGM_DEF[k].id + '.mp3' : null;
const bgmOwn = k => { const r = (S.bgm || {})[k]; return r ? (resolveUrl(r.url) || PHOTOS['bgm:' + k] || null) : null; };
const bgmDefOn = () => !(S && S.config && S.config.bgmDef === 0);
const bgmSrc = k => bgmOwn(k) || (bgmDefOn() ? (PHOTOS['bgmdef:' + k] || bgmDefUrl(k)) : null);
/* Simpan lagu lalai yang sudah berjaya dimuat turun, sekali sahaja. */
async function bgmCacheDef(k, ab){
  if (PHOTOS['bgmdef:' + k] || !ab) return;
  try {
    const data = await new Promise((res, rej) => { const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(new Blob([ab], { type:'audio/mpeg' })); });
    PHOTOS['bgmdef:' + k] = data; await idbPut('bgmdef:' + k, data);

}

/* Titik gelung: buang senyap di awal dan hujung fail — MP3 hampir selalu
   membawa padding pengekod beberapa puluh milisaat yang menjadi "ketukan
   kosong" setiap kali lagu berpusing. Dihadkan 0.25 s supaya rehat muzik
   yang memang disengajakan tidak terpotong. */
function loopPoints(buf){
  const sr = buf.sampleRate, n = buf.length, ch = [];
  for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c));
  const loud = i => ch.some(d => Math.abs(d[i]) > 0.0015);
  const cap = Math.min(Math.floor(sr * 0.25), Math.floor(n / 4));
  let s = 0; while (s < cap && !loud(s)) s++;
  let e = n - 1; while ((n - 1 - e) < cap && !loud(e)) e--;
  if (s >= cap) s = 0;
  if ((n - 1 - e) >= cap) e = n - 1;
  return { ls: s / sr, le: (e + 1) / sr };
}
const AUD_BUF = {};
const audKey = src => src.length + ':' + src.slice(-48);
const AUD_RAW = {};
function audBuf(src){
  if (!src) return Promise.resolve(null);
  const k = audKey(src);
  if (AUD_BUF[k]) return AUD_BUF[k];
  const a = audCtx(); if (!a) return Promise.resolve(null);
  AUD_BUF[k] = fetch(src).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
    .then(ab => { if (/^https?:/.test(src)) AUD_RAW[k] = ab.slice(0); return ab; })
    /* decodeAudioData juga memulangkan Promise di pelayar moden; kalau tidak
       ditangkap, fail rosak menjadi ralat halaman walaupun panggilan balik
       ralat sudah dipasang. */
    .then(ab => new Promise((res, rej) => { const p = a.decodeAudioData(ab, res, rej); if (p && p.catch) p.catch(rej); }))
    .then(buf => Object.assign({ buf }, loopPoints(buf)))
    .catch(() => { delete AUD_BUF[k]; return null; });
  return AUD_BUF[k];
}

const BGM = { id:null, src:null, node:null, gain:null, el:null, preview:null, unlocked:false, tok:0 };
function bgmVol(){

function bgmScene(){

async function bgmSwitch(src){
  const a = audCtx(); if (!a) return;
  const tok = ++BGM.tok;
  BGM.src = src;
  if (BGM.node){
    const g = BGM.gain, nd = BGM.node, t = a.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 0.7);
    try { nd.stop(t + 0.75); } catch(e){}
    BGM.node = BGM.gain = null;
  }
  if (BGM.el){ const el = BGM.el; BGM.el = null; bgmFadeEl(el, 0, 600, true); }
  if (!src) return;
  const d = await audBuf(src);
  if (tok !== BGM.tok) return;                // lagu ditukar lagi semasa dinyahkod
  if (!d){
    /* Pelayan lagu tidak membenarkan app membaca baitnya (CORS) atau tiada
       internet: mainkan melalui pemain audio biasa. Masih bergelung, cuma
       mungkin ada sela kecil di hujung setiap pusingan. */
    if (/^https?:/.test(src)){
      const el = new Audio(); el.src = src; el.loop = true; el.volume = 0;
      el.play().then(() => { if (tok === BGM.tok) bgmFadeEl(el, bgmVol(), 800); else el.pause(); }).catch(() => {});
      BGM.el = el;
    }
    return;
  }
  /* Lagu lalai berjaya dimuat turun — simpan kekal untuk kali seterusnya. */
  Object.keys(BGM_DEF).forEach(k => { if (src === bgmDefUrl(k)) bgmCacheDef(k, AUD_RAW[audKey(src)]); });
  const nd = a.createBufferSource(), g = a.createGain();
  nd.buffer = d.buf; nd.loop = true; nd.loopStart = d.ls; nd.loopEnd = d.le;
  g.gain.value = 0; nd.connect(g); g.connect(a.destination);
  const t = a.currentTime;
  nd.start(t, d.ls);

}
function bgmFadeEl(el, to, ms, stopAfter){
  const from = el.volume, t0 = performance.now();
  const step = () => {
    const p = Math.min(1, (performance.now() - t0) / ms);
    try { el.volume = Math.max(0, Math.min(1, from + (to - from) * p)); } catch(e){}
    if (p < 1) requestAnimationFrame(step); else if (stopAfter){ el.pause(); el.removeAttribute('src'); }
  };
  requestAnimationFrame(step);
}
function bgmApplyVol(){

  if (file.size > maxMB * 1048576)
    throw new Error('Fail terlalu besar (' + (file.size / 1048576).toFixed(1) + ' MB). Had ' + maxMB + ' MB — guna lagu gelung yang pendek.');
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const d = await audBuf(data);
  if (!d) throw new Error('Format audio ini tidak dapat dibaca. Cuba MP3, OGG atau WAV.');
  return { data, dur: d.buf.duration };
}

    nx.style.visibility = 'hidden';
    nx.textContent = (idx === pulls.length - 1) ? 'Selesai' : 'Seterusnya';
    flipped = false;

  function doFlip(){
    const card = $('.pkone-card', bd);
    if (flipped || !card) return;

    card.classList.add('open');
    sfx('flip');
    const dot = $('#dot-'+idx, bd); if (dot) dot.style.background = t.color;

      if (t.fx === 'low') sfx('low');

    const wrap = $('#pkOne', bd);
    wrap.classList.add('slide-out');
    setTimeout(() => { idx++; renderDots(); showCard(); }, 270);
  }
  function finishPack(){

    if (auto) return;

      if (!auto) return;
      const t = tierOfCard(pulls[idx].tier);
      if (!flipped){ doFlip(); setTimeout(step, t.fx === 'low' ? 900 : t.fx === 'hi' ? 2200 : 4200); return; }
      if (idx >= pulls.length - 1){ auto = false; return; }
      nextCard();
      setTimeout(step, 420);

  bd.addEventListener('click', e => {
    if (e.target.closest('[data-flip]')){ doFlip(); return; }
    const b = e.target.closest('[data-pk]'); if (!b) return;

/* ============ DSKP, TAKWIM & RANCANGAN TAHUNAN ============
   DSKP KSSM disimpan sebagai fail berasingan (dskp/index.json + satu fail
   bagi setiap subjek-tingkatan) supaya app kekal ringan. Fail dimuat turun
   hanya untuk subjek yang guru pilih, kemudian disimpan dalam peranti.
   Takwim persekolahan → nombor minggu. Rancangan tahunan (RPT) menyusun
   SK/SP DSKP merentas minggu persekolahan secara automatik; guru boleh
   menukar mana-mana minggu. Setiap rekod PBD dikaitkan dengan topik
   minggu itu, jadi RPM dan Rumusan PBD boleh dikira mengikut tajuk.     */
const DSKP_BASES = ['./dskp/', 'https://bijakmulia.github.io/edurank/dskp/', 'https://bijakmulia.github.io/student-manager/dskp/', 'https://tembakmatiterus-web.github.io/student-manager/dskp/'];
const LS_DSKP_IDX = 'lt_dskp_idx_v1';
let DSKP_IDX = null;
const DSKP = {};                                  // id → buku DSKP yang sudah dimuat
const DSKP_WAIT = {};
async function dskpFetch(file){
  let err = null;
  for (const b of DSKP_BASES){
    try { const r = await fetch(b + file, { cache:'no-cache' }); if (r.ok) return await r.json(); err = new Error('HTTP ' + r.status); }
    catch(e){ err = e; }
  }
  throw err || new Error('Tiada sambungan');
}
async function dskpIndex(){
  if (DSKP_IDX) return DSKP_IDX;
  try { const c = localStorage.getItem(LS_DSKP_IDX); if (c) DSKP_IDX = JSON.parse(c); } catch(e){}
  const fresh = dskpFetch('index.json').then(x => { DSKP_IDX = x; try { localStorage.setItem(LS_DSKP_IDX, JSON.stringify(x)); } catch(e){} return x; });
  if (DSKP_IDX){ fresh.catch(() => {}); return DSKP_IDX; }
  return await fresh;
}
/* Muat satu buku DSKP (dari peranti dahulu, kemudian internet) */
function dskpLoad(id){
  if (!id) return Promise.resolve(null);
  if (DSKP[id]) return Promise.resolve(DSKP[id]);
  if (DSKP_WAIT[id]) return DSKP_WAIT[id];
  return DSKP_WAIT[id] = (async () => {
    let b = null, ver = '';
    try { ver = (await dskpIndex()).made || ''; } catch(e){}
    try { if (PHOTOS['dskp:' + id]) b = JSON.parse(PHOTOS['dskp:' + id]); } catch(e){}
    if (b && ver && b._v !== ver){                    // DSKP di laman lebih baharu: muat turun semula
      try { const nb = await dskpFetch(id + '.json'); b = null; PHOTOS['dskp:' + id] = ''; b = nb; b._fresh = true; } catch(e){}
    }
    if (!b || b._fresh){
      if (!b) b = await dskpFetch(id + '.json');
      delete b._fresh; b._v = ver;
      const s = JSON.stringify(b);
      PHOTOS['dskp:' + id] = s; try { await idbPut('dskp:' + id, s); } catch(e){}
    }
    dskpPrep(b);
    DSKP[id] = b; delete DSKP_WAIT[id];
    return b;
  })().catch(e => { delete DSKP_WAIT[id]; throw e; });
}
/* Senarai SK rata (mengikut urutan DSKP) dengan maklumat tajuk */
function dskpPrep(b){
  b.sk = [];
  b.u.forEach((u, ui) => u[2].forEach(k => b.sk.push({ i: b.sk.length, ui, tema: u[0], tajuk: u[1], sk: k[0], sp: k[1] })));
  return b;
}

/* Buku DSKP subjek (segerak). Jika belum dimuat, mula memuat dan lukis semula bila siap. */
function subjBook(sj){
  const id = subjDskp(sj); if (!id) return null;

function takwim(){

  }
  // tahun baharu bermula: tukar sendiri ke takwim tahun semasa (kumpulan A/B dikekalkan)
  if (S.takwim.year < yr && TAKWIM_PRESET[yr] && !S.takwim.manualYear) takwimPreset(yr, S.takwim.grp || 'B');
  return S.takwim;
}
function takwimPreset(year, grp){
  const p = (TAKWIM_PRESET[year] || {})[grp]; if (!p) return false;
  S.takwim = { year, grp, terms: p.terms.map(x => x.slice()), cuti: p.cuti.map(x => x.slice()) };
  return true;
}
const kd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addDays = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return kd(d); };
let WEEKS_MEMO = { key:'', weeks:[] };
/* Minggu persekolahan: setiap minggu bermula pada hari pertama sekolah
   (Isnin / Ahad), minggu yang kelima-lima hari sekolahnya cuti dilangkau. */
function schoolWeeks(){
  const tk = takwim(), key = JSON.stringify(tk);
  if (WEEKS_MEMO.key === key) return WEEKS_MEMO.weeks;
  const first = tk.grp === 'A' ? 0 : 1;              // Ahad / Isnin
  const inCuti = k => tk.cuti.some(c => k >= c[1] && k <= c[2]);
  const out = [];
  tk.terms.forEach((t, ti) => {
    let d = new Date(t[0] + 'T00:00:00');
    d.setDate(d.getDate() - ((d.getDay() - first + 7) % 7));   // undur ke awal minggu
    for (let k = kd(d); k <= t[1]; k = addDays(k, 7)){
      const days = [0,1,2,3,4].map(i => addDays(k, i)).filter(x => x >= t[0] && x <= t[1] && !inCuti(x));
      if (days.length) out.push({ n: out.length + 1, start: days[0], end: days[days.length - 1], wk: k, term: ti + 1 });
    }
  });
  WEEKS_MEMO = { key, weeks: out };
  return out;
}
/* Minggu bagi satu tarikh: { n, start, end } · atau { cuti: nama } · atau null */
function weekOf(k){
  const ws = schoolWeeks(), tk = takwim();
  const c = tk.cuti.find(x => k >= x[1] && k <= x[2]);
  if (c) return { cuti: c[0], start: c[1], end: c[2] };
  for (const w of ws) if (k >= w.wk && k <= addDays(w.wk, 6)) return w;
  if (ws.length && k < ws[0].start) return { before: true };
  return null;
}
const fmtShort = k => { const [y, m, d] = k.split('-'); return +d + ' ' + ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'][+m - 1]; };

/* ---------- RANCANGAN TAHUNAN (RPT) ----------
   Auto: SK diagih mengikut urutan DSKP, berat = bilangan SP, merentas semua
   minggu persekolahan. Satu SK boleh merentas beberapa minggu dan satu
   minggu boleh mengandungi beberapa SK. Guru boleh menukar mana-mana minggu. */
/* Tukaran minggu disimpan berasingan bagi setiap tahun takwim (minggu 5 tahun 2026 ≠ minggu 5 tahun 2027) */
const rptOf = sj => {
  S.rpt = S.rpt || {};
  const r = S.rpt[sj] = S.rpt[sj] || {}, y = takwim().year;
  r.oy = r.oy || {};
  if (r.over && !r.oy[2026]) r.oy[2026] = r.over;             // data lama (sebelum tukaran ikut tahun)
  delete r.over;
  r.oy[y] = r.oy[y] || {};
  return { over: r.oy[y] };
};
let PLAN_MEMO = {};
function autoPlan(b, W){
  const plan = Array.from({ length: W + 1 }, () => []);
  const wts = b.sk.map(k => Math.max(1, k.sp.length)), tot = wts.reduce((a, x) => a + x, 0);
  let cum = 0;
  b.sk.forEach((k, i) => {
    const a = Math.floor(cum / tot * W) + 1, z = Math.max(a, Math.ceil((cum + wts[i]) / tot * W));
    for (let w = a; w <= Math.min(z, W); w++) plan[w].push(i);
    cum += wts[i];
  });
  return plan;
}
function planOf(sj){
  const b = subjBook(sj); if (!b) return null;
  const ws = schoolWeeks(), over = rptOf(sj).over;
  const key = sj + '|' + ws.length + '|' + JSON.stringify(over) + '|' + b.sk.length;
  if (PLAN_MEMO[sj] && PLAN_MEMO[sj].key === key) return PLAN_MEMO[sj].plan;
  const plan = autoPlan(b, ws.length);
  Object.keys(over).forEach(w => { if (plan[+w]) plan[+w] = over[w].filter(i => b.sk[i]); });
  PLAN_MEMO[sj] = { key, plan };
  return plan;
}
/* Topik pelajaran kelas pada satu tarikh: tukaran guru untuk hari itu, atau ikut RPT */
const lessonKey = (cid, sj, date) => cid + '|' + sj + '|' + date;
function lessonTopic(cid, sj, date){
  const b = subjBook(sj); if (!b) return null;
  const w = weekOf(date), own = (S.lesson || {})[lessonKey(cid, sj, date)];
  const idx = own ? own : (w && w.n ? (planOf(sj) || [])[w.n] || [] : []);
  const sks = idx.map(i => b.sk[i]).filter(Boolean);
  if (!sks.length) return { w, sks:[], own: !!own };
  return { w, sks, own: !!own, units: Array.from(new Set(sks.map(k => k.ui))) };
}
/* Topik sesuatu rekod: snapshot semasa disimpan, jika tiada kira semula dari RPT */
function recTopic(sid, sj, date){
  const r = ((S.records[sid] || {})[sj] || {})[date];
  if (r && r.topic) return r.topic;
  const s = stu(sid); if (!s) return null;
  const t = lessonTopic(s.classId, sj, date);
  return t && t.sks.length ? topicSnap(t) : null;
}
const topicSnap = t => ({ w: t.w && t.w.n || 0, s: t.sks.map(k => k.i), u: t.units, t: t.sks.map(k => skCode(k.sk) || shortTxt(k.sk, 30)).join(', '), tj: t.sks[0].tajuk });
/* dipanggil oleh commitEval / commitForceTP / markAttendance */
function stampTopic(rec, cid, sj, date){
  const t = lessonTopic(cid, sj, date);
  if (t && t.sks.length) rec.topic = topicSnap(t); else if (rec.topic && !subjDskp(sj)) delete rec.topic;
}

/* ---------- TP mengikut tajuk DSKP (RPM automatik) ---------- */
function unitTP(sid, sj, ui){
  const days = ((S.records[sid] || {})[sj]) || {}, tps = [];
  Object.keys(days).forEach(d => { const t = recTopic(sid, sj, d); if (t && (t.u || []).indexOf(ui) >= 0) tps.push(days[d].tpAwarded || calcTP(rateOf(days[d]))); });
  return tps.length ? clamp(Math.round(tps.reduce((a, x) => a + x, 0) / tps.length), 1, 6) : 0;
}
/* Tajuk yang sudah ada penilaian bagi kelas aktif (urutan DSKP) */
function taughtUnits(cid, sj){
  const set = new Set();
  studentsOf(cid).forEach(s => Object.keys(((S.records[s.id] || {})[sj]) || {}).forEach(d => { const t = recTopic(s.id, sj, d); (t && t.u || []).forEach(u => set.add(u)); }));
  return Array.from(set).sort((a, b) => a - b);
}

/* ============ REFLEKSI PdP HARIAN (gaya RPH) ============
   Dijana automatik untuk satu kelas + subjek + tarikh daripada data sebenar:
   topik DSKP, kehadiran, TP setiap murid (penguasaan), lencana sikap yang
   diterima hari itu, dan perbandingan dengan sesi sebelumnya. Guru boleh
   menambah catatan sendiri; catatan disimpan bersama tarikh itu.         */
const reflKey = (cid, sj, date) => cid + '|' + sj + '|' + date;
const namesList = arr => arr.length <= 2 ? arr.join(' dan ') : arr.slice(0, -1).join(', ') + ' dan ' + arr[arr.length - 1];
function reflectData(cid, sj, date){
  const list = studentsOf(cid);
  const tpOf = r => r ? (r.tpAwarded || calcTP(rateOf(r))) : 0;
  const recs = list.map(s => { const r = ((S.records[s.id] || {})[sj] || {})[date]; return { s, r, tp: tpOf(r) }; });
  const done = recs.filter(x => x.r);
  const att = {};
  list.forEach(s => { const r = ((S.records[s.id] || {})[sj] || {})[date]; att[s.id] = attGet(s.id, date) || (r && r.attended ? 'H' : ''); });
  const ac = { H:[], L:[], T:[], C:[] };
  list.forEach(s => { if (att[s.id]) ac[att[s.id]].push(s); });
  const attKnown = list.filter(s => att[s.id]).length;
  const logs = (S.badgeLog || []).filter(l => l.d === date && list.some(s => s.id === l.sid));
  const bb = {};
  logs.forEach(l => { const b = S.badges.find(x => x.id === l.b); if (!b) return; (bb[b.id] = bb[b.id] || { b, kind: badgeKind(b), sids: [] }); if (bb[b.id].sids.indexOf(l.sid) < 0) bb[b.id].sids.push(l.sid); });
  const from = addDays(date, -30);
  const negCount = sid => (S.badgeLog || []).filter(l => l.sid === sid && l.d > from && l.d <= date && badgeKind(S.badges.find(x => x.id === l.b)) === 'neg').length;
  const allDates = Array.from(new Set([].concat.apply([], list.map(s => Object.keys(((S.records[s.id] || {})[sj]) || {}))))).sort();
  const pd = allDates.filter(d => d < date).pop();
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const prevTPs = pd ? list.map(s => tpOf(((S.records[s.id] || {})[sj] || {})[pd])).filter(Boolean) : [];
  const t = subjDskp(sj) ? lessonTopic(cid, sj, date) : null;
  const sks = t && t.sks.length ? t.sks : null;
  let next = null;
  if (sks && t.w && t.w.n){
    const plan = planOf(sj) || [], b = subjBook(sj), now = new Set(sks.map(k => k.i));
    for (let w = t.w.n + 1; w < plan.length && !next; w++){ const n = (plan[w] || []).filter(i => !now.has(i)); if (n.length) next = { w, sk: b.sk[n[0]] }; }
  }
  return { cid, sj, date, list, recs, done, ac, attKnown, bb: Object.values(bb), negCount, pd, prevAvg: avg(prevTPs), avg: avg(done.map(x => x.tp)), t, sks, next };
}
/* Teks refleksi: senarai bahagian { h, lines } — sama untuk paparan, salin & cetak */
function reflectSections(D){
  const N = D.list.length, nd = D.done.length, nm = x => x.s.name;
  const secs = [];
  const dt = new Date(D.date + 'T00:00:00'), w = weekOf(D.date);
  const info = [DAY_NAMES[dt.getDay()] + ', ' + fmtDate(D.date) + (w && w.n ? ' · Minggu ' + w.n : w && w.cuti ? ' · ' + w.cuti : ''),
    clsName(D.cid) + ' · ' + subjName(D.sj)];
  if (D.sks){
    info.push('Tema: ' + (D.sks[0].tema || '-'));
    info.push('Tajuk: ' + (D.sks[0].tajuk || '-'));
    D.sks.forEach(k => { info.push('SK ' + k.sk); k.sp.forEach(p => info.push('   SP ' + p)); });
  }
  secs.push({ h: 'MAKLUMAT PdP', lines: info });

  // 1. Kehadiran
  const A = D.ac, hadir = A.H.length + A.L.length, att = [];
  if (D.attKnown){
    att.push(hadir + '/' + N + ' murid hadir (' + Math.round(hadir / N * 100) + '%).');
    if (A.L.length) att.push('Lewat: ' + namesList(A.L.map(s => s.name)) + '.');
    if (A.T.length) att.push('Tidak hadir: ' + namesList(A.T.map(s => s.name + (attNoteOf(s.id, D.date) ? ' (' + attNoteOf(s.id, D.date) + ')' : ''))) + '.');
    if (A.C.length) att.push('Cuti/MC: ' + namesList(A.C.map(s => s.name + (attNoteOf(s.id, D.date) ? ' (' + attNoteOf(s.id, D.date) + ')' : ''))) + '.');
    if (!A.T.length && !A.C.length) att.push('Kehadiran penuh — semua murid mengikuti PdP.');
  } else att.push('Kehadiran belum direkod untuk tarikh ini (tab HADIR).');
  secs.push({ h: '1. KEHADIRAN', lines: att });

  // 2. Pencapaian objektif & penguasaan
  const ach = [];
  if (nd){
    const ok = D.done.filter(x => x.tp >= 3), pct = Math.round(ok.length / nd * 100);
    const dist = [1,2,3,4,5,6].map(k => 'TP' + k + ': ' + D.done.filter(x => x.tp === k).length).join(' · ');
    const status = pct >= 80 ? 'Objektif pembelajaran TERCAPAI' : pct >= 50 ? 'Objektif pembelajaran SEBAHAGIAN tercapai' : 'Objektif pembelajaran BELUM tercapai';
    ach.push(status + ': ' + ok.length + '/' + nd + ' murid (' + pct + '%) mencapai sekurang-kurangnya TP3' + (nd < N ? ' (' + (N - nd) + ' murid tidak dinilai)' : '') + '.');
    ach.push('Taburan penguasaan — ' + dist + '. Purata TP kelas ' + D.avg.toFixed(1) +
      (D.prevAvg ? (D.avg > D.prevAvg + 0.2 ? ', meningkat berbanding sesi lepas (' + D.prevAvg.toFixed(1) + ' pada ' + fmtDate(D.pd) + ')' :
                    D.avg < D.prevAvg - 0.2 ? ', menurun berbanding sesi lepas (' + D.prevAvg.toFixed(1) + ' pada ' + fmtDate(D.pd) + ')' :
                    ', setara dengan sesi lepas (' + D.prevAvg.toFixed(1) + ')') : '') + '.');
    const top = D.done.filter(x => x.tp >= 5), low = D.done.filter(x => x.tp <= 2);
    if (top.length) ach.push('Menguasai dengan cemerlang (TP5–TP6): ' + namesList(top.map(nm)) + '.');
    if (low.length) ach.push('Belum menguasai (TP1–TP2): ' + namesList(low.map(nm)) + '.');
  } else ach.push('Tiada penilaian PBD direkod untuk tarikh ini.');
  secs.push({ h: '2. PENCAPAIAN OBJEKTIF & PENGUASAAN', lines: ach });

  // 3. Sikap & disiplin (berdasarkan lencana)
  const sk = [], pos = D.bb.filter(x => x.kind === 'pos'), neg = D.bb.filter(x => x.kind === 'neg'), oth = D.bb.filter(x => !x.kind);
  const who = x => namesList(x.sids.map(id => (stu(id) || {}).name).filter(Boolean));
  pos.forEach(x => sk.push('👍 ' + x.b.name + ': ' + who(x) + '.'));
  oth.forEach(x => sk.push('• ' + x.b.name + ': ' + who(x) + '.'));
  neg.forEach(x => sk.push('⚠️ ' + x.b.name + ': ' + who(x) + '.'));
  const rep = [];
  neg.forEach(x => x.sids.forEach(id => { const n = D.negCount(id); if (n >= 3 && rep.indexOf(id) < 0) rep.push(id); }));
  if (!D.bb.length) sk.push('Tiada lencana sikap diberi hari ini. Murid secara umumnya berkelakuan baik sepanjang PdP.');
  else if (!neg.length) sk.push('Tiada isu disiplin direkodkan. Suasana PdP kondusif.');
  if (rep.length) sk.push('Isu berulang (3 kali atau lebih dalam 30 hari): ' + namesList(rep.map(id => (stu(id) || {}).name + ' (' + D.negCount(id) + ' kali)')) + '.');
  secs.push({ h: '3. SIKAP & DISIPLIN MURID', lines: sk });

  // 4. Tindakan susulan
  const act = [];
  if (nd){
    const pct = Math.round(D.done.filter(x => x.tp >= 3).length / nd * 100);
    const low = D.done.filter(x => x.tp <= 2), top = D.done.filter(x => x.tp >= 5);
    if (pct < 50) act.push('PdP topik ini akan DIULANG pada sesi berikutnya dengan pendekatan berbeza (contoh: demonstrasi, bahan konkrit, pembelajaran berpasangan) sebelum beralih ke SK seterusnya.');
    else if (pct < 80) act.push('Pengukuhan ringkas topik ini pada awal sesi berikutnya sebelum meneruskan ke SK seterusnya.');
    else act.push('PdP diteruskan ke SK seterusnya mengikut RPT.');
    if (low.length) act.push('Aktiviti PEMULIHAN / bimbingan individu untuk ' + namesList(low.map(nm)) + ' — latihan berperingkat dan soal jawab lisan.');
    if (top.length) act.push('Aktiviti PENGAYAAN untuk ' + namesList(top.map(nm)) + ' — tugasan KBAT / membimbing rakan sebaya.');
  }
  if (D.ac.T.length || D.ac.C.length) act.push('Murid yang tidak hadir perlu diberi salinan nota / latihan topik ini.');
  if (D.bb.some(x => x.kind === 'neg')) act.push('Nasihat dan pemantauan sikap murid yang terlibat' + (rep.length ? '; isu berulang dimaklumkan kepada guru kelas / kaunselor / ibu bapa.' : '.'));
  if (D.next) act.push('Topik seterusnya (Minggu ' + D.next.w + '): ' + D.next.sk.sk + '.');
  if (!act.length) act.push('—');
  secs.push({ h: '4. TINDAKAN SUSULAN', lines: act });
  return secs;
}
const reflectText = (secs, note) => 'REFLEKSI PdP\n' + secs.map(s => s.h + '\n' + s.lines.map(l => (s.h === 'MAKLUMAT PdP' ? '' : '- ') + l).join('\n')).join('\n\n') +
  (note ? '\n\n5. CATATAN GURU\n' + note : '');

/* ---------- Cabutan pack ---------- */
function pickWeighted(tbl){
  let tot = 0; Object.keys(tbl).forEach(k => tot += tbl[k]);
  let r = Math.random() * tot;
  for (const k of Object.keys(tbl)){ r -= tbl[k]; if (r <= 0) return k; }
  return Object.keys(tbl)[0];
}
const drawCard = tierK => { const l = cardsOfTier(tierK); return l[Math.floor(Math.random() * l.length)]; };
function openPackRoll(pack, sid){
  S.pity = S.pity || {};
  let pity = S.pity[sid] || 0;
  const tiers = [];
  for (let i = 0; i < pack.base; i++) tiers.push(pickWeighted(BASE_ODDS));
  for (let i = 0; i < pack.rare; i++) tiers.push(pickWeighted(RARE_ODDS));
  for (let i = 0; i < pack.lucky; i++) tiers.push(pickWeighted(pack.luck));
  if (pack.grant && !tiers.some(t => tierRank(t) >= tierRank(pack.grant))) tiers[tiers.length - 1] = pack.grant;
  pity++;                                        // 25 pack tanpa Legenda+ → jamin Legenda
  if (pity > PITY_MAX && !tiers.some(t => tierRank(t) >= tierRank('legenda'))) tiers[tiers.length - 1] = 'legenda';
  if (tiers.some(t => tierRank(t) >= tierRank('legenda'))) pity = 0;
  S.pity[sid] = pity;
  for (let i = tiers.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const tmp = tiers[i]; tiers[i] = tiers[j]; tiers[j] = tmp; }
  return tiers.map(t => ({ tier: t, card: drawCard(t) })).filter(x => x.card);
}
/* Simpan kad; set lengkap kali pertama = +20 RP */
function grantCards(sid, pulls){
  S.collect = S.collect || {};
  S.collect[sid] = S.collect[sid] || {};
  const before = CARD_SETS.filter(s => { const p = setProgress(sid, s.k); return p.have === p.total; }).map(s => s.k);
  const res = pulls.map(p => {
    const had = S.collect[sid][p.card.id] || 0;
    S.collect[sid][p.card.id] = had + 1;
    return { card: p.card, tier: p.tier, isNew: had === 0, lvUp: had > 0 && had < 5 };
  });
  CARD_SETS.forEach(s => {
    const p = setProgress(sid, s.k);
    if (p.have === p.total && before.indexOf(s.k) < 0){
      S.arena.rp = S.arena.rp || {}; S.arena.rp[sid] = (S.arena.rp[sid] || 0) + 20;
      setTimeout(() => toast('SET LENGKAP: ' + s.name + '! +20 RP'), 600);
    }
  });
  return res;
}

/* ---------- DUEL KAD ----------
   3 kad terkuat pelajar lawan 3 kad Penjaga Kad (kekuatan setara).
   Setiap pusingan satu soalan: betul = kad kamu menyerang (pantas = kritikal),
   salah / tamat masa = kad lawan menyerang. Elemen yang menang ×1.5.     */
const duelQ = () => clamp(+((S.config || {}).duelQ) || 15, 5, 90);      // masa menjawab (saat), dilaras guru
function duelDeck(sid){
  const own = (S.collect || {})[sid] || {};
  const power = c => { const x = cardStats(c, cardLevel(sid, c.id)); return x.atk * 2 + x.hp / 3 + x.def * 2; };
  return CARDS.filter(c => own[c.id]).sort((a, b) => power(b) - power(a)).slice(0, 3)
    .map(c => Object.assign({ c, lv: cardLevel(sid, c.id) }, cardStats(c, cardLevel(sid, c.id))));
}
function duelFoe(mine){
  const avg = mine.reduce((a, x) => a + tierRank(x.c.tier), 0) / mine.length;
  return mine.map(() => {
    const tr = clamp(Math.round(avg + (Math.random() - .5) * 1.2), 0, CARD_TIERS.length - 1);
    const c = drawCard(CARD_TIERS[tr].k), lv = clamp(Math.round(mine.reduce((a, x) => a + x.lv, 0) / mine.length), 1, 5);
    return Object.assign({ c, lv }, cardStats(c, lv));
  });
}
function duelStart(){
  const sid = arenaUi().team;
  if (!sid || !teamOf(sid)) return toast('Pilih kumpulan dahulu.', null, true);
  const me = duelDeck(sid);
  if (!me.length) return toast('Buka pack dahulu untuk mendapatkan kad.', null, true);
  const foe = duelFoe(me);
  me.forEach(x => x.cur = x.hp); foe.forEach(x => x.cur = x.hp);
  let mi = 0, fi = 0, busy = false, over = false, right = 0, asked = 0;
  const id = openModal({ center:true, bare:true,
    body:'<div class="pkwrap" id="dlWrap">' +
      '<div class="flex items-center gap-2 mb-2">' + teamAvatar(sid, 28) +
        '<div class="flex-1 font-bold text-[13px] truncate">' + esc(teamName(sid)) + ' <span class="text-muted">lawan</span> <span class="text-orange">Penjaga Kad</span></div>' +
        '<button class="btn clip-s !px-2 !py-1 text-[11px]" data-close="1"><i class="fa-solid fa-xmark"></i></button></div>' +
      '<div id="dlArena"></div><div id="dlLog" class="text-center text-[13px] font-bold mt-2" style="min-height:20px"></div>' +
      '<div id="dlQ" class="mt-2"></div></div>',
    onClose: () => { over = true; } });                 // ditutup separuh jalan: tiada keputusan direkod
  const bd = $('[data-modal="' + id + '"]');
  const side = (arr, i, who) => {

    const x = arr[i];
    const dots = arr.map((y, k) => '<span style="display:inline-block;width:9px;height:9px;margin:0 2px;border-radius:50%;background:' + (y.cur > 0 ? (k === i ? '#FFD76A' : '#4ADE80') : '#3A1A1A') + '"></span>').join('');
    return '<div class="flex-1 min-w-0 text-center" id="dl' + who + '">' +
      '<div style="width:86%;margin:0 auto;transition:transform .2s">' + cardFaceHtml(x.c, x.c.tier, { lv: x.lv }) + '</div>' +
      '<div style="height:8px;background:#1B2531;margin-top:6px;border:1px solid var(--line)"><div style="height:100%;width:' + Math.max(0, x.cur / x.hp * 100) + '%;background:' + (x.cur / x.hp > .4 ? '#4ADE80' : '#E23B3B') + ';transition:width .4s"></div></div>' +
      '<div class="num text-[11px] mt-1">' + Math.max(0, x.cur) + '/' + x.hp + ' ♥</div><div class="mt-1">' + dots + '</div></div>';
  };
  const paint = () => {
    $('#dlArena', bd).innerHTML = '<div class="flex items-start gap-2">' + side(me, mi, 'Me') +
      '<div class="num text-[20px] text-orange self-center">VS</div>' + side(foe, fi, 'Foe') + '</div>';
  };
  const log = (t, c) => { const l = $('#dlLog', bd); if (l){ l.innerHTML = t; l.style.color = c || '#E6EEF7'; } };
  const hit = (att, def, fast) => {
    const adv = elemBeats(cardSet(att.c).el, cardSet(def.c).el) ? 1.5 : elemBeats(cardSet(def.c).el, cardSet(att.c).el) ? 0.75 : 1;
    const dmg = Math.max(3, Math.round((att.atk * (fast ? 1.4 : 1) * (0.9 + Math.random() * 0.2)) * adv - def.def * 0.6));
    def.cur -= dmg;
    return { dmg, adv };
  };
  const shake = who => { const e = $('#dl' + who + ' > div', bd); if (!e) return; e.style.transform = 'translateX(' + (who === 'Me' ? -8 : 8) + 'px) rotate(' + (who === 'Me' ? -3 : 3) + 'deg)'; setTimeout(() => e.style.transform = '', 220); };
  const finish = won => {
    over = true;
    S.duel = S.duel || { wins:{}, losses:{} }; S.duel.wins = S.duel.wins || {}; S.duel.losses = S.duel.losses || {};
    const alive = me.filter(x => x.cur > 0).length, rp = won ? 6 + alive * 3 : 2;
    if (won) S.duel.wins[sid] = (S.duel.wins[sid] || 0) + 1; else S.duel.losses[sid] = (S.duel.losses[sid] || 0) + 1;
    teamRP(sid, rp);
    const tp = gameToPBD(sid, 'duel', right, asked, { win: won ? 1 : 0 });
    save(true);
    if (won){ sfx('myth'); confettiBurst($('#dlWrap', bd), 70); } else sfx('low');
    $('#dlQ', bd).innerHTML = '<div class="panel clip p-3 text-center" style="border-color:' + (won ? '#4ADE80' : '#E23B3B') + '">' +
      '<div class="font-bold tracking-widest text-[18px]" style="color:' + (won ? '#4ADE80' : '#E23B3B') + '">' + (won ? 'MENANG!' : 'KALAH…') + '</div>' +
      '<div class="text-[12px] text-muted mt-1">Jawapan betul ' + right + '/' + asked + ' · <span class="text-orange">+' + rp + ' RP</span>' + (tp ? ' · <b style="color:' + TP_COLOR[tp] + '">TP' + tp + '</b> ke PBD ahli kumpulan' : '') + '</div>' +
      '<div class="flex gap-2 mt-3"><button class="btn clip-s flex-1" data-close="1">Tutup</button><button class="btn btn-o clip-s flex-1" data-dl="again"><i class="fa-solid fa-rotate"></i> Lagi</button></div></div>';
    renderTab();
  };
  const ask = () => {
    if (over) return;
    if (mi >= me.length) return finish(false);
    if (fi >= foe.length) return finish(true);
    paint();
    const q = escQuestion(), order = q.c.map((_, i) => i).sort(() => Math.random() - .5);
    const t0 = performance.now(); let raf = 0, done = false;
    $('#dlQ', bd).innerHTML = '<div class="panel clip p-3">' +
      '<div style="height:6px;background:#0E151E"><div id="dlBar" style="height:100%;width:100%;background:#4ADE80"></div></div>' +
      '<div class="text-[15px] font-bold leading-snug mt-2">' + esc(q.q) + '</div>' +
      '<div class="grid grid-cols-2 gap-2 mt-2">' + order.map((i, k) =>
        '<button class="btn clip-s !py-2 text-left text-[13px]" data-ans="' + i + '"><span class="num text-orange mr-1">' + String.fromCharCode(65 + k) + '.</span>' + esc(q.c[i]) + '</button>').join('') + '</div></div>';
    const tick = () => {
      const QS = duelQ(), left = Math.max(0, QS - (performance.now() - t0) / 1000), bar = $('#dlBar', bd);
      if (!bar || over) return;
      bar.style.width = (left / QS * 100) + '%'; bar.style.background = left > QS * .6 ? '#4ADE80' : left > QS * .27 ? '#FACC15' : '#E23B3B';
      if (left <= 0) return answer(-1);
      raf = requestAnimationFrame(tick);
    };
    const answer = pick => {
      if (done || over) return; done = true; cancelAnimationFrame(raf);
      const ok = pick === q.a, fast = ok && (performance.now() - t0) / 1000 < duelQ() * .4;
      asked++; if (ok) right++;
      teamQuiz(sid, ok);
      $('#dlQ', bd).innerHTML = '';
      if (ok){
        const r = hit(me[mi], foe[fi], fast); sfx(fast ? 'hi' : 'flip'); shake('Foe');
        log((fast ? 'KRITIKAL! ' : 'Betul! ') + esc(me[mi].c.name) + ' menyerang −' + r.dmg + (r.adv > 1 ? ' · elemen kuat!' : r.adv < 1 ? ' · elemen lemah' : ''), '#4ADE80');
        if (foe[fi].cur <= 0){ fi++; setTimeout(() => log('Kad lawan tumbang!', '#FFD76A'), 700); }
      } else {
        const r = hit(foe[fi], me[mi], false); sfx('low'); shake('Me'); vibrate(40);
        log((pick === -1 ? 'Masa tamat! ' : 'Salah! ') + 'Jawapan: ' + esc(q.c[q.a]) + ' · −' + r.dmg, '#FF7A7A');
        if (me[mi].cur <= 0) mi++;
      }
      paint();
      setTimeout(ask, 1500);
    };
    bd.querySelectorAll('[data-ans]').forEach(b => b.addEventListener('click', () => answer(+b.dataset.ans)));
    raf = requestAnimationFrame(tick);
  };
  bd.addEventListener('click', e => { if (e.target.closest('[data-dl="again"]')){ closeModal(id); setTimeout(duelStart, 200); } });
  log('Kad lawan: ' + foe.map(x => x.c.emo).join(' ') + ' — bersedia!', '#FFD76A');
  paint();
  setTimeout(ask, 1200);
}

/* ---------- DUEL KAD: 2 PEMAIN, 1 PERANTI ----------
   REBUT  : skrin dibahagi dua, murid duduk bertentang (separuh atas diterbalikkan).
            Soalan sama untuk kedua-dua. Jawapan BETUL pertama = kad dia menyerang
            (pantas = kritikal). Jawapan salah = dikunci untuk soalan itu.
   BERGILIR: telefon diserah bergilir. Betul = kad sendiri menyerang,
            salah / masa tamat = kad lawan menyerang (seperti lawan komputer).
   Murid tanpa kad diberi 3 "kad latihan" (tier Sial) supaya semua boleh bermain. */
function pvpDeck(sid){
  const d = duelDeck(sid);
  if (d.length) return { deck: d, starter: false };
  const pool = cardsOfTier('sial').slice().sort(() => Math.random() - .5).slice(0, 3);
  return { deck: pool.map(c => Object.assign({ c, lv: 1 }, cardStats(c, 1))), starter: true };
}

        '<div class="flex-1 min-w-0"><div class="text-[11px] text-muted">' + elemOf(cardSet(x.c).el).ico + ' ' + esc(x.c.name) + ' · ⚔' + x.atk + ' 🛡' + x.def + '</div>' +
          '<div style="height:9px;background:#1B2531;margin-top:4px;border:1px solid #24333F"><div style="height:100%;width:' + Math.max(0, x.cur / x.hp * 100) + '%;background:' + (x.cur / x.hp > .4 ? '#4ADE80' : '#E23B3B') + ';transition:width .4s"></div></div>' +
          '<div class="num text-[11px] mt-1">' + Math.max(0, x.cur) + '/' + x.hp + ' ♥</div>' +
          (q ? '' : '<div class="text-[11px] text-muted mt-1">lawan: ' + elemOf(cardSet(act(o).c).el).ico + ' ' + esc(act(o).c.name) + '</div>') + '</div></div>' +
      (q && mine ? '<div class="text-[14px] font-bold leading-snug mt-1">' + esc(q.q) + '</div><div class="grid grid-cols-2 gap-2 mt-2">' + order.map((i, j) =>
        '<button class="btn clip-s !py-2 text-left text-[13px]' + (locked ? ' opacity-40' : '') + '" data-a="' + k + ':' + i + '"' + (locked ? ' disabled' : '') + '><span class="num text-orange mr-1">' + String.fromCharCode(65 + j) + '.</span>' + esc(q.c[i]) + '</button>').join('') + '</div>' +
        (locked ? '<div class="text-center text-[12px] mt-2" style="color:#FF7A7A">Salah — tunggu lawan…</div>' : '') : '');
  };
  let cur = null;     // { q, order, t0, locked:[bool,bool], done }
  const paint = () => {
    const mid = '<div style="height:6px;background:#0E151E;margin:4px 0"><div id="pvBar" style="height:100%;width:100%;background:#4ADE80"></div></div><div id="pvLog" class="text-center text-[13px] font-bold" style="min-height:18px"></div>';
    if (rebut){
      $p('#pvH0').innerHTML = sideHtml(0, cur && cur.q, cur && cur.order, cur && cur.locked[0], true);
      $p('#pvH1').innerHTML = sideHtml(1, cur && cur.q, cur && cur.order, cur && cur.locked[1], true);
      if (!$p('#pvBar')) $p('#pvMid').innerHTML = mid;
    } else {
      const o = 1 - turn;
      $p('#pvTop').innerHTML = sideHtml(o, null, null, false, false);
      $p('#pvH0').innerHTML = '<div class="text-center lbl mb-1" style="color:#FFD76A">GILIRAN: ' + esc(teamName(P[turn].sid)).toUpperCase() + '</div>' + sideHtml(turn, cur && cur.q, cur && cur.order, false, true);
      if (!$p('#pvBar')) $p('#pvMid').innerHTML = mid;
    }
  };
  const log = (t, c) => { const l = $p('#pvLog'); if (l){ l.innerHTML = t; l.style.color = c || '#E6EEF7'; } };
  const shake = k => { const e = root.querySelector('.pv-card[data-who="' + k + '"]'); if (e){ e.style.transform = 'translateX(8px) rotate(3deg)'; setTimeout(() => e.style.transform = '', 220); } };
  const hit = (att, def, fast) => {
    const adv = elemBeats(cardSet(att.c).el, cardSet(def.c).el) ? 1.5 : elemBeats(cardSet(def.c).el, cardSet(att.c).el) ? 0.75 : 1;
    const dmg = Math.max(3, Math.round(att.atk * (fast ? 1.4 : 1) * (0.9 + Math.random() * 0.2) * adv - def.def * 0.6));
    def.cur -= dmg; return { dmg, adv };
  };
  /* k menyerang lawannya */
  const strike = (k, fast, why) => {
    const a = P[k], d = P[1 - k], r = hit(act(a), act(d), fast);
    sfx(fast ? 'hi' : 'flip'); shake(1 - k);
    log((why || '') + esc(teamName(a.sid)) + ': ' + esc(act(a).c.name) + ' −' + r.dmg + (fast ? ' KRITIKAL!' : '') + (r.adv > 1 ? ' · elemen kuat' : r.adv < 1 ? ' · elemen lemah' : ''), fast ? '#FFD76A' : '#4ADE80');
    if (act(d).cur <= 0){ d.i++; setTimeout(() => log('Kad ' + esc(teamName(d.sid)) + ' tumbang!', '#FF7A7A'), 650); }
  };
  const endRound = () => {
    cancelAnimationFrame(raf); cur = null; paint();
    if (!alive(P[0]) || !alive(P[1])) return setTimeout(finish, 900);
    if (!rebut) turn = 1 - turn;

  };
  const answer = (k, pick) => {
    if (!cur || cur.done || over) return;
    const q = cur.q, ok = pick === q.a, used = (performance.now() - cur.t0) / 1000;
    P[k].asked++; if (ok) P[k].right++;
    teamQuiz(P[k].sid, ok);
    if (rebut){
      if (ok){ cur.done = true; strike(k, used < duelQ() * .4, 'Betul! '); return endRound(); }
      cur.locked[k] = true; sfx('low'); vibrate(30);

    } else {
      cur.done = true;

      endRound();
    }
  };
  const ask = () => {
    if (over) return;
    round++;
    const q = escQuestion();
    cur = { q, order: q.c.map((_, i) => i).sort(() => Math.random() - .5), t0: performance.now(), locked: [false, false], done: false };
    paint();
    log(rebut ? 'Pusingan ' + round + ' — siapa cepat?' : 'Pusingan ' + round, '#7E93A8');
    const tick = () => {
      if (!cur || cur.done || over) return;
      const QS = duelQ(), left = Math.max(0, QS - (performance.now() - cur.t0) / 1000), bar = $p('#pvBar');
      if (bar){ bar.style.width = (left / QS * 100) + '%'; bar.style.background = left > QS * .6 ? '#4ADE80' : left > QS * .27 ? '#FACC15' : '#E23B3B'; }
      if (left <= 0){
        if (rebut){ cur.done = true; log('Masa tamat! Jawapan: ' + esc(cur.q.c[cur.q.a]), '#FF7A7A'); return endRound(); }
        return answer(turn, -1);
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  };
  const finish = () => {
    if (over) return; over = true;
    const w = alive(P[0]) ? 0 : 1, W = P[w], L = P[1 - w];
    const rpW = 8 + alive(W) * 2, rpL = 2;
    S.duel = S.duel || {}; S.duel.pvp = S.duel.pvp || {}; S.duel.log = S.duel.log || [];
    [[W, 'w'], [L, 'l']].forEach(([p, k]) => { const r = S.duel.pvp[p.sid] = S.duel.pvp[p.sid] || { w:0, l:0 }; r[k]++; });
    teamRP(W.sid, rpW); teamRP(L.sid, rpL);
    const tpW = gameToPBD(W.sid, 'pvp', W.right, W.asked, { win: 1, vs: teamName(L.sid) }), tpL = gameToPBD(L.sid, 'pvp', L.right, L.asked, { win: 0, vs: teamName(W.sid) });
    S.duel.log.unshift({ a: P[0].sid, b: P[1].sid, w: W.sid, d: todayKey(), m: mode, r: round }); S.duel.log = S.duel.log.slice(0, 100);
    save(true); sfx('myth');
    const ov = document.createElement('div');
    ov.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.82)';
    ov.innerHTML = '<div class="panel clip p-5 w-full text-center" style="max-width:380px">' + '<div style="display:flex;justify-content:center">' + teamAvatar(W.sid, 64) + '</div>' +

      '<div class="text-[12px] text-muted mt-1">' + (rebut ? 'Rebut Jawapan' : 'Bergilir') + ' · ' + round + ' pusingan</div>' +
      '<div class="grid grid-cols-2 gap-2 mt-3 num">' + [W, L].map((p, j) => '<div class="panel clip-s p-2"><div class="text-[12px] truncate">' + esc(teamName(p.sid)) + '</div>' +

      '<div class="flex gap-2 mt-4"><button class="btn clip-s flex-1 !py-3" data-x="quit">Tutup</button><button class="btn btn-o clip-s flex-1 !py-3" data-x="again"><i class="fa-solid fa-rotate"></i> Main Lagi</button></div></div>';
    root.appendChild(ov);
    confettiBurst(root, 80);
  };
  const quit = () => { over = true; cancelAnimationFrame(raf); root.remove(); unlockBody(); if (S.ui.tab === 'arena') renderTab(); };
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (a){ const [k, i] = a.dataset.a.split(':').map(Number); return answer(k, i); }
    const x = e.target.closest('[data-x]'); if (!x) return;
    if (x.dataset.x === 'quit') return quit();
    if (x.dataset.x === 'again'){ quit(); setTimeout(() => pvpRun(p1, p2, mode), 80); }
  });
  paint();
  log(rebut ? 'Duduk bertentang — ' + esc(teamName(p2)) + ' di sebelah atas.' : esc(teamName(p1)) + ' mula dahulu.', '#FFD76A');
  setTimeout(ask, 1500);
}

/* ============ PASUKAN (KUMPULAN) & MARKAH GAME → PBD ============

const GAME_NAMES = { esc:'Sekolah Berhantu', run:'Larian Ilmu', duel:'Duel Kad', pvp:'Duel Kad (lawan kumpulan)' };

const TEAM_COLORS = ['#FF6B00','#00C2D4','#C084FC','#4ADE80','#FFD76A','#FF5A7A','#38BDF8','#F59E0B'];

const teamQuiz = (id, ok) => { const t = teamOf(id); if (t) t.members.forEach(s => quizRecord(s.id, ok)); };
const teamRP = (id, n) => { const t = teamOf(id); if (!t) return; S.arena.rp = S.arena.rp || {}; t.members.forEach(s => S.arena.rp[s.id] = (S.arena.rp[s.id] || 0) + n); };

/* Peratus betul → kadar (julat skala −20…39) → TP */
function accRate(acc){ return acc >= .9 ? 35 : acc >= .75 ? 25 : acc >= .6 ? 15 : acc >= .45 ? 5 : acc >= .25 ? -5 : -15; }
/* Kadar sesi = purata matrik guru (jika ada) + setiap game */
function blendRec(rec){
  const parts = [];
  const ks = Object.keys(rec.metricScores || {});
  if (rec.metricCount && ks.length){ rec.mrate = clamp((rec.totalScore || 0) / Math.max(1, rec.metricCount), SC_MIN, SC_MAX); parts.push(rec.mrate); }
  else delete rec.mrate;
  (rec.games || []).forEach(g => parts.push(g.rate));
  if (!parts.length) return false;
  rec.rate = clamp(parts.reduce((a, x) => a + x, 0) / parts.length, SC_MIN, SC_MAX);
  rec.tpAwarded = calcTP(rec.rate);
  return true;
}
/* Simpan hasil game sebagai PBD untuk setiap ahli pasukan. Pulangkan TP. */
function gameToPBD(teamId, game, right, asked, extra){
  const t = teamOf(teamId), sj = S.ui.activeSubjectId;
  if (!t || !sj || !asked) return 0;
  const date = todayKey(), rate = accRate(right / asked), gid = uid('gm');
  t.members.forEach(s => {
    S.records[s.id] = S.records[s.id] || {};
    S.records[s.id][sj] = S.records[s.id][sj] || {};
    const rec = S.records[s.id][sj][date] || { metricScores:{}, metricCount:0, totalScore:0, touchCount:0 };
    rec.games = rec.games || [];
    rec.games.push(Object.assign({ id: gid, g: game, r: right, n: asked, rate, team: teamId, tn: t.name, t: Date.now() }, extra || {}));
    blendRec(rec);
    stampTopic(rec, s.classId, sj, date);
    rec.updatedAt = Date.now();
    S.records[s.id][sj][date] = rec;
  });
  save(true);
  return calcTP(rate);
}
/* Padam satu aktiviti game daripada rekod; rekod kosong dibuang terus */
function gameDel(sid, sj, date, gameId){
  const rec = ((S.records[sid] || {})[sj] || {})[date]; if (!rec) return;
  rec.games = (rec.games || []).filter(g => g.id !== gameId);
  if (!rec.games.length) delete rec.games;
  if (!blendRec(rec)){ delete S.records[sid][sj][date]; if (!Object.keys(S.records[sid][sj]).length) delete S.records[sid][sj]; }
}
const gameLine = g => (GAME_NAMES[g.g] || g.g) + ' · ' + g.r + '/' + g.n + ' betul (' + Math.round(g.r / g.n * 100) + '%) → TP' + calcTP(g.rate) + (g.tn ? ' · ' + g.tn : '');

}

async function runStart(){
  const o = arenaUi();
  if (!o.team || !teamOf(o.team)) return toast('Pilih kumpulan dahulu.', null, true);
  if (RUN || ESC) return;
  let ac = null;
  try { ac = (typeof audCtx === 'function' && audCtx()) || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){}
  RUN = { loading:true };
  toast('Memuatkan trek…');
  let THREE;
  try { THREE = await import(ESC_THREE); }
  catch(e){ RUN = null; return toast('Gagal memuat enjin 3D. Semak sambungan internet.', null, true); }
  try { runGame(THREE, o.team, ac); }
  catch(e){ RUN = null; const r = $('#runRoot'); if (r) r.remove(); unlockBody(); console.error(e); toast('Permainan gagal dimulakan.', null, true); }
}

function runGame(THREE, sid, ac){
  const player = teamOf(sid);                     // sid = id kumpulan yang berlari
  const root = document.createElement('div');

  root.innerHTML =
    '<canvas id="rnCv" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>' +
    '<div id="rnHit" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(220,30,30,.55));opacity:0;transition:opacity .2s"></div>' +

    '<div id="rnEnd" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.8)"></div>';
  document.body.appendChild(root);

  const resize = () => { const w = root.clientWidth, h = root.clientHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.fov = w < h ? 72 : 62; cam.updateProjectionMatrix(); };
  resize(); window.addEventListener('resize', resize);
  scene.add(new THREE.HemisphereLight(0xFFD8B0, 0x3A2A50, 1.1));
  const sun = new THREE.DirectionalLight(0xFFB070, 1.6); sun.position.set(-6, 10, -4); scene.add(sun);
  // matahari terbenam
  const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(9, 32), new THREE.MeshBasicMaterial({ color: 0xFFE2A0, fog: false }));
  sunDisc.position.set(-14, 9, -130); scene.add(sunDisc);

  const ctex = (w, h, draw, rx, ry) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rx) t.repeat.set(rx, ry || rx); t.anisotropy = 4; return t; };
  const M = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .85 }, extra || {}));

  /* ---------- jalan (tekstur bergerak) ---------- */
  const LANES = [-2.2, 0, 2.2];
  const roadTex = ctex(256, 256, (g, w, h) => {
    g.fillStyle = '#3A3A44'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 400; i++){ g.fillStyle = 'rgba(0,0,0,' + Math.random() * .25 + ')'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    g.fillStyle = '#F2F2E8'; [w / 3, w * 2 / 3].forEach(x => g.fillRect(x - 3, 0, 6, h * .5));
    g.fillStyle = '#FFD24A'; g.fillRect(4, 0, 6, h); g.fillRect(w - 10, 0, 6, h);
  }, 1, 6);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(7.2, 160), new THREE.MeshStandardMaterial({ map: roadTex, roughness: .9 }));
  road.rotation.x = -Math.PI / 2; road.position.set(0, 0, -70); scene.add(road);
  const walkTex = ctex(128, 128, (g, w, h) => { g.fillStyle = '#B9A68E'; g.fillRect(0, 0, w, h); g.strokeStyle = '#8E7C66'; g.lineWidth = 3; g.strokeRect(0, 0, w, h); g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.stroke(); }, 2, 80);
  [-1, 1].forEach(s => {
    const walk = new THREE.Mesh(new THREE.BoxGeometry(3, .25, 160), new THREE.MeshStandardMaterial({ map: walkTex.clone(), roughness: .95 }));
    walk.material.map.needsUpdate = true; walk.position.set(s * 5.1, .12, -70); scene.add(walk);
    const grass = new THREE.Mesh(new THREE.PlaneGeometry(40, 160), M(0x4E8A3A)); grass.rotation.x = -Math.PI / 2; grass.position.set(s * 26.5, 0, -70); scene.add(grass);
  });

  /* ---------- pemandangan berulang: bangunan sekolah, pokok, lampu ---------- */
  const winTex = ctex(128, 128, (g, w, h) => {
    g.fillStyle = '#E8DCC0'; g.fillRect(0, 0, w, h);
    for (let y = 10; y < h; y += 40) for (let x = 10; x < w; x += 40){ const lit = Math.random() < .5; g.fillStyle = lit ? '#FFE9A0' : '#5A6B80'; g.fillRect(x, y, 22, 24); }
    g.fillStyle = '#B04A3A'; g.fillRect(0, 0, w, 6);
  }, 2, 1);
  const SCN = [], SPAN = 150;
  const addScenery = (obj, z) => { obj.position.z = z; scene.add(obj); SCN.push(obj); };
  for (let z = 0; z > -SPAN; z -= 15){
    [-1, 1].forEach(s => {
      const r = Math.random();
      if (r < .5){
        const bh = 4 + Math.random() * 5, bw = 6 + Math.random() * 4;
        const t = winTex.clone(); t.needsUpdate = true; t.repeat.set(bw / 4, bh / 4);
        const b = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 8), new THREE.MeshStandardMaterial({ map: t, roughness: .9, emissive: 0x332211, emissiveIntensity: .2 }));
        b.position.set(s * (12 + bw / 2), bh / 2, 0);
        const g = new THREE.Group(); g.add(b);
        const roof = new THREE.Mesh(new THREE.BoxGeometry(bw + .6, .4, 8.6), M(0x8A3A2A)); roof.position.set(s * (12 + bw / 2), bh + .2, 0); g.add(roof);
        addScenery(g, z - Math.random() * 6);
      } else {
        const g = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18, .25, 2, 6), M(0x6B4A2A)); trunk.position.y = 1; g.add(trunk);
        const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3 + Math.random() * .6, 0), M(r < .75 ? 0x2F7A3A : 0x3E9A4A, { flatShading: true })); crown.position.y = 2.7; g.add(crown);
        g.position.x = s * (8 + Math.random() * 3);
        addScenery(g, z - Math.random() * 6);
      }
      // lampu jalan
      const lamp = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(.06, .08, 4.2, 6), M(0x2A2E36)); pole.position.y = 2.1; lamp.add(pole);
      const head = new THREE.Mesh(new THREE.BoxGeometry(.6, .12, .3), M(0xFFF2C0, { emissive: 0xFFE08A, emissiveIntensity: 1.2 })); head.position.set(-s * .3, 4.2, 0); lamp.add(head);
      lamp.position.x = s * 3.9;
      addScenery(lamp, z - 7);
    });
  }

  /* ---------- pelari (murid berpakaian sekolah) ---------- */
  const runner = new THREE.Group();
  const skin = M(0xD9A06B), shirt = M(0xF4F6F8), pants = M(player && player.gender === 'P' ? 0x1F4E8A : 0x24364F), bag = M(0xE2574C), shoe = M(0x1A1A1A);
  const torso = new THREE.Mesh(new THREE.BoxGeometry(.62, .72, .34), shirt); torso.position.y = 1.32; runner.add(torso);
  const headM = new THREE.Mesh(new THREE.SphereGeometry(.24, 14, 12), skin); headM.position.y = 1.92; runner.add(headM);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(.255, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2), M(player && player.gender === 'P' ? 0xF2F2F2 : 0x1E2630)); hair.position.y = 1.95; runner.add(hair);
  const pack = new THREE.Mesh(new THREE.BoxGeometry(.5, .56, .22), bag); pack.position.set(0, 1.36, .28); runner.add(pack);
  const limb = (mat, w, h, x, y) => { const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat); m.position.y = -h / 2; g.add(m); g.position.set(x, y, 0); runner.add(g); return g; };
  const armL = limb(shirt, .16, .62, -.4, 1.62), armR = limb(shirt, .16, .62, .4, 1.62);
  const legL = limb(pants, .2, .8, -.16, .96), legR = limb(pants, .2, .8, .16, .96);
  [legL, legR].forEach(l => { const s = new THREE.Mesh(new THREE.BoxGeometry(.22, .12, .34), shoe); s.position.set(0, -.82, -.06); l.add(s); });
  runner.rotation.y = Math.PI;                                       // membelakangkan kamera, lari ke -z
  scene.add(runner);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(.45, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .3 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = .02; scene.add(shadow);

  /* ---------- halangan, bintang & gerbang ---------- */
  const OBS = [], STARS = [], GATES = [];
  const OB_KINDS = [
    { k:'cone',  low:true,  make: () => { const g = new THREE.Group(); const c = new THREE.Mesh(new THREE.ConeGeometry(.38, .9, 12), M(0xFF6B1A)); c.position.y = .45; g.add(c);
        const b = new THREE.Mesh(new THREE.CylinderGeometry(.27, .3, .12, 12), M(0xFFFFFF)); b.position.y = .45; g.add(b); return g; } },
    { k:'bench', low:true,  make: () => { const g = new THREE.Group(); const s = new THREE.Mesh(new THREE.BoxGeometry(1.6, .14, .5), M(0x8A5A2A)); s.position.y = .55; g.add(s);
        [-.65, .65].forEach(x => { const l = new THREE.Mesh(new THREE.BoxGeometry(.12, .55, .45), M(0x3A3A3A)); l.position.set(x, .27, 0); g.add(l); }); return g; } },
    { k:'bin',   low:false, make: () => { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, .9), M(0x2F8A3A)); b.position.y = .75; g.add(b);
        const l = new THREE.Mesh(new THREE.BoxGeometry(1.06, .12, .96), M(0x1F5A26)); l.position.y = 1.56; g.add(l); return g; } },
    { k:'board', low:false, make: () => { const g = new THREE.Group(); const p = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.3, .12), M(0xFFD24A)); p.position.y = 1.3; g.add(p);
        const t = new THREE.Mesh(new THREE.BoxGeometry(1.2, .14, .14), M(0x1A1A1A)); t.position.set(0, 1.3, .07); g.add(t);
        [-.6, .6].forEach(x => { const l = new THREE.Mesh(new THREE.BoxGeometry(.1, 1.6, .1), M(0x5A5A5A)); l.position.set(x, .8, 0); g.add(l); }); return g; } }
  ];
  const starGeo = (() => { const s = new THREE.Shape(); for (let k = 0; k < 10; k++){ const a = Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? .16 : .38; const x = Math.cos(a) * r, y = Math.sin(a) * r; k ? s.lineTo(x, y) : s.moveTo(x, y); } return new THREE.ExtrudeGeometry(s, { depth: .1, bevelEnabled: false }); })();
  const starMat = M(0xFFD24A, { emissive: 0xFFA500, emissiveIntensity: .7, metalness: .4, roughness: .3 });
  const spawnObstacle = z => {
    const kind = OB_KINDS[Math.floor(Math.random() * OB_KINDS.length)];
    const free = [0, 1, 2].sort(() => Math.random() - .5);
    const n = Math.random() < .35 ? 2 : 1;                           // kadang-kadang dua lorong ditutup, satu sentiasa terbuka
    for (let i = 0; i < n; i++){
      const m = kind.make(); m.position.set(LANES[free[i]], 0, z); scene.add(m);
      OBS.push({ m, lane: free[i], low: kind.low, z });
    }
  };
  const spawnStars = (z, lane) => { for (let i = 0; i < 5; i++){ const m = new THREE.Mesh(starGeo, starMat); m.position.set(LANES[lane], 1, z - i * 2.2); scene.add(m); STARS.push({ m, lane }); } };
  const gateTex = (txt, col) => ctex(256, 128, (g, w, h) => {
    g.fillStyle = col; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(6, 6, w - 12, h - 12);
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    let fs = 44; g.font = 'bold ' + fs + 'px sans-serif';
    while (g.measureText(txt).width > w - 24 && fs > 14){ fs -= 2; g.font = 'bold ' + fs + 'px sans-serif'; }
    if (g.measureText(txt).width > w - 24){                          // dua baris
      const words = txt.split(' '), mid = Math.ceil(words.length / 2);
      g.fillText(words.slice(0, mid).join(' '), w / 2, h / 2 - fs * .6); g.fillText(words.slice(mid).join(' '), w / 2, h / 2 + fs * .6);
    } else g.fillText(txt, w / 2, h / 2 + 2);
  });
  const GATE_COLS = ['#2A7FD4', '#D4532A', '#8A3AD4'];
  const spawnGates = (z, q) => {
    const wrong = q.c.map((_, i) => i).filter(i => i !== q.a).sort(() => Math.random() - .5).slice(0, 2);
    const opts = [q.a].concat(wrong).sort(() => Math.random() - .5);
    const row = { z, q, opts, done: false, meshes: [] };
    opts.forEach((ci, lane) => {
      const g = new THREE.Group();
      const posts = M(0xE8ECF1);
      [-1, 1].forEach(s => { const p = new THREE.Mesh(new THREE.BoxGeometry(.14, 2.6, .14), posts); p.position.set(s * .95, 1.3, 0); g.add(p); });
      const sign = new THREE.Mesh(new THREE.PlaneGeometry(2, 1), new THREE.MeshBasicMaterial({ map: gateTex(String(q.c[ci]), GATE_COLS[lane]), side: THREE.DoubleSide }));
      sign.position.y = 2.9; g.add(sign);
      const arch = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 2.5), new THREE.MeshBasicMaterial({ color: GATE_COLS[lane], transparent: true, opacity: .16, side: THREE.DoubleSide }));
      arch.position.y = 1.25; g.add(arch);
      g.position.set(LANES[lane], 0, z); scene.add(g); row.meshes.push(g);
    });
    GATES.push(row);
    $r('#rnQt').innerHTML = esc(q.q) + '<div class="flex gap-1 mt-2 text-[13px]">' + opts.map((ci, lane) =>
      '<div class="flex-1 truncate" style="padding:3px 4px;background:' + GATE_COLS[lane] + ';color:#fff;border-radius:3px">' +
      ['◀ ', '▲ ', '▶ '][lane] + esc(String(q.c[ci])) + '</div>').join('') + '</div>';
    $r('#rnQ').style.display = 'block';
  };

  /* ---------- bunyi ---------- */
  const A = (() => {
    if (!ac) return null;
    const out = ac.createGain(); out.gain.value = .7; out.connect(ac.destination);
    const tone = (type, f0, f1, dur, vol, delay) => { const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05); };
    // muzik ceria ringkas: bass + arpeggio berulang
    let beat = 0, timer = null;
    const NOTES = [[262, 330, 392], [220, 277, 330], [175, 220, 262], [196, 247, 294]];
    timer = setInterval(() => {
      const ch = NOTES[Math.floor(beat / 8) % 4];
      if (beat % 2 === 0) tone('triangle', ch[0] / 2, 0, .22, .09);
      tone('square', ch[beat % 3], 0, .12, .025);
      beat++;
    }, 160);
    return {
      coin:  () => tone('square', 1320, 1760, .08, .05),
      jump:  () => tone('sine', 300, 600, .18, .12),
      lane:  () => tone('sine', 520, 440, .06, .04),
      hit:   () => { tone('sawtooth', 160, 60, .4, .2); tone('square', 90, 50, .3, .12); },
      right: () => [784, 988, 1175, 1568].forEach((f, i) => tone('triangle', f, 0, .25, .14, i * .07)),
      wrong: () => tone('square', 220, 110, .5, .15),
      over:  () => [523, 440, 349, 262].forEach((f, i) => tone('triangle', f, 0, .35, .14, i * .18)),
      stop:  () => { clearInterval(timer); try { out.gain.setTargetAtTime(0, ac.currentTime, .05); setTimeout(() => out.disconnect(), 300); } catch(e){} }
    };
  })();
  const sfxR = k => { try { A && A[k] && A[k](); } catch(e){} };

  /* ---------- keadaan ---------- */
  const P = { lane: 1, x: 0, y: 0, vy: 0, inv: 0, phase: 0 };
  const RL = RUN_LVL[runCfg().lvl] || RUN_LVL.sederhana, RQ = runCfg().qt;
  let speed = RL.v0, dist = 0, stars = 0, right = 0, asked = 0, lives = 3, alive = true, ended = false, paused = false;
  let nextObs = -40, nextStar = -30, nextQ = 160, lastSpawnZ = -40;
  RUN = { close: () => quit() };
  const hud = () => {
    $r('#rnLives').innerHTML = [0, 1, 2].map(i => '<i class="fa-solid fa-heart" style="color:' + (i < lives ? '#FF4D6A' : 'rgba(0,0,0,.4)') + '"></i>').join(' ');
    $r('#rnStars').innerHTML = '★ ' + stars;
    $r('#rnScore').textContent = score();

  };
  const score = () => Math.floor(dist) + stars * 10 + right * 60;
  let msgT = null;

  hud();

  /* ---------- kawalan ---------- */
  const move = d => { const n = clamp(P.lane + d, 0, 2); if (n !== P.lane){ P.lane = n; sfxR('lane'); } };
  const jump = () => { if (P.y <= .01){ P.vy = 9.5; sfxR('jump'); } };
  const onKey = e => {
    if (e.type !== 'keydown' || paused || ended) return;

    if (k === 'arrowleft' || k === 'a') move(-1);

  };
  let sw = null;
  const onDown = e => { if (e.target.closest('button,#rnEnd')) return; sw = { x: e.clientX, y: e.clientY, t: performance.now(), used: false }; };
  const onMove = e => {
    if (!sw || sw.used) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)){ move(dx > 0 ? 1 : -1); sw.used = true; }
    else if (dy < -28 && Math.abs(dy) > Math.abs(dx)){ jump(); sw.used = true; }
  };
  const onUp = e => {
    if (!sw) return;
    if (!sw.used && performance.now() - sw.t < 260){                // ketik: sisi kiri/kanan tukar lorong, tengah lompat
