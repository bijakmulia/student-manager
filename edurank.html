    }
    sw = null;
  };
  window.addEventListener('keydown', onKey);
  root.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  $r('#rnQuit').onclick = () => quit();

  /* ---------- logik ---------- */
  const removeObj = (arr, i) => { const o = arr[i]; scene.remove(o.m); arr.splice(i, 1); };
  function hurt(){
    if (P.inv > 0) return;
    lives--; P.inv = 1.6; sfxR('hit'); vibrate(80); hud();
    const h = $r('#rnHit'); h.style.opacity = 1; setTimeout(() => h.style.opacity = 0, 250);
    if (lives <= 0) gameOver();
  }
  function update(dt){
    speed = Math.min(RL.vmax, RL.v0 + dist / RL.ramp);
    const dz = speed * dt;
    dist += dz;
    roadTex.offset.y -= dz / (160 / 6);
    // pemandangan berulang
    SCN.forEach(o => { o.position.z += dz; if (o.position.z > 12) o.position.z -= SPAN; });
    // pelari
    P.x += (LANES[P.lane] - P.x) * Math.min(1, dt * 14);
    P.vy -= 26 * dt; P.y = Math.max(0, P.y + P.vy * dt); if (P.y === 0) P.vy = Math.max(0, P.vy);
    P.phase += dt * (8 + speed * .35);
    const sw2 = P.y > 0 ? .6 : Math.sin(P.phase) * .9;
    legL.rotation.x = sw2; legR.rotation.x = -sw2; armL.rotation.x = -sw2 * .8; armR.rotation.x = sw2 * .8;
    runner.position.set(P.x, P.y + (P.y > 0 ? 0 : Math.abs(Math.sin(P.phase)) * .08), 0);
    runner.rotation.z = (LANES[P.lane] - P.x) * -.08;
    runner.visible = P.inv <= 0 || Math.floor(P.inv * 12) % 2 === 0;
    shadow.position.set(P.x, .02, 0); shadow.scale.setScalar(1 - Math.min(.5, P.y / 4));
    if (P.inv > 0) P.inv -= dt;
    cam.position.x += (P.x * .45 - cam.position.x) * Math.min(1, dt * 5);
    // jana objek baharu di hadapan
    nextObs += dz; nextStar += dz; nextQ -= dz;
    const gateNear = GATES.some(g => !g.done && g.z > -50);
    if (nextObs >= 0 && !gateNear){ spawnObstacle(-90); nextObs = -(14 + Math.random() * 10) * (11 / speed) * 1.4; }
    if (nextStar >= 0){ spawnStars(-90, Math.floor(Math.random() * 3)); nextStar = -(30 + Math.random() * 20); }
    if (nextQ <= 0 && !GATES.some(g => !g.done)){
      const q = escQuestion();
      spawnGates(-Math.max(60, speed * RQ), q); nextQ = 260 + Math.random() * 60 + speed * RQ;
      OBS.slice().forEach((o, i) => { if (o.m.position.z < -60) { scene.remove(o.m); o.dead = true; } });
      for (let i = OBS.length - 1; i >= 0; i--) if (OBS[i].dead) OBS.splice(i, 1);
    }
    // halangan
    for (let i = OBS.length - 1; i >= 0; i--){
      const o = OBS[i]; o.m.position.z += dz;
      if (!o.hit && o.lane === P.lane && Math.abs(o.m.position.z) < .7 && Math.abs(P.x - LANES[o.lane]) < 1){
        if (!(o.low && P.y > .55)){ o.hit = true; hurt(); }
      }
      if (o.m.position.z > 10) removeObj(OBS, i);
    }
    // bintang
    for (let i = STARS.length - 1; i >= 0; i--){
      const s = STARS[i]; s.m.position.z += dz; s.m.rotation.y += dt * 4;
      if (s.lane === P.lane && Math.abs(s.m.position.z) < .8 && P.y < 2){ stars++; sfxR('coin'); hud(); removeObj(STARS, i); continue; }
      if (s.m.position.z > 10) removeObj(STARS, i);
    }
    // gerbang soalan
    for (let i = GATES.length - 1; i >= 0; i--){
      const g = GATES[i]; g.z += dz; g.meshes.forEach(m => m.position.z = g.z);
      if (!g.done && g.z > -0.2){
        g.done = true; asked++;
        const ok = g.opts[P.lane] === g.q.a;
        teamQuiz(sid, ok);
        if (ok){ right++; stars += 5; sfxR('right'); msg('BETUL! +60', '#4ADE80'); P.inv = Math.max(P.inv, .8); }
        else { sfxR('wrong'); msg('SALAH! Jawapan: ' + esc(String(g.q.c[g.q.a])), '#FF6B6B', 2200); hurt(); }
        $r('#rnQ').style.display = 'none'; hud();
      }
      if (g.z > 12){ g.meshes.forEach(m => scene.remove(m)); GATES.splice(i, 1); }
    }
    if (Math.floor(dist) % 10 === 0) hud();
  }
  function gameOver(){
    if (ended) return;
    ended = true; sfxR('over');
    const sc = score(), rp = runRP(sc), d = runData();
    d.gbest = d.gbest || {};
    const prev = d.gbest[sid] || 0;
    if (sc > prev) d.gbest[sid] = sc;
    d.plays[sid] = (d.plays[sid] || 0) + 1;
    S.arena = S.arena || { points:{}, wins:{}, losses:{}, history:[] };
    teamRP(sid, rp);
    const tp = gameToPBD(sid, 'run', right, asked, { score: sc });
    save(true);
    const e = $r('#rnEnd');
    e.innerHTML = '<div class="panel clip p-5 w-full text-center" style="max-width:400px">' +
      '<div style="font-size:40px">' + (sc > prev ? '🏆' : '🏁') + '</div>' +
      '<div class="font-bold tracking-widest text-[20px] mt-1" style="color:#FFB347">' + (sc > prev ? 'REKOD BAHARU!' : 'TAMAT LARIAN') + '</div>' +
      '<div class="text-[13px] text-muted mt-1">' + esc(player ? player.name : '') + '</div>' +
      '<div class="grid grid-cols-3 gap-2 mt-4 num">' +
        '<div class="panel clip-s p-2"><div class="text-[18px] text-cyan">' + sc + '</div><div class="text-[10px] text-muted">SKOR</div></div>' +
        '<div class="panel clip-s p-2"><div class="text-[18px]" style="color:#FFD76A">' + right + '/' + asked + '</div><div class="text-[10px] text-muted">BETUL</div></div>' +
        '<div class="panel clip-s p-2"><div class="text-[18px] text-orange">+' + rp + '</div><div class="text-[10px] text-muted">RP</div></div></div>' +
      '<div class="text-[11px] text-muted mt-2">' + Math.floor(dist) + ' m · ★ ' + stars + '</div>' +
      (tp ? '<div class="text-[12px] mt-2" style="color:#00F0FF"><b style="color:' + TP_COLOR[tp] + '">TP' + tp + '</b> direkod dalam PBD untuk ' + player.members.length + ' ahli kumpulan</div>'
          : '<div class="text-[11px] text-muted mt-2">Tiada soalan dijawab — tiada TP direkod.</div>') +
      '<div class="flex gap-2 mt-4"><button class="btn clip-s flex-1 !py-3" data-end="quit">Tutup</button><button class="btn btn-o clip-s flex-1 !py-3" data-end="again"><i class="fa-solid fa-rotate"></i> Lari Lagi</button></div></div>';
    e.style.display = 'flex';
    e.onclick = ev => { const b = ev.target.closest('[data-end]'); if (!b) return; const again = b.dataset.end === 'again'; quit(); if (again) setTimeout(runStart, 50); };
  }
  function quit(){
    if (!alive) return;
    alive = false; RUN = null;
    if (!ended && asked) save();
    window.removeEventListener('resize', resize); window.removeEventListener('keydown', onKey);
    window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp);
    if (A) A.stop();
    scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) [].concat(o.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); });
    R.dispose(); root.remove(); unlockBody();
    if (S.ui.tab === 'arena') renderTab();
  }
  let last = performance.now();
  function frame(now){
    if (!alive) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!ended && !paused) update(dt);
    R.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ============ TAB: KEHADIRAN ============
   Daftar kehadiran harian untuk setiap kelas, berasingan daripada penilaian
   PBD (tidak mengubah skor atau TP). Data: S.attendance[classId][tarikh] =
   { s: { sid: 'H'|'L'|'T'|'C' }, n: { sid: 'catatan' } }.
   H = Hadir · L = Lewat · T = Tidak Hadir · C = Cuti / MC (dikira hadir? tidak). */
const ATT = [
  { k:'H', name:'Hadir',       short:'HADIR', color:'#4ADE80', ico:'fa-check' },
  { k:'L', name:'Lewat',       short:'LEWAT', color:'#FACC15', ico:'fa-clock' },

const attOf = k => ATT.find(a => a.k === k) || null;

const attBox = (cid, date, make) => {
  S.attendance = S.attendance || {};
  if (!S.attendance[cid]){ if (!make) return null; S.attendance[cid] = {}; }
  if (!S.attendance[cid][date]){ if (!make) return null; S.attendance[cid][date] = { s:{}, n:{} }; }
  const d = S.attendance[cid][date]; d.s = d.s || {}; d.n = d.n || {};
  return d;
};
const attGet = (sid, date) => { const s = stu(sid); if (!s) return ''; const b = attBox(s.classId, date || attDate()); return b ? (b.s[sid] || '') : ''; };
const attNoteOf = (sid, date) => { const s = stu(sid); if (!s) return ''; const b = attBox(s.classId, date || attDate()); return b ? (b.n[sid] || '') : ''; };
/* Tag kecil pada kad pelajar (tab Pelajar) bagi status hari yang dinilai */
function attTag(sid){
  const k = attGet(sid, recDate()); if (!k || (k === 'H' && attendedToday(sid))) return '';
  const a = attOf(k);
  return '<span class="tag !text-[8px] ml-1" style="color:' + a.color + ';border-color:' + a.color + '77"><i class="fa-solid ' + a.ico + '"></i> ' + a.short + '</span>';
}
function attSet(sid, k){
  const s = stu(sid); if (!s) return;
  const b = attBox(s.classId, attDate(), true);
  if (b.s[sid] === k){ delete b.s[sid]; delete b.n[sid]; } else b.s[sid] = k;
  if (k === 'H' || k === 'L') delete b.n[sid];
  save(); vibrate(10);
  const y = window.scrollY; renderTab(); window.scrollTo(0, y);
  if ((k === 'T' || k === 'C') && b.s[sid] === k && !b.n[sid]) setTimeout(() => attNote(sid), 120);

function attAll(k){
  const list = studentsOf(attClassId()), d = attDate();
  const snap = snapshot();
  let n = 0;
  list.forEach(s => { const b = attBox(s.classId, d, true); if (!b.s[s.id]){ b.s[s.id] = k; n++; } });
  save(true); renderTab();
  toast(n ? n + ' pelajar ditanda ' + attOf(k).name.toUpperCase() + '.' : 'Semua pelajar sudah ditanda.', n ? () => restore(snap) : null);

const dayShift = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* Soalan: bank guru dahulu (ikut urutan, sama seperti mod lain), jika tiada → matematik */
function escMathQ(){
  const r = n => Math.floor(Math.random() * n);
  const op = r(4); let a, b, ans, sym;
  if (op === 0){ a = 10 + r(90); b = 10 + r(90); ans = a + b; sym = '+'; }
  else if (op === 1){ a = 20 + r(80); b = 1 + r(a); ans = a - b; sym = '−'; }
  else if (op === 2){ a = 2 + r(11); b = 2 + r(11); ans = a * b; sym = '×'; }
  else { b = 2 + r(11); ans = 1 + r(12); a = b * ans; sym = '÷'; }
  const opts = new Set([ans]);
  while (opts.size < 4){ const d = (1 + r(10)) * (Math.random() < .5 ? -1 : 1); if (ans + d >= 0) opts.add(ans + d); }
  return { q: a + ' ' + sym + ' ' + b + ' = ?', c: Array.from(opts).map(String), a: 0, ans: String(ans), short: a + ' ' + sym + ' ' + b };
}
function escQuestion(){
  const bank = topicalBank(S.ui.activeSubjectId);
  if (!bank.length) return escMathQ();
  const q = nextQ(bank);
  const keep = [0,1,2,3].filter(i => q.c[i] !== undefined && q.c[i] !== '');
  return { q: q.q, c: keep.map(i => q.c[i]), a: keep.indexOf(q.a) };
}
/* 4 pasangan untuk teka-teki padanan: soalan ↔ jawapan betul (hasil unik) */
function escPairs(){
  const bank = topicalBank(S.ui.activeSubjectId).filter(q => q.c && q.c[q.a] !== undefined);
  const out = [], seen = new Set();
  bank.slice().sort(() => Math.random() - .5).forEach(q => {
    const a = String(q.c[q.a]);
    if (out.length < 4 && !seen.has(a)){ seen.add(a); out.push([q.q.length > 60 ? q.q.slice(0, 57) + '…' : q.q, a]); }
  });
  for (let n = 0; out.length < 4 && n < 200; n++){
    const m = escMathQ();
    if (!seen.has(m.ans)){ seen.add(m.ans); out.push([m.short, m.ans]); }
  }
  return out;
}
async function escStart(){
  const o = arenaUi();
  if (!o.team || !teamOf(o.team)) return toast('Pilih kumpulan dahulu.', null, true);
  if (ESC || RUN) return;
  /* AudioContext mesti dicipta semasa sentuhan pengguna, sebelum await */
  let ac = null;
  try { ac = (typeof audCtx === 'function' && audCtx()) || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){}
  ESC = { loading:true };
  toast('Memuatkan sekolah…');
  let THREE;
  try { THREE = await import(ESC_THREE); }
  catch(e){ ESC = null; return toast('Gagal memuat enjin 3D. Semak sambungan internet.', null, true); }
  try { escRun(THREE, o.team, ac); }
  catch(e){ ESC = null; const r = $('#escRoot'); if (r) r.remove(); unlockBody(); console.error(e); toast('Permainan gagal dimulakan.', null, true); }
}

function escRun(THREE, sid, ac){
  const cfg = escCfg();
  const D = ESC_DIFF[cfg.diff] || ESC_DIFF.sederhana, LT = ESC_LIGHT[cfg.light] || ESC_LIGHT.biasa;
  const QT = +cfg.qt || D.qtime, MT = Math.round(D.match * QT / D.qtime);   // masa menjawab dilaras guru
  const gKind = ESC_GHOSTS[cfg.ghost] ? cfg.ghost : ['putih','pontianak','toyol'][Math.floor(Math.random() * 3)];
  const GT = ESC_GHOSTS[gKind];
  const soft = cfg.scare === 'lembut';
  const player = teamOf(sid);                     // sid = id kumpulan yang bermain

  /* ---------- lapisan paparan ---------- */
  const root = document.createElement('div');
  root.id = 'escRoot';
  root.style.cssText = 'position:fixed;inset:0;z-index:950;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;font-family:inherit';
  const ovl = 'position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;';
  root.innerHTML =
    '<canvas id="escCv" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>' +
    '<div id="escSlit" style="position:absolute;inset:0;pointer-events:none;display:none;background:repeating-linear-gradient(180deg,#040507 0 30px,transparent 30px 38px),linear-gradient(90deg,#040507 0 12%,transparent 12% 88%,#040507 88%)"></div>' +
    '<div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.9) 100%)"></div>' +
    '<div id="escRed" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 25%,rgba(150,0,0,.6) 100%);opacity:0;transition:opacity .25s"></div>' +
    '<div id="escFade" style="position:absolute;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .35s"></div>' +
    '<div style="position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--safe-t,0px)) 12px 0;display:flex;align-items:center;gap:12px;pointer-events:none">' +
      '<div id="escKeys" class="num text-[15px]"></div><div id="escLives" class="text-[13px]"></div><div id="escCode" class="num text-[13px]"></div>' +
      '<div id="escTime" class="num text-[13px] ml-auto" style="color:#7E93A8"></div>' +
      '<button id="escQuit" class="btn clip-s !px-3 !py-1 text-[13px]" style="pointer-events:auto"><i class="fa-solid fa-xmark"></i></button></div>' +
    '<div id="escWhere" class="num" style="position:absolute;left:12px;top:calc(40px + var(--safe-t,0px));font-size:10px;letter-spacing:.15em;color:rgba(200,215,230,.45);pointer-events:none"></div>' +
    '<div id="escMsg" style="position:absolute;left:16px;right:16px;top:calc(62px + var(--safe-t,0px));text-align:center;font-size:15px;font-weight:700;color:#E8ECF1;text-shadow:0 0 8px #000,0 0 3px #000;pointer-events:none;opacity:0;transition:opacity .4s"></div>' +
    '<div style="position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none"></div>' +
    '<div id="escJoy" style="position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);display:none;pointer-events:none">' +
      '<div id="escKnob" style="position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.22)"></div></div>' +
    '<div id="escHint" style="position:absolute;left:16px;bottom:calc(20px + var(--safe-b,0px));font-size:11px;color:rgba(255,255,255,.35);pointer-events:none">sentuh &amp; seret di sini untuk berjalan</div>' +
    '<button id="escAct" class="btn btn-o clip-s" style="position:absolute;right:18px;bottom:calc(110px + var(--safe-b,0px));padding:14px 18px;font-size:14px;display:none"></button>' +
    '<div id="escQ" style="'+ovl+'background:rgba(0,0,0,.75)"></div>' +
    '<div id="escScare" style="'+ovl+'background:#000"></div>' +
    '<div id="escEnd" style="'+ovl+'background:rgba(0,0,0,.85)"></div>';
  document.body.appendChild(root);
  lockBody();
  const $e = s => root.querySelector(s);

  /* ---------- pemapar & pentas ---------- */
  const R = new THREE.WebGLRenderer({ canvas: $e('#escCv'), antialias: false, powerPreference: 'high-performance' });
  R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  R.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020304);
  scene.fog = new THREE.FogExp2(0x020304, LT.fog);
  const cam = new THREE.PerspectiveCamera(72, 1, 0.05, 60);
  cam.rotation.order = 'YXZ';
  scene.add(cam);
  const resize = () => { const w = root.clientWidth, h = root.clientHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); };
  resize(); window.addEventListener('resize', resize);
  scene.add(new THREE.HemisphereLight(0x2a3a4a, 0x0a0806, LT.amb));

  /* ---------- tekstur dilukis sendiri (tiada fail luar) ---------- */
  const canvasTex = (w, h, draw) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
    t.userData.canvas = c;
    return t;
  };
  const grime = (g, w, h, n, a) => { for (let i = 0; i < n; i++){ g.fillStyle = 'rgba(0,0,0,'+(Math.random()*a)+')'; const s = 2 + Math.random()*6; g.fillRect(Math.random()*w, Math.random()*h, s, s); } };
  const textLines = (g, lines, x, y, lh) => lines.forEach((l, i) => g.fillText(l, x, y + i * lh));
  const floorTex = canvasTex(256, 256, (g, w, h) => {
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++){ g.fillStyle = (x + y) % 2 ? '#3B4237' : '#262A25'; g.fillRect(x*w/2, y*h/2, w/2, h/2); }
    grime(g, w, h, 900, .35);
  });
  const wallTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#56695B'; g.fillRect(0, 0, w, h*.55);
    g.fillStyle = '#2C3034'; g.fillRect(0, h*.55, w, h*.45);
    g.fillStyle = '#7A1E1E'; g.fillRect(0, h*.53, w, 6);
    grime(g, w, h, 700, .3);
    for (let i = 0; i < 4; i++){ g.fillStyle = 'rgba(20,25,20,.35)'; g.fillRect(Math.random()*w, 0, 3 + Math.random()*4, Math.random()*h*.6); }
  });
  const ceilTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#1B1D1F'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#0D0E0F'; g.lineWidth = 3; g.strokeRect(0, 0, w, h);
    grime(g, w, h, 200, .4);
  });
  const lockerTex = canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = '#3A4A5E'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 32){ g.fillStyle = '#1E2733'; g.fillRect(x, 0, 2, h); g.fillRect(x + 22, h*.45, 5, 12); for (let y = 10; y < 34; y += 6) g.fillRect(x + 7, y, 16, 2); }
    grime(g, w, h, 300, .35);
  });
  const hideTex = canvasTex(64, 128, (g, w, h) => {
    g.fillStyle = '#7A2E22'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#2A0E0B'; for (let y = 10; y < 40; y += 6) g.fillRect(12, y, 40, 3);
    g.fillRect(46, h*.45, 6, 14); g.fillRect(0, 0, 3, h);
    grime(g, w, h, 160, .45);
  });
  const bookTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#2A1C12'; g.fillRect(0, 0, w, h);
    const cols = ['#6B1F1F','#1F3B6B','#2F5A2A','#6B5A1F','#4A2A5A','#1F5A5A','#5A3A22'];
    for (let row = 0; row < 4; row++){
      g.fillStyle = '#1A110A'; g.fillRect(0, row * 64 + 58, w, 6);
      for (let x = 2; x < w - 6; ){
        const bw = 6 + Math.random() * 10, bh = 34 + Math.random() * 20;
        g.fillStyle = cols[Math.floor(Math.random() * cols.length)];
        g.fillRect(x, row * 64 + 58 - bh, bw, bh); x += bw + 1;
      }
    }
    grime(g, w, h, 300, .4);
  });
  const flagTex = canvasTex(280, 140, (g, w, h) => {
    for (let i = 0; i < 14; i++){ g.fillStyle = i % 2 ? '#FFFFFF' : '#CC0001'; g.fillRect(0, i*h/14, w, h/14 + 1); }
    g.fillStyle = '#010066'; g.fillRect(0, 0, w/2, h*8/14);
    const cy = h*4/14, cx = w*.17, r = h*.2;
    g.fillStyle = '#FFCC00'; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.fill();
    g.fillStyle = '#010066'; g.beginPath(); g.arc(cx + r*.28, cy, r*.82, 0, Math.PI*2); g.fill();
    g.fillStyle = '#FFCC00'; g.beginPath();
    for (let k = 0; k < 28; k++){ const a = -Math.PI/2 + k*Math.PI/14, rr = k % 2 ? r*.45 : r*.95; g.lineTo(w*.33 + Math.cos(a)*rr, cy + Math.sin(a)*rr); }
    g.closePath(); g.fill();
    grime(g, w, h, 150, .25);
  });
  const rukunTex = canvasTex(256, 320, (g, w, h) => {
    g.fillStyle = '#E8DCC0'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#7A1E1E'; g.fillRect(0, 0, w, 54);
    g.fillStyle = '#FFE9A8'; g.font = 'bold 28px serif'; g.textAlign = 'center'; g.fillText('RUKUN NEGARA', w/2, 37);
    g.fillStyle = '#2A2016'; g.font = 'bold 15px serif'; g.textAlign = 'left';
    textLines(g, ['1. Kepercayaan kepada Tuhan','2. Kesetiaan kepada Raja','    dan Negara','3. Keluhuran Perlembagaan','4. Kedaulatan Undang-Undang','5. Kesopanan dan Kesusilaan'], 16, 92, 34);
    grime(g, w, h, 500, .3);
    g.fillStyle = 'rgba(90,10,10,.55)'; g.fillRect(w*.7, h*.6, 6, h*.4);
  });
  const noticeTex = canvasTex(320, 220, (g, w, h) => {
    g.fillStyle = '#7A5A36'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#B08A5A'; g.fillRect(8, 8, w - 16, h - 16);
    g.fillStyle = '#3A2A1A'; g.font = 'bold 16px sans-serif'; g.textAlign = 'center'; g.fillText('PAPAN KENYATAAN', w/2, 30);
    [['#F2E6A0', 20, 44, 'JADUAL BERTUGAS'], ['#BFE0F2', 120, 52, 'PBD MINGGU 9'], ['#F2C0C0', 214, 40, 'LAWATAN']].forEach(([c, x, y, t]) => {
      g.fillStyle = c; g.fillRect(x, y, 86, 70); g.fillStyle = '#C0392B'; g.beginPath(); g.arc(x + 43, y + 6, 4, 0, 7); g.fill();
      g.fillStyle = '#333'; g.font = 'bold 10px sans-serif'; g.fillText(t, x + 43, y + 26);
      g.fillStyle = 'rgba(0,0,0,.35)'; for (let k = 0; k < 4; k++) g.fillRect(x + 10, y + 36 + k * 8, 66, 2);
    });
    g.fillStyle = '#F4F4F0'; g.fillRect(70, 132, 180, 70);
    g.fillStyle = '#8B0000'; g.font = 'bold 15px sans-serif'; g.fillText('JANGAN TINGGAL DI', 160, 160); g.fillText('SEKOLAH SELEPAS GELAP', 160, 182);
    grime(g, w, h, 300, .3);
  });
  const periodicTex = canvasTex(320, 200, (g, w, h) => {
    g.fillStyle = '#D8D8CC'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#222'; g.font = 'bold 15px sans-serif'; g.textAlign = 'center'; g.fillText('JADUAL BERKALA', w/2, 20);
    const cols = ['#E8A0A0','#A0C8E8','#A0E8B0','#E8D8A0','#C8A0E8'];
    for (let r = 0; r < 7; r++) for (let c = 0; c < 18; c++){
      if (r === 0 && c > 0 && c < 17) continue;
      if ((r === 1 || r === 2) && c > 1 && c < 12) continue;
      g.fillStyle = cols[(r + c) % 5]; g.fillRect(8 + c * 17, 30 + r * 23, 15, 21);
    }
    grime(g, w, h, 300, .3);
  });
  const welcomeTex = canvasTex(512, 96, (g, w, h) => {
    g.fillStyle = '#1F3B6B'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#FFD76A'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.fillText('SELAMAT DATANG KE SK LAGENDA', w/2, 42);
    g.fillStyle = '#E8ECF1'; g.font = 'italic 18px serif'; g.fillText('Ilmu · Iman · Amal', w/2, 74);
    grime(g, w, h, 400, .45);
  });
  const plateTex = txt => canvasTex(256, 48, (g, w, h) => {
    g.fillStyle = '#1C2A22'; g.fillRect(0, 0, w, h); g.strokeStyle = '#C8D8C8'; g.lineWidth = 3; g.strokeRect(3, 3, w - 6, h - 6);
    g.fillStyle = '#E8F0E8'; g.font = 'bold 22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, w/2, h/2 + 1);
    grime(g, w, h, 80, .35);
  });
  const scrawlTex = txt => canvasTex(512, 128, (g, w, h) => {
    g.font = 'bold 44px serif'; g.fillStyle = '#8B0000'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, w/2, h/2);
  });
  const clockTex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#F0EEE6'; g.beginPath(); g.arc(64, 64, 60, 0, 7); g.fill();
    g.strokeStyle = '#222'; g.lineWidth = 5; g.stroke();
    g.fillStyle = '#222';
    for (let k = 0; k < 12; k++){ const a = k * Math.PI / 6; g.fillRect(64 + Math.sin(a) * 48 - 2, 64 - Math.cos(a) * 48 - 2, 4, 4); }
    g.lineCap = 'round'; g.lineWidth = 5; g.beginPath(); g.moveTo(64, 64); g.lineTo(64, 30); g.stroke();   // jam terhenti tepat 12:00
    g.lineWidth = 3; g.beginPath(); g.moveTo(64, 64); g.lineTo(64, 18); g.stroke();
    grime(g, w, h, 60, .25);
  });

  /* ---------- binaan ---------- */
  const H = 3.2;
  const solids = [];
  const box = (x1, z1, x2, z2, h, y0, mat, solid) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(.04, Math.abs(x2 - x1)), h, Math.max(.04, Math.abs(z2 - z1))), mat);
    m.position.set((x1 + x2) / 2, y0 + h / 2, (z1 + z2) / 2);
    scene.add(m);
    if (solid){ const s = { x1: Math.min(x1, x2), z1: Math.min(z1, z2), x2: Math.max(x1, x2), z2: Math.max(z1, z2) }; solids.push(s); m.userData.solid = s; }
    return m;
  };
  const texMat = (tex, rx, ry, extra) => { const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return new THREE.MeshStandardMaterial(Object.assign({ map: t, roughness: .95, metalness: 0 }, extra || {})); };
  const wall = (x1, z1, x2, z2) => box(x1, z1, x2, z2, H, 0, texMat(wallTex, Math.max(Math.abs(x2 - x1), Math.abs(z2 - z1)) / 3, 1), true);
  const dark = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 1 });
  const FACE = { '+z': 0, '-z': Math.PI, '+x': Math.PI / 2, '-x': -Math.PI / 2 };
  const decal = (x, y, z, w, h, tex, face, emis, transp) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({
      map: tex, transparent: !!transp, roughness: .9,
      emissive: emis ? 0xffffff : 0x000000, emissiveMap: emis ? tex : null, emissiveIntensity: emis || 0 }));
    m.position.set(x, y, z); m.rotation.y = FACE[face]; scene.add(m); return m;
  };
  const M = {
    desk: new THREE.MeshStandardMaterial({ color: 0x5A3E28, roughness: .9 }),
    chair: new THREE.MeshStandardMaterial({ color: 0x2E3A46, roughness: .9 }),
    white: new THREE.MeshStandardMaterial({ color: 0xBFC5C8, roughness: .7 }),
    steel: new THREE.MeshStandardMaterial({ color: 0x5A6670, roughness: .5, metalness: .4 }),
    black: new THREE.MeshStandardMaterial({ color: 0x0E0E10, roughness: .4 }),
    mirror: new THREE.MeshStandardMaterial({ color: 0x1A2630, roughness: .08, metalness: .9 }),
    shelf: new THREE.MeshStandardMaterial({ color: 0x3A2616, roughness: .9 }),
    hide: texMat(hideTex, 1, 1)
  };
  const books = texMat(bookTex, 1, 1);

  const FLOORS = [ { z0: 0, len: 56, name: 'TINGKAT BAWAH' }, { z0: 40, len: 40, name: 'TINGKAT ATAS' } ];
  const rooms = [
    { f:0, side:-1, x1:4,  x2:14, door:9,  kind:'class',   name:'KELAS 1 BESTARI' },
    { f:0, side:-1, x1:18, x2:34, door:26, kind:'library', name:'PERPUSTAKAAN' },
    { f:0, side:-1, x1:38, x2:48, door:43, kind:'class',   name:'KELAS 2 CEMERLANG' },
    { f:0, side: 1, x1:4,  x2:12, door:8,  kind:'toilet',  name:'TANDAS' },
    { f:0, side: 1, x1:16, x2:26, door:21, kind:'class',   name:'KELAS 3 DINAMIK' },
    { f:0, side: 1, x1:30, x2:40, door:35, kind:'staff',   name:'BILIK GURU' },
    { f:0, side: 1, x1:44, x2:52, door:48, kind:'stairs',  name:'TANGGA' },
    { f:1, side:-1, x1:4,  x2:14, door:9,  kind:'lab',     name:'MAKMAL SAINS' },
    { f:1, side: 1, x1:14, x2:24, door:19, kind:'class',   name:'KELAS 4 GEMILANG' },
    { f:1, side:-1, x1:26, x2:36, door:31, kind:'music',   name:'BILIK MUZIK' },
    { f:1, side: 1, x1:30, x2:38, door:34, kind:'stairs',  name:'TANGGA' }
  ];
  rooms.forEach(r => {
    r.zc = FLOORS[r.f].z0; r.zn = r.zc + r.side * 2; r.zf = r.zc + r.side * 12;
    r.cx = (r.x1 + r.x2) / 2; r.cz = r.zc + r.side * 7; r.inF = r.side < 0 ? '+z' : '-z';
  });
  const HIDES = [ [0, 3], [0, 14], [0, 28], [0, 41], [1, 6], [1, 26] ];
  const fixtures = [], fans = [], clocks = [], sources = [], inter = [];

  FLOORS.forEach((F, fi) => {
    const zc = F.z0;
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(F.len + 2, 25), texMat(floorTex, (F.len + 2) / 2, 12.5));
    fl.rotation.x = -Math.PI / 2; fl.position.set(F.len / 2, 0, zc); scene.add(fl);
    const ce = new THREE.Mesh(new THREE.PlaneGeometry(F.len + 2, 25), texMat(ceilTex, (F.len + 2) / 2, 12.5));
    ce.rotation.x = Math.PI / 2; ce.position.set(F.len / 2, H, zc); scene.add(ce);
    [-1, 1].forEach(side => {
      const doors = rooms.filter(r => r.f === fi && r.side === side).map(r => r.door).sort((a, b) => a - b);
      const zA = zc + side * 1.9, zB = zc + side * 2.1;
      let x = 0;
      doors.concat([F.len + 1]).forEach(d => { const e = Math.min(d - 1, F.len); if (e > x) wall(x, zA, e, zB); x = d + 1; });
      doors.forEach(d => box(d - 1, zA, d + 1, zB, H - 2.3, 2.3, dark, false));
      if (side > 0){                                             // loker sepanjang dinding selatan
        const hs = HIDES.filter(h => h[0] === fi).map(h => h[1]);
        const cuts = doors.map(d => [d - 1.6, d + 1.6]).concat(hs.map(h => [h - .5, h + .5])).sort((a, b) => a[0] - b[0]);
        let a = 1;
        cuts.concat([[F.len - 1, F.len]]).forEach(([c0, c1]) => { if (c0 - a > .3) box(a, zc + 1.55, c0, zc + 1.9, 2, 0, texMat(lockerTex, (c0 - a) / 4, 1), true); a = Math.max(a, c1); });
        hs.forEach(h => {
          box(h - .45, zc + 1.45, h + .45, zc + 1.9, 2.1, 0, M.hide, true);
          inter.push({ f: fi, x: h, z: zc + .95, kind: 'hide', spot: { f: fi, x: h, zc } });
        });
      }
    });
    wall(-.2, zc - 2.1, 0, zc + 2.1); wall(F.len, zc - 2.1, F.len + .2, zc + 2.1);
    for (let x = 4; x < F.len; x += 8) fixtures.push({ f: fi, x, z: zc });
  });

  /* ---------- isi bilik ---------- */
  const boards = [];
  function drawBoard(bd){
    const c = bd.tex.userData.canvas, g = c.getContext('2d'), w = c.width, h = c.height;
    const match = bd.type === 'match';
    g.fillStyle = '#4A2E1A'; g.fillRect(0, 0, w, h);

  /* ---------- gelung utama ---------- */
  const fwd = new THREE.Vector3();
  let last = performance.now(), beatT = 0, tickT = 0;
  function update(dt, now){
    if (!P.hide){
      let mx = joy.x, my = joy.y;
      if (kb['w'] || kb['arrowup']) my -= 1;
      if (kb['s'] || kb['arrowdown']) my += 1;
      if (kb['a'] || kb['arrowleft']) mx -= 1;
      if (kb['d'] || kb['arrowright']) mx += 1;
      const m = Math.min(1, Math.hypot(mx, my));
      if (m > .05){
        const sp = 3.3 * m, sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
        const vx = (-sy * -my + cy * mx), vz = (-cy * -my - sy * mx), vl = Math.hypot(vx, vz) || 1;
        P.x += vx / vl * sp * dt; P.z += vz / vl * sp * dt;
        P.bob += dt * 9 * m;
        if (now - lastStep > 430){ lastStep = now; sfx('step'); }
      }
      collide(P, .3);
    }
    cam.position.set(P.x, (P.hide ? 1.55 : 1.6 + Math.sin(P.bob) * .04), P.z);
    cam.rotation.set(P.pitch, P.yaw, 0);
    // hantu
    if (G.f !== P.f){
      G.hunt = false;
      if (!P.hide && (G.follow += dt) > 10){
        const r = STAIRS[P.f]; G.f = P.f; G.x = r.cx; G.z = r.zc + r.side * 8; G.follow = 0; G.grace = 1.5;
        sfx('creak'); msg('Kamu terdengar sesuatu di <span style="color:#E23B3B">tangga</span>…', 2600);
      }
    } else G.follow = 0;
    const same = G.f === P.f;
    const dx = P.x - G.x, dz = P.z - G.z, dist = same ? Math.hypot(dx, dz) : 99;
    if (G.grace > 0) G.grace -= dt;
    else if (same){
      if (!G.hunt && !P.hide && dist < sight){ G.hunt = true; sfx('sting'); msg('<span style="color:#FF5A5A">Ia nampak kamu… LARI!</span>', 2000); }
      if (G.hunt && (dist > sight + 7 || P.hide)) G.hunt = false;
      let tx, tz, sp;
      if (G.hunt){ tx = P.x; tz = P.z; sp = huntSp + keys() * .2; }
      else {
        if (Math.hypot(G.wx - G.x, G.wz - G.z) < .5){ const w = WAYS[G.f][Math.floor(Math.random() * WAYS[G.f].length)]; G.wx = w[0]; G.wz = w[1]; }
        tx = G.wx; tz = G.wz; sp = GT.roam;
      }
      const gx = tx - G.x, gz = tz - G.z, gl = Math.hypot(gx, gz) || 1;
      G.x += gx / gl * sp * dt; G.z += gz / gl * sp * dt;
      if (dist < .75 && !P.hide) return caught();
    }
    ghost.visible = same;
    const jitter = gKind === 'toyol' ? Math.abs(Math.sin(now / 90)) * .08 : Math.sin(now / 400) * .12 + .1;
    ghost.position.set(G.x, jitter, G.z);
    ghost.lookAt(P.x, ghost.position.y, P.z);
    // bunyi khas hantu (pontianak: ketawa PERLAHAN bila dekat, KUAT bila jauh)
    if ((laughT -= dt) <= 0){
      laughT = 11 + Math.random() * 9;
      if (gKind === 'pontianak') sfx('laugh', same ? clamp(dist / 18, .15, 1) : .35);
      else if (gKind === 'toyol') sfx('giggle', same ? clamp(1 - dist / 25, .2, 1) : .2);
    }
    // detak jantung & tepi merah bila dekat
    const fear = clamp(1 - dist / 10, 0, 1);
    $e('#escRed').style.opacity = (fear * .9).toFixed(2);
    beatT -= dt;
    if (fear > 0 && beatT <= 0){ sfx('beat', .4 + fear * .6); beatT = 1.1 - fear * .65; }
    // jam berdetik
    if ((tickT += dt) >= 1){
      tickT = 0;
      clocks.forEach(c => { c.sec = (c.sec + 1) % 60; c.hand.rotation.z = -c.sec * Math.PI / 30; if (c.f === P.f){ const d = Math.hypot(c.x - P.x, c.z - P.z); if (d < 6) sfx('tick', 1 - d / 6); } });
    }
    cam.getWorldDirection(fwd);
    // nombor kod tersembunyi: dijumpai bila dilihat dari dekat
    digits.forEach(dg => {
      if (found[dg.idx] || dg.f !== P.f) return;
      const ox = dg.x - P.x, oz = dg.z - P.z, d = Math.hypot(ox, oz);
      if (d < 3.6 && (fwd.x * ox + fwd.z * oz) / (d || 1) > .55){
        found[dg.idx] = true; sfx('chime'); hud();
        msg('Kamu jumpa nombor tertulis: <span style="color:#FF5A5A">nombor ke-'+(dg.idx + 1)+' = '+CODE[dg.idx]+'</span>', 3200);
      }
    });
    // di mana pemain berada
    const inRoom = rooms.find(r => r.f === P.f && P.x > r.x1 && P.x < r.x2 && (P.z - r.zc) * r.side > 2 && (P.z - r.zc) * r.side < 12) || null;
    if (inRoom !== room){ room = inRoom; $e('#escWhere').textContent = FLOORS[P.f].name + (room ? ' · ' + room.name : ' · KORIDOR'); }
    // benda yang boleh disentuh berhampiran
    near = null; let best = 2.4;
    if (P.hide) near = { kind: 'unhide' };
    else inter.forEach(o => {
      if (o.f !== P.f) return;
      if (o.kind === 'board' && o.bd.solved) return;
      if (o.kind === 'pickup' && (o.src.solved || !staffDoor.open)) return;
      if (o.kind === 'lock' && staffDoor.open) return;
      const ox = o.x - P.x, oz = o.z - P.z, d = Math.hypot(ox, oz);
      const facing = o.kind === 'hide' || o.kind === 'stairs' ? 0 : .2;
      if (d < best && (fwd.x * ox + fwd.z * oz) / (d || 1) > facing - (o.kind === 'hide' ? 1 : 0)){ best = d; near = o; }
    });
    const LBL = { unhide: 'fa-door-open|KELUAR LOKER', hide: 'fa-box-archive|SEMBUNYI', exit: 'fa-door-open|BUKA PINTU', lock: 'fa-lock|MASUKKAN KOD',
      pickup: 'fa-key|AMBIL KUNCI', board: 'fa-chalkboard|JAWAB SOALAN', match: 'fa-shuffle|PADANKAN KAD' };
    let lk = near ? (near.kind === 'board' && near.bd.type === 'match' ? 'match' : near.kind) : '';
    let label = '';
    if (near && near.kind === 'stairs') label = '<i class="fa-solid fa-stairs"></i> ' + (near.to ? 'NAIK TANGGA' : 'TURUN TANGGA');
    else if (lk){ const [ic, t] = LBL[lk].split('|'); label = '<i class="fa-solid '+ic+'"></i> ' + t; }
    if (label !== actLabel){                         // tulis semula hanya bila berubah, supaya ketikan tidak hilang
      actLabel = label;
      const act = $e('#escAct');
      act.innerHTML = label; act.style.display = label ? 'block' : 'none';
    }
  }
  function ambient(dt, now){
    // 4 cahaya sebenar diletak di lekapan terdekat pada tingkat pemain
    fixtures.forEach(f => {
      f.t += dt;
      const on = !f.dead && (f.t < 0 ? Math.random() < .25 : Math.random() > .015);
      f.v = on ? .85 + Math.random() * .15 : 0;
      f.tube.material.emissiveIntensity = f.v;
    });
    const nearFx = fixtures.filter(f => f.f === P.f).sort((a, b) => Math.hypot(a.x - P.x, a.z - P.z) - Math.hypot(b.x - P.x, b.z - P.z)).slice(0, pool.length);
    pool.forEach((l, i) => { const f = nearFx[i]; if (!f){ l.intensity = 0; return; } l.position.set(f.x, H - .25, f.z); l.intensity = 7 * f.v; });
    exitLight.intensity = P.f === 0 ? 5 + Math.sin(now / 300) * 1.5 : 0;
    fans.forEach(f => f.g.rotation.y += f.sp * dt);
    const gk = ghost.children.find(c => c.isPointLight); if (gk) gk.intensity = ghost.visible ? 2.5 : 0;
  }
  function frame(now){
    if (!alive) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!paused && !ended){ elapsed += dt; $e('#escTime').textContent = fmtSec(elapsed); update(dt, now); }
    ambient(dt, now);
    R.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

  'set-grp': d => { S.ui.setGrp = d.id; S.ui.setSec = ''; save(); renderTab(); window.scrollTo(0,0); },
  'set-sec': d => { S.ui.setSec = (S.ui.setSec === d.id) ? '' : d.id; save(); rerenderKeepScroll(); },
  'rp-save': () => { const v = parseFloat($('#cfgRp').value); S.config.rpPerScore = clamp(isNaN(v)?1:v, 0.1, 10); save(true); renderTab(); toast('Kadar RP: '+S.config.rpPerScore+' per skor'); },
  'tpc-save': () => { const v = parseFloat($('#cfgTpc').value); S.config.tpcRate = clamp(isNaN(v)?1:v, 0.1, 5); save(true); renderTab(); toast('Kadar TPC: '+S.config.tpcRate+' per skor'); },
  'cfg-save': () => {
    const b = parseInt($('#cfgBase').value,10), bo = parseInt($('#cfgBonus').value,10), sd = parseInt($('#cfgStreak').value,10);
    S.config.baseline = clamp(isNaN(b)?SC_MIN:b, SC_MIN, 0);
    S.config.attendBonus = clamp(isNaN(bo)?10:bo, 0, SC_MAX-SC_MIN);
    S.config.streakDays = clamp(isNaN(sd)?5:sd, 2, 30);
    save(true); renderTab(); toast('Tetapan disimpan.');
  },
  'fld-add': fldAdd, 'fld-edit': d=>fldEdit(d.id), 'fld-del': d=>fldDel(d.id),
  'fb-cfg': fbCfgForm, 'fb-rules': fbRules,
  'fb-pull': async () => {
    if (!FB.on) return;
    let remote = null;
    try { const s = await FB.mod.d.get(FB.mod.d.ref(FB.db,'ipbd/v12')); remote = s.exists()?s.val():null; } catch(e){}
    if (!remote) return toast('Tiada data dalam awan.', null, true);
    const ok = await confirmBox({ danger:true, title:'Tarik dari Awan', okText:'Ganti Data Peranti',
      message:'Data dalam peranti ini akan diganti sepenuhnya dengan data awan:<br><br>'+summarise(remote) });
    if (!ok) return;
    adoptRemote(remote); toast('Data awan dimuat turun.');
  },
  'fb-push': async () => {
    if (!FB.on) return;
    const ok = await confirmBox({ danger:true, title:'Hantar ke Awan', okText:'Ganti Data Awan',
      message:'Data dalam awan akan diganti sepenuhnya dengan data peranti ini:<br><br>'+summarise(S) });
    if (!ok) return;
    S.rev = Date.now(); save(true); toast('Data peranti dihantar ke awan.');
  },
  'exp-json': expJson, 'imp-json': impJson, 'rollover': rollover, 'wipe': wipeAll
};
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav){ setTab(nav.dataset.nav); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const fn = ACTS[a.dataset.act];
  if (fn) fn(a.dataset);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ctxClass'){ S.ui.activeClassId = t.value; selReset(); STU_Q = ''; REC_DATE = null; save(); renderAll(); autoSubject(); }
  if (t.id === 'ctxSubject'){ S.ui.activeSubjectId = t.value; REC_DATE = null; save(); renderAll(); }
  if (t.id === 'mtxClass'){ S.ui.mtxClass = t.value; save(); renderTab(); }
  if (t.id === 'qzSubj'){ S.ui.qzSubject = t.value; save(); closeTop(); quizManager(); }
  if (t.id === 'ttClass'){ S.ui.ttClass = t.value; save(); renderTab(); }
  if (t.id === 'ttSubject'){ S.ui.ttSubject = t.value; save(); renderTab(); }
  if (t.id === 'mtxSubject'){ S.ui.mtxSubject = t.value; save(); renderTab(); }

});
// TAHAN gambar pelajar (450ms) = masuk mod pilih ramai
let holdT = null, holdXY = null, holdFired = false;
document.addEventListener('pointerdown', e => {
  const av = e.target.closest('[data-hold]'); if (!av) return;
  holdFired = false; holdXY = [e.clientX, e.clientY];
  clearTimeout(holdT);
  holdT = setTimeout(() => { holdFired = true; holdT = null; SEL.on = true; selToggle(av.dataset.hold); }, 450);
});
document.addEventListener('pointermove', e => {
  if (holdT && holdXY && (Math.abs(e.clientX-holdXY[0]) > 10 || Math.abs(e.clientY-holdXY[1]) > 10)){ clearTimeout(holdT); holdT = null; }
});
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => { if (holdT){ clearTimeout(holdT); holdT = null; } }, true));
document.addEventListener('contextmenu', e => {
  const t = e.target;
  if (t.closest('input, textarea, [contenteditable], pre, .selectable')) return;   // benarkan salin dalam medan & kod
  e.preventDefault();
});
document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
document.addEventListener('selectstart', e => {
  if (e.target.closest && e.target.closest('input, textarea, [contenteditable], pre, .selectable')) return;
  e.preventDefault();
});
document.addEventListener('input', e => { if (e.target.id === 'stuSearch'){ STU_Q = e.target.value; applyStuFilter(); } });

// double-tap pada kad pelajar = nilai (mod biasa) · ketik = togol pilihan (mod pilih)
let lastTap = 0, lastId = '';
document.addEventListener('pointerup', e => {
  const card = e.target.closest('[data-stu]');
  if (!card || e.target.closest('[data-act]')) return;
  if (holdFired){ holdFired = false; return; }
  if (SEL.on){ selToggle(card.dataset.stu); return; }
  const now = Date.now();
  if (now - lastTap < 350 && lastId === card.dataset.stu) { openEval([card.dataset.stu], (stu(card.dataset.stu)||{}).name); lastTap = 0; }
  else { lastTap = now; lastId = card.dataset.stu; }
});

/* ============ PWA ============ */
/* Manifest dijana dalam fail ini (satu fail sahaja).
   start_url membawa penanda ?src=hs supaya app tahu ia dibuka dari skrin utama. */
function initPWA(){
  const base = location.origin + location.pathname;
  const manifest = {
    name: APP_NAME, short_name: APP_NAME, description: 'EduRank — dicipta oleh ' + APP_AUTHOR,
    start_url: base + '?src=hs', scope: location.origin + location.pathname.replace(/[^/]*$/, ''),
    display:'standalone', orientation:'portrait', background_color:'#0C1118', theme_color:'#0C1118',
    icons:[
      { src: APP_ICON, sizes:'192x192', type:'image/png', purpose:'any' },
      { src: APP_ICON, sizes:'512x512', type:'image/png', purpose:'any' }
    ]
  };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
  document.head.appendChild(l);
}

/* ============ SKRIN ARAHAN PEMASANGAN ============ */
function isInstalled(){
  const hs = new URLSearchParams(location.search).get('src') === 'hs';
  if (hs) try { sessionStorage.setItem('rk_hs','1'); } catch(e){}
  let flag = false; try { flag = sessionStorage.getItem('rk_hs') === '1'; } catch(e){}
  return hs || flag
    || ['standalone','fullscreen','minimal-ui'].some(m => window.matchMedia('(display-mode: '+m+')').matches)
    || window.navigator.standalone === true;
}
function installGate(){
  ['header','nav','#main'].forEach(sel => { const el = $(sel); if (el) el.style.display = 'none'; });
  const ua = navigator.userAgent;
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const step = (n, icon, text) =>
    '<div class="flex items-center gap-3 panel clip-s p-3 mb-2 text-left">' +
    '<div class="num text-orange text-[18px] w-5">'+n+'</div>' +
    '<i class="fa-solid '+icon+' text-cyan text-[18px] w-6 text-center"></i>' +
    '<div class="text-[13px] leading-snug flex-1">'+text+'</div></div>';
  const android =
    step(1,'fa-ellipsis-vertical','Tekan menu <b>⋮</b> di penjuru kanan atas Chrome') +
    step(2,'fa-mobile-screen-button','Pilih <b>Tambah ke skrin utama</b> atau <b>Pasang aplikasi</b>') +
    step(3,'fa-check','Tekan <b>Tambah / Pasang</b>, kemudian buka <b>EduRank</b> dari skrin utama');
  const iphone =
    step(1,'fa-arrow-up-from-bracket','Buka dalam <b>Safari</b>, tekan butang <b>Kongsi</b> di bar bawah') +
    step(2,'fa-square-plus','Pilih <b>Tambah ke Skrin Utama</b> (Add to Home Screen)') +
    step(3,'fa-check','Tekan <b>Tambah</b>, kemudian buka <b>EduRank</b> dari skrin utama');
  document.body.insertAdjacentHTML('beforeend',
    '<div id="gate" style="position:fixed;inset:0;z-index:1000;overflow-y:auto;display:flex;align-items:center;justify-content:center;' +
      'padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));background:radial-gradient(circle at 50% 25%,rgba(255,107,0,.14),transparent 60%),#0C1118">' +
      '<div class="w-full max-w-sm text-center">' +
        '<img src="'+APP_ICON+'" alt="EduRank" class="mx-auto" style="width:100px;height:100px;object-fit:contain;border-radius:24px;box-shadow:0 0 36px rgba(255,107,0,.35)" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="font-bold tracking-[.25em] text-[28px] glow-o mt-4">EDURANK</div>' +
        '<div class="text-[13px] text-muted mt-2 mb-5">Pasang EduRank ke skrin utama untuk mula menggunakan.</div>' +
        '<div class="lbl text-left mb-2">'+(ios ? 'IPHONE / IPAD' : 'ANDROID')+'</div>' +
        (ios ? iphone : android) +
        '<details class="mt-3 text-left"><summary class="text-[11px] text-muted">Arahan untuk '+(ios ? 'Android' : 'iPhone / iPad')+'</summary><div class="mt-2">'+(ios ? android : iphone)+'</div></details>' +
        '<div class="text-[10px] text-muted mt-8 tracking-widest">DICIPTA OLEH ARIF AZIZ</div>' +
      '</div></div>');
}

/* ============ INIT ============ */
(async function init(){
  // Mod paparan awam: ?s=... → showcase sahaja, tiada state tempatan, tiada Firebase SDK
  const vp = new URLSearchParams(location.search).get('s');
  if (vp){ S = blank(); viewerBoot(vp); return; }      // pautan showcase murid: tidak perlu pasang
  initPWA();
  if (!isInstalled()){ installGate(); return; }         // dalam pelayar: tutup app, papar arahan pasang sahaja
  IDB = await idbOpen();
  Object.assign(PHOTOS, await idbAll());
  S = load();
  /* Aset sprite / peta / kad muat naik lama dipadam daripada peranti, sekali sahaja. */
  S.subjects.filter(x => x.dskp).forEach(x => dskpLoad(x.dskp).then(() => renderTab()).catch(() => {}));
  dskpIndex().catch(() => {});
  purgeSpriteAssets().then(n => { if (n) console.info('Aset lama dibuang:', n); });
  if (S.ui.tab === 'arena' && !['escape','cards','run'].includes(arenaUi().game)) arenaUi().game = 'cards';
  bgmInit();
  hintInit();
  if (!S.ui.mtxClass) S.ui.mtxClass = S.ui.activeClassId || '';
  if (!S.ui.mtxSubject) S.ui.mtxSubject = S.ui.activeSubjectId || '';
  $$('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.nav === S.ui.tab));
  renderAll();
  setTimeout(autoSubject, 400);
  fbInit();
  window.addEventListener('beforeunload', () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} });
  window.addEventListener('storage', e => {
    if (e.key !== LS_KEY || !e.newValue) return;
    try { const d = JSON.parse(e.newValue); if ((d.rev||0) > (S.rev||0)){ S = migrate(d); renderAll(); } } catch(err){}
  });
})();
