/* pilihan menu Duel Kad (disimpan per peranti) */
function duelLb(){ const o = arenaUi(); o.duelLb = Object.assign({ jenis: 'kuiz', lawan: 'ai', gaya: 'rebut', opp: '' }, o.duelLb || {}); return o.duelLb; }
function duelOpp(){
  const d = duelLb(), t = arenaUi().team, ok = classTeams().filter(g => g.id !== t);
  if (!ok.some(g => g.id === d.opp)) d.opp = ok.length ? ok[0].id : '';
  return d.opp;
}
/* ---------- lobi ---------- */
let LOBBY = null;
function gameLobby(k){
  const def = GAME_LOBBY[k]; if (!def) return;
  if (!classTeams().length) return toast('Cipta kumpulan dahulu di tab Kumpulan.', null, true);
  lbStyle();
  if (LOBBY) LOBBY.close();
  const o = arenaUi();
  if (!classTeams().some(g => g.id === o.team)) o.team = classTeams()[0].id;
  let view = 'main', ready = !def.preload, prog = 0;
  const el = document.createElement('div');
  el.className = 'lb'; el.style.setProperty('--c', def.c);
  const bg = def.bg && def.bg();
  if (bg){ el.classList.add('img'); el.style.backgroundImage = 'linear-gradient(rgba(5,8,15,.55),rgba(5,8,15,.85)),url(' + bg + ')'; }
  document.body.appendChild(el); lockBody();
  const loadHtml = () => def.preload ? '<div class="lb-load' + (ready ? ' ok' : '') + '" id="lbLoad"><div class="bar"><i style="width:' + Math.round(prog * 100) + '%"></i></div><span>' +
    (ready ? '✓ Sedia' : 'Memuatkan… ' + Math.round(prog * 100) + '%') + '</span></div>' : '';
  const head = () => {
    const logo = def.logo && def.logo();
    return '<div class="lb-ico">' + (logo ? '<img src="' + logo + '" alt="">' : def.ico) + '</div><div class="lb-t">' + def.title + '</div>';
  };
  function paint(){
    const t = teamOf(o.team);
    let h = '';
    if (view === 'main' && def.full){ h = def.main(); }
    else if (view === 'main'){
      h = head() + '<div class="lb-d">' + def.desc + '</div>' + loadHtml() + todayQNotice() + (def.main ? def.main() : '') +
        def.starts.map(([label], i) => '<button class="lb-btn go" data-lb="go' + i + '"' + (ready ? '' : ' disabled') + '>' + label + '</button>').join('') +
        (def.noTeam ? '' : '<button class="lb-btn" data-lb="team">👥 Pemain<span class="r">' + (t ? teamAvatar(t.id, 22) + '<span>' + esc(t.name) + '</span>' : '<span>pilih</span>') + ' ›</span></button>') +
        (def.menu || []).map(([v, label, r]) => '<button class="lb-btn" data-lb="' + v + '">' + label + '<span class="r">' + r + '</span></button>').join('') +
        '<button class="lb-btn" data-lb="set">⚙️ Tetapan<span class="r">tahap & masa ›</span></button>' +
        '<button class="lb-btn" data-lb="how">📖 Cara Main<span class="r">›</span></button>' +
        '<button class="lb-btn x" data-lb="exit">✕ Keluar</button>' + lvNote();
    } else if (view === 'team'){
      h = '<div class="lb-h"><button data-lb="back">‹</button>PILIH KUMPULAN</div><div class="lb-scroll">' + classTeams().map(g =>
        '<button class="lb-team' + (g.id === o.team ? ' on' : '') + '" data-lt="' + g.id + '">' + teamAvatar(g.id, 34) +
        '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px">' + esc(g.name) + '</div><div class="m">' + esc(teamMembersTxt(g.id)) + '</div></div>' +
        (g.id === o.team ? '<span style="color:var(--c);font-weight:800">✓</span>' : '') + '</button>').join('') + '</div>' +
        '<div class="lb-note" style="margin-top:10px">Markah game = <b>TP</b> untuk setiap ahli kumpulan yang dipilih.</div>';
    } else if (view === 'set'){
      const cfg = def.cfg();
      h = '<div class="lb-h"><button data-lb="back">‹</button>TETAPAN GURU</div><div class="lb-scroll">' + def.opts().map(op =>
        '<div class="lb-sec">' + op.label + '</div><div class="lb-seg">' + op.choices.map(([v, l]) =>
          '<button class="' + (String(cfg[op.k] == null && op.k === 'duelQ' ? duelQ() : cfg[op.k]) === String(v) ? 'on' : '') + '" data-ls="' + op.k + '" data-lv="' + v + '" data-ln="' + (typeof v === 'number' ? 1 : 0) + '">' + l + '</button>').join('') + '</div>' +
        (op.note ? '<div class="lb-note">' + op.note + '</div>' : '')).join('') +
        (def.extra ? def.extra() : '') +
        '<div class="lb-sec">TAYANG LANGSUNG KE PROJEKTOR</div>' + lvNote() + '</div>';
    } else if (def.views && def.views[view]){
      h = '<div class="lb-h"><button data-lb="back">‹</button>' + def.views[view].t + '</div><div class="lb-scroll">' + def.views[view].h() + '</div>';
    } else if (view === 'how'){
      h = '<div class="lb-h"><button data-lb="back">‹</button>CARA MAIN</div><div class="lb-how">' + def.how() + '</div>' +
        '<div class="lb-note" style="margin-top:12px"><i class="fa-solid fa-circle-question"></i> Soalan dari bank <b>' + esc(subjName(S.ui.activeSubjectId)) + '</b> (' + qBank(S.ui.activeSubjectId).length + ' soalan; jika kosong, soalan matematik dijana).</div>';
    }
    el.innerHTML = '<div class="lb-card' + (def.full && view === 'main' ? ' wide' : '') + '">' + h + '</div>';
  }
  const setProg = v => {
    prog = Math.max(prog, v);
    if (view === 'main'){ const b = el.querySelector('#lbLoad .bar i'), s = el.querySelector('#lbLoad span'); if (b){ b.style.width = Math.round(prog * 100) + '%'; s.textContent = 'Memuatkan… ' + Math.round(prog * 100) + '%'; } }
  };
  const close = () => { if (!el.isConnected) return; el.remove(); unlockBody(); if (LOBBY && LOBBY.el === el) LOBBY = null; };
  LOBBY = { el, close, k, repaint: () => { if (el.isConnected) paint(); } };
  const ctx = { paint: () => paint(), close: () => close(), setView: v => { view = v; paint(); } };
  el.addEventListener('click', e => {
    if (e.target.closest('[data-act]')) return;                    // butang app (pack, album, panduan) dikendali oleh app
    const b = e.target.closest('[data-lb],[data-lt],[data-ls]'); if (!b) return;
    sfx('flip');
    if (b.dataset.lt){ o.team = b.dataset.lt; save(); view = 'main'; paint(); if (S.ui.tab === 'arena') renderTab(); return; }
    if (b.dataset.ls){ const cfg = def.cfg(); cfg[b.dataset.ls] = b.dataset.ln === '1' ? +b.dataset.lv : b.dataset.lv; save(); paint(); return; }
    const a = b.dataset.lb;
    if (a === 'back'){ view = 'main'; return paint(); }
    if (def.views && def.views[a]){ view = a; return paint(); }
    if (def.act && def.act(a, b, ctx)) return;
    if (a === 'team' || a === 'set' || a === 'how'){ view = a; return paint(); }
    if (a === 'assets'){ close(); storProbe().then(storAssetsModal); return; }
    if (a === 'exit') return close();
    if (a.indexOf('go') === 0 && ready){
      if (!teamOf(o.team)) return toast('Pilih kumpulan dahulu.', null, true);
      const fn = def.starts[+a.slice(2)][1];
      close(); fn();                                   // dipanggil terus dalam sentuhan: AudioContext dibenarkan
    }
  });
  paint();
  audPreload({ cards:'duel', run:'run', escape:'esc', stor:'stor' }[k]);
  if (def.preload){
    const t0 = Date.now();
    def.preload(setProg).catch(err => { console.warn('pramuat', err); })
      .then(() => new Promise(r => setTimeout(r, Math.max(0, 600 - (Date.now() - t0)))))   // paparan "Memuatkan" sekurang-kurangnya sekejap
      .then(() => { if (!el.isConnected) return; ready = true; prog = 1; if (view === 'main') paint(); });
  }
}

const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const CARDS = CARD_DATA.map(([set, emo, name, tier, flavor, art], i) => {
  const t = tierOfCard(tier), h = hashStr(name);
  const v = n => 0.85 + ((h >>> n) & 255) / 255 * 0.3;          // variasi ±15% yang tetap untuk setiap kad
  return { id: 'k' + String(i + 1).padStart(2, '0'), set, emo, name, tier, flavor, art,
    atk: Math.round(t.atk * v(0)), hp: Math.round(t.hp * v(8)), def: Math.round(t.def * v(16)) };
});

}
function collectionStats(sid){

}

function pickWeighted(tbl){
  let tot = 0; Object.keys(tbl).forEach(k => tot += tbl[k]);
  let r = Math.random() * tot;
  for (const k of Object.keys(tbl)){ r -= tbl[k]; if (r <= 0) return k; }
  return Object.keys(tbl)[0];
}
const drawCard = tierK => { const l = cardsOfTier(tierK); return l[Math.floor(Math.random() * l.length)]; };
function openPackRoll(pack, sid){
  S.pity = S.pity || {};
  let pity = S.pity[sid] || 0;
  const tiers = [];
  for (let i = 0; i < pack.base; i++) tiers.push(pickWeighted(BASE_ODDS));
  for (let i = 0; i < pack.rare; i++) tiers.push(pickWeighted(RARE_ODDS));
  for (let i = 0; i < pack.lucky; i++) tiers.push(pickWeighted(pack.luck));
  if (pack.grant && !tiers.some(t => tierRank(t) >= tierRank(pack.grant))) tiers[tiers.length - 1] = pack.grant;
  pity++;                                        // 25 pack tanpa Legenda+ → jamin Legenda
  if (pity > PITY_MAX && !tiers.some(t => tierRank(t) >= tierRank('legenda'))) tiers[tiers.length - 1] = 'legenda';
  if (tiers.some(t => tierRank(t) >= tierRank('legenda'))) pity = 0;
  S.pity[sid] = pity;
  for (let i = tiers.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const tmp = tiers[i]; tiers[i] = tiers[j]; tiers[j] = tmp; }
  return tiers.map(t => ({ tier: t, card: drawCard(t) })).filter(x => x.card);
}

/* ---------- TANGGA ILMON: kombo menaik ----------
   Tunggal (nombor sama: 🌿 kalahkan 💧, 🔥 kalahkan 🌿, ⚡ kalahkan 🔥, 💧 kalahkan ⚡) · Pasangan · Trio · Trio + Pasangan (5 kad)
   Turutan 5 kad (nombor berturut) · Turutan Elemen (semua elemen sama — menang mana-mana turutan biasa yang sama panjang)
   5 kad: Turutan biasa < Trio + Pasangan < 💣 Turutan Elemen 5 < 👑 Tangga Diraja (1–2–3–4–5 elemen sama, paling kuat)
   💣 BOM: 4 nombor sama, atau Turutan Elemen 5 kad — memecahkan apa-apa kombo. Lawan = jenis & bilangan kad sama, nilai lebih tinggi. */
const TG_NEXT = { air: 'alam', alam: 'api', api: 'kilat', kilat: 'air' };   // elemen yang mengalahkan (Tunggal nombor sama)
function tgEval(cards){
  const n = cards.length; if (!n || n > 5) return null;
  const nums = cards.map(cardNum).sort((a, b) => a - b), same = nums.every(x => x === nums[0]);
  const els = cards.map(c => cardSet(c).el), oneEl = els.every(e => e === els[0]);
  if (same){
    if (n === 1) return { t: 'tunggal', len: 1, r: nums[0], e: els[0], name: 'Tunggal ' + nums[0] + elemOf(els[0]).ico };
    if (n === 2) return { t: 'pasangan', len: 2, r: nums[0], name: 'Pasangan ' + nums[0] };
    if (n === 3) return { t: 'trio', len: 3, r: nums[0], name: 'Trio ' + nums[0] };
    if (n === 4) return { t: 'bom', len: 4, r: nums[0], bomb: 1, name: '💣 BOM ' + nums[0] + ' ×4' };
    return null;
  }
  if (n === 5){                                          // Trio + Pasangan
    const cnt = {}; nums.forEach(x => cnt[x] = (cnt[x] || 0) + 1); const k = Object.keys(cnt);
    if (k.length === 2 && Object.values(cnt).sort().join() === '2,3'){ const t = +k.find(x => cnt[x] === 3), p = +k.find(x => cnt[x] === 2);
      return { t: 'penuh', len: 5, r: t, name: 'Trio ' + t + ' + Pasangan ' + p }; }
  }
  if (n === 5 && nums.every((x, i) => !i || x === nums[i - 1] + 1)){      // turutan mesti 5 kad
    const lo = nums[0], hi = nums[n - 1];
    if (n === 5 && oneEl) return lo === 1 ? { t: 'bom', len: 5, r: hi, bomb: 3, el: true, name: '👑 TANGGA DIRAJA 1–5' } :   // kombo paling kuat
      { t: 'bom', len: 5, r: hi, bomb: 2, el: true, name: '💣 BOM Turutan Elemen ' + lo + '–' + hi };
    return { t: 'turutan', len: n, r: hi + (oneEl ? 100 : 0), el: oneEl, name: (oneEl ? 'Turutan Elemen ' : 'Turutan ') + lo + '–' + hi };
  }
  return null;
}
const tgBeats = (a, b) => !a ? false : !b ? true : a.bomb ? (!b.bomb || a.bomb > b.bomb || (a.bomb === b.bomb && a.r > b.r)) :
  (!b.bomb && ((a.t === 'penuh' && b.t === 'turutan' && b.len === 5 && !b.el) ||        // Trio + Pasangan kalahkan Turutan 5 biasa
    (a.t === b.t && a.len === b.len && (a.r > b.r || (a.t === 'tunggal' && a.r === b.r && TG_NEXT[b.e] === a.e)))));
const TG_T = { pasangan: 'Pasangan', trio: 'Trio' };
const tgNeed = b => !b ? 'Buka meja: letak apa-apa kombo' : b.bomb === 3 ? '👑 Tangga Diraja tidak boleh dikalahkan — LEPAS' : b.bomb ? 'Hanya 💣 BOM lebih kuat boleh lawan' :
  b.t === 'tunggal' ? 'Perlu Tunggal > ' + b.r + ', atau ' + b.r + elemOf(TG_NEXT[b.e]).ico + ' — atau 💣 BOM' :
  b.t === 'penuh' ? 'Perlu Trio + Pasangan dengan trio > ' + b.r + ' — atau 💣 BOM' :
  'Perlu ' + (TG_T[b.t] || 'Turutan ' + b.len + ' kad' + (b.el ? ' elemen sama' : '')) + ' lebih tinggi daripada ' + (b.r % 100) + (b.t === 'turutan' && !b.el ? ' (atau Turutan Elemen ' + b.len + ' kad' + (b.len === 5 ? ', atau Trio + Pasangan' : '') + ')' : '') + ' — atau 💣 BOM';
/* semakan kad di Zon Kombo: { ok, label, bomb } */
function tgCheck(cards, top, turn){
  const ev = cards.length ? tgEval(cards) : null;
  if (!ev) return { ok: false, label: '✘ Bukan kombo' };
  const ok = tgBeats(ev, top);
  return { ok, ev, bomb: !!ev.bomb, label: ok ? '✔ ' + ev.name + (turn ? ' — lempar ke meja ⬆' : ' (tunggu giliran)') : '✘ ' + ev.name + ' — ' + tgNeed(top) };
}
const tgSort = hand => hand.slice().sort((a, b) => cardNum(a) - cardNum(b) || cardSet(a).el.localeCompare(cardSet(b).el));
/* semua kombo yang boleh dibina dari tangan */
function tgCands(hand){
  const out = [], by = {};
  hand.forEach(c => (by[cardNum(c)] = by[cardNum(c)] || []).push(c));
  hand.forEach(c => out.push([c]));
  Object.values(by).forEach(l => { for (let k = 2; k <= Math.min(4, l.length); k++) out.push(l.slice(0, k)); });
  Object.values(by).filter(l => l.length >= 3).forEach(t => Object.values(by).filter(l => l !== t && l.length >= 2).forEach(p => out.push(t.slice(0, 3).concat(p.slice(0, 2)))));   // trio + pasangan
  for (let L = 5, s = 1; s + L - 1 <= 12; s++){

    if (seq.length < L) continue;

/* robot: buka dengan kombo rendah yang membuang banyak kad; lawan dengan kombo terkecil yang menang;

function tgAI(hand, top, danger, smart){
  const all = tgCands(hand), by = {};
  hand.forEach(c => by[cardNum(c)] = (by[cardNum(c)] || 0) + 1);
  const breaks = x => x.ev.t === 'tunggal' && by[cardNum(x.cs[0])] > 1 ? 4 : x.ev.t === 'pasangan' && by[cardNum(x.cs[0])] > 2 ? 3 : 0;   // elak pecahkan pasangan / trio
  if (!top){
    const l = all.filter(x => !x.ev.bomb || x.cs.length === hand.length)
      .map(x => ({ x, c: (x.ev.r % 100) - x.cs.length * 2.4 + breaks(x) * smart + (Math.random() - .5) * 6 * (1 - smart) }))
      .sort((a, b) => a.c - b.c);
    return l.length ? l[0].x : all[0] || null;
  }
  const ok = all.filter(x => tgBeats(x.ev, top));
  const nb = ok.filter(x => !x.ev.bomb).map(x => ({ x, c: (x.ev.r % 100) + breaks(x) * smart * 2 })).sort((a, b) => a.c - b.c);
  if (nb.length){
    const hiTop = (top.r % 100) >= 10 && !danger && smart > .5 && hand.length > 5;   // biar meja tinggi berlalu, simpan kad kuat
    if (hiTop && Math.random() < .5) return null;
    if (Math.random() < .12 * (1 - smart)) return null;
    return nb[0].x;
  }
  const bm = ok.filter(x => x.ev.bomb).sort((a, b) => a.ev.bomb - b.ev.bomb || a.ev.r - b.ev.r);
  if (bm.length && (danger || hand.length <= bm[0].cs.length + 2)) return bm[0];
  return null;
}

function kmSeats(K, all){
  const S4 = K.seats = (K.seats || []).slice(0, 4), used = [];

    const t = S4[i] = S4[i] || { id: '', bot: false };

    used.push(t.id);
  }

}

/* seats: [{ id, bot }] 4 tempat · opt: { multi (peranti ini = papan projektor, setiap kumpulan sertai dengan kod 4 angka), lvl } */
async function komboStart(seats, opt){
  opt = opt || {};
  orientFree();
  seats = (seats || []).filter(t => t && teamOf(t.id)).slice(0, 4);
  if (seats.length < 2) return toast('Perlu sekurang-kurangnya 2 kumpulan.', null, true);
  toast('Menyusun kad…');
  await kadProbe();
  let net = null;
  if (opt.multi){                                        // bilik berbilang peranti: kod 4 digit
    const code = String(1000 + Math.floor(Math.random() * 9000));
    const T = await kmNet(code); if (!T) return toast('Berbilang peranti perlukan Firebase (Tetapan → Penyegerakan Firebase).', null, true);
    net = { T, code, hostSeat: -1 };
  }
  komboRun(seats.map(t => t.id), { seats: seats.map(t => ({ id: t.id, bot: !!t.bot })), lvl: opt.lvl }, net);
}
/* Saluran bilik Kombo: Firebase (ipbd_share/__kombo_<kod>) — atau BroadcastChannel (tab pada peranti sama, untuk ujian).
   cfg = konfigurasi Firebase dari pautan sertai (telefon murid tanpa tetapan). */
const KM_APP = {};
async function kmNet(code, cfg){
  let d = null, db = null;
  if (FB.on && FB.mod.d){ d = FB.mod.d; db = FB.db; }
  else if (cfg && cfg.databaseURL){
    try {
      if (!KM_APP.db){
        const [a, dd, au] = await Promise.all([import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js'), import('https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js'), import('https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js')]);
        const app = a.initializeApp(cfg, 'kombo'); await au.signInAnonymously(au.getAuth(app));
        KM_APP.d = dd; KM_APP.db = dd.getDatabase(app);
      }
      d = KM_APP.d; db = KM_APP.db;
    } catch(e){ console.warn('kombo firebase', e); }
  }
  if (d){
    const ref = k => d.ref(db, 'ipbd_share/__kombo_' + code + '/' + k);
    return { kind: 'fb', set: (k, v) => { try { d.set(ref(k), v === undefined ? null : v).catch(() => {}); } catch(e){} }, on: (k, cb) => d.onValue(ref(k), sn => cb(sn.val())) };
  }
  if (!('BroadcastChannel' in window)) return null;
  const ch = new BroadcastChannel('edurank-kombo-' + code), subs = {}, last = {};
  ch.onmessage = e => { last[e.data.k] = e.data.v; (subs[e.data.k] || []).slice().forEach(cb => cb(e.data.v)); };
  return { kind: 'bc', set: (k, v) => { last[k] = v; ch.postMessage({ k, v }); },
    on: (k, cb) => { (subs[k] = subs[k] || []).push(cb); if (k in last) cb(last[k]); return () => { subs[k] = (subs[k] || []).filter(f => f !== cb); }; } };
}

function kmPilesHtml(piles, lastI, newI){

  const set = p => { if (p === open) return; if (open){ open.classList.remove('open'); open.style.transform = ''; } open = p;

function tgPick(root, api){

      d.mode = d.src === 'hand' && Math.abs(dy) < Math.abs(dx) * .5 ? 'sort' : 'lift';   // mendatar = susun; naik / menyerong = angkat ke zon
      if (d.mode === 'lift') lift(); else d.im.classList.add('drag');

    const sibs = [...hand.querySelectorAll('img[data-id]')].filter(x => x !== d.im);
    const after = sibs.find(x => { const r = x.getBoundingClientRect(); return e.clientX < r.left + r.width / 2; });
    const before = d.im.getBoundingClientRect();
    if (after && after.previousElementSibling !== d.im) hand.insertBefore(d.im, after);
    else if (!after && hand.lastElementChild !== d.im) hand.appendChild(d.im);

/* Tangan: ketik = pilih/nyahpilih; seret mendatar = susun semula kad (susunan disimpan) */
function kmHandWire(box, api){
  let d = null;
  box.addEventListener('pointerdown', e => {
    const im = e.target.closest('img[data-id]'); if (!im || !api.can()) return;
    d = { im, x: e.clientX, y: e.clientY, on: false };
    try { box.setPointerCapture(e.pointerId); } catch(er){}
  });
  box.addEventListener('pointermove', e => {
    if (!d) return;
    const dx = e.clientX - d.x;
    if (!d.on){ if (Math.abs(dx) < 10) return; d.on = true; d.im.classList.add('drag'); }
    d.im.style.transform = 'translateX(' + dx + 'px) translateY(-2cqh)';
    const sibs = [...box.querySelectorAll('img[data-id]')].filter(x => x !== d.im);
    const after = sibs.find(x => { const r = x.getBoundingClientRect(); return e.clientX < r.left + r.width / 2; });
    const before = d.im.getBoundingClientRect();
    if (after && after.previousElementSibling !== d.im) box.insertBefore(d.im, after);
    else if (!after && box.lastElementChild !== d.im) box.appendChild(d.im);
    const now = d.im.getBoundingClientRect();
    if (now.left !== before.left){ d.x += now.left - before.left; d.im.style.transform = 'translateX(' + (e.clientX - d.x) + 'px) translateY(-2cqh)'; }
  });
  const end = () => {
    if (!d) return; const x = d; d = null;
    if (!x.on) return api.tap(x.im.dataset.id);
    x.im.classList.remove('drag'); x.im.style.transform = '';
    api.order([...box.querySelectorAll('img[data-id]')].map(i => i.dataset.id));
  };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
}

function kmQuiz(stage, html, pick, secs){
  stage.querySelectorAll('.km-qz').forEach(x => x.remove());
  const ov = document.createElement('div'); ov.className = 'km-qz'; ov.innerHTML = html; stage.appendChild(ov);
  void ov.offsetHeight;
  let done = false; const t0 = Date.now();
  const hit = (x, y) => [...ov.querySelectorAll('[data-ans]')].find(b => { const r = b.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
  const go = b => {
    if (done || !b) return; done = true; b.classList.add('on'); const ms = Date.now() - t0;
    setTimeout(() => { ov.remove(); void stage.offsetHeight; pick(+b.dataset.ans, ms); }, 150);
  };
  ov.addEventListener('pointerdown', e => go(e.target.closest && e.target.closest('[data-ans]') || hit(e.clientX, e.clientY)));
  ov.addEventListener('touchstart', e => { const t = e.changedTouches[0]; if (t) go(hit(t.clientX, t.clientY)); }, { passive: true });
  ov.addEventListener('click', e => go(e.target.closest && e.target.closest('[data-ans]') || hit(e.clientX, e.clientY)));

    const pn = ov.querySelector('.pn'), bar = document.createElement('div'); bar.className = 'km-qt'; bar.innerHTML = '<i></i><b>' + secs + '</b>'; if (pn) pn.prepend(bar);
    const tick = setInterval(() => {
      if (done || !ov.isConnected){ clearInterval(tick); return; }
      const left = Math.max(0, secs - (Date.now() - t0) / 1000);
      bar.firstChild.style.width = (left / secs * 100) + '%'; bar.lastChild.textContent = Math.ceil(left); bar.classList.toggle('lo', left <= 10);
      if (left <= 0){ clearInterval(tick); done = true; ov.remove(); pick(-1, secs * 1000); }
    }, 200);
  }

}

    if (!starUsed && p.stars >= 2 && p.hand.length > 2){            // buang kad tunggal paling lemah yang tidak membentuk kombo

      const lone = p.hand.filter(c => p.hand.filter(x => cardNum(x) === cardNum(c)).length === 1).sort((a, b) => cardNum(a) - cardNum(b))[0];
      if (lone && cardNum(lone) <= 4) starAct('tukar', lone);
    }
    const x = tgAI(p.hand, top(), danger, LV[1]);

  if (!code) return;
  const c = String(code).replace(/\D/g, '').slice(0, 4);
  if (c.length !== 4) return toast('Kod bilik ialah 4 digit.', null, true);
  const T = await kmNet(c); if (!T) return toast('Sertai perlukan Firebase (Tetapan → Penyegerakan Firebase) dengan tetapan sama seperti peranti hos.', null, true);

    let done = false; const offs = []; const fin = k => { if (done) return; done = true; offs.forEach(o => { try { o && o(); } catch(e){} }); res(k); };

/* ---------- DUEL KAD ----------
   3 kad terkuat pelajar lawan 3 kad Penjaga Ilmuria (kekuatan setara).
   Setiap pusingan satu soalan: betul = kad kamu menyerang (pantas = kritikal),
   salah / tamat masa = kad lawan menyerang. Elemen yang menang ×1.5.     */
const duelQ = () => clamp(+((S.config || {}).duelQ) || 15, 5, 90);      // masa menjawab (saat), dilaras guru
function duelDeck(sid){
  const own = (S.collect || {})[sid] || {};
  const power = c => { const x = cardStats(c, cardLevel(sid, c.id)); return x.atk * 2 + x.hp / 3 + x.def * 2; };
  return CARDS.filter(c => own[c.id]).sort((a, b) => power(b) - power(a)).slice(0, 3)
    .map(c => Object.assign({ c, lv: cardLevel(sid, c.id) }, cardStats(c, cardLevel(sid, c.id))));
}
function duelFoe(mine){
  const avg = mine.reduce((a, x) => a + tierRank(x.c.tier), 0) / mine.length;
  return mine.map(() => {
    const tr = clamp(Math.round(avg + (Math.random() - .5) * 1.2), 0, CARD_TIERS.length - 1);
    const c = drawCard(CARD_TIERS[tr].k), lv = clamp(Math.round(mine.reduce((a, x) => a + x.lv, 0) / mine.length), 1, 5);
    return Object.assign({ c, lv }, cardStats(c, lv));
  });
}
/* ---------- DUEL KAD: 2 PEMAIN, 1 PERANTI ----------
   REBUT  : skrin dibahagi dua, murid duduk bertentang (separuh atas diterbalikkan).
            Soalan sama untuk kedua-dua. Jawapan BETUL pertama = kad dia menyerang
            (pantas = kritikal). Jawapan salah = dikunci untuk soalan itu.
   BERGILIR: telefon diserah bergilir. Betul = kad sendiri menyerang,
            salah / masa tamat = kad lawan menyerang (seperti lawan komputer).
   Murid tanpa kad diberi 3 "kad latihan" (tier Sial) supaya semua boleh bermain. */
/* dek mod Klasik: n kad terkuat kumpulan, dicukupkan dengan kad latihan */
function klasikDeck(sid, n){
  const own = (S.collect || {})[sid] || {};
  const pow = c => { const x = cardStats(c, cardLevel(sid, c.id)); return x.atk * 2 + x.hp / 3 + x.def * 2; };
  const mine = CARDS.filter(c => own[c.id]).sort((a, b) => pow(b) - pow(a)).slice(0, n).map(c => Object.assign({ c, lv: cardLevel(sid, c.id) }, cardStats(c, cardLevel(sid, c.id))));
  const fill = cardsOfTier('sial').filter(c => !mine.some(m => m.c.id === c.id)).sort(() => Math.random() - .5).slice(0, n - mine.length).map(c => Object.assign({ c, lv: 1 }, cardStats(c, 1)));
  return { deck: mine.concat(fill), starter: fill.length > 0 };
}
function pvpDeck(sid){
  const d = duelDeck(sid);
  if (d.length) return { deck: d, starter: false };
  const pool = cardsOfTier('sial').slice().sort(() => Math.random() - .5).slice(0, 3);
  return { deck: pool.map(c => Object.assign({ c, lv: 1 }, cardStats(c, 1))), starter: true };
}

`;
function btStyle(){ if (!document.getElementById('btCss')){ const st = document.createElement('style'); st.id = 'btCss'; st.textContent = BT_CSS; document.head.appendChild(st); } }

/* tA = id kumpulan bawah (biru). tB = id kumpulan atas (merah), atau null = Penjaga Ilmuria (komputer). */
function battleRun(tA, tB, mode){
  btStyle();
  const ai = !tB, klasik = mode === 'klasik';
  const dA = klasik ? klasikDeck(tA, 4) : pvpDeck(tA), dB = ai ? { deck: duelFoe(dA.deck), starter: false } : klasik ? klasikDeck(tB, 4) : pvpDeck(tB);
  const P = [
    { id: tA, name: teamName(tA), deck: dA.deck, starter: dA.starter, i: 0, ko: [], right: 0, asked: 0, col: '#3B82F6' },
    { id: tB, name: ai ? 'Penjaga Ilmuria' : teamName(tB), deck: dB.deck, starter: dB.starter, i: 0, ko: [], right: 0, asked: 0, col: '#EF4444' }
  ];
  P.forEach(p => p.deck.forEach(x => x.cur = x.hp));
  const rebut = mode === 'rebut';
  let turn = 0, over = false, round = 0, raf = 0, cur = null;
  const energy = [0, 0], shield = [false, false];               // mod Klasik
  let swMode = false, switched = false, busy = klasik;
  const root = document.createElement('div');
  root.className = 'bt' + (rebut ? ' rb' : ''); root.id = 'btRoot';
  root.innerHTML = (rebut ? '<div class="bt-q top" id="btQ1"></div>' : '') +
    '<div class="bt-board" id="btBoard">' +
      '<div class="bt-half t" id="btH1"></div><div class="bt-half b" id="btH0"></div>' +
      '<div class="bt-ring"></div><div class="bt-arena"><div class="bt-glow" id="btGlow"></div><div class="bt-rays" id="btRays"></div></div>' +
      '<div id="btS1"></div><div id="btS0"></div>' +
      '<div class="bt-score" id="btScore"></div>' +
      '<button class="bt-x" data-x="quit"><i class="fa-solid fa-xmark"></i></button>' +
      '<div class="bt-banner" id="btBanner"></div>' +
    '</div>' +
    '<div class="bt-q" id="btQ0"></div>';
  document.body.appendChild(root); lockBody();
  const live = liveHost('duel', root, { title: (klasik ? 'Duel Klasik' : 'Duel Kad') + (ai ? '' : ' · Kumpulan') });
  const $b = s => root.querySelector(s);
  const act = p => p.deck[Math.min(p.i, p.deck.length - 1)];
  const alive = p => p.deck.filter(x => x.cur > 0).length;
  const hpCol = x => x.cur / x.hp > .5 ? '#4ADE80' : x.cur / x.hp > .25 ? '#FACC15' : '#EF4444';
  const advOf = (ax, dx) => elemBeats(cardSet(ax.c).el, cardSet(dx.c).el) ? 1.5 : elemBeats(cardSet(dx.c).el, cardSet(ax.c).el) ? 0.75 : 1;
  const teamIco = p => p.id ? teamAvatar(p.id, 26) : '<div class="circ flex items-center justify-center" style="width:26px;height:26px;background:#111;border:2px solid #EF4444">🤖</div>';

  /* ---------- lukis satu pihak ---------- */
  function side(k){
    const p = P[k], x = act(p);
    const bench = p.deck.map((y, j) => { if (j === p.i || y.cur <= 0) return '';
      const pick = klasik && swMode && k === turn && !busy;
      return '<div class="bt-mini' + (pick ? ' pick' : '') + '" data-ck="' + k + '-' + j + '"' + (pick ? ' data-sw="' + k + ':' + j + '"' : '') + '>' + cardFaceHtml(y.c, y.c.tier) +
      '<div class="mhp"><i style="width:' + Math.max(0, y.cur / y.hp * 100) + '%;background:' + hpCol(y) + '"></i></div></div>'; }).join('');
    const kos = p.ko.length ? cardFaceHtml(p.ko[p.ko.length - 1].c, p.ko[p.ko.length - 1].c.tier) : '';
    return '<div class="bt-row s' + k + '">' + bench + '</div>' +
      '<div class="bt-pile dk s' + k + '"><div class="lb">DEK</div><div class="bk" style="transform:translate(3px,-3px)"></div><div class="bk" style="transform:translate(1.5px,-1.5px)"></div><div class="bk"></div><div class="n">' + alive(p) + '</div></div>' +
      '<div class="bt-pile ko s' + k + '"><div class="lb">KO</div>' + (kos ? '<div class="bt-mini ko" style="height:100%" data-ck="' + k + '-' + p.deck.indexOf(p.ko[p.ko.length - 1]) + '">' + kos + '</div>' : '<div style="position:absolute;inset:0;border:2px dashed rgba(255,255,255,.3);border-radius:4px"></div>') + '<div class="n">' + p.ko.length + '</div></div>' +
      '<div class="bt-name s' + k + '">' + teamIco(p) + '<span>' + esc(p.name) + (p.starter ? ' · kad latihan' : '') + '</span></div>' +
      '<div class="bt-card bt-act s' + k + (shield[k] ? ' bt-shield' : '') + '" id="btA' + k + '" data-ck="' + k + '-' + p.i + '">' + cardFaceHtml(x.c, x.c.tier, { lv: x.lv }) + (shield[k] ? '<div class="bt-sh">🛡</div>' : '') +
                '<div class="bt-hp"><small>HP</small>' + Math.max(0, x.cur) + '</div>' +
        '<div class="bt-hpbar"><i style="width:' + Math.max(0, x.cur / x.hp * 100) + '%;background:' + hpCol(x) + '"></i></div></div>';
  }
  /* kad "terbang": ukur kedudukan setiap kad (data-ck) sebelum dilukis semula, kemudian animasikan dari
     kedudukan lama ke kedudukan baharu — tukar kad, kad KO ke longgokan, kad bangku masuk gelanggang */
  const flipFrom = (el, o, delay) => {
    const n = el.getBoundingClientRect(); if (!n.width || !o) return false;
    const dx = o.left - n.left, dy = o.top - n.top, sx = o.width / n.width, sy = o.height / n.height;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2 && Math.abs(sx - 1) < .03) return false;
    el.style.transition = 'none'; el.style.transformOrigin = '0 0'; el.style.zIndex = 9;
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
    void el.offsetWidth;
    el.style.transition = 'transform .6s cubic-bezier(.3,.9,.3,1) ' + (delay || 0) + 'ms';
    el.style.transform = '';
    setTimeout(() => { el.style.transition = el.style.zIndex = el.style.transformOrigin = ''; }, 650 + (delay || 0));
    return true;
  };
  let dealt = false;
  function paintBoard(enter){
    const before = {};
    root.querySelectorAll('[data-ck]').forEach(el => before[el.dataset.ck] = el.getBoundingClientRect());
    $b('#btS0').innerHTML = side(0); $b('#btS1').innerHTML = side(1);
    $b('#btScore').innerHTML = '<div class="r">' + alive(P[1]) + '<small>KAD</small></div><div class="b">' + alive(P[0]) + '<small>KAD</small></div>';
    $b('#btH0').classList.toggle('turn', !over && !rebut && turn === 0 && (klasik || !!cur));
    $b('#btH1').classList.toggle('turn', !over && !rebut && turn === 1 && (klasik || !!cur));
    if (!dealt){                                            // edaran awal: setiap kad terbang dari dek
      dealt = true;
      root.querySelectorAll('[data-ck]').forEach((el, i) => {
        const pile = $b('.bt-pile.dk.s' + el.dataset.ck[0]);
        if (pile) flipFrom(el, pile.getBoundingClientRect(), 120 + i * 110);
      });
      setTimeout(() => audPlay('kad_koyak'), 150);
      return;
    }
    let moved = new Set();
    root.querySelectorAll('[data-ck]').forEach(el => { if (flipFrom(el, before[el.dataset.ck])) moved.add(el.dataset.ck); });
    if (enter !== undefined){ const a = $b('#btA' + enter); if (a && !moved.has(a.dataset.ck)){ a.style.setProperty('--from', enter ? '-14cqh' : '14cqh'); a.classList.add('bt-enter'); } }
  }
  const banner = (t, c, ms) => { const b = $b('#btBanner'); b.innerHTML = t; b.style.color = c || '#fff'; b.style.opacity = 1; clearTimeout(banner.t); banner.t = setTimeout(() => b.style.opacity = 0, ms || 1300); };

  /* ---------- panel soalan ---------- */
  function qPanel(k){
    const box = $b('#btQ' + k); if (!box) return;
    const p = P[k], mine = rebut || (!ai && turn === k) || (ai && k === 0);
    box.style.setProperty('--qc', p.col);
    if (!cur || !mine){
      box.className = 'bt-q idle' + (k === 1 ? ' top' : '');
      box.innerHTML = '<div class="qt">' + (over ? '' : cur ? 'Giliran ' + esc(P[turn].name) + '…' : 'Bersedia…') + '</div>';

    }
    const locked = cur.locked[k], el = elemOf(cardSet(act(p).c).el);
    box.className = 'bt-q' + (k === 1 ? ' top' : '');
    box.innerHTML = '<div class="who">' + teamIco(p) + '<span>' + esc(p.name).toUpperCase() + ' · PILIH SERANGAN</span><span style="margin-left:auto" class="num">PUSINGAN ' + round + '</span></div>' +
      '<div class="bar"><i id="btBar' + k + '"></i></div>' +
      '<div class="qt">' + esc(cur.q.q) + '</div>' +
      '<div class="mv">' + cur.order.map((i, j) => '<button data-a="' + k + ':' + i + '"' + (locked ? ' class="locked" disabled' : '') + '><b>' + String.fromCharCode(65 + j) + '</b><span>' + esc(cur.q.c[i]) + '</span>' +
        '<span style="margin-left:auto;opacity:.6">' + el.ico + '</span></button>').join('') + '</div>' +
      (locked ? '<div class="msg">Salah — tunggu lawan…</div>' : '');
  }
  const paintQ = () => { if (klasik) return kPanel(); qPanel(0); qPanel(1); };

  /* ---------- serangan ---------- */
  function strike(k, opt){
    const o = typeof opt === 'object' && opt ? opt : { mult: opt ? 1.4 : 1, crit: !!opt }, fast = !!o.crit;
    const a = P[k], d = P[1 - k], ax = act(a), dx = act(d);
    const adv = advOf(ax, dx);
    let dmg = Math.max(3, Math.round(ax.atk * o.mult * (0.9 + Math.random() * 0.2) * adv - dx.def * 0.6));
    // Mod Kuiz: setiap jawapan betul membuang sekurang-kurangnya ~30% HP (kritikal/elemen lebih), jadi satu kad tumbang dalam 3–4 jawapan
    if (!klasik) dmg = Math.max(dmg, Math.round(dx.hp * .3 * o.mult * adv));
    const blocked = shield[1 - k];
    if (blocked){ dmg = Math.max(1, Math.round(dmg * .5)); shield[1 - k] = false; }
    const ko = dx.cur - dmg <= 0;
    const aEl = $b('#btA' + k), dEl = $b('#btA' + (1 - k));
    if (aEl) aEl.classList.add(k === 0 ? 'bt-lunge-up' : 'bt-lunge-dn');
    snd(fast ? 'duel_kritikal' : 'duel_serang', fast ? 'hi' : 'flip');
    setTimeout(() => {
      if (!root.isConnected) return;
      if (aEl) aEl.classList.remove('bt-lunge-up', 'bt-lunge-dn');
      $b('#btRays').classList.remove('on'); void $b('#btRays').offsetWidth; $b('#btRays').classList.add('on');
      $b('#btGlow').classList.remove('on'); void $b('#btGlow').offsetWidth; $b('#btGlow').classList.add('on');
      dx.cur -= dmg;
      if (dEl){
        dEl.classList.add('bt-hit'); vibrate(30); audPlay('duel_kena');
        const hp = dEl.querySelector('.bt-hp'); if (hp) hp.innerHTML = '<small>HP</small>' + Math.max(0, dx.cur);
        const bar = dEl.querySelector('.bt-hpbar i'); if (bar){ bar.style.width = Math.max(0, dx.cur / dx.hp * 100) + '%'; bar.style.background = hpCol(dx); }
        const r = dEl.getBoundingClientRect(), br = $b('#btBoard').getBoundingClientRect();
        const n = document.createElement('div'); n.className = 'bt-dmg' + (fast ? ' crit' : '');
        n.textContent = '-' + dmg; n.style.left = ((r.left - br.left + r.width / 2) / br.width * 100) + '%'; n.style.top = ((r.top - br.top + r.height * .3) / br.height * 100) + '%';
        $b('#btBoard').appendChild(n); setTimeout(() => n.remove(), 1200);
      }
      if (dEl && blocked){ dEl.classList.remove('bt-shield'); const sh = dEl.querySelector('.bt-sh'); if (sh) sh.remove(); }
      banner((fast ? (o.label || '⚡ KRITIKAL!') + ' ' : '') + esc(ax.c.name) + (blocked ? ' · 🛡 DITAHAN' : '') + (adv > 1 ? ' · ELEMEN KUAT!' : adv < 1 ? ' · elemen lemah' : ''), fast ? '#FFE14D' : '#fff', 1200);
      if (dx.cur <= 0){
        setTimeout(() => {
          if (!root.isConnected) return;
          if (dEl) dEl.classList.add('bt-ko');
          banner(esc(dx.c.name) + ' — KO!', '#FCA5A5', 1200); snd('duel_ko', 'low');
          setTimeout(() => {
            if (!root.isConnected) return;
            d.ko.push(dx);
            const live2 = d.deck.map((y, j) => [y, j]).filter(([y]) => y.cur > 0);
            if (live2.length) d.i = (klasik && !d.id ? live2.sort((a2, b2) => b2[0].cur - a2[0].cur)[0] : live2[0])[1];   // komputer pilih kad paling sihat
            shield[1 - k] = false;
            paintBoard(alive(d) ? 1 - k : undefined);
          }, 700);
        }, 500);
      } else setTimeout(() => { if (dEl) dEl.classList.remove('bt-hit'); }, 460);
    }, 330);
    return { dmg, ko };
  }

  /* ---------- pusingan ---------- */
  function endRound(ms){                                  // tunggu animasi serangan/KO selesai
    cancelAnimationFrame(raf); cur = null; paintQ();
    setTimeout(() => {
      if (over || !root.isConnected) return;
      if (!alive(P[0]) || !alive(P[1])) return finish();
      if (!rebut && !ai) turn = 1 - turn;
      ask();
    }, ms || 2200);
  }
  function answer(k, pick){
    if (!cur || cur.done || over) return;
    const q = cur.q, ok = pick === q.a, fast = ok && (performance.now() - cur.t0) / 1000 < duelQ() * .4;
    P[k].asked++; if (ok) P[k].right++;
    if (P[k].id) teamQuiz(P[k].id, ok);
    if (rebut){
      if (ok){ cur.done = true; strike(k, fast); return endRound(); }
      cur.locked[k] = true; snd('ui_salah', 'low'); vibrate(30);
      if (cur.locked[0] && cur.locked[1]){ cur.done = true; banner('Kedua-dua salah! Jawapan: ' + esc(q.c[q.a]), '#FCA5A5', 2000); return endRound(); }
      banner(esc(P[k].name) + ' salah — ' + esc(P[1 - k].name) + ' boleh merebut!', '#FDE68A', 1600); paintQ(); return;
    }
    cur.done = true;
    if (ok) strike(k, fast);
    else { banner((pick === -1 ? 'Masa tamat! ' : 'Salah! ') + 'Jawapan: ' + esc(q.c[q.a]), '#FCA5A5', 1500); setTimeout(() => { if (root.isConnected) strike(1 - k, false); }, 900); return endRound(3100); }
    endRound();
  }
  function ask(){
    if (over) return;
    round++;
    const q = escQuestion();
    cur = { q, order: q.c.map((_, i) => i).sort(() => Math.random() - .5), t0: performance.now(), locked: [false, false], done: false };
    paintBoard(); paintQ();
    banner(rebut ? 'PUSINGAN ' + round + ' — SIAPA CEPAT?' : ai ? 'PUSINGAN ' + round : 'GILIRAN ' + esc(P[turn].name).toUpperCase(), '#fff', 1100);
    const tick = () => {
      if (!cur || cur.done || over) return;
      const QS = duelQ(), left = Math.max(0, QS - (performance.now() - cur.t0) / 1000);
      [0, 1].forEach(k => { const bar = $b('#btBar' + k); if (bar){ bar.style.width = (left / QS * 100) + '%'; bar.style.background = left > QS * .6 ? '#4ADE80' : left > QS * .27 ? '#FACC15' : '#EF4444'; } });
      if (left <= 0){
        if (rebut){ cur.done = true; banner('Masa tamat! Jawapan: ' + esc(cur.q.c[cur.q.a]), '#FCA5A5', 2000); return endRound(); }
        return answer(ai ? 0 : turn, -1);
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }

  /* ---------- MOD KLASIK (tanpa kuiz): tenaga, serang, jurus, bertahan, tukar kad ---------- */
  const COST = { serang: 1, jurus: 3, tahan: 1, tukar: 1 }, EMAX = 5;
  const humanTurn = () => klasik && !over && !busy && !(ai && turn === 1);
  function kPanel(){
    const box = $b('#btQ0'); if (!box) return;
    const p = P[turn]; box.style.setProperty('--qc', p.col);
    if (over){ box.className = 'bt-q idle'; box.innerHTML = '<div class="qt"></div>'; return; }
    if (ai && turn === 1){ box.className = 'bt-q idle'; box.innerHTML = '<div class="qt">🤖 Penjaga Ilmuria sedang berfikir…</div>'; return; }
    if (busy && round === 0){ box.className = 'bt-q idle'; box.innerHTML = '<div class="qt">Mengedarkan kad…</div>'; return; }
    const ax = act(p), dx = act(P[1 - turn]), adv = advOf(ax, dx), e = energy[turn], el = elemOf(cardSet(ax.c).el);
    const est = m => Math.max(3, Math.round(ax.atk * m * 1.3 * adv - dx.def * .6));
    const btn = (k, ico, t, sub, dis) => '<button data-k="' + k + '"' + (dis ? ' disabled class="locked"' : '') + '><b>' + ico + '</b><span>' + t + '<small>' + sub + '</small></span></button>';
    box.className = 'bt-q kl';
    box.innerHTML = '<div class="who">' + teamIco(p) + '<span>' + esc(p.name).toUpperCase() + ' · GILIRAN</span><span class="en">' +
        Array.from({ length: EMAX }, (_, i) => '<i class="' + (i < e ? 'on' : '') + '">⚡</i>').join('') + '</span></div>' +
      (swMode ? '<div class="qt">🔄 Ketik kad di bangku untuk masuk ke gelanggang</div><div class="mv one"><button data-k="batal"><b>✕</b><span>Batal</span></button></div>' :
      '<div class="mv">' +
        btn('serang', '⚔️', 'Serang · 1⚡', '≈' + est(1) + ' kerosakan' + (adv > 1 ? ' · elemen kuat' : adv < 1 ? ' · elemen lemah' : ''), e < 1 || busy) +
        btn('jurus', el.ico, 'Jurus ' + el.name + ' · 3⚡', '≈' + est(2.3 / 1.3) + ' kerosakan', e < 3 || busy) +
        btn('tahan', '🛡', 'Bertahan · 1⚡', shield[turn] ? 'perisai aktif' : 'separuh kerosakan seterusnya', e < 1 || shield[turn] || busy) +
        btn('tukar', '🔄', 'Tukar Kad · 1⚡', switched ? 'sudah ditukar giliran ini' : 'masukkan kad dari bangku', e < 1 || switched || alive(p) < 2 || busy) +
      '</div><div class="mv one"><button data-k="tamat"' + (busy ? ' disabled class="locked"' : '') + '><b>⏭</b><span>Tamat giliran (simpan tenaga)</span></button></div>');
  }
  function beginTurn(k){
    if (over) return;
    turn = k; round++; energy[k] = Math.min(EMAX, energy[k] + 1);
    switched = false; swMode = false; busy = false;
    paintBoard(); kPanel();
    banner(ai && k === 1 ? 'GILIRAN PENJAGA ILMURIA' : 'GILIRAN ' + esc(P[k].name).toUpperCase(), '#fff', 1000);
    if (ai && k === 1) setTimeout(aiTurn, 1300);
  }
  const endTurn = () => { if (over || !root.isConnected) return; if (!alive(P[0]) || !alive(P[1])) return finish(); beginTurn(1 - turn); };
  function doAttack(k, kind){
    if (energy[k] < COST[kind] || busy) return;
    energy[k] -= COST[kind]; busy = true; swMode = false; kPanel();
    const r = strike(k, kind === 'jurus' ? { mult: 2.3, crit: true, label: '💥 JURUS!' } : { mult: 1.3 });   // Klasik lebih pantas: sesuai masa kelas
    setTimeout(() => { busy = false; endTurn(); }, r.ko ? 2700 : 1500);
  }
  function doShield(k){
    if (energy[k] < COST.tahan || shield[k] || busy) return;
    energy[k] -= COST.tahan; shield[k] = true; snd('ui_betul', 'hi');
    banner('🛡 ' + esc(act(P[k]).c.name) + ' bersedia bertahan', '#7DD3FC', 1100); paintBoard(); kPanel();
  }
  function doSwitch(k, j){
    const p = P[k];
    if (busy || switched || energy[k] < COST.tukar || j === p.i || !p.deck[j] || p.deck[j].cur <= 0) return;
    energy[k] -= COST.tukar; switched = true; swMode = false; p.i = j; shield[k] = false;
    snd('kad_letup', 'flip'); banner('🔄 ' + esc(p.deck[j].c.name) + ' masuk gelanggang!', '#FDE68A', 1100);
    paintBoard(); kPanel();
  }
  function aiTurn(){
    if (over || turn !== 1 || !root.isConnected) return;
    const me = P[1], ax = act(me), dx = act(P[0]), adv = advOf(ax, dx);
    if (!switched && energy[1] >= 2 && adv < 1){                 // elemen lemah: tukar ke kad yang menang elemen
      const j = me.deck.findIndex((y, i) => i !== me.i && y.cur > 0 && advOf(y, dx) > 1);
      if (j >= 0){ doSwitch(1, j); return setTimeout(aiTurn, 1400); }
    }
    if (energy[1] >= 3 && (adv >= 1 || Math.random() < .6)) return doAttack(1, 'jurus');
    if (!shield[1] && energy[1] >= 2 && ax.cur / ax.hp < .35 && Math.random() < .6){ doShield(1); return setTimeout(aiTurn, 1000); }
    if (energy[1] === 2 && Math.random() < .35){ banner('Penjaga Ilmuria menyimpan tenaga…', '#94A3B8', 1000); return setTimeout(endTurn, 1100); }
    if (energy[1] >= 1) return doAttack(1, 'serang');
    setTimeout(endTurn, 900);
  }

  /* ---------- tamat: ganjaran, TP & rekod ---------- */
  function finish(early){                                // early = dihentikan guru: pendahulu (kad hidup, kemudian jumlah HP) dikira menang
    if (over) return; over = true; cancelAnimationFrame(raf); paintQ();
    const hpSum = p => p.deck.reduce((t, x) => t + Math.max(0, x.cur), 0);
    const wk = early ? (alive(P[0]) !== alive(P[1]) ? (alive(P[0]) > alive(P[1]) ? 0 : 1) : hpSum(P[0]) >= hpSum(P[1]) ? 0 : 1) : alive(P[0]) ? 0 : 1, W = P[wk], L = P[1 - wk];
    S.duel = S.duel || {};
    if (klasik){                                          // tiada soalan: RP sahaja, tidak ke PBD
      S.duel.klasik = S.duel.klasik || {};
      const rpOf = p => p === W ? (ai ? 4 + alive(W) * 2 : 6 + alive(W)) : 1;
      const rowsK = ai ? [P[0]] : [W, L];
      rowsK.forEach(p => { if (!p.id) return; teamRP(p.id, rpOf(p)); const r = S.duel.klasik[p.id] = S.duel.klasik[p.id] || { w:0, l:0 }; r[p === W ? 'w' : 'l']++; });
      save(true);
      const lostAi = ai && wk === 1;
      snd(lostAi ? 'duel_kalah' : 'duel_menang', lostAi ? 'low' : 'myth');
      const e = document.createElement('div'); e.className = 'bt-end';
      e.innerHTML = '<div class="panel clip p-5 w-full text-center" style="max-width:420px">' +
        '<div style="display:flex;justify-content:center">' + teamIco(W).replace(/26px/g, '60px') + '</div>' +
        '<div class="font-bold tracking-widest text-[22px] mt-2" style="color:' + (lostAi ? '#EF4444' : '#FFD76A') + '">' + (ai ? (lostAi ? 'KALAH…' : 'MENANG!') : esc(W.name).toUpperCase() + ' MENANG!') + '</div>' +
        '<div class="text-[12px] text-muted mt-1">Duel Klasik · ' + (ai ? 'lawan Penjaga Ilmuria' : 'kumpulan lawan kumpulan') + ' · ' + round + ' giliran</div>' +
        '<div class="grid gap-2 mt-3 num" style="grid-template-columns:repeat(' + rowsK.length + ',1fr)">' + rowsK.map(p =>
          '<div class="panel clip-s p-2"><div class="text-[12px] truncate">' + esc(p.name) + '</div><div class="text-[16px]" style="color:#4ADE80">' + alive(p) + ' kad hidup</div>' +
          '<div class="text-[11px] text-orange">+' + rpOf(p) + ' RP</div></div>').join('') + '</div>' +
        '<div class="text-[10px] text-muted mt-2">Mod Klasik tiada soalan — ganjaran RP sahaja, tidak direkod sebagai TP.</div>' +
        '<div class="flex gap-2 mt-4"><button class="btn clip-s flex-1 !py-3" data-x="quit">Tutup</button><button class="btn btn-o clip-s flex-1 !py-3" data-x="again"><i class="fa-solid fa-rotate"></i> Main Lagi</button></div></div>';
      $b('#btBoard').appendChild(e);
      if (!lostAi) confettiBurst(e, 80);
      return;
    }
    let rows;
    if (ai){
      const won = wk === 0, rp = won ? 6 + alive(P[0]) * 3 : 2;
      S.duel.wins = S.duel.wins || {}; S.duel.losses = S.duel.losses || {};
      if (won) S.duel.wins[tA] = (S.duel.wins[tA] || 0) + 1; else S.duel.losses[tA] = (S.duel.losses[tA] || 0) + 1;
      teamRP(tA, rp);
      const tp = gameToPBD(tA, 'duel', P[0].right, P[0].asked, { win: won ? 1 : 0 });
      rows = [[P[0], rp, tp]];
    } else {
      const rpW = 8 + alive(W) * 2, rpL = 2;
      S.duel.pvp = S.duel.pvp || {}; S.duel.log = S.duel.log || [];
      [[W, 'w'], [L, 'l']].forEach(([p, k]) => { const r = S.duel.pvp[p.id] = S.duel.pvp[p.id] || { w:0, l:0 }; r[k]++; });
      teamRP(W.id, rpW); teamRP(L.id, rpL);
      const tpW = gameToPBD(W.id, 'pvp', W.right, W.asked, { win: 1, vs: L.name }), tpL = gameToPBD(L.id, 'pvp', L.right, L.asked, { win: 0, vs: W.name });
      S.duel.log.unshift({ a: tA, b: tB, w: W.id, d: todayKey(), m: mode, r: round }); S.duel.log = S.duel.log.slice(0, 100);
      rows = [[W, rpW, tpW], [L, rpL, tpL]];
    }
    save(true);
    const won0 = wk === 0;
    snd(ai && !won0 ? 'duel_kalah' : 'duel_menang', ai && !won0 ? 'low' : 'myth');
    const e = document.createElement('div'); e.className = 'bt-end';
    e.innerHTML = '<div class="panel clip p-5 w-full text-center" style="max-width:420px">' +
      '<div style="display:flex;justify-content:center">' + teamIco(W).replace(/26px/g, '60px') + '</div>' +
      '<div class="font-bold tracking-widest text-[22px] mt-2" style="color:' + (ai && !won0 ? '#EF4444' : '#FFD76A') + '">' + (ai ? (won0 ? 'MENANG!' : 'KALAH…') : esc(W.name).toUpperCase() + ' MENANG!') + '</div>' +
      '<div class="text-[12px] text-muted mt-1">' + (ai ? 'Lawan Penjaga Ilmuria' : rebut ? 'Rebut Jawapan' : 'Bergilir') + ' · ' + round + ' pusingan</div>' +
      '<div class="grid gap-2 mt-3 num" style="grid-template-columns:repeat(' + rows.length + ',1fr)">' + rows.map(([p, rp, tp]) =>
        '<div class="panel clip-s p-2"><div class="text-[12px] truncate">' + esc(p.name) + '</div><div class="text-[16px]" style="color:#4ADE80">' + p.right + '/' + p.asked + ' betul</div>' +
        '<div class="text-[11px] text-orange">+' + rp + ' RP' + (tp ? ' · <b style="color:' + TP_COLOR[tp] + '">TP' + tp + '</b>' : '') + '</div></div>').join('') + '</div>' +
      '<div class="text-[10px] text-muted mt-2">TP direkod dalam PBD hari ini untuk setiap ahli kumpulan.</div>' +
      '<div class="flex gap-2 mt-4"><button class="btn clip-s flex-1 !py-3" data-x="quit">Tutup</button><button class="btn btn-o clip-s flex-1 !py-3" data-x="again"><i class="fa-solid fa-rotate"></i> Main Lagi</button></div></div>';
    $b('#btBoard').appendChild(e);
    if (!ai || won0) confettiBurst(e, 80);
  }
  const quit = () => { over = true; cancelAnimationFrame(raf); liveEnd(live); root.remove(); unlockBody(); if (S.ui.tab === 'arena') renderTab(); };
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (a){ const [k, i] = a.dataset.a.split(':').map(Number); return answer(k, i); }
    const kb = e.target.closest('[data-k]');
    if (kb){
      if (!humanTurn()) return;
      const v = kb.dataset.k;
      if (v === 'serang' || v === 'jurus') return doAttack(turn, v);
      if (v === 'tahan') return doShield(turn);
      if (v === 'tukar'){ if (energy[turn] >= COST.tukar && !switched){ swMode = true; paintBoard(); kPanel(); } return; }
      if (v === 'batal'){ swMode = false; paintBoard(); kPanel(); return; }
      if (v === 'tamat'){ snd('ui_klik', 'flip'); return endTurn(); }
      return;
    }
    const sw = e.target.closest('[data-sw]');
    if (sw){ if (!humanTurn()) return; const [k, j] = sw.dataset.sw.split(':').map(Number); if (k === turn) doSwitch(k, j); return; }
    const x = e.target.closest('[data-x]'); if (!x) return;
    if (x.dataset.x === 'quit'){ if (over) return quit(); const qa = P[0].asked + P[1].asked; gameConfirm(null, null, qa, P[0].right + P[1].right).then(ok => ok && (qa ? finish(true) : quit())); return; }
    if (x.dataset.x === 'again'){ quit(); setTimeout(() => battleRun(tA, tB, mode), 80); }
  });
  paintBoard(); paintQ();
  audPlay('duel_mula');
  banner(ai ? esc(P[0].name) + ' lawan PENJAGA ILMURIA' : esc(P[0].name) + ' lawan ' + esc(P[1].name), '#FFE14D', 1500);
  setTimeout(klasik ? () => beginTurn(0) : ask, klasik ? 1900 : 1700);
}
function duelStart(){

/* ============ PASUKAN (KUMPULAN) & MARKAH GAME → PBD ============
   Semua game dimainkan oleh KUMPULAN (meja kumpulan kelas aktif). Markah

   dan disimpan dalam rekod PBD hari itu bagi SETIAP ahli kumpulan (markah

const GAME_NAMES = { tangga:'Tangga Ilmon', kombo:'Kombo Ilmon', esc:'Sekolah Berhantu', run:'Larian Ilmu', duel:'Duel Kad', pvp:'Duel Kad (lawan kumpulan)', stor:'Simulasi Stor Sukan' };

/* Peratus betul → kadar (julat skala −20…39) → TP */
function accRate(acc){ return acc >= .9 ? 35 : acc >= .75 ? 25 : acc >= .6 ? 15 : acc >= .45 ? 5 : acc >= .25 ? -5 : -15; }
/* Kadar sesi = purata matrik guru (jika ada) + setiap game */
function blendRec(rec){
  const parts = [];
  const ks = Object.keys(rec.metricScores || {});
  if (rec.metricCount && ks.length){ rec.mrate = clamp((rec.totalScore || 0) / Math.max(1, rec.metricCount), SC_MIN, SC_MAX); parts.push(rec.mrate); }
  else delete rec.mrate;
  (rec.games || []).forEach(g => parts.push(g.rate));
  if (!parts.length) return false;
  rec.rate = clamp(parts.reduce((a, x) => a + x, 0) / parts.length, SC_MIN, SC_MAX);
  rec.tpAwarded = calcTP(rec.rate);
  return true;
}
/* Simpan hasil game sebagai PBD untuk setiap ahli pasukan. Pulangkan TP. */
function gameToPBD(teamId, game, right, asked, extra){
  const t = teamOf(teamId), sj = S.ui.activeSubjectId;
  if (!t || !sj || !asked) return 0;
  const date = todayKey(), rate = accRate(right / asked), gid = uid('gm');
  t.members.forEach(s => {
    S.records[s.id] = S.records[s.id] || {};
    S.records[s.id][sj] = S.records[s.id][sj] || {};
    const rec = S.records[s.id][sj][date] || { metricScores:{}, metricCount:0, totalScore:0, touchCount:0 };
    rec.games = rec.games || [];
    rec.games.push(Object.assign({ id: gid, g: game, r: right, n: asked, rate, team: teamId, tn: t.name, t: Date.now() }, extra || {}));
    blendRec(rec);
    stampTopic(rec, s.classId, sj, date);
    rec.updatedAt = Date.now();
    S.records[s.id][sj][date] = rec;
  });
  save(true);
  return calcTP(rate);
}
/* Padam satu aktiviti game daripada rekod; rekod kosong dibuang terus */
function gameDel(sid, sj, date, gameId){
  const rec = ((S.records[sid] || {})[sj] || {})[date]; if (!rec) return;
  rec.games = (rec.games || []).filter(g => g.id !== gameId);
  if (!rec.games.length) delete rec.games;
  if (!blendRec(rec)){ delete S.records[sid][sj][date]; if (!Object.keys(S.records[sid][sj]).length) delete S.records[sid][sj]; }
}

let ST_PROBED = null;
function storProbe(){
  if (ST_PROBED) return ST_PROBED;
  const tryOne = (id, ext) => new Promise(r => { const im = new Image(); im.onload = () => r(true); im.onerror = () => r(false); im.src = 'assets/stor/' + id + '.' + ext; });
  // senarai.json ditulis oleh shrink-assets.ps1 (auto-push): satu muat turun kecil, gambar dimuat bila dipapar sahaja.
  // Tanpa senarai (cth. fail dimuat naik terus ke GitHub), semak setiap fail satu persatu.
  ST_PROBED = fetch('assets/stor/senarai.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject())
    .then(m => { Object.keys(m).forEach(id => ST_HAVE.set(id, 'assets/stor/' + m[id])); })
    .catch(() => Promise.all(ST_ASSETS.map(async a => {
      for (const ext of ['webp', 'png', 'jpg']) if (await tryOne(a.id, ext)){ ST_HAVE.set(a.id, 'assets/stor/' + a.id + '.' + ext); return; }
    })));
  return ST_PROBED;
}

  const trayIcon = x => x.jus ? stImg('jus_' + x.jus, '🥤') : icon(x.id);
  const jusOf = id => ST_JUS.find(r => r.id === id);

  function makeOrder(z){

    return { who, z, need: need.map(i => i.id), got: [], tx: pick(ST_FOOD_TX) };
  }
  const BUB_T = 5;                                        // saat dialog dipapar sebelum sembunyi

  const shake = (z, i) => { const e = $s('#stC_' + z + i); if (e){ e.classList.remove('no'); void e.offsetWidth; e.classList.add('no'); } };
  function custHtml(){
    return ['s', 'k'].map(z => cust[z].map((c, i) => {
      if (!c || c.arriving) return '';
      const frac = Math.max(0, c.p / c.max), col = frac > .5 ? '#22C55E' : frac > .25 ? '#EAB308' : '#EF4444', o = c.o, r = o.jus && jusOf(o.jus);
      if (c.bubTo == null) c.bubTo = T + BUB_T;
      const body = r
        ? '<div class="jv"><span class="gl">' + stImg('jus_' + r.id, '🥤') + '</span><div class="tx">"' + esc(o.tx) + '"</div></div>'   // gambar jus di atas, ayat pendek di bawah; resipi bila diketik
        : '<div class="it">' + o.need.map(id => '<span class="' + (o.got.includes(id) ? 'ok' : '') + '">' + icon(id) + '</span>').join('') + '</div><div class="tx' + (z === 'k' ? ' big' : '') + '">' + (z === 'k' ? '"' + esc(o.tx) + '"' : esc(o.tx)) + '</div>';
      return '<div class="st-cu' + (c.fresh ? ' fresh' : '') + (c.leaving ? ' out' : '') + (frac < .25 ? ' mad' : '') + (bubHid(c) ? ' bh' : '') + '" id="stC_' + z + i + '" data-cu="' + z + i + '" style="left:' + SLOTX[z][i] + '%">' +
        '<div class="st-bub">' + body + '<div class="pt"><i style="width:' + (frac * 100) + '%;background:' + col + '"></i></div></div>' +
        '<div class="pm">💬<b><i style="width:' + (frac * 100) + '%;background:' + col + '"></i></b></div>' +
        '<div class="who">' + stImg(o.who.img, o.who.e) + '</div><div class="nm2">' + esc(o.who.n) + '</div></div>';
    }).join('')).join('');
  }
  const paintCust = () => { $s('#stCust').innerHTML = custHtml(); ['s', 'k'].forEach(z => cust[z].forEach(c => { if (c) c.fresh = false; })); };
  const TRAY_MAX = 4;

    $s('#stTray').innerHTML = Array.from({ length: TRAY_MAX }, (_, i) => tray[i] ? '<div class="f' + (tray[i].jus ? ' jus' : '') + '" data-tr="' + i + '">' + trayIcon(tray[i]) + '</div>' : '<div></div>').join('');

  };
  const shown = {};

    const el = $s('[data-sh="' + id + '"]'); if (!el) return;
    el.classList.toggle('low', ST_ITEMS.some(i => i.sh === id && stock[i.id] <= 1));
    // satu ikon bagi setiap jenis barang (bukan timbunan salinan) + lencana stok; seret terus dari rak

      shown[it.id] = n;
      return '<span class="st-si' + (n ? '' : ' out') + (pop ? ' pop' : '') + '" data-it="' + it.id + '" style="left:' + x + '%;bottom:' + (100 - ST_BOARD[lv]) + '%;width:' + w + '%">' +
        '<i>' + icon(it.id) + '</i>' + (it.prep ? '<b class="pr">🍳</b>' : '') +

  /* barang terbang (kedudukan dalam % pentas — sama di tablet projektor) */
  const shelfPos = id => {
    const it = ST_IT[id], sh = shelfOf(it.sh), sl = shelfSlots(it.sh).find(x => x.it.id === id);
    return [sh[3] + sh[4] * sl.x / 100, 9.5 + 40 * ST_BOARD[sl.lv] / 100 - 4];

  const flyTo = (id, from, to) => {

  function paintBin(){
    const lv = bin === 0 ? 'kosong' : bin <= 2 ? 'sikit' : bin <= 4 ? 'separuh' : 'penuh', b = $s('#stBin');
    b.innerHTML = (ST_HAVE.has('tong_' + lv) ? stImg('tong_' + lv, '') : '<span class="st-emo">🗑️</span><span class="lvl"><i style="height:' + Math.min(100, bin / BIN_MAX * 100) + '%"></i></span>') +

  /* ---------- tindakan ---------- */

  let lifted = null;

    const it = ST_IT[el.dataset.it]; if (!it || !stock[it.id]) return;

  }

  /* Pelanggan masuk melalui PINTU: pintu dibuka (gambar pintu_buka), watak muncul kecil di ambang pintu (jauh),
     turun melalui laluan antara dua kaunter ke hadapan, kemudian ke tempatnya. Kesabaran bermula bila sampai. */
  let doorT = 0;

    const d = drag; drag = null;
    if (d.kind === 'me'){ d.me.classList.remove('drag'); if (d.on) dragEnd = performance.now(); return; }
    if (!d.on) return;                                  // hanya ketik: biar pengendali klik biasa
    dragEnd = performance.now();
    d.g.remove(); d.src.classList.remove('lifted'); if (d.hot) d.hot.classList.remove('st-hot');
    const tgt = e.type === 'pointerup' ? d.hot : null;
    if (!tgt) return;
    const cu = tgt.dataset.cu, z = cu && cu[0], ci = cu && +cu[1];
    const toTray = tgt.classList.contains('st-tray'), toShelf = tgt.dataset.sh, toBl = tgt.dataset.bl, toBinT = tgt.dataset.bin, toDoor = tgt.dataset.door, toStn = tgt.dataset.ss;
    if (d.kind === 'bin'){ if (toDoor) emptyBin(); return; }
    if (d.kind === 'bl'){
      if (toBinT) return toBin(() => { bl.ings = []; bl.r = null; bl.blending = false; paintBl(); msg('Blender dikosongkan', '#FDE68A', 900); });
      if (cu && z === 'k'){ if (bl.r) return serveJus(ci); return msg(bl.blending ? 'Sedang dikisar… tunggu sekejap' : 'Jus belum lengkap — tambah bahan ikut resipi', '#FDE68A', 1300); }
      if (cu) return msg('Jus untuk pelanggan Kedai Sihat.', '#FDE68A', 1100);
      return;
    }
    if (d.kind === 'tray'){
      if (toBinT) return toBin(() => { tray.length = 0; paintTray(); });
      if (cu && z === 'k'){ let n = 0; for (let j = tray.length - 1; j >= 0; j--) if (giveTo('k', ci, { t: 'tray', i: j }, true)) n++; if (!n){ shake('k', ci); msg(cust.k[ci] && cust.k[ci].o.jus ? 'Jus yang dia mahu belum ada di kaunter' : 'Tiada makanan yang diminta di kaunter', '#FDE68A', 1300); } }
      return;
    }
    if (d.kind === 'tr'){
      const s = { t: 'tray', i: +d.id }, x = tray[+d.id]; if (!x) return;
      if (cu && z === 'k') return giveTo('k', ci, s);
      if (toBinT) return toBin(() => { tray.splice(+d.id, 1); paintTray(); });
      if (toShelf && !x.cooked && !x.jus && ST_IT[x.id].sh === toShelf){ tray.splice(+d.id, 1); stock[x.id]++; flyTo(x.id, TRAY_AT, shelfPos(x.id)); paintTray(); paintShelves(); }

      if (cu && z === 's') return giveTo('s', ci, { t: 'shelf', id: d.id });
      if (cu || toTray || toBl) msg('Peralatan sukan diberi terus kepada atlet di Kaunter Stor.', '#FDE68A', 1500);
      return;
    }
    if (it.tg === 'j'){
      if (toBl) return addIng(d.id);
      if (cu || toTray) msg('Bahan jus — masukkan ke dalam blender.', '#FDE68A', 1300);
      return;
    }
    if (toBl) return msg('Blender untuk bahan dari Rak Bahan Jus sahaja.', '#FDE68A', 1300);
    if (it.prep){
      if (cu || toTray || toStn) return cook(d.id, toStn ? +toStn.slice(-1) : null);
      return;
    }
    if (cu && z === 'k') return giveTo('k', ci, { t: 'shelf', id: d.id });
    if (cu) return msg('Makanan untuk pelanggan Kedai Sihat.', '#FDE68A', 1300);
    if (toTray) return toCounter({ t: 'shelf', id: d.id });

  window.addEventListener('pointercancel', endDrag);
  const unDrag = () => { window.removeEventListener('pointerup', endDrag); window.removeEventListener('pointercancel', endDrag); };
  hud(); paintTray(); paintStn(); paintShelves(); paintBl(); paintBin();
  msg('KEDAI DIBUKA! 🏪', '#FACC15', 1600);
}
