/* ---------- Firebase config / rules / data ---------- */
/* Kesan config Firebase dari mana-mana format: snippet JS, objek JSON, atau tampalan penuh */
function parseFbConfig(text){
  const keys = ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId','measurementId'];
  const cfg = {};
  keys.forEach(k => {
    const m = text.match(new RegExp('["\'`]?\\b' + k + '\\b["\'`]?\\s*[:=]\\s*["\'`]([^"\'`]+)["\'`]'));
    if (m) cfg[k] = m[1].trim();
  });
  // Jika databaseURL tiada tetapi projectId ada, cadangkan URL RTDB lalai
  if (!cfg.databaseURL && cfg.projectId) cfg.databaseURL = 'https://' + cfg.projectId + '-default-rtdb.firebaseio.com';
  return cfg;
}
function fbCfgForm(){
  const cur = fbCfgGet() || {};
  const id = openModal({ icon:'fa-key', title:'Konfigurasi Firebase',
    body:
      '<div class="text-[12px] text-muted mb-2">Tampal terus blok <span class="num text-cyan">firebaseConfig</span> dari Firebase Console. App akan kesan sendiri setiap medan.</div>' +
      '<textarea id="fbPaste" rows="8" class="fld clip-s num !text-[12px]" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;AIza...&quot;,&#10;  authDomain: &quot;projek.firebaseapp.com&quot;,&#10;  databaseURL: &quot;https://projek-default-rtdb.firebasedatabase.app&quot;,&#10;  ...&#10;};"></textarea>' +
      '<div id="fbDetect" class="mt-2"></div>' +
      '<div class="text-[11px] text-muted mt-2">Kosongkan &amp; simpan untuk kembali ke mod tempatan sahaja.</div>',
    footer:'<button class="btn clip-s flex-1" data-close="1">Batal</button><button class="btn btn-o clip-s flex-1" data-x="ok">Simpan &amp; Sambung</button>',
    afterOpen: bd => {
      const ta = $('#fbPaste', bd);
      if (cur.apiKey){
        ta.value = 'const firebaseConfig = {\n' + Object.keys(cur).filter(k=>cur[k])
          .map(k => '  ' + k + ': "' + cur[k] + '"').join(',\n') + '\n};';
      }
      const detect = () => {
        const box = $('#fbDetect', bd);
        const raw = ta.value.trim();
        if (!raw){ box.innerHTML = '<div class="text-[12px] text-muted">Tiada teks — mod tempatan.</div>'; return {}; }
        const c = parseFbConfig(raw);
        const need = ['apiKey','authDomain','databaseURL','projectId','storageBucket','appId'];
        const rows = need.concat(['messagingSenderId','measurementId']).map(k => {
          const v = c[k];
          const req = need.indexOf(k) >= 0;
          return '<div class="flex items-center gap-2 text-[11px] py-0.5">' +
            '<i class="fa-solid ' + (v ? 'fa-circle-check text-cyan' : (req ? 'fa-circle-xmark text-[#E23B3B]' : 'fa-minus text-muted')) + '"></i>' +
            '<span class="w-[118px] text-muted">' + k + '</span>' +
            '<span class="num truncate flex-1">' + (v ? esc(v.length > 26 ? v.slice(0,24) + '…' : v) : (req ? 'tiada' : '—')) + '</span></div>';
        }).join('');
        const miss = need.filter(k => !c[k]);
        box.innerHTML = '<div class="panel clip-s p-2">' + rows +
          (miss.length ? '<div class="text-[11px] text-[#E23B3B] mt-1">Belum lengkap: ' + miss.join(', ') + '</div>'
                       : '<div class="text-[11px] text-cyan mt-1">Lengkap — sedia untuk sambung.</div>') + '</div>';
        return c;
      };
      ta.addEventListener('input', detect);
      ta.addEventListener('paste', () => setTimeout(detect, 30));
      detect();
    } });
  const bd = $('[data-modal="'+id+'"]');
  bd.addEventListener('click', e => {
    if (!e.target.closest('[data-x="ok"]')) return;
    const raw = ($('#fbPaste', bd).value||'').trim();
    if (!raw){
      localStorage.removeItem(LS_FB);
      closeModal(id); toast('Mod tempatan. Memuat semula...');
      return setTimeout(()=>location.reload(), 800);
    }
    const cfg = parseFbConfig(raw);
    if (!cfg.apiKey || !cfg.databaseURL) return toast('apiKey atau databaseURL tidak dikesan. Semak tampalan.', null, true);
    localStorage.setItem(LS_FB, JSON.stringify(cfg));
    if (localStorage.getItem(LS_LINK) !== linkKey(cfg)) localStorage.removeItem(LS_LINK);
    closeModal(id); toast('Konfigurasi disimpan. Menyambung...');
    setTimeout(()=>location.reload(), 900);
  });
}

function expJson(){
  const payload = JSON.parse(JSON.stringify(S));
  payload.photos = PHOTOS;
  download('edurank_backup_'+todayKey()+'.json', JSON.stringify(payload, null, 1));
  toast('Backup JSON dimuat turun.');

function impJson(){
  const inp = $('#fileJson'); inp.value='';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const d = JSON.parse(rd.result);
        const ok = await confirmBox({danger:true,title:'Import JSON',okText:'Ganti Data',
          message:'Data semasa akan DIGANTI sepenuhnya dengan kandungan fail ini. Teruskan?'});
        if(!ok) return;
        const ph = d.photos || {}; delete d.photos;
        S = migrate(d);
        Object.keys(ph).forEach(k => { PHOTOS[k]=ph[k]; idbPut(k, ph[k]); });
        save(true); renderAll(); toast('Data diimport.');
      } catch(e){ toast('Fail JSON tidak sah.', null, true); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
async function rollover(){
  const ok = await confirmBox({danger:true,title:'Rollover Tahun Akademik',okText:'Teruskan',
    message:'Backup JSON akan dimuat turun dahulu. Kemudian:<br>• Pelajar Tingkatan 5 digraduasikan (dipadam)<br>• Kelas lain naik +1 tingkatan<br>• Semua skor &amp; sesi penilaian direset<br><br>Teruskan?'});
  if(!ok) return;
  expJson();
  await new Promise(r=>setTimeout(r, 900));
  const snap = snapshot();
  const grad = S.classes.filter(c=>/^\s*5/.test(c.name)).map(c=>c.id);
  for (const s of S.students.filter(x=>grad.includes(x.classId))) await photoDel(s.id);
  S.students = S.students.filter(s=>!grad.includes(s.classId));
  S.classes = S.classes.filter(c=>!grad.includes(c.id));
  S.metrics = S.metrics.filter(m=>!grad.includes(m.classId));
  S.groups = [];
  S.classes.forEach(c => c.name = c.name.replace(/^(\s*)([1-4])/, (m,a,d)=> a + (parseInt(d,10)+1)));
  S.records = {};
  save(true); renderAll();
  toast('Rollover selesai · '+grad.length+' kelas digraduasikan.', ()=>restore(snap));
}
async function wipeAll(){
  const ok = await confirmBox({danger:true,title:'Padam Semua Data',okText:'Padam Semua',
    message:'SEMUA kelas, subjek, pelajar, matrik, lencana, gambar dan rekod akan dipadam kekal. Eksport JSON dahulu jika perlu. Teruskan?'});
  if(!ok) return;
  for (const s of S.students) await photoDel(s.id);
  S = blank(); save(true); renderAll(); toast('Semua data dipadam.');
}

function showcaseRank(o){
  const sj = (o.scope==='ctx' || o.scope==='subject') ? S.ui.activeSubjectId : null;
  let list = S.students.slice();
  if (o.scope==='ctx' || o.scope==='class') list = list.filter(s=>s.classId===S.ui.activeClassId);
  return list.map(s => ({ s, ...stats(s.id, sj), rp: rpOf(s.id, sj), sj }))
    .filter(r => r.sessions > 0)
    .sort((a,b) => o.sort==='avg' ? (b.avgTP-a.avgTP || b.score-a.score) : o.sort==='score' ? (b.score-a.score || b.avgTP-a.avgTP) : ((b.rp||0)-(a.rp||0) || b.score-a.score))
    .slice(0, o.count);
}
/* Warna plat kedudukan: #1 emas, #2 perak, #3 gangsa, selebihnya cyan */
function tierOf(rank){
  if (rank===1) return { c1:'#FFD76A', c2:'#8A6410', glow:'rgba(255,205,90,.55)', pad:'11px', label:'JUARA', orn:true };
  if (rank===2) return { c1:'#DCE8F2', c2:'#6E7E8E', glow:'rgba(215,232,246,.42)', pad:'9px',  label:'NAIB JUARA', orn:true };
  if (rank===3) return { c1:'#E08E4A', c2:'#6E3A14', glow:'rgba(224,142,74,.42)', pad:'9px',  label:'TEMPAT KETIGA', orn:true };
  return         { c1:'#00F0FF', c2:'#1B4E5C', glow:'rgba(0,240,255,.28)', pad:'7px', label:'BARISAN TERBAIK', orn:false };
}

/* ============ SEDIAKAN GAMBAR SEBELUM DIPAPARKAN ============
   Showcase dibina daripada HTML (banner, tangga rank, ganjaran). Daripada
   menyenaraikan gambar satu per satu — yang mudah tertinggal bila reka

function htmlImageUrls(html){
  const t = document.createElement('template');
  t.innerHTML = html || '';
  const out = new Set();
  t.content.querySelectorAll('img[src]').forEach(i => out.add(i.getAttribute('src')));
  t.content.querySelectorAll('image').forEach(i => {
    const u = i.getAttribute('href') || i.getAttribute('xlink:href'); if (u) out.add(u); });
  t.content.querySelectorAll('[style]').forEach(e => {
    const s = e.getAttribute('style'), re = /url\(\s*(['"]?)(.*?)\1\s*\)/g; let m;
    while ((m = re.exec(s))) if (m[2]) out.add(m[2].replace(/&quot;/g, '"'));
  });
  return [...out].filter(u => u && !/^#/.test(u));
}
/* Nyahkod senarai gambar. Senyap jika siap cepat; jika lebih 250 ms (atau
   always), skrin memuat dibuka dengan kemajuan. Had masa supaya satu gambar
   yang tergantung di rangkaian tidak menahan pengguna selamanya. */
async function prepImages(urls, msg, opt){
  opt = opt || {};
  const want = [...new Set(urls || [])].filter(u => u && !IMG_KEEP.has(u));
  let id = opt.screen || null, done = 0, fin = false;
  const paint = () => {
    if (!id) return;
    const bd = $('[data-modal="' + id + '"]'); if (!bd) return;
    const b = $('#plBar', bd), t = $('#plTxt', bd);
    if (b) b.style.width = (want.length ? done / want.length * 100 : 100) + '%';
    if (t) t.textContent = want.length ? (done + ' / ' + want.length) : 'Sedia';
  };
  const q = want.slice();
  const workers = [];
  for (let w = 0; w < 8; w++) workers.push((async () => { while (q.length){ await preloadOne(q.shift()); done++; paint(); } })());
  const all = Promise.all(workers).then(() => { fin = true; });
  const cap = new Promise(r => setTimeout(r, opt.max || 15000));
  if (!id && !opt.always){
    await Promise.race([all, cap, new Promise(r => setTimeout(r, 250))]);
    if (fin || !want.length) return;
  }
  if (!id) id = loadScreen(want.length, true, msg);
  paint();
  await Promise.race([all, cap]);
  paint();
  if (!opt.keep){ await new Promise(r => setTimeout(r, 160)); closeModal(id); }
  return id;
}

const V = { db:'', token:'', snap:null, u:0, i:0, slides:[], timer:null, poll:null, last:null, dead:false };
function snapToState(snap){
  const st = blank();
  st.ranks = (snap.ranks||[]).map(r => ({ id:r.id, tier:r.tier, name:r.name, color:r.color, min:r.min }));
  if (st.ranks.length !== 24) st.ranks = defaultRanks();
  st.frames = {};
  (snap.ranks||[]).forEach(r => { if (r.f) st.frames[r.id] = { url:r.f }; });
  const cls = {};
  st.students = (snap.st||[]).map(x => {
    cls[x.c] = 1;
    const bids = (x.b||[]).map((b,k) => { const id = x.i+'_b'+k; st.badges.push({ id, name:b.n, url:b.u, color:b.c }); return id; });
    return { id:x.i, name:x.n, classId:'c:'+x.c, bannerUrl:x.bn||'', iconUrl:x.ic||'', badges:bids, fields:{} };
  });
  st.classes = Object.keys(cls).map(n => ({ id:'c:'+n, name:n }));

}
const vRows = () => (V.snap.st||[]).map(x => ({ s: stu(x.i), score:x.sc||0, avgTP:x.a||0, finalTP:x.f||0, sessions:x.se||0, rp:x.rp||0, sj:null, subjLabel:x.sj, rewards:x.rw||[], es:x.es||0,
  badgeList: (x.b||[]).map(b => ({ id:'v', name:b.n, url:b.u, color:b.c })) }));
function vRanked(){
  const o = V.snap.opt || {};
  return vRows().filter(r => r.sessions > 0)
    .sort((a,b) => o.sort==='avg' ? (b.avgTP-a.avgTP || b.score-a.score) : o.sort==='score' ? (b.score-a.score || b.avgTP-a.avgTP) : ((b.rp||0)-(a.rp||0) || b.score-a.score));

function vPre(){
  const counts = {};
  vRows().forEach(r => { if (!r.sessions) return; const rk = rankFor(r.rp || 0); counts[rk.tier] = (counts[rk.tier]||0) + 1; });
  const items = (V.snap.rw||[]).map(x => ({ name:x.n, reward:{ emoji:x.e, per:x.p } }));

function vSlides(){
  const o = V.snap.opt || {}, out = [];

  if (o.promo !== false && (V.snap.rw||[]).length) out.push({ type:'reward', key:'reward' });
  if (o.promo !== false && (V.snap.st||[]).some(x => x.es)) out.push({ type:'escape', key:'escape' });

/* ---------- UTILITI GAMBAR & CACHE ----------
   Sistem sprite, Arena Taktikal dan Mod Cerita telah dibuang. Yang tinggal

const GENDERS = [{ k:'L', name:'Lelaki' }, { k:'P', name:'Perempuan' }];
const CK = u => 'cache:' + u;
const resolveUrl = u => (u && PHOTOS[CK(u)]) || u;
const IMG_KEEP = new Map();
function preloadOne(url){
  if (!url) return Promise.resolve(null);
  const kept = IMG_KEEP.get(url);
  if (kept) return Promise.resolve(kept);
  return new Promise(res => {
    const im = new Image();
    const keep = () => { IMG_KEEP.set(url, im); res(im); };
    im.onload = () => { if (im.decode) im.decode().then(keep).catch(keep); else keep(); };
    im.onerror = () => res(null);
    im.src = url;
  });
}

const ASSET_KEEP = k => /:(banner|icon)$/.test(k) || /^(badge|frame|bgm|bgmdef|cache|dskp):/.test(k);
async function purgeSpriteAssets(){
  const gone = Object.keys(PHOTOS).filter(k => !ASSET_KEEP(k));

  for (const k of gone){ try { await idbDel(k); } catch(e){} }
  return gone.length;

/* ============ ARAHAN DI SEBALIK "?" ============
   Perenggan penerangan yang panjang menyesakkan skrin telefon. Ia disorok
   dan diganti dengan butang "?" kecil; tekan untuk membacanya.
   Automatik untuk seluruh app: perenggan kelabu (text-muted) yang kecil,
   panjang, tiada butang atau input di dalamnya, dan bukan teks dinamik
   (tiada id). Maklumat lain boleh ditanda terus dengan data-hint="Tajuk".
   data-nohint mengecualikan (contoh: sinopsis cerita).                  */
const hintsInline = () => !!(S && S.config && S.config.hintsInline === 1);
const HINT_SKIP = '[data-nohint],#tgWrap,#tgCut,#tgHelp,#dlgBox,.hint-pop';
function hintCandidate(el){
  if (el.__hintDone || el.nodeType !== 1) return false;
  if (el.hasAttribute('data-hint')) return !el.closest(HINT_SKIP);
  if (el.id) return false;
  const c = el.className;
  if (typeof c !== 'string' || c.indexOf('text-muted') < 0 || !/text-\[(9|10|11|12)px\]/.test(c)) return false;
  if (el.closest(HINT_SKIP)) return false;
  /* teks di dalam butang atau baris satu-garis ialah maklumat baris, bukan arahan */
  if (el.closest('button,[data-sb],[data-act]') || /\btruncate\b/.test(c)) return false;
  if (el.querySelector('button,input,select,textarea,canvas,img,[id]')) return false;
  return el.textContent.trim().length >= 60;
}
function hintScan(root){
  if (!root || root.nodeType !== 1 || hintsInline()) return;
  const list = [];
  if ((root.matches('div,p')) && hintCandidate(root)) list.push(root);
  root.querySelectorAll('[data-hint], div.text-muted, p.text-muted').forEach(el => { if (hintCandidate(el)) list.push(el); });
  if (!list.length) return;
  const inList = new Set(list), used = new Set();
  list.forEach(el => {
    if (used.has(el)) return;
    for (let p = el.parentElement; p; p = p.parentElement) if (inList.has(p)) return;   // sudah dalam kumpulan induk
    /* perenggan bersebelahan digabung dalam satu "?" */
    const grp = [el]; used.add(el);
    for (let n = el.nextElementSibling; n && inList.has(n) && !used.has(n); n = n.nextElementSibling){ grp.push(n); used.add(n); }
    hintCollapse(grp);
  });
}
function hintCollapse(grp){
  grp.forEach(e => { e.__hintDone = true; e.classList.add('hint-hid'); });
  const title = grp.map(e => e.getAttribute('data-hint')).find(Boolean) || '';
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'hint-q';
  btn.innerHTML = '<span class="hq">?</span>' + (title ? '<span>' + esc(title) + '</span>' : '');
  btn.setAttribute('aria-label', title || 'Maklumat');
  btn.__hint = grp; btn.__title = title || 'Maklumat';
  /* Ada label tajuk betul-betul di atas? Letak "?" di sebelahnya. */
  const prev = grp[0].previousElementSibling;
  if (!title && prev && prev.classList.contains('lbl')){
    const old = prev.querySelector('.hint-q');
    if (old && !(old.__hint || []).some(x => x.isConnected)) old.remove();
    if (!prev.querySelector('.hint-q')){ prev.appendChild(btn); return; }
  }
  const row = document.createElement('div'); row.className = 'hint-row';
  row.appendChild(btn);
  grp[0].parentNode.insertBefore(row, grp[0]);
}
function hintUndo(){
  $$('.hint-q').forEach(b => { const r = b.parentElement; b.remove(); if (r && r.classList.contains('hint-row')) r.remove(); });
  $$('.hint-hid').forEach(e => { e.classList.remove('hint-hid'); e.__hintDone = false; });
}
function hintInit(){
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.hint-q'); if (!b || !b.__hint) return;
    e.preventDefault(); e.stopPropagation();       // jangan cetuskan baris/butang di bawahnya
    const html = b.__hint.map(x => '<div class="mb-2">' + x.innerHTML + '</div>').join('');
    openModal({ center:true, icon:'fa-circle-question', title:b.__title,
      body:'<div class="hint-pop text-[13px] leading-relaxed" data-nohint="1">' + html + '</div>',
      footer:'<button class="btn btn-o clip-s flex-1" data-close="1">Faham</button>' });
  }, true);
  let q = [], sched = false;
  const flush = () => { sched = false; const nodes = q; q = []; nodes.forEach(n => { if (n.isConnected) hintScan(n); }); };
  new MutationObserver(ms => {
    ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) q.push(n); }));
    if (q.length && !sched){ sched = true; requestAnimationFrame(flush); }
  }).observe(document.body, { childList:true, subtree:true });
  hintScan(document.body);
}
/* ============ BANK SOALAN (digunakan oleh semua game) ============
   Keputusan kuiz TIDAK menyentuh TP atau rekod PBD — hanya statistik kuiz. */
const QUIZ_TIME = 15;                       // saat (rujukan dalam prompt AI)
/* Soalan dipilih secara RAWAK dan tidak berulang: soalan yang pernah keluar (bagi kelas & subjek ini,
   disimpan dalam S.qSeen) dilangkau sehingga semua soalan dalam bank habis ditanya, barulah kitaran
   baharu bermula. Soalan SK/SP pelajaran hari ini (bank.prefer, dari topicalBank) didahulukan. */
let QLAST = '', QCOUNT = 0;
function nextQ(bank){
  if (!bank || !bank.length) return null;
  const key = (S.ui.activeClassId || '') + '|' + (bank[0].subjectId || '');
  S.qSeen = S.qSeen || {};
  const seen = new Set(S.qSeen[key] || []);
  let pool = bank.filter(q => !seen.has(q.id));
  if (!pool.length){                                   // semua sudah ditanya: kitaran baharu
    bank.forEach(q => seen.delete(q.id));
    pool = bank.length > 1 ? bank.filter(q => q.id !== QLAST) : bank;
  }
  const pref = bank.prefer ? pool.filter(q => bank.prefer.has(q.id)) : [];
  const from = pref.length ? pref : pool;
  const q = from[Math.floor(Math.random() * from.length)];
  seen.add(q.id); QLAST = q.id;
  const live = new Set((S.quiz || []).map(x => x.id));
  S.qSeen[key] = [...seen].filter(id => live.has(id));
  if (++QCOUNT % 5 === 0) save();                      // simpan sekali-sekala, bukan setiap soalan
  return q;
}
const qBank = (sj, ch) => (S.quiz || []).filter(q => q.subjectId === sj && (!ch || q.chapterId === ch));
const quizStat = sid => ((S.quizStat || {})[sid]) || { ok:0, n:0 };
function quizRecord(sid, ok){
  S.quizStat = S.quizStat || {};
  const st = S.quizStat[sid] || { ok:0, n:0 };
  st.n++; if (ok) st.ok++;
  S.quizStat[sid] = st;
}

/* Tampal balik: guna penghurai soalan yang SAMA dengan Mod Cerita, jadi
   satu format JSON sahaja untuk guru belajar, bukan dua.               */
function tqParse(raw, sj, bab){
  let t = String(raw || '').trim();
  t = t.replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Tiada JSON dijumpai dalam teks yang ditampal.');
  let o;
  try { o = JSON.parse(t.slice(a, b + 1)); }
  catch (e){ throw new Error('JSON tidak sah — ' + e.message); }
  const arr = Array.isArray(o) ? o : Array.isArray(o.soalan) ? o.soalan : null;
  if (!arr || !arr.length) throw new Error('Tiada senarai "soalan" dalam JSON itu.');
  const ch = String(bab || '').trim() || sTxt(o.tajuk, 60);
  const qs = sQuestions(arr, 't' + Date.now().toString(36), 60);
  if (!qs.length) throw new Error('Tiada soalan sah. Setiap soalan perlu "soalan", "pilihan" dan "betul".');
  return qs.map((q, i) => { const sp = skCode(q.sp); return { id:uid('q'), subjectId:sj, chapterId:ch,
    q:q.q, c:q.c, a:q.a, ejek:q.ejek, huraian:q.huraian, sp, sk: sp ? sp.split('.').slice(0, 2).join('.') : '' }; });
}

const sTxt = (v, max) => String(v === undefined || v === null ? '' : v).trim().slice(0, max || 200);
function sQuestions(arr, bi, cap){
  const out = [];
  (Array.isArray(arr) ? arr : []).slice(0, cap || 12).forEach((v, k) => {
    if (!v || typeof v !== 'object') return;
    const qt = sTxt(v.soalan !== undefined ? v.soalan : v.q, 300);
    const raw = Array.isArray(v.pilihan) ? v.pilihan : Array.isArray(v.c) ? v.c : [];
    const c = raw.slice(0, 4).map(x => sTxt(x, 140));
    while (c.length < 4) c.push('');
    const filled = c.filter(x => x !== '').length;
    if (!qt || filled < 2) return;
    let a = v.betul !== undefined ? v.betul : v.a;
    if (typeof a === 'string'){
      const s = a.trim();
      const li = 'ABCD'.indexOf(s.toUpperCase());
      a = li >= 0 && s.length === 1 ? li : c.findIndex(x => x.toLowerCase() === s.toLowerCase());
    }
    a = +a;
    if (!(a >= 0 && a < 4) || c[a] === '') a = 0;
    // ejekan: array selari dengan pilihan, atau objek berkunci A/B/C/D atau 0..3
    const ej = ['', '', '', ''];
    const src = v.ejek !== undefined ? v.ejek : v.taunt;
    if (Array.isArray(src)) src.slice(0, 4).forEach((t, j) => { ej[j] = sTxt(t, 600); });
    else if (src && typeof src === 'object'){
      Object.keys(src).forEach(kk => {
        const key = String(kk).trim().toUpperCase();
        const j = 'ABCD'.indexOf(key) >= 0 ? 'ABCD'.indexOf(key) : (+key >= 0 && +key < 4 ? +key : -1);
        if (j >= 0) ej[j] = sTxt(src[kk], 600);
      });
    } else if (typeof src === 'string'){
      const t = sTxt(src, 600);
      for (let j = 0; j < 4; j++) if (j !== a) ej[j] = t;
    }
    ej[a] = '';                                  // pilihan betul tiada ejekan
    const hur = sTxt(v.huraian !== undefined ? v.huraian : v.explain, 600);
    for (let j = 0; j < 4; j++){
      if (j === a || c[j] === '') continue;
      if (!ej[j]) ej[j] = hur || ('Jawapan betul ialah {a}.');
      if (ej[j].indexOf('{a}') < 0) ej[j] = 'Jawapannya {a}. ' + ej[j];
    }
    out.push({ id:'sq' + bi + '_' + k, q:qt, c, a, ejek:ej, sp: sTxt(v.sp, 24),
      huraian: hur ? (hur.indexOf('{a}') < 0 ? 'Jawapannya {a}. ' + hur : hur) : 'Jawapan betul ialah {a}.' });
  });
  return out;
}

/* ---------- TPC: tabung kelas mingguan ---------- */
function weekKey(dk){
  const d = new Date((dk || todayKey()) + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;                 // Isnin = 0
  d.setDate(d.getDate() - day);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const tpcKey = () => weekKey() + '|' + S.ui.activeClassId + '|' + S.ui.activeSubjectId;
function tpcEarned(){
  const cid = S.ui.activeClassId, sj = S.ui.activeSubjectId;
  if (!cid || !sj) return 0;
  const wk = weekKey(), rate = (S.config.tpcRate === undefined ? 1 : S.config.tpcRate);
  let sum = 0;
  studentsOf(cid).forEach(s => {
    const days = (S.records[s.id] || {})[sj] || {};
    Object.keys(days).forEach(d => { if (weekKey(d) === wk){ const r = rateOf(days[d]); if (r > 0) sum += r; } });
  });
  return Math.floor(sum * rate);
}

const tpcBonus = () => ((S.tpc && S.tpc.bonus) || {})[tpcKey()] || 0;

/* ---------- BUKA PACK ---------- */
let SFX_ON = true;
/* ---------- AUDIO ASET (assets/sfx) ----------
   Fail audio sebenar (dijana di tools/jana-audio.html) menggantikan bunyi sintesis bila wujud.
   assets/sfx/senarai.json ditulis oleh auto-push; bunyi yang belum ada guna bunyi lalai app. */
const AUD_HAVE = new Map();
let AUD_PROBED = null;
function audProbe(){
  if (!AUD_PROBED) AUD_PROBED = fetch('assets/sfx/senarai.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {})
    .then(m => { Object.keys(m).forEach(id => AUD_HAVE.set(id, 'assets/sfx/' + m[id])); }).catch(() => {});
  return AUD_PROBED;
}
/* main fail audio sekali; pulang false jika fail tiada (pemanggil guna bunyi lalai) */
function audPlay(id, vol){
  const url = AUD_HAVE.get(id); if (!url) return false;
  if (!SFX_ON) return true;
  const a = audCtx(); if (!a) return false;
  if (a.state === 'suspended' && !document.hidden) a.resume();
  audBuf(url).then(d => {
    if (!d) return;
    const src = a.createBufferSource(), g = a.createGain();
    src.buffer = d.buf; g.gain.value = Math.min(1.5, vol == null ? 1 : vol) * 0.9 * (d.norm || 1);
    src.connect(g); g.connect(a.destination); src.start(0, d.ls);
  });
  return true;
}
/* muat & nyahkod awal bunyi sesuatu game (dipanggil dari menu permulaan game) */
const audPreload = key => audProbe().then(() => AUD_HAVE.forEach((u, id) => { if (id.indexOf('ui_') === 0 || id.indexOf(key + '_') === 0 || id === 'bgm_' + key) audBuf(u); }));
const SFX_MAP = { flip:'ui_klik', hi:'ui_betul', low:'ui_salah', myth:'ui_hebat', tear:'kad_koyak', burst:'kad_letup' };
const snd = (id, fallback) => { if (!audPlay(id) && fallback) sfx(fallback); };
function sfx(type){
  if (!SFX_ON) return;
  if (SFX_MAP[type] && audPlay(SFX_MAP[type])) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    SFX_CTX = SFX_CTX || new C();
    const a = SFX_CTX, t = a.currentTime;
    const beep = (f1, f2, dur, typ, vol) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = typ || 'sine'; o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
      g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
    };
    if (type === 'tear'){ const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.25, a.sampleRate);
      const d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length) * 0.35;
      n.buffer = b; const g = a.createGain(); g.gain.value = 0.5; n.connect(g); g.connect(a.destination); n.start(); }
    else if (type === 'flip') beep(520, 300, 0.09, 'triangle', 0.08);
    else if (type === 'low') beep(300, 180, 0.12, 'square', 0.06);
    else if (type === 'hi'){ beep(660, 990, 0.35, 'sine', 0.14); setTimeout(()=>beep(880, 1320, 0.45, 'sine', 0.12), 120); }
    else if (type === 'myth'){ beep(120, 40, 0.8, 'sawtooth', 0.22); setTimeout(()=>beep(880,1760,0.9,'sine',0.16), 180); setTimeout(()=>beep(1320,2640,1.1,'sine',0.12), 380); }
    else if (type === 'burst') beep(180, 900, 0.5, 'sawtooth', 0.16);
    else if (type === 'swing'){                       // desing serangan
      const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.16, a.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++){ const p = i/d.length; d[i] = (Math.random()*2-1) * Math.pow(1-p,2) * 0.5; }
      n.buffer = b;
      const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(900, t);

    }

      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length,3) * 0.6;
      n.buffer = b; const g = a.createGain(); g.gain.value = 0.45;
      n.connect(g); g.connect(a.destination); n.start();
    }
    else if (type === 'shoot'){                       // tali busur / lontaran dilepaskan
      beep(170, 80, 0.16, 'triangle', 0.16);
      const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.1, a.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++){ const p = i/d.length; d[i] = (Math.random()*2-1) * Math.pow(1-p,3) * 0.5; }
      n.buffer = b;
      const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(3200, t);

let SFX_CTX = null;

/* ============ MUZIK LATAR & BUNYI SERANGAN ============
   Lagu dimainkan melalui Web Audio daripada memori, bukan <audio loop>.
   <audio loop> meninggalkan sela kecil di setiap pusingan (terutama MP3);
   AudioBufferSourceNode.loop pula menyambung sampel demi sampel, jadi
   lagu gelung pendek tidak lagi terasa berulang.                         */
const BGM_SLOTS = [

];
function audCtx(){
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return null;

}
/* Lagu lalai, dijana oleh pemilik app di Suno. Tidak dibenamkan dalam fail
   HTML (akan menambah belasan MB dan melambatkan setiap pembukaan app);
   sebaliknya dimuat turun SEKALI, kemudian disimpan kekal dalam IndexedDB
   supaya selepas itu ia dimainkan serta-merta, walaupun tanpa internet.
   Lagu yang guru muat naik sendiri sentiasa menggantikan lagu lalai.     */
const BGM_DEF = {
  menu: { id:'0a6c6781-15ee-4d20-9442-cf9c5ca64edc', name:'Main Theme' }
};
const bgmDefUrl = k => BGM_DEF[k] ? 'https://cdn1.suno.ai/' + BGM_DEF[k].id + '.mp3' : null;
const bgmOwn = k => { const r = (S.bgm || {})[k]; return r ? (resolveUrl(r.url) || PHOTOS['bgm:' + k] || null) : null; };
const bgmDefOn = () => !(S && S.config && S.config.bgmDef === 0);
const bgmSrc = k => bgmOwn(k) || AUD_HAVE.get('bgm_' + k) || (bgmDefOn() ? (PHOTOS['bgmdef:' + k] || bgmDefUrl(k)) : null);
/* Simpan lagu lalai yang sudah berjaya dimuat turun, sekali sahaja. */
async function bgmCacheDef(k, ab){
  if (PHOTOS['bgmdef:' + k] || !ab) return;
  try {
    const data = await new Promise((res, rej) => { const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(new Blob([ab], { type:'audio/mpeg' })); });
    PHOTOS['bgmdef:' + k] = data; await idbPut('bgmdef:' + k, data);

}

/* Titik gelung: buang senyap di awal dan hujung fail — MP3 hampir selalu
   membawa padding pengekod beberapa puluh milisaat yang menjadi "ketukan
   kosong" setiap kali lagu berpusing. Dihadkan 0.25 s supaya rehat muzik
   yang memang disengajakan tidak terpotong. */
function loopPoints(buf){
  const sr = buf.sampleRate, n = buf.length, ch = [];
  for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c));
  const loud = i => ch.some(d => Math.abs(d[i]) > 0.0015);
  const cap = Math.min(Math.floor(sr * 0.25), Math.floor(n / 4));
  let s = 0; while (s < cap && !loud(s)) s++;
  let e = n - 1; while ((n - 1 - e) < cap && !loud(e)) e--;
  if (s >= cap) s = 0;
  if ((n - 1 - e) >= cap) e = n - 1;
  return { ls: s / sr, le: (e + 1) / sr };
}
const AUD_BUF = {};
const audKey = src => src.length + ':' + src.slice(-48);
const AUD_RAW = {};
/* bunyi yang dijana terlalu perlahan (cth. run_coin, puncak −18 dB) dikuatkan sehingga puncak ≈ −2 dB; maks ×8 */
function audNorm(buf){
  let pk = 0; for (let c = 0; c < buf.numberOfChannels; c++){ const d = buf.getChannelData(c); for (let i = 0; i < d.length; i += 4){ const v = d[i] < 0 ? -d[i] : d[i]; if (v > pk) pk = v; } }
  return pk > 0 && pk < .5 ? Math.min(8, .8 / pk) : 1;
}
function audBuf(src){
  if (!src) return Promise.resolve(null);
  const k = audKey(src);
  if (AUD_BUF[k]) return AUD_BUF[k];
  const a = audCtx(); if (!a) return Promise.resolve(null);
  AUD_BUF[k] = fetch(src).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
    .then(ab => { if (/^https?:/.test(src)) AUD_RAW[k] = ab.slice(0); return ab; })
    /* decodeAudioData juga memulangkan Promise di pelayar moden; kalau tidak
       ditangkap, fail rosak menjadi ralat halaman walaupun panggilan balik
       ralat sudah dipasang. */
    .then(ab => new Promise((res, rej) => { const p = a.decodeAudioData(ab, res, rej); if (p && p.catch) p.catch(rej); }))
    .then(buf => Object.assign({ buf, norm: audNorm(buf) }, loopPoints(buf)))
    .catch(() => { delete AUD_BUF[k]; return null; });
  return AUD_BUF[k];
}

const BGM = { id:null, src:null, node:null, gain:null, el:null, preview:null, unlocked:false, tok:0 };
function bgmVol(){
  const v = S && S.config ? S.config.bgmVol : undefined;
  return (v === undefined || v === null || isNaN(+v)) ? 0.6 : clamp(+v, 0, 100) / 100;
}
const bgmOn = () => !(S && S.config && S.config.bgmOn === 0);
/* Skrin mana sedang dipaparkan? Pentas lakonan dekat di atas papan, papan
   di atas menu. */
function bgmScene(){
  for (const [sel, k] of [['#stRoot','stor'], ['#btRoot','duel'], ['#runRoot','run'], ['#escRoot','esc']]) if (document.querySelector(sel)) return k;
  return 'menu';

function bgmTarget(){
  if (BGM.preview) return BGM.preview;

  if (bgmSrc(s)) return s;

async function bgmSwitch(src){
  const a = audCtx(); if (!a) return;
  const tok = ++BGM.tok;
  BGM.src = src;
  if (BGM.node){
    const g = BGM.gain, nd = BGM.node, t = a.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 0.7);
    try { nd.stop(t + 0.75); } catch(e){}
    BGM.node = BGM.gain = null;
  }
  if (BGM.el){ const el = BGM.el; BGM.el = null; bgmFadeEl(el, 0, 600, true); }
  if (!src) return;
  const d = await audBuf(src);
  if (tok !== BGM.tok) return;                // lagu ditukar lagi semasa dinyahkod
  if (!d){
    /* Pelayan lagu tidak membenarkan app membaca baitnya (CORS) atau tiada
       internet: mainkan melalui pemain audio biasa. Masih bergelung, cuma
       mungkin ada sela kecil di hujung setiap pusingan. */
    if (/^https?:/.test(src)){
      const el = new Audio(); el.src = src; el.loop = true; el.volume = 0;
      el.play().then(() => { if (tok === BGM.tok) bgmFadeEl(el, bgmVol(), 800); else el.pause(); }).catch(() => {});
      BGM.el = el;
    }
    return;
  }
  /* Lagu lalai berjaya dimuat turun — simpan kekal untuk kali seterusnya. */
  Object.keys(BGM_DEF).forEach(k => { if (src === bgmDefUrl(k)) bgmCacheDef(k, AUD_RAW[audKey(src)]); });
  const nd = a.createBufferSource(), g = a.createGain();
  nd.buffer = d.buf; nd.loop = true; nd.loopStart = d.ls; nd.loopEnd = d.le;
  g.gain.value = 0; nd.connect(g); g.connect(a.destination);
  const t = a.currentTime;
  nd.start(t, d.ls);
  g.gain.linearRampToValueAtTime(bgmVol(), t + 0.8);
  BGM.node = nd; BGM.gain = g;
}
function bgmFadeEl(el, to, ms, stopAfter){
  const from = el.volume, t0 = performance.now();
  const step = () => {
    const p = Math.min(1, (performance.now() - t0) / ms);
    try { el.volume = Math.max(0, Math.min(1, from + (to - from) * p)); } catch(e){}
    if (p < 1) requestAnimationFrame(step); else if (stopAfter){ el.pause(); el.removeAttribute('src'); }
  };
  requestAnimationFrame(step);
}
function bgmApplyVol(){
  if (BGM.el) try { BGM.el.volume = bgmVol(); } catch(e){}
  const a = SFX_CTX; if (!a || !BGM.gain) return;
  const t = a.currentTime;
  BGM.gain.gain.cancelScheduledValues(t);

/* Identiti lagu, bukan sumbernya. Lagu lalai yang baru disimpan dalam

const bgmId = k => { if (!k) return null; const o = bgmOwn(k); return o ? 'own:' + k + ':' + audKey(o) : AUD_HAVE.has('bgm_' + k) ? 'aset:' + k : 'def:' + k; };
function bgmTick(){
  if (!BGM.unlocked) return;
  /* pratonton hanya hidup selagi bahagian Muzik dalam Tetapan terbuka */
  if (BGM.preview && !document.querySelector('[data-bgm-sec]')) BGM.preview = null;
  const k = bgmTarget();

}
function bgmInit(){
  /* Pelayar hanya membenarkan bunyi selepas sentuhan pertama pengguna. */
  const unlock = () => {
    const a = audCtx(); if (!a) return;
    if (a.state === 'suspended' && !document.hidden) a.resume();
    if (!BGM.unlocked){ BGM.unlocked = true; bgmTick(); }
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
  /* Telefon dikunci atau app ditukar: muzik berhenti, sambung bila kembali. */
  document.addEventListener('visibilitychange', () => {
    const a = SFX_CTX;
    if (BGM.el){ if (document.hidden) BGM.el.pause(); else if (BGM.unlocked) BGM.el.play().catch(() => {}); }
    if (!a) return;
    if (document.hidden) a.suspend(); else if (BGM.unlocked) a.resume();
  });

    if (!e.target || e.target.id !== 'bgmVol') return;
    S.config.bgmVol = +e.target.value;

    bgmApplyVol();
  });
  document.addEventListener('change', e => { if (e.target && e.target.id === 'bgmVol') save(true); });
  setInterval(bgmTick, 400);
}

async function audioFromFile(file, maxMB){
  if (file.size > maxMB * 1048576)
    throw new Error('Fail terlalu besar (' + (file.size / 1048576).toFixed(1) + ' MB). Had ' + maxMB + ' MB — guna lagu gelung yang pendek.');
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const d = await audBuf(data);
  if (!d) throw new Error('Format audio ini tidak dapat dibaca. Cuba MP3, OGG atau WAV.');
  return { data, dur: d.buf.duration };
}

    nx.textContent = (idx === pulls.length - 1) ? 'Selesai' : 'Seterusnya';
    flipped = false;
  }
  function doFlip(){
    const card = $('.pkone-card', bd);
    if (flipped || !card) return;
    flipped = true;
    const p = pulls[idx], t = tierOfCard(p.tier);
    card.classList.add('open');
    sfx('flip');
    const dot = $('#dot-'+idx, bd); if (dot) dot.style.background = t.color;
    setTimeout(() => {
      if (t.fx === 'low') sfx('low');
      else if (t.fx === 'hi'){
        card.classList.add('fx-hi');
        $('#pkWrap', bd).classList.add('dim');
        vibrate(35); sfx('hi');
        setTimeout(()=> $('#pkWrap', bd).classList.remove('dim'), 1500);
      } else mythTakeover(p);
      $('#pkNext', bd).style.visibility = 'visible';
    }, 280);
  }
  function nextCard(){
    if (!flipped){ doFlip(); return; }
    if (idx >= pulls.length - 1){ finishPack(); return; }
    const wrap = $('#pkOne', bd);
    wrap.classList.add('slide-out');
    setTimeout(() => { idx++; renderDots(); showCard(); }, 270);
  }
  function finishPack(){
    auto = false;
    closeModal(id);
    packSummary(sid, pulls, pack, free);
  }
  function autoPlay(){
    if (auto) return;
    auto = true;
    const step = () => {
      if (!auto) return;
      const t = tierOfCard(pulls[idx].tier);
      if (!flipped){ doFlip(); setTimeout(step, t.fx === 'low' ? 900 : t.fx === 'hi' ? 2200 : 4200); return; }
      if (idx >= pulls.length - 1){ auto = false; return; }
      nextCard();
      setTimeout(step, 420);
    };
    step();
  }
  bd.addEventListener('click', e => {
    if (e.target.closest('[data-flip]')){ doFlip(); return; }
    const b = e.target.closest('[data-pk]'); if (!b) return;
    const a = b.dataset.pk;
    if (a === 'sfx'){ SFX_ON = !SFX_ON; b.innerHTML = '<i class="fa-solid fa-volume-'+(SFX_ON?'high text-cyan':'xmark text-muted')+'"></i>'; return; }
    if (a === 'mythclose'){ $('#pkMyth', bd).classList.remove('go'); $('#pkMyth', bd).innerHTML = ''; return; }
    if (a === 'all'){ autoPlay(); return; }
    if (a === 'next'){ auto = false; nextCard(); }
  });
}
function packSummary(sid, pulls, pack, free){
  const res = grantCards(sid, pulls);
  if (!free) tpcSpend(pack.cost);
  S.packLog = S.packLog || [];
  const bestT = pulls.reduce((a,p) => tierRank(p.tier) > tierRank(a) ? p.tier : a, pulls[0].tier);
  S.packLog.unshift({ ts:Date.now(), sid, pack:pack.k, best:bestT, free: !!free });
  S.packLog = S.packLog.slice(0, 40);
  if (free){ S.freePack = S.freePack || {}; S.freePack[sid] = todayKey(); }
  save(true);
  const s = teamOf(sid);

      '<div class="num text-[9px]" style="color:'+t.color+'">'+t.name.toUpperCase()+' '+'★'.repeat(tierStars(t.k))+' · '+esc(cardSet(r.card).name)+'</div></div>' +
      (r.isNew ? '<span class="tag !text-[9px]" style="border-color:#4ADE80;color:#4ADE80">BAHARU</span>'
               : '<span class="num text-[10px] text-muted">×'+ownedCount(sid, r.card.id)+'</span>') + '</div>';
  }).join('');
  const st = collectionStats(sid);
  openModal({ icon:'fa-box-open', title:'Hasil Pack — '+s.name,
    body:'<div class="text-[12px] text-muted mb-2">'+esc(pack.name)+(free?' (percuma)':' · −'+pack.cost+' TPC')+' · koleksi '+st.have+'/'+st.total+'</div>' + rows,

           '<button class="btn btn-o clip-s flex-1" data-act="binder" data-id="'+sid+'">Lihat Koleksi</button>' });
  renderTab();
}

/* ============ DSKP, TAKWIM & RANCANGAN TAHUNAN ============
   DSKP KSSM disimpan sebagai fail berasingan (dskp/index.json + satu fail
   bagi setiap subjek-tingkatan) supaya app kekal ringan. Fail dimuat turun
   hanya untuk subjek yang guru pilih, kemudian disimpan dalam peranti.
   Takwim persekolahan → nombor minggu. Rancangan tahunan (RPT) menyusun
   SK/SP DSKP merentas minggu persekolahan secara automatik; guru boleh
   menukar mana-mana minggu. Setiap rekod PBD dikaitkan dengan topik
   minggu itu, jadi RPM dan Rumusan PBD boleh dikira mengikut tajuk.     */
const DSKP_BASES = ['./dskp/', 'https://bijakmulia.github.io/edurank/dskp/', 'https://bijakmulia.github.io/student-manager/dskp/', 'https://tembakmatiterus-web.github.io/student-manager/dskp/'];
const LS_DSKP_IDX = 'lt_dskp_idx_v1';
let DSKP_IDX = null;
const DSKP = {};                                  // id → buku DSKP yang sudah dimuat
const DSKP_WAIT = {};
async function dskpFetch(file){
  let err = null;
  for (const b of DSKP_BASES){
    try { const r = await fetch(b + file, { cache:'no-cache' }); if (r.ok) return await r.json(); err = new Error('HTTP ' + r.status); }
    catch(e){ err = e; }
  }
  throw err || new Error('Tiada sambungan');
}
async function dskpIndex(){
  if (DSKP_IDX) return DSKP_IDX;
  try { const c = localStorage.getItem(LS_DSKP_IDX); if (c) DSKP_IDX = JSON.parse(c); } catch(e){}
  const fresh = dskpFetch('index.json').then(x => { DSKP_IDX = x; try { localStorage.setItem(LS_DSKP_IDX, JSON.stringify(x)); } catch(e){} return x; });
  if (DSKP_IDX){ fresh.catch(() => {}); return DSKP_IDX; }
  return await fresh;
}
/* Muat satu buku DSKP (dari peranti dahulu, kemudian internet) */
function dskpLoad(id){
  if (!id) return Promise.resolve(null);
  if (DSKP[id]) return Promise.resolve(DSKP[id]);
  if (DSKP_WAIT[id]) return DSKP_WAIT[id];
  return DSKP_WAIT[id] = (async () => {
    let b = null, ver = '';
    try { ver = (await dskpIndex()).made || ''; } catch(e){}
    try { if (PHOTOS['dskp:' + id]) b = JSON.parse(PHOTOS['dskp:' + id]); } catch(e){}
    if (b && ver && b._v !== ver){                    // DSKP di laman lebih baharu: muat turun semula
      try { const nb = await dskpFetch(id + '.json'); b = null; PHOTOS['dskp:' + id] = ''; b = nb; b._fresh = true; } catch(e){}
    }
    if (!b || b._fresh){
      if (!b) b = await dskpFetch(id + '.json');
      delete b._fresh; b._v = ver;
      const s = JSON.stringify(b);
      PHOTOS['dskp:' + id] = s; try { await idbPut('dskp:' + id, s); } catch(e){}
    }
    dskpPrep(b);
    DSKP[id] = b; delete DSKP_WAIT[id];
    return b;
  })().catch(e => { delete DSKP_WAIT[id]; throw e; });
}
/* Senarai SK rata (mengikut urutan DSKP) dengan maklumat tajuk */
function dskpPrep(b){
  b.sk = [];
  b.u.forEach((u, ui) => u[2].forEach(k => b.sk.push({ i: b.sk.length, ui, tema: u[0], tajuk: u[1], sk: k[0], sp: k[1] })));
  return b;
}
const formName = f => /^\d+$/.test(f) ? 'Tingkatan ' + f : (f === '-' || f === 'T' ? 'Umum' : f);
const dskpLabel = (s, f) => s + ' · ' + formName(f);
const subjDskp = sj => { const x = subj(sj); return x && x.dskp ? x.dskp : ''; };
/* Buku DSKP subjek (segerak). Jika belum dimuat, mula memuat dan lukis semula bila siap. */
function subjBook(sj){
  const id = subjDskp(sj); if (!id) return null;
  if (DSKP[id]) return DSKP[id];
  dskpLoad(id).then(() => { if (S) renderTab(); }).catch(() => {});
  return null;
}
const skCode = t => { const m = String(t || '').match(/^\(?[A-Z]*\)?\s*([\d]+(?:\.\d+)*)/); return m ? m[1] : ''; };
const shortTxt = (t, n) => { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };

/* ---------- TAKWIM PERSEKOLAHAN ----------
   Kalendar Akademik 2026 (Surat Siaran KPM Bil. 3/2025). Kumpulan A
   (Kedah, Kelantan, Terengganu) minggu Ahad–Khamis; Kumpulan B Isnin–Jumaat. */
const TAKWIM_PRESET = {
  2026: {
    B: { terms:[['2026-01-12','2026-05-22'],['2026-06-08','2026-12-04']],
         cuti:[['Cuti Penggal 1','2026-03-21','2026-03-29'],['Cuti Pertengahan Tahun','2026-05-23','2026-06-07'],['Cuti Penggal 2','2026-08-29','2026-09-06'],['Cuti Akhir Tahun','2026-12-05','2026-12-31']] },
    A: { terms:[['2026-01-11','2026-05-21'],['2026-06-07','2026-12-03']],
         cuti:[['Cuti Penggal 1','2026-03-20','2026-03-28'],['Cuti Pertengahan Tahun','2026-05-22','2026-06-06'],['Cuti Penggal 2','2026-08-28','2026-09-05'],['Cuti Akhir Tahun','2026-12-04','2026-12-31']] }
  },
  /* Kalendar Akademik 2027 (Surat Siaran KPM Bil. 1/2026, 2 Okt 2026). Kedua-dua kumpulan dibuka 4 Jan. */
  2027: {
    B: { terms:[['2027-01-04','2027-05-21'],['2027-06-07','2027-12-03']],
         cuti:[['Cuti Penggal 1','2027-03-06','2027-03-14'],['Cuti Pertengahan Tahun','2027-05-22','2027-06-06'],['Cuti Penggal 2','2027-08-28','2027-09-05'],['Cuti Akhir Tahun','2027-12-04','2027-12-31']] },
    A: { terms:[['2027-01-04','2027-05-20'],['2027-06-06','2027-12-02']],
         cuti:[['Cuti Penggal 1','2027-03-05','2027-03-13'],['Cuti Pertengahan Tahun','2027-05-21','2027-06-05'],['Cuti Penggal 2','2027-08-27','2027-09-04'],['Cuti Akhir Tahun','2027-12-03','2027-12-31']] }
  }
};
const TK_GRP = { A:'Kumpulan A — Kedah, Kelantan, Terengganu (Ahad–Khamis)', B:'Kumpulan B — negeri lain (Isnin–Jumaat)' };
function takwim(){
  const yr = new Date().getFullYear();
  const latest = Math.max.apply(null, Object.keys(TAKWIM_PRESET).map(Number));
  if (!S.takwim || !S.takwim.terms){
    const y = TAKWIM_PRESET[yr] ? yr : latest, p = TAKWIM_PRESET[y].B;
    S.takwim = { year: y, grp:'B', terms: p.terms.map(x => x.slice()), cuti: p.cuti.map(x => x.slice()) };
  }
  // tahun baharu bermula: tukar sendiri ke takwim tahun semasa (kumpulan A/B dikekalkan)
  if (S.takwim.year < yr && TAKWIM_PRESET[yr] && !S.takwim.manualYear) takwimPreset(yr, S.takwim.grp || 'B');
  return S.takwim;
}
function takwimPreset(year, grp){
  const p = (TAKWIM_PRESET[year] || {})[grp]; if (!p) return false;
  S.takwim = { year, grp, terms: p.terms.map(x => x.slice()), cuti: p.cuti.map(x => x.slice()) };
  return true;
}
const kd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addDays = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return kd(d); };
let WEEKS_MEMO = { key:'', weeks:[] };
/* Minggu persekolahan: setiap minggu bermula pada hari pertama sekolah
   (Isnin / Ahad), minggu yang kelima-lima hari sekolahnya cuti dilangkau. */
function schoolWeeks(){
  const tk = takwim(), key = JSON.stringify(tk);
  if (WEEKS_MEMO.key === key) return WEEKS_MEMO.weeks;
  const first = tk.grp === 'A' ? 0 : 1;              // Ahad / Isnin
  const inCuti = k => tk.cuti.some(c => k >= c[1] && k <= c[2]);
  const out = [];
  tk.terms.forEach((t, ti) => {
    let d = new Date(t[0] + 'T00:00:00');
    d.setDate(d.getDate() - ((d.getDay() - first + 7) % 7));   // undur ke awal minggu
    for (let k = kd(d); k <= t[1]; k = addDays(k, 7)){
      const days = [0,1,2,3,4].map(i => addDays(k, i)).filter(x => x >= t[0] && x <= t[1] && !inCuti(x));
      if (days.length) out.push({ n: out.length + 1, start: days[0], end: days[days.length - 1], wk: k, term: ti + 1 });
    }
  });
  WEEKS_MEMO = { key, weeks: out };
  return out;
}
/* Minggu bagi satu tarikh: { n, start, end } · atau { cuti: nama } · atau null */
function weekOf(k){
  const ws = schoolWeeks(), tk = takwim();
  const c = tk.cuti.find(x => k >= x[1] && k <= x[2]);
  if (c) return { cuti: c[0], start: c[1], end: c[2] };
  for (const w of ws) if (k >= w.wk && k <= addDays(w.wk, 6)) return w;
  if (ws.length && k < ws[0].start) return { before: true };
  return null;
}
const fmtShort = k => { const [y, m, d] = k.split('-'); return +d + ' ' + ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'][+m - 1]; };

/* ---------- RANCANGAN TAHUNAN (RPT) ----------
   Auto: SK diagih mengikut urutan DSKP, berat = bilangan SP, merentas semua
   minggu persekolahan. Satu SK boleh merentas beberapa minggu dan satu
   minggu boleh mengandungi beberapa SK. Guru boleh menukar mana-mana minggu. */
/* Tukaran minggu disimpan berasingan bagi setiap tahun takwim (minggu 5 tahun 2026 ≠ minggu 5 tahun 2027) */
const rptOf = sj => {
  S.rpt = S.rpt || {};
  const r = S.rpt[sj] = S.rpt[sj] || {}, y = takwim().year;
  r.oy = r.oy || {};
  if (r.over && !r.oy[2026]) r.oy[2026] = r.over;             // data lama (sebelum tukaran ikut tahun)
  delete r.over;
  r.oy[y] = r.oy[y] || {};
  return { over: r.oy[y] };
};
let PLAN_MEMO = {};
function autoPlan(b, W){
  const plan = Array.from({ length: W + 1 }, () => []);
  const wts = b.sk.map(k => Math.max(1, k.sp.length)), tot = wts.reduce((a, x) => a + x, 0);
  let cum = 0;
  b.sk.forEach((k, i) => {
    const a = Math.floor(cum / tot * W) + 1, z = Math.max(a, Math.ceil((cum + wts[i]) / tot * W));
    for (let w = a; w <= Math.min(z, W); w++) plan[w].push(i);
    cum += wts[i];
  });
  return plan;
}
function planOf(sj){
  const b = subjBook(sj); if (!b) return null;
  const ws = schoolWeeks(), over = rptOf(sj).over;
  const key = sj + '|' + ws.length + '|' + JSON.stringify(over) + '|' + b.sk.length;
  if (PLAN_MEMO[sj] && PLAN_MEMO[sj].key === key) return PLAN_MEMO[sj].plan;
  const plan = autoPlan(b, ws.length);
  Object.keys(over).forEach(w => { if (plan[+w]) plan[+w] = over[w].filter(i => b.sk[i]); });
  PLAN_MEMO[sj] = { key, plan };
  return plan;
}
/* Topik pelajaran kelas pada satu tarikh: tukaran guru untuk hari itu, atau ikut RPT */
const lessonKey = (cid, sj, date) => cid + '|' + sj + '|' + date;
function lessonTopic(cid, sj, date){
  const b = subjBook(sj); if (!b) return null;
  const w = weekOf(date), own = (S.lesson || {})[lessonKey(cid, sj, date)];
  const idx = own ? own : (w && w.n ? (planOf(sj) || [])[w.n] || [] : []);
  const sks = idx.map(i => b.sk[i]).filter(Boolean);
  if (!sks.length) return { w, sks:[], own: !!own };
  return { w, sks, own: !!own, units: Array.from(new Set(sks.map(k => k.ui))) };
}
/* Topik sesuatu rekod: snapshot semasa disimpan, jika tiada kira semula dari RPT */
function recTopic(sid, sj, date){
  const r = ((S.records[sid] || {})[sj] || {})[date];
  if (r && r.topic) return r.topic;
  const s = stu(sid); if (!s) return null;
  const t = lessonTopic(s.classId, sj, date);
  return t && t.sks.length ? topicSnap(t) : null;
}
const topicSnap = t => ({ w: t.w && t.w.n || 0, s: t.sks.map(k => k.i), u: t.units, t: t.sks.map(k => skCode(k.sk) || shortTxt(k.sk, 30)).join(', '), tj: t.sks[0].tajuk });
/* dipanggil oleh commitEval / commitForceTP / markAttendance */
function stampTopic(rec, cid, sj, date){
  const t = lessonTopic(cid, sj, date);
  if (t && t.sks.length) rec.topic = topicSnap(t); else if (rec.topic && !subjDskp(sj)) delete rec.topic;
}

/* ---------- PEMILIH SUBJEK DSKP ---------- */
async function dskpPicker(title, cb){
  let idx;

  const body = q => {

      return '<button class="text-[12px] text-cyan mb-2" style="background:none;border:0;padding:0" data-back="1"><i class="fa-solid fa-chevron-left"></i> Semua subjek</button>' +

    }
    const ql = (q || '').toLowerCase();

    return '<div class="mt-2" style="max-height:52vh;overflow-y:auto">' + list.slice(0, 150).map(n =>
      '<button class="btn clip-s w-full mb-1 !py-2 text-left text-[12px] flex items-center gap-2" data-n="' + esc(n) + '"><span class="flex-1">' + esc(n) + '</span>' +

function takwimSet(key, pos, v){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  const tk = takwim();
  if (key[0] === 't') tk.terms[+key.slice(1)][pos] = v; else tk.cuti[+key.slice(1)][pos + 1] = v;
  PLAN_MEMO = {}; save(true); renderTab();
}

/* ---------- TP mengikut tajuk DSKP (RPM automatik) ---------- */
function unitTP(sid, sj, ui){
  const days = ((S.records[sid] || {})[sj]) || {}, tps = [];
  Object.keys(days).forEach(d => { const t = recTopic(sid, sj, d); if (t && (t.u || []).indexOf(ui) >= 0) tps.push(days[d].tpAwarded || calcTP(rateOf(days[d]))); });
  return tps.length ? clamp(Math.round(tps.reduce((a, x) => a + x, 0) / tps.length), 1, 6) : 0;
}
/* Tajuk yang sudah ada penilaian bagi kelas aktif (urutan DSKP) */
function taughtUnits(cid, sj){
  const set = new Set();
  studentsOf(cid).forEach(s => Object.keys(((S.records[s.id] || {})[sj]) || {}).forEach(d => { const t = recTopic(s.id, sj, d); (t && t.u || []).forEach(u => set.add(u)); }));
  return Array.from(set).sort((a, b) => a - b);
}

/* ---------- RUMUSAN PBD (muat turun) ----------
   Semua data PBD kelas & subjek aktif dihimpun dalam satu laporan:
   ringkasan murid, TP mengikut tajuk DSKP, log topik diajar & kehadiran,
   bertarikh pada saat dimuat turun.                                  */
function pbdSummary(){
  const cid = S.ui.activeClassId, sj = S.ui.activeSubjectId, b = subjBook(sj);
  const list = studentsOf(cid), now = new Date(), wk = weekOf(todayKey());
  const units = b ? taughtUnits(cid, sj) : [];
  const attDs = attDates(list);
  const rows = list.map(s => {
    const st = stats(s.id, sj), ses = sessionsOf(s.id, sj), a = attSummary(s.id, attDs);
    return { s, st, last: ses.length ? ses[0].date : '', att: a, units: units.map(u => unitTP(s.id, sj, u)) };
  });
  const dates = Array.from(new Set([].concat.apply([], list.map(s => Object.keys(((S.records[s.id] || {})[sj]) || {}))))).sort();
  const log = dates.map(d => {
    const n = list.filter(s => ((S.records[s.id] || {})[sj] || {})[d]).length;
    const t = list.map(s => recTopic(s.id, sj, d)).find(Boolean);
    return { d, n, t };
  });
  return { cid, sj, b, list, rows, units, log, now, wk, attDs };
}

/* ============ REFLEKSI PdP HARIAN (gaya RPH) ============
   Dijana automatik untuk satu kelas + subjek + tarikh daripada data sebenar:
   topik DSKP, kehadiran, TP setiap murid (penguasaan), lencana sikap yang
   diterima hari itu, dan perbandingan dengan sesi sebelumnya. Guru boleh
   menambah catatan sendiri; catatan disimpan bersama tarikh itu.         */
const reflKey = (cid, sj, date) => cid + '|' + sj + '|' + date;
const namesList = arr => arr.length <= 2 ? arr.join(' dan ') : arr.slice(0, -1).join(', ') + ' dan ' + arr[arr.length - 1];
function reflectData(cid, sj, date){
  const list = studentsOf(cid);
  const tpOf = r => r ? (r.tpAwarded || calcTP(rateOf(r))) : 0;
  const recs = list.map(s => { const r = ((S.records[s.id] || {})[sj] || {})[date]; return { s, r, tp: tpOf(r) }; });
  const done = recs.filter(x => x.r);
  const att = {};
  list.forEach(s => { const r = ((S.records[s.id] || {})[sj] || {})[date]; att[s.id] = attGet(s.id, date) || (r && r.attended ? 'H' : ''); });
  const ac = { H:[], L:[], T:[], C:[] };
  list.forEach(s => { if (att[s.id]) ac[att[s.id]].push(s); });
  const attKnown = list.filter(s => att[s.id]).length;
  const logs = (S.badgeLog || []).filter(l => l.d === date && list.some(s => s.id === l.sid));
  const bb = {};
  logs.forEach(l => { const b = S.badges.find(x => x.id === l.b); if (!b) return; (bb[b.id] = bb[b.id] || { b, kind: badgeKind(b), sids: [] }); if (bb[b.id].sids.indexOf(l.sid) < 0) bb[b.id].sids.push(l.sid); });
  const from = addDays(date, -30);
  const negCount = sid => (S.badgeLog || []).filter(l => l.sid === sid && l.d > from && l.d <= date && badgeKind(S.badges.find(x => x.id === l.b)) === 'neg').length;
  const allDates = Array.from(new Set([].concat.apply([], list.map(s => Object.keys(((S.records[s.id] || {})[sj]) || {}))))).sort();
  const pd = allDates.filter(d => d < date).pop();
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const prevTPs = pd ? list.map(s => tpOf(((S.records[s.id] || {})[sj] || {})[pd])).filter(Boolean) : [];
  const t = subjDskp(sj) ? lessonTopic(cid, sj, date) : null;
  const sks = t && t.sks.length ? t.sks : null;
  let next = null;
  if (sks && t.w && t.w.n){
    const plan = planOf(sj) || [], b = subjBook(sj), now = new Set(sks.map(k => k.i));
    for (let w = t.w.n + 1; w < plan.length && !next; w++){ const n = (plan[w] || []).filter(i => !now.has(i)); if (n.length) next = { w, sk: b.sk[n[0]] }; }
  }
  return { cid, sj, date, list, recs, done, ac, attKnown, bb: Object.values(bb), negCount, pd, prevAvg: avg(prevTPs), avg: avg(done.map(x => x.tp)), t, sks, next };
}
/* Teks refleksi: senarai bahagian { h, lines } — sama untuk paparan, salin & cetak */
function reflectSections(D){
  const N = D.list.length, nd = D.done.length, nm = x => x.s.name;
  const secs = [];
  const dt = new Date(D.date + 'T00:00:00'), w = weekOf(D.date);
  const info = [DAY_NAMES[dt.getDay()] + ', ' + fmtDate(D.date) + (w && w.n ? ' · Minggu ' + w.n : w && w.cuti ? ' · ' + w.cuti : ''),
    clsName(D.cid) + ' · ' + subjName(D.sj)];
  if (D.sks){
    info.push('Tema: ' + (D.sks[0].tema || '-'));
    info.push('Tajuk: ' + (D.sks[0].tajuk || '-'));
    D.sks.forEach(k => { info.push('SK ' + k.sk); k.sp.forEach(p => info.push('   SP ' + p)); });
  }
  secs.push({ h: 'MAKLUMAT PdP', lines: info });

  // 1. Kehadiran
  const A = D.ac, hadir = A.H.length + A.L.length, att = [];
  if (D.attKnown){
    att.push(hadir + '/' + N + ' murid hadir (' + Math.round(hadir / N * 100) + '%).');
    if (A.L.length) att.push('Lewat: ' + namesList(A.L.map(s => s.name)) + '.');
    if (A.T.length) att.push('Tidak hadir: ' + namesList(A.T.map(s => s.name + (attNoteOf(s.id, D.date) ? ' (' + attNoteOf(s.id, D.date) + ')' : ''))) + '.');
    if (A.C.length) att.push('Cuti/MC: ' + namesList(A.C.map(s => s.name + (attNoteOf(s.id, D.date) ? ' (' + attNoteOf(s.id, D.date) + ')' : ''))) + '.');
    if (!A.T.length && !A.C.length) att.push('Kehadiran penuh — semua murid mengikuti PdP.');
  } else att.push('Kehadiran belum direkod untuk tarikh ini (tab HADIR).');
  secs.push({ h: '1. KEHADIRAN', lines: att });

  // 2. Pencapaian objektif & penguasaan
  const ach = [];
  if (nd){
    const ok = D.done.filter(x => x.tp >= 3), pct = Math.round(ok.length / nd * 100);
    const dist = [1,2,3,4,5,6].map(k => 'TP' + k + ': ' + D.done.filter(x => x.tp === k).length).join(' · ');
    const status = pct >= 80 ? 'Objektif pembelajaran TERCAPAI' : pct >= 50 ? 'Objektif pembelajaran SEBAHAGIAN tercapai' : 'Objektif pembelajaran BELUM tercapai';
    ach.push(status + ': ' + ok.length + '/' + nd + ' murid (' + pct + '%) mencapai sekurang-kurangnya TP3' + (nd < N ? ' (' + (N - nd) + ' murid tidak dinilai)' : '') + '.');
    ach.push('Taburan penguasaan — ' + dist + '. Purata TP kelas ' + D.avg.toFixed(1) +
      (D.prevAvg ? (D.avg > D.prevAvg + 0.2 ? ', meningkat berbanding sesi lepas (' + D.prevAvg.toFixed(1) + ' pada ' + fmtDate(D.pd) + ')' :
                    D.avg < D.prevAvg - 0.2 ? ', menurun berbanding sesi lepas (' + D.prevAvg.toFixed(1) + ' pada ' + fmtDate(D.pd) + ')' :
                    ', setara dengan sesi lepas (' + D.prevAvg.toFixed(1) + ')') : '') + '.');
    const top = D.done.filter(x => x.tp >= 5), low = D.done.filter(x => x.tp <= 2);
    if (top.length) ach.push('Menguasai dengan cemerlang (TP5–TP6): ' + namesList(top.map(nm)) + '.');
    if (low.length) ach.push('Belum menguasai (TP1–TP2): ' + namesList(low.map(nm)) + '.');
  } else ach.push('Tiada penilaian PBD direkod untuk tarikh ini.');
  secs.push({ h: '2. PENCAPAIAN OBJEKTIF & PENGUASAAN', lines: ach });

  // 3. Sikap & disiplin (berdasarkan lencana)
  const sk = [], pos = D.bb.filter(x => x.kind === 'pos'), neg = D.bb.filter(x => x.kind === 'neg'), oth = D.bb.filter(x => !x.kind);
  const who = x => namesList(x.sids.map(id => (stu(id) || {}).name).filter(Boolean));
  pos.forEach(x => sk.push('👍 ' + x.b.name + ': ' + who(x) + '.'));
  oth.forEach(x => sk.push('• ' + x.b.name + ': ' + who(x) + '.'));
  neg.forEach(x => sk.push('⚠️ ' + x.b.name + ': ' + who(x) + '.'));
  const rep = [];
  neg.forEach(x => x.sids.forEach(id => { const n = D.negCount(id); if (n >= 3 && rep.indexOf(id) < 0) rep.push(id); }));
  if (!D.bb.length) sk.push('Tiada lencana sikap diberi hari ini. Murid secara umumnya berkelakuan baik sepanjang PdP.');
  else if (!neg.length) sk.push('Tiada isu disiplin direkodkan. Suasana PdP kondusif.');
  if (rep.length) sk.push('Isu berulang (3 kali atau lebih dalam 30 hari): ' + namesList(rep.map(id => (stu(id) || {}).name + ' (' + D.negCount(id) + ' kali)')) + '.');
  secs.push({ h: '3. SIKAP & DISIPLIN MURID', lines: sk });

  // 4. Tindakan susulan
  const act = [];
  if (nd){
    const pct = Math.round(D.done.filter(x => x.tp >= 3).length / nd * 100);
    const low = D.done.filter(x => x.tp <= 2), top = D.done.filter(x => x.tp >= 5);
    if (pct < 50) act.push('PdP topik ini akan DIULANG pada sesi berikutnya dengan pendekatan berbeza (contoh: demonstrasi, bahan konkrit, pembelajaran berpasangan) sebelum beralih ke SK seterusnya.');
    else if (pct < 80) act.push('Pengukuhan ringkas topik ini pada awal sesi berikutnya sebelum meneruskan ke SK seterusnya.');
    else act.push('PdP diteruskan ke SK seterusnya mengikut RPT.');
    if (low.length) act.push('Aktiviti PEMULIHAN / bimbingan individu untuk ' + namesList(low.map(nm)) + ' — latihan berperingkat dan soal jawab lisan.');
    if (top.length) act.push('Aktiviti PENGAYAAN untuk ' + namesList(top.map(nm)) + ' — tugasan KBAT / membimbing rakan sebaya.');
  }
  if (D.ac.T.length || D.ac.C.length) act.push('Murid yang tidak hadir perlu diberi salinan nota / latihan topik ini.');
  if (D.bb.some(x => x.kind === 'neg')) act.push('Nasihat dan pemantauan sikap murid yang terlibat' + (rep.length ? '; isu berulang dimaklumkan kepada guru kelas / kaunselor / ibu bapa.' : '.'));
  if (D.next) act.push('Topik seterusnya (Minggu ' + D.next.w + '): ' + D.next.sk.sk + '.');
  if (!act.length) act.push('—');
  secs.push({ h: '4. TINDAKAN SUSULAN', lines: act });
  return secs;
}

function dskpScopeOpts(sj){
  const b = subjBook(sj); if (!b) return [];

  const out = [];
  if (t && t.sks.length) out.push({ v:'now', label:'Minggu ini: ' + t.sks.map(k => skCode(k.sk) || shortTxt(k.sk, 20)).join(', '), sks: t.sks });
  b.u.forEach((u, ui) => out.push({ v:'u' + ui, label: shortTxt((u[1] || u[0] || 'Tajuk ' + (ui + 1)), 60), sks: b.sk.filter(k => k.ui === ui) }));
  const one = /^[kp]/.test(S.ui.tqScope || '') && dskpScope(sj, S.ui.tqScope);   // skop satu SK / satu SP (dari Bank Soalan)
  if (one) out.unshift(one);
  return out;

/* Skop tepat: 'now' | 'u<tajuk>' | 'k<SK>' | 'p<SK>_<SP>' (indeks dalam b.sk) */
function dskpScope(sj, v){
  const b = subjBook(sj); if (!b || !v) return null;
  let m = /^k(\d+)$/.exec(v);
  if (m){ const k = b.sk[+m[1]]; return k ? { v, label:'SK ' + (skCode(k.sk) || shortTxt(k.sk, 30)) + ' · ' + shortTxt(k.sk, 50), sks:[k] } : null; }
  m = /^p(\d+)_(\d+)$/.exec(v);
  if (m){ const k = b.sk[+m[1]], p = k && k.sp[+m[2]]; return p ? { v, label:'SP ' + (skCode(p) || '') + ' · ' + shortTxt(p, 50), sks:[Object.assign({}, k, { sp:[p] })] } : null; }
  return dskpScopeOpts(sj).find(z => z.v === v) || null;
}

}

    const d = FB.mod.d, ref = k => d.ref(FB.db, 'ipbd_share/__live/' + k);
    return { kind: 'fb', set: (k, v) => { try { d.set(ref(k), v).catch(() => {}); } catch(e){} }, on: (k, cb) => d.onValue(ref(k), s => cb(s.val())) };
  }
  if (!('BroadcastChannel' in window)) return null;
  if (!LV_BC){
    LV_BC = { ch: new BroadcastChannel('edurank-live'), subs: {} };
    LV_BC.ch.onmessage = e => (LV_BC.subs[e.data.k] || []).slice().forEach(cb => cb(e.data.v));
  }
  return { kind: 'bc', set: (k, v) => LV_BC.ch.postMessage({ k, v }),
    on: (k, cb) => { (LV_BC.subs[k] = LV_BC.subs[k] || []).push(cb); return () => { LV_BC.subs[k] = (LV_BC.subs[k] || []).filter(f => f !== cb); }; } };
}
const lvId = () => Math.random().toString(36).slice(2, 10);
const lvEsc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const lvClean = h => h.replace(/\ssrc="data:image\/[^"]*"/g, '');          // gambar kad bercetak (data:) dilukis semula oleh penonton
const lvHtml = n => n.nodeType === 1 ? lvClean(n.outerHTML) : n.nodeType === 3 ? lvEsc(n.data) : '<!---->';
const lvAttrs = n => Array.from(n.attributes, a => [a.name, a.value]).filter(([k, v]) => !(k === 'src' && /^data:image\//.test(v)));
function lvSameAttrs(a, b){
  if (a.attributes.length !== b.attributes.length) return false;
  for (const x of b.attributes) if (a.getAttribute(x.name) !== x.value) return false;
  return true;
}
/* Banding salinan terakhir (a) dengan DOM semasa (b) → senarai tampalan */
function lvDiff(a, b, path, out){
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName){ out.push(['o', path, lvHtml(b)]); return; }
  if (b.nodeType !== 1){ if (a.data !== b.data) out.push(['t', path, b.data]); return; }
  if (!lvSameAttrs(a, b)) out.push(['a', path, lvAttrs(b)]);
  const ac = a.childNodes, bc = b.childNodes, n = Math.min(ac.length, bc.length);
  for (let i = 0; i < n; i++) lvDiff(ac[i], bc[i], path.concat(i), out);
  if (bc.length > ac.length){ let h = ''; for (let i = n; i < bc.length; i++) h += lvHtml(bc[i]); out.push(['+', path, h]); }
  else if (ac.length > bc.length) out.push(['-', path, bc.length]);
}
const lvFrag = html => { const t = document.createElement('template'); t.innerHTML = html; return t.content; };
function lvApply(box, d){
  (d || []).forEach(x => {
    const [op, path, v] = x;
    let n = box.firstChild;
    for (const i of (path || [])){ if (!n) break; n = n.childNodes[i]; }
    if (!n) throw new Error('path');
    if (op === 'o'){ if (!(path || []).length) box.innerHTML = v; else n.replaceWith(lvFrag(v)); }
    else if (op === 't') n.data = v == null ? '' : v;
    else if (op === 'a'){ Array.from(n.attributes).forEach(a => n.removeAttribute(a.name)); (v || []).forEach(([k, val]) => { try { n.setAttribute(k, val == null ? '' : val); } catch(e){} }); }
    else if (op === '+') n.appendChild(lvFrag(v || ''));
    else if (op === '-'){ while (n.childNodes.length > (v || 0)) n.lastChild.remove(); }
  });
}
/* RTCPeerConnection: tunggu semua calon ICE (tanpa trickle — satu mesej sahaja) */
const lvGather = pc => new Promise(r => {
  if (pc.iceGatheringState === 'complete') return r();
  const t = setTimeout(r, 2500);
  pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete'){ clearTimeout(t); r(); } });
});

/* ---------- HOS: peranti yang sedang bermain ---------- */
function liveHost(g, root, opts){
  opts = opts || {};
  if (!lvCastOn()) return null;
  const T = lvT(); if (!T) return null;
  const sid = lvId(), canvas = opts.canvas || null, pcs = {}, offs = [];
  let seq = 0, shadow = root.cloneNode(true), jpg = false, lastJ = 0, ended = false;
  const meta = x => Object.assign({ sid, by: CLIENT_ID, g, title: opts.title || '', fit: canvas ? 1 : 0,
    w: root.clientWidth || innerWidth, h: root.clientHeight || innerHeight, t: Date.now() }, x || {});
  const flush = () => {
    if (!root.isConnected) return;
    const out = []; lvDiff(shadow, root, [], out);
    if (!out.length) return;
    seq++; T.set('p', { sid, s: seq, d: out }); shadow = root.cloneNode(true);
  };
  const key = () => { flush(); T.set('k', { sid, s: seq, html: lvClean(shadow.outerHTML) }); };
  async function offer(vid){
    if (!canvas || pcs[vid] || !window.RTCPeerConnection || !canvas.captureStream) return;
    try {
      const pc = pcs[vid] = new RTCPeerConnection(LV_ICE), st = canvas.captureStream(20);
      st.getTracks().forEach(tr => pc.addTrack(tr, st));
      await pc.setLocalDescription(await pc.createOffer());
      await lvGather(pc);
      if (ended) return pc.close();
      T.set('o_' + vid, { sid, sdp: pc.localDescription.sdp });
      const off = T.on('a_' + vid, v => { if (v && v.sid === sid && v.sdp && pc.signalingState === 'have-local-offer') pc.setRemoteDescription({ type: 'answer', sdp: v.sdp }).catch(() => {}); });
      offs.push(off);
    } catch(e){ console.warn('live rtc', e); }
  }
  T.set('cur', meta()); key();
  const tick = setInterval(flush, 180), hb = setInterval(() => T.set('cur', meta()), 4000), kf = setInterval(key, 15000);
  offs.push(T.on('want', v => {
    if (!v || v.sid !== sid || ended) return;
    key();
    if (v.vid && v.rtc) offer(v.vid);
    if (v.jpg) jpg = true;
  }));
  /* JPEG gantian: dipanggil oleh game selepas setiap R.render (penimbal WebGL masih sah) */
  const jc = document.createElement('canvas');
  LIVE.frame = cv => {
    if (!jpg || ended) return;
    const now = performance.now(); if (now - lastJ < 420) return; lastJ = now;
    try {
      const w = 480, h = Math.round(w * cv.height / cv.width); jc.width = w; jc.height = h;
      jc.getContext('2d').drawImage(cv, 0, 0, w, h);
      T.set('f', { sid, d: jc.toDataURL('image/jpeg', .5) });
    } catch(e){}
  };
  const H = LIVE.host = {
    sid,
    end(){
      if (ended) return; ended = true;
      flush();
      if (root.isConnected) T.set('k', { sid, s: seq, html: lvClean(shadow.outerHTML) });
      T.set('cur', meta({ end: 1 }));
      clearInterval(tick); clearInterval(hb); clearInterval(kf);
      offs.forEach(f => { try { f(); } catch(e){} });
      Object.values(pcs).forEach(pc => { try { pc.close(); } catch(e){} });
      if (LIVE.host === H){ LIVE.host = null; LIVE.frame = null; }
    }
  };
  return H;
}

/* ---------- PENONTON: tablet / projektor ---------- */
const LVW = { T: null, kind: '', off: null, seen: {}, closed: {}, view: null };
function liveWatch(){
  const T = lvT(), kind = T ? T.kind : '';
  if (kind === LVW.kind) return;
  if (LVW.off){ try { LVW.off(); } catch(e){} LVW.off = null; }
  LVW.kind = kind; LVW.T = T; LVW.seen = {};
  if (!T) return;
  let first = true;
  LVW.off = T.on('cur', v => {
    const init = first; first = false;
    if (!v || v.by === CLIENT_ID) return;
    const V = LVW.view;
    if (V && V.sid === v.sid){ V.meta(v); return; }
    const prev = LVW.seen[v.sid]; LVW.seen[v.sid] = v.t;
    if (v.end || LVW.closed[v.sid] || !lvViewOn()) return;
    // dibuka hanya bila siaran terbukti hidup (mesej baharu, bukan sisa lama)
    if (init && prev === undefined) return;
    if (prev !== undefined && prev === v.t) return;
    if (RUN || ESC || STOR || document.getElementById('btRoot') || document.getElementById('kmRoot') || document.getElementById('kmJoin') || document.getElementById('escRoot')) return;   // peranti ini sendiri sedang bermain
    liveOpen(v);
  });
}
function liveOpen(v){
  if (LVW.view) LVW.view.close();
  const T = LVW.T, sid = v.sid, vid = lvId(), offs = [];
  let last = -1, askT = 0, pc = null, fb = null, dead = null, fin = null, closed = false;
  const el = document.createElement('div');
  el.id = 'lvView';
  el.innerHTML =
    '<style>#lvView{position:fixed;inset:0;z-index:990;background:#000;overflow:hidden;user-select:none}' +
    '#lvStage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}' +
    '#lvMirror{position:absolute;inset:0;transform:translateZ(0);pointer-events:none;overflow:hidden}' +
    '#lvView.fit #lvMirror > *{background:transparent!important}#lvView.fit #lvMirror canvas{visibility:hidden}' +
    '#lvVid,#lvImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}' +
    '.lv-bar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border-radius:999px;' +
      'background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.35;transition:opacity .3s}' +
    '.lv-bar:hover{opacity:1}.lv-bar .dot{width:9px;height:9px;border-radius:50%;background:#EF4444;animation:lvDot 1.2s infinite}' +
    '.lv-bar button{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff}' +
    '@keyframes lvDot{50%{opacity:.25}}</style>' +
    '<div id="lvStage"><video id="lvVid" playsinline muted autoplay></video><img id="lvImg" alt=""><div id="lvMirror"></div></div>' +
    '<div class="lv-bar"><span class="dot"></span><span id="lvTxt">LANGSUNG</span><button id="lvX" title="Tutup tayangan"><i class="fa-solid fa-xmark"></i></button></div>';
  document.body.appendChild(el); lockBody();
  const $v = s => el.querySelector(s), mirror = $v('#lvMirror'), stage = $v('#lvStage'), vidEl = $v('#lvVid'), img = $v('#lvImg');
  let M = v;
  const layout = () => {
    const W = el.clientWidth, Hh = el.clientHeight;
    if (M.fit && M.w && M.h){
      const k = Math.min(W / M.w, Hh / M.h);
      Object.assign(stage.style, { width: M.w + 'px', height: M.h + 'px', transform: 'translate(' + (W - M.w * k) / 2 + 'px,' + (Hh - M.h * k) / 2 + 'px) scale(' + k + ')' });
    } else Object.assign(stage.style, { width: W + 'px', height: Hh + 'px', transform: 'none' });
  };
  const txt = t => { $v('#lvTxt').textContent = t; };
  const label = () => txt('LANGSUNG' + (M.title ? ' · ' + M.title.toUpperCase() : ''));
  const want = x => { const now = Date.now(); if (!x && now - askT < 1500) return; askT = now; T.set('want', Object.assign({ sid, vid, t: now }, x || {})); };
  const V = LVW.view = {
    sid,
    meta(n){
      M = n; el.classList.toggle('fit', !!n.fit); layout(); label();
      clearTimeout(dead);
      // hos menutup game → tayangan di projektor ditutup sama (keputusan akhir dipapar selagi hos masih di skrin keputusan)
      if (n.end){ txt('TAMAT'); clearTimeout(fin); fin = setTimeout(V.close, 1200); return; }
      dead = setTimeout(() => { txt('SAMBUNGAN TERPUTUS…'); fin = setTimeout(V.close, 6000); }, 15000);
    },
    close(){
      if (closed) return; closed = true;
      LVW.closed[sid] = 1; if (LVW.view === V) LVW.view = null;
      offs.forEach(f => { try { f(); } catch(e){} });
      clearTimeout(dead); clearTimeout(fin); clearTimeout(fb);
      if (pc) try { pc.close(); } catch(e){}
      el.remove(); unlockBody();
    }
  };
  if (v.g === 'duel' && typeof btStyle === 'function') btStyle();
  if (v.g === 'stor' && typeof stStyle === 'function') stStyle();
  if (v.g === 'kombo' && typeof kmStyle === 'function') kmStyle();
  const kcFill = () => mirror.querySelectorAll('img[data-kc]:not([src])').forEach(im => kadBake(cardById(im.dataset.kc)).then(u => { if (!im.getAttribute('src')) im.src = u; }));
  window.addEventListener('resize', layout);
  offs.push(() => window.removeEventListener('resize', layout));
  $v('#lvX').onclick = () => V.close();
  offs.push(T.on('k', k => { if (!k || k.sid !== sid) return; try { mirror.innerHTML = k.html || ''; last = k.s || 0; kcFill(); } catch(e){} }));
  offs.push(T.on('p', p => {
    if (!p || p.sid !== sid || p.s <= last) return;
    if (last < 0 || p.s !== last + 1) return want();
    try { lvApply(mirror, p.d); last = p.s; kcFill(); } catch(e){ want(); }
  }));
  if (v.fit){
    offs.push(T.on('f', f => { if (!f || f.sid !== sid || !f.d) return; img.src = f.d; img.style.display = 'block'; }));
    offs.push(T.on('o_' + vid, async o => {
      if (!o || o.sid !== sid || pc || !window.RTCPeerConnection) return;
      try {
        pc = new RTCPeerConnection(LV_ICE);
        pc.ontrack = e => { vidEl.srcObject = e.streams[0]; vidEl.style.display = 'block'; vidEl.play().catch(() => {}); };
        await pc.setRemoteDescription({ type: 'offer', sdp: o.sdp });
        await pc.setLocalDescription(await pc.createAnswer());
        await lvGather(pc);
        T.set('a_' + vid, { sid, sdp: pc.localDescription.sdp });
      } catch(e){ console.warn('live rtc', e); }
    }));
    // tiada video dalam 8 saat (rangkaian menyekat sambungan terus) → gambar melalui awan
    fb = setTimeout(() => { if (!closed && vidEl.readyState < 2){ vidEl.style.display = 'none'; want({ jpg: 1 }); } }, 8000);
  }

  want({ rtc: v.fit ? 1 : 0 });
  toast('📺 Tayangan langsung dari peranti lain');
}

/* "Adakah anda pasti?" — di atas semua lapisan game */
/* Keluar dari game. Jika soalan sudah dijawab (asked > 0), markah separuh jalan disimpan sebagai TP. */
function gameConfirm(q, sub, asked, right){
  lbStyle();
  const keep = asked > 0;
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'gc';
    el.innerHTML = '<div class="gc-p"><div style="font-size:34px">' + (keep ? '🏁' : '🚪') + '</div><div class="q">' + esc(q || (keep ? 'Tamatkan permainan sekarang?' : 'Adakah anda pasti mahu keluar?')) + '</div>' +
      '<div class="s">' + (sub || (keep ? 'Markah setakat ini (<b>' + right + '/' + asked + ' betul</b>) akan direkod sebagai TP untuk setiap ahli kumpulan yang bermain.'
                                       : 'Belum ada soalan dijawab, jadi tiada markah untuk direkod.')) + '</div>' +
      '<div class="b"><button data-g="0">Tidak, sambung</button><button class="y" data-g="1">' + (keep ? 'Ya, tamat &amp; simpan' : 'Ya, keluar') + '</button></div></div>';
    const done = v => { el.remove(); res(v); };
    el.addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) done(b.dataset.g === '1'); else if (e.target === el) done(false); });
    document.body.appendChild(el);
  });
}

      return false;
