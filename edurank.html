<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C1118">
<title>EduRank</title>
<meta name="application-name" content="EduRank">
<meta name="author" content="Arif Aziz">
<meta name="apple-mobile-web-app-title" content="EduRank">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="https://i.ibb.co/LXsmk9d5/20260922-130525-0000.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/LXsmk9d5/20260922-130525-0000.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  ink:'#0C1118', panel:'#141C26', panel2:'#1B2531', line:'#27384A',
  orange:'#FF6B00', cyan:'#00F0FF', muted:'#7E93A8'
}, fontFamily: { tac:['Rajdhani','sans-serif'], num:['Share Tech Mono','monospace'] } } } };
</script>
<style>
:root{
  --ink:#0C1118; --panel:#141C26; --panel2:#1B2531; --line:#27384A;
  --orange:#FF6B00; --cyan:#00F0FF; --muted:#7E93A8; --txt:#E6EEF7;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--ink);color:var(--txt);font-family:'Rajdhani',sans-serif;
  touch-action:manipulation;overscroll-behavior-y:none;
  background-image:
    linear-gradient(rgba(39,56,74,.25) 1px,transparent 1px),
    linear-gradient(90deg,rgba(39,56,74,.25) 1px,transparent 1px);
  background-size:38px 38px;
}
/* Tiada pilih teks, seret gambar atau menu tekan-lama — rasa macam app, bukan laman web */
body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
img{-webkit-user-drag:none;-khtml-user-drag:none;-moz-user-drag:none;-o-user-drag:none;user-drag:none;pointer-events:auto;}
/* Medan input kekal boleh pilih & tampal */
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
  font-family:'Rajdhani',sans-serif;}
pre,.selectable{-webkit-user-select:text;user-select:text;}
.num{font-family:'Share Tech Mono',monospace;}
.clip{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);}
.clip-s{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
.circ{border-radius:50%;overflow:hidden;}
.panel{background:linear-gradient(160deg,#182231,#121A24);border:1px solid var(--line);}
.edge-o{box-shadow:inset 0 0 0 1px rgba(255,107,0,.35),0 0 12px rgba(255,107,0,.12);}
.edge-c{box-shadow:inset 0 0 0 1px rgba(0,240,255,.35),0 0 12px rgba(0,240,255,.12);}
.glow-o{text-shadow:0 0 8px rgba(255,107,0,.7);}
.glow-c{text-shadow:0 0 8px rgba(0,240,255,.7);}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:.5rem .8rem;font-weight:600;letter-spacing:.03em;}
.btn:active{transform:translateY(1px);}
.btn-o{background:linear-gradient(135deg,#FF6B00,#C24F00);color:#120A02;border-color:#FF8A33;}
.btn-c{background:linear-gradient(135deg,#00F0FF,#00A8B8);color:#04171A;border-color:#68F7FF;}
.btn-d{background:linear-gradient(135deg,#E23B3B,#8E1C1C);color:#fff;border-color:#F06A6A;}
.btn:disabled{opacity:.35;filter:grayscale(.6);}
.fld{width:100%;background:#0E151E;border:1px solid var(--line);color:var(--txt);padding:.55rem .7rem;font-size:16px;}
.fld:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,240,255,.18);}
.lbl{font-size:.72rem;color:var(--muted);font-weight:600;}
.tag{font-size:.68rem;border:1px solid var(--line);padding:.1rem .4rem;color:var(--muted);}
/* ---- range slider ---- */
input[type=range].sl{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;}
input[type=range].sl::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,#E23B3B 0%,#3A4A5C 50%,var(--orange) 100%);border:1px solid var(--line);}
input[type=range].sl::-webkit-slider-thumb{-webkit-appearance:none;height:26px;width:16px;margin-top:-11px;background:var(--cyan);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:0 0 10px rgba(0,240,255,.8);}
input[type=range].sl::-moz-range-track{height:6px;background:linear-gradient(90deg,#E23B3B,#3A4A5C,var(--orange));}
input[type=range].sl::-moz-range-thumb{height:24px;width:14px;border:0;background:var(--cyan);}
/* ---- modal ---- */
.backdrop{position:fixed;inset:0;background:rgba(4,8,12,.78);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;transition:opacity .16s ease;padding-top:var(--safe-t);}
.backdrop.show{opacity:1;}
.mpanel{width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;background:linear-gradient(160deg,#18222F,#0F161F);border:1px solid var(--line);transform:translateY(18px);transition:transform .18s ease;padding-bottom:var(--safe-b);}
.backdrop.show .mpanel{transform:translateY(0);}
.backdrop.center{align-items:center;padding:14px;}
.backdrop.center .mpanel{max-height:88vh;}
/* Mod skrin penuh untuk pertempuran — kekal potret, cuma guna semua ruang */
.backdrop.mfull{align-items:stretch;justify-content:stretch;padding:var(--safe-t) 0 0 0;}
.backdrop.mfull .mpanel{max-width:none;width:100vw;max-height:none;height:100%;border:0;clip-path:none;}
.backdrop.mfull .mbody{flex:1;padding:.5rem;}
.backdrop.mfull .pkwrap{padding:6px;}
.mhead{display:flex;align-items:center;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line);background:rgba(255,107,0,.06);}
.mbody{padding:.9rem;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;}

.mfoot{padding:.7rem .9rem;border-top:1px solid var(--line);display:flex;gap:.5rem;}
/* ---- aura ---- */
@keyframes pulseA{0%,100%{box-shadow:0 0 0 0 rgba(255,107,0,.45)}50%{box-shadow:0 0 14px 3px rgba(255,107,0,.25)}}
@keyframes pulseC{0%,100%{box-shadow:0 0 0 0 rgba(0,240,255,.45)}50%{box-shadow:0 0 14px 3px rgba(0,240,255,.25)}}
.aura-hi{animation:pulseA 2.4s infinite;}
.aura-lo{animation:pulseC 2.8s infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
/* ---- tap to move ---- */
.tapchip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .12s ease;}
.tapchip:active{transform:scale(.9);filter:drop-shadow(0 0 8px rgba(0,240,255,.7));}
.hex,img,.circ,[data-hold]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.selchk{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:#FF6B00;color:#0C1118;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 0 0 2px #0C1118,0 0 10px rgba(255,107,0,.8);}
.cropper-container{touch-action:none;}
/* ---- nav ---- */
.navbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.45rem 0;color:var(--muted);font-size:.6rem;font-weight:600;letter-spacing:-.01em;}
/* ---- kad dilukis (SVG) ---- */
.cf-art svg{width:100%;height:100%;display:block;}
.cardface.holo::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.35;
  background:linear-gradient(115deg,transparent 20%,rgba(255,0,170,.5) 36%,rgba(0,240,255,.5) 46%,rgba(255,230,0,.45) 56%,transparent 72%);
  background-size:250% 250%;animation:holo 3.2s linear infinite;}
@keyframes holo{0%{background-position:120% 0}100%{background-position:-120% 0}}
.navbtn.on{color:var(--orange);text-shadow:0 0 10px rgba(255,107,0,.6);}
.navbtn.on i{transform:translateY(-1px);}
/* ---- showcase ---- */
.banner{aspect-ratio:1/2;position:relative;overflow:hidden;background:#0A0F15;border:1px solid rgba(255,107,0,.5);
  clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px));}
.banner::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);background-size:22px 22px;pointer-events:none;}
.scrollx::-webkit-scrollbar{display:none;}
/* ---- KAD KOLEKSI ---- */
.cardface{position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;background:#0A0F15;
  border:2px solid var(--tc);box-shadow:0 0 12px var(--tg),inset 0 0 20px rgba(0,0,0,.6);display:flex;flex-direction:column;}
.cf-art{flex:1;overflow:hidden;position:relative;background:#111A24;}
.cf-art img{width:100%;height:100%;object-fit:cover;display:block;}
.cf-noart{height:100%;display:flex;align-items:center;justify-content:center;color:#2F4257;font-size:22px;}
.cf-rib{position:absolute;top:0;right:0;background:var(--tc);color:#0A0F15;font-size:clamp(7px,2vw,9px);font-weight:700;
  letter-spacing:.16em;padding:3px 8px;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%);box-shadow:0 2px 8px rgba(0,0,0,.6);}
.cf-body{background:linear-gradient(180deg,rgba(6,10,15,.97),#06090D);padding:5% 6% 6%;border-top:2px solid var(--tc);}
.cf-name{font-weight:700;font-size:clamp(11px,3.2vw,17px);line-height:1.12;color:#FFFFFF;letter-spacing:.01em;
  text-shadow:0 1px 0 #000,0 0 10px var(--tg);}
.cf-flav{font-size:clamp(8.5px,2.5vw,12px);color:#D4E2EF;font-style:italic;font-weight:500;line-height:1.3;margin-top:3px;
  text-shadow:0 1px 2px #000;}
.cf-stars{display:flex;gap:2px;justify-content:center;padding:3% 0 1%;background:#06090D;}
.cf-stars i{font-size:clamp(7px,2.1vw,11px);color:var(--tc);text-shadow:0 0 6px var(--tg);}
.cf-stars i.off{color:#263340;text-shadow:none;}
.cf-new{position:absolute;top:4px;left:4px;background:#4ADE80;color:#0A0F15;font-size:7px;font-weight:700;padding:1px 4px;}
/* pack */
.pkwrap{padding:10px;transition:filter .3s ease;}
/* kursor unit dipilih: kurungan emas berdenyut, gaya RPG taktikal */
.tgsel{animation:tgsel 1s ease-in-out infinite;}
@keyframes tgsel{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(.9);}}
.pkwrap.dim{filter:brightness(.55);}
.pkwrap.shake{animation:shk .55s linear 2;}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,4px)}}
.pkhead{margin-bottom:10px;}
.pkstage{position:relative;display:flex;align-items:center;justify-content:center;min-height:46vh;}
.pkbox{position:relative;width:58%;max-width:230px;aspect-ratio:2/3;cursor:pointer;touch-action:none;
  border:2px solid var(--pc);box-shadow:0 0 26px var(--pc)66;transition:transform .1s linear;overflow:hidden;background:#101923;}
.pkbox img{width:100%;height:100%;object-fit:cover;display:block;}
.pkbox-def{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,#24364A,#0C1118 70%),repeating-linear-gradient(45deg,#16202B,#16202B 10px,#101923 10px,#101923 20px);
  color:#9FB4C7;font-size:11px;letter-spacing:.2em;}
.pkbox-def::before{content:'';position:absolute;inset:8%;border:1px solid var(--pc);opacity:.45;
  clip-path:polygon(0 10%,10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%);}
.pkbox-def::after{content:'';position:absolute;width:180%;height:40%;top:30%;left:-40%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:shine 3s linear infinite;}
.pkbox-x{position:relative;z-index:2;font-family:'Share Tech Mono',monospace;font-size:clamp(46px,16vw,86px);font-weight:700;
  color:var(--pc);text-shadow:0 0 22px var(--pc),0 0 60px var(--pc);animation:qpulse 1.6s ease-in-out infinite;}
.pktape{position:absolute;left:0;right:0;top:46%;height:16px;background:rgba(255,255,255,.12);border-top:1px dashed rgba(255,255,255,.35);border-bottom:1px dashed rgba(255,255,255,.35);}
.pktape-fill{height:100%;width:0;background:linear-gradient(90deg,var(--pc),#fff);box-shadow:0 0 14px var(--pc);}
.pkhint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:8px;letter-spacing:.2em;color:#E6EEF7;text-shadow:0 1px 3px #000;animation:pulseA 1.8s infinite;}
.pkbox.tearing{animation:tear .8s ease forwards;}
@keyframes tear{0%{transform:scale(1.06)}45%{transform:scale(1.18) rotate(2deg)}100%{transform:scale(2.2);opacity:0}}
.pkflash{position:absolute;inset:-20%;opacity:0;pointer-events:none;}
.pkflash.go{animation:flashOut .9s ease forwards;}
@keyframes flashOut{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
.pkone{display:flex;justify-content:center;align-items:center;min-height:52vh;}
.pkone-card{width:62%;max-width:240px;aspect-ratio:2/3;perspective:1000px;cursor:pointer;}
.pkone-card .pkcard{transition:transform .55s cubic-bezier(.3,1.5,.5,1);}
.pkone-card.open .pkcard{transform:rotateY(180deg);}
@keyframes slIn{0%{opacity:0;transform:translateX(70px) scale(.9)}100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes slOut{0%{opacity:1;transform:translateX(0) scale(1)}100%{opacity:0;transform:translateX(-70px) scale(.9)}}
.slide-in{animation:slIn .32s ease;}
.slide-out{animation:slOut .26s ease forwards;}
.pkdots{display:flex;gap:3px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
.pkdot{width:14px;height:5px;background:#24333F;border-radius:2px;transition:background .3s;}
.pkcount{text-align:center;font-size:10px;letter-spacing:.25em;color:#7E93A8;margin-top:6px;}
.pkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px;}
.pkslot{perspective:700px;cursor:pointer;aspect-ratio:2/3;}
.pkcard{position:relative;width:100%;height:100%;aspect-ratio:2/3;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1);}
.pkslot.open .pkcard{transform:rotateY(180deg);}
.pkback,.pkfront{position:absolute;inset:0;backface-visibility:hidden;}
.pkback{display:flex;align-items:center;justify-content:center;border:2px solid #2B3B4D;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#1E3140,#0D141C 68%),repeating-linear-gradient(45deg,#16202B,#16202B 7px,#101923 7px,#101923 14px);}
.pkback::before{content:'';position:absolute;inset:7%;border:1px solid rgba(0,240,255,.22);
  clip-path:polygon(0 12%,12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%);}
.pkback::after{content:'';position:absolute;width:150%;height:28%;top:36%;left:-25%;
  background:linear-gradient(90deg,transparent,rgba(0,240,255,.16),transparent);animation:shine 2.6s linear infinite;}
@keyframes shine{0%{transform:translateX(-60%) rotate(-18deg)}100%{transform:translateX(60%) rotate(-18deg)}}
.pkback span{position:relative;z-index:2;font-family:'Share Tech Mono',monospace;font-size:clamp(26px,9vw,54px);font-weight:700;
  color:#00F0FF;text-shadow:0 0 14px rgba(0,240,255,.8),0 0 36px rgba(255,107,0,.45);animation:qpulse 1.9s ease-in-out infinite;}
@keyframes qpulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.pkback .corner{position:absolute;width:12%;height:8%;border:2px solid rgba(255,107,0,.55);z-index:2;}
.pkback .c1{top:5%;left:5%;border-right:0;border-bottom:0}
.pkback .c2{top:5%;right:5%;border-left:0;border-bottom:0}
.pkback .c3{bottom:5%;left:5%;border-right:0;border-top:0}
.pkback .c4{bottom:5%;right:5%;border-left:0;border-top:0}
.pkfront{transform:rotateY(180deg);}
.pulse-hi{animation:pulseA 1.1s infinite;}
.pulse-myth{animation:pulseM .7s infinite;}
@keyframes pulseM{0%,100%{box-shadow:0 0 0 0 rgba(255,45,111,.6)}50%{box-shadow:0 0 18px 5px rgba(255,255,255,.75)}}
.pkslot.fx-hi,.pkone-card.fx-hi{animation:hiPop .9s ease;z-index:5;}
@keyframes hiPop{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
.pkslot.fx-hi .pkfront,.pkone-card.fx-hi .pkfront{box-shadow:0 0 36px 10px var(--tc,#C084FC);}
.pkbar{display:flex;gap:8px;margin-top:10px;}
.pkmyth{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(20,0,10,.92),rgba(6,10,15,.98));overflow:hidden;padding:20px;}
.pkmyth.go{display:flex;animation:mythIn .5s ease;}
@keyframes mythIn{0%{opacity:0;background:#fff}25%{opacity:1;background:#fff}100%{opacity:1}}
.myth-shock{position:absolute;width:10px;height:10px;border-radius:50%;border:3px solid #fff;animation:shock 1.1s ease-out 3;}
@keyframes shock{0%{width:10px;height:10px;opacity:1}100%{width:160vw;height:160vw;opacity:0}}
.myth-card{width:52%;max-width:220px;animation:mythCard 1.2s cubic-bezier(.2,1.5,.4,1);filter:drop-shadow(0 0 30px #FF2D6F);}
@keyframes mythCard{0%{transform:scale(.1) rotateY(540deg)}100%{transform:scale(1) rotateY(0)}}
.myth-card .cardface{border-width:3px;animation:rainbow 2.4s linear infinite;}
@keyframes rainbow{0%{border-color:#FF5A3C;box-shadow:0 0 24px #FF5A3C}33%{border-color:#00F0FF;box-shadow:0 0 24px #00F0FF}66%{border-color:#C084FC;box-shadow:0 0 24px #C084FC}100%{border-color:#FFD76A;box-shadow:0 0 24px #FFD76A}}
.myth-txt{text-align:center;margin-top:14px;}
.myth-tag{font-size:10px;letter-spacing:.5em;color:#FF5A3C;}
.myth-name{font-weight:700;font-size:clamp(18px,6vw,32px);color:#fff;text-shadow:0 0 18px #FF2D6F;min-height:1.2em;}
.myth-flav{font-size:12px;color:#B8C7D6;font-style:italic;margin-top:6px;}
.conf{position:absolute;top:-20px;animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.2}}
/* ---- kad dalam pertempuran ---- */
.mhand{display:flex;gap:6px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch;}
.mhand::-webkit-scrollbar{display:none;}
.mcard{flex:0 0 76px;background:#101923;border:1px solid var(--tc);padding:3px;text-align:left;box-shadow:0 0 8px var(--tc)33;}
.mcard.off{opacity:.35;pointer-events:none;filter:grayscale(.7);}
.mcard:active{transform:translateY(2px);}
.mc-art{width:100%;aspect-ratio:1;background:#0A0F15 center/cover;border:1px solid var(--tc)66;}
.mc-nm{font-size:8px;font-weight:700;color:#E6EEF7;margin-top:2px;line-height:1.1;}
.mc-st{font-size:7px;color:var(--tc);line-height:1.1;}
/* ---- kad muncul sekejap semasa perlawanan auto ---- */
.cflash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:65;pointer-events:none;}
.cflash.go{display:flex;}
.cflash-card{width:36%;max-width:140px;aspect-ratio:2/3;overflow:hidden;background:#0A0F15;
  border:2px solid var(--tc,#00F0FF);box-shadow:0 0 22px var(--tg,#00A8B8),0 0 60px var(--tc,#00F0FF)66;
  animation:cFlash 1.25s cubic-bezier(.2,1.3,.4,1) forwards;}
.cflash-card img{width:100%;height:100%;object-fit:cover;display:block;}
.cflash-blank{height:100%;display:flex;align-items:center;justify-content:center;color:#2F4257;font-size:26px;}
@keyframes cFlash{
  0%{transform:scale(.2) rotateY(160deg);opacity:0;filter:brightness(2.4)}
  22%{transform:scale(1.12) rotateY(0);opacity:1;filter:brightness(1.5)}
  45%{transform:scale(1) rotateY(0);opacity:1;filter:brightness(1)}
  72%{transform:scale(1.02) translateY(-6px);opacity:1}
  100%{transform:scale(.72) translateY(-70px);opacity:0;filter:brightness(2)}
}

<script>
/* =========================================================
   EDURANK — dicipta oleh Arif Aziz
   Single file. Vanilla JS. localStorage = sumber utama.
   Firebase (RTDB + Storage + Anon Auth) = lapisan sync pilihan.
   ========================================================= */

/* ---------- KONFIG ---------- */
const APP_NAME = 'EduRank';
const APP_AUTHOR = 'Arif Aziz';
const SYS_BADGES = [
  { id:'sys_tp4',  name:'Streak TP4',   color:'#00C2D4', system:true },
  { id:'sys_tp5',  name:'Streak TP5',   color:'#FF6B00', system:true },
  { id:'sys_esc',  name:'Pelarian Seram', color:'#E23B3B', system:true }
];
const isSysBadge = id => SYS_BADGES.some(b => b.id === id);
const APP_ICON = 'https://i.ibb.co/LXsmk9d5/20260922-130525-0000.png';
const SCHEMA_VERSION = 12;
const LS_KEY = 'ipbd_v12_state';
const LS_FB  = 'ipbd_v12_fbconfig';
const CLIENT_ID = Math.random().toString(36).slice(2, 10);

const TP_MAP = [
  { min: -20, max: -11, tp: 1 },
  { min: -10, max: -1,  tp: 2 },
  { min: 0,   max: 9,   tp: 3 },
  { min: 10,  max: 19,  tp: 4 },
  { min: 20,  max: 29,  tp: 5 },
  { min: 30,  max: 39,  tp: 6 }
];
const SC_MIN = TP_MAP[0].min, SC_MAX = TP_MAP[TP_MAP.length-1].max;   // -20 … 39
const TP_COLOR = { 1:'#E23B3B', 2:'#E2803B', 3:'#7E93A8', 4:'#00C2D4', 5:'#00F0FF', 6:'#FF6B00' };

/* Lencana kini WAJIB gambar PNG 1:1 muat naik guru — tiada reka bentuk tersedia. */
const DEFAULT_BADGES = [];

/* ---------- TANGGA RANK & BINGKAI BANNER ---------- */
const RANK_TIERS = [
  { key:'rookie',   name:'ROOKIE',   color:'#9AA7B4' },
  { key:'bronze',   name:'BRONZE',   color:'#C97B3C' },
  { key:'silver',   name:'SILVER',   color:'#D7E3EE' },
  { key:'gold',     name:'GOLD',     color:'#FFD76A' },
  { key:'platinum', name:'PLATINUM', color:'#6FE3C4' },
  { key:'diamond',  name:'DIAMOND',  color:'#6FC4FF' },
  { key:'master',   name:'MASTER',   color:'#C07CFF' },
  { key:'legend',   name:'LEGEND',   color:'#FF5A3C' }
];
const RANK_MINS = [0,20,40, 70,105,145, 190,240,295, 355,420,490, 565,645,730, 820,915,1015, 1120,1230,1345, 1465,1590,1720];
function defaultRanks(){
  const out = [];
  RANK_TIERS.forEach((t,i) => [3,2,1].forEach((step,k) => {
    out.push({ id:t.key+step, tier:t.key, name:t.name+' '+step, color:t.color, min:RANK_MINS[i*3+k] });
  }));
  return out;                     // 24 langkah: Rookie 3 → Legend 1
}
const ROMAN = { 3:'III', 2:'II', 1:'I' };
const TIER_STYLE = {
  rookie:   'plain brushed-steel plating, minimal rivets, matte finish, humble entry-level look',
  bronze:   'weathered bronze alloy plating with forged edges and small angular studs',
  silver:   'polished silver-chrome plating with sharp bevels and thin engraved lines',
  gold:     'ornate gold plating with engraved filigree and beveled trim, warm reflective highlights',
  platinum: 'sleek platinum-mint alloy with layered geometric panels and thin glowing seams',
  diamond:  'crystalline ice-blue facets with refracting shards and cold inner glow',
  master:   'dark violet alloy with energy circuitry, floating shard accents and purple glow',
  legend:   'molten ember-red armour with cracked lava seams, radiating heat glow and winged crest'
};
function copyText(txt, msg){
  const done = () => toast(msg || 'Prompt disalin.');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('Gagal menyalin. Salin manual.', null, true); }
    ta.remove();
  }
}
/* Bingkai rank kini dilukis oleh app mengikut warna rank. */
const rankSrc = () => null;
/* ---------- MATA RANK (RP) ----------
   RP = (Skor PBD × kadar tukaran) + (RP dimenangi di Arena).
   Rank ditentukan oleh RP, BUKAN skor. RP Arena tidak menyentuh TP atau skor PBD. */
const arenaRP = sid => ((S.arena && S.arena.rp) || {})[sid] || 0;
const rpRate = () => (S.config && S.config.rpPerScore !== undefined) ? S.config.rpPerScore : 1;
function rpOf(sid, sj){
  const sc = stats(sid, sj === undefined ? (S.ui.activeSubjectId || null) : sj).score;
  return Math.max(0, Math.round(sc * rpRate() + arenaRP(sid)));
}
/* Kemenangan lawan pihak lebih kuat = RP lebih banyak; lawan lemah = sedikit sahaja */
function rpAward(winIds, loseIds, sj){
  S.arena = S.arena || { points:{}, wins:{}, losses:{}, history:[] };
  S.arena.rp = S.arena.rp || {};
  const avg = ids => ids.length ? ids.reduce((a,i)=>a+rpOf(i, sj),0) / ids.length : 0;
  const w = avg(winIds), l = avg(loseIds);
  const gain = clamp(Math.round(12 + (l - w) / 25), 4, 36);
  winIds.forEach(i => S.arena.rp[i] = (S.arena.rp[i]||0) + gain);
  loseIds.forEach(i => S.arena.rp[i] = (S.arena.rp[i]||0) + 2);
  return gain;
}
function rankFor(score){
  const rs = (S.ranks && S.ranks.length===24) ? S.ranks : defaultRanks();
  let hit = rs[0];
  rs.forEach(r => { if ((score||0) >= r.min) hit = r; });
  return hit;
}

/* ---------- STATE ---------- */
let S = null;
const blank = () => ({
  schemaVersion: SCHEMA_VERSION,
  classes: [], subjects: [], fields: [], metrics: [], groups: [], students: [],
  ranks: defaultRanks(), frames: {},
  badges: JSON.parse(JSON.stringify(DEFAULT_BADGES)),
  records: {},
  ui: { activeClassId:'', activeSubjectId:'', tab:'students', listClassId:'' },
  chapters: [],
  timetable: {},
  arena: { points:{}, wins:{}, losses:{}, history:[] },
  collect: {}, tpc: { spent:{} }, pity: {}, freePack: {}, packLog: [], cardsV: 2,
  attendance: {},                  // classId → tarikh → { sid: 'H'|'L'|'T'|'C' }
  quiz: [], quizStat: {},
  config: { baseline:-20, attendBonus:10, streakDays:5, scaleV:2, tpcRate:1, maxUploadKB:200, rpPerScore:1 },
  rev: 0, clientId: CLIENT_ID
});

/* ---------- UTIL ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = p => (p||'x') + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const BASE = () => (S.config && typeof S.config.baseline === 'number') ? S.config.baseline : SC_MIN;
const AVA_SVG = g => {
  const skin = '#D9A06B', hair = '#1E2630', cloth = g === 'P' ? '#2B6F8A' : '#2F3C4C', veil = '#3E8FB0';
  const body = g === 'P'
    ? '<path d="M50 56c-16 0-27 10-30 24-1 6-1 12-1 20h62c0-8 0-14-1-20-3-14-14-24-30-24z" fill="'+cloth+'"/>' +
      '<path d="M50 14c-16 0-26 12-26 28 0 14 5 22 10 26-6 4-10 10-10 18h52c0-8-4-14-10-18 5-4 10-12 10-26 0-16-10-28-26-28z" fill="'+veil+'"/>' +
      '<path d="M50 24c-10 0-17 8-17 18s7 20 17 20 17-10 17-20-7-18-17-18z" fill="'+skin+'"/>'
    : '<path d="M50 56c-16 0-27 10-30 24-1 6-1 12-1 20h62c0-8 0-14-1-20-3-14-14-24-30-24z" fill="'+cloth+'"/>' +
      '<path d="M50 20c-11 0-19 9-19 21s8 21 19 21 19-9 19-21-8-21-19-21z" fill="'+skin+'"/>' +
      '<path d="M31 36c0-12 8-20 19-20s19 8 19 20c0-6-6-9-19-9s-19 3-19 9z" fill="'+hair+'"/>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
    '<rect width="100" height="100" fill="#1B2531"/>' + body + '</svg>');
};
const AVA = { L: AVA_SVG('L'), P: AVA_SVG('P') };
const avaFor = s => AVA[(s && (s.gender || (s.charId||'').charAt(0))) === 'P' ? 'P' : 'L'];
const cssUrl = u => "url('" + String(u).replace(/'/g,'%27') + "')";
const todayKey = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
/* Tarikh sasaran rekod. null = hari ini. Diubah melalui mod "penilaian luar kelas". */
let REC_DATE = null;
const recDate = () => REC_DATE || todayKey();
const isBackdated = () => !!REC_DATE && REC_DATE !== todayKey();
const fmtDate = k => { const [y,m,d]=k.split('-'); return d+'/'+m+'/'+y; };
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

function calcTP(avg){
  const v = clamp(Math.round(avg||0), SC_MIN, SC_MAX);
  const hit = TP_MAP.find(r => v >= r.min && v <= r.max);
  return hit ? hit.tp : 3;
}
const cls = id => S.classes.find(c=>c.id===id);
const subj = id => S.subjects.find(x=>x.id===id);
const stu = id => S.students.find(x=>x.id===id) || null;
const clsName = id => (cls(id)||{}).name || '—';
const subjName = id => (subj(id)||{}).name || '—';
/* Kelas gabungan: kelas maya yang mengandungi pelajar dari 2 kelas atau lebih */
const isMerged = c => !!(c && Array.isArray(c.merge) && c.merge.length);
const mergedOf = cid => { const c = cls(cid); return isMerged(c) ? c.merge.slice() : [cid]; };
const baseClasses = () => S.classes.filter(c => !isMerged(c));
function metricsFor(cid, sid){
  const m = S.metrics.filter(x => x.classId === cid && x.subjectId === sid);
  if (m.length) return m;
  const c = cls(cid);
  if (isMerged(c)){                                   // warisi matrik dari kelas ahli pertama yang ada
    for (const b of c.merge){
      const mm = S.metrics.filter(x => x.classId === b && x.subjectId === sid);
      if (mm.length) return mm;
    }
  }
  return m;
}
function studentsOf(cid){
  const c = cls(cid);
  const list = isMerged(c)
    ? S.students.filter(s => c.merge.indexOf(s.classId) >= 0)
    : S.students.filter(s => s.classId === cid);
  return list.slice().sort((a,b) => a.name.localeCompare(b.name));
}

/* ---------- STATS (logik sesi harian) ---------- */
function sessionsOf(studentId, subjectId){
  const r = S.records[studentId] || {};
  const out = [];
  Object.keys(r).forEach(sid => {
    if (subjectId && sid !== subjectId) return;
    Object.keys(r[sid]).forEach(date => out.push({ subjectId:sid, date, ...r[sid][date] }));
  });
  return out.sort((a,b)=> a.date < b.date ? 1 : -1);
}
// Kadar purata sesi = jumlah skor matrik ÷ bilangan matrik aktif.
// 1 matrik atau 5 matrik, skala tetap sama (-20…+39). Tiada bias bilangan matrik.
function rateOf(sesi){
  if (typeof sesi.rate === 'number') return sesi.rate;
  const n = sesi.metricCount || Object.keys(sesi.metricScores||{}).length || 1;
  return clamp((sesi.totalScore||0)/n, SC_MIN, SC_MAX);
}
/* ---------- GANJARAN (REWARD) ----------
   Dikira per matrik yang ditanda "sumber ganjaran" — BUKAN purata semua matrik.
   Mata = himpunan skor POSITIF matrik itu merentas semua sesi harian.
   Setiap 'per' mata = 1 ganjaran. Ganjaran yang diperoleh kekal (tidak ditarik balik). */
function rewardMetrics(subjectId, classId){
  return S.metrics.filter(m => m.reward && m.reward.on &&
    (!subjectId || m.subjectId === subjectId) && (!classId || m.classId === classId));
}
function rewardPoints(studentId, m){
  const days = ((S.records[studentId]||{})[m.subjectId]) || {};
  let pts = 0;
  Object.keys(days).forEach(d => { const v = (days[d].metricScores||{})[m.id] || 0; if (v > 0) pts += v; });
  return pts;
}
function rewardsOf(studentId, subjectId){
  const out = {};
  rewardMetrics(subjectId).forEach(m => {
    const n = Math.floor(rewardPoints(studentId, m) / Math.max(1, m.reward.per||30));
    const e = m.reward.emoji || '⭐';
    if (!out[e]) out[e] = { emoji:e, count:0 };
    out[e].count += n;
  });
  return Object.values(out).filter(x => x.count > 0);
}
/* Streak: kiraan sesi terkini berturut-turut yang mencapai TP4/TP5.
   TP5 mengatasi TP4. Jika belum capai → lencana "Tiada Streak". */
function streakBadgeId(studentId, subjectId){
  const ses = sessionsOf(studentId, subjectId);       // terbaharu dahulu
  const D = (S.config && S.config.streakDays) || 5;
  let c4 = 0, c5 = 0, stop4 = false, stop5 = false;
  for (const s of ses){
    const tp = s.tpAwarded || calcTP(rateOf(s));
    if (!stop5){ if (tp >= 5) c5++; else stop5 = true; }
    if (!stop4){ if (tp >= 4) c4++; else stop4 = true; }
    if (stop4 && stop5) break;
  }
  return c5 >= D ? 'sys_tp5' : (c4 >= D ? 'sys_tp4' : '');      // '' = belum capai, tiada lencana dipapar
}
const streakBadge = (sid, sj) => { const id = streakBadgeId(sid, sj); return id ? (S.badges.find(b => b.id === id) || null) : null; };
function streakCount(studentId, subjectId){
  const ses = sessionsOf(studentId, subjectId);
  let n = 0;
  for (const s of ses){ const tp = s.tpAwarded || calcTP(rateOf(s)); if (tp >= 4) n++; else break; }
  return n;
}
/* Lencana untuk banner: slot 1 = streak (sentiasa ada), diikuti lencana manual */
function bannerBadges(r){
  if (r.badgeList) return r.badgeList;                 // paparan awam: senarai dari snapshot
  const s = r.s;
  const auto = [streakBadge(s.id, r.sj), escBadge(s.id)].filter(Boolean);   // lencana sistem automatik
  const manual = (s.badges||[]).filter(id => !isSysBadge(id)).map(id => S.badges.find(b=>b.id===id)).filter(Boolean).slice(0, 5 - auto.length);
  return auto.concat(manual);                 // streak sentiasa di slot teratas bila ada
}
const rewardTotal = (sid, sj) => rewardsOf(sid, sj).reduce((a,x)=>a+x.count, 0);
const fmtScore = n => (Math.round((n||0)*10)/10).toFixed(1);
function stats(studentId, subjectId){
  const ses = sessionsOf(studentId, subjectId);
  const n = ses.length;
  const score = ses.reduce((a,s)=>a+rateOf(s),0);          // himpunan kadar purata harian
  const avgTP = n ? (ses.reduce((a,s)=>a+(s.tpAwarded||calcTP(rateOf(s))),0)/n) : 0;
  return { score: Math.round(score*10)/10, sessions:n, avgTP:+avgTP.toFixed(1), finalTP: n ? clamp(Math.round(avgTP),1,6) : 0 };
}

/* ---------- IndexedDB untuk gambar (mod tempatan) ---------- */
let IDB = null;
const PHOTOS = {};
function idbOpen(){
  return new Promise(res=>{
    if (!('indexedDB' in window)) return res(null);
    const rq = indexedDB.open('ipbd_photos', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('p');
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => res(null);
  });
}
const LS_PH = 'ipbd_ph_';
function idbPut(k,v){ return new Promise((res,rej)=>{ if(!IDB){ try{ localStorage.setItem(LS_PH+k,v); res(); }catch(e){ rej(new Error('Storan peranti penuh')); } return; } const t=IDB.transaction('p','readwrite'); t.objectStore('p').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(new Error('IndexedDB gagal menulis')); }); }
function idbDel(k){ return new Promise(res=>{ try{ localStorage.removeItem(LS_PH+k); }catch(e){} if(!IDB) return res(); const t=IDB.transaction('p','readwrite'); t.objectStore('p').delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }
/* Tulis banyak kunci sekali gus dalam SATU transaksi. */
function idbPutAll(obj){
  const keys = Object.keys(obj || {});
  return new Promise(res => {
    if (!keys.length) return res(0);
    if (!IDB){
      let n = 0;
      keys.forEach(k => { try { localStorage.setItem(LS_PH + k, obj[k]); n++; } catch(e){} });
      return res(n);
    }
    let t;
    try { t = IDB.transaction('p', 'readwrite'); } catch(e){ return res(0); }
    const st = t.objectStore('p');
    keys.forEach(k => { try { st.put(obj[k], k); } catch(e){} });
    t.oncomplete = () => res(keys.length);
    t.onerror = () => res(0);
    t.onabort = () => res(0);
  });
}
function idbAll(){ return new Promise(res=>{ const out={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf(LS_PH)===0) out[k.slice(LS_PH.length)]=localStorage.getItem(k); } }catch(e){} if(!IDB) return res(out); const t=IDB.transaction('p','readonly'); const st=t.objectStore('p'); const rq=st.openCursor(); rq.onsuccess=e=>{ const c=e.target.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; rq.onerror=()=>res(out); }); }

function sanitizeBadges(){
  const valid = new Set(S.badges.filter(b=>!isSysBadge(b.id)).map(b=>b.id));
  let n = 0;
  S.students.forEach(s => {
    const before = (s.badges||[]).length;

function migrate(d){
  const b = blank();
  const out = Object.assign(b, d);
  out.ui = Object.assign(b.ui, d.ui || {});
  out.schemaVersion = SCHEMA_VERSION;
  if (!Array.isArray(out.badges)) out.badges = [];
  if (!Array.isArray(out.chapters)) out.chapters = [];
  if (!out.timetable || typeof out.timetable !== 'object') out.timetable = {};
  out.arena = Object.assign({ points:{}, wins:{}, losses:{}, history:[] }, out.arena || {});
  out.config = Object.assign({}, b.config, out.config || {});     // data lama mungkin tiada config
  // Sistem sprite, peta taktikal, Mod Cerita dan kad muat naik telah dibuang:
  // data lamanya dipadam supaya storan peranti & awan tidak membawa beban mati.
  ['sprites','faces','arenaBg','tmaps','roles','stories','sprog','atkSfx','splash','grounds','hpbar','dlgFrame','mnpc','cards','packCovers']
    .forEach(k => { delete out[k]; });
  ['tactZoom','movScale','cutStage','dlgStep','spriteFps','sprMode','sprSnap','atkMs'].forEach(k => { delete out.config[k]; });
  if (out.bgm){ delete out.bgm.map; delete out.bgm.duel; }
  // Kad kini dilukis oleh app (koleksi bina dalam). Koleksi lama merujuk kad
  // muat naik yang sudah tiada, jadi ia dimulakan semula sekali sahaja.
  if (out.cardsV !== 2){ out.collect = {}; out.pity = {}; out.packLog = []; out.cardsV = 2; }
  ['collect','pity','freePack'].forEach(k => { if (!out[k] || typeof out[k] !== 'object') out[k] = {}; });
  if (!out.tpc || typeof out.tpc !== 'object') out.tpc = { spent:{} };
  out.tpc.spent = out.tpc.spent || {}; out.tpc.bonus = out.tpc.bonus || {}; out.tpc.log = out.tpc.log || [];
  if (!Array.isArray(out.packLog)) out.packLog = [];
  if (!Array.isArray(out.quiz)) out.quiz = [];
  if (!out.quizStat || typeof out.quizStat !== 'object') out.quizStat = {};
  if (!out.attendance || typeof out.attendance !== 'object') out.attendance = {};
  ['rpt','lesson'].forEach(k => { if (!out[k] || typeof out[k] !== 'object') out[k] = {}; });   // classId → tarikh → { sid: 'H'|'L'|'T'|'C' }
  if (out.config.tpcRate === undefined) out.config.tpcRate = 1;
  if (out.config.maxUploadKB === undefined) out.config.maxUploadKB = 200;
  if (out.config.rpPerScore === undefined) out.config.rpPerScore = 1;
  out.arena.rp = out.arena.rp || {};
  out.config = Object.assign({ baseline:-20, attendBonus:10, streakDays:5, scaleV:2 }, out.config || {});
  if (out.config.scaleV !== 2){ out.config.baseline = -20; out.config.attendBonus = 10; out.config.scaleV = 2; }   // naik taraf ke skala TP baharu
  out.config.baseline = clamp(out.config.baseline, SC_MIN, 0);
  out.badges = out.badges.filter(b => b.id !== 'sys_none');     // lencana "tiada streak" tidak lagi digunakan
  SYS_BADGES.forEach(sb => { if (!out.badges.some(b => b.id === sb.id)) out.badges.push(Object.assign({}, sb)); });
  const validB = new Set(out.badges.map(b=>b.id));
  (out.students||[]).forEach(s => { s.badges = Array.from(new Set((s.badges||[]).filter(id => validB.has(id)))); });
  if (!Array.isArray(out.ranks) || out.ranks.length !== 24) out.ranks = defaultRanks();
  if (!out.frames || typeof out.frames !== 'object') out.frames = {};
  return out;
}

/* ---------- MODAL MANAGER ---------- */
const MODALS = [];
function lockBody(){ document.body.style.overflow='hidden'; }

function openModal(opt){
  const id = opt.id || uid('m');

      '<button class="btn clip-s !px-2 !py-1" data-close="1"><i class="fa-solid fa-xmark"></i></button></div>') +
      '<div class="mbody"></div>' +
      (opt.footer ? '<div class="mfoot"></div>' : '') +
    '</div>';
  const panel = $('.mpanel', bd);
  const body  = $('.mbody', bd);
  if (typeof opt.body === 'string') body.innerHTML = opt.body; else if (opt.body) body.appendChild(opt.body);
  if (opt.footer){ const f = $('.mfoot', bd); if (typeof opt.footer==='string') f.innerHTML=opt.footer; else f.appendChild(opt.footer); }

  // backdrop click: pointerdown + pointerup mesti kedua-duanya pada backdrop
  let downOnBd = false;
  bd.addEventListener('pointerdown', e => { downOnBd = (e.target === bd); });
  bd.addEventListener('pointerup',   e => { if (downOnBd && e.target === bd) closeModal(id); downOnBd = false; });
  panel.addEventListener('pointerdown', e => { downOnBd = false; e.stopPropagation(); });
  panel.addEventListener('pointerup',   e => e.stopPropagation());
  bd.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(id); });

  $('#modalRoot').appendChild(bd);
  MODALS.push({ id, el:bd, onClose:opt.onClose });
  lockBody();
  requestAnimationFrame(()=> bd.classList.add('show'));
  if (opt.afterOpen) setTimeout(()=>opt.afterOpen(bd), 30);
  return id;
}
function closeModal(id){
  const i = MODALS.findIndex(m => m.id === id);
  if (i < 0) return;
  const m = MODALS[i];
  MODALS.splice(i,1);
  m.el.classList.remove('show');
  setTimeout(()=>{ m.el.remove(); unlockBody(); }, 180);
  try { m.onClose && m.onClose(); } catch(e){}
}

/* Penilaian pukal = tetapkan TP terus. Semua matrik diset kepada nilai TP itu (bukan tambah/tolak). */
const TP_VALUE = tp => (TP_MAP.find(r => r.tp === tp) || TP_MAP[0]).min;
async function bulkTP(ids){
  if (!ctxOk()) return toast('Sila pilih Kelas dan Subjek terlebih dahulu.', null, true);
  const ms = metricsFor(S.ui.activeClassId, S.ui.activeSubjectId);
  if (!ms.length) return toast('Tiada matrik penilaian untuk kelas & subjek ini. Sila tambah di Tetapan.', null, true);
  if (!(await ensureContext())) return;
  const names = ids.map(i => (stu(i)||{}).name).filter(Boolean);
  const btns = TP_MAP.map(r =>
    '<button class="btn clip-s w-full flex items-center gap-3 !py-2 mb-2" data-tp="'+r.tp+'" style="border-color:'+TP_COLOR[r.tp]+'55">' +
      hexTP(r.tp, 34) +
      '<div class="flex-1 text-left"><div class="font-bold text-[14px]" style="color:'+TP_COLOR[r.tp]+'">Tahap Penguasaan '+r.tp+'</div>' +
      '<div class="num text-[11px] text-muted">semua matrik → '+r.min+'</div></div>' +
      '<i class="fa-solid fa-chevron-right text-muted text-[12px]"></i></button>').join('');
  const id = openModal({
    icon:'fa-layer-group', title:'Tetapkan TP — '+ids.length+' Pelajar',
    body:'<div class="text-[12px] text-muted mb-1 truncate">'+esc(names.join(', '))+'</div>' +
      '<div class="text-[11px] '+(isBackdated()?'text-[#FFC24D]':'text-muted')+' mb-3">'+esc(clsName(S.ui.activeClassId))+' · '+esc(subjName(S.ui.activeSubjectId))+' · '+fmtDate(recDate())+(isBackdated()?' (luar kelas)':'')+'</div>' +
      btns +
      '<div class="panel clip-s p-2 text-[11px] text-muted">Semua matrik pelajar yang dipilih akan <b>diset terus</b> kepada nilai TP ini untuk sesi hari ini. Tiada tambah atau tolak. Untuk laraskan seorang pelajar secara terperinci, guna butang <b>NILAI</b> pada kad pelajar itu.</div>',
    footer:'<button class="btn clip-s flex-1" data-close="1">Batal</button>' });
  const bd = $('[data-modal="'+id+'"]');
  bd.addEventListener('click', e => {
    const b = e.target.closest('[data-tp]'); if (!b) return;
    const tp = parseInt(b.dataset.tp, 10);
    const snap = snapshot();
    const n = commitForceTP(ids, tp, ms);
    selReset(); closeModal(id); rerenderKeepScroll();
    toast(n+' pelajar ditetapkan TP'+tp+' ('+TP_VALUE(tp)+' semua matrik).', ()=>restore(snap));
  });
}
function commitForceTP(ids, tp, ms){
  const v = TP_VALUE(tp), date = recDate(), sj = S.ui.activeSubjectId;
  ids.forEach(sid => {
    S.records[sid] = S.records[sid] || {};
    S.records[sid][sj] = S.records[sid][sj] || {};
    const rec = S.records[sid][sj][date] || { metricScores:{}, touchCount:0 };
    rec.metricScores = {};
    ms.forEach(m => rec.metricScores[m.id] = v);
    rec.metricCount = ms.length;
    rec.totalScore = v * ms.length;
    rec.rate = v;
    rec.tpAwarded = calcTP(v);
    blendRec(rec);                               // gabung dengan markah game hari ini
    if (tp >= 2) rec.attended = true;          // TP2 ke atas bermakna hadir
    if (!todayIsClassDay()) rec.outside = true;
    stampTopic(rec, (stu(sid)||{}).classId || S.ui.activeClassId, sj, date);
    rec.touchCount = (rec.touchCount||0) + 1;
    rec.updatedAt = Date.now();
    S.records[sid][sj][date] = rec;
  });
  save(true);
  return ids.length;
}

/* Modal potong generik. Pulangkan dataURL, atau null jika dibatalkan.
   opt: {file, ratio, title, hint, w, h, png, minB, maxB, focus} */
function cropModal(opt){
  return new Promise(resolve => {
    const url = URL.createObjectURL(opt.file);
    let cropper = null, settled = false, busy = false;
    const finish = v => { if (settled) return; settled = true; resolve(v); };
    const id = openModal({
      icon:'fa-crop', title: opt.title,
      body:
        '<div class="text-[11px] text-muted mb-1">'+opt.hint+'</div>' +
        '<div class="flex gap-3 items-start">' +
          '<div class="flex-1 min-w-0"><div id="crBox" style="height:44vh;background:#0A0F15;border:1px solid var(--line);overflow:hidden">' +
            '<img id="crImg" src="'+url+'" style="max-width:100%;display:block"></div></div>' +
          '<div class="w-[62px] shrink-0">' +
            '<div class="lbl mb-1">PRATONTON</div>' +
            '<div id="crPrev" class="overflow-hidden" style="width:58px;height:'+(opt.ratio===1?'58':'116')+'px;border:1px solid var(--line);background:#0A0F15'+(opt.ratio===1?';border-radius:50%':'')+'"></div>' +
            '<div class="flex gap-1 mt-2">' +
              '<button class="btn clip-s !px-2 !py-1 flex-1" data-cr="zin"><i class="fa-solid fa-plus text-[11px]"></i></button>' +
              '<button class="btn clip-s !px-2 !py-1 flex-1" data-cr="zout"><i class="fa-solid fa-minus text-[11px]"></i></button></div>' +
            '<button class="btn clip-s !px-2 !py-1 mt-1 w-full" data-cr="rot"><i class="fa-solid fa-rotate-right text-[11px]"></i></button>' +
          '</div></div>' +
        '<div id="crStat" class="text-[12px] text-cyan mt-2"><i class="fa-solid fa-spinner fa-spin"></i> Memuatkan gambar...</div>',
      footer:'<button class="btn clip-s flex-1" data-close="1">Batal</button><button class="btn btn-o clip-s flex-1" data-x="ok">Guna</button>',
      afterOpen: bd => {
        const img = $('#crImg', bd);
        const start = () => {
          try {
            cropper = new Cropper(img, {
              aspectRatio: opt.ratio, viewMode:1, dragMode:'move', autoCropArea: opt.focus?0.6:1,
              background:false, responsive:true, checkOrientation:true, guides:true,
              center:true, zoomable:true, movable:true, preview:$('#crPrev', bd),
              ready(){ $('#crStat', bd).innerHTML = opt.focus ? 'Tekan pada muka pelajar untuk fokus bingkai.' : 'Laraskan bingkai, kemudian tekan Guna.'; }
            });
          } catch(err){ $('#crStat', bd).innerHTML = '<span class="text-[#E23B3B]">Gagal membuka gambar: '+esc(err.message||err)+'</span>'; }
        };
        if (img.complete) setTimeout(start, 240);
        else { img.onload = () => setTimeout(start, 240); img.onerror = () => { $('#crStat', bd).innerHTML = '<span class="text-[#E23B3B]">Gambar rosak atau format tidak disokong.</span>'; }; }

        // TAP UNTUK FOKUS — pindahkan bingkai ke titik yang ditekan (cth. muka pelajar)
        if (opt.focus){
          const box = $('#crBox', bd);
          let dx=0, dy=0, sx=0, sy=0;
          box.addEventListener('pointerdown', e => { sx=e.clientX; sy=e.clientY; });
          box.addEventListener('pointerup', e => {
            dx = Math.abs(e.clientX-sx); dy = Math.abs(e.clientY-sy);
            if (!cropper || dx>8 || dy>8) return;      // seret = gerak gambar, tap = fokus
            const cv = cropper.getCanvasData(), cb = cropper.getCropBoxData();
            const r = box.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            const left = clamp(x - cb.width/2,  cv.left, cv.left + cv.width  - cb.width);
            const top  = clamp(y - cb.height/2, cv.top,  cv.top  + cv.height - cb.height);
            cropper.setCropBoxData({ left, top });
            vibrate(12);
            $('#crStat', bd).innerHTML = 'Bingkai difokus. Cubit atau guna +/- untuk zum.';
          });
        }
      },
      onClose: () => { try{ cropper && cropper.destroy(); }catch(e){} URL.revokeObjectURL(url); finish(null); }
    });
    const bd = $('[data-modal="'+id+'"]');
    bd.addEventListener('click', async e => {
      const c = e.target.closest('[data-cr]');
      if (c){ if(!cropper) return; const k=c.dataset.cr;
        if(k==='zin') cropper.zoom(0.15); if(k==='zout') cropper.zoom(-0.15); if(k==='rot') cropper.rotate(90); return; }
      if (!e.target.closest('[data-x="ok"]')) return;
      const stat = $('#crStat', bd);
      if (busy) return;
      if (!cropper){ stat.innerHTML = '<span class="text-[#E23B3B]">Gambar belum siap dimuatkan.</span>'; return; }
      busy = true; stat.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
      try {
        const cvs = cropper.getCroppedCanvas(Object.assign(
          { width:opt.w, height:opt.h, imageSmoothingQuality:'high' },
          opt.png ? {} : { fillColor:'#0A0F15' }));      // PNG kekal latar telus
        if (!cvs) throw new Error('Kanvas tidak dapat dijana');
        const out = await encodeTarget(cvs, { alpha: !!opt.png, minB: opt.minB, maxB: opt.maxB || (opt.png ? 120*1024 : 60*1024) });
        stat.innerHTML = '<i class="fa-solid fa-circle-check text-cyan"></i> Selesai · ' + kb(out) + 'KB';
        finish(out); closeModal(id);
      } catch(err){
        busy = false;
        stat.innerHTML = '<span class="text-[#E23B3B]">Gagal: '+esc(err.message||err)+'. Cuba lagi.</span>';
      }
    });
  });
}
function checkImage(file){
  if (!file.type.startsWith('image/')){ toast('Fail bukan imej. Pilih gambar JPG atau PNG.', null, true); return false; }
  if (file.size > 10*1024*1024){ toast('Saiz gambar melebihi 10MB. Pilih gambar lebih kecil.', null, true); return false; }
  return true;
}
/* Aliran gambar pelajar: banner 1:2 → ikon 1:1 (manual, tap pada muka) */
async function photoFlow(file, sid, done){
  if (!checkImage(file)) return;
  const banner = await cropModal({ file, ratio:0.5, w:400, h:800, minB:12*1024, maxB:45*1024,
    title:'Langkah 1 — Banner (1:2)', hint:'Bingkai penuh badan untuk Student Banner.' });
  if (!banner) return;
  const icon = await cropModal({ file, ratio:1, w:200, h:200, minB:4*1024, maxB:18*1024, focus:true,
    title:'Langkah 2 — Ikon Muka (1:1)', hint:'Tekan pada muka pelajar untuk fokus, zum sehingga muka penuh bingkai.' });
  if (!icon) return;
  let tries = 0, ok = false, lastErr = null;
  while (tries < 3 && !ok){
    try { await photoSet(sid,'banner',banner); await photoSet(sid,'icon',icon); ok = true; }
    catch(err){ lastErr = err; tries++; if (tries<3) await new Promise(r=>setTimeout(r,700)); }
  }
  if (!ok) return toast('Gagal menyimpan gambar: '+((lastErr&&lastErr.message)||'ralat storan'), null, true);
  save(true); done && done(); toast('Gambar dikemas kini · banner '+kb(banner)+'KB + ikon '+kb(icon)+'KB'+(webpOk()?' (WebP)':''));
}

/* ---------- PEMAMPATAN AUTOMATIK ----------
   WebP digunakan jika pelayar menyokong (2-4x lebih kecil daripada JPEG/PNG pada kualiti sama),
   jika tidak jatuh ke JPEG (gambar) atau PNG dikecilkan (imej bertelus). */
let WEBP_OK = null;
function webpOk(){
  if (WEBP_OK === null){
    try { const c = document.createElement('canvas'); c.width = c.height = 1; WEBP_OK = c.toDataURL('image/webp').indexOf('data:image/webp') === 0; }
    catch(e){ WEBP_OK = false; }
  }
  return WEBP_OK;
}
const dataBytes = d => Math.round((String(d).length - (String(d).indexOf(',') + 1)) * 0.75);
const kb = d => Math.max(1, Math.round(dataBytes(d) / 1024));
function scaleCanvas(src, f){
  const t = document.createElement('canvas');
  t.width = Math.max(16, Math.round(src.width * f));
  t.height = Math.max(16, Math.round(src.height * f));
  const c = t.getContext('2d');
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.drawImage(src, 0, 0, t.width, t.height);
  return t;
}
async function encodeTarget(canvas, o){
  o = o || {};
  const cap = ((S && S.config && S.config.maxUploadKB) || 200) * 1024;   // had keras setiap gambar
  const maxB = Math.min(o.maxB || 80*1024, cap), minB = Math.min(o.minB || 0, maxB * 0.6), alpha = !!o.alpha;
  if (webpOk()){
    let q = 0.86, out = canvas.toDataURL('image/webp', q);
    for (let i = 0; i < 8; i++){
      const s = dataBytes(out);
      if (s > maxB && q > 0.36) q = Math.max(0.32, q - 0.1);
      else if (s < minB && q < 0.92) q = Math.min(0.92, q + 0.06);
      else break;
      out = canvas.toDataURL('image/webp', q);
    }
    if (dataBytes(out) <= maxB * 1.5) return out;
  }
  if (!alpha) return await toJpegTarget(canvas, minB, maxB);
  let cvs = canvas, out = cvs.toDataURL('image/png'), f = 1;
  while (dataBytes(out) > maxB && f > 0.4){
    f *= 0.8;
    out = scaleCanvas(canvas, f).toDataURL('image/png');
  }
  return out;
}
async function toJpegTarget(canvas, minB, maxB){
  let q = 0.82, out = canvas.toDataURL('image/jpeg', q);
  const sz = d => d.length * 0.75;
  for (let i=0; i<7; i++){
    const s = sz(out);
    if (s > maxB) q = Math.max(0.35, q - 0.1);
    else if (s < minB && q < 0.95) q = Math.min(0.95, q + 0.07);
    else break;
    out = canvas.toDataURL('image/jpeg', q);
  }
  return out;
}

/* ============ MODAL PENILAIAN ============ */
async function openEval(studentIds, titleText, opts){
  opts = opts || {};
  if (!(await ensureContext())) return;
  const ADD = !!opts.add;
  if (!ctxOk()) return toast('Sila pilih Kelas dan Subjek terlebih dahulu.', null, true);
  const ms = metricsFor(S.ui.activeClassId, S.ui.activeSubjectId);
  const names = studentIds.map(i=>(stu(i)||{}).name).filter(Boolean);
  if (!ms.length){
    return openModal({ center:true, icon:'fa-triangle-exclamation', title:'Tiada Matrik',
      body:'<div class="text-[14px]">Tiada matrik penilaian untuk kelas &amp; subjek ini. Sila tambah di Tetapan → Pengurusan Matrik.</div>',
      footer:'<button class="btn btn-o clip-s flex-1" data-close="1">Faham</button>' });
  }
  // Muatkan kedudukan tombol dari rekod sesi HARI INI (kumpulan atau individu — sumber sama)
  const today = recDate(), sj = S.ui.activeSubjectId;
  const loaded = {}, mixed = {};
  let hasRec = 0, touches = 0;
  ms.forEach(m => {
    const vv = studentIds.map(sid => {
      const rec = ((S.records[sid]||{})[sj]||{})[today];
      return rec ? ((m.id in (rec.metricScores||{})) ? rec.metricScores[m.id] : BASE()) : BASE();
    });
    const uniq = Array.from(new Set(vv));
    loaded[m.id] = ADD ? 0 : (uniq.length === 1 ? uniq[0] : Math.round(vv.reduce((a,b)=>a+b,0)/vv.length));
    mixed[m.id] = !ADD && uniq.length > 1;
  });
  studentIds.forEach(sid => {
    const rec = ((S.records[sid]||{})[sj]||{})[today];
    if (rec){ hasRec++; touches = Math.max(touches, rec.touchCount||1); }
  });
  const sliders = ms.map(m =>
    '<div class="panel clip-s p-2 mb-2" data-mwrap="'+m.id+'">' +
      '<div class="flex items-center gap-2">' +

/* Tanda kehadiran: sesi hari ini bermula pada baseline, + bonus kehadiran pada SEMUA matrik */
function markAttendance(ids){
  if (!ctxOk()) { toast('Sila pilih Kelas dan Subjek terlebih dahulu.', null, true); return 0; }
  const ms = metricsFor(S.ui.activeClassId, S.ui.activeSubjectId);
  if (!ms.length){ toast('Tiada matrik penilaian untuk kelas & subjek ini.', null, true); return 0; }
  const date = recDate(), sj = S.ui.activeSubjectId, bonus = (S.config.attendBonus || 20), base = BASE();
  let n = 0, skip = 0;
  ids.forEach(sid => {
    S.records[sid] = S.records[sid] || {};
    S.records[sid][sj] = S.records[sid][sj] || {};
    let rec = S.records[sid][sj][date];
    if (rec && rec.attended){ skip++; return; }
    if (!rec){ rec = { totalScore:0, metricScores:{}, tpAwarded:calcTP(base), touchCount:0 }; ms.forEach(m => rec.metricScores[m.id] = base); }
    ms.forEach(m => { const cur = (m.id in rec.metricScores) ? rec.metricScores[m.id] : base; rec.metricScores[m.id] = clamp(cur + bonus, SC_MIN, SC_MAX); });
    rec.attended = true;
    stampTopic(rec, (stu(sid)||{}).classId || S.ui.activeClassId, sj, date);
    rec.metricCount = ms.length;
    rec.totalScore = Object.keys(rec.metricScores).reduce((a,k)=>a+rec.metricScores[k],0);
    rec.rate = clamp(rec.totalScore / Math.max(1, ms.length), SC_MIN, SC_MAX);
    rec.tpAwarded = calcTP(rec.rate);
    blendRec(rec);
    rec.touchCount = (rec.touchCount||0) + 1;
    rec.updatedAt = Date.now();
    S.records[sid][sj][date] = rec;
    n++;
  });
  if (n) save(true);
  if (skip) toast(skip + ' pelajar sudah ditanda hadir hari ini.');
  return n;
}
/* ---------- JADUAL HARI KELAS ----------
   Jika jadual tidak ditetapkan, semua hari dianggap hari kelas (kelakuan asal). */
const DAY_NAMES = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const ttKey = (cid, sj) => cid + '|' + sj;
function classDays(cid, sj){ const d = (S.timetable||{})[ttKey(cid,sj)]; return Array.isArray(d) && d.length ? d : null; }
/* Jika kelas ini sudah ada jadual untuk mana-mana subjek, subjek tanpa jadual bermakna
   memang TIADA kelas subjek itu untuk kelas berkenaan. */
function classHasTimetable(cid){
  return Object.keys(S.timetable||{}).some(k => k.split('|')[0] === cid && (S.timetable[k]||[]).length);
}
function classDayStatus(cid, sj, dateKey){
  if (!cid || !sj) return { ok:true };
  const d = classDays(cid, sj);
  if (!d) return classHasTimetable(cid) ? { ok:false, none:true } : { ok:true };
  const dow = new Date((dateKey||todayKey())+'T00:00:00').getDay();
  return d.indexOf(dow) >= 0 ? { ok:true } : { ok:false, none:false, days:d };
}
function isClassDay(cid, sj, dateKey){ return classDayStatus(cid, sj, dateKey).ok; }
const todayIsClassDay = () => isClassDay(S.ui.activeClassId, S.ui.activeSubjectId, recDate());
function subjectsToday(cid){
  const dow = new Date().getDay();
  return S.subjects.filter(s => { const d = classDays(cid, s.id); return d && d.indexOf(dow) >= 0; });
}
/* Tukar subjek automatik mengikut jadual hari ini — elak guru terlupa tukar */
function autoSubject(){
  const cid = S.ui.activeClassId; if (!cid) return;
  const list = subjectsToday(cid);
  if (!list.length) return;
  if (list.some(s => s.id === S.ui.activeSubjectId)) return;
  const dow = DAY_NAMES[new Date().getDay()];
  if (list.length === 1){
    S.ui.activeSubjectId = list[0].id; save(); renderAll();
    toast('Subjek ditukar automatik: ' + list[0].name + ' (jadual ' + dow + ').');
    return;
  }
  const id = openModal({ center:true, icon:'fa-calendar-check', title:'Subjek Hari Ini',
    body:'<div class="text-[13px] mb-3">Mengikut jadual, <b>'+esc(clsName(cid))+'</b> ada '+list.length+' subjek pada hari '+dow+'. Pilih yang mana satu:</div>' +
      list.map(s=>'<button class="btn btn-o clip-s w-full mb-2 !py-2" data-asub="'+s.id+'">'+esc(s.name)+'</button>').join(''),
    footer:'<button class="btn clip-s flex-1" data-close="1">Kekalkan pilihan semasa</button>' });
  const bd = $('[data-modal="'+id+'"]');

/* TP hari ini — sama seperti yang dipapar dalam modal nilai. Belum dinilai = baseline (TP1). */
function todayTP(sid){
  const r = ((S.records[sid]||{})[S.ui.activeSubjectId]||{})[recDate()];
  return r ? (r.tpAwarded || calcTP(rateOf(r))) : calcTP(BASE());
}
const attendedToday = (sid) => { const r = ((S.records[sid]||{})[S.ui.activeSubjectId]||{})[recDate()]; return !!(r && r.attended); };
function commitEval(studentIds, vals, ms, add){
  const date = recDate(), sj = S.ui.activeSubjectId;
  studentIds.forEach(sid => {
    S.records[sid] = S.records[sid] || {};
    S.records[sid][sj] = S.records[sid][sj] || {};
    const rec = S.records[sid][sj][date] || { totalScore:0, metricScores:{}, tpAwarded:3, touchCount:0 };
    ms.forEach(m => {
      // add=true: top-up di atas nilai sedia ada · add=false: kedudukan tombol = nilai sesi hari ini
      rec.metricScores[m.id] = clamp((add ? (rec.metricScores[m.id]||0) : 0) + (vals[m.id]||0), SC_MIN, SC_MAX);
    });
    const keys = Object.keys(rec.metricScores);
    rec.totalScore = keys.reduce((a,k)=>a+rec.metricScores[k],0);
    rec.metricCount = ms.length;                                  // normalisasi: simpan bilangan matrik aktif
    rec.rate = clamp(rec.totalScore / Math.max(1, ms.length), SC_MIN, SC_MAX);
    rec.tpAwarded = calcTP(rec.rate);                             // TP dari KADAR PURATA, bukan jumlah
    blendRec(rec);                                                // gabung dengan markah game hari ini
    rec.touchCount = (rec.touchCount||0) + 1;   // info sahaja — totalEvaluations kekal 1 sehari
    if (!todayIsClassDay()) rec.outside = true;
    stampTopic(rec, (stu(sid)||{}).classId || S.ui.activeClassId, sj, date);   // topik DSKP sesi ini
    rec.updatedAt = Date.now();
    S.records[sid][sj][date] = rec;
  });
  save(true);
  return studentIds.length;
}

    const dest = z==='pool' ? 'Ruang Menunggu' : (S.groups.find(g=>g.id===z.slice(2))||{}).name;
    toast(s.name+' → '+dest);
  });
}
function dropTo(sid, zone){
  S.groups.forEach(g => g.members = (g.members||[]).filter(m=>m!==sid));
  if (zone !== 'pool'){
    const g = S.groups.find(x=>x.id === zone.slice(2));
    if (g){ g.members = g.members||[]; g.members.push(sid); }
  }
  save(true); vibrate(15);
}

async function groupAdd(){
  const n = await promptBox({ title:'Kumpulan Baharu', label:'NAMA KUMPULAN', value:'Kumpulan '+(S.groups.filter(g=>g.classId===S.ui.activeClassId).length+1) });
  if (!n) return;

}
async function groupRename(gid){
  const g = S.groups.find(x=>x.id===gid); if(!g) return;
  const n = await promptBox({ title:'Tukar Nama', label:'NAMA KUMPULAN', value:g.name });
  if (!n) return; g.name = n; save(true); renderTab();
}
async function groupClear(gid){
  const g = S.groups.find(x=>x.id===gid); if(!g) return;
  if (!(g.members||[]).length) return toast('Kumpulan ini sudah kosong.');
  const snap = snapshot();
  g.members = []; save(true); renderTab();
  toast('Ahli dikembalikan ke ruang menunggu.', ()=>restore(snap));
}
async function groupDel(gid){
  const g = S.groups.find(x=>x.id===gid); if(!g) return;
  const n = (g.members||[]).length;
  const ok = await confirmBox({ danger:true, title:'Padam Kumpulan', okText:'Padam',
    message: n ? 'Kumpulan ini mempunyai <b>'+n+' ahli</b>. Memadam kumpulan akan mengembalikan semua ahli ke Ruang Menunggu. Teruskan?'
               : 'Padam kumpulan <b>'+esc(g.name)+'</b>?' });
  if (!ok) return;
  const snap = snapshot();
  S.groups = S.groups.filter(x=>x.id!==gid);
  save(true); renderTab();
  toast('Kumpulan dipadam'+(n?' · '+n+' ahli kembali ke ruang menunggu':'')+'.', ()=>restore(snap));
}
async function groupAuto(){
  const cid = S.ui.activeClassId;
  const list = studentsOf(cid);
  if (!list.length) return;
  const n = await promptBox({ title:'Auto-Susun', label:'BILANGAN KUMPULAN', value:'4' });
  const k = clamp(parseInt(n,10)||0, 1, 20); if (!k) return;
  const mode = await confirmBox({ title:'Kaedah Susunan', okText:'Seimbang (Avg TP)',
    message:'Pilih kaedah susunan kumpulan.<br><span class="text-muted text-[12px]">Batal = susunan rawak.</span>' });
  let arr = list.slice();
  if (mode) arr.sort((a,b)=> stats(b.id,S.ui.activeSubjectId).avgTP - stats(a.id,S.ui.activeSubjectId).avgTP);
  else arr.sort(()=>Math.random()-0.5);
  const snap = snapshot();
  S.groups = S.groups.filter(g=>g.classId!==cid);
  const gs = [];
  for (let i=0;i<k;i++) gs.push({ id:uid('g'), classId:cid, name:'Kumpulan '+(i+1), members:[] });
  arr.forEach((s,i) => {
    const row = Math.floor(i/k);
    const idx = row % 2 === 0 ? i%k : (k-1 - i%k);   // ular (snake) untuk seimbang
    gs[mode?idx:i%k].members.push(s.id);
  });
  S.groups = S.groups.concat(gs);
  save(true); renderTab();
  toast(k+' kumpulan dijana.', ()=>restore(snap));
}

function download(name, text, mime){
  const b = new Blob([text], { type: mime||'application/json' });

}

async function clsAdd(){ const n = await promptBox({title:'Tambah Kelas', label:'NAMA KELAS', placeholder:'Contoh: 3 Bilal'}); if(!n) return; S.classes.push({id:uid('c'),name:n}); save(true); renderAll(); }
async function clsEdit(id){ const c=cls(id); if(!c) return; const n=await promptBox({title:'Sunting Kelas',label:'NAMA KELAS',value:c.name}); if(!n) return; c.name=n; save(true); renderAll(); }
async function clsDel(id){
  const c=cls(id); if(!c) return;
  if (isMerged(c)){
    const ok = await confirmBox({ danger:true, title:'Padam Kelas Gabungan', okText:'Padam',
      message:'Padam kelas gabungan <b>'+esc(c.name)+'</b>? Pelajar dan rekod mereka <b>tidak</b> terjejas — hanya kumpulan dan matrik khusus kelas gabungan ini dibuang.' });
    if (!ok) return;
    const snap = snapshot();
    S.groups = S.groups.filter(g=>g.classId!==id);
    S.metrics = S.metrics.filter(m=>m.classId!==id);
    S.classes = S.classes.filter(x=>x.id!==id);
    if (S.ui.activeClassId===id) S.ui.activeClassId='';
    save(true); renderAll(); toast('Kelas gabungan dipadam.', ()=>restore(snap));
    return;
  }
  const n = studentsOf(id).length;
  const ok = await confirmBox({danger:true,title:'Padam Kelas',okText:'Padam',
    message:'AMARAN: Memadam kelas <b>'+esc(c.name)+'</b> akan memadam <b>'+n+' pelajar</b> beserta semua rekod penilaian, lencana dan gambar mereka secara kekal. Adakah anda pasti?'});
  if(!ok) return;
  const snap = snapshot();
  for (const s of studentsOf(id)){ await photoDel(s.id); delete S.records[s.id]; }
  S.students = S.students.filter(s=>s.classId!==id);
  S.groups = S.groups.filter(g=>g.classId!==id);
  S.metrics = S.metrics.filter(m=>m.classId!==id);
  S.classes = S.classes.filter(x=>x.id!==id);
  S.classes.forEach(c2 => { if (isMerged(c2)) c2.merge = c2.merge.filter(m=>m!==id); });
  S.classes = S.classes.filter(c2 => !(Array.isArray(c2.merge) && c2.merge.length < 2));
  if (S.ui.activeClassId===id) S.ui.activeClassId='';
  if (S.ui.listClassId===id) S.ui.listClassId='';
  save(true); renderAll(); toast('Kelas dipadam.', ()=>restore(snap));
}

    S.classes.push({ id:uid('c'), name:nm, merge:sel });
    save(true); closeModal(id); renderAll(); toast('Kelas gabungan dicipta: '+nm);
  });

function mtxEdit(id){ const m = S.metrics.find(x=>x.id===id); if (m) mtxForm(m); }
async function mtxDel(id){
  const m = S.metrics.find(x=>x.id===id); if(!m) return;
  const ok = await confirmBox({danger:true,title:'Padam Matrik',okText:'Padam',
    message:'AMARAN: Memadam matrik ini akan menyebabkan KEHILANGAN DATA penilaian yang telah diberikan kepada semua pelajar secara kekal. Adakah anda pasti?'});
  if(!ok) return;
  const snap = snapshot();
  S.metrics = S.metrics.filter(x=>x.id!==id);
  Object.keys(S.records).forEach(sid => Object.keys(S.records[sid]).forEach(sj => Object.keys(S.records[sid][sj]).forEach(dt => {
    const r = S.records[sid][sj][dt];
    if (r.metricScores && r.metricScores[id] !== undefined){
      delete r.metricScores[id];
      const kn = Object.keys(r.metricScores).length;
      r.totalScore = Object.keys(r.metricScores).reduce((a,k)=>a+r.metricScores[k],0);
      r.metricCount = Math.max(1, kn);
      r.rate = clamp(r.totalScore / r.metricCount, SC_MIN, SC_MAX);
      r.tpAwarded = calcTP(r.rate);
    }
  })));
  save(true); renderTab(); toast('Matrik dipadam & data dibersihkan.', ()=>restore(snap));
}

function chapterTP(studentId, ch){
  if (!ch.start || !ch.end) return 0;                       // tarikh belum ditetapkan → kosong
  const days = (S.records[studentId] || {})[ch.subjectId] || {};
  const tps = Object.keys(days).filter(d => d >= ch.start && d <= ch.end)
    .map(d => days[d].tpAwarded || calcTP(rateOf(days[d])));
  if (!tps.length) return 0;
  return clamp(Math.round(tps.reduce((a,b)=>a+b,0) / tps.length), 1, 6);
}

function rpmCsv(){
  const cid = S.ui.activeClassId, sj = S.ui.activeSubjectId;
  if (subjDskp(sj) && subjBook(sj)){
    const b = subjBook(sj), units = taughtUnits(cid, sj), q = v => '"' + String(v).replace(/"/g,'""') + '"';
    const L = [q('LAPORAN RPM — PENCAPAIAN TP MENGIKUT TAJUK DSKP'), [q('Kelas'), q(clsName(cid))].join(','), [q('Subjek'), q(subjName(sj))].join(','),
      [q('Dijana pada'), q(new Date().toLocaleString('ms-MY'))].join(','), '', ['Bil','Nama'].concat(units.map(u => q(unitName(b, u)))).concat([q('TP Akhir')]).join(',')];
    studentsOf(cid).forEach((s, i) => { const st = stats(s.id, sj); L.push([i + 1, q(s.name)].concat(units.map(u => { const tp = unitTP(s.id, sj, u); return tp ? 'TP' + tp : ''; })).concat([st.finalTP ? 'TP' + st.finalTP : '']).join(',')); });
    download('RPM_' + clsName(cid).replace(/\s+/g,'_') + '_' + subjName(sj).replace(/[^\w]+/g,'_') + '_' + todayKey() + '.csv', '﻿' + L.join('\n'), 'text/csv');
    return toast('RPM dimuat turun.');
  }
  const chs = S.chapters.filter(c => c.subjectId === sj);
  const list = studentsOf(cid);
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const lines = [
    [q('LAPORAN RPM — PENCAPAIAN TP MENGIKUT BAB')].join(','),
    [q('Kelas'), q(clsName(cid))].join(','),
    [q('Subjek'), q(subjName(sj))].join(','),
    '',
    ['Bil','Nama'].concat(chs.map(c=>q(c.name))).join(',')
  ];
  list.forEach((s,i) => {
    lines.push([i+1, q(s.name)].concat(chs.map(c => { const tp = chapterTP(s.id, c); return tp ? 'TP'+tp : ''; })).join(','));
  });
  download('RPM_'+clsName(cid).replace(/\s+/g,'_')+'_'+subjName(sj).replace(/\s+/g,'_')+'_'+todayKey()+'.csv', '\uFEFF'+lines.join('\n'), 'text/csv');
  toast('RPM dimuat turun.');
}

/* ---------- Firebase config / rules / data ---------- */
/* Kesan config Firebase dari mana-mana format: snippet JS, objek JSON, atau tampalan penuh */
function parseFbConfig(text){
  const keys = ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId','measurementId'];
  const cfg = {};
  keys.forEach(k => {
    const m = text.match(new RegExp('["\'`]?\\b' + k + '\\b["\'`]?\\s*[:=]\\s*["\'`]([^"\'`]+)["\'`]'));
    if (m) cfg[k] = m[1].trim();
  });
  // Jika databaseURL tiada tetapi projectId ada, cadangkan URL RTDB lalai
  if (!cfg.databaseURL && cfg.projectId) cfg.databaseURL = 'https://' + cfg.projectId + '-default-rtdb.firebaseio.com';
  return cfg;
}

      }
      const detect = () => {
        const box = $('#fbDetect', bd);
        const raw = ta.value.trim();
        if (!raw){ box.innerHTML = '<div class="text-[12px] text-muted">Tiada teks — mod tempatan.</div>'; return {}; }
        const c = parseFbConfig(raw);
        const need = ['apiKey','authDomain','databaseURL','projectId','storageBucket','appId'];
        const rows = need.concat(['messagingSenderId','measurementId']).map(k => {
          const v = c[k];
          const req = need.indexOf(k) >= 0;

            '<span class="w-[118px] text-muted">' + k + '</span>' +

        }).join('');
        const miss = need.filter(k => !c[k]);
        box.innerHTML = '<div class="panel clip-s p-2">' + rows +
          (miss.length ? '<div class="text-[11px] text-[#E23B3B] mt-1">Belum lengkap: ' + miss.join(', ') + '</div>'
                       : '<div class="text-[11px] text-cyan mt-1">Lengkap — sedia untuk sambung.</div>') + '</div>';
        return c;
      };
      ta.addEventListener('input', detect);
      ta.addEventListener('paste', () => setTimeout(detect, 30));
      detect();
    } });
  const bd = $('[data-modal="'+id+'"]');
  bd.addEventListener('click', e => {
    if (!e.target.closest('[data-x="ok"]')) return;
    const raw = ($('#fbPaste', bd).value||'').trim();
    if (!raw){
      localStorage.removeItem(LS_FB);
      closeModal(id); toast('Mod tempatan. Memuat semula...');
      return setTimeout(()=>location.reload(), 800);
    }
    const cfg = parseFbConfig(raw);
    if (!cfg.apiKey || !cfg.databaseURL) return toast('apiKey atau databaseURL tidak dikesan. Semak tampalan.', null, true);
    localStorage.setItem(LS_FB, JSON.stringify(cfg));
    if (localStorage.getItem(LS_LINK) !== linkKey(cfg)) localStorage.removeItem(LS_LINK);
    closeModal(id); toast('Konfigurasi disimpan. Menyambung...');
    setTimeout(()=>location.reload(), 900);
  });
}

function expJson(){
  const payload = JSON.parse(JSON.stringify(S));
  payload.photos = PHOTOS;
  download('edurank_backup_'+todayKey()+'.json', JSON.stringify(payload, null, 1));
  toast('Backup JSON dimuat turun.');
}
function impJson(){
  const inp = $('#fileJson'); inp.value='';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const d = JSON.parse(rd.result);
        const ok = await confirmBox({danger:true,title:'Import JSON',okText:'Ganti Data',
          message:'Data semasa akan DIGANTI sepenuhnya dengan kandungan fail ini. Teruskan?'});
        if(!ok) return;
        const ph = d.photos || {}; delete d.photos;
        S = migrate(d);
        Object.keys(ph).forEach(k => { PHOTOS[k]=ph[k]; idbPut(k, ph[k]); });
        save(true); renderAll(); toast('Data diimport.');
      } catch(e){ toast('Fail JSON tidak sah.', null, true); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
async function rollover(){
  const ok = await confirmBox({danger:true,title:'Rollover Tahun Akademik',okText:'Teruskan',
    message:'Backup JSON akan dimuat turun dahulu. Kemudian:<br>• Pelajar Tingkatan 5 digraduasikan (dipadam)<br>• Kelas lain naik +1 tingkatan<br>• Semua skor &amp; sesi penilaian direset<br><br>Teruskan?'});
  if(!ok) return;
  expJson();
  await new Promise(r=>setTimeout(r, 900));
  const snap = snapshot();
  const grad = S.classes.filter(c=>/^\s*5/.test(c.name)).map(c=>c.id);
  for (const s of S.students.filter(x=>grad.includes(x.classId))) await photoDel(s.id);
  S.students = S.students.filter(s=>!grad.includes(s.classId));
  S.classes = S.classes.filter(c=>!grad.includes(c.id));
  S.metrics = S.metrics.filter(m=>!grad.includes(m.classId));
  S.groups = [];
  S.classes.forEach(c => c.name = c.name.replace(/^(\s*)([1-4])/, (m,a,d)=> a + (parseInt(d,10)+1)));
  S.records = {};
  save(true); renderAll();
  toast('Rollover selesai · '+grad.length+' kelas digraduasikan.', ()=>restore(snap));
}
async function wipeAll(){
  const ok = await confirmBox({danger:true,title:'Padam Semua Data',okText:'Padam Semua',
    message:'SEMUA kelas, subjek, pelajar, matrik, lencana, gambar dan rekod akan dipadam kekal. Eksport JSON dahulu jika perlu. Teruskan?'});
  if(!ok) return;
  for (const s of S.students) await photoDel(s.id);
  S = blank(); save(true); renderAll(); toast('Semua data dipadam.');
}

function showcaseRank(o){
  const sj = (o.scope==='ctx' || o.scope==='subject') ? S.ui.activeSubjectId : null;
  let list = S.students.slice();
  if (o.scope==='ctx' || o.scope==='class') list = list.filter(s=>s.classId===S.ui.activeClassId);
  return list.map(s => ({ s, ...stats(s.id, sj), rp: rpOf(s.id, sj), sj }))
    .filter(r => r.sessions > 0)
    .sort((a,b) => o.sort==='avg' ? (b.avgTP-a.avgTP || b.score-a.score) : o.sort==='score' ? (b.score-a.score || b.avgTP-a.avgTP) : ((b.rp||0)-(a.rp||0) || b.score-a.score))
    .slice(0, o.count);
}
/* Warna plat kedudukan: #1 emas, #2 perak, #3 gangsa, selebihnya cyan */
function tierOf(rank){
  if (rank===1) return { c1:'#FFD76A', c2:'#8A6410', glow:'rgba(255,205,90,.55)', pad:'11px', label:'JUARA', orn:true };
  if (rank===2) return { c1:'#DCE8F2', c2:'#6E7E8E', glow:'rgba(215,232,246,.42)', pad:'9px',  label:'NAIB JUARA', orn:true };
  if (rank===3) return { c1:'#E08E4A', c2:'#6E3A14', glow:'rgba(224,142,74,.42)', pad:'9px',  label:'TEMPAT KETIGA', orn:true };
  return         { c1:'#00F0FF', c2:'#1B4E5C', glow:'rgba(0,240,255,.28)', pad:'7px', label:'BARISAN TERBAIK', orn:false };
}

/* ============ SEDIAKAN GAMBAR SEBELUM DIPAPARKAN ============
   Showcase dibina daripada HTML (banner, tangga rank, ganjaran). Daripada
   menyenaraikan gambar satu per satu — yang mudah tertinggal bila reka
   bentuk berubah — HTML setiap slaid dijana dahulu dalam <template>
   (lengai: tiada apa dimuat), lalu SETIAP URL gambar di dalamnya dikumpul. */
function htmlImageUrls(html){
  const t = document.createElement('template');
  t.innerHTML = html || '';
  const out = new Set();
  t.content.querySelectorAll('img[src]').forEach(i => out.add(i.getAttribute('src')));
  t.content.querySelectorAll('image').forEach(i => {
    const u = i.getAttribute('href') || i.getAttribute('xlink:href'); if (u) out.add(u); });
  t.content.querySelectorAll('[style]').forEach(e => {
    const s = e.getAttribute('style'), re = /url\(\s*(['"]?)(.*?)\1\s*\)/g; let m;
    while ((m = re.exec(s))) if (m[2]) out.add(m[2].replace(/&quot;/g, '"'));
  });
  return [...out].filter(u => u && !/^#/.test(u));
}
/* Nyahkod senarai gambar. Senyap jika siap cepat; jika lebih 250 ms (atau
   always), skrin memuat dibuka dengan kemajuan. Had masa supaya satu gambar
   yang tergantung di rangkaian tidak menahan pengguna selamanya. */
async function prepImages(urls, msg, opt){
  opt = opt || {};
  const want = [...new Set(urls || [])].filter(u => u && !IMG_KEEP.has(u));
  let id = opt.screen || null, done = 0, fin = false;
  const paint = () => {
    if (!id) return;
    const bd = $('[data-modal="' + id + '"]'); if (!bd) return;
    const b = $('#plBar', bd), t = $('#plTxt', bd);
    if (b) b.style.width = (want.length ? done / want.length * 100 : 100) + '%';
    if (t) t.textContent = want.length ? (done + ' / ' + want.length) : 'Sedia';
  };
  const q = want.slice();
  const workers = [];
  for (let w = 0; w < 8; w++) workers.push((async () => { while (q.length){ await preloadOne(q.shift()); done++; paint(); } })());
  const all = Promise.all(workers).then(() => { fin = true; });
  const cap = new Promise(r => setTimeout(r, opt.max || 15000));
  if (!id && !opt.always){
    await Promise.race([all, cap, new Promise(r => setTimeout(r, 250))]);
    if (fin || !want.length) return;
  }
  if (!id) id = loadScreen(want.length, true, msg);
  paint();
  await Promise.race([all, cap]);
  paint();
  if (!opt.keep){ await new Promise(r => setTimeout(r, 160)); closeModal(id); }
  return id;
}

const GENDERS = [{ k:'L', name:'Lelaki' }, { k:'P', name:'Perempuan' }];

const IMG_KEEP = new Map();
function preloadOne(url){
  if (!url) return Promise.resolve(null);
  const kept = IMG_KEEP.get(url);
  if (kept) return Promise.resolve(kept);
  return new Promise(res => {
    const im = new Image();
    const keep = () => { IMG_KEEP.set(url, im); res(im); };
    im.onload = () => { if (im.decode) im.decode().then(keep).catch(keep); else keep(); };
    im.onerror = () => res(null);

  });
}

const ASSET_KEEP = k => /:(banner|icon)$/.test(k) || /^(badge|frame|bgm|bgmdef|cache|dskp):/.test(k);
async function purgeSpriteAssets(){
  const gone = Object.keys(PHOTOS).filter(k => !ASSET_KEEP(k));
