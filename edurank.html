const TPC_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
  '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB300"/><stop offset="1" stop-color="#FF6B00"/></linearGradient></defs>' +
  '<path d="M32 2 L58 17 V47 L32 62 L6 47 V17 Z" fill="url(#g)" stroke="#00F0FF" stroke-width="2.5"/>' +
  '<path d="M32 9 L52 21 V43 L32 55 L12 43 V21 Z" fill="none" stroke="#0C1118" stroke-width="1.6" opacity=".55"/>' +
  '<text x="32" y="39" font-family="monospace" font-size="17" font-weight="bold" fill="#0C1118" text-anchor="middle">TPC</text></svg>');

/* ---------- Pemilihan kad ---------- */
const cardsOfTier = k => (S.cards || []).filter(c => c.tier === k);
function pickWeighted(tbl){
  let tot = 0; Object.keys(tbl).forEach(k => tot += tbl[k]);
  let r = Math.random() * tot;
  for (const k of Object.keys(tbl)){ r -= tbl[k]; if (r <= 0) return k; }
  return Object.keys(tbl)[0];
}
/* Kalau tier tiada kad, turun ke tier lebih rendah yang ada kad */
function drawCard(tierK){
  let i = tierRank(tierK);
  while (i >= 0){
    const list = cardsOfTier(CARD_TIERS[i].k);
    if (list.length) return list[Math.floor(Math.random() * list.length)];
    i--;
  }
  const any = S.cards || [];
  return any.length ? any[Math.floor(Math.random() * any.length)] : null;
}
function openPackRoll(pack, sid){
  S.pity = S.pity || {};
  let pity = S.pity[sid] || 0;
  const tiers = [];
  for (let i = 0; i < pack.base; i++) tiers.push(pickWeighted(BASE_ODDS));
  for (let i = 0; i < pack.rare; i++) tiers.push(pickWeighted(RARE_ODDS));
  for (let i = 0; i < pack.lucky; i++) tiers.push(pickWeighted(pack.luck));
  // jaminan pack mahal
  if (pack.grant && !tiers.some(t => tierRank(t) >= tierRank(pack.grant))){
    tiers[tiers.length - 1] = pack.grant;
  }
  // pity: 25 pack tanpa Legenda+ → jamin Legenda
  pity++;
  if (pity > PITY_MAX && !tiers.some(t => tierRank(t) >= tierRank('legenda'))){
    tiers[tiers.length - 1] = 'legenda';
  }
  if (tiers.some(t => tierRank(t) >= tierRank('legenda'))) pity = 0;
  S.pity[sid] = pity;
  // kocok rawak — tiada urutan, kejutan boleh datang bila-bila kad
  for (let i = tiers.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = tiers[i]; tiers[i] = tiers[j]; tiers[j] = tmp;
  }
  return tiers.map(t => ({ tier:t, card:drawCard(t) })).filter(x => x.card);
}
function grantCards(sid, pulls){
  S.collect = S.collect || {};
  S.collect[sid] = S.collect[sid] || {};
  const res = pulls.map(p => {
    const had = S.collect[sid][p.card.id] || 0;
    S.collect[sid][p.card.id] = had + 1;
    return { card:p.card, tier:p.tier, isNew: had === 0 };
  });
  return res;
}
const cardSrc = c => c ? (resolveUrl(c.url) || PHOTOS['card:' + c.id] || null) : null;
const ownedCount = (sid, cid) => ((S.collect || {})[sid] || {})[cid] || 0;
function collectionStats(sid){
  const have = Object.keys((S.collect || {})[sid] || {}).filter(k => (S.cards||[]).some(c => c.id === k));
  const byTier = {};
  CARD_TIERS.forEach(t => byTier[t.k] = { have:0, total:cardsOfTier(t.k).length });
  have.forEach(k => { const c = (S.cards||[]).find(x => x.id === k); if (c && byTier[c.tier]) byTier[c.tier].have++; });
  return { have:have.length, total:(S.cards||[]).length, byTier };
}

/* ---------- MUKA KAD ---------- */
function tierStars(k){ return tierRank(k) + 1; }          // Sial 1 ⭐ … Mitos 6 ⭐
function cardFaceHtml(card, tier, opts){

    (opts.badge ? '<div class="cf-new">'+opts.badge+'</div>' : '') +

/* ---------- BUKA PACK ---------- */
let SFX_ON = true;
function sfx(type){
  if (!SFX_ON) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    SFX_CTX = SFX_CTX || new C();
    const a = SFX_CTX, t = a.currentTime;
    const beep = (f1, f2, dur, typ, vol) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = typ || 'sine'; o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
      g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
    };
    if (type === 'tear'){ const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.25, a.sampleRate);
      const d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length) * 0.35;
      n.buffer = b; const g = a.createGain(); g.gain.value = 0.5; n.connect(g); g.connect(a.destination); n.start(); }
    else if (type === 'flip') beep(520, 300, 0.09, 'triangle', 0.08);
    else if (type === 'low') beep(300, 180, 0.12, 'square', 0.06);
    else if (type === 'hi'){ beep(660, 990, 0.35, 'sine', 0.14); setTimeout(()=>beep(880, 1320, 0.45, 'sine', 0.12), 120); }
    else if (type === 'myth'){ beep(120, 40, 0.8, 'sawtooth', 0.22); setTimeout(()=>beep(880,1760,0.9,'sine',0.16), 180); setTimeout(()=>beep(1320,2640,1.1,'sine',0.12), 380); }
    else if (type === 'burst') beep(180, 900, 0.5, 'sawtooth', 0.16);
    else if (type === 'swing'){                       // desing serangan
      const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.16, a.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++){ const p = i/d.length; d[i] = (Math.random()*2-1) * Math.pow(1-p,2) * 0.5; }
      n.buffer = b;
      const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(900, t);
      f.frequency.exponentialRampToValueAtTime(2600, t+0.16);
      const g = a.createGain(); g.gain.value = 0.5;
      n.connect(f); f.connect(g); g.connect(a.destination); n.start();
    }
    else if (type === 'impact'){                      // hentaman kena
      beep(220, 60, 0.18, 'square', 0.18);
      const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.12, a.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length,3) * 0.6;
      n.buffer = b; const g = a.createGain(); g.gain.value = 0.45;
      n.connect(g); g.connect(a.destination); n.start();
    }
    else if (type === 'shoot'){                       // tali busur / lontaran dilepaskan
      beep(170, 80, 0.16, 'triangle', 0.16);
      const n = a.createBufferSource(); const b = a.createBuffer(1, a.sampleRate*0.1, a.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++){ const p = i/d.length; d[i] = (Math.random()*2-1) * Math.pow(1-p,3) * 0.5; }
      n.buffer = b;
      const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(3200, t);
      f.frequency.exponentialRampToValueAtTime(1200, t+0.1);
      const g = a.createGain(); g.gain.value = 0.35;
      n.connect(f); f.connect(g); g.connect(a.destination); n.start();
    }
    else if (type === 'statup') beep(760, 1240, 0.12, 'triangle', 0.1);     // nombor stat naik
    else if (type === 'cardup'){ beep(380, 980, 0.3, 'triangle', 0.13); setTimeout(()=>beep(620,1500,0.35,'sine',0.1), 110); }
  } catch(e){}
}
let SFX_CTX = null;

/* ============ MUZIK LATAR & BUNYI SERANGAN ============
   Lagu dimainkan melalui Web Audio daripada memori, bukan <audio loop>.
   <audio loop> meninggalkan sela kecil di setiap pusingan (terutama MP3);
   AudioBufferSourceNode.loop pula menyambung sampel demi sampel, jadi
   lagu gelung pendek tidak lagi terasa berulang.                         */
const BGM_SLOTS = [
  { k:'map',  name:'Peta Taktikal',    ico:'fa-chess-board', hint:'Papan bird-eye view semasa bertempur' },
  { k:'duel', name:'Lakonan Dekat',    ico:'fa-khanda',      hint:'Pentas 1 lawan 1 dan dialog — tanpanya, lagu Peta diteruskan' },
  { k:'menu', name:'Menu & Lain-lain', ico:'fa-house',       hint:'Tetapan, senarai pelajar dan skrin lain sebelum bermain' }
];
function audCtx(){
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return null;
  SFX_CTX = SFX_CTX || new C();
  return SFX_CTX;
}
/* Lagu lalai, dijana oleh pemilik app di Suno. Tidak dibenamkan dalam fail
   HTML (akan menambah belasan MB dan melambatkan setiap pembukaan app);
   sebaliknya dimuat turun SEKALI, kemudian disimpan kekal dalam IndexedDB
   supaya selepas itu ia dimainkan serta-merta, walaupun tanpa internet.
   Lagu yang guru muat naik sendiri sentiasa menggantikan lagu lalai.     */
const BGM_DEF = {
  menu: { id:'0a6c6781-15ee-4d20-9442-cf9c5ca64edc', name:'Main Theme' },
  map:  { id:'9d14e248-7f4d-429c-a807-979a9448b80c', name:'Steady Groove' },
  duel: { id:'f9897d8d-3d8b-4715-8d63-ae5f4edee8c8', name:'Battle Riff' }
};
const bgmDefUrl = k => BGM_DEF[k] ? 'https://cdn1.suno.ai/' + BGM_DEF[k].id + '.mp3' : null;
const bgmOwn = k => { const r = (S.bgm || {})[k]; return r ? (resolveUrl(r.url) || PHOTOS['bgm:' + k] || null) : null; };
const bgmDefOn = () => !(S && S.config && S.config.bgmDef === 0);
const bgmSrc = k => bgmOwn(k) || (bgmDefOn() ? (PHOTOS['bgmdef:' + k] || bgmDefUrl(k)) : null);
/* Simpan lagu lalai yang sudah berjaya dimuat turun, sekali sahaja. */
async function bgmCacheDef(k, ab){
  if (PHOTOS['bgmdef:' + k] || !ab) return;
  try {
    const data = await new Promise((res, rej) => { const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(new Blob([ab], { type:'audio/mpeg' })); });
    PHOTOS['bgmdef:' + k] = data; await idbPut('bgmdef:' + k, data);
  } catch(e){}
}
const atkSfxSrc = c => { const r = (S.atkSfx || {})[c]; return r ? (resolveUrl(r.url) || PHOTOS['asfx:' + c] || null) : null; };

/* Titik gelung: buang senyap di awal dan hujung fail — MP3 hampir selalu
   membawa padding pengekod beberapa puluh milisaat yang menjadi "ketukan
   kosong" setiap kali lagu berpusing. Dihadkan 0.25 s supaya rehat muzik
   yang memang disengajakan tidak terpotong. */
function loopPoints(buf){
  const sr = buf.sampleRate, n = buf.length, ch = [];
  for (let c = 0; c < buf.numberOfChannels; c++) ch.push(buf.getChannelData(c));
  const loud = i => ch.some(d => Math.abs(d[i]) > 0.0015);
  const cap = Math.min(Math.floor(sr * 0.25), Math.floor(n / 4));
  let s = 0; while (s < cap && !loud(s)) s++;
  let e = n - 1; while ((n - 1 - e) < cap && !loud(e)) e--;
  if (s >= cap) s = 0;
  if ((n - 1 - e) >= cap) e = n - 1;
  return { ls: s / sr, le: (e + 1) / sr };
}
const AUD_BUF = {};
const audKey = src => src.length + ':' + src.slice(-48);
const AUD_RAW = {};
function audBuf(src){
  if (!src) return Promise.resolve(null);
  const k = audKey(src);
  if (AUD_BUF[k]) return AUD_BUF[k];
  const a = audCtx(); if (!a) return Promise.resolve(null);
  AUD_BUF[k] = fetch(src).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
    .then(ab => { if (/^https?:/.test(src)) AUD_RAW[k] = ab.slice(0); return ab; })
    /* decodeAudioData juga memulangkan Promise di pelayar moden; kalau tidak
       ditangkap, fail rosak menjadi ralat halaman walaupun panggilan balik
       ralat sudah dipasang. */
    .then(ab => new Promise((res, rej) => { const p = a.decodeAudioData(ab, res, rej); if (p && p.catch) p.catch(rej); }))
    .then(buf => Object.assign({ buf }, loopPoints(buf)))
    .catch(() => { delete AUD_BUF[k]; return null; });
  return AUD_BUF[k];
}

const BGM = { id:null, src:null, node:null, gain:null, el:null, preview:null, unlocked:false, tok:0 };
function bgmVol(){
  const v = S && S.config ? S.config.bgmVol : undefined;
  return (v === undefined || v === null || isNaN(+v)) ? 0.6 : clamp(+v, 0, 100) / 100;
}
const bgmOn = () => !(S && S.config && S.config.bgmOn === 0);
/* Skrin mana sedang dipaparkan? Pentas lakonan dekat di atas papan, papan
   di atas menu. */
function bgmScene(){
  if (document.querySelector('#dcStage')) return 'duel';
  if (document.querySelector('#tgBoard')) return 'map';
  return 'menu';
}
function bgmTarget(){
  if (BGM.preview) return BGM.preview;
  if (!bgmOn()) return null;
  const s = bgmScene();
  if (s === 'duel' && !bgmSrc('duel')) return bgmSrc('map') ? 'map' : null;
  return bgmSrc(s) ? s : null;
}
async function bgmSwitch(src){
  const a = audCtx(); if (!a) return;
  const tok = ++BGM.tok;
  BGM.src = src;
  if (BGM.node){
    const g = BGM.gain, nd = BGM.node, t = a.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 0.7);
    try { nd.stop(t + 0.75); } catch(e){}
    BGM.node = BGM.gain = null;
  }
  if (BGM.el){ const el = BGM.el; BGM.el = null; bgmFadeEl(el, 0, 600, true); }
  if (!src) return;
  const d = await audBuf(src);
  if (tok !== BGM.tok) return;                // lagu ditukar lagi semasa dinyahkod
  if (!d){
    /* Pelayan lagu tidak membenarkan app membaca baitnya (CORS) atau tiada
       internet: mainkan melalui pemain audio biasa. Masih bergelung, cuma
       mungkin ada sela kecil di hujung setiap pusingan. */
    if (/^https?:/.test(src)){
      const el = new Audio(); el.src = src; el.loop = true; el.volume = 0;
      el.play().then(() => { if (tok === BGM.tok) bgmFadeEl(el, bgmVol(), 800); else el.pause(); }).catch(() => {});
      BGM.el = el;
    }
    return;
  }
  /* Lagu lalai berjaya dimuat turun — simpan kekal untuk kali seterusnya. */
  Object.keys(BGM_DEF).forEach(k => { if (src === bgmDefUrl(k)) bgmCacheDef(k, AUD_RAW[audKey(src)]); });
  const nd = a.createBufferSource(), g = a.createGain();
  nd.buffer = d.buf; nd.loop = true; nd.loopStart = d.ls; nd.loopEnd = d.le;
  g.gain.value = 0; nd.connect(g); g.connect(a.destination);
  const t = a.currentTime;
  nd.start(t, d.ls);
  g.gain.linearRampToValueAtTime(bgmVol(), t + 0.8);
  BGM.node = nd; BGM.gain = g;
}
function bgmFadeEl(el, to, ms, stopAfter){
  const from = el.volume, t0 = performance.now();
  const step = () => {
    const p = Math.min(1, (performance.now() - t0) / ms);
    try { el.volume = Math.max(0, Math.min(1, from + (to - from) * p)); } catch(e){}
    if (p < 1) requestAnimationFrame(step); else if (stopAfter){ el.pause(); el.removeAttribute('src'); }
  };
  requestAnimationFrame(step);
}
function bgmApplyVol(){
  if (BGM.el) try { BGM.el.volume = bgmVol(); } catch(e){}
  const a = SFX_CTX; if (!a || !BGM.gain) return;
  const t = a.currentTime;
  BGM.gain.gain.cancelScheduledValues(t);
  BGM.gain.gain.setTargetAtTime(bgmVol(), t, 0.05);
}
/* Identiti lagu, bukan sumbernya. Lagu lalai yang baru disimpan dalam
   peranti bertukar sumber (URL Suno \u2192 salinan tempatan) tetapi ia masih
   lagu yang SAMA; kalau dibanding ikut sumber, lagu itu akan bermula semula
   dari awal sejurus selepas disimpan. */
const bgmId = k => { if (!k) return null; const o = bgmOwn(k); return o ? 'own:' + k + ':' + audKey(o) : 'def:' + k; };
function bgmTick(){
  if (!BGM.unlocked) return;
  /* pratonton hanya hidup selagi bahagian Muzik dalam Tetapan terbuka */
  if (BGM.preview && !document.querySelector('[data-bgm-sec]')) BGM.preview = null;
  const k = bgmTarget();
  const id = bgmId(k);
  if (id !== BGM.id){ BGM.id = id; bgmSwitch(k ? bgmSrc(k) : null); }
}
function bgmInit(){
  /* Pelayar hanya membenarkan bunyi selepas sentuhan pertama pengguna. */
  const unlock = () => {
    const a = audCtx(); if (!a) return;
    if (a.state === 'suspended' && !document.hidden) a.resume();
    if (!BGM.unlocked){ BGM.unlocked = true; bgmTick(); }
  };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
  /* Telefon dikunci atau app ditukar: muzik berhenti, sambung bila kembali. */
  document.addEventListener('visibilitychange', () => {
    const a = SFX_CTX;
    if (BGM.el){ if (document.hidden) BGM.el.pause(); else if (BGM.unlocked) BGM.el.play().catch(() => {}); }
    if (!a) return;
    if (document.hidden) a.suspend(); else if (BGM.unlocked) a.resume();
  });
  document.addEventListener('input', e => {
    if (!e.target || e.target.id !== 'bgmVol') return;
    S.config.bgmVol = +e.target.value;
    const t = $('#bgmVolT'); if (t) t.textContent = e.target.value + '%';
    bgmApplyVol();
  });
  document.addEventListener('change', e => { if (e.target && e.target.id === 'bgmVol') save(true); });
  setInterval(bgmTick, 400);
}

/* Bunyi serangan guru sendiri: bermula tepat pada frame pertama serangan dan
   dipudarkan lembut di hujung tempoh serangan. */
async function playAtkSfx(c, maxMs){
  if (!SFX_ON) return false;
  const src = atkSfxSrc(c); if (!src) return false;
  const a = audCtx(); if (!a) return false;
  const d = await audBuf(src); if (!d) return false;
  const nd = a.createBufferSource(), g = a.createGain();
  nd.buffer = d.buf; g.gain.value = 0.9; nd.connect(g); g.connect(a.destination);
  const t = a.currentTime;
  nd.start(t);
  if (maxMs && d.buf.duration * 1000 > maxMs){
    const end = t + maxMs / 1000;
    g.gain.setValueAtTime(0.9, Math.max(t, end - 0.25));
    g.gain.linearRampToValueAtTime(0, end);
    try { nd.stop(end + 0.05); } catch(e){}
  }
  return true;
}

function pickAudio(){
  return new Promise(res => {
    const inp = $('#filePickAudio'); inp.value = '';
    inp.onchange = () => res((inp.files || [])[0] || null);
    inp.click();                       // mesti dalam gerak isyarat pengguna
  });

async function audioFromFile(file, maxMB){
  if (file.size > maxMB * 1048576)
    throw new Error('Fail terlalu besar (' + (file.size / 1048576).toFixed(1) + ' MB). Had ' + maxMB + ' MB — guna lagu gelung yang pendek.');
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const d = await audBuf(data);
  if (!d) throw new Error('Format audio ini tidak dapat dibaca. Cuba MP3, OGG atau WAV.');
  return { data, dur: d.buf.duration };
}
const audExt = f => ((f.name.split('.').pop() || 'mp3').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp3');

  const pick = pickAudio();
  const file = await pick; if (!file) return;
  const sl = BGM_SLOTS.find(s => s.k === k);

  let r; try { r = await audioFromFile(file, 8); } catch(e){ return toast(e.message, null, true); }
  try {
    const u = await assetSave('bgm:' + k, r.data, 'audio/bgm_' + k + '_' + stamp() + '.' + audExt(file));
    if (u){ PHOTOS[CK(u)] = r.data; await idbPut(CK(u), r.data); }

    S.bgm = S.bgm || {};

    if (old && old !== u) fbDeleteUrl(old);

  for (let i = 0; i < (n||60); i++){

      'width:'+(5+Math.random()*6)+'px;height:'+(8+Math.random()*10)+'px;';

function packOpen(sid, pack, free){
  const s = stu(sid); if (!s) return;
  if (!(S.cards||[]).length) return toast('Belum ada kad. Muat naik di Tetapan → Kad Koleksi.', null, true);
  const pulls = openPackRoll(pack, sid);
  if (!pulls.length) return toast('Tiada kad untuk dibuka.', null, true);
  const best = pulls.reduce((a,p) => tierRank(p.tier) > tierRank(a) ? p.tier : a, pulls[0].tier);
  const bt = tierOfCard(best);
  let opened = 0, busy = false;

  const id = openModal({ center:true, bare:true,
    body:'<div id="pkWrap" class="pkwrap">' +
      '<div class="pkhead"><div class="flex items-center gap-2">' +
        avatarHtml(s, 30) + '<div class="flex-1 min-w-0"><div class="text-[13px] font-bold truncate">'+esc(s.name)+'</div>' +
        '<div class="text-[10px] text-muted">'+esc(pack.name)+(free?' · PERCUMA':' · '+pack.cost+' TPC')+'</div></div>' +
        '<button class="btn clip-s !px-2 !py-1 text-[11px]" data-pk="sfx"><i class="fa-solid fa-volume-high text-cyan"></i></button>' +
        '<button class="btn clip-s !px-2 !py-1 text-[11px]" data-close="1"><i class="fa-solid fa-xmark"></i></button></div></div>' +
      '<div id="pkStage" class="pkstage">' +
        '<div id="pkBox" class="pkbox" style="--pc:'+bt.color+'">' +
          (packCover(pack.k) ? '<img src="'+esc(packCover(pack.k))+'" alt="" onerror="this.remove()">' :
            '<div class="pkbox-def"><div class="num">'+esc(pack.name.toUpperCase())+'</div><div class="pkbox-x">?</div></div>') +
          '<div class="pktape"><div id="pkTapeFill" class="pktape-fill"></div></div>' +
          '<div class="pkhint">TEKAN &amp; TAHAN UNTUK KOYAK</div>' +
        '</div>' +
        '<div id="pkFlash" class="pkflash"></div>' +
      '</div>' +
      '<div id="pkReveal" style="display:none">' +
        '<div id="pkOne" class="pkone"></div>' +
        '<div class="pkcount" id="pkCount"></div>' +
        '<div class="pkdots" id="pkDots"></div>' +
        '<div class="pkbar">' +
          '<button class="btn clip-s flex-1 text-[12px]" data-pk="all">Buka Semua</button>' +
          '<button class="btn btn-o clip-s flex-1 text-[12px]" data-pk="next" id="pkNext">Seterusnya</button>' +
        '</div></div>' +
      '<div id="pkMyth" class="pkmyth"></div>' +
    '</div>' });
  const bd = $('[data-modal="'+id+'"]');
  const box = $('#pkBox', bd), fill = $('#pkTapeFill', bd);

  /* --- peringkat 1: koyak --- */
  let hold = null, prog = 0, torn = false;
  const startHold = () => {
    if (torn) return;
    sfx('tear');
    const t0 = performance.now();
    hold = setInterval(() => {
      prog = Math.min(1, (performance.now() - t0) / 900);
      fill.style.width = (prog * 100) + '%';
      box.style.transform = 'rotate(' + (Math.sin(prog * 40) * 1.6) + 'deg) scale(' + (1 + prog * 0.06) + ')';
      if (prog >= 1) tearOpen();
    }, 30);
  };
  const stopHold = () => { if (torn) return; clearInterval(hold); prog = 0; fill.style.width = '0%'; box.style.transform = ''; };
  box.addEventListener('pointerdown', startHold);
  ['pointerup','pointercancel','pointerleave'].forEach(ev => box.addEventListener(ev, stopHold));

  function tearOpen(){
    torn = true; clearInterval(hold);
    vibrate(60); sfx('burst');
    const flash = $('#pkFlash', bd);
    flash.style.background = 'radial-gradient(circle, ' + bt.color + 'EE, ' + bt.color + '55 35%, transparent 70%)';
    flash.classList.add('go');
    box.classList.add('tearing');
    setTimeout(() => {
      $('#pkStage', bd).style.display = 'none';
      $('#pkReveal', bd).style.display = 'block';
      renderDots(); showCard();
    }, 850);
  }

  /* --- peringkat 2: buka satu demi satu --- */
  let idx = 0, flipped = false, auto = false;
  function renderDots(){
    $('#pkDots', bd).innerHTML = pulls.map((p,i) =>
      '<div class="pkdot" id="dot-'+i+'" style="background:'+(i < idx ? tierOfCard(p.tier).color : '#24333F')+'"></div>').join('');
  }
  function showCard(){
    const p = pulls[idx], t = tierOfCard(p.tier);
    const hint = t.fx === 'myth' ? ' pulse-myth' : (t.fx === 'hi' ? ' pulse-hi' : '');
    const wrap = $('#pkOne', bd);
    wrap.innerHTML = '<div class="pkone-card" data-flip>' +
      '<div class="pkcard">' +
        '<div class="pkback'+hint+'"><span>?</span><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i></div>' +
        '<div class="pkfront">' + cardFaceHtml(p.card, p.tier) + '</div>' +
      '</div></div>';
    wrap.classList.remove('slide-out');
    wrap.classList.add('slide-in');
    setTimeout(()=>wrap.classList.remove('slide-in'), 340);
    $('#pkCount', bd).textContent = 'KAD ' + (idx+1) + ' / ' + pulls.length;
    const nx = $('#pkNext', bd);
    nx.style.visibility = 'hidden';
    nx.textContent = (idx === pulls.length - 1) ? 'Selesai' : 'Seterusnya';
    flipped = false;
  }
  function doFlip(){
    if (flipped) return;
    flipped = true;
    const p = pulls[idx], t = tierOfCard(p.tier);
    const card = $('.pkone-card', bd);
    card.classList.add('open');
    sfx('flip');
    const dot = $('#dot-'+idx, bd); if (dot) dot.style.background = t.color;
    setTimeout(() => {
      if (t.fx === 'low') sfx('low');
      else if (t.fx === 'hi'){
        card.classList.add('fx-hi');
        $('#pkWrap', bd).classList.add('dim');
        vibrate(35); sfx('hi');
        setTimeout(()=> $('#pkWrap', bd).classList.remove('dim'), 1500);
      } else mythTakeover(p);
      $('#pkNext', bd).style.visibility = 'visible';
    }, 280);
  }
  function nextCard(){
    if (!flipped){ doFlip(); return; }
    if (idx >= pulls.length - 1){ finishPack(); return; }
    const wrap = $('#pkOne', bd);
    wrap.classList.add('slide-out');
    setTimeout(() => { idx++; renderDots(); showCard(); }, 270);
  }
  function finishPack(){
    auto = false;
    closeModal(id);
    packSummary(sid, pulls, pack, free);
  }
  function autoPlay(){
    if (auto) return;
    auto = true;
    const step = () => {
      if (!auto) return;
      const t = tierOfCard(pulls[idx].tier);
      if (!flipped){ doFlip(); setTimeout(step, t.fx === 'low' ? 900 : t.fx === 'hi' ? 2200 : 4200); return; }
      if (idx >= pulls.length - 1){ auto = false; return; }
      nextCard();
      setTimeout(step, 420);
    };
    step();
  }
  bd.addEventListener('click', e => {
    if (e.target.closest('[data-flip]')){ doFlip(); return; }
    const b = e.target.closest('[data-pk]'); if (!b) return;
    const a = b.dataset.pk;
    if (a === 'sfx'){ SFX_ON = !SFX_ON; b.innerHTML = '<i class="fa-solid fa-volume-'+(SFX_ON?'high text-cyan':'xmark text-muted')+'"></i>'; return; }
    if (a === 'mythclose'){ $('#pkMyth', bd).classList.remove('go'); $('#pkMyth', bd).innerHTML = ''; return; }
    if (a === 'all'){ autoPlay(); return; }
    if (a === 'next'){ auto = false; nextCard(); }
  });
}
function packSummary(sid, pulls, pack, free){
  const res = grantCards(sid, pulls);
  if (!free) tpcSpend(pack.cost);
  S.packLog = S.packLog || [];
  const bestT = pulls.reduce((a,p) => tierRank(p.tier) > tierRank(a) ? p.tier : a, pulls[0].tier);
  S.packLog.unshift({ ts:Date.now(), sid, pack:pack.k, best:bestT, free: !!free });
  S.packLog = S.packLog.slice(0, 40);
  if (free){ S.freePack = S.freePack || {}; S.freePack[sid] = todayKey(); }
  save(true);
  const s = stu(sid);
  const rows = res.slice().sort((a,b) => tierRank(b.tier) - tierRank(a.tier)).map(r => {

      '<div class="num text-[9px]" style="color:'+t.color+'">'+t.name.toUpperCase()+' '+'★'.repeat(tierStars(t.k))+'</div></div>' +
      (r.isNew ? '<span class="tag !text-[9px]" style="border-color:#4ADE80;color:#4ADE80">BAHARU</span>'
               : '<span class="num text-[10px] text-muted">×'+ownedCount(sid, r.card.id)+'</span>') + '</div>';
  }).join('');
  const st = collectionStats(sid);
  openModal({ icon:'fa-box-open', title:'Hasil Pack — '+s.name,
    body:'<div class="text-[12px] text-muted mb-2">'+esc(pack.name)+(free?' (percuma)':' · −'+pack.cost+' TPC')+' · koleksi '+st.have+'/'+st.total+'</div>' + rows,

  renderTab();

function fitCover(file, W, H){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = async () => {
      try {
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const x = c.getContext('2d');
        const f = Math.max(W / im.width, H / im.height);
        const w = im.width * f, hh = im.height * f;
        x.imageSmoothingQuality = 'high';
        x.drawImage(im, (W - w) / 2, (H - hh) / 2, w, hh);
        const out = await encodeTarget(c, { alpha:false, minB: 15*1024, maxB: 55*1024 });
        URL.revokeObjectURL(url); res(out);
      } catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Imej tidak boleh dibuka')); };
    im.src = url;
  });
}

/* ============ PAKEJ ASET (untuk diedarkan) ============
   Mengandungi SEMUA grafik: lencana, bingkai rank, sprite Arena, latar, kad & cover.
   TIDAK mengandungi data sekolah: pelajar, gambar pelajar, kelas, rekod, bab atau koleksi. */
const ASSET_VER = 1;
/* Nama subjek ialah jambatan antara dua peranti: id subjek berbeza, nama
   subjek biasanya sama ("Sains", "Aqidah KAFA"). */
const sjNameOf = id => (S.subjects.find(x => x.id === id) || {}).name || '';
const packContent = () => {
  const quiz = (S.quiz || []).map(q => ({
    sjName: sjNameOf(q.subjectId), bab:q.chapterId || '',
    q:q.q, c:(q.c || []).slice(), a:q.a, ejek:(q.ejek || []).slice(), huraian:q.huraian || ''
  })).filter(q => q.q && q.sjName);

    delete o.sj;                      // dipulihkan semasa import ikut nama
    return o;
  }).filter(p => p.sjName);
  return { quiz, stories:st };
};
const contentCount = () => { const c = packContent();
  return { q:c.quiz.length, s:c.stories.length,
           b:c.stories.reduce((n, p) => n + ((p.babak || []).length), 0) }; };

function buildAssetPack(onProg){
  const P = { v:ASSET_VER, app:APP_NAME, ts:Date.now(), img:{},
              badges:[], frames:{}, sprites:{}, cards:[], packCovers:{}, arenaBg:'', tmaps:[], umaps:[], tiles:[], grounds:[], ranks:[], config:{} };
  const put = (key, data) => { if (data) P.img[key] = data; };
  // lencana
  (S.badges||[]).forEach(b => {
    P.badges.push({ id:b.id, name:b.name, color:b.color, luck:b.luck || '', system: isSysBadge(b.id) });
    put('badge:'+b.id, badgeSrc(b));
  });
  // bingkai rank + julat skor
  P.ranks = (S.ranks||[]).map(r => ({ id:r.id, tier:r.tier, name:r.name, color:r.color, min:r.min }));
  (S.ranks||[]).forEach(r => { const s = rankSrc(r.id); if (s){ P.frames[r.id] = 1; put('frame:'+r.id, s); } });
  // sprite
  Object.keys(S.sprites||{}).forEach(k => {
    const [c, a] = k.split('|');
    const f = spriteFrames(c, a);
    if (!f) return;
    /* w/h = saiz kanvas (nisbah pentas), rel = frame pelepasan,
       anchor = kedudukan & saiz peluru. Tanpa ini semuanya hilang selepas import. */
    const sr = S.sprites[k];
    P.sprites[k] = { n:f.length, off:(sr.off || []) };
    ['w', 'h', 'rel', 'anchor'].forEach(x => { if (sr[x] !== undefined && sr[x] !== null) P.sprites[k][x] = sr[x]; });
    f.forEach((u, i) => put('sprite:'+k+':'+i, u));
  });
  P.faces = {};
  Object.keys(S.faces||{}).forEach(k => {
    const [c, a] = k.split('|');
    const f = faceFrames(c, a);
    if (!f) return;
    P.faces[k] = { n:f.length };
    f.forEach((u, i) => put('face:'+k+':'+i, u));
  });
  put('arena:bg', arenaBg());
  if (arenaBg()) P.arenaBg = 1;
  // muzik latar & bunyi serangan
  /* Hanya lagu yang guru muat naik sendiri. Lagu lalai sudah terbina dalam app,
     dan bgmSrc() memulangkan URL lagu lalai walaupun S.bgm masih kosong. */
  P.bgm = []; BGM_SLOTS.forEach(sl => { const u = bgmOwn(sl.k); if (!u) return;
    const r = (S.bgm || {})[sl.k] || {}; put('bgm:' + sl.k, u); P.bgm.push({ k:sl.k, name:r.name || '', dur:r.dur || 0 }); });
  P.atkSfx = []; Object.keys(S.atkSfx || {}).forEach(c => { const u = atkSfxSrc(c); if (!u) return;
    const r = S.atkSfx[c] || {}; put('asfx:' + c, u); P.atkSfx.push({ c, name:r.name || '', dur:r.dur || 0 }); });
  // latar peta taktikal
  P.umaps = umaps().map(m => ({ id:m.id, name:m.name, desc:m.desc, w:m.w, h:m.h, max:m.max,
                                cells:(m.cells||[]).slice(), sp:mapSpawn(m), mine:1 }));
  P.tnpcs = (S.tnpcs || []).map(n => ({ id:n.id, name:n.name || '', look:n.look || '', lines:n.lines || '' }));
  if (S.nallyLines) P.nallyLines = S.nallyLines;
  P.grounds = []; GROUNDS.forEach(g => { const u = groundUrl(g.k); if (u){ put('ground:' + g.k, u); P.grounds.push(g.k); } });
  { const u = hpbUrl(); if (u){ put('hpbar', u); P.hpbar = 1; } }
  { const u = dlgfUrl(); if (u){ put('dlgf', u); P.dlgf = 1; } }
  P.splash = []; splashes().forEach(s => { const u = splashUrl(s); if (u){ put('splash:' + s.id, u); P.splash.push(s.id); } });
  P.tmapP = {};
  allMaps().forEach(m => {
    if (tmapLegacy(m.id)){ put('tmap:' + m.id, tmapPartUrl(m.id, 0)); P.tmaps.push(m.id); return; }
    tmapLayers(m).forEach(l => { put('tmap:' + m.id + ':' + l.k, l.url); (P.tmapP[m.id] = P.tmapP[m.id] || []).push(l.k); });
  });
  // kad & cover
  (S.cards||[]).forEach(c => {
    P.cards.push({ id:c.id, tier:c.tier, name:c.name||'', flavor:c.flavor||'' });
    put('card:'+c.id, cardSrc(c));
  });
  PACKS.forEach(p => { const cov = packCover(p.k); if (cov){ P.packCovers[p.k] = 1; put('pack:'+p.k, cov); } });
  P.config = { baseline:S.config.baseline, attendBonus:S.config.attendBonus, streakDays:S.config.streakDays,
               tpcRate:S.config.tpcRate, maxUploadKB:S.config.maxUploadKB, spriteFps:S.config.spriteFps };
  /* Isi permainan: soalan dan kempen. Rekod pelajar tetap tidak disertakan. */
  if ((S.ui || {}).apContent !== 0) P.content = packContent();
  onProg && onProg(Object.keys(P.img).length);
  return P;
}
const packSizeKB = P => Math.round(JSON.stringify(P).length * 0.75 / 1024);
async function importAssetPack(P, quiet){
  if (!P || !P.img) throw new Error('Pakej tidak sah');
  // gambar → cache tempatan, satu transaksi untuk semuanya
  const keys = Object.keys(P.img);
  keys.forEach(k => { PHOTOS[k] = P.img[k]; });
  for (let i = 0; i < keys.length; i += 400){           // kelompok supaya transaksi tidak terlalu besar
    const part = {};
    keys.slice(i, i + 400).forEach(k => part[k] = P.img[k]);
    await idbPutAll(part);
  }
  // lencana (kekalkan lencana sistem sedia ada)
  const keep = (S.badges||[]).filter(b => isSysBadge(b.id));
  S.badges = (P.badges||[]).map(b => ({ id:b.id, name:b.name, color:b.color, luck:b.luck||'', url:'' }));
  keep.forEach(k => { if (!S.badges.some(b => b.id === k.id)) S.badges.push(k); });
  SYS_BADGES.forEach(sb => { if (!S.badges.some(b => b.id === sb.id)) S.badges.push(Object.assign({}, sb)); });
  // rank & bingkai
  if ((P.ranks||[]).length === 24) S.ranks = P.ranks.map(r => Object.assign({}, r));
  S.frames = {};
  Object.keys(P.frames||{}).forEach(id => S.frames[id] = { url:'' });
  // sprite
  S.sprites = {};
  Object.keys(P.sprites||{}).forEach(k => {
    S.sprites[k] = { n:P.sprites[k].n, urls:[], off:P.sprites[k].off || [], pk:'sprite:'+k };
    ['w', 'h', 'rel', 'anchor'].forEach(x => { if (P.sprites[k][x] !== undefined) S.sprites[k][x] = P.sprites[k][x]; });
  });
  S.faces = {};
  Object.keys(P.faces||{}).forEach(k => { S.faces[k] = { n:P.faces[k].n, urls:[], pk:'face:'+k }; });
  if (P.arenaBg) S.arenaBg = { url:'' };
  S.bgm = {};
  (P.bgm || []).forEach(b => { if (b && BGM_SLOTS.some(s => s.k === b.k)) S.bgm[b.k] = { url:'', name:b.name || '', dur:b.dur || 0 }; });
  S.atkSfx = {};
  (P.atkSfx || []).forEach(b => { if (b && b.c) S.atkSfx[b.c] = { url:'', name:b.name || '', dur:b.dur || 0 }; });
  if ((P.umaps || []).length){
    S.umaps = umaps().slice();
    P.umaps.forEach(m => {
      if (!m || !m.id) return;
      const rec = { id:m.id, name:m.name || 'Peta', desc:m.desc || '', w:m.w, h:m.h,
                    max:m.max || umapMax(m.w), cells:(m.cells || []).slice(),
                    sp:mapSpawn(Object.assign({}, m, { sp:m.sp })), mine:1 };
      const i = S.umaps.findIndex(x => x.id === rec.id);
      if (i >= 0) S.umaps[i] = rec; else S.umaps.push(rec);
    });
  }
  S.tmaps = {};
  (P.tmaps || []).forEach(id => { if (tmapOf(id)) S.tmaps[id] = { url:'' }; });
  Object.keys(P.tmapP || {}).forEach(id => { if (!tmapOf(id)) return;
    const parts = []; (P.tmapP[id] || []).forEach(k => { parts[k] = ''; }); S.tmaps[id] = { parts }; });
  delete S.tiles;
  if (Array.isArray(P.tnpcs)){
    S.tnpcs = (S.tnpcs || []).slice();
    P.tnpcs.forEach(n => { if (!n || !n.id) return; const i = S.tnpcs.findIndex(x => x.id === n.id);
      const rec = { id:n.id, name:n.name || 'NPC', look:n.look || '', lines:n.lines || '' };
      if (i >= 0) S.tnpcs[i] = rec; else S.tnpcs.push(rec); });
  }
  if (P.nallyLines) S.nallyLines = P.nallyLines;
  S.grounds = {};
  (P.grounds || []).forEach(k => { if (GROUNDS.some(g => g.k === k)) S.grounds[k] = { url:'' }; });
  S.hpbar = P.hpbar ? { url:'' } : null;
  S.splash = (P.splash || []).map(sid => ({ id:sid, url:'' }));
  // kad & cover
  S.cards = (P.cards||[]).map(c => ({ id:c.id, tier:c.tier, name:c.name||'', flavor:c.flavor||'', url:'' }));
  S.packCovers = {};
  Object.keys(P.packCovers||{}).forEach(k => S.packCovers[k] = '');
  Object.assign(S.config, P.config || {});
  const got = importContent(P.content);
  save(true);
  SPR_READY = false;
  renderAll();
  if (!quiet) toast('Pakej dipasang: ' + (P.cards||[]).length + ' kad · ' + (P.badges||[]).length + ' lencana · ' +
    Object.keys(P.sprites||{}).length + ' set sprite' +
    (got.q || got.s ? ' · ' + got.q + ' soalan · ' + got.s + ' kempen' : ''));
}
/* Soalan dan kempen DICANTUM, tidak mengganti: guru yang sudah ada bahan
   sendiri tidak kehilangan apa-apa. Padanan subjek ikut nama; kalau nama
   itu tiada pada peranti ini, subjek baharu dicipta di bawah kelas pertama
   supaya bahan itu tidak tergantung tanpa rumah. */
function importContent(C){
  const out = { q:0, s:0, sj:[] };
  if (!C) return out;
  const norm = s => String(s || '').trim().toLowerCase();
  const cache = {};
  const subjFor = nm => {
    const key = norm(nm);
    if (!key) return '';
    if (cache[key] !== undefined) return cache[key];
    let s = S.subjects.find(x => norm(x.name) === key);
    if (!s){
      const cls = S.ui.activeClassId || ((S.classes[0] || {}).id || '');
      if (!cls) return (cache[key] = '');
      s = { id:uid('sub'), classId:cls, name:String(nm).slice(0, 40) };
      S.subjects.push(s);
      out.sj.push(s.name);
    }
    return (cache[key] = s.id);
  };
  /* soalan: langkau yang sudah ada teks sama dalam subjek sama */
  const seen = {};
  (S.quiz || []).forEach(q => { seen[q.subjectId + '|' + norm(q.q)] = 1; });
  (C.quiz || []).forEach(r => {
    const sj = subjFor(r.sjName); if (!sj) return;
    const k = sj + '|' + norm(r.q);
    if (seen[k]) return;
    seen[k] = 1;
    S.quiz = (S.quiz || []).concat([{ id:uid('q'), subjectId:sj, chapterId:r.bab || '',
      q:r.q, c:(r.c || []).slice(), a:+r.a || 0, ejek:(r.ejek || []).slice(), huraian:r.huraian || '' }]);
    out.q++;
  });
  /* kempen: langkau yang sudah ada tajuk sama dalam subjek sama */
  const have = {};
  stories().forEach(p => { have[p.sj + '|' + norm(p.title)] = 1; });
  (C.stories || []).forEach(r => {
    const sj = subjFor(r.sjName); if (!sj) return;
    if (have[sj + '|' + norm(r.title)]) return;
    have[sj + '|' + norm(r.title)] = 1;
    const p = JSON.parse(JSON.stringify(r));
    p.id = uid('st'); p.sj = sj; p.ts = Date.now();
    S.stories = stories().concat([p]);
    out.s++;
  });
  return out;
}

/* Aset yang URLnya masih menunjuk ke Firebase, belum ada salinan tempatan.

const cloudLeft = () => {

/* Turunkan semuanya sekarang, sekali sahaja, dengan bar kemajuan. Selepas
   ini app tidak perlu menyentuh Firebase untuk grafik lagi, dan pakej yang
   dieksport pun lengkap. */
async function assetWarmAll(){
  const want = cloudLeft();
  if (!want.length) return toast('Semua aset sudah ada di peranti ini.');
  const mid = openModal({ center:true, bare:true,
    body:'<div class="p-5 text-center">' +
      '<div class="font-bold tracking-[.18em] text-[15px] glow-o">MENURUNKAN ASET</div>' +
      '<div class="text-[11px] text-muted mt-1">Selepas ini app tidak perlu rangkaian untuk grafik lagi.</div>' +
      '<div style="height:8px;background:#0E151E;border:1px solid var(--line);margin-top:12px">' +
        '<div id="awBar" style="height:100%;width:0%;background:linear-gradient(90deg,#FF6B00,#00F0FF);transition:width .2s"></div></div>' +
      '<div class="num text-[11px] text-muted mt-2" id="awTxt">0 / ' + want.length + '</div>' +
      '<div class="num text-[10px] mt-2" id="awErr" style="color:#E23B3B"></div></div>' });
  const bd = $('[data-modal="' + mid + '"]');
  let done = 0, fail = 0;
  const bump = () => {
    done++;
    const b = $('#awBar', bd), t = $('#awTxt', bd), e = $('#awErr', bd);
    if (b) b.style.width = (done / want.length * 100) + '%';
    if (t) t.textContent = done + ' / ' + want.length;
    if (e && fail) e.textContent = fail + ' gagal diturunkan';
  };
  const job = async u => {
    await cacheRemote(u);
    if (!isLocalData(u)) fail++;
    SPR_DONE[u] = 1;
    bump();
  };
  const q = want.slice(), w = [];
  for (let i = 0; i < 12; i++) w.push((async () => { while (q.length) await job(q.shift()); })());
  await Promise.all(w);
  closeModal(mid); closeTop(); assetPackModal();
  toast(fail
    ? (want.length - fail) + ' aset disimpan \u00b7 ' + fail + ' gagal \u2014 cuba lagi bila rangkaian baik'
    : want.length + ' aset kini tersimpan di peranti \u00b7 pakej sudah lengkap');
}

/* Soalan: bank guru dahulu (ikut urutan, sama seperti mod lain), jika tiada → matematik */
function escMathQ(){
  const r = n => Math.floor(Math.random() * n);
  const op = r(4); let a, b, ans, sym;
  if (op === 0){ a = 10 + r(90); b = 10 + r(90); ans = a + b; sym = '+'; }
  else if (op === 1){ a = 20 + r(80); b = 1 + r(a); ans = a - b; sym = '−'; }
  else if (op === 2){ a = 2 + r(11); b = 2 + r(11); ans = a * b; sym = '×'; }
  else { b = 2 + r(11); ans = 1 + r(12); a = b * ans; sym = '÷'; }
  const opts = new Set([ans]);
  while (opts.size < 4){ const d = (1 + r(10)) * (Math.random() < .5 ? -1 : 1); if (ans + d >= 0) opts.add(ans + d); }
  return { q: a + ' ' + sym + ' ' + b + ' = ?', c: Array.from(opts).map(String), a: 0 };
}
function escQuestion(){
  const bank = qBank(S.ui.activeSubjectId);
  if (!bank.length) return escMathQ();
  const q = nextQ(bank);
  const keep = [0,1,2,3].filter(i => q.c[i] !== undefined && q.c[i] !== '');
  return { q: q.q, c: keep.map(i => q.c[i]), a: keep.indexOf(q.a) };
}

  const A = (() => {

    if (e.type === 'keydown' && (k === 'e' || k === 'enter') && !paused && near) interact();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k) >= 0) e.preventDefault();
  };
  root.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', onKey);
  $e('#escQuit').onclick = () => quit();
  $e('#escAct').onclick = () => { if (!paused && near) interact(); };

  /* ---------- fizik ringkas ---------- */
  const collide = (p, r) => {
    for (const s of solids){
      const cx = clamp(p.x, s.x1, s.x2), cz = clamp(p.z, s.z1, s.z2);
      const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
      if (d2 >= r * r) continue;
      if (d2 > 1e-8){ const d = Math.sqrt(d2), k = (r - d) / d; p.x += dx * k; p.z += dz * k; }
      else {
        const l = p.x - s.x1, rr = s.x2 - p.x, t = p.z - s.z1, b = s.z2 - p.z, m = Math.min(l, rr, t, b);
        if (m === l) p.x = s.x1 - r; else if (m === rr) p.x = s.x2 + r; else if (m === t) p.z = s.z1 - r; else p.z = s.z2 + r;
      }
    }
  };

  /* ---------- interaksi ---------- */
  function interact(){
    if (near === exitPt){
      if (keys < ESC_KEYS){ sfx('buzz'); return msg('Pintu berkunci. Perlu <span style="color:#FFD76A">'+ESC_KEYS+' kunci</span> ('+keys+'/'+ESC_KEYS+').'); }
      return win();
    }
    if (near && !near.solved) askBoard(near);
  }
  function askBoard(bd){
    paused = true; joy.id = look.id = null; $e('#escJoy').style.display = 'none';
    const q = escQuestion();
    const order = q.c.map((_, i) => i).sort(() => Math.random() - .5);
    const box = $e('#escQ');
    box.innerHTML =
      '<div class="panel clip p-4 w-full" style="max-width:440px;border-color:#2F6B4A;box-shadow:0 0 40px rgba(60,255,150,.15)">' +
        '<div class="lbl" style="color:#7CFFB2"><i class="fa-solid fa-chalkboard"></i> '+bd.label+' — JAWAB UNTUK KUNCI</div>' +
        '<div style="height:6px;background:#0E151E;margin-top:8px"><div id="escQBar" style="height:100%;width:100%;background:#4ADE80"></div></div>' +
        '<div class="text-[17px] font-bold leading-snug mt-3">'+esc(q.q)+'</div>' +
        '<div class="mt-3">' + order.map((i, k) =>
          '<button class="btn clip-s w-full mb-2 !py-3 text-left text-[15px]" data-ans="'+i+'"><span class="num text-orange mr-2">'+String.fromCharCode(65 + k)+'.</span>'+esc(q.c[i])+'</button>').join('') +
        '</div></div>';
    box.style.display = 'flex';
    const t0 = performance.now(); let done = false, raf = 0;
    const tick = () => {
      const left = Math.max(0, ESC_QTIME - (performance.now() - t0) / 1000), bar = $e('#escQBar');
      if (bar){ bar.style.width = (left / ESC_QTIME * 100) + '%'; bar.style.background = left > 10 ? '#4ADE80' : left > 5 ? '#FACC15' : '#E23B3B'; }
      if (left <= 0) return finish(-1);
      raf = requestAnimationFrame(tick);
    };
    const finish = pick => {
      if (done) return; done = true; cancelAnimationFrame(raf);
      const ok = pick === q.a;
      answered++; if (ok) correct++;
      quizRecord(sid, ok);
      box.style.display = 'none'; box.innerHTML = ''; paused = false;
      if (ok){
        bd.solved = true; keys++; drawBoard(bd); bd.glow.color.set(0x4ADE80); bd.glow.intensity = 1.5;
        sfx('chime'); hud();
        if (keys >= ESC_KEYS){ drawSign(true); exitLight.color.set(0x30ff60); msg('Semua kunci ditemui! Lari ke pintu <span style="color:#4ADE80">KELUAR</span> di hujung koridor!', 4000); }
        else msg('<i class="fa-solid fa-key" style="color:#FFD76A"></i> Kunci '+keys+'/'+ESC_KEYS+' ditemui!');
      } else {
        sfx('buzz');
        msg('<span style="color:#FF5A5A">'+(pick === -1 ? 'Masa tamat!' : 'Salah!')+' Hantu semakin dekat…</span><br><span style="font-size:12px;color:#B8C4D0">Jawapan: '+esc(q.c[q.a])+'</span>', 3500);
        const a = Math.random() * Math.PI * 2;              // hantu muncul berhampiran
        G.x = P.x + Math.cos(a) * 7; G.z = P.z + Math.sin(a) * 7; G.hunt = true; G.grace = .6;
        flick.forEach(f => f.t = -1.2);
      }
    };
    box.onclick = e => { const b = e.target.closest('[data-ans]'); if (b) finish(+b.dataset.ans); };
    raf = requestAnimationFrame(tick);
  }

  /* ---------- tamat ---------- */
  function caught(){
    paused = true; lives--; hud(); sfx('scream'); vibrate([200, 80, 300]);
    const s = $e('#escScare');
    s.innerHTML = '<svg viewBox="0 0 200 200" style="width:min(92vw,92vh);height:auto;animation:escShake .08s infinite">' +
      '<ellipse cx="100" cy="95" rx="78" ry="92" fill="#E6ECF2"/>' +
      '<ellipse cx="68" cy="80" rx="20" ry="26" fill="#000"/><ellipse cx="132" cy="80" rx="20" ry="26" fill="#000"/>' +
      '<circle cx="68" cy="84" r="5" fill="#ff2020"/><circle cx="132" cy="84" r="5" fill="#ff2020"/>' +
      '<ellipse cx="100" cy="145" rx="26" ry="38" fill="#000"/></svg>' +
      '<style>@keyframes escShake{0%{transform:translate(4px,-3px) scale(1.04)}50%{transform:translate(-5px,4px) scale(1.08)}100%{transform:translate(3px,5px) scale(1.05)}}</style>';
    s.style.display = 'flex';
    setTimeout(() => {
      s.style.display = 'none'; s.innerHTML = '';
      if (lives <= 0) return lose();
      P.x = 1.5; P.z = 0; P.yaw = -Math.PI / 2; P.pitch = 0;
      const far = WAYS.slice().sort((a, b) => Math.hypot(b[0] - P.x, b[1] - P.z) - Math.hypot(a[0] - P.x, a[1] - P.z))[0];
      G.x = far[0]; G.z = far[1]; G.hunt = false; G.grace = 4;
      paused = false; msg('Kamu terjaga semula di pintu masuk… <span style="color:#E23B3B">'+lives+' nyawa</span> lagi.', 3000);
    }, 1500);
  }
  function endScreen(html){
    ended = true; paused = true; $e('#escAct').style.display = 'none';
    const e = $e('#escEnd'); e.innerHTML = '<div class="panel clip p-5 w-full text-center" style="max-width:400px">' + html +
      '<div class="flex gap-2 mt-4"><button class="btn clip-s flex-1 !py-3" data-end="quit">Tutup</button><button class="btn btn-o clip-s flex-1 !py-3" data-end="again"><i class="fa-solid fa-rotate"></i> Main Lagi</button></div></div>';
    e.style.display = 'flex';
    e.onclick = ev => { const b = ev.target.closest('[data-end]'); if (!b) return; const again = b.dataset.end === 'again'; quit(); if (again) setTimeout(escStart, 50); };
  }
  function win(){
    sfx('win');
    const sec = Math.round(elapsed), rp = escRP(sec), d = escData();
    const prev = d.best[sid];
    if (!prev || sec < prev) d.best[sid] = sec;
    d.wins[sid] = (d.wins[sid] || 0) + 1;
    S.arena = S.arena || { points:{}, wins:{}, losses:{}, history:[] };
    S.arena.rp = S.arena.rp || {};
    S.arena.rp[sid] = (S.arena.rp[sid] || 0) + rp;
    save(true);
    endScreen('<i class="fa-solid fa-door-open text-4xl" style="color:#4ADE80"></i>' +
      '<div class="font-bold tracking-widest text-[20px] mt-2" style="color:#4ADE80">BERJAYA KELUAR!</div>' +
      '<div class="text-[13px] text-muted mt-1">'+esc(player ? player.name : '')+' melarikan diri dari sekolah berhantu.</div>' +
      '<div class="grid grid-cols-3 gap-2 mt-4 num">' +
        '<div class="panel clip-s p-2"><div class="text-[18px] text-cyan">'+fmtSec(sec)+'</div><div class="text-[10px] text-muted">MASA'+(!prev || sec < prev ? ' · REKOD!' : '')+'</div></div>' +
        '<div class="panel clip-s p-2"><div class="text-[18px]" style="color:#FFD76A">'+correct+'/'+answered+'</div><div class="text-[10px] text-muted">BETUL</div></div>' +
        '<div class="panel clip-s p-2"><div class="text-[18px] text-orange">+'+rp+'</div><div class="text-[10px] text-muted">RP</div></div></div>');
  }
  function lose(){
    endScreen('<i class="fa-solid fa-ghost text-4xl" style="color:#E23B3B"></i>' +
      '<div class="font-bold tracking-widest text-[20px] mt-2" style="color:#E23B3B">HANTU MENANGKAP KAMU</div>' +
      '<div class="text-[13px] text-muted mt-1">Kunci ditemui: '+keys+'/'+ESC_KEYS+' · Jawapan betul: '+correct+'/'+answered+'</div>' +
      '<div class="text-[12px] text-muted mt-2">Tip: jawab dengan teliti — jawapan salah memanggil hantu.</div>');
  }
  function quit(){
    if (!alive) return;
    alive = false; ESC = null;
    window.removeEventListener('resize', resize);
    window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp);
    window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKey);
    if (A) A.stop();
    scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) [].concat(o.material).forEach(m => { if (m.map) m.map.dispose(); if (m.emissiveMap) m.emissiveMap.dispose(); m.dispose(); });
    });
    R.dispose();
    root.remove(); unlockBody();
    if (S.ui.tab === 'arena') renderTab();
  }

  /* ---------- gelung utama ---------- */
  const fwd = new THREE.Vector3();
  let last = performance.now(), beatT = 0;
  function update(dt, now){
    // gerakan pemain
    let mx = joy.x, my = joy.y;
    if (kb['w'] || kb['arrowup']) my -= 1;
    if (kb['s'] || kb['arrowdown']) my += 1;
    if (kb['a'] || kb['arrowleft']) mx -= 1;
    if (kb['d'] || kb['arrowright']) mx += 1;
    if (kb['q']) P.yaw += dt * 2; if (kb['r']) P.yaw -= dt * 2;
    const m = Math.min(1, Math.hypot(mx, my));
    if (m > .05){
      const sp = 3.3 * m / Math.max(1, Math.hypot(mx, my)) * Math.max(1, Math.hypot(mx, my));
      const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
      const vx = (-sy * -my + cy * mx), vz = (-cy * -my - sy * mx), vl = Math.hypot(vx, vz) || 1;
      P.x += vx / vl * sp * dt; P.z += vz / vl * sp * dt;
      P.bob += dt * 9 * m;
      if (now - lastStep > 430){ lastStep = now; sfx('step'); }
    }
    collide(P, .3);
    cam.position.set(P.x, 1.6 + Math.sin(P.bob) * .04, P.z);
    cam.rotation.set(P.pitch, P.yaw, 0);
    // hantu
    const dx = P.x - G.x, dz = P.z - G.z, dist = Math.hypot(dx, dz);
    if (G.grace > 0) G.grace -= dt;
    else {
      if (!G.hunt && dist < 9){ G.hunt = true; sfx('sting'); msg('<span style="color:#FF5A5A">Ia nampak kamu… LARI!</span>', 2000); }
      if (G.hunt && dist > 16) G.hunt = false;
      let tx, tz, sp;
      if (G.hunt){ tx = P.x; tz = P.z; sp = 2.15 + keys * .3; }
      else {
        if (Math.hypot(G.wx - G.x, G.wz - G.z) < .5){ const w = WAYS[Math.floor(Math.random() * WAYS.length)]; G.wx = w[0]; G.wz = w[1]; }
        tx = G.wx; tz = G.wz; sp = 1.3;
      }
      const gx = tx - G.x, gz = tz - G.z, gl = Math.hypot(gx, gz) || 1;
      G.x += gx / gl * sp * dt; G.z += gz / gl * sp * dt;
      if (dist < .75) return caught();
    }
    ghost.position.set(G.x, Math.sin(now / 400) * .12 + .1, G.z);
    ghost.lookAt(P.x, ghost.position.y, P.z);
    // detak jantung & tepi merah bila dekat
    const fear = clamp(1 - dist / 10, 0, 1);
    $e('#escRed').style.opacity = (fear * .9).toFixed(2);
    beatT -= dt;
    if (fear > 0 && beatT <= 0){ sfx('beat', .4 + fear * .6); beatT = 1.1 - fear * .65; }
    // benda yang boleh disentuh berhampiran
    cam.getWorldDirection(fwd);
    near = null; let best = 2.4;
    boards.filter(b => !b.solved).concat([exitPt]).forEach(o => {
      const ox = o.pos.x - P.x, oz = o.pos.z - P.z, d = Math.hypot(ox, oz);
      if (d < best && (fwd.x * ox + fwd.z * oz) / (d || 1) > .2){ best = d; near = o; }
    });
    const act = $e('#escAct');
    if (near){
      act.innerHTML = near === exitPt ? '<i class="fa-solid fa-door-open"></i> BUKA PINTU' : '<i class="fa-solid fa-chalkboard"></i> JAWAB SOALAN';
      act.style.display = 'block';
    } else act.style.display = 'none';
  }
  function ambient(dt){
    flick.forEach(f => {
      f.t += dt;
      const on = f.t < 0 ? Math.random() < .25 : Math.random() > .015;
      const v = on ? f.base * (.85 + Math.random() * .15) : 0;
      f.l.intensity = v; f.tube.material.emissiveIntensity = v / f.base;
    });
    exitLight.intensity = 5 + Math.sin(performance.now() / 300) * 1.5;
  }
  function frame(now){
    if (!alive) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!paused && !ended){ elapsed += dt; $e('#escTime').textContent = fmtSec(elapsed); update(dt, now); }
    ambient(dt);
    R.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

  'tm-alltxt': () => tmapAllTxt(),
  'gnd-prompt': d => { const g = GROUNDS.find(x => x.k === d.id); if (g) copyText(groundPrompt(d.id), 'Prompt ' + g.name + ' disalin.'); },

  'spl-up': () => splashUpload(),
  'spl-del': d => splashDel(d.id),
  'spl-see': d => { const s = (S.splash || []).find(x => x.id === d.id); const u = splashUrl(s); if (u) splashPreview(u); },
  'gnd-tune': d => gndTune(d.id),
  'hpb-prompt': () => copyText(hpbPrompt(), 'Prompt bingkai bar nyawa disalin.'),
  'hpb-up': () => hpbUpload(),
  'dlgf-prompt': () => copyText(dlgfPrompt(), 'Prompt bingkai dialog disalin.'),
  'dlgf-up': () => dlgfUpload(),
  'dlgf-del': () => dlgfClear(),
  'hpb-del': () => hpbClear(),
  'gnd-del': d => groundClear(d.id),
  'st-prompt': () => { stKeep(); storyPromptModal(); },
  'st-help': d => helpSetup(d.id, +d.i),
  'st-import': () => { stKeep(); storyImport(); },
  'st-map': d => storyMapPick(d.id, +d.i),
  'st-open': d => storyOpen(d.id),
  'st-del': d => storyDel(d.id),
  'tt-day': d => {
    const k = ttKey(S.ui.ttClass, S.ui.ttSubject);
    const cur = (S.timetable[k] || []).slice();
    const i = cur.indexOf(parseInt(d.id,10));
    if (i >= 0) cur.splice(i,1); else cur.push(parseInt(d.id,10));
    if (cur.length) S.timetable[k] = cur; else delete S.timetable[k];
    save(true); renderTab();
  },
  'sprites': () => spriteManager(),
  'face-align': d => spriteAlign(d.id, 'face'),
  'face-up': d => faceUpload(d.id),
  'face-del': d => faceDel(d.id),
  'face-prompt': d => { const [c,a] = d.id.split('|'); copyText(facePrompt(c,a), 'Prompt muka '+(FACE_ACTIONS.find(x=>x.k===a)||{}).name+' disalin.'); },
  'spr-up': d => spriteUpload(d.id),
  'spr-del': d => spriteDel(d.id),
  'spr-align': d => /\|ammo$/.test(d.id) ? ammoAlign(d.id.split('|')[0]) : spriteAlign(d.id),
  'spr-prompt': d => { const [g,a] = d.id.split('|');
    const nm = ((isMapAct(a) ? MAP_ACTIONS : SPR_ACTIONS).find(x=>x.k===a)||{}).name;
    copyText(isMapAct(a) ? mapSprPrompt(g,a) : spritePrompt(g,a), 'Prompt '+nm+' ('+g+') disalin.'); },
  'spr-reset': () => sprResetAll(),
  'spr-role': d => { S.ui.sprRole = d.id; save(); closeTop(); spriteManager(); },
  'spr-bg': arenaBgUpload,
  'spr-bgprompt': () => copyText(arenaBgPrompt(), 'Prompt latar Arena disalin.'),
  'bgm-up':   d => bgmUpload(d.id),
  'bgm-del':  d => bgmDel(d.id),
  'bgm-play': d => { BGM.preview = (BGM.preview === d.id) ? null : d.id; BGM.unlocked = true; bgmTick(); renderTab(); },
  'bgm-on':   () => { S.config.bgmOn = bgmOn() ? 0 : 1; save(true); bgmTick(); renderTab(); },
  'bgm-def':  () => { S.config.bgmDef = bgmDefOn() ? 0 : 1; save(true); bgmTick(); renderTab(); },
  'asfx-up':  d => asfxUpload(d.id),
  'asfx-del': d => asfxDel(d.id),
  'asfx-play': d => { if (!SFX_ON) return toast('Bunyi sedang dimatikan.', null, true);
    playAtkSfx(d.id, atkMs() + 600); },
  'spr-mode': () => {
    S.config.sprMode = sprMode() === 'file' ? 'cut' : 'file';
    save(true); closeTop(); spriteManager();
    toast(sprMode() === 'file'
      ? 'Satu fail = satu frame. Gambar diambil seperti dilukis.'
      : 'Imej lembaran akan dipotong jadi beberapa frame.');
  },
  'spr-snap': () => { S.config.sprSnap = (S.config.sprSnap === 1) ? 0 : 1; save(true); closeTop(); spriteManager();
    toast(S.config.sprSnap === 1 ? 'Frame akan dipaku ke tengah & tanah' : 'Kedudukan frame dikekalkan seperti dilukis'); },
  'spr-fps': () => {
    const v = parseInt($('#sprFps').value,10);
    S.config.spriteFps = clamp(isNaN(v)?8:v, 3, 20);
    const a = parseFloat(($('#sprAtk')||{}).value);
    if (!isNaN(a)) S.config.atkMs = Math.round(clamp(a, 0.6, 12) * 1000);
    save(true);
    toast('Gelung ' + S.config.spriteFps + ' FPS \u00b7 serangan ' + (atkMs()/1000) + ' saat');
  },
  'spr-alltxt': () => {
    const txt = 'PROMPT SPRITE ARENA — LAGENDATP\nSetiap frame: ' + SPR_W + ' x ' + SPR_H +
      ' PNG latar telus, watak mengadap KANAN, kaki di tepi bawah, pivot sama.\n' +
      '==========================================================\n\n' +
      CHARS().map(c => SPR_ACTIONS.map(a => '### BADAN · ' + c.name.toUpperCase() + ' — ' + a.name.toUpperCase() + ' (' + a.n + ' frame)\n' + spritePrompt(c.id, a.k)).join('\n\n')).join('\n\n') +
      '\n\n' + CHARS().map(c => FACE_ACTIONS.map(a => '### MUKA · ' + c.name.toUpperCase() + ' — ' + a.name.toUpperCase() + ' (' + a.n + ' frame)\n' + facePrompt(c.id, a.k)).join('\n\n')).join('\n\n') +
      '\n\n' + CHARS().map(c => MAP_ACTIONS.map(a =>
        '### TAPAK ' + c.name.toUpperCase() + ' — ' + a.name.toUpperCase() + '\n' + mapSprPrompt(c.id, a.k)).join('\n\n')).join('\n\n') +
      '\n\n### LATAR ARENA (1280 x 720)\n' + arenaBgPrompt();
    download('prompt_sprite_arena.txt', txt, 'text/plain');
    toast('Fail prompt dimuat turun.');
  },
  'maxkb-save': () => { const v = parseInt($('#cfgMaxKb').value,10); S.config.maxUploadKB = clamp(isNaN(v)?200:v, 20, 500); save(true); renderTab(); toast('Had saiz gambar: '+S.config.maxUploadKB+'KB'); },
  'set-grp': d => { S.ui.setGrp = d.id; S.ui.setSec = ''; save(); renderTab(); window.scrollTo(0,0); },
  'set-sec': d => { S.ui.setSec = (S.ui.setSec === d.id) ? '' : d.id; save(); rerenderKeepScroll(); },
  'rp-save': () => { const v = parseFloat($('#cfgRp').value); S.config.rpPerScore = clamp(isNaN(v)?1:v, 0.1, 10); save(true); renderTab(); toast('Kadar RP: '+S.config.rpPerScore+' per skor'); },
  'tpc-save': () => { const v = parseFloat($('#cfgTpc').value); S.config.tpcRate = clamp(isNaN(v)?1:v, 0.1, 5); save(true); renderTab(); toast('Kadar TPC: '+S.config.tpcRate+' per skor'); },
  'cfg-save': () => {
    const b = parseInt($('#cfgBase').value,10), bo = parseInt($('#cfgBonus').value,10), sd = parseInt($('#cfgStreak').value,10);
    S.config.baseline = clamp(isNaN(b)?SC_MIN:b, SC_MIN, 0);
    S.config.attendBonus = clamp(isNaN(bo)?10:bo, 0, SC_MAX-SC_MIN);
    S.config.streakDays = clamp(isNaN(sd)?5:sd, 2, 30);
    save(true); renderTab(); toast('Tetapan disimpan.');
  },
  'fld-add': fldAdd, 'fld-edit': d=>fldEdit(d.id), 'fld-del': d=>fldDel(d.id),
  'fb-cfg': fbCfgForm, 'fb-rules': fbRules,
  'fb-pull': async () => {
    if (!FB.on) return;
    let remote = null;
    try { const s = await FB.mod.d.get(FB.mod.d.ref(FB.db,'ipbd/v12')); remote = s.exists()?s.val():null; } catch(e){}
    if (!remote) return toast('Tiada data dalam awan.', null, true);
    const ok = await confirmBox({ danger:true, title:'Tarik dari Awan', okText:'Ganti Data Peranti',
      message:'Data dalam peranti ini akan diganti sepenuhnya dengan data awan:<br><br>'+summarise(remote) });
    if (!ok) return;
    adoptRemote(remote); toast('Data awan dimuat turun.');
  },
  'fb-push': async () => {
    if (!FB.on) return;
    const ok = await confirmBox({ danger:true, title:'Hantar ke Awan', okText:'Ganti Data Awan',
      message:'Data dalam awan akan diganti sepenuhnya dengan data peranti ini:<br><br>'+summarise(S) });
    if (!ok) return;
    S.rev = Date.now(); save(true); toast('Data peranti dihantar ke awan.');
  },
  'exp-json': expJson, 'imp-json': impJson, 'rollover': rollover, 'wipe': wipeAll
};
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav){ setTab(nav.dataset.nav); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const fn = ACTS[a.dataset.act];
  if (fn) fn(a.dataset);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ctxClass'){ S.ui.activeClassId = t.value; selReset(); STU_Q = ''; REC_DATE = null; save(); renderAll(); autoSubject(); }
  if (t.id === 'ctxSubject'){ S.ui.activeSubjectId = t.value; REC_DATE = null; save(); renderAll(); }
  if (t.id === 'mtxClass'){ S.ui.mtxClass = t.value; save(); renderTab(); }
  if (t.id === 'qzSubj'){ S.ui.qzSubject = t.value; save(); closeTop(); quizManager(); }
  if (t.id === 'ttClass'){ S.ui.ttClass = t.value; save(); renderTab(); }
  if (t.id === 'ttSubject'){ S.ui.ttSubject = t.value; save(); renderTab(); }
  if (t.id === 'mtxSubject'){ S.ui.mtxSubject = t.value; save(); renderTab(); }

});
// TAHAN gambar pelajar (450ms) = masuk mod pilih ramai
let holdT = null, holdXY = null, holdFired = false;
document.addEventListener('pointerdown', e => {
  const av = e.target.closest('[data-hold]'); if (!av) return;
  holdFired = false; holdXY = [e.clientX, e.clientY];
  clearTimeout(holdT);
  holdT = setTimeout(() => { holdFired = true; holdT = null; SEL.on = true; selToggle(av.dataset.hold); }, 450);
});
document.addEventListener('pointermove', e => {
  if (holdT && holdXY && (Math.abs(e.clientX-holdXY[0]) > 10 || Math.abs(e.clientY-holdXY[1]) > 10)){ clearTimeout(holdT); holdT = null; }
});
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => { if (holdT){ clearTimeout(holdT); holdT = null; } }, true));
document.addEventListener('contextmenu', e => {
  const t = e.target;
  if (t.closest('input, textarea, [contenteditable], pre, .selectable')) return;   // benarkan salin dalam medan & kod
  e.preventDefault();
});
document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
document.addEventListener('selectstart', e => {
  if (e.target.closest && e.target.closest('input, textarea, [contenteditable], pre, .selectable')) return;
  e.preventDefault();
});
document.addEventListener('input', e => { if (e.target.id === 'stuSearch'){ STU_Q = e.target.value; applyStuFilter(); } });

// double-tap pada kad pelajar = nilai (mod biasa) · ketik = togol pilihan (mod pilih)
let lastTap = 0, lastId = '';
document.addEventListener('pointerup', e => {
  const card = e.target.closest('[data-stu]');
  if (!card || e.target.closest('[data-act]')) return;
  if (holdFired){ holdFired = false; return; }
  if (SEL.on){ selToggle(card.dataset.stu); return; }
  const now = Date.now();
  if (now - lastTap < 350 && lastId === card.dataset.stu) { openEval([card.dataset.stu], (stu(card.dataset.stu)||{}).name); lastTap = 0; }
  else { lastTap = now; lastId = card.dataset.stu; }
});

/* ============ PWA ============ */
/* Manifest dijana dalam fail ini (satu fail sahaja).
   start_url membawa penanda ?src=hs supaya app tahu ia dibuka dari skrin utama. */
function initPWA(){
  const base = location.origin + location.pathname;
  const manifest = {
    name: APP_NAME, short_name: APP_NAME, description: 'LagendaTP — dicipta oleh ' + APP_AUTHOR,
    start_url: base + '?src=hs', scope: location.origin + location.pathname.replace(/[^/]*$/, ''),
    display:'standalone', orientation:'portrait', background_color:'#0C1118', theme_color:'#0C1118',
    icons:[
      { src: APP_ICON, sizes:'192x192', type:'image/png', purpose:'any' },
      { src: APP_ICON, sizes:'512x512', type:'image/png', purpose:'any' }
    ]
  };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
  document.head.appendChild(l);
}

/* ============ SKRIN ARAHAN PEMASANGAN ============ */
function isInstalled(){
  const hs = new URLSearchParams(location.search).get('src') === 'hs';
  if (hs) try { sessionStorage.setItem('rk_hs','1'); } catch(e){}
  let flag = false; try { flag = sessionStorage.getItem('rk_hs') === '1'; } catch(e){}
  return hs || flag
    || ['standalone','fullscreen','minimal-ui'].some(m => window.matchMedia('(display-mode: '+m+')').matches)
    || window.navigator.standalone === true;
}
function installGate(){
  ['header','nav','#main'].forEach(sel => { const el = $(sel); if (el) el.style.display = 'none'; });
  const ua = navigator.userAgent;
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const step = (n, icon, text) =>
    '<div class="flex items-center gap-3 panel clip-s p-3 mb-2 text-left">' +
    '<div class="num text-orange text-[18px] w-5">'+n+'</div>' +
    '<i class="fa-solid '+icon+' text-cyan text-[18px] w-6 text-center"></i>' +
    '<div class="text-[13px] leading-snug flex-1">'+text+'</div></div>';
  const android =
    step(1,'fa-ellipsis-vertical','Tekan menu <b>⋮</b> di penjuru kanan atas Chrome') +
    step(2,'fa-mobile-screen-button','Pilih <b>Tambah ke skrin utama</b> atau <b>Pasang aplikasi</b>') +
    step(3,'fa-check','Tekan <b>Tambah / Pasang</b>, kemudian buka <b>LagendaTP</b> dari skrin utama');
  const iphone =
    step(1,'fa-arrow-up-from-bracket','Buka dalam <b>Safari</b>, tekan butang <b>Kongsi</b> di bar bawah') +
    step(2,'fa-square-plus','Pilih <b>Tambah ke Skrin Utama</b> (Add to Home Screen)') +
    step(3,'fa-check','Tekan <b>Tambah</b>, kemudian buka <b>LagendaTP</b> dari skrin utama');
  document.body.insertAdjacentHTML('beforeend',
    '<div id="gate" style="position:fixed;inset:0;z-index:1000;overflow-y:auto;display:flex;align-items:center;justify-content:center;' +
      'padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));background:radial-gradient(circle at 50% 25%,rgba(255,107,0,.14),transparent 60%),#0C1118">' +
      '<div class="w-full max-w-sm text-center">' +
        '<img src="'+APP_ICON+'" alt="LagendaTP" class="mx-auto" style="width:100px;height:100px;object-fit:contain;border-radius:24px;box-shadow:0 0 36px rgba(255,107,0,.35)" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="font-bold tracking-[.25em] text-[28px] glow-o mt-4">LAGENDATP</div>' +
        '<div class="text-[13px] text-muted mt-2 mb-5">Pasang LagendaTP ke skrin utama untuk mula menggunakan.</div>' +
        '<div class="lbl text-left mb-2">'+(ios ? 'IPHONE / IPAD' : 'ANDROID')+'</div>' +
        (ios ? iphone : android) +
        '<details class="mt-3 text-left"><summary class="text-[11px] text-muted">Arahan untuk '+(ios ? 'Android' : 'iPhone / iPad')+'</summary><div class="mt-2">'+(ios ? android : iphone)+'</div></details>' +
        '<div class="text-[10px] text-muted mt-8 tracking-widest">DICIPTA OLEH ARIF AZIZ</div>' +
      '</div></div>');
}

/* ============ INIT ============ */
(async function init(){
  // Mod paparan awam: ?s=... → showcase sahaja, tiada state tempatan, tiada Firebase SDK
  const vp = new URLSearchParams(location.search).get('s');
  if (vp){ S = blank(); viewerBoot(vp); return; }      // pautan showcase murid: tidak perlu pasang
  initPWA();
  if (!isInstalled()){ installGate(); return; }         // dalam pelayar: tutup app, papar arahan pasang sahaja
  IDB = await idbOpen();
  Object.assign(PHOTOS, await idbAll());
  S = load();
  /* Set animasi yang sudah dibuang daripada reka bentuk: dikeluarkan sekali
     sahaja supaya ia tidak lagi muncul dalam pengurus, pakej atau pramuat. */
  dropOldSprites();
  try { dropTiles(); } catch(e){}
  bgmInit();
  hintInit();
  /* Tempoh serangan lalai diturunkan 5 saat -> 3 saat. Nilai 5000 yang
     tersimpan datang daripada lalai lama, bukan pilihan guru, jadi ia
     diselaraskan sekali sahaja. Nilai lain dibiarkan. */
  if (S.config && +S.config.atkMs === 5000){ S.config.atkMs = 3000; save(true); }
  if (!S.ui.mtxClass) S.ui.mtxClass = S.ui.activeClassId || '';
  if (!S.ui.mtxSubject) S.ui.mtxSubject = S.ui.activeSubjectId || '';
  $$('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.nav === S.ui.tab));
  renderAll();
  setTimeout(autoSubject, 400);
  autoAssetPack();
  fbInit();
  window.addEventListener('beforeunload', () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} });
  window.addEventListener('storage', e => {
    if (e.key !== LS_KEY || !e.newValue) return;
    try { const d = JSON.parse(e.newValue); if ((d.rev||0) > (S.rev||0)){ S = migrate(d); renderAll(); } } catch(err){}
  });
})();
