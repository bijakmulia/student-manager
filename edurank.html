           Mod langkau terlalu pantas untuk bunyi panjang, jadi guna bunyi ringkas. */
        const cS = charOf((side === att.side ? att : def).sid);
        const custom = !skipped && SFX_ON && !!atkSfxSrc(cS);
        if (custom) playAtkSfx(cS, ms + 600); else sfx('swing');
        const anim = s.ac.once('attack', ms);
        /* Penyerang jarak jauh: peluru dilepaskan pada saat frame pelepasan
           dipaparkan, dan swing() hanya selesai setelah ia tiba — jadi
           hentakan kena serang berlaku betul-betul ketika ia mengenai. */
        const u = side === att.side ? att : def;
        let shot = null;
        if (isRangedUnit(u)){
          const c = charOf(u.sid);
          const n = Math.max(1, (spriteFrames(c, 'attack') || []).length);
          const step = Math.max(45, ms / n);
          const at = Math.min(ms, Math.round(relFrame(c) * step));
          const L = $('#dcWL', ov), R = $('#dcWR', ov);
          const left = s.wrap === L;
          /* Kanvas sprite itu sendiri (#dcL/#dcR) — sauh peluru dijajar dalam
             ruang kanvas, bukan pembalut yang turut membawa label nama. */
          const mine = $(left ? '#dcL' : '#dcR', ov) || s.wrap;
          const tgt  = $(left ? '#dcR' : '#dcL', ov) || (left ? R : L);
          const col = side === 'a' ? '#00F0FF' : '#FF6B00';
          /* 'at' sudah dikira daripada ms yang mengandungi skipped dan sp,
             jadi nap() di sini akan menggandakan kelajuan sekali lagi. */
          shot = sleep(at).then(() => {
            if (!custom) sfx('shoot');            // bunyi guru sudah membawa bunyi lepasan
            return flyShot(mine, tgt, col, c, skipped ? 70 : 420, s.wrap && s.wrap.parentElement);
          });
        }
        await Promise.all(shot ? [anim, shot] : [anim]);
        s.ac.loop('idle');
      },
      async land(side, res){
        const s = who(side), n = $('#dcNum', ov);
        if (res.heal){
          sfx('statup');
          if (n){ n.textContent = '+' + res.dmg; n.style.color = '#4ADE80'; }
          setHp();
          say(side, 'happy', dlgQ('healed'));
          await s.ac.once('idle', skipped ? 70 : Math.round(260 * sp));
          if (n){ n.style.opacity = '1'; n.style.transform = 'translateY(-14px)';
            setTimeout(() => { n.style.opacity = '0'; n.style.transform = 'translateY(0)'; }, skipped ? 60 : 520); }
          s.ac.loop('idle'); prev(); await beat(300); return;
        }
        /* Tiada lagi set 'undur' dan 'kena serang' untuk dimuat naik; app
           melukis kesannya sendiri dengan hentakan ringkas pada sprite. */
        const jolt = async (px, ms) => {
          if (!s.wrap) return nap(ms);
          s.wrap.style.transition = 'transform .09s ease-out';
          s.wrap.style.transform = 'translateX(' + px + '%)';
          await nap(Math.round(ms * 0.42));
          s.wrap.style.transition = 'transform .16s ease-in';
          s.wrap.style.transform = 'translateX(0)';
          await nap(Math.round(ms * 0.58));
          s.wrap.style.transition = '';
        };
        if (res.miss){
          if (n){ n.textContent = 'SASAR'; n.style.color = '#9AA7B4'; }
          say(side, 'happy', dlgLine('miss'));
          await jolt(s.dir * -5, skipped ? 70 : Math.round(260 * sp));
        } else {
          sfx('impact');
          if (n){ n.textContent = (res.crit ? '★ ' : '') + '-' + res.dmg; n.style.color = res.crit ? '#FFD76A' : '#FF6B00'; }
          setHp();
          say(side, 'hurt', dlgLine('hurt'));
          await jolt(s.dir * -(res.crit ? 13 : 9), skipped ? 70 : Math.round(300 * sp));
        }
        if (n){
          n.style.opacity = '1'; n.style.transform = 'translateY(-14px)';
          setTimeout(() => { n.style.opacity = '0'; n.style.transform = 'translateY(0)'; }, skipped ? 60 : 520);
        }
        s.ac.loop('idle');
        prev();
        await beat(300);
      },
      async down(side){
        const s = who(side);
        sfx('low');
        say(side, 'hurt', dlgLine('lose'));
        if (s.wrap){ s.wrap.style.transition = 'opacity .5s ease,transform .5s ease';
          s.wrap.style.opacity = '.15'; s.wrap.style.transform = 'translateY(14%) rotate(' + (s.dir * -12) + 'deg)'; }
        await beat(560);
      },
      async close(){
        if (closed) return; closed = true;
        await nap(200);
        ov.style.opacity = '0';
        acL.stop(); acR.stop();
        setTimeout(() => ov.remove(), 220);
      }
    };
  }

  /* Tanpa lakonan dekat, ejekan berhuraian ditunjuk dalam kotaknya sendiri
     supaya pelajar tetap membaca penjelasan jawapan betul. */
  function tauntBox(name, txt){
    return new Promise(res => {
      let done = false;
      const mid = openModal({ center:true, icon:'fa-comment-dots', title: (name || 'Lawan').toUpperCase(),
        body:'<div class="text-[14px] leading-relaxed" style="color:#FFC24D">“' + esc(txt) + '”</div>',
        footer:'<button class="btn btn-o clip-s flex-1" data-tb="1">FAHAM</button>',
        onClose: () => { if (!done){ done = true; res(); } } });
      const b = $('[data-modal="' + mid + '"]');
      b.addEventListener('click', e => { if (e.target.closest('[data-tb]')){ done = true; closeModal(mid); res(); } });
    });
  }
  /* Jawapan salah memberi makan kepada bos — soalan jadi penting, bukan hiasan. */
  function soWrong(){
    if (!SO || !SO.bossSid) return;
    const b = units.find(u => u.sid === SO.bossSid && u.hp > 0);
    if (!b) return;
    b.atk = Math.max(1, Math.round(b.atk * 1.08));
    SO.rage = (SO.rage || 0) + 1;
    line('<span style="color:#FF6B00"><b>' + esc(b.name) + '</b> menyerap kesilapan itu \u2014 ATK +8% (kali ke-' + SO.rage + ').</span>');
  }
  async function strike(att, def, isAI, isHeal){
    if (!att || !def || att.hp <= 0 || def.hp <= 0) return false;
    if (att === def && !isHeal) return false;
    busy = true;
    panEnsure(def.x, def.y, true);                      // pastikan pertempuran kelihatan
    const zm = S.config.tactZoom || 'all';
    // Pemulihan kekal di mod tapak — tiada lakonan dekat, cuma nyawa naik di papan.
    const useCut = !isHeal && spriteReady() && (zm === 'all' || (zm === 'player' && !isAI));
    const scene = useCut ? duelScene(att, def, isAI ? 0.7 : 1, isHeal, isAI) : null;
    let mult = 1, forceCrit = false, wrong = false, acted = false, longTaunt = false, pwr = 100;
    try {
      if (isAI && hand[att.side].length && Math.random() < 0.3) aiCard(att);
      if (scene){
        const q = await scene.ask(sj, chap, isAI || !quizOn || isHeal);
        if (q.cancel) return false;                     // guru batalkan — unit kekal boleh bertindak
        if (q.q){
          quizRecord(att.sid, !!q.ok);
          const betul = q.q.c[q.q.a];
          if (q.ok){
            forceCrit = !!q.fast;
            mult = spdMult(q.used);
            pwr = spdPct(q.used);
            scene.say(att.side, q.fast ? 'happy' : 'determ', dlgQ(q.fast ? 'fast' : 'right'));
            line('<span style="color:' + (q.fast ? '#FFD76A' : '#4ADE80') + '">Jawapan betul dalam ' +
                 ((q.used === undefined ? 1 : q.used) * QUIZ_TIME).toFixed(1) + 's \u2014 kuasa serangan <b>' + pwr + '%</b>' +
                 (q.fast ? ' + KRITIKAL' : '') + '.</span>');
          } else {
            mult = 0.45; wrong = true; soWrong();
            const tn = sTaunt(q.q, betul, q.pick);
            scene.say(def.side, 'happy', tn || dlgQ(q.timeout ? 'slow' : 'wrong', betul));
            longTaunt = !!tn;
            line((q.timeout ? '<span style="color:#E23B3B">Masa tamat</span>' : '<span style="color:#E23B3B">Jawapan salah</span>') +
                 ' <span class="text-muted">— jawapan betul: <b>' + esc(betul) + '</b></span>' +
                 (tn ? '<div class="text-[11px] leading-snug mt-0.5" style="color:#FFC24D">“' + esc(tn) + '”</div>' : ''));
          }
        } else if (isAI) mult = 0.9;
        scene.lock(
          isHeal ? 'Pemulihan penuh · tiada soalan untuk Healer'
            : !quizOn || isAI ? 'Menyerang…'
            : wrong ? 'Serangan lemah 45% · lawan membalas penuh'
            : forceCrit ? 'Kuasa ' + pwr + '% · KRITIKAL DIJAMIN' : 'Kuasa ' + pwr + '%',
          wrong ? '#E23B3B' : forceCrit ? '#FFD76A' : '#4ADE80');
        await scene.beat(isHeal ? 550 : longTaunt ? 2600 : 1100);   // mod ketik: tunggu pemain; mod auto: pemasa
      } else {
        if (quizOn && !isAI && !isHeal){
          const q = await askQuestion(sj, att.name, chap);
          if (q.skip) return false;
          quizRecord(att.sid, !!q.ok);
          if (q.ok){
            forceCrit = !!q.fast;
            mult = spdMult(q.used); pwr = spdPct(q.used);
            line('<span style="color:' + (q.fast ? '#FFD76A' : '#4ADE80') + '">Jawapan betul dalam ' +
                 ((q.used === undefined ? 1 : q.used) * QUIZ_TIME).toFixed(1) + 's \u2014 kuasa serangan <b>' + pwr + '%</b>' +
                 (q.fast ? ' + KRITIKAL' : '') + '.</span>');
          }
          else {
            mult = 0.45; wrong = true; soWrong();
            const betul = q.q ? q.q.c[q.q.a] : '';
            const tn = sTaunt(q.q, betul, q.pick);
            line((q.timeout ? '<span style="color:#E23B3B">Masa tamat</span>' : '<span style="color:#E23B3B">Jawapan salah</span>') +
                 (betul ? ' <span class="text-muted">— jawapan betul: <b>' + esc(betul) + '</b></span>' : ''));
            if (tn) await tauntBox(def.name, tn);
          }
        } else if (isAI) mult = 0.9;
      }
      acted = true;
      if (scene) await scene.swing(att.side);
      if (isHeal){
        const amt = Math.max(1, Math.round(tgHeal(att) * mult * (forceCrit ? 1.5 : 1)));
        const before = def.hp;
        def.hp = Math.min(def.maxhp, def.hp + amt);
        const got = Math.round(def.hp - before);
        sfx('statup');
        line('<span style="color:#4ADE80">' + esc(att.name) + '</span> memulihkan ' +
             (att === def ? 'dirinya' : esc(def.name)) +
             ' <b>+' + got + '</b> <span class="text-muted">(HP ' + Math.round(def.hp) + '/' + def.maxhp + ')</span>');
        att.done = true;
        if (scene){ await scene.land(def.side, { heal:true, dmg:got }); return true; }
        // di papan: lukis semula dahulu (bar HP naik), barulah nombor hijau terapung
        draw();
        pop(def, '+' + got, '#4ADE80');
        await wait(760);
        return true;
      }
      const res = hitOnce(att, def, mult, forceCrit, !!scene);
      if (scene) await scene.land(def.side, res);
      att.done = true;
      if (def.hp <= 0){
        if (scene) await scene.down(def.side);
        line('<b style="color:#FFD76A">' + esc(def.name) + ' tumbang!</b>');
        awardXp(att, def);
      } else if (canHitAt(def, att, map)){
        // balas: pembela membalas jika penyerang berada dalam jarak serangannya
        if (scene) await scene.swing(def.side); else await wait(420);
        const cm = wrong ? 1 : 0.7;
        line('<span class="text-muted">' + esc(def.name) + ' membalas.</span>');
        const r2 = hitOnce(def, att, cm, false, !!scene);
        if (scene) await scene.land(att.side, r2);
        if (att.hp <= 0){
          if (scene) await scene.down(att.side);
          line('<b style="color:#FFD76A">' + esc(att.name) + ' tumbang!</b>');
          awardXp(def, att);
        }
      }
    } finally {
      if (scene) await scene.close();                   // panel mesti hilang walau apa pun
      busy = false;
      sel = null; moved = null;
      draw();
    }
    return acted;
  }
  /* EXP: unit yang menumpaskan lawan menjadi lebih kuat untuk babak
     seterusnya. Mod cerita yang menyimpannya (SO.onKill), jadi pertempuran
     biasa tidak terjejas. */
  function awardXp(killer, fallen){
    if (!SO || !SO.onKill || !killer || !fallen) return;
    const got = SO.onKill(killer, fallen);
    if (!got) return;
    line('<span style="color:#A78BFA">' + esc(killer.name) + ' mendapat <b>+' + got.xp + ' EXP</b>' +
      (got.lvl ? ' \u2014 naik ke <b>Tahap ' + got.lvl + '</b>, lebih kuat pada babak seterusnya' : '') + '.</span>');
    pop(killer, '+' + got.xp + ' XP', '#A78BFA');
  }
  /* quiet = lakonan dekat uruskan bunyi dan nombor terapung sendiri */
  function hitOnce(att, def, mult, forceCrit, quiet){
    const p = tgCalc(att, def, map, mult);
    if (!quiet) sfx('swing');
    if (!forceCrit && Math.random() < p.miss){
      if (!quiet) pop(def, 'SASAR', '#9AA7B4');
      line('<span class="text-muted">'+esc(att.name)+' tersasar.</span>');
      return { miss:true, crit:false, dmg:0 };
    }
    const crit = forceCrit || Math.random() < p.critP;
    const dmg = Math.max(1, Math.round(p.base * (0.85 + Math.random() * 0.33) * (crit ? 1.75 : 1)));
    def.hp = Math.max(0, def.hp - dmg);
    if (!quiet){ sfx('impact'); pop(def, (crit ? '★' : '') + '-' + dmg, crit ? '#FFD76A' : '#FF6B00'); }
    line('<span style="color:'+(att.side==='a'?'#00F0FF':'#FF6B00')+'">'+esc(att.name)+'</span> → '+esc(def.name)+
         ' <b>'+dmg+'</b>'+(crit ? ' <span style="color:#FFD76A">KRITIKAL</span>' : '')+' <span class="text-muted">(HP '+Math.round(def.hp)+')</span>');
    return { miss:false, crit, dmg };
  }

  /* AI memainkan kad ketua secara rawak */
  function aiCard(u){
    const hs = hand[u.side];
    if (!hs || !hs.length) return;
    const c = hs.splice(Math.floor(Math.random() * hs.length), 1)[0];
    const g = applyCard(u, c);
    line('<span style="color:#FFC24D">' + esc(ldName[u.side]) + ' guna kad <b>' + esc(c.name||'Kad') + '</b> pada ' +
         esc(u.name) + ' — ' + cardBonusText(c) + '</span>');
    sfx('cardup');
    return g;
  }
  /* Pemilih sasaran pemulihan — Healer tidak perlu menjawab soalan.
     Itu kelebihan kelas: menyerang perlu kuiz, memulihkan tidak. */
  function healPick(me, list){
    const amt = tgHeal(me);
    const row = (z, i) => {
      const diri = z === me;
      const p = Math.max(0, z.hp) / Math.max(1, z.maxhp) * 100;
      const hc = p > 50 ? '#4ADE80' : p > 20 ? '#FACC15' : '#E23B3B';
      const r = roleOf(z.role);
      const dapat = Math.min(z.maxhp, z.hp + amt) - z.hp;
      return '<button class="btn clip-s w-full mb-1.5 flex items-center gap-2 !py-2 text-left" data-hp="' + i + '">' +
        '<i class="fa-solid ' + (diri ? 'fa-user' : r.ico) + '" style="color:' + (diri ? '#4ADE80' : r.color) + ';width:18px;text-align:center"></i>' +
        '<div class="flex-1 min-w-0">' +
          '<div class="text-[13px] truncate">' + (diri ? 'Diri sendiri — ' : '') + esc(z.name) + '</div>' +
          '<div style="height:4px;background:#0A0F14;margin-top:3px"><div style="width:' + p + '%;height:100%;background:' + hc + '"></div></div>' +
          '<div class="num text-[9px] text-muted mt-0.5">HP ' + Math.round(z.hp) + '/' + z.maxhp +
            (diri ? '' : ' · jarak ' + tgDist(me, z)) + '</div></div>' +
        '<div class="num text-[14px] font-bold" style="color:#4ADE80">+' + Math.round(dapat) + '</div></button>';
    };
    const id = openModal({ icon:'fa-kit-medical', title:'Pulihkan Siapa?',
      body:'<div class="text-[11px] text-muted mb-2">Healer tidak perlu menjawab soalan untuk memulihkan \u2014 itu kelebihan kelas ini. Giliran unit tamat selepas memulihkan.</div>' +
        list.map(row).join('') });
    const bd2 = $('[data-modal="' + id + '"]');
    bd2.addEventListener('click', e => {
      const b = e.target.closest('[data-hp]'); if (!b) return;
      const z = list[+b.dataset.hp];
      closeModal(id);
      if (!z || over || me.done || me.hp <= 0) return;
      if (z !== me){ if (z.x > me.x) me.face = 1; else if (z.x < me.x) me.face = -1; }
      (async () => { await strike(me, z, false, true); autoEnd(); })();
    });
  }
  function endPhase(){
    if (over) return;
    units.forEach(u => u.done = false);
    sel = null; moved = null;
    turn = turn === 'a' ? 'b' : 'a';
    if (turn === first) round++;
    draw();
    panTeam(turn, true);                                // alih sekali ke pihak yang bergiliran
    if (checkOver()) return;
    if (aiB && turn === 'b') setTimeout(aiTurn, 500);
  }
  function autoEnd(){
    const live = turn === 'a' ? alive('a') : alive('b');
    if (live.length && live.every(u => u.done)) setTimeout(endPhase, 450);
  }
  function checkOver(){
    if (over || roam) return false;
    const la = alive('a').length, lb = alive('b').length;
    if (la && lb) return false;
    over = true;
    const ws = la ? 'a' : 'b';
    if (SO){
      QPOOL = null; SDLG = null; SQT = null;
      const win = ws === 'a';
      if (win && SO.onWin) SO.onWin();
      const colS = win ? '#4ADE80' : '#E23B3B';
      const ovS = $('#tgOver', bd);
      if (ovS){
        ovS.style.display = 'flex';
        ovS.innerHTML = '<div><div class="num" style="font-size:12px;letter-spacing:.4em;color:#FFD76A">BABAK ' + (SO.n || 1) + '</div>' +
          '<div class="font-bold aura-hi" style="font-size:clamp(20px,6.5vw,38px);line-height:1.05;color:' + colS +
            ';text-shadow:0 0 18px ' + colS + '">' + (win ? 'MUSUH TUMPAS' : 'WIRA TUMBANG') + '</div>' +
          '<div class="text-[12px] mt-2 leading-snug" style="color:#E6EEF7;max-width:34ch;margin:0 auto">' +
            esc(win ? (SO.winTxt || '') : (SO.loseTxt || '')) + '</div>' +
          (SO.rage ? '<div class="num text-[10px] text-muted mt-2">' + SO.rage + ' jawapan salah menguatkan lawan</div>' : '') +
          (win
            ? (DOOR
              ? '<div class="text-[11px] mt-2" style="color:#FFD76A"><i class="fa-solid fa-door-open"></i> Pintu ke peta seterusnya kini terbuka.</div>' +
                '<button class="btn btn-o clip-s mt-3 !px-6" data-tg="roam"><i class="fa-solid fa-compass"></i> PERGI KE PINTU</button>'
              : '<button class="btn btn-o clip-s mt-3 !px-6" data-tg="next">TERUSKAN CERITA <i class="fa-solid fa-forward"></i></button>')
            : '<div class="flex gap-2 justify-center mt-3"><button class="btn clip-s !px-4" data-close="1">KELUAR</button>' +
              '<button class="btn btn-o clip-s !px-5" data-tg="retry"><i class="fa-solid fa-rotate-right"></i> CUBA LAGI</button></div>') +
          '</div>';
      }
      draw();
      return true;
    }
    // watak NPC tidak menyentuh mata, RP atau rekod sesiapa
    const wIds = (ws === 'a' ? A : B).map(u => u.sid).filter(sid => !isNpcSid(sid));
    const lIds = (ws === 'a' ? B : A).map(u => u.sid).filter(sid => !isNpcSid(sid));
    S.arena = S.arena || { points:{}, wins:{}, losses:{}, history:[] };
    wIds.forEach(sid => { S.arena.points[sid] = (S.arena.points[sid]||0) + 3; S.arena.wins[sid] = (S.arena.wins[sid]||0) + 1; });
    lIds.forEach(sid => { S.arena.points[sid] = (S.arena.points[sid]||0) + 1; S.arena.losses[sid] = (S.arena.losses[sid]||0) + 1; });
    const g = rpAward(wIds, lIds, sj);
    const lbl = ws === 'a' ? labelA : labelB;
    S.arena.history.unshift({ ts:Date.now(), mode:'taktikal', a:labelA, b:labelB, win:lbl,
                              aIds:idsA.filter(x => !isNpcSid(x)), bIds:idsB.filter(x => !isNpcSid(x)),
                              winIds:wIds, loseIds:lIds, rp:g });
    S.arena.history = S.arena.history.slice(0, 50);
    save(true);
    sfx('hi');
    const col = ws === 'a' ? '#00F0FF' : '#FF6B00';
    line('<b style="color:#FFD76A">+'+g+' RP setiap pemenang · +2 RP yang kalah</b>');
    const ov = $('#tgOver', bd);
    if (ov){
      ov.style.display = 'flex';
      ov.innerHTML = '<div><div class="num" style="font-size:12px;letter-spacing:.4em;color:#FFD76A">PERTEMPURAN TAMAT</div>' +
        '<div class="font-bold aura-hi" style="font-size:clamp(20px,6.5vw,38px);line-height:1.05;color:'+col+';text-shadow:0 0 18px '+col+'">'+lbl+'</div>' +
        '<div class="font-bold tracking-[.35em] text-[13px] mt-1" style="color:#E6EEF7">MENANG</div>' +
        '<div class="num text-[10px] text-muted mt-2">'+(ws==='a'?A:B).filter(u=>u.hp>0).map(u=>esc(u.name)+' '+Math.round(u.hp)+'HP').join(' · ')+'</div>' +
        '<button class="btn btn-o clip-s mt-3 !px-6" data-close="1">SELESAI</button></div>';
    }
    draw();
    if (S.ui.tab === 'arena') setTimeout(renderTab, 60);
    return true;
  }

  function startRoam(){
    const ov = $('#tgOver', bd); if (ov){ ov.style.display = 'none'; ov.innerHTML = ''; }
    roam = true; over = false; turn = 'a';
    units.forEach(u => u.done = false);
    sel = alive('a')[0] || null; moved = false;
    draw();
    if (sel) panEnsure(sel.x, sel.y, true);
    line('<span style="color:#FFD76A">Mod jelajah — ' + (DOOR ? 'cari pintu ke peta seterusnya.' : 'bual dengan NPC.') + '</span>');
  }
  function doorEnter(){
    if (!SO) return;
    over = true; SO.ended = 1;
    const ov = $('#tgOver', bd);
    if (ov){ ov.style.display = 'flex'; ov.style.opacity = '0'; ov.style.transition = 'opacity .35s ease';
      ov.innerHTML = '<div class="num" style="font-size:13px;letter-spacing:.4em;color:#FFD76A"><i class="fa-solid fa-door-open"></i> MEMASUKI PINTU…</div>';
      requestAnimationFrame(() => { ov.style.opacity = '1'; }); }
    sfx('flip');
    setTimeout(() => { closeModal(id); if (SO.onEnd) SO.onEnd('door'); }, 520);
  }
  async function aiTurn(){
    for (const u of alive('b')){
      if (over) return;
      if (u.hp <= 0) continue;                 // tumbang akibat balasan dalam giliran yang sama
      u.done = false;
      const foes = alive('a');
      if (!foes.length) break;
      if (canHeal(u)){
        let hurt = healTargets(u).sort((p,q) => (p.hp/p.maxhp) - (q.hp/q.maxhp))[0];
        if ((!hurt || hurt.hp/hurt.maxhp > 0.75) && u.hp < u.maxhp && u.hp / u.maxhp < 0.6) hurt = u;
        if (hurt && hurt.hp > 0 && hurt.hp / hurt.maxhp < 0.75){
          await strike(u, hurt, true, true);
          u.done = true; draw(); await wait(200);
          continue;
        }
      }
      const reach = tactReach(u, mapM, units);
      // cari petak terbaik: boleh serang, utamakan sasaran HP rendah & rupa bumi baik
      let best = null;
      const spots = Object.keys(reach).map(k => { const i = +k; return { x:i % TGW, y:Math.floor(i / TGW), c:reach[k] }; });
      spots.push({ x:u.x, y:u.y, c:0 });
      spots.forEach(sp => {
        const sv = { x:u.x, y:u.y };
        u.x = sp.x; u.y = sp.y;
        const rng = tgRng(u, map), mn = tgMin(u);
        u.x = sv.x; u.y = sv.y;
        foes.forEach(f => {
          const d = Math.abs(sp.x - f.x) + Math.abs(sp.y - f.y);
          if (d < mn || d > rng) return;
          const terr = TERR[map[tgIdx(sp.x,sp.y)]] || TERR.p;
          const sc = 1000 - f.hp + terr.atk * 200 + terr.def * 120 - sp.c * 4;
          if (!best || sc > best.sc) best = { sp, f, sc };
        });
      });
      if (best){
        await walkPath(u, tactPath(u, mapM, units, best.sp.x, best.sp.y) || [{ x:best.sp.x, y:best.sp.y }]);
        if (over) return;
        // hadap arah sasaran sebelum menyerang
        faceTo(u, best.f);
        draw(); await wait(200);
        await strike(u, best.f, true);
        if (checkOver()) return;
      } else {
        // tiada sasaran dalam capaian: ikut medan kos ke musuh paling mudah dicapai
        let fld = null, mb = Infinity, mv = null;
        foes.forEach(f => {
          const ff = tgField(f.x, f.y, mapM);
          const here = ff[tgIdx(u.x,u.y)];
          if (here === undefined) return;                      // terkurung dinding
          if (fld === null || here < fld.here){ fld = { ff, here }; }
        });
        if (fld){
          mb = fld.here;
          spots.forEach(sp => {
            const v = fld.ff[tgIdx(sp.x,sp.y)];
            if (v === undefined) return;
            const t = TERR[map[tgIdx(sp.x,sp.y)]] || TERR.p;
            const sc = v - t.def * 0.6;                         // seri: pilih rupa bumi lebih baik
            if (sc < mb - 0.001){ mb = sc; mv = sp; }
          });
        }
        if (mv) await walkPath(u, tactPath(u, mapM, units, mv.x, mv.y) || [{ x:mv.x, y:mv.y }]);
        u.done = true; draw(); await wait(160);
      }
      await wait(200);
    }
    if (!over) endPhase();
  }

  /* seret di mana-mana atas peta untuk alih pandangan */
  let dragOn = false, dragMoved = false, dsx = 0, dsy = 0, dpx = 0, dpy = 0;
  const vEl = $('#tgView', bd);
  vEl.addEventListener('pointerdown', e => {
    dragOn = true; dragMoved = false;
    dsx = e.clientX; dsy = e.clientY; dpx = panX; dpy = panY;
    const b2 = $('#tgBoard', bd); if (b2) b2.style.transition = 'none';
    try { vEl.setPointerCapture(e.pointerId); } catch(_){}
  });
  vEl.addEventListener('pointermove', e => {
    if (!dragOn) return;
    const dx = e.clientX - dsx, dy = e.clientY - dsy;
    if (!dragMoved && (Math.abs(dx) > 7 || Math.abs(dy) > 7)){ dragMoved = true; vEl.style.cursor = 'grabbing'; }
    if (!dragMoved) return;
    panX = dpx + dx; panY = dpy + dy; panClamp();
  });
  const dragEnd = e => {
    if (!dragOn) return;
    dragOn = false; vEl.style.cursor = 'grab';
    try { vEl.releasePointerCapture(e.pointerId); } catch(_){}
  };
  vEl.addEventListener('pointerup', dragEnd);
  vEl.addEventListener('pointercancel', dragEnd);

  $('#tgBoard', bd).addEventListener('click', async e => {
    if (dragMoved){ dragMoved = false; return; }       // itu seretan, bukan ketikan
    if (over || busy) return;
    if (aiB && turn === 'b') return;
    const c = e.target.closest('[data-x]'); if (!c) return;
    const x = +c.dataset.x, y = +c.dataset.y;
    const u = units.find(z => z.hp > 0 && z.x === x && z.y === y);
    const nn = npcAt(x, y);
    if (roam){
      if (u && u.side === 'a'){ sel = u; draw(); return; }
      const me = (sel && sel.hp > 0) ? sel : alive('a')[0];
      if (!me) return;
      sel = me; busy = true;
      try {
        if (nn){
          if (tgDist(me, nn) > 1){
            let best = null;
            [[1,0],[-1,0],[0,1],[0,-1]].forEach(d => { const p = roamPath(me, nn.x + d[0], nn.y + d[1]);
              if (p && (!best || p.length < best.length)) best = p; });
            if (!best) return toast('NPC itu tidak dapat dihampiri.', null, true);
            await walkPath(me, best);
          }
          faceTo(me, nn); draw();
          await npcTalk(me, nn);
          draw(); return;
        }
        if (me.x === x && me.y === y) return;
        const p = roamPath(me, x, y);
        if (!p) return toast('Petak itu tidak dapat dicapai.', null, true);
        sfx('flip');
        await walkPath(me, p);
        if (DOOR && me.x === DOOR.x && me.y === DOOR.y) return doorEnter();
        draw();
      } finally { busy = false; }
      return;
    }
    /* Ketik NPC semasa bertempur: bercakap jika wira terpilih berdiri di sebelahnya. */
    if (nn){
      if (!sel || sel.side !== 'a') return toast('Pilih wira, kemudian bawa dia ke sebelah ' + mnpcName(nn.id) + '.', null, true);
      if (tgDist(sel, nn) > 1) return toast('Bawa wira ke petak di sebelah ' + mnpcName(nn.id) + ' untuk bercakap.', null, true);
      busy = true; faceTo(sel, nn); draw();
      await npcTalk(sel, nn);
      busy = false; draw(); return;
    }
    if (u && u.side === turn){
      if (u.done) return toast('Unit ini sudah bertindak giliran ini.', null, true);
      if (sel === u && !moved){ sel = null; } else { sel = u; moved = false; }
      draw(); return;
    }
    if (!sel || sel.done) return;
    if (u && u.side !== turn){
      if (!canHitAt(sel, u, map)){
        const mn = tgMin(sel), mx = tgRng(sel, map);
        return toast(tgDist(sel,u) < mn ? 'Terlalu rapat — kelas ini perlu jarak sekurang-kurangnya '+mn+' petak.'
                                        : 'Luar jarak serangan (maksimum '+mx+' petak).', null, true);
      }
      const me = sel;
      const zoomOn = spriteReady() && (S.config.tactZoom || 'all') !== 'off';
      if (!zoomOn){
        busy = true;                                 // halang ketukan kedua membuka dialog baharu
        const ok = await confirmBox({ title:'Serang '+(stu(u.sid)||{name:u.name}).name,
          okText: quizOn ? 'JAWAB & SERANG' : 'SERANG',
          message: tgPrevHtml(me, u, map) + (quizOn ? '<div class="num text-[10px] mt-2" style="color:#4ADE80">Jawab soalan dengan betul untuk kerosakan penuh. Salah = 45% sahaja dan lawan membalas penuh.</div>' : '') });
        busy = false;
        if (!ok) return;
      }
      if (over) return;
      if (me !== sel || me.done || me.hp <= 0 || u.hp <= 0){ draw(); return; }
      faceTo(me, u);
      await strike(me, u, false);
      if (checkOver()) return;
      autoEnd(); return;
    }
    if (moved) return;
    const r = tactReach(sel, mapM, units);
    if (r[tgIdx(x,y)] === undefined) return;
    const walker = sel;
    moved = true; busy = true;
    sfx('flip');
    await walkPath(walker, tactPath(walker, mapM, units, x, y) || [{ x, y }]);
    /* Berhenti rapat dengan sekutu = peluang bertanya. Sekali setiap unit
       setiap pertempuran, supaya ia tidak jadi butang yang ditekan berulang. */
    if (walker.side === 'a' && !walker.npc && !over){
      const nb = NPCM.find(n => tgDist(walker, n) <= 1 && !helpSeen[walker.sid + '|' + n.k]);
      if (nb){ helpSeen[walker.sid + '|' + nb.k] = 1; faceTo(walker, nb); draw(); await npcTalk(walker, nb); }
      if (SO && DOOR && walker.x === DOOR.x && walker.y === DOOR.y)
        toast('Pintu masih terkunci — tumpaskan semua musuh dahulu.', null, true);
    }
    busy = false;
    if (over || sel !== walker) return;              // giliran mungkin sudah bertukar
    // tiada sasaran dalam jarak → terus tamat tindakan unit
    const adaSasaran = units.some(z => z.hp > 0 && z.side !== walker.side && canHitAt(walker, z, map)) ||
                       (canHeal(walker) && healTargets(walker).length);
    if (!adaSasaran){
      walker.done = true; sel = null; moved = null; draw(); autoEnd();
    }
  });
  bd.addEventListener('click', e => {
    const rs = e.target.closest('[data-rs]');
    if (rs && !over && !busy && !(aiB && turn === 'b')){
      const u = units.find(z => z.sid === rs.dataset.rs && z.hp > 0 && z.side === turn);
      if (!u) return;
      if (u.done) return toast('Unit ini sudah bertindak giliran ini.', null, true);
      sel = (sel === u && !moved) ? null : u;
      if (sel){ moved = false; panEnsure(u.x, u.y, true); }
      draw(); return;
    }
    const bf = e.target.closest('[data-tg="full"]');
    if (bf){ fullToggle(); return; }
    const so2 = e.target.closest('[data-tg="roam"],[data-tg="next"],[data-tg="retry"]');
    if (so2 && SO){
      const k2 = so2.dataset.tg;
      if (k2 === 'roam') return startRoam();
      SO.ended = 1; closeModal(id);
      if (SO.onEnd) SO.onEnd(k2 === 'next' ? 'win' : 'retry');
      return;
    }
    if (e.target.closest('[data-tg="help"]')){
      openModal({ icon:'fa-circle-question', title:'Panduan Pertempuran',
        body:'<div class="lbl">PENANDA UNIT</div>' +
          '<div class="text-[12px] leading-relaxed mt-1">' +
            'Kurungan <b style="color:#00F0FF">cyan</b> = Pasukan A · ' +
            '<b style="color:#FF6B00">oren</b> = Pasukan B · ' +
            '<b style="color:#FFD76A">emas</b> = unit sedang dipilih.<br>' +
            'Unit kelabu dengan tanda <i class="fa-solid fa-check" style="color:#4ADE80"></i> sudah bertindak giliran ini.</div>' +
          '<div class="lbl mt-3">PETAK</div>' +
          '<div class="text-[12px] leading-relaxed mt-1">' +
            '<b style="color:#4876FF">Biru</b> = boleh gerak · ' +
            '<b style="color:#FF3B3B">merah</b> = boleh serang · ' +
            '<b style="color:#4ADE80">hijau</b> = boleh dipulihkan (tekan butang PULIH).</div>' +
          '<div class="lbl mt-3">RUPA BUMI</div>' +
          '<div class="text-[12px] leading-relaxed mt-1">' +
            '<i class="fa-solid fa-tree" style="color:#357A45"></i> Hutan +25% DEF<br>' +
            '<i class="fa-solid fa-mountain" style="color:#9A7630"></i> Bukit +18% ATK &amp; jarak +1<br>' +
            '<i class="fa-solid fa-water" style="color:#2E7E96"></i> Air \u221215% DEF<br>' +
            '<i class="fa-solid fa-cube" style="color:#3E4A58"></i> Batu tidak boleh dipijak</div>' +
          '<div class="lbl mt-3">KELAS</div>' +
          '<div class="text-[11px] leading-relaxed mt-1">' + ROLES.map(r =>
            '<i class="fa-solid ' + r.ico + '" style="color:' + r.color + ';width:16px"></i> <b>' + r.name + '</b> — ' +
            'gerak ' + r.mov[0] + '\u2013' + r.mov[1] + ', jarak ' +
            (r.rng[0] === r.rng[1] ? r.rng[0] : r.rng[0] + '\u2013' + r.rng[1]) +
            (r.min > 1 ? ' (tidak boleh serang rapat)' : '')).join('<br>') + '</div>' });
      return;
    }
    const b = e.target.closest('[data-tg]'); if (!b || over || busy) return;
    if (aiB && turn === 'b') return;
    if (b.dataset.tg === 'heal'){
      if (!sel) return toast('Pilih Healer dahulu.', null, true);
      const me = sel, list = healAll(me);
      if (!list.length) return toast('Tiada rakan cedera dalam jarak.', null, true);
      healPick(me, list);
      return;
    }
    if (b.dataset.tg === 'wait'){
      if (!sel) return toast('Pilih unit dahulu.', null, true);
      sel.done = true; sel = null; moved = null; draw(); autoEnd(); return;
    }
    if (b.dataset.tg === 'end'){ (turn === 'a' ? alive('a') : alive('b')).forEach(u => u.done = true); endPhase(); }
  });

  fullApply();
  if (SO && !B.length){ turn = 'a'; roam = true; sel = alive('a')[0] || null; }
  draw();
  setTimeout(() => { fitBoard(); panTeam(turn, false); }, 60);
  if (!roam && aiB && turn === 'b') setTimeout(aiTurn, 700);
  if (roam) line('<span style="color:#FFD76A">Peta jelajah — tiada musuh. Bual dengan NPC, kemudian masuk pintu.</span>');
  line('<span class="text-muted">Peta dijana rawak. Hutan +25% DEF · Bukit +18% ATK &amp; jarak +1 · Air −15% DEF · Batu dinding.</span>');
  if (fair) line('<span style="color:#4ADE80">MOD ADIL — setiap unit bermula HP ' + FAIRST.hp + ' · ATK ' + FAIRST.atk +
    ' · DEF ' + FAIRST.def + ' · SPD ' + FAIRST.spd + ', sebelum pengubah kelas. Tiada kad, tiada bonus underdog.</span>');
  if (bA.length || bB.length) line('<span class="text-muted">Berkat dek: A '+bA.length+' kad · B '+bB.length+' kad.</span>');
  if (gA > 0.01 || gB > 0.01) line('<span style="color:#FFC24D">Bonus underdog: ' +
    (gA > gB ? labelA : labelB) + ' +' + Math.round(Math.max(gA,gB)*100) + '% ATK, +' +
    Math.round(Math.max(gA,gB)*130) + '% HP, +' + Math.round(Math.max(gA,gB)*70) + '% DEF.</span>');
  if (quizOn) line('<span style="color:#4ADE80">Bank soalan aktif — setiap serangan pemain perlu jawapan.</span>');
  if (aiB) line('<span class="text-muted">Pasukan B dikawal AI.</span>');
  line('<span class="text-muted">Giliran pertama: ' + (first === 'a' ? labelA : labelB) + ' (jumlah SPD ' + Math.max(sA,sB) + ' lawan ' + Math.min(sA,sB) + ').</span>');
}

/* Batalkan satu perlawanan: RP, mata, menang & kalah dipulangkan tepat seperti sebelum */
function arenaUndo(ts){
  S.arena = S.arena || { points:{}, wins:{}, losses:{}, history:[] };
  S.arena.rp = S.arena.rp || {};
  const i = (S.arena.history || []).findIndex(x => x.ts === ts);
  if (i < 0) return false;
  const x = S.arena.history[i];
  const dec = (o, k, n) => { o[k] = Math.max(0, (o[k] || 0) - n); if (!o[k]) delete o[k]; };
  (x.winIds || []).forEach(id => { dec(S.arena.points, id, 3); dec(S.arena.wins, id, 1); dec(S.arena.rp, id, x.rp || 0); });
  (x.loseIds || []).forEach(id => { dec(S.arena.points, id, 1); dec(S.arena.losses, id, 1); dec(S.arena.rp, id, 2); });
  S.arena.history.splice(i, 1);
  save(true);
  return !!(x.winIds && x.winIds.length);
}
async function arenaHistoryModal(){
  const hist = ((S.arena||{}).history) || [];
  const id = openModal({ icon:'fa-clock-rotate-left', title:'Sejarah Perlawanan',
    body:'<div class="text-[11px] text-muted mb-2">Padam perlawanan untuk memulangkan RP, mata Arena dan rekod menang/kalah kepada keadaan asal.</div>' +
      (hist.length ? hist.map(x => {
        const d = new Date(x.ts);
        const names = (x.winIds||[]).map(i => (stu(i)||{}).name).filter(Boolean).join(', ');
        return '<div class="panel clip-s p-2 mb-1 flex items-center gap-2">' +
          '<div class="flex-1 min-w-0"><div class="text-[12px] truncate">'+esc(x.a)+' vs '+esc(x.b)+'</div>' +
          '<div class="text-[10px] text-muted truncate">Menang: <span class="text-cyan">'+esc(x.win)+'</span>' +
            (x.rp ? ' · <span style="color:#FFD76A">+'+x.rp+' RP</span>' : ' · <span class="text-[#FFC24D]">rekod lama, RP tidak dipulangkan</span>') +
            ' · '+d.toLocaleDateString('ms-MY')+' '+d.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'})+'</div></div>' +
          '<button class="btn clip-s !px-2 !py-1 text-[11px]" data-undo="'+x.ts+'"><i class="fa-solid fa-rotate-left text-[#E23B3B]"></i></button></div>';
      }).join('') : '<div class="text-[12px] text-muted">Belum ada perlawanan.</div>'),
    footer:'<button class="btn clip-s flex-1" data-close="1">Tutup</button>' +
           (hist.length ? '<button class="btn btn-d clip-s flex-1" data-x="all">Padam Semua</button>' : '') });
  const bd = $('[data-modal="'+id+'"]');
  bd.addEventListener('click', async e => {
    const u = e.target.closest('[data-undo]');
    if (u){
      const ts = parseInt(u.dataset.undo, 10);
      const x = ((S.arena||{}).history||[]).find(y => y.ts === ts);
      const ok = await confirmBox({ danger:true, title:'Padam Perlawanan', okText:'Padam &amp; Pulangkan',
        message:'Padam <b>'+esc((x&&x.a)||'')+' vs '+esc((x&&x.b)||'')+'</b>?<br><br>' +
          ((x && x.winIds) ? 'RP, mata Arena dan rekod menang/kalah akan dipulangkan kepada keadaan sebelum perlawanan ini.'
                           : 'Rekod lama tanpa butiran ganjaran — hanya baris sejarah akan dibuang, RP tidak dapat dipulangkan.') });
      if (!ok) return;
      arenaUndo(ts);
      closeModal(id); arenaHistoryModal(); renderTab();
      toast('Perlawanan dipadam.');
      return;
    }
    if (!e.target.closest('[data-x="all"]')) return;
    const ok = await confirmBox({ danger:true, title:'Padam Semua Sejarah', okText:'Padam Semua',
      message:'Semua sejarah perlawanan dipadam dan <b>semua RP Arena, mata, menang &amp; kalah direset kepada sifar</b>.<br><br>Mata Rank dari skor PBD tidak terjejas. Teruskan?' });
    if (!ok) return;
    S.arena.history = []; S.arena.rp = {}; S.arena.points = {}; S.arena.wins = {}; S.arena.losses = {};
    save(true); closeModal(id); renderTab(); toast('Sejarah Arena dikosongkan.');
  });
}

/* ============ MOD CERITA ============
   Satu kempen = beberapa babak. Setiap babak = satu pertempuran taktikal
   dengan watak tetap (wira) lawan pasukan NPC, kadang-kadang ada bos.
   Cerita dijana di luar app: app keluarkan prompt yang sudah mengandungi
   soalan sebenar guru, AI pulangkan JSON, guru tampal balik.          */
const SHERO = { hp:82, atk:19, def:11, spd:14 };
const stories = () => (S.stories || []);
const storyOf = id => stories().find(p => p.id === id) || null;
function sprog(id){
  S.sprog = S.sprog || {};
  const p = S.sprog[id] = S.sprog[id] || { done:[] };
  if (!Array.isArray(p.xp)) p.xp = [0, 0, 0, 0];
  return p;
}
/* ---------- EXP WIRA ----------
   Wira yang menumpaskan lawan mengumpul EXP; setiap tahap menambah stat
   kekal yang dibawa ke babak seterusnya. Inilah ganjaran bermain baik,
   bukan sekadar bertahan sampai babak akhir.                            */
const XP_LVL  = 45;                         // EXP untuk satu tahap
const XP_CAP  = 10;                          // tahap maksimum
const XP_KILL = 12;                           // asas setiap tumpasan
const XP_BOSS = 30;                           // bonus bos
const xpLvl  = xp => Math.min(XP_CAP, 1 + Math.floor(Math.max(0, xp || 0) / XP_LVL));
const xpNext = xp => xpLvl(xp) >= XP_CAP ? 0 : (xpLvl(xp) * XP_LVL - Math.max(0, xp || 0));
/* tambahan stat daripada tahap (tahap 1 = tiada tambahan) */
const xpBonus = lvl => ({ hp:(lvl - 1) * 5, atk:(lvl - 1) * 1.2, def:(lvl - 1) * 0.8 });
const heroXp = (pid, k) => (sprog(pid).xp || [])[k] || 0;
const stDone = (p, i) => sprog(p.id).done.indexOf(i) >= 0;
const stOpenAt = p => { const d = sprog(p.id).done; let i = 0; while (i < p.babak.length && d.indexOf(i) >= 0) i++; return i; };

/* stat lawan menaik ikut babak; bos jauh lebih tebal */
function storyFoeStat(n, boss){
  let hp = 70 + n * 5, atk = 16 + n * 0.8, def = 8 + n * 0.7;
  // bos ialah kelas healer (pengubah ATK 0.75), jadi ATK asasnya ditebus
  // supaya serangannya tetap digeruni sambil dia memulihkan pengawal.
  if (boss){ hp *= 1.9; atk *= 1.70; def *= 1.2; }
  return { hp:Math.round(hp), atk:Math.round(atk), def:Math.round(def), spd:13 };
}
/* Wira menjadi lebih kuat setiap babak yang ditawan — inilah "kelebihan"
   yang disebut oleh NPC baik dalam adegan refleksi. Tanpa ini, lengkung
   musuh akan memintas pasukan menjelang babak akhir. */
function storyHeroStat(i, xp){
  const b = xpBonus(xpLvl(xp));
  return { hp: SHERO.hp + i * 6 + b.hp, atk: SHERO.atk + i * 1.5 + b.atk,
           def: SHERO.def + i * 1 + b.def, spd: SHERO.spd };
}
/* peta babak: ikut cadangan AI kalau padan, jika tidak pilih ikut saiz pasukan */
function storyMapFor(b, i, n){
  let m = null;
  /* Peta yang guru tetapkan sendiri bagi babak itu sentiasa diutamakan. */
  if (b.mapId){
    const pick = tmapOf(b.mapId);
    if (pick) m = pick;
  }
  if (!m && b.map){
    const key = String(b.map).toLowerCase().trim();
    m = tmapOf(b.map) || allMaps().find(x => String(x.name).toLowerCase() === key) || null;
  }
  if (!m){
    const si = i < 2 ? 0 : i < 4 ? 1 : 2;
    const sz = TSIZES[si];
    const list = TMAPS.filter(x => x.w === sz.w && x.h === sz.h);
    m = list[i % list.length] || TMAPS[0];
  }
  /* Peta pilihan guru menentukan bilangan pemain — tidak ditukar. */
  if (!b.mapId && m.max < n){
    const big = allMaps().filter(x => x.max >= n).sort((a, c) => a.max - c.max)[0];
    if (big) m = big;
  }
  return m;
}
/* potret: guna frame idle sprite kelas kalau ada, jika tidak ikon kelas */
/* Potret kecil untuk senarai dan dialog: frame idle watak itu. */
/* Potret: muka ekspresi "Biasa" (close-up) \u2014 bukan sprite badan penuh
   yang mengecil jadi patung kecil dalam kotak. Badan hanya dipakai jika
   watak itu belum ada muka. Saiz dinaikkan 25% (had 96 px). */
function storyFace(role, px, col){
  px = Math.min(96, Math.round(px * 1.25));
  const face = (faceFramesOr(role, 'idle') || [])[0];
  const c = charFallback(role), f = face ? null : spriteFrames(c, 'idle');
  const src = face || (f && f[0]), r = npcOf(role) || roleOf(role), cc = col || r.color;
  return '<div style="position:relative;width:' + px + 'px;height:' + px + 'px;flex-shrink:0;border:2px solid ' + cc + ';background:#0A1017;' +
    'display:flex;align-items:center;justify-content:center;overflow:hidden">' +
    (src
      ? '<div' + (face ? ' data-face="1"' : '') + ' style="position:absolute;inset:0;background-image:' + cssUrl(src) + ';' +
          'background-size:cover;background-position:' + (face ? 'center' : 'center top') + '"></div>'
      : '<i class="fa-solid ' + r.ico + '" style="font-size:' + Math.round(px * 0.42) + 'px;color:' + cc + '"></i>') +
    '</div>';
}

/* ---------- import JSON ---------- */
const SROLE = ['tank', 'healer', 'melee', 'ranged', 'mage'];
const sRole = k => SROLE.indexOf(String(k || '').toLowerCase()) >= 0 ? String(k).toLowerCase() : 'melee';
const sTxt = (v, max) => String(v === undefined || v === null ? '' : v).trim().slice(0, max || 200);

/* ---------- soalan yang DITULIS oleh AI, disimpan dalam kempen ----------
   Tiada lagi kebergantungan pada bank soalan: setiap babak membawa
   soalannya sendiri, dan setiap pilihan yang SALAH membawa ejekan +
   huraian sendiri supaya penjelasan menjawab kesilapan yang itu.        */
function sQuestions(arr, bi, cap){
  const out = [];
  (Array.isArray(arr) ? arr : []).slice(0, cap || 12).forEach((v, k) => {
    if (!v || typeof v !== 'object') return;
    const qt = sTxt(v.soalan !== undefined ? v.soalan : v.q, 300);
    const raw = Array.isArray(v.pilihan) ? v.pilihan : Array.isArray(v.c) ? v.c : [];
    const c = raw.slice(0, 4).map(x => sTxt(x, 140));
    while (c.length < 4) c.push('');
    const filled = c.filter(x => x !== '').length;
    if (!qt || filled < 2) return;
    let a = v.betul !== undefined ? v.betul : v.a;
    if (typeof a === 'string'){
      const s = a.trim();
      const li = 'ABCD'.indexOf(s.toUpperCase());
      a = li >= 0 && s.length === 1 ? li : c.findIndex(x => x.toLowerCase() === s.toLowerCase());
    }
    a = +a;
    if (!(a >= 0 && a < 4) || c[a] === '') a = 0;
    // ejekan: array selari dengan pilihan, atau objek berkunci A/B/C/D atau 0..3
    const ej = ['', '', '', ''];
    const src = v.ejek !== undefined ? v.ejek : v.taunt;
    if (Array.isArray(src)) src.slice(0, 4).forEach((t, j) => { ej[j] = sTxt(t, 600); });
    else if (src && typeof src === 'object'){
      Object.keys(src).forEach(kk => {
        const key = String(kk).trim().toUpperCase();
        const j = 'ABCD'.indexOf(key) >= 0 ? 'ABCD'.indexOf(key) : (+key >= 0 && +key < 4 ? +key : -1);
        if (j >= 0) ej[j] = sTxt(src[kk], 600);
      });
    } else if (typeof src === 'string'){
      const t = sTxt(src, 600);
      for (let j = 0; j < 4; j++) if (j !== a) ej[j] = t;
    }
    ej[a] = '';                                  // pilihan betul tiada ejekan
    const hur = sTxt(v.huraian !== undefined ? v.huraian : v.explain, 600);
    for (let j = 0; j < 4; j++){
      if (j === a || c[j] === '') continue;
      if (!ej[j]) ej[j] = hur || ('Jawapan betul ialah {a}.');
      if (ej[j].indexOf('{a}') < 0) ej[j] = 'Jawapannya {a}. ' + ej[j];
    }
    out.push({ id:'sq' + bi + '_' + k, q:qt, c, a, ejek:ej,
      huraian: hur ? (hur.indexOf('{a}') < 0 ? 'Jawapannya {a}. ' + hur : hur) : 'Jawapan betul ialah {a}.' });
  });
  return out;
}

function storyParse(raw, sj, chap, info){
  let t = String(raw || '').trim();
  t = t.replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Tiada JSON dijumpai dalam teks yang ditampal.');
  let o;
  try { o = JSON.parse(t.slice(a, b + 1)); }
  catch (e){ throw new Error('JSON tidak sah — ' + e.message); }
  if (!o || !Array.isArray(o.babak) || !o.babak.length) throw new Error('Tiada senarai "babak" dalam JSON.');
  /* Soalan kini ditulis oleh AI di dalam JSON itu sendiri. Bank soalan guru
     hanya digunakan sebagai sandaran untuk kempen format lama.           */
  const bank = qBank(sj, chap);
  const embedded = o.babak.some(b => b && Array.isArray(b.soalan) &&
    b.soalan.some(q => q && typeof q === 'object' && (q.soalan || q.q) && (q.pilihan || q.c)));
  if (!embedded && !bank.length)
    throw new Error('JSON tidak mengandungi soalan (medan "soalan" dengan "pilihan" dan "betul"), ' +
      'dan bank soalan subjek ini juga kosong. Jana prompt baharu di Langkah 1 dan tampal semula hasilnya.');

  const heroes = (Array.isArray(o.wira) ? o.wira : []).slice(0, 4)
    .map(w => ({ name: sTxt(w && w.nama, 30) || 'Wira', role: sRole(w && w.kelas), title: sTxt(w && w.gelaran, 40) }))
    .filter(w => w.name);
  while (heroes.length < 3) heroes.push({ name:'Wira ' + (heroes.length + 1), role: SROLE[heroes.length % 5], title:'' });

  const babak = o.babak.slice(0, 8).map((b, i) => {
    b = b || {};
    // Bos akhir sentiasa jenis PEMULIH: dia menyerang dari jarak sederhana
    // dan memulihkan pengawalnya, jadi pemain mesti fokus kepadanya.
    const boss = b.bos ? { name: sTxt(b.bos.nama, 30) || 'Bos', role:'healer', title: sTxt(b.bos.gelaran, 40) } : null;
    let foes = (Array.isArray(b.lawan) ? b.lawan : []).slice(0, boss ? 3 : 4)
      .map(f => ({ name: sTxt(f && f.nama, 30) || 'Musuh', role: sRole(f && f.kelas) }));
    if (!foes.length && !boss) foes = [{ name:'Musuh', role:'melee' }];
    const ally = b.sekutu && sTxt(b.sekutu.nama, 30)
      ? { name: sTxt(b.sekutu.nama, 30), role:'nally', line: sTxt(b.sekutu.ucapan, 300) } : null;
    const reflect = sTxt(b.refleksi, 700);
    const d = b.dialog || {};
    const fix = (v, fb, need) => { let s = sTxt(v, 240) || fb; if (need && s.indexOf('{a}') < 0) s += ' Jawapannya {a}.'; return s; };
    const taunt = {};
    const own = sQuestions(b.soalan, i);          // soalan ditulis oleh AI
    let qi = [];
    if (!own.length){                             // sandaran format lama: rujuk bank ikut nombor
      qi = (Array.isArray(b.soalan) ? b.soalan : []).map(v => {
        const no = (v && typeof v === 'object') ? +v.no : +v;
        const q = bank[(no || 0) - 1];
        if (!q) return null;
        if (v && typeof v === 'object' && v.ejek){
          let t = sTxt(v.ejek, 600);
          if (t.indexOf('{a}') < 0) t = 'Jawapannya {a}. ' + t;
          taunt[q.id] = t;
        }
        return q;
      }).filter(Boolean);
    }
    return {
      title: sTxt(b.tajuk, 60) || ('Babak ' + (i + 1)),
      place: sTxt(b.lokasi, 60),
      map: sTxt(b.peta, 60),
      story: sTxt(b.cerita, 600),
      ally, foes, boss,
      dlg: {
        pre:   fix(d.pre,   'Tunjuk apa kau belajar.'),
        right: fix(d.right, 'Betul! Tapi ini belum selesai.'),
        fast:  fix(d.fast,  'Pantas juga kau!'),
        wrong: fix(d.wrong, 'Silap! Jawapannya {a}.', true),
        slow:  fix(d.slow,  'Masa habis — {a}!', true),
        win:   sTxt(d.win,  240) || 'Jalan di hadapan terbuka.',
        lose:  sTxt(d.lose, 240) || 'Kembalilah bila kau sudah bersedia.'
      },
      qs: own,
      qids: own.length ? [] : (qi.length ? qi : bank.slice(0, 6)).map(q => q.id),
      taunt, reflect
    };
  });

  const allyName = sTxt(o.sekutu && o.sekutu.nama, 30) ||
    (babak.map(b => b.ally && b.ally.name).find(Boolean) || 'Sahabat');
  babak.forEach(b => { if (b.ally) b.ally.name = allyName; });
  return {
    id: uid('st'), ts: Date.now(),
    ally: { name: allyName, role:'nally', desc: sTxt(o.sekutu && o.sekutu.huraian, 300) },
    title: sTxt(o.tajuk, 60) || 'Kempen Tanpa Nama',
    sj, chap: chap || '', info: sTxt(info, 120),
    sjName: (S.subjects.find(x => x.id === sj) || {}).name || '',
    intro: sTxt(o.mukadimah, 600),
    outro: sTxt(o.penutup, 600),
    heroes, babak
  };
}

/* kekalkan apa yang guru taip di Langkah 1 walaupun tab dilukis semula */
function stKeep(){
  const o = S.ui.arena = S.ui.arena || {};
  const i = $('#stInfo'), n = $('#stNbab');
  if (i) o.stInfo = String(i.value || '').trim().slice(0, 120);
  if (n) o.stNbab = clamp(+n.value || 5, 3, 8);
  save();
}
function storyImport(){
  const sj = S.ui.activeSubjectId;
  const chap = (S.ui.arena || {}).stChap || '';
  const info = (S.ui.arena || {}).stInfo || '';
  const id = openModal({ icon:'fa-file-import', title:'Bina Kempen daripada JSON',
    body:'<div class="text-[11px] text-muted leading-relaxed">Tampal JSON penuh yang dipulangkan oleh AI. Soalan, pilihan jawapan dan ' +
        'huraian setiap jawapan salah akan disimpan di dalam kempen ini.</div>' +
      '<textarea id="stJson" class="fld clip-s mt-2 num text-[11px]" rows="10" placeholder="{ &quot;tajuk&quot;: ... }"></textarea>' +
      '<div id="stErr" class="text-[11px] mt-1" style="color:#E23B3B"></div>',
    footer:'<button class="btn clip-s flex-1" data-close="1">Batal</button>' +
           '<button class="btn btn-o clip-s flex-1" data-sj="go"><i class="fa-solid fa-check"></i> Import</button>' });
  const bd = $('[data-modal="' + id + '"]');
  bd.addEventListener('click', e => {
    if (!e.target.closest('[data-sj="go"]')) return;
    const err = $('#stErr', bd);
    try {
      const p = storyParse(($('#stJson', bd) || {}).value, sj, chap, info);
      S.stories = stories().concat([p]);
      save(true); closeModal(id); renderTab();
      const nq = p.babak.reduce((a, b) => a + ((b.qs && b.qs.length) || (b.qids || []).length), 0);
      toast('Kempen "' + p.title + '" dibina · ' + p.babak.length + ' babak · ' + nq + ' soalan');
      setTimeout(() => storyOpen(p.id), 320);          // terus ke senarai babak untuk pilih peta
    } catch (ex){ if (err) err.textContent = ex.message; }
  });
}

async function storyDel(pid){
  const p = storyOf(pid); if (!p) return;
  const ok = await confirmBox({ danger:true, title:'Padam Kempen', okText:'Padam',
    message:'Padam kempen <b>' + esc(p.title) + '</b> dan kemajuannya? Bank soalan tidak terjejas.' });
  if (!ok) return;
  S.stories = stories().filter(x => x.id !== pid);
  if (S.sprog) delete S.sprog[pid];
  save(true); closeTop(); renderTab(); toast('Kempen dipadam.');
}

function storyMapPick(pid, i){
  const p = storyOf(pid); if (!p) return;

  const need = Math.max(p.heroes.length, b.foes.length + (b.boss ? 1 : 0));

  const row = (m, on) => {

  };
  const id = openModal({ icon:'fa-map-location-dot', title:'Peta Babak ' + (i + 1),
    body:'<div class="text-[11px] text-muted leading-snug">' + esc(b.title) +
        (b.place ? ' · ' + esc(b.place) : '') + ' · memerlukan peta untuk sekurang-kurangnya <b>' + need + '</b> unit sepihak.</div>' +
      '<button class="btn clip-s w-full mb-1 mt-2 flex items-center gap-2 !py-2 text-left" data-sm=""' +
        (b.mapId ? '' : ' style="border-color:#FFD76A;background:#FFD76A14"') + '>' +
        '<i class="fa-solid ' + (b.mapId ? 'fa-wand-magic-sparkles' : 'fa-circle-check') + '" style="color:' + (b.mapId ? '#7E93A8' : '#FFD76A') + ';width:16px"></i>' +
        '<div class="flex-1 min-w-0"><div class="text-[12px] font-bold">Pilih sendiri (automatik)</div>' +
          '<div class="num text-[9px] text-muted truncate">app guna <b>' + esc(auto.name) + '</b> untuk babak ini</div></div></button>' +
      '<div class="lbl mt-3">PETA SAYA</div>' +
      (umaps().length ? umaps().map(m => row(m, b.mapId === m.id)).join('')
        : '<div class="text-[11px] text-muted">Belum ada peta sendiri — cipta di tab Pertempuran Taktikal.</div>') +
      '<div class="lbl mt-3">PETA TERSEDIA</div>' +
      TMAPS.map(m => row(m, b.mapId === m.id)).join('') });
  const bd = $('[data-modal="' + id + '"]');
  bd.addEventListener('click', e => {
    const t = e.target.closest('[data-sm]'); if (!t || t.disabled) return;
    const pick = t.dataset.sm || '';
    const st = storyOf(pid); if (!st) return;
    st.babak[i].mapId = pick;
    save(true); closeModal(id);
    setTimeout(() => storyOpen(pid), 150);
    toast(pick ? 'Babak ' + (i + 1) + ' guna peta ' + ((tmapOf(pick) || {}).name || '') : 'Babak ' + (i + 1) + ' kembali ke peta automatik.');
  });

/* ---------- NPC BAIK: BANTUAN DALAM PERTEMPURAN ----------
   Sekutu yang terkurung itu bukan sekadar hiasan cerita. Wira yang
   berjalan rapat dengannya boleh bertanya, dan dia menerangkan isi
   pelajaran babak itu — jadi pelajar yang mahu belajar dahulu ada
   jalan untuk berbuat demikian, tanpa diberi jawapan secara terus.   */
const babHelp = b => {
  const x = (b && b.help) || {};
  const tp = (Array.isArray(x.topics) ? x.topics : []).map(t => ({
    topik: sTxt(t && t.topik, 60) || 'Bantuan',
    dialog: (Array.isArray(t && t.dialog) ? t.dialog : []).slice(0, 12).map(d => ({
      w: (String((d && d.sapa) || (d && d.w) || 'sekutu').toLowerCase().indexOf('wira') === 0) ? 'wira' : 'sekutu',
      s: sTxt((d && d.kata) !== undefined ? d.kata : (d && d.s), 400)
    })).filter(d => d.s)
  })).filter(t => t.dialog.length);
  return { on: !!x.on && tp.length > 0, topics: tp };
};
const helpReady = b => babHelp(b).topics.length > 0;

function helpPrompt(p, b, i){

    : (b.qids || []).map(q => (S.quiz || []).find(x => x.id === q)).filter(Boolean);

    (k + 1) + '. ' + q.q + '\n   Jawapan betul: ' + (q.c[q.a] || '') +
    (q.huraian ? '\n   Huraian: ' + String(q.huraian).replace(/\{a\}/g, q.c[q.a] || '') : ''));
  return [
    'Anda menulis dialog bantuan untuk sebuah permainan taktikal sekolah di Malaysia. Semuanya dalam Bahasa Melayu.',

      'seorang sekutu bernama ' + ((p.ally && p.ally.name) || 'Sahabat') + ' ditahan pihak bos di ' +
      'tengah medan. Wira yang berjalan rapat dengannya boleh berhenti dan bertanya. Sekutu itu berbisik mengajar ' +
      'mereka sebelum mereka berdepan musuh.',

    'SOALAN YANG AKAN DITANYA OLEH MUSUH DALAM BABAK INI:',

    '',
    'TUGAS: tulis ' + Math.max(3, Math.min(6, Math.ceil(Math.max(1, qs.length) / 2))) + ' topik bantuan. ' +
      'Setiap topik ialah satu perbualan pendek antara WIRA dan SEKUTU, 4 hingga 6 giliran, bermula dengan WIRA bertanya.',
    '',
    'PERATURAN PALING PENTING — JANGAN BERI JAWAPAN SECARA TERUS:',
    'Sekutu MENGAJAR KONSEPNYA, bukan membaca jawapan. Dia boleh menerangkan sebab, memberi contoh harian, ' +
      'menunjukkan cara membezakan dua perkara yang mudah dikelirukan, atau memberi cara mengingat. ' +
      'Dia TIDAK boleh menyebut "jawapannya ialah ..." atau menyalin pilihan jawapan bulat-bulat. ' +

    'b. Ayat pendek dan mudah — pelajar membacanya sambil bermain, satu ketikan satu ayat.',
    'c. Sekutu bercakap dengan hangat dan menggalakkan; dia bercakap perlahan kerana pengawal berdekatan.',
    'd. Wira bertanya soalan yang sebenar-benarnya ditanya oleh pelajar, bukan soalan pura-pura.',

    '    {',
    '      "topik": "nama pendek idea ini",',
    '      "dialog": [',
    '        { "sapa": "wira",   "kata": "soalan wira" },',
    '        { "sapa": "sekutu", "kata": "penjelasan sekutu" },',

function helpParse(raw){
  let t = String(raw || '').trim();
  t = t.replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Tiada JSON dijumpai dalam teks yang ditampal.');
  let o;
  try { o = JSON.parse(t.slice(a, b + 1)); }
  catch (e){ throw new Error('JSON tidak sah — ' + e.message); }
  const arr = Array.isArray(o) ? o : Array.isArray(o.bantuan) ? o.bantuan : null;
  if (!arr || !arr.length) throw new Error('Tiada senarai "bantuan" dalam JSON itu.');
  const got = babHelp({ help:{ on:1, topics:arr } });
  if (!got.topics.length) throw new Error('Tiada topik sah. Setiap topik perlu "topik" dan "dialog".');
  return got.topics;
}

/* Tetapan bantuan bagi satu babak: hidup/mati + jana prompt + tampal hasil. */

      '<div class="panel clip-s p-2 mt-2 flex items-center gap-2">' +
        storyFace('nally', 42, '#4ADE80') +
        '<div class="flex-1 min-w-0"><div class="text-[12px] font-bold" style="color:#4ADE80">' +
          esc((p.ally && p.ally.name) || 'Sahabat') + '</div>' +
          '<div class="num text-[10px]" id="hsStat" style="color:' + (cur.topics.length ? '#4ADE80' : '#7E93A8') + '">' +
            (cur.topics.length ? cur.topics.length + ' topik bantuan sedia' : 'belum ada dialog bantuan') + '</div></div>' +
        '<button class="btn clip-s !px-3 !py-2 text-[11px]' + (cur.on ? ' btn-o' : '') + '" data-hs="on"' +
          (cur.topics.length ? '' : ' disabled') + '>' + (cur.on ? 'HIDUP' : 'MATI') + '</button>' +
      '</div>' +
      '<div class="panel clip-s p-2 mt-2" style="border-color:#FF6B00">' +
        '<div class="text-[12px] font-bold text-orange"><span class="num">LANGKAH 1</span> · JANA PROMPT</div>' +
        '<div class="text-[10px] text-muted leading-snug mt-1">Prompt dibina daripada <b>' + nq + ' soalan</b> babak ini, ' +
          'jadi bantuannya betul-betul berkaitan apa yang musuh akan tanya.</div>' +
        '<button class="btn btn-o clip-s w-full mt-2 !py-2 text-[13px]" data-hs="copy">' +
          '<i class="fa-solid fa-clipboard"></i> SALIN PROMPT</button>' +
      '</div>' +
      '<div class="panel clip-s p-2 mt-2" style="border-color:#00F0FF">' +
        '<div class="text-[12px] font-bold text-cyan"><span class="num">LANGKAH 2</span> · TAMPAL HASIL</div>' +
        '<textarea id="hsJson" rows="7" class="fld clip-s num !text-[11px] mt-2" placeholder=\'{ "bantuan": [ ... ] }\'></textarea>' +
        '<div id="hsMsg" class="text-[11px] text-muted mt-1">Menunggu JSON…</div>' +
      '</div>' +
      (cur.topics.length
        ? '<div class="lbl mt-3">TOPIK SEDIA ADA</div>' +
          cur.topics.map(t => '<div class="panel clip-s p-2 mb-1">' +
            '<div class="text-[11px] font-bold" style="color:#4ADE80">' + esc(t.topik) + '</div>' +
            '<div class="text-[10px] text-muted leading-snug mt-0.5">' + t.dialog.length + ' giliran · ' +
              esc(t.dialog[0].s.slice(0, 70)) + '…</div></div>').join('') +
          '<button class="btn btn-d clip-s w-full mt-1 text-[12px]" data-hs="del"><i class="fa-solid fa-trash"></i> Padam Dialog Bantuan</button>'
        : ''),
    footer:'<button class="btn clip-s flex-1" data-close="1">Tutup</button>' +
           '<button class="btn btn-o clip-s flex-1" data-hs="go"><i class="fa-solid fa-check"></i> SIMPAN DIALOG</button>' });
  const bd = $('[data-modal="' + id + '"]');
  const reopen = () => { closeModal(id); closeTop(); storyOpen(pid); helpSetup(pid, i); };
  bd.addEventListener('input', () => {
    const m = $('#hsMsg', bd), v = ($('#hsJson', bd) || {}).value || '';
    if (!m) return;
    if (!v.trim()){ m.className = 'text-[11px] text-muted mt-1'; m.textContent = 'Menunggu JSON…'; return; }
    try {
      const t = helpParse(v);
      m.className = 'text-[11px] text-[#4ADE80] mt-1';

    if (k === 'del'){

      save(true); reopen(); return;
    }
    if (k === 'go'){
      let tp;
      try { tp = helpParse(($('#hsJson', bd) || {}).value); }
      catch (err){ return toast(err.message || 'JSON tidak sah.', null, true); }
      b.help = { on:1, topics:tp };

      closeModal(id); closeTop(); storyOpen(pid);
      toast(tp.length + ' topik bantuan disimpan · NPC bantuan dihidupkan');
    }
  });
  return id;
}

/* ---------- senarai babak ---------- */
function storyOpen(pid){
  const p = storyOf(pid); if (!p) return;
  const at = stOpenAt(p);
  const rows = p.babak.map((b, i) => {
    const done = stDone(p, i), lock = i > at;
    const col = done ? '#4ADE80' : lock ? '#3E4A58' : '#FFD76A';

    const huraian = (b.qs || []).some(q => (q.ejek || []).some(Boolean)) || Object.keys(b.taunt || {}).length;
    const need = Math.max(p.heroes.length, foes);
    const mp = b.mapId ? tmapOf(b.mapId) : null;
    const mnm = mp ? mp.name : (storyMapFor(Object.assign({}, b, { mapId:'' }), i, need).name + ' (auto)');

    return '<div class="flex items-stretch gap-1 mb-1">' +

          '<div class="num text-[9px] text-muted truncate">' + esc(b.place || '') + ' · ' + foes + ' lawan' +
          (b.boss ? ' · <span style="color:#FF6B00">BOS PEMULIH</span>' : '') + ' · ' + nq + ' soalan' +
          (huraian ? ' · <span style="color:#FFC24D">ada huraian</span>' : '') + '</div>' +
          '<div class="num text-[9px] truncate" style="color:' + (mp ? '#00F0FF' : '#7E93A8') + '">' +

/* ---------- babak: adegan dialog sebelum bertempur ---------- */
function storyScene(pid, i){
  const p = storyOf(pid); if (!p) return;
  const b = p.babak[i]; if (!b) return;
  const villain = b.boss || b.foes[0] || { name:'Musuh', role:'melee' };
  const steps = [];
  if (b.story) steps.push({ k:'narr', text:b.story });
  if (b.ally && b.ally.line) steps.push({ k:'ally', name:b.ally.name, role:b.ally.role, text:b.ally.line });
  steps.push({ k:'foe', name:villain.name, role:villain.role, text:b.dlg.pre, boss:!!b.boss });
  let s = 0;
  const id = openModal({ icon:'fa-scroll', title:'Babak ' + (i + 1) + ' · ' + b.title,
    body:'<div class="num text-[10px] text-orange">' + esc(b.place || '') + '</div>' +
      '<div id="stBox" class="panel clip-s p-3 mt-2" style="min-height:150px"></div>' +
      '<div class="lbl mt-3">LAWAN BABAK INI</div>' +
      '<div class="flex gap-1 mt-1" style="overflow-x:auto">' +
        b.foes.map(f => '<div class="panel clip-s p-1 text-center" style="min-width:64px">' + storyFace(npcCharFor(f.role), 34, '#FF6B00') +
          '<div class="num text-[8px]" style="color:' + roleOf(f.role).color + '">' + roleOf(f.role).short + '</div>' +
          '<div class="text-[9px] truncate">' + esc(f.name) + '</div></div>').join('') +
        (b.boss ? '<div class="panel clip-s p-1 text-center" style="min-width:72px;border-color:#FF6B00">' +
          storyFace('nbos', 34, '#FF6B00') +
          '<div class="num text-[8px]" style="color:#FF6B00">BOS PEMULIH</div>' +
          '<div class="text-[9px] truncate">' + esc(b.boss.name) + '</div></div>' : '') +
      '</div>' +
      '<div data-hint="Maklumat babak">' +
      (function(){
        const st = p.heroes.map((w, k) => storyHeroStat(i, heroXp(p.id, k)));
        const av = f => Math.round(st.reduce((a, s) => a + f(s), 0) / Math.max(1, st.length));
        const lv = p.heroes.map((w, k) => xpLvl(heroXp(p.id, k)));
        const hiLv = Math.max.apply(null, lv.concat([1]));
        return '<div class="num text-[10px] mt-2" style="color:#7DD3FC">Pasukan wira babak ini: HP ' + av(s => s.hp) +
          ' · ATK ' + av(s => s.atk) + ' · DEF ' + av(s => s.def) +
          (i ? ' (naik daripada babak sebelum)' : '') + '</div>' +
          (hiLv > 1 ? '<div class="num text-[10px] mt-0.5" style="color:#A78BFA">EXP terkumpul: tahap ' +
            lv.join(' / ') + ' — stat tambahan sudah dimasukkan</div>' : '');
      })() +
      '<div class="num text-[10px] text-muted mt-1">' + ((b.qs && b.qs.length) || (b.qids || []).length) + ' soalan babak ini · ditanya ikut urutan' +
        (b.boss ? ' · setiap jawapan salah menguatkan bos' : '') + '</div>' +
      (b.boss ? '<div class="text-[10px] leading-snug mt-1" style="color:#FF8A3D">' +
        '<i class="fa-solid fa-kit-medical"></i> Bos ini jenis <b>pemulih</b> — dia menyerang dan memulihkan pengawalnya. Jatuhkan dia dahulu.</div>' : '') +
      (((b.qs || []).some(q => (q.ejek || []).some(Boolean)) || Object.keys(b.taunt || {}).length)
        ? '<div class="text-[10px] leading-snug mt-1" style="color:#FFC24D">' +
          'Setiap pilihan yang salah ada ejekan + huraiannya sendiri — pelajar tahu kenapa pilihan DIA itu silap.</div>' : '') +
      '<div class="text-[10px] leading-snug mt-1" style="color:#4ADE80">' +
        '<i class="fa-solid fa-bolt"></i> Makin cepat jawapan betul, makin tinggi kuasa serangan (sampai ' +
        Math.round((1 + QUIZ_PWR) * 100) + '%). Menumpaskan lawan memberi EXP.</div>' +
      '</div>' +
      '<button id="stGo" class="btn btn-o clip-s w-full mt-3 !py-2 text-[13px]" data-sg="1"></button>' });
  const bd = $('[data-modal="' + id + '"]');
  const paint = () => {
    const st = steps[s], box = $('#stBox', bd), go = $('#stGo', bd);
    if (!box || !go) return;
    const col = st.k === 'foe' ? '#FF6B00' : st.k === 'ally' ? '#4ADE80' : '#7E93A8';
    box.innerHTML = st.k === 'narr'
      ? '<div class="text-[13px] leading-relaxed" style="color:#C7D4E2">' + esc(st.text) + '</div>'
      : '<div class="flex items-start gap-2">' + storyFace(st.role, 54, col) +
        '<div class="flex-1 min-w-0"><div class="text-[12px] font-bold" style="color:' + col + '">' + esc(st.name) +
          (st.boss ? ' <span class="num text-[8px]">BOS</span>' : '') + '</div>' +
        '<div class="text-[13px] leading-relaxed mt-1">' + esc(st.text) + '</div></div></div>';
    box.style.opacity = '0';
    requestAnimationFrame(() => { box.style.transition = 'opacity .25s ease'; box.style.opacity = '1'; });
    const last = s >= steps.length - 1;
    const mp0 = storyMapFor(b, i, Math.max(p.heroes.length, b.foes.length + (b.boss ? 1 : 0)));
    const roamOnly = isUmap(mp0.id) && hasSpawn(mp0) && !mapSpawn(mp0).b.length;
    go.innerHTML = last ? (roamOnly ? '<i class="fa-solid fa-compass"></i> MASUK PETA' : '<i class="fa-solid fa-khanda"></i> MULA PERTEMPURAN')
                        : 'SETERUSNYA <i class="fa-solid fa-chevron-right"></i>';
    go.className = 'btn clip-s w-full mt-3 !py-2 text-[13px]' + (last ? ' btn-o' : '');
  };
  paint();
  bd.addEventListener('click', async e => {
    if (!e.target.closest('[data-sg]')) return;
    if (s < steps.length - 1){ s++; paint(); return; }
    closeModal(id);
    await storyFight(pid, i);
  });
}

/* ---------- jalankan pertempuran babak ---------- */
async function storyFight(pid, i){
  const p = storyOf(pid); if (!p) return;
  const b = p.babak[i]; if (!b) return;
  vstClear();
  const map = storyMapFor(b, i, Math.max(p.heroes.length, b.foes.length + (b.boss ? 1 : 0)));
  /* Bilangan pemain ditentukan oleh PETA, bukan oleh kempen. */
  const nHero = Math.max(1, Math.min(p.heroes.length, mapUnits(map)));
  const heroes = p.heroes.slice(0, nHero).map((w, k) => {
    const hs = storyHeroStat(i, heroXp(p.id, k));      // stat naik ikut babak DAN EXP terkumpul
    return vstReg(Object.assign({ id:'sh' + k, name:w.name, role:w.role,
      cls:p.title, job:'WIRA · TAHAP ' + xpLvl(heroXp(p.id, k)) },
      { hp:Math.round(hs.hp), atk:Math.round(hs.atk), def:Math.round(hs.def), spd:hs.spd }));
  });
  /* Musuh: peta ciptaan guru yang ada penempatan menentukan berapa dan jenis
     musuh (0 = peta jelajah). Nama diambil daripada kempen ikut jenis. */
  let foeSrc;
  const msp = isUmap(map.id) && hasSpawn(map) ? mapSpawn(map) : null;
  if (msp){
    const pool = b.foes.slice();
    foeSrc = msp.b.map((c, k) => {
      if (c[2] === 'nbos') return { name:(b.boss && b.boss.name) || 'Bos', role:(b.boss && b.boss.role) || 'healer', boss:true, char:'nbos' };
      const j = pool.findIndex(f => npcCharFor(f.role) === c[2]);
      const f = j >= 0 ? pool.splice(j, 1)[0] : null;
      const role = f ? f.role : ({ npcm:'melee', npcr:'ranged', npcg:'mage' }[c[2]] || 'melee');
      return { name: f ? f.name : spawnNpcOf(c[2]).short + ' ' + (k + 1), role, boss:false, char:c[2] };
    });
  } else {
    foeSrc = b.foes.map(f => ({ name:f.name, role:f.role, boss:false, char:npcCharFor(f.role) }))
      .concat(b.boss ? [{ name:b.boss.name, role:b.boss.role, boss:true, char:'nbos' }] : []);
  }
  const foes = foeSrc.map((f, k) => vstReg(Object.assign({ id:'sn' + k, name:f.name, role:f.role,
    char:f.char, wide:!!f.wide, cls:b.title, job:f.boss ? 'BOS' : 'MUSUH', npc:true, boss:f.boss },
    storyFoeStat(i + 1, f.boss))));
  const bi = foeSrc.findIndex(f => f.boss);
  const bossSid = bi >= 0 ? foes[bi] : '';
  const qs = (b.qs && b.qs.length)
    ? b.qs.slice()
    : (b.qids || []).map(q => (S.quiz || []).find(x => x.id === q)).filter(Boolean);
  const npcIds = hasSpawn(map) ? mapSpawn(map).n.map(c => c[2]) : [];
  await ensureSprites(heroes.concat(foes).map(charOf).concat(npcIds));
  const helpData = babHelp(b);
  const markDone = () => { const pr = sprog(p.id); if (pr.done.indexOf(i) < 0) pr.done.push(i); save(true); };
  runTactical(heroes, foes, true, '', map.id, {
    map,
    help: helpData.on ? { name:(p.ally && p.ally.name) || 'Sahabat', topics:helpData.topics } : null,
    story: {
      n: i + 1,
      labelA: 'WIRA',
      labelB: (b.boss ? b.boss.name : b.title).toUpperCase().slice(0, 22),
      qs, dlg: b.dlg, taunt: b.taunt || null, bossSid,
      winTxt: b.dlg.win, loseTxt: b.dlg.lose,
      /* EXP: hanya wira (sid 'sh<k>') mengumpul; musuh tidak. */
      onKill: (killer, fallen) => {
        const m = /^sh(\d+)$/.exec(String(killer && killer.sid || ''));
        if (!m) return null;
        const k = +m[1];
        if (!(k >= 0 && k < p.heroes.length)) return null;
        const pr = sprog(p.id);
        const before = xpLvl(pr.xp[k] || 0);
        const xp = XP_KILL + (i + 1) * 2 + (fallen && fallen.boss ? XP_BOSS : 0);
        pr.xp[k] = (pr.xp[k] || 0) + xp;
        const after = xpLvl(pr.xp[k]);
        save(true);
        return { xp, lvl: after > before ? after : 0 };
      },
      /* Musuh tumpas: kemajuan disimpan serta-merta, walaupun pemain
         belum sampai ke pintu. */
      onWin: markDone,
      /* 'door' = masuk pintu · 'win' = peta tanpa pintu · 'retry' = cuba lagi */
      onEnd: r => {
        if (r === 'win' || r === 'door') markDone();
        setTimeout(() => {
          vstClear();
          if (S.ui.tab === 'arena') renderTab();
          if (r === 'win' || r === 'door') setTimeout(() => storyReflect(pid, i), 200);
          if (r === 'retry') setTimeout(() => storyFight(pid, i), 200);
        }, r === 'door' ? 120 : 300);
      }
    }
  });
}

/* ---------- adegan refleksi: NPC baik mengucap tahniah & merumus ----------
   Dipaparkan selepas babak dimenangi, sebelum babak seterusnya dibuka.
   Inilah tempat pelajar diberitahu apa yang mereka sebenarnya kuasai. */
function storyReflect(pid, i){
  const p = storyOf(pid); if (!p) return;
  const b = p.babak[i]; if (!b) return;
  const nm = (p.ally && p.ally.name) || (b.ally && b.ally.name) || 'Sahabat';
  const last = i >= p.babak.length - 1;
  /* Sekutu kekal dikurung sepanjang kempen; hanya babak terakhir
     (bos pemulih tumpas) membebaskannya. */
  const freed = last;
  const txt = b.reflect || ('Syabas! Kamu sudah menguasai isi ' + (b.title || 'babak ini') + '. Teruskan ke babak seterusnya.');
  const id = openModal({ icon:'fa-hands-clapping', title:'Babak ' + (i + 1) + ' Selesai',
    body:'<div class="panel clip-s p-3" style="border-color:#4ADE80">' +
        '<div class="flex items-start gap-3">' + storyFace('nally', 84, '#4ADE80') +
          '<div class="flex-1 min-w-0">' +
            '<div class="text-[12px] font-bold" style="color:#4ADE80">' + esc(nm) +
              (freed ? ' <span class="num text-[8px]" style="color:#FFD76A">DIBEBASKAN</span>' : '') + '</div>' +
            '<div class="text-[13px] leading-relaxed mt-1">' + esc(txt) + '</div>' +
          '</div></div></div>' +
      (freed
        ? '<div class="text-[11px] leading-snug mt-2" style="color:#FFD76A">' +
            '<i class="fa-solid fa-unlock"></i> Belenggu itu akhirnya terlerai — ' + esc(nm) + ' bebas.</div>'
        : '<div class="text-[11px] leading-snug mt-2" style="color:#9AA7B4">' +
            '<i class="fa-solid fa-lock"></i> ' + esc(nm) + ' masih ditawan pihak bos. ' +
            'Tumpaskan bos pemulih pada babak terakhir untuk membebaskannya.</div>') +
      (function(){
        const lv = p.heroes.map((w, k) => xpLvl(heroXp(p.id, k)));
        if (!lv.some(v => v > 1)) return '';
        return '<div class="lbl mt-3">EXP PASUKAN</div>' +
          '<div class="panel clip-s p-2 mt-1">' + p.heroes.map((w, k) => {
            const xp = heroXp(p.id, k), l = xpLvl(xp), bn = xpBonus(l);
            return '<div class="flex items-center gap-2 py-0.5">' +
              '<div class="text-[11px] flex-1 min-w-0 truncate">' + esc(w.name) + '</div>' +
              '<div class="num text-[10px]" style="color:#A78BFA">TAHAP ' + l + '</div>' +
              '<div class="num text-[9px] text-muted" style="width:54px;text-align:right">' + xp + ' EXP</div>' +
              '<div class="num text-[9px]" style="color:' + (l > 1 ? '#4ADE80' : '#7E93A8') + ';width:78px;text-align:right">' +
                (l > 1 ? '+' + bn.hp + ' HP +' + bn.atk.toFixed(1) + ' ATK' : 'belum naik') + '</div></div>';
          }).join('') + '</div>';
      })() +
      (i + 1 < p.babak.length ? (function(){
        const a = storyHeroStat(i), b2 = storyHeroStat(i + 1);
        return '<div class="lbl mt-3">KELEBIHAN UNTUK BABAK SETERUSNYA</div>' +
          '<div class="panel clip-s p-2 mt-1 grid grid-cols-3 gap-2 text-center">' +
          [['HP', a.hp, b2.hp], ['ATK', a.atk, b2.atk], ['DEF', a.def, b2.def]].map(r =>
            '<div><div class="num text-[9px] text-muted">' + r[0] + '</div>' +
            '<div class="num text-[13px]"><span class="text-muted">' + Math.round(r[1]) + '</span> ' +
            '<i class="fa-solid fa-arrow-right text-[9px] text-muted"></i> ' +
            '<b style="color:#4ADE80">' + Math.round(r[2]) + '</b></div></div>').join('') + '</div>';
      })() : '') +
      '<div class="lbl mt-3">APA YANG KAMU KUASAI</div>' +
      '<div class="panel clip-s p-2 mt-1">' + (b.qids || []).slice(0, 8).map(qid => {
        const q = (S.quiz || []).find(x => x.id === qid);
        if (!q) return '';
        return '<div class="flex items-start gap-2 py-1" style="border-top:1px solid var(--line)">' +
          '<i class="fa-solid fa-circle-check text-[10px] mt-0.5" style="color:#4ADE80"></i>' +
          '<div class="flex-1 min-w-0"><div class="text-[11px] leading-snug">' + esc(q.q) + '</div>' +
          '<div class="num text-[10px]" style="color:#7DD3FC">' + esc(q.c[q.a] || '') + '</div></div></div>';
      }).join('') + '</div>' +
      (last ? '<div class="panel clip-s p-2 mt-3 text-[12px] leading-relaxed" style="border-color:#FFD76A">' +
        '<b style="color:#FFD76A">Kempen tamat.</b> ' + esc(p.outro) + '</div>' : '') +
      '<button class="btn btn-o clip-s w-full mt-3 !py-2 text-[13px]" data-sr="1">' +
        (last ? '<i class="fa-solid fa-flag-checkered"></i> TAMAT KEMPEN' : '<i class="fa-solid fa-forward"></i> BABAK SETERUSNYA') + '</button>' });
  const bd = $('[data-modal="' + id + '"]');
  bd.addEventListener('click', e => {
    if (!e.target.closest('[data-sr]')) return;
    closeModal(id);
    /* Terus ke babak seterusnya — tidak perlu kembali ke senarai kempen. */
    setTimeout(() => last ? storyOpen(pid) : storyScene(pid, i + 1), 180);
  });
  return id;
}

/* ============ GAME 2: KAD KOLEKSI (UNBOXING) ============
   Guru yang membuka pack. TPC = tabung kelas mingguan dari skor positif.
   Hasil kad TIDAK PERNAH mengubah TP, skor atau rekod PBD. */
const CARD_TIERS = [
  { k:'sial',    name:'Sial',    color:'#7E8794', glow:'#5A6672', fx:'low',  n:25 },
  { k:'biasa',   name:'Biasa',   color:'#9FB4C7', glow:'#6E8296', fx:'low',  n:25 },

  { k:'legenda', name:'Legenda', color:'#FFD76A', glow:'#C9922B', fx:'hi',   n:10 },
  { k:'mitos',   name:'Mitos',   color:'#FF5A3C', glow:'#FF2D6F', fx:'myth', n:5  }
];
const tierOfCard = k => CARD_TIERS.find(t => t.k === k) || CARD_TIERS[0];
const tierRank = k => CARD_TIERS.findIndex(t => t.k === k);
const PACKS = [
  { k:'murah',     name:'Pack Murah',     cost:14,  base:9, rare:2, lucky:1,
    luck:{ jarang:76, epik:19, legenda:4.5, mitos:0.5 }, grant:null },
  { k:'sederhana', name:'Pack Sederhana', cost:28, base:7, rare:3, lucky:2,
    luck:{ jarang:62, epik:28, legenda:9, mitos:1 }, grant:null },
  { k:'mahal',     name:'Pack Mahal',     cost:50, base:5, rare:4, lucky:3,
    luck:{ jarang:46, epik:36, legenda:16.8, mitos:1.2 }, grant:'epik' }
];
const PACK_SIZE = 12;
const PITY_MAX = 25;
const BASE_ODDS = { sial:60, biasa:40 };
const RARE_ODDS = { jarang:85, epik:13, legenda:2 };

/* ---------- TPC: tabung kelas mingguan ---------- */
function weekKey(dk){
  const d = new Date((dk || todayKey()) + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;                 // Isnin = 0
  d.setDate(d.getDate() - day);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const tpcKey = () => weekKey() + '|' + S.ui.activeClassId + '|' + S.ui.activeSubjectId;
function tpcEarned(){
  const cid = S.ui.activeClassId, sj = S.ui.activeSubjectId;
  if (!cid || !sj) return 0;
  const wk = weekKey(), rate = (S.config.tpcRate === undefined ? 1 : S.config.tpcRate);
  let sum = 0;
  studentsOf(cid).forEach(s => {
    const days = (S.records[s.id] || {})[sj] || {};
    Object.keys(days).forEach(d => { if (weekKey(d) === wk){ const r = rateOf(days[d]); if (r > 0) sum += r; } });
  });
  return Math.floor(sum * rate);
}
const tpcSpent = () => ((S.tpc && S.tpc.spent) || {})[tpcKey()] || 0;
const tpcBonus = () => ((S.tpc && S.tpc.bonus) || {})[tpcKey()] || 0;
const tpcBalance = () => Math.max(0, tpcEarned() + tpcBonus() - tpcSpent());
function tpcSpend(n){
  S.tpc = S.tpc || { spent:{} };
  S.tpc.spent[tpcKey()] = (S.tpc.spent[tpcKey()] || 0) + n;
}
/* Topup oleh guru — ditambah pada tabung minggu & kelas semasa, direkod atas nama pelajar */
function tpcTopup(sid, amt, note){
  S.tpc = S.tpc || { spent:{} };
  S.tpc.bonus = S.tpc.bonus || {};
  S.tpc.log = S.tpc.log || [];
  const k = tpcKey();
  S.tpc.bonus[k] = (S.tpc.bonus[k] || 0) + amt;
  S.tpc.log.unshift({ ts:Date.now(), sid, amt, note: note || '', k });
  S.tpc.log = S.tpc.log.slice(0, 60);
  save(true);
}
