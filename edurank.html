  root.addEventListener('click', e => {
    const t = e.target;

    if (!t.closest('.st-pop') && $s('#stPop').innerHTML) $s('#stPop').innerHTML = '';   // ketik di luar panel rak = tutup panel, tindakan diteruskan

        ((stn[(drag.id || '').slice(0, -1)] || [])[+(drag.id || '').slice(-1)] || {}).id;

  document.body.appendChild(root);

    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rx) t.repeat.set(rx, ry || rx); t.anisotropy = 4; return t; };
  const M = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .85 }, extra || {}));

  /* ---------- jalan (tekstur bergerak) ---------- */
  const LANES = [-2.2, 0, 2.2];

    for (let y = 10; y < h; y += 40) for (let x = 10; x < w; x += 40){ const lit = Math.random() < .5; g.fillStyle = lit ? '#FFE9A0' : '#5A6B80'; g.fillRect(x, y, 22, 24); }
    g.fillStyle = '#B04A3A'; g.fillRect(0, 0, w, 6);
  }, 2, 1);
  const SCN = [], SPAN = 150;
  const addScenery = (obj, z) => { obj.position.z = z; scene.add(obj); SCN.push(obj); };
  for (let z = 0; z > -SPAN; z -= 15){

        addScenery(g, z - Math.random() * 6);

        const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3 + Math.random() * .6, 0), M(r < .75 ? 0x2F7A3A : 0x3E9A4A, { flatShading: true })); crown.position.y = 2.7; g.add(crown);

      lamp.position.x = s * 3.9;

  }

  /* ---------- pelari (murid berpakaian sekolah) ---------- */
  const runner = new THREE.Group();
  const skin = M(0xD9A06B), shirt = M(0xF4F6F8), pants = M(player && player.gender === 'P' ? 0x1F4E8A : 0x24364F), bag = M(0xE2574C), shoe = M(0x1A1A1A);
  const torso = new THREE.Mesh(new THREE.BoxGeometry(.62, .72, .34), shirt); torso.position.y = 1.32; runner.add(torso);
  const headM = new THREE.Mesh(new THREE.SphereGeometry(.24, 14, 12), skin); headM.position.y = 1.92; runner.add(headM);

  const pack = new THREE.Mesh(new THREE.BoxGeometry(.5, .56, .22), bag); pack.position.set(0, 1.36, .28); runner.add(pack);

  const armL = limb(shirt, .16, .62, -.4, 1.62), armR = limb(shirt, .16, .62, .4, 1.62);
  const legL = limb(pants, .2, .8, -.16, .96), legR = limb(pants, .2, .8, .16, .96);

  runner.rotation.y = Math.PI;                                       // membelakangkan kamera, lari ke -z

  shadow.rotation.x = -Math.PI / 2; shadow.position.y = .02; scene.add(shadow);

  /* ---------- halangan, bintang & gerbang ---------- */
  const OBS = [], STARS = [], GATES = [];
  const OB_KINDS = [
    { k:'cone',  low:true,  make: () => { const g = new THREE.Group(); const c = new THREE.Mesh(new THREE.ConeGeometry(.38, .9, 12), M(0xFF6B1A)); c.position.y = .45; g.add(c);
        const b = new THREE.Mesh(new THREE.CylinderGeometry(.27, .3, .12, 12), M(0xFFFFFF)); b.position.y = .45; g.add(b); return g; } },

        [-.65, .65].forEach(x => { const l = new THREE.Mesh(new THREE.BoxGeometry(.12, .55, .45), M(0x3A3A3A)); l.position.set(x, .27, 0); g.add(l); }); return g; } },
    { k:'bin',   low:false, make: () => { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, .9), M(0x2F8A3A)); b.position.y = .75; g.add(b);

  const starMat = M(0xFFD24A, { emissive: 0xFFA500, emissiveIntensity: .7, metalness: .4, roughness: .3 });

  const spawnStars = (z, lane) => { for (let i = 0; i < 5; i++){ const m = new THREE.Mesh(starGeo, starMat); m.position.set(LANES[lane], 1, z - i * 2.2); scene.add(m); STARS.push({ m, lane }); } };
  const gateTex = (txt, col) => ctex(256, 128, (g, w, h) => {
    g.fillStyle = col; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(6, 6, w - 12, h - 12);

  const GATE_COLS = ['#2A7FD4', '#D4532A', '#8A3AD4'];

      const sign = new THREE.Mesh(new THREE.PlaneGeometry(2, 1), new THREE.MeshBasicMaterial({ map: gateTex(String(q.c[ci]), GATE_COLS[lane]), side: THREE.DoubleSide }));

      '<div class="flex-1 truncate" style="padding:3px 4px;background:' + GATE_COLS[lane] + ';color:#fff;border-radius:3px">' +

  /* ---------- bunyi ---------- */
  const A = (() => {

    // muzik ceria ringkas: bass + arpeggio berulang

      coin:  () => tone('square', 1320, 1760, .08, .05),

      over:  () => [523, 440, 349, 262].forEach((f, i) => tone('triangle', f, 0, .35, .14, i * .18)),
      stop:  () => { clearInterval(timer); try { out.gain.setTargetAtTime(0, ac.currentTime, .05); setTimeout(() => out.disconnect(), 300); } catch(e){} }
    };
  })();
  const sfxR = k => { if (audPlay('run_' + k)) return; try { A && A[k] && A[k](); } catch(e){} };

  /* ---------- keadaan ---------- */
  const P = { lane: 1, x: 0, y: 0, vy: 0, inv: 0, phase: 0 };
  const RL = RUN_LVL[runCfg().lvl] || RUN_LVL.sederhana, RQ = runCfg().qt;
  let speed = RL.v0, dist = 0, stars = 0, right = 0, asked = 0, lives = 3, alive = true, ended = false, paused = false;
  let nextObs = -40, nextStar = -30, nextQ = 160, lastSpawnZ = -40;
  RUN = { close: () => quit() };
  const hud = () => {
    $r('#rnLives').innerHTML = [0, 1, 2].map(i => '<i class="fa-solid fa-heart" style="color:' + (i < lives ? '#FF4D6A' : 'rgba(0,0,0,.4)') + '"></i>').join(' ');
    $r('#rnStars').innerHTML = '★ ' + stars;
    $r('#rnScore').textContent = score();
    $r('#rnDist').textContent = Math.floor(dist) + ' m · ' + right + '/' + asked + ' betul';
  };
  const score = () => Math.floor(dist) + stars * 10 + right * 60;
  let msgT = null;
  const msg = (t, c, ms) => { const m = $r('#rnMsg'); m.innerHTML = t; m.style.color = c || '#fff'; m.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => m.style.opacity = 0, ms || 1100); };
  hud();
  msg('SEDIA… LARI!', '#FFD24A', 1400);
  setTimeout(() => { const h = $r('#rnHint'); if (h) h.style.opacity = 0; }, 5000);

  /* ---------- kawalan ---------- */
  const move = d => { const n = clamp(P.lane + d, 0, 2); if (n !== P.lane){ P.lane = n; sfxR('lane'); } };
  const jump = () => { if (P.y <= .01){ P.vy = 9.5; sfxR('jump'); } };
  const onKey = e => {
    if (e.type !== 'keydown' || paused || ended) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') move(-1);
    else if (k === 'arrowright' || k === 'd') move(1);
    else if (k === 'arrowup' || k === 'w' || k === ' ') jump();
    else return;
    e.preventDefault();
  };
  let sw = null;
  const onDown = e => { if (e.target.closest('button,#rnEnd')) return; sw = { x: e.clientX, y: e.clientY, t: performance.now(), used: false }; };
  const onMove = e => {
    if (!sw || sw.used) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)){ move(dx > 0 ? 1 : -1); sw.used = true; }
    else if (dy < -28 && Math.abs(dy) > Math.abs(dx)){ jump(); sw.used = true; }
  };
  const onUp = e => {
    if (!sw) return;
    if (!sw.used && performance.now() - sw.t < 260){                // ketik: sisi kiri/kanan tukar lorong, tengah lompat
      const w = root.clientWidth, x = e.clientX;
      if (x < w * .33) move(-1); else if (x > w * .67) move(1); else jump();
    }
    sw = null;
  };
  window.addEventListener('keydown', onKey);
  root.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  $r('#rnQuit').onclick = () => {
    if (ended) return quit();
    const was = paused; paused = true;                // larian berhenti sementara soalan pengesahan dipapar
    gameConfirm().then(ok => { if (ok) quit(); else { paused = was; last = performance.now(); } });
  };

  /* ---------- logik ---------- */
  const removeObj = (arr, i) => { const o = arr[i]; scene.remove(o.m); arr.splice(i, 1); };
  function hurt(){
    if (P.inv > 0) return;
    lives--; P.inv = 1.6; sfxR('hit'); vibrate(80); hud();
    const h = $r('#rnHit'); h.style.opacity = 1; setTimeout(() => h.style.opacity = 0, 250);
    if (lives <= 0) gameOver();
  }
  function update(dt){
    speed = Math.min(RL.vmax, RL.v0 + dist / RL.ramp);
    const dz = speed * dt;
    dist += dz;
    roadTex.offset.y -= dz / (160 / 6);
    // pemandangan berulang
    SCN.forEach(o => { o.position.z += dz; if (o.position.z > 12) o.position.z -= SPAN; });
    // pelari
    P.x += (LANES[P.lane] - P.x) * Math.min(1, dt * 14);
    P.vy -= 26 * dt; P.y = Math.max(0, P.y + P.vy * dt); if (P.y === 0) P.vy = Math.max(0, P.vy);
    P.phase += dt * (8 + speed * .35);
    const sw2 = P.y > 0 ? .6 : Math.sin(P.phase) * .9;
    legL.rotation.x = sw2; legR.rotation.x = -sw2; armL.rotation.x = -sw2 * .8; armR.rotation.x = sw2 * .8;
    runner.position.set(P.x, P.y + (P.y > 0 ? 0 : Math.abs(Math.sin(P.phase)) * .08), 0);
    runner.rotation.z = (LANES[P.lane] - P.x) * -.08;
    runner.visible = P.inv <= 0 || Math.floor(P.inv * 12) % 2 === 0;
    shadow.position.set(P.x, .02, 0); shadow.scale.setScalar(1 - Math.min(.5, P.y / 4));
    if (P.inv > 0) P.inv -= dt;
    cam.position.x += (P.x * .45 - cam.position.x) * Math.min(1, dt * 5);
    // jana objek baharu di hadapan
    nextObs += dz; nextStar += dz; nextQ -= dz;
    const gateNear = GATES.some(g => !g.done && g.z > -50);
    if (nextObs >= 0 && !gateNear){ spawnObstacle(-90); nextObs = -(14 + Math.random() * 10) * (11 / speed) * 1.4; }
    if (nextStar >= 0){ spawnStars(-90, Math.floor(Math.random() * 3)); nextStar = -(30 + Math.random() * 20); }
    if (nextQ <= 0 && !GATES.some(g => !g.done)){
      const q = escQuestion();
      spawnGates(-Math.max(60, speed * RQ), q); nextQ = 260 + Math.random() * 60 + speed * RQ;
      OBS.slice().forEach((o, i) => { if (o.m.position.z < -60) { scene.remove(o.m); o.dead = true; } });
      for (let i = OBS.length - 1; i >= 0; i--) if (OBS[i].dead) OBS.splice(i, 1);
    }
    // halangan
    for (let i = OBS.length - 1; i >= 0; i--){
      const o = OBS[i]; o.m.position.z += dz;
      if (!o.hit && o.lane === P.lane && Math.abs(o.m.position.z) < .7 && Math.abs(P.x - LANES[o.lane]) < 1){
        if (!(o.low && P.y > .55)){ o.hit = true; hurt(); }
      }
      if (o.m.position.z > 10) removeObj(OBS, i);
    }
    // bintang
    for (let i = STARS.length - 1; i >= 0; i--){
      const s = STARS[i]; s.m.position.z += dz; s.m.rotation.y += dt * 4;
      if (s.lane === P.lane && Math.abs(s.m.position.z) < .8 && P.y < 2){ stars++; sfxR('coin'); hud(); removeObj(STARS, i); continue; }
      if (s.m.position.z > 10) removeObj(STARS, i);
    }
    // gerbang soalan
    for (let i = GATES.length - 1; i >= 0; i--){
      const g = GATES[i]; g.z += dz; g.meshes.forEach(m => m.position.z = g.z);
      if (!g.done && g.z > -0.2){
        g.done = true; asked++;
        const ok = g.opts[P.lane] === g.q.a;
        teamQuiz(sid, ok);
        if (ok){ right++; stars += 5; sfxR('right'); msg('BETUL! +60', '#4ADE80'); P.inv = Math.max(P.inv, .8); }
        else { sfxR('wrong'); msg('SALAH! Jawapan: ' + esc(String(g.q.c[g.q.a])), '#FF6B6B', 2200); hurt(); }
        $r('#rnQ').style.display = 'none'; hud();
      }
      if (g.z > 12){ g.meshes.forEach(m => scene.remove(m)); GATES.splice(i, 1); }
    }
    if (Math.floor(dist) % 10 === 0) hud();
  }
  function gameOver(){
    if (ended) return;
    ended = true; sfxR('over');
    const sc = score(), rp = runRP(sc), d = runData();
    d.gbest = d.gbest || {};
    const prev = d.gbest[sid] || 0;
    if (sc > prev) d.gbest[sid] = sc;
    d.plays[sid] = (d.plays[sid] || 0) + 1;
    S.arena = S.arena || { points:{}, wins:{}, losses:{}, history:[] };
    teamRP(sid, rp);
    const tp = gameToPBD(sid, 'run', right, asked, { score: sc });
    save(true);
    const e = $r('#rnEnd');
    e.innerHTML = '<div class="panel clip p-5 w-full text-center" style="max-width:400px">' +
      '<div style="font-size:40px">' + (sc > prev ? '🏆' : '🏁') + '</div>' +
      '<div class="font-bold tracking-widest text-[20px] mt-1" style="color:#FFB347">' + (sc > prev ? 'REKOD BAHARU!' : 'TAMAT LARIAN') + '</div>' +
      '<div class="text-[13px] text-muted mt-1">' + esc(player ? player.name : '') + '</div>' +
      '<div class="grid grid-cols-3 gap-2 mt-4 num">' +
        '<div class="panel clip-s p-2"><div class="text-[18px] text-cyan">' + sc + '</div><div class="text-[10px] text-muted">SKOR</div></div>' +
        '<div class="panel clip-s p-2"><div class="text-[18px]" style="color:#FFD76A">' + right + '/' + asked + '</div><div class="text-[10px] text-muted">BETUL</div></div>' +
        '<div class="panel clip-s p-2"><div class="text-[18px] text-orange">+' + rp + '</div><div class="text-[10px] text-muted">RP</div></div></div>' +
      '<div class="text-[11px] text-muted mt-2">' + Math.floor(dist) + ' m · ★ ' + stars + '</div>' +
      (tp ? '<div class="text-[12px] mt-2" style="color:#00F0FF"><b style="color:' + TP_COLOR[tp] + '">TP' + tp + '</b> direkod dalam PBD untuk ' + player.members.length + ' ahli kumpulan</div>'
          : '<div class="text-[11px] text-muted mt-2">Tiada soalan dijawab — tiada TP direkod.</div>') +
      '<div class="flex gap-2 mt-4"><button class="btn clip-s flex-1 !py-3" data-end="quit">Tutup</button><button class="btn btn-o clip-s flex-1 !py-3" data-end="again"><i class="fa-solid fa-rotate"></i> Lari Lagi</button></div></div>';
    e.style.display = 'flex';
    e.onclick = ev => { const b = ev.target.closest('[data-end]'); if (!b) return; const again = b.dataset.end === 'again'; quit(); if (again) setTimeout(runStart, 50); };
  }
  function quit(){
    if (!alive) return;
    alive = false; RUN = null;
    if (!ended && asked) save();
    window.removeEventListener('resize', resize); window.removeEventListener('keydown', onKey);
    window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp);
    if (A) A.stop();
    scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) [].concat(o.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); });
    liveEnd(live); R.dispose(); root.remove(); unlockBody();
    if (S.ui.tab === 'arena') renderTab();
  }
  let last = performance.now();
  function frame(now){
    if (!alive) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!ended && !paused) update(dt);
    R.render(scene, cam); if (LIVE.frame) LIVE.frame(R.domElement);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ============ TAB: KEHADIRAN ============
   Daftar kehadiran harian untuk setiap kelas, berasingan daripada penilaian
   PBD (tidak mengubah skor atau TP). Data: S.attendance[classId][tarikh] =
   { s: { sid: 'H'|'L'|'T'|'C' }, n: { sid: 'catatan' } }.
   H = Hadir · L = Lewat · T = Tidak Hadir · C = Cuti / MC (dikira hadir? tidak). */
const ATT = [
  { k:'H', name:'Hadir',       short:'HADIR', color:'#4ADE80', ico:'fa-check' },
  { k:'L', name:'Lewat',       short:'LEWAT', color:'#FACC15', ico:'fa-clock' },
  { k:'T', name:'Tidak Hadir', short:'TIDAK', color:'#E23B3B', ico:'fa-xmark' },
  { k:'C', name:'Cuti / MC',   short:'CUTI',  color:'#38BDF8', ico:'fa-notes-medical' }
];
const attOf = k => ATT.find(a => a.k === k) || null;
const attDate = () => S.ui.attDate || todayKey();
const attClassId = () => S.ui.activeClassId || '';
/* Kelas gabungan disimpan mengikut kelas asal setiap pelajar */
const attBox = (cid, date, make) => {
  S.attendance = S.attendance || {};
  if (!S.attendance[cid]){ if (!make) return null; S.attendance[cid] = {}; }
  if (!S.attendance[cid][date]){ if (!make) return null; S.attendance[cid][date] = { s:{}, n:{} }; }
  const d = S.attendance[cid][date]; d.s = d.s || {}; d.n = d.n || {};
  return d;
};
const attGet = (sid, date) => { const s = stu(sid); if (!s) return ''; const b = attBox(s.classId, date || attDate()); return b ? (b.s[sid] || '') : ''; };
const attNoteOf = (sid, date) => { const s = stu(sid); if (!s) return ''; const b = attBox(s.classId, date || attDate()); return b ? (b.n[sid] || '') : ''; };
/* Tag kecil pada kad pelajar (tab Pelajar) bagi status hari yang dinilai */
function attTag(sid){
  const k = attGet(sid, recDate()); if (!k || (k === 'H' && attendedToday(sid))) return '';
  const a = attOf(k);
  return '<span class="tag !text-[8px] ml-1" style="color:' + a.color + ';border-color:' + a.color + '77"><i class="fa-solid ' + a.ico + '"></i> ' + a.short + '</span>';
}
function attSet(sid, k){
  const s = stu(sid); if (!s) return;
  const b = attBox(s.classId, attDate(), true);
  if (b.s[sid] === k){ delete b.s[sid]; delete b.n[sid]; } else b.s[sid] = k;
  if (k === 'H' || k === 'L') delete b.n[sid];
  save(); vibrate(10);
  const y = window.scrollY; renderTab(); window.scrollTo(0, y);
  if ((k === 'T' || k === 'C') && b.s[sid] === k && !b.n[sid]) setTimeout(() => attNote(sid), 120);
}
function attAll(k){
  const list = studentsOf(attClassId()), d = attDate();
  const snap = snapshot();
  let n = 0;
  list.forEach(s => { const b = attBox(s.classId, d, true); if (!b.s[s.id]){ b.s[s.id] = k; n++; } });
  save(true); renderTab();
  toast(n ? n + ' pelajar ditanda ' + attOf(k).name.toUpperCase() + '.' : 'Semua pelajar sudah ditanda.', n ? () => restore(snap) : null);
}
async function attClearDay(){
  const ok = await confirmBox({ danger:true, title:'Kosongkan Kehadiran', okText:'Kosongkan', message:'Padam semua tanda kehadiran ' + esc(clsName(attClassId())) + ' pada <b>' + fmtDate(attDate()) + '</b>?' });
  if (!ok) return;
  const snap = snapshot();
  studentsOf(attClassId()).forEach(s => { const b = attBox(s.classId, attDate()); if (b){ delete b.s[s.id]; delete b.n[s.id]; } });
  save(true); renderTab(); toast('Kehadiran hari itu dikosongkan.', () => restore(snap));
}
async function attNote(sid){
  const s = stu(sid); if (!s) return;
  const v = await promptBox({ title:'Catatan — ' + s.name, label:'SEBAB / CATATAN (PILIHAN)', placeholder:'Contoh: MC demam, urusan keluarga', value: attNoteOf(sid) });
  if (v === null || v === undefined) return;
  const b = attBox(s.classId, attDate(), true);
  if (String(v).trim()) b.n[sid] = String(v).trim(); else delete b.n[sid];
  save(true); renderTab();
}
const dayShift = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function attMove(n){ S.ui.attDate = dayShift(attDate(), n); save(); renderTab(); }
function attGo(v){ if (/^\d{4}-\d{2}-\d{2}$/.test(v)){ S.ui.attDate = v; S.ui.attView = 'day'; save(); renderTab(); } }

  const set = new Set();

  cids.forEach(cid => Object.keys((S.attendance || {})[cid] || {}).forEach(d => {
    const b = S.attendance[cid][d]; if (b && b.s && list.some(s => b.s[s.id])) set.add(d);
  }));
  return Array.from(set).sort().reverse();
}

  out.pct = out.n ? Math.round((out.H + out.L) / out.n * 100) : null;
  return out;
}

/* Soalan: bank guru dahulu (ikut urutan, sama seperti mod lain), jika tiada → matematik */
function escMathQ(){
  const r = n => Math.floor(Math.random() * n);
  const op = r(4); let a, b, ans, sym;
  if (op === 0){ a = 10 + r(90); b = 10 + r(90); ans = a + b; sym = '+'; }
  else if (op === 1){ a = 20 + r(80); b = 1 + r(a); ans = a - b; sym = '−'; }
  else if (op === 2){ a = 2 + r(11); b = 2 + r(11); ans = a * b; sym = '×'; }
  else { b = 2 + r(11); ans = 1 + r(12); a = b * ans; sym = '÷'; }
  const opts = new Set([ans]);
  while (opts.size < 4){ const d = (1 + r(10)) * (Math.random() < .5 ? -1 : 1); if (ans + d >= 0) opts.add(ans + d); }
  return { q: a + ' ' + sym + ' ' + b + ' = ?', c: Array.from(opts).map(String), a: 0, ans: String(ans), short: a + ' ' + sym + ' ' + b };
}
function escQuestion(){
  const bank = topicalBank(S.ui.activeSubjectId);
  if (!bank.length) return escMathQ();
  const q = nextQ(bank);
  const keep = [0,1,2,3].filter(i => q.c[i] !== undefined && q.c[i] !== '');
  return { q: q.q, c: keep.map(i => q.c[i]), a: keep.indexOf(q.a) };
}
/* 4 pasangan untuk teka-teki padanan: soalan ↔ jawapan betul (hasil unik) */
function escPairs(){
  const bank = topicalBank(S.ui.activeSubjectId).filter(q => q.c && q.c[q.a] !== undefined);
  const out = [], seen = new Set();
  bank.slice().sort(() => Math.random() - .5).forEach(q => {
    const a = String(q.c[q.a]);
    if (out.length < 4 && !seen.has(a)){ seen.add(a); out.push([q.q.length > 60 ? q.q.slice(0, 57) + '…' : q.q, a]); }
  });
  for (let n = 0; out.length < 4 && n < 200; n++){
    const m = escMathQ();
    if (!seen.has(m.ans)){ seen.add(m.ans); out.push([m.short, m.ans]); }
  }
  return out;
}

    window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKey);
    if (A) A.stop();
    scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) [].concat(o.material).forEach(m => { if (m.map) m.map.dispose(); if (m.emissiveMap) m.emissiveMap.dispose(); m.dispose(); });

  /* ---------- gelung utama ---------- */
  const fwd = new THREE.Vector3();
  let last = performance.now(), beatT = 0, tickT = 0;
  function update(dt, now){
    if (!P.hide){
      let mx = joy.x, my = joy.y;
      if (kb['w'] || kb['arrowup']) my -= 1;
      if (kb['s'] || kb['arrowdown']) my += 1;
      if (kb['a'] || kb['arrowleft']) mx -= 1;
      if (kb['d'] || kb['arrowright']) mx += 1;
      const m = Math.min(1, Math.hypot(mx, my));
      if (m > .05){
        const sp = 3.3 * m, sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
        const vx = (-sy * -my + cy * mx), vz = (-cy * -my - sy * mx), vl = Math.hypot(vx, vz) || 1;
        P.x += vx / vl * sp * dt; P.z += vz / vl * sp * dt;
        P.bob += dt * 9 * m;
        if (now - lastStep > 430){ lastStep = now; sfx('step'); }
      }
      collide(P, .3);
    }
    cam.position.set(P.x, (P.hide ? 1.55 : 1.6 + Math.sin(P.bob) * .04), P.z);
    cam.rotation.set(P.pitch, P.yaw, 0);
    // hantu
    if (G.f !== P.f){
      G.hunt = false;
      if (!P.hide && (G.follow += dt) > 10){
        const r = STAIRS[P.f]; G.f = P.f; G.x = r.cx; G.z = r.zc + r.side * 8; G.follow = 0; G.grace = 1.5;
        sfx('creak'); msg('Kamu terdengar sesuatu di <span style="color:#E23B3B">tangga</span>…', 2600);
      }
    } else G.follow = 0;
    const same = G.f === P.f;
    const dx = P.x - G.x, dz = P.z - G.z, dist = same ? Math.hypot(dx, dz) : 99;
    if (G.grace > 0) G.grace -= dt;
    else if (same){
      if (!G.hunt && !P.hide && dist < sight){ G.hunt = true; sfx('sting'); msg('<span style="color:#FF5A5A">Ia nampak kamu… LARI!</span>', 2000); }
      if (G.hunt && (dist > sight + 7 || P.hide)) G.hunt = false;
      let tx, tz, sp;
      if (G.hunt){ tx = P.x; tz = P.z; sp = huntSp + keys() * .2; }
      else {
        if (Math.hypot(G.wx - G.x, G.wz - G.z) < .5){ const w = WAYS[G.f][Math.floor(Math.random() * WAYS[G.f].length)]; G.wx = w[0]; G.wz = w[1]; }
        tx = G.wx; tz = G.wz; sp = GT.roam;
      }
      const gx = tx - G.x, gz = tz - G.z, gl = Math.hypot(gx, gz) || 1;
      G.x += gx / gl * sp * dt; G.z += gz / gl * sp * dt;
      if (dist < .75 && !P.hide) return caught();
    }
    ghost.visible = same;
    const jitter = gKind === 'toyol' ? Math.abs(Math.sin(now / 90)) * .08 : Math.sin(now / 400) * .12 + .1;
    ghost.position.set(G.x, jitter, G.z);
    ghost.lookAt(P.x, ghost.position.y, P.z);
    // bunyi khas hantu (pontianak: ketawa PERLAHAN bila dekat, KUAT bila jauh)
    if ((laughT -= dt) <= 0){
      laughT = 11 + Math.random() * 9;
      if (gKind === 'pontianak') sfx('laugh', same ? clamp(dist / 18, .15, 1) : .35);
      else if (gKind === 'toyol') sfx('giggle', same ? clamp(1 - dist / 25, .2, 1) : .2);
    }
    // detak jantung & tepi merah bila dekat
    const fear = clamp(1 - dist / 10, 0, 1);
    $e('#escRed').style.opacity = (fear * .9).toFixed(2);
    beatT -= dt;
    if (fear > 0 && beatT <= 0){ sfx('beat', .4 + fear * .6); beatT = 1.1 - fear * .65; }
    // jam berdetik
    if ((tickT += dt) >= 1){
      tickT = 0;
      clocks.forEach(c => { c.sec = (c.sec + 1) % 60; c.hand.rotation.z = -c.sec * Math.PI / 30; if (c.f === P.f){ const d = Math.hypot(c.x - P.x, c.z - P.z); if (d < 6) sfx('tick', 1 - d / 6); } });
    }
    cam.getWorldDirection(fwd);
    // nombor kod tersembunyi: dijumpai bila dilihat dari dekat
    digits.forEach(dg => {
      if (found[dg.idx] || dg.f !== P.f) return;
      const ox = dg.x - P.x, oz = dg.z - P.z, d = Math.hypot(ox, oz);
      if (d < 3.6 && (fwd.x * ox + fwd.z * oz) / (d || 1) > .55){
        found[dg.idx] = true; sfx('chime'); hud();
        msg('Kamu jumpa nombor tertulis: <span style="color:#FF5A5A">nombor ke-'+(dg.idx + 1)+' = '+CODE[dg.idx]+'</span>', 3200);
      }
    });
    // di mana pemain berada
    const inRoom = rooms.find(r => r.f === P.f && P.x > r.x1 && P.x < r.x2 && (P.z - r.zc) * r.side > 2 && (P.z - r.zc) * r.side < 12) || null;
    if (inRoom !== room){ room = inRoom; $e('#escWhere').textContent = FLOORS[P.f].name + (room ? ' · ' + room.name : ' · KORIDOR'); }
    // benda yang boleh disentuh berhampiran
    near = null; let best = 2.4;
    if (P.hide) near = { kind: 'unhide' };
    else inter.forEach(o => {
      if (o.f !== P.f) return;
      if (o.kind === 'board' && o.bd.solved) return;
      if (o.kind === 'pickup' && (o.src.solved || !staffDoor.open)) return;
      if (o.kind === 'lock' && staffDoor.open) return;
      const ox = o.x - P.x, oz = o.z - P.z, d = Math.hypot(ox, oz);
      const facing = o.kind === 'hide' || o.kind === 'stairs' ? 0 : .2;
      if (d < best && (fwd.x * ox + fwd.z * oz) / (d || 1) > facing - (o.kind === 'hide' ? 1 : 0)){ best = d; near = o; }
    });
    const LBL = { unhide: 'fa-door-open|KELUAR LOKER', hide: 'fa-box-archive|SEMBUNYI', exit: 'fa-door-open|BUKA PINTU', lock: 'fa-lock|MASUKKAN KOD',
      pickup: 'fa-key|AMBIL KUNCI', board: 'fa-chalkboard|JAWAB SOALAN', match: 'fa-shuffle|PADANKAN KAD' };
    let lk = near ? (near.kind === 'board' && near.bd.type === 'match' ? 'match' : near.kind) : '';
    let label = '';
    if (near && near.kind === 'stairs') label = '<i class="fa-solid fa-stairs"></i> ' + (near.to ? 'NAIK TANGGA' : 'TURUN TANGGA');
    else if (lk){ const [ic, t] = LBL[lk].split('|'); label = '<i class="fa-solid '+ic+'"></i> ' + t; }
    if (label !== actLabel){                         // tulis semula hanya bila berubah, supaya ketikan tidak hilang
      actLabel = label;
      const act = $e('#escAct');
      act.innerHTML = label; act.style.display = label ? 'block' : 'none';
    }
  }
  function ambient(dt, now){
    // 4 cahaya sebenar diletak di lekapan terdekat pada tingkat pemain
    fixtures.forEach(f => {
      f.t += dt;
      const on = !f.dead && (f.t < 0 ? Math.random() < .25 : Math.random() > .015);
      f.v = on ? .85 + Math.random() * .15 : 0;
      f.tube.material.emissiveIntensity = f.v;
    });
    const nearFx = fixtures.filter(f => f.f === P.f).sort((a, b) => Math.hypot(a.x - P.x, a.z - P.z) - Math.hypot(b.x - P.x, b.z - P.z)).slice(0, pool.length);
    pool.forEach((l, i) => { const f = nearFx[i]; if (!f){ l.intensity = 0; return; } l.position.set(f.x, H - .25, f.z); l.intensity = 7 * f.v; });
    exitLight.intensity = P.f === 0 ? 5 + Math.sin(now / 300) * 1.5 : 0;
    fans.forEach(f => f.g.rotation.y += f.sp * dt);
    const gk = ghost.children.find(c => c.isPointLight); if (gk) gk.intensity = ghost.visible ? 2.5 : 0;
  }
  function frame(now){
    if (!alive) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!paused && !ended){ elapsed += dt; $e('#escTime').textContent = fmtSec(elapsed); update(dt, now); }
    ambient(dt, now);
    R.render(scene, cam); if (LIVE.frame) LIVE.frame(R.domElement);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const fn = ACTS[a.dataset.act];
  if (fn) fn(a.dataset);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ctxClass'){ S.ui.activeClassId = t.value; selReset(); STU_Q = ''; REC_DATE = null; save(); renderAll(); autoSubject(); }
  if (t.id === 'ctxSubject'){ S.ui.activeSubjectId = t.value; REC_DATE = null; save(); renderAll(); }
  if (t.id === 'mtxClass'){ S.ui.mtxClass = t.value; save(); renderTab(); }
  if (t.id === 'qzSubj'){ S.ui.qzSubject = t.value; save(); closeTop(); quizManager(); }
  if (t.id === 'ttClass'){ S.ui.ttClass = t.value; save(); renderTab(); }
  if (t.id === 'ttSubject'){ S.ui.ttSubject = t.value; save(); renderTab(); }
  if (t.id === 'mtxSubject'){ S.ui.mtxSubject = t.value; save(); renderTab(); }

});
// TAHAN gambar pelajar (450ms) = masuk mod pilih ramai
let holdT = null, holdXY = null, holdFired = false;
document.addEventListener('pointerdown', e => {
  const av = e.target.closest('[data-hold]'); if (!av) return;
  holdFired = false; holdXY = [e.clientX, e.clientY];
  clearTimeout(holdT);
  holdT = setTimeout(() => { holdFired = true; holdT = null; SEL.on = true; selToggle(av.dataset.hold); }, 450);
});
document.addEventListener('pointermove', e => {
  if (holdT && holdXY && (Math.abs(e.clientX-holdXY[0]) > 10 || Math.abs(e.clientY-holdXY[1]) > 10)){ clearTimeout(holdT); holdT = null; }
});
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => { if (holdT){ clearTimeout(holdT); holdT = null; } }, true));
document.addEventListener('contextmenu', e => {
  const t = e.target;
  if (t.closest('input, textarea, [contenteditable], pre, .selectable')) return;   // benarkan salin dalam medan & kod
  e.preventDefault();
});
document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
document.addEventListener('selectstart', e => {
  if (e.target.closest && e.target.closest('input, textarea, [contenteditable], pre, .selectable')) return;
  e.preventDefault();
});
document.addEventListener('input', e => { if (e.target.id === 'stuSearch'){ STU_Q = e.target.value; applyStuFilter(); } });

// double-tap pada kad pelajar = nilai (mod biasa) · ketik = togol pilihan (mod pilih)
let lastTap = 0, lastId = '';
document.addEventListener('pointerup', e => {
  const card = e.target.closest('[data-stu]');
  if (!card || e.target.closest('[data-act]')) return;
  if (holdFired){ holdFired = false; return; }
  if (SEL.on){ selToggle(card.dataset.stu); return; }
  const now = Date.now();
  if (now - lastTap < 350 && lastId === card.dataset.stu) { openEval([card.dataset.stu], (stu(card.dataset.stu)||{}).name); lastTap = 0; }
  else { lastTap = now; lastId = card.dataset.stu; }
});

/* ============ PWA ============ */
/* Manifest dijana dalam fail ini (satu fail sahaja).
   start_url membawa penanda ?src=hs supaya app tahu ia dibuka dari skrin utama. */
function initPWA(){
  const base = location.origin + location.pathname;
  const manifest = {
    name: APP_NAME, short_name: APP_NAME, description: 'EduRank — dicipta oleh ' + APP_AUTHOR,
    start_url: base + '?src=hs', scope: location.origin + location.pathname.replace(/[^/]*$/, ''),
    display:'standalone', orientation:'portrait', background_color:'#0C1118', theme_color:'#0C1118',
    icons:[
      { src: APP_ICON, sizes:'192x192', type:'image/png', purpose:'any' },
      { src: APP_ICON, sizes:'512x512', type:'image/png', purpose:'any' }
    ]
  };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'data:application/json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
  document.head.appendChild(l);
}

/* ============ SKRIN ARAHAN PEMASANGAN ============ */
function isInstalled(){
  const hs = new URLSearchParams(location.search).get('src') === 'hs';
  if (hs) try { sessionStorage.setItem('rk_hs','1'); } catch(e){}
  let flag = false; try { flag = sessionStorage.getItem('rk_hs') === '1'; } catch(e){}
  return hs || flag
    || ['standalone','fullscreen','minimal-ui'].some(m => window.matchMedia('(display-mode: '+m+')').matches)
    || window.navigator.standalone === true;
}
function installGate(){
  ['header','nav','#main'].forEach(sel => { const el = $(sel); if (el) el.style.display = 'none'; });
  const ua = navigator.userAgent;
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const step = (n, icon, text) =>
    '<div class="flex items-center gap-3 panel clip-s p-3 mb-2 text-left">' +
    '<div class="num text-orange text-[18px] w-5">'+n+'</div>' +
    '<i class="fa-solid '+icon+' text-cyan text-[18px] w-6 text-center"></i>' +
    '<div class="text-[13px] leading-snug flex-1">'+text+'</div></div>';
  const android =
    step(1,'fa-ellipsis-vertical','Tekan menu <b>⋮</b> di penjuru kanan atas Chrome') +
    step(2,'fa-mobile-screen-button','Pilih <b>Tambah ke skrin utama</b> atau <b>Pasang aplikasi</b>') +
    step(3,'fa-check','Tekan <b>Tambah / Pasang</b>, kemudian buka <b>EduRank</b> dari skrin utama');
  const iphone =
    step(1,'fa-arrow-up-from-bracket','Buka dalam <b>Safari</b>, tekan butang <b>Kongsi</b> di bar bawah') +
    step(2,'fa-square-plus','Pilih <b>Tambah ke Skrin Utama</b> (Add to Home Screen)') +
    step(3,'fa-check','Tekan <b>Tambah</b>, kemudian buka <b>EduRank</b> dari skrin utama');
  document.body.insertAdjacentHTML('beforeend',
    '<div id="gate" style="position:fixed;inset:0;z-index:1000;overflow-y:auto;display:flex;align-items:center;justify-content:center;' +
      'padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));background:radial-gradient(circle at 50% 25%,rgba(255,107,0,.14),transparent 60%),#0C1118">' +
      '<div class="w-full max-w-sm text-center">' +
        '<img src="'+APP_ICON+'" alt="EduRank" class="mx-auto" style="width:100px;height:100px;object-fit:contain;border-radius:24px;box-shadow:0 0 36px rgba(255,107,0,.35)" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="font-bold tracking-[.25em] text-[28px] glow-o mt-4">EDURANK</div>' +
        '<div class="text-[13px] text-muted mt-2 mb-5">Pasang EduRank ke skrin utama untuk mula menggunakan.</div>' +
        '<div class="lbl text-left mb-2">'+(ios ? 'IPHONE / IPAD' : 'ANDROID')+'</div>' +
        (ios ? iphone : android) +
        '<details class="mt-3 text-left"><summary class="text-[11px] text-muted">Arahan untuk '+(ios ? 'Android' : 'iPhone / iPad')+'</summary><div class="mt-2">'+(ios ? android : iphone)+'</div></details>' +
        '<div class="text-[10px] text-muted mt-8 tracking-widest">DICIPTA OLEH ARIF AZIZ</div>' +
      '</div></div>');
}

/* ============ INIT ============ */
(async function init(){
  // Mod paparan awam: ?s=... → showcase sahaja, tiada state tempatan, tiada Firebase SDK
  const vp = new URLSearchParams(location.search).get('s');
  if (vp){ S = blank(); viewerBoot(vp); return; }      // pautan showcase murid: tidak perlu pasang
  initPWA();
  if (!isInstalled()){ installGate(); return; }         // dalam pelayar: tutup app, papar arahan pasang sahaja
  IDB = await idbOpen();
  Object.assign(PHOTOS, await idbAll());
  S = load();
  /* Aset sprite / peta / kad muat naik lama dipadam daripada peranti, sekali sahaja. */
  S.subjects.filter(x => x.dskp).forEach(x => dskpLoad(x.dskp).then(() => renderTab()).catch(() => {}));
  dskpIndex().catch(() => {});
  purgeSpriteAssets().then(n => { if (n) console.info('Aset lama dibuang:', n); });
  if (S.ui.tab === 'arena' && !['escape','cards','run','stor'].includes(arenaUi().game)) arenaUi().game = 'cards';
  bgmInit(); audProbe(); kadProbe();
  hintInit();
  if (!S.ui.mtxClass) S.ui.mtxClass = S.ui.activeClassId || '';
  if (!S.ui.mtxSubject) S.ui.mtxSubject = S.ui.activeSubjectId || '';
  $$('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.nav === S.ui.tab));
  renderAll();
  setTimeout(autoSubject, 400);
  fbInit();
  liveWatch(); setInterval(liveWatch, 3000);         // tayangan langsung dari peranti lain
  window.addEventListener('beforeunload', () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} });
  window.addEventListener('storage', e => {
    if (e.key !== LS_KEY || !e.newValue) return;
    try { const d = JSON.parse(e.newValue); if ((d.rev||0) > (S.rev||0)){ S = migrate(d); renderAll(); } } catch(err){}
  });
})();

</script>
