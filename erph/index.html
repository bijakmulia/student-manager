<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b0a3d">
<link rel="manifest" href="manifest.json">

<title>eRPH Pintar</title>
<style>
:root{--p:#2b0a3d;--p2:#5b1a7a;--a:#e6007e;--bg:#f4f2f7;--card:#fff;--tx:#1d1626;--mu:#6d6577;--ok:#13a05f;--wa:#e08a00;--er:#d63031;--bd:#e3dde9;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header b{font-size:17px;display:block}header small{opacity:.75;font-size:12px}
.icon{background:none;border:0;color:inherit;font-size:20px;padding:6px 8px;cursor:pointer}
main{padding:14px;max-width:820px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;font-size:19px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:11px}nav button.on{color:var(--a)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,10,60,.07);border:1px solid var(--bd)}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 14px;font-weight:600;font-size:14px;background:var(--p2);color:#fff;cursor:pointer;text-decoration:none}
.btn.a{background:var(--a)}.btn.o{background:#fff;color:var(--p2);border:1.5px solid var(--p2)}.btn.g{background:var(--ok)}.btn.r{background:var(--er)}.btn.s{padding:7px 10px;font-size:13px}.btn.w{width:100%}.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row .pill{flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--tx)}
textarea{min-height:90px;resize:vertical;line-height:1.4}
textarea,input,.chk span,.mu,table.t td,.it div{unicode-bidi:plaintext}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#eee;color:#555;white-space:nowrap}
.pill.ok{background:#dff5ea;color:var(--ok)}.pill.wa{background:#fff1d9;color:#a96400}.pill.er{background:#fde3e3;color:var(--er)}.pill.p{background:#efe2f7;color:var(--p2)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);gap:8px;cursor:pointer}.list .it:last-child{border:0}
.bar{height:8px;background:#eee;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--a))}
.modal{position:fixed;inset:0;background:rgba(20,5,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 14px 24px}
.mhead{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 0;z-index:2}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1}
.tp{display:flex;gap:4px}.tp button{flex:1;border:1.5px solid var(--bd);background:#fff;border-radius:8px;padding:7px 0;font-weight:700;font-size:13px;color:var(--mu)}
.tp button.on{color:#fff;border-color:transparent}
.tp .t1.on{background:#d63031}.tp .t2.on{background:#e17055}.tp .t3.on{background:#f0b400}.tp .t4.on{background:#00b894}.tp .t5.on{background:#0984e3}.tp .t6.on{background:#6c5ce7}.tp .tTH.on{background:#636e72}
.murid{padding:8px 0;border-bottom:1px solid var(--bd)}.murid .nm{font-size:13.5px;margin-bottom:5px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd);font-weight:400!important;color:var(--tx)!important;font-size:14px!important}.chk input{width:20px;height:20px;flex:none;margin-top:1px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{border-bottom:1px solid var(--bd);padding:7px 5px;text-align:left;vertical-align:top}table.t th{background:#f0eaf5;font-size:12px}
.scroll{overflow-x:auto}
.step{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.step .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#eee;font-size:13px;flex:none}.step.done .dot{background:var(--ok);color:#fff}
.foot{text-align:center;font-size:11.5px;color:var(--mu);margin:18px 0}
.rphc{border-left:5px solid var(--p2);cursor:pointer}.rphc.siap{border-left-color:var(--ok)}.rphc.tb{border-left-color:#999}.rphc.draf{border-left-color:var(--wa)}
.seg{display:flex;background:#e9e3ef;border-radius:10px;padding:3px}.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:600;color:var(--mu);font-size:13px}.seg button.on{background:#fff;color:var(--p2);box-shadow:0 1px 2px rgba(0,0,0,.1)}
canvas.ttd{width:100%;height:150px;background:#fff;border:1.5px dashed var(--bd);border-radius:10px;touch-action:none;display:block}
code{background:#f0eaf5;padding:1px 5px;border-radius:5px;font-size:12px}
.save{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.bantu{background:linear-gradient(135deg,#fff7fc,#f6effb);border:1.5px dashed var(--a)}.bantu .lk{font-size:13px;color:var(--mu);background:#fff;border-radius:10px;padding:9px 10px;margin:10px 0;line-height:1.55}.bantu .msg{background:#dff5ea;color:#0b6b3f;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<header><div><b>eRPH Pintar</b><small id="subttl"></small></div><button id="syncBtn" class="icon" title="Sync">☁</button></header>
<main id="view"></main>
<nav id="nav">
<button data-v="utama">🏠<span>Utama</span></button>
<button data-v="rph">📝<span>RPH</span></button>
<button data-v="rpt">📚<span>RPT</span></button>
<button data-v="pbd">📊<span>PBD</span></button>

</nav>
<div id="modal" class="modal hide"><div class="sheet"><div class="mhead"><b id="mtitle"></b><button class="icon" onclick="closeModal()">✕</button></div><div id="mbody"></div></div></div>
<div id="toast"></div>
<script>
/* eRPH Pintar — by Bijak Mulia — Dicipta oleh Arif Aziz */
const VER='1.3.0';
const BPK_URL='https://bpk.moe.gov.my/';
const BPK_LANGKAH=`<b>1.</b> Tekan <b>🌐 Buka Laman BPK</b><br><b>2.</b> Menu <b>Kurikulum → KSSM</b> → pilih <b>KSSM Tingkatan 1 / 2 / 3 / 4 dan 5</b><br><b>3.</b> Tekan DSKP subjek awk (senarai ada 2 halaman) → PDF dibuka di Google Drive → tekan <b>⋮ → Muat turun</b><br><b>4.</b> Kembali ke app → <b>Import DSKP</b> → guna PDF itu<br><br>⚠️ PJ & PK berada dalam <b>satu DSKP</b> (<i>Pendidikan Jasmani dan Kesihatan</i>). Import 2 kali guna PDF yang sama: subjek <b>PENDIDIKAN JASMANI</b>, kemudian <b>PENDIDIKAN KESIHATAN</b>.`;
const LESEN_URL=''; // ← tampal URL web app Lesen.gs. Kosong = mod pembangun (tiada semakan lesen)
const TRIAL_HARI=14;
const KEY='erphpintar_v1';
const HARI=['','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu','Ahad'];
const OBJ_H='Pada Akhir Pengajaran Dan Pembelajaran, Murid-Murid Dapat:';
const ALIAS={'BM':'BAHASA MELAYU','BI':'BAHASA INGGERIS','ENGLISH':'BAHASA INGGERIS','PJ':'PENDIDIKAN JASMANI','PK':'PENDIDIKAN KESIHATAN','PI':'PENDIDIKAN ISLAM','PAI':'PENDIDIKAN ISLAM','PM':'PENDIDIKAN MORAL','RBT':'REKA BENTUK DAN TEKNOLOGI','ASK':'ASAS SAINS KOMPUTER','PSV':'PENDIDIKAN SENI VISUAL','MUZIK':'PENDIDIKAN MUZIK','SN':'SAINS','SC':'SAINS','MT':'MATEMATIK','MM':'MATEMATIK','SEJ':'SEJARAH','GEO':'GEOGRAFI','BA':'BAHASA ARAB','MATEMATIK TAMBAHAN':'MATEMATIK TAMBAHAN','ADD MATH':'ADDITIONAL MATHEMATICS','KKQ':'KKQ','PQS':'PENDIDIKAN AL-QURAN DAN AL-SUNNAH','PSI':'PENDIDIKAN SYARIAH ISLAMIAH','TASAWWUR':'TASAWWUR ISLAM','USULUDDIN':'USUL AL-DIN','SYARIAH':'AL-SYARIAH','LUGHAH':'AL-LUGHAH AL-ARABIAH AL-MUASIRAH','MAHARAT':'MAHARAT AL-QURAN','HIFZ':'HIFZ AL-QURAN','TAHFIZ':'HIFZ AL-QURAN','PENDIDIKAN JASMANI DAN KESIHATAN':'PENDIDIKAN JASMANI'};
const subj=s=>{const n=String(s||'').trim().toUpperCase().replace(/\s+/g,' ');return ALIAS[n]||n};
const SUBJEK=['BAHASA MELAYU','BAHASA INGGERIS','BAHASA ARAB','MATEMATIK','SAINS','SEJARAH','GEOGRAFI','PENDIDIKAN ISLAM','PENDIDIKAN MORAL','PENDIDIKAN JASMANI','PENDIDIKAN KESIHATAN','PENDIDIKAN SENI VISUAL','PENDIDIKAN MUZIK','REKA BENTUK DAN TEKNOLOGI','ASAS SAINS KOMPUTER','KKQ','TAHFIZ','USUL AL-DIN','AL-SYARIAH','FIZIK','KIMIA','BIOLOGI','MATEMATIK TAMBAHAN','EKONOMI','PERNIAGAAN','PRINSIP PERAKAUNAN'];

/* ---------- util ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,' ')}
function slug(s){return norm(s).replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'')}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dmy=s=>{if(!s)return'';const d=pd(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const t12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${pad(m)} ${ap}`};
const mins=(a,b)=>{const f=t=>{const[h,m]=String(t||'0:0').split(':').map(Number);return h*60+m};return f(b)-f(a)};
const today=()=>iso(new Date());
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const lc=s=>s?s[0].toLowerCase()+s.slice(1):'';
const cap=s=>s?s[0].toUpperCase()+s.slice(1):'';
const stripNo=s=>String(s||'').replace(/^[\d.]+\s*/,'');
const titleCase=s=>String(s).toLowerCase().replace(/(^|\s|-)\S/g,c=>c.toUpperCase());
const nl=s=>esc(s).replace(/\n/g,'<br>');
const hariLbl=h=>`${h===7?1:h+1}. ${HARI[h]}`;
const nowStr=()=>new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2800)}
function modal(t,h,after){$('#mtitle').textContent=t;$('#mbody').innerHTML=h;$('#modal').classList.remove('hide');document.body.style.overflow='hidden';if(after)after()}
function closeModal(){$('#modal').classList.add('hide');document.body.style.overflow=''}
function dl(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Prompt disalin ✔ Tampal ke ChatGPT / Gemini')).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('Prompt disalin ✔')})}
function bacaFail(inp,cb){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){toast('Fail tidak sah')}inp.value=''};r.readAsText(f)}

/* ---------- state ---------- */
const DEF={profil:{nama:'',sekolah:'',email:'',jawatan:'',role:'guru',ttd:''},conn:{url:'',email:'',pass:''},lesen:{kod:'',sekolah:'',tamat:'',ok:false,mula:''},ai:{key:'',model:'gemini-2.5-flash'},takwim:{mula:'',minggu:42,cuti:[],ujian:[]},dskp:[],kelas:[],jadual:[],rpt:[],rph:[],semakan:[],guru:[],config:{},queue:[],lastSync:''};
let S;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){const s=Object.assign(structuredClone(DEF),x);if(!s.lesen.mula)s.lesen.mula=today();return s}}catch(e){}const s=structuredClone(DEF);s.lesen.mula=today();s.dskp=CONTOH_DSKP();return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storan phone penuh! Sila buat backup.')}}
const online=()=>!!(S.conn.url&&S.conn.pass);
const kelasById=id=>S.kelas.find(k=>k.id===id);

/* ---------- sync (Google Sheet sekolah) ---------- */
const TBL={dskp:'DSKP',kelas:'Kelas',jadual:'Jadual',rpt:'RPT',rph:'RPH',semakan:'Semakan'};
function put(tb,obj){obj.updated=Date.now();const a=S[tb],i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);if(online())S.queue.push({t:tb,id:obj.id});save();schedSync()}
function del(tb,id){S[tb]=S[tb].filter(x=>x.id!==id);if(online())S.queue.push({t:tb,id,del:1});save();schedSync()}
let syncT;function schedSync(){if(!online())return;clearTimeout(syncT);syncT=setTimeout(()=>sync(false),1500)}
function setSync(s){$('#syncBtn').textContent=!online()?'☁':s===1?'⏳':s===2?'⚠️':(S.queue.length?'⟳':'✅')}
async function api(action,data={}){const r=await fetch(S.conn.url,{method:'POST',body:JSON.stringify({action,email:S.conn.email,pass:S.conn.pass,...data})});const j=await r.json();if(!j.ok)throw new Error(j.error||'Ralat pelayan');return j}
async function flush(){if(!S.queue.length)return;const q=S.queue.slice(),ups={},dels={};q.forEach(e=>{const m=e.del?dels:ups;(m[e.t]=m[e.t]||new Set()).add(e.id)});
 for(const t in ups){const rows=[...ups[t]].map(id=>S[t].find(x=>x.id===id)).filter(Boolean).map(x=>({id:x.id,data:x}));for(let i=0;i<rows.length;i+=40)await api('push',{table:TBL[t],rows:rows.slice(i,i+40)})}
 for(const t in dels)await api('del',{table:TBL[t],ids:[...dels[t]]});S.queue=S.queue.slice(q.length);save()}
async function sync(full=true){if(!online()){go('sambung');return}if(!navigator.onLine){setSync(2);return}setSync(1);
 try{await flush();if(full){const j=await api('pull');['dskp','kelas','jadual','rpt','rph','semakan'].forEach(k=>S[k]=j[k]||[]);S.config=j.config||{};S.guru=j.guru||[];
  if(j.me){S.profil.role=j.me.role;S.profil.nama=S.profil.nama||j.me.nama}if(S.config.sekolah)S.profil.sekolah=S.config.sekolah;if(S.config.takwim&&S.config.takwim.mula)S.takwim=S.config.takwim;
  S.lastSync=new Date().toLocaleString('en-GB');save();render()}setSync(0)}catch(e){setSync(2);toast('Sync gagal: '+e.message)}}

/* ---------- lesen ---------- */
function trialBaki(){return TRIAL_HARI-Math.floor((pd(today())-pd(S.lesen.mula||today()))/864e5)}
function lesenOK(){if(!LESEN_URL)return true;if(online())return!!(S.config.lesen&&S.config.lesen.ok);if(S.lesen.ok&&S.lesen.tamat>=today())return true;return trialBaki()>0}
function perluLesen(){if(lesenOK())return true;modal('Lesen diperlukan',`<div class="card"><p>${online()?'Lesen sekolah tidak aktif. Hubungi admin eRPH sekolah.':'Tempoh percubaan telah tamat. Aktifkan lesen untuk meneruskan.'}</p>${online()?'':`<button class="btn a w" onclick="go('lesen')">Aktifkan / Beli Lesen</button>`}</div>`);return false}

/* ---------- takwim ---------- */
function minggu(){const T=S.takwim;if(!T.mula)return[];let d=pd(T.mula);d=addD(d,-((d.getDay()+6)%7));const out=[],inR=(ds,a)=>(a||[]).find(c=>c.mula&&c.tamat&&ds>=c.mula&&ds<=c.tamat);let n=0,g=0;
 while(n<(+T.minggu||42)&&g<75){g++;const days=[0,1,2,3,4].map(i=>iso(addD(d,i)));const c=days.map(x=>inR(x,T.cuti)).filter(Boolean);
  if(c.length>=3)out.push({no:null,mula:iso(d),jenis:'cuti',label:c[0].nama||'Cuti'});
  else{n++;const u=days.map(x=>inR(x,T.ujian)).filter(Boolean);out.push({no:n,mula:iso(d),jenis:u.length>=3?'ujian':'sekolah',label:u.length>=3?(u[0].nama||'Peperiksaan'):''})}d=addD(d,7)}return out}
function mingguIni(){const W=minggu(),t=today();const w=W.find(x=>t>=x.mula&&t<=iso(addD(pd(x.mula),6)));if(w&&w.no)return w;return W.find(x=>x.no&&x.mula>=t)||W.filter(x=>x.no).pop()}
const mingguNo=no=>minggu().find(x=>x.no===no);
const inCuti=ds=>(S.takwim.cuti||[]).find(c=>c.mula&&c.tamat&&ds>=c.mula&&ds<=c.tamat);

/* ---------- DSKP ---------- */
const dskpOf=(s,t)=>S.dskp.find(d=>subj(d.subjek)===subj(s)&&String(d.ting)===String(t));
function spList(s,t){const d=dskpOf(s,t);if(!d)return[];const o=[];d.tajuk.forEach(T=>T.sk.forEach(K=>K.sp.forEach(P=>o.push({key:d.id+'|'+P.kod,kod:P.kod,teks:P.teks,skKod:K.kod,skTeks:K.teks,tajuk:T.teks}))));return o}
const subjekList=()=>[...new Set(S.dskp.map(d=>norm(d.subjek)))];
const dlSubjek=()=>`<datalist id="dlS">${[...new Set([...subjekList(),...SUBJEK,...(BIDX?BIDX.dskp.map(d=>d.subjek):[])])].map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`;
function parseDSKP(txt){const tajuk=[];let T=null,K=null,last=null;const ensure=()=>{if(!T){T={teks:'Tajuk Umum',sk:[]};tajuk.push(T)}};
 const rSP=/^(\d{1,2})\.(\d{1,2})\.(\d{1,2})\.?\s+(.+)$/,rSK=/^(\d{1,2})\.(\d{1,2})\.?\s+(.+)$/,rTK=/^(tajuk|tema|bidang|unit|bab|topik|modul)\b/i,rT2=/^(\d{1,2})(\.0)?\.?\s+(.+)$/;
 for(let l of txt.replace(/\r/g,'').split('\n')){l=l.replace(/\t/g,' ').replace(/\s+/g,' ').trim();if(!l)continue;let m;
  if(m=l.match(rSP)){ensure();const kk=m[1]+'.'+m[2];if(!K||K.kod!==kk){K={kod:kk,teks:'',sp:[]};T.sk.push(K)}K.sp.push(last={kod:`${kk}.${m[3]}`,teks:cap(m[4])});continue}
  m=l.match(rSK);if(m&&m[2]!=='0'){ensure();K={kod:m[1]+'.'+m[2],teks:cap(m[3]),sp:[]};T.sk.push(K);last=K;continue}
  if(rTK.test(l)||rT2.test(l)){T={teks:l,sk:[]};tajuk.push(T);K=null;last=T;continue}
  if(last)last.teks=(last.teks+' '+l).trim()}

 cv.onpointerdown=e=>{dr=true;cv._drawn=true;const[x,y]=p(e);ctx.beginPath();ctx.moveTo(x,y)};cv.onpointermove=e=>{if(!dr)return;const[x,y]=p(e);ctx.lineTo(x,y);ctx.stroke()};cv.onpointerup=cv.onpointerleave=()=>dr=false}

function hariNo(h){const n=parseInt(h);if(n>=1&&n<=7)return n;const s=String(h||'').toLowerCase();const i=HARI.findIndex(x=>x&&s.startsWith(x.toLowerCase().slice(0,3)));return i>0?i:0}
function hhmm(t){const m=String(t||'').toLowerCase().match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm|pagi|ptg|petang|tgh|pg)?/);if(!m)return'';let h=+m[1];const ap=m[3]||'';if(/pm|ptg|petang|tgh/.test(ap)&&h<12)h+=12;if(/am|pagi|pg/.test(ap)&&h===12)h=0;return h>23?'':pad(h)+':'+m[2]}
const senaraiSubjek=()=>[...new Set([...subjekList(),...SUBJEK])].join(', ');
const BANTU={
 takwim:{soal:'Perlukan bantuan mengisi takwim?',ket:'AI cari takwim KPM ikut negeri, atau baca gambar takwim sekolah awk.',lampir:'gambar / PDF takwim sekolah (pilihan)',cari:true,auto:()=>!S.takwim.mula,
  input:()=>`<div class="grid2"><div><label>Sesi / tahun</label><input id="bTh" type="number" inputmode="numeric" value="${S.takwim.mula?pd(S.takwim.mula).getFullYear():new Date().getFullYear()}"></div><div><label>Negeri</label><select id="bNg">${NEGERI.map(n=>`<option ${n===(S.profil.negeri||'Pulau Pinang')?'selected':''}>${n}</option>`).join('')}</select></div></div>`,
  pre:()=>{S.profil.negeri=$('#bNg').value;save()},
  prompt:()=>{const th=$('#bTh').value,ng=$('#bNg').value;return `Saya guru sekolah menengah di negeri ${ng}, Malaysia. Sediakan takwim persekolahan bagi sesi ${th} untuk negeri ini (ikut Kumpulan A / B yang betul bagi negeri ${ng}).

Sumber (ikut keutamaan):
1. Gambar / PDF takwim sekolah yang saya lampirkan (jika ada)
2. Takwim persekolahan rasmi KPM sesi ${th} — guna carian web untuk tarikh terkini
JANGAN reka tarikh. Jika tidak pasti, tulis dalam "catatan".

Senaraikan:
- "mula": hari pertama persekolahan sesi ${th} (YYYY-MM-DD)
- "tamat": hari terakhir persekolahan sesi ${th} (YYYY-MM-DD)
- "cuti": SEMUA cuti penggal, cuti pertengahan penggal, cuti tambahan perayaan KPM, cuti umum kebangsaan & cuti umum negeri ${ng} yang jatuh pada hari persekolahan, serta cuti peristiwa sekolah (jika ada dalam lampiran)
- "ujian": tarikh peperiksaan / pentaksiran (cth: UASA, peperiksaan pertengahan tahun) jika diketahui
Setiap item: {"nama":"...","mula":"YYYY-MM-DD","tamat":"YYYY-MM-DD"} (cuti 1 hari: mula = tamat)

Balas dalam JSON SAHAJA, tanpa teks lain:
{"mula":"","tamat":"","cuti":[],"ujian":[],"catatan":""}`},
  apply:o=>{if(!isoOK(o.mula))throw new Error('Tarikh mula sesi tidak dijumpai dalam jawapan AI');
   const fx=a=>(a||[]).filter(x=>x&&isoOK(x.mula)).map(x=>({nama:String(x.nama||'Cuti'),mula:x.mula,tamat:isoOK(x.tamat)?x.tamat:x.mula}));
   if(S.takwim.mula&&!confirm('Ganti takwim sedia ada dengan takwim baharu?'))return'';
   S.takwim={mula:o.mula,minggu:60,cuti:fx(o.cuti),ujian:fx(o.ujian)};
   S.takwim.minggu=isoOK(o.tamat)?(minggu().filter(w=>w.no&&w.mula<=o.tamat).length||42):42;save();
   return `Takwim diisi: ${S.takwim.minggu} minggu sekolah, ${S.takwim.cuti.length} cuti, ${S.takwim.ujian.length} peperiksaan. Sila semak tarikh di bawah.${o.catatan?'<br>📝 '+esc(o.catatan):''}`}},
 kelas:{soal:'Perlukan bantuan mengisi senarai murid?',ket:'Ambil gambar / PDF senarai nama (APDM, buku rekod) — AI susun ikut kelas.',lampir:'gambar / PDF senarai murid',perluFail:true,auto:()=>!S.kelas.length,
  prompt:()=>`Saya lampirkan senarai nama murid (gambar / PDF / Excel / teks). Tukarkan kepada JSON.
Peraturan:
- Salin nama penuh dengan ejaan tepat, HURUF BESAR
- Buang nombor bil, no. kad pengenalan, jantina dan maklumat lain
- Kumpulkan ikut kelas. "ting" = tingkatan (nombor 1-6 sahaja)
- Nama kelas seperti tertera (cth: "1 KHALID")${S.kelas.length?`
- Kelas sedia ada (guna nama yang sama jika sepadan): ${S.kelas.map(k=>k.nama).join(', ')}`:''}

Balas dalam JSON SAHAJA, tanpa teks lain:
{"kelas":[{"nama":"1 KHALID","ting":1,"murid":["NAMA PENUH MURID"]}]}`,
  apply:o=>{const L=(o.kelas||[]).filter(k=>k&&k.nama);if(!L.length)throw new Error('Tiada kelas dijumpai dalam jawapan AI');let b=0,u=0,m=0;
   L.forEach(x=>{const nm=norm(x.nama),mu=(x.murid||[]).map(norm).filter(Boolean),old=S.kelas.find(c=>norm(c.nama)===nm);
    put('kelas',Object.assign({},old||{id:'k-'+uid()},{nama:nm,ting:String(parseInt(x.ting)||parseInt(nm)||(old&&old.ting)||1),murid:mu.length?mu:(old?old.murid:[])}));old?u++:b++;m+=mu.length});
   return `${b} kelas baharu, ${u} kelas dikemas kini • ${m} murid. Tekan nama kelas untuk semak.`}},
 jadual:{soal:'Perlukan bantuan mengisi jadual waktu?',ket:'Ambil gambar jadual waktu peribadi — AI tukar jadi slot mengajar.',lampir:'gambar / PDF jadual waktu',perluFail:true,auto:()=>!S.jadual.length,
  prompt:()=>`Saya lampirkan jadual waktu mengajar saya (gambar / PDF). Senaraikan SETIAP slot mengajar saya.
Peraturan:
- "hari": 1=Isnin, 2=Selasa, 3=Rabu, 4=Khamis, 5=Jumaat, 6=Sabtu, 7=Ahad
- "mula" & "tamat": format 24 jam HH:MM (cth: 13:30). Gabungkan waktu berturutan bagi kelas & subjek yang sama menjadi satu slot
- "subjek": nama penuh HURUF BESAR. Tukar singkatan, cth: PJ → PENDIDIKAN JASMANI, PK → PENDIDIKAN KESIHATAN, BM → BAHASA MELAYU, BI → BAHASA INGGERIS, SN/SC → SAINS, MT → MATEMATIK, PI → PENDIDIKAN ISLAM, SEJ → SEJARAH, GEO → GEOGRAFI, BA → BAHASA ARAB
- Guna nama subjek daripada senarai ini jika sepadan: ${senaraiSubjek()}
- "kelas": nama kelas (cth: "1 KHALID"), "ting": tingkatan (nombor)
- Abaikan rehat, perhimpunan dan slot kosong${S.kelas.length?`
- Kelas sedia ada (guna nama yang sama jika sepadan): ${S.kelas.map(k=>k.nama).join(', ')}`:''}

Balas dalam JSON SAHAJA, tanpa teks lain:
{"slot":[{"hari":1,"mula":"07:30","tamat":"08:30","subjek":"SAINS","kelas":"1 KHALID","ting":1}]}`,
  apply:o=>{const L=(o.slot||[]).filter(x=>x&&x.subjek&&x.kelas);if(!L.length)throw new Error('Tiada slot dijumpai dalam jawapan AI');
   if(S.jadual.length&&confirm(`Padam ${S.jadual.length} slot sedia ada dan ganti dengan jadual baharu?\n(Batal = tambah sahaja)`))S.jadual.slice().forEach(j=>del('jadual',j.id));
   let n=0,kb=0,sk=0;L.forEach(x=>{const nm=norm(x.kelas);let k=S.kelas.find(c=>norm(c.nama)===nm);
    const h=hariNo(x.hari),m=hhmm(x.mula),t=hhmm(x.tamat);if(!h||!m||!t||mins(m,t)<=0){sk++;return}
    if(!k){k={id:'k-'+uid(),nama:nm,ting:String(parseInt(x.ting)||parseInt(nm)||1),murid:[]};put('kelas',k);kb++}
    if(S.jadual.some(j=>j.hari===h&&j.mula===m&&j.kelasId===k.id)){sk++;return}
    put('jadual',{id:'j-'+uid(),hari:h,mula:m,tamat:t,subjek:subj(x.subjek),kelasId:k.id});n++});
   setTimeout(autoBank,300);return `${n} slot ditambah${kb?` • ${kb} kelas baharu dicipta — isi nama murid di <a href="#" onclick="go('kelas');return false">Kelas & Murid</a>`:''}${sk?` • ${sk} dilangkau (berulang / masa tidak sah)`:''}. Sila semak.`}},
 dskp:{soal:'Tiada teks DSKP? Biar AI sediakan.',ket:'Pilih subjek & tingkatan di bawah dahulu. Lampirkan PDF DSKP rasmi untuk ketepatan.',pautan:{url:BPK_URL,label:'🌐 Belum ada PDF? Muat turun di Laman BPK'},lampir:'PDF DSKP (disyorkan)',cari:true,teks:true,noRender:true,auto:()=>true,
  prompt:()=>{const sub=norm($('#iS').value),ting=$('#iT').value;if(!sub)throw new Error('Isi nama subjek di bawah dahulu');return `Saya perlukan senarai Standard Kandungan dan Standard Pembelajaran DSKP KSSM (Malaysia) bagi subjek ${sub} Tingkatan ${ting}.
Sumber (ikut keutamaan): 1) fail DSKP yang saya lampirkan, 2) DSKP rasmi KPM (guna carian web).
JANGAN reka atau ringkaskan — salin ayat asal DSKP. Sertakan SEMUA tajuk / tema / bidang untuk Tingkatan ${ting}.
Jika DSKP ini gabungan beberapa subjek (cth: Pendidikan Jasmani dan Pendidikan Kesihatan), ambil bahagian ${sub} SAHAJA.
Abaikan Standard Prestasi, Tahap Penguasaan dan catatan.

Format jawapan (satu item setiap baris, tiada ulasan lain):
1.0 <Tajuk / Tema / Bidang>
1.1 <Standard Kandungan>
1.1.1 <Standard Pembelajaran>
1.1.2 <Standard Pembelajaran>
2.0 <Tajuk seterusnya>
...`},
  apply:t=>{t=String(t).replace(/```[a-z]*|```/gi,'').trim();if(!parseDSKP(t).length)throw new Error('Format tidak dikenali — pastikan baris bermula 1.1 / 1.1.1');$('#iX').value=t;pratonton();return 'Teks DSKP diisi ✔ Semak pratonton di bawah, kemudian Simpan.'}}
};
function bantuHTML(k){const B=BANTU[k],open=BOPEN[k]??B.auto();
 return `<div class="card bantu" id="bt-${k}">${BMSG[k]?`<div class="msg">✅ ${BMSG[k]}</div>`:''}
 <div class="row"><div>💡 <b>${B.soal}</b><div class="mu">${B.ket}</div></div>${open?'':`<button class="btn a s" style="flex:none" onclick="BOPEN.${k}=1;rBantu('${k}')">Ya, bantu</button>`}</div>
 ${open?`${B.input?B.input():''}${B.pautan?`<a class="btn o w" style="margin-top:10px" href="${B.pautan.url}" target="_blank" rel="noopener">${B.pautan.label}</a>`:''}
 <div class="lk"><b>1.</b> Tekan <b>Salin Prompt</b><br><b>2.</b> Buka ChatGPT / Gemini → tampal${B.lampir?` → lampirkan <b>${B.lampir}</b>`:''} → hantar<br><b>3.</b> Salin jawapan AI → tampal di bawah → <b>Isi Automatik</b></div>
 <button class="btn a w" onclick="bantuSalin('${k}')">📋 Salin Prompt</button>
 <label>Tampal jawapan AI di sini</label><textarea id="bx-${k}" style="min-height:80px" placeholder="${B.teks?'1.0 Tajuk…':'{ … }'}"></textarea>
 <button class="btn g w" style="margin-top:8px" onclick="bantuIsi('${k}')">✨ Isi Automatik</button>
 ${S.ai.key?`<div class="mu" style="margin:14px 0 6px;text-align:center">— atau terus dalam app (tanpa salin-tampal) —</div>${B.lampir?`<input type="file" id="bf-${k}" accept="image/*,application/pdf" multiple>`:''}<button class="btn w" style="margin-top:8px" onclick="bantuAI('${k}',this)">🤖 Isi Terus dengan AI</button>`
 :`<div class="mu" style="margin-top:10px">Mahu terus tanpa salin-tampal? <a href="#" onclick="go('ai');return false">Set AI dalam app</a> (percuma).</div>`}
 <button class="btn o s w" style="margin-top:10px" onclick="BOPEN.${k}=0;rBantu('${k}')">Tutup bantuan</button>`:''}</div>`}
function rBantu(k){const el=$('#bt-'+k);if(el)el.outerHTML=bantuHTML(k)}
function bantuSalin(k){const B=BANTU[k];try{if(B.pre)B.pre();copy(B.prompt())}catch(e){toast(e.message)}}
function bantuGuna(k,raw){const B=BANTU[k];const msg=B.apply(B.teks?raw:pJSON(raw));if(msg==='')return;BMSG[k]=msg;toast('Siap diisi ✔');if(B.noRender)rBantu(k);else render()}
function bantuIsi(k){const v=$('#bx-'+k).value.trim();if(!v)return toast('Tampal jawapan AI dahulu');try{bantuGuna(k,v)}catch(e){toast(e.message)}}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok({mime:f.type||'application/pdf',data:String(r.result).split(',')[1]});r.onerror=no;r.readAsDataURL(f)});
async function bantuAI(k,b){const B=BANTU[k],inp=$('#bf-'+k),fs=inp?[...inp.files]:[];if(B.perluFail&&!fs.length)return toast('Pilih gambar / PDF dahulu');
 if(fs.reduce((a,f)=>a+f.size,0)>15e6)return toast('Fail terlalu besar (maks 15MB). Guna Salin Prompt.');
 let pr;try{if(B.pre)B.pre();pr=B.prompt()}catch(e){return toast(e.message)}
 b.disabled=true;b.textContent='⏳ AI sedang membaca…';
 try{const files=await Promise.all(fs.map(b64));const out=await gemini(pr,!B.teks,!!B.cari,files);bantuGuna(k,out)}
 catch(e){toast('AI gagal: '+e.message+' — cuba Salin Prompt');b.disabled=false;b.textContent='🤖 Isi Terus dengan AI'}}

/* ---------- Bank DSKP (aset app: dskp-bank/) ---------- */
const BANK='dskp-bank/';let BIDX=null;
async function bankIndex(){if(BIDX)return BIDX;try{const r=await fetch(BANK+'index.json',{cache:'no-cache'});if(!r.ok)throw 0;BIDX=await r.json();BIDX.dskp=BIDX.dskp||[]}catch(e){BIDX=null}return BIDX}
const bankAda=(I,s,t)=>I&&I.dskp.find(d=>subj(d.subjek)===subj(s)&&String(d.ting)===String(t));
async function muatBank(items,senyap){let n=0;for(const it of items){try{const d=await(await fetch(BANK+it.file)).json();put('dskp',Object.assign(d,{id:slug(d.subjek)+'-T'+d.ting,subjek:norm(d.subjek),ting:String(d.ting),sumber:'bank',versi:BIDX.versi||''}));n++}catch(e){}}
 if(n&&!senyap)toast(`${n} DSKP dimuat dari Bank ✔`);return n}
// auto: subjek dalam jadual yang tiada DSKP / hanya contoh → muat dari bank
async function autoBank(){const I=await bankIndex();if(!I||!I.dskp.length)return;const perlu=combos().filter(c=>{const d=dskpOf(c.subjek,c.ting);return(!d||d.sumber==='contoh')}).map(c=>bankAda(I,c.subjek,c.ting)).filter(Boolean);
 if(!perlu.length)return;const n=await muatBank(perlu,true);if(n){toast(`📚 ${n} DSKP dimuat automatik ikut jadual waktu`);if(['dskp','utama','rpt'].includes(V))render()}}
async function bankBox(){const el=$('#bankBox');if(!el)return;const I=await bankIndex();if(!$('#bankBox'))return;
 if(!I||!I.dskp.length){el.innerHTML='';return}
 const sub=[...new Set(I.dskp.map(d=>norm(d.subjek)))].sort(),q=(VP.bq||'');
 const L=I.dskp.filter(d=>!q||norm(d.subjek).includes(norm(q))).sort((a,b)=>(norm(a.subjek)+a.ting).localeCompare(norm(b.subjek)+b.ting));
 el.innerHTML=`<div class="card"><div class="row"><div><b>📚 Bank DSKP</b><div class="mu">${I.dskp.length} DSKP • ${sub.length} subjek • kemas kini ${esc(I.versi||'')}</div></div></div>
 <div class="mu" style="margin-top:6px">DSKP untuk subjek dalam jadual waktu awk dimuat <b>automatik</b>. Subjek lain boleh dimuat di bawah.</div>
 <input style="margin-top:10px" placeholder="🔎 Cari subjek…" value="${esc(q)}" oninput="VP.bq=this.value;clearTimeout(window._bq);window._bq=setTimeout(()=>{bankBox();},300)">
 <div class="list" style="max-height:260px;overflow:auto;margin-top:6px">${L.map(d=>{const ada=dskpOf(d.subjek,d.ting),bk=ada&&ada.sumber==='bank'&&ada.versi===(I.versi||'');return `<div class="it" style="cursor:default"><div>${esc(norm(d.subjek))} T${d.ting}<div class="mu">${d.sp||''} SP</div></div>${bk?'<span class="pill ok">Dimuat</span>':`<button class="btn s" style="flex:none" onclick="muatBank([bankAda(BIDX,'${esc(d.subjek)}','${d.ting}')]).then(render)">${ada?'Kemas kini':'Muat'}</button>`}</div>`}).join('')||'<div class="mu">Tiada padanan.</div>'}</div></div>`;
 const i=el.querySelector('input');if(q&&i){i.focus();i.setSelectionRange(q.length,q.length)}}
